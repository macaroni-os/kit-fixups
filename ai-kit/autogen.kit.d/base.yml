ai_github:
  generator: builtin-github
  defaults:
    category: app-ai
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases

  extensions_defs:
    golang:
      opts:

  packages:

    - docker-model:
        github:
          user: docker
          repo: model-runner
        extensions:
          - golang
        transform:
          - kind: string
            match: 'Docker Model Runner v'
            replace: ''
        vars:
          inherit:
            - go-module
          bdepend: |
            virtual/pkgconfig
            compress? ( app-arch/upx-bin )
          iuse: compress +runner
          body: |
            src_compile() {
              # Compile model-cli
              pushd cmd/cli >/dev/null
              local cli_ldflags=(
                "-X \"github.com/{{ .Values.github_user }}/{{ .Values.github_repo }}/cmd/cli/desktop.Version={{ .Values.version }}\""
              )
              local runner_ldflags=(
                "-X \"main.Version={{ .Values.version }}\""
              )
              go build \
                -ldflags "${cli_ldflags[*]}" \
                -o ../../{{ .Values.pn }} -v -x || die
              popd >/dev/null
              if use compress ; then
                upx --brute -1 {{ .Values.pn }} || die
              fi

              if use runner ; then
                go build \
                  -ldflags "${runner_ldflags[*]}" \
                  -o model-runner
              fi
            }
            src_install() {
              exeinto /usr/libexec/docker/cli-plugins
              doexe {{ .Values.pn }}
              dodoc README.md
              if use runner ; then
                dobin model-runner
              fi
            }

    - docker-agent:
        github:
          user: docker
        extensions:
          - golang
        vars:
          inherit:
            - go-module
          bdepend: |
            virtual/pkgconfig
            compress? ( app-arch/upx-bin )
          iuse: +compress
          body: |
            src_compile() {
              custom_ldflags=(
                "-X \"github.com/{{ .Values.github_user }}/{{ .Values.github_repo }}/pkg/version.Version={{ .Values.version }}\""
                "-X \"github.com/{{ .Values.github_user }}/{{ .Values.github_repo }}/pkg/version.Commit={{ .Values.sha }}\""
              )
              go build \
                -ldflags "${custom_ldflags[*]}" \
                -o {{ .Values.pn }} -v -x || die
              if use compress ; then
                upx --brute -1 {{ .Values.pn }} || die
              fi
            }
            src_install() {
              exeinto /usr/libexec/docker/cli-plugins
              doexe {{ .Values.pn }}
              dodoc README.md
            }

    - ollama:
        # TODO:
        # - improve integration with ROCm
        extensions:
          - golang
        vars:
          inherit:
            - go-module
            - cmake
            - user
          # The single source of truth for the NVIDIA compute capabilities
          # this kit can target, one sm_* per line. The iuse, required_use,
          # and the src_configure architecture loop are all rendered from
          # this list, so a new generation is added here and nowhere else.
          #
          # The gfxcard-nvidia-<gen> ego mix-ins (core-kit) enable a
          # generation's flags:
          #   maxwell    sm_50 sm_52
          #   pascal     sm_60 sm_61
          #   volta      sm_70
          #   turing     sm_75
          #   ampere     sm_80 sm_86 sm_87
          #   ada        sm_89
          #   hopper     sm_90 sm_90a
          #   blackwell  sm_100 sm_101 sm_103 sm_110 sm_120 sm_121
          #
          # sm_101 (Jetson Thor) is renumbered to sm_110 by the 13.x
          # toolkit, so it is declared alongside it.
          gpus:
            #   maxwell
            - sm_50
            - sm_52
            #   pascal
            - sm_60
            - sm_61
            #   volta
            - sm_70
            #   turing
            - sm_75
            #   ampere
            - sm_80
            - sm_86
            - sm_87
            #   ada
            - sm_89
            #   hopper
            - sm_90
            - sm_90a
            #   blackwell
            - sm_100
            - sm_101
            - sm_103
            - sm_110
            - sm_120
            - sm_121

          iuse: |-
            systemd clang cuda nccl vulkan
            {{- range $g := .Values.gpus }} cuda_{{ $g }}{{ end }}
          required_use: |-
            nccl? ( cuda )
            {{- range $g := .Values.gpus }} cuda_{{ $g }}? ( cuda ){{ end }}
          bdepend: |
            >=dev-lang/go-1.24
            clang? ( sys-devel/clang )
          rdepend: |
            vulkan? (
              media-libs/vulkan-loader
              media-libs/shaderc
            )
            cuda? (
              dev-util/nvidia-cuda-toolkit
            )
            nccl? (
              dev-util/nvidia-nccl
            )
          depend: '${RDEPEND}'
          # It seems that trying to set this flags
          # breaks cmake. An upstream bug?
          #  -DGGML_CUDA=$(usex cuda ON OFF)
          #  -DGGML_VULKAN=$(usex vulkan ON OFF)
          body: |
            pkg_setup() {
              ebegin "Ensuring ollama user/group exist"
              enewgroup ollama
              enewuser ollama -1 -1 /var/lib/ollama ollama
            }
            src_configure() {
              addpredict /proc/self/task
              local mycmakeargs=()
              if use clang ; then
                mycmakeargs+=(
                  -DCMAKE_C_COMPILER=clang
                  -DCMAKE_CXX_COMPILER=clang++
                )
              fi
              if use cuda ; then
                # Upstream builds GPU backend payloads only when asked to
                # (OLLAMA_LLAMA_BACKENDS, empty by default), and each payload
                # targets one CUDA major. nvidia-cuda-toolkit allows only one
                # CUDA major at a time, so detect the installed one and build
                # only the matching backend.
                local cuda_major=
                cuda_major=$(
                  nvcc --version 2>/dev/null |
                  sed -n 's/.*release \([0-9][0-9]*\).*/\1/p'
                )
                case ${cuda_major:-12} in
                  13)
                    mycmakeargs+=(
                      -DOLLAMA_LLAMA_BACKENDS=cuda_v13
                    )
                    ;;
                  *)
                    [[ -z ${cuda_major} ]] && \
                      ewarn "Could not detect the CUDA toolkit major version (nvcc not found); defaulting to the CUDA 12 backend"
                    mycmakeargs+=(
                      -DOLLAMA_LLAMA_BACKENDS=cuda_v12
                    )
                    ;;
                esac
                # The architecture list comes from the enabled cuda_sm_*
                # flags, filtered against the set the installed toolkit
                # major can target. CUDA only drops architectures at major
                # boundaries, so the per-major sets are:
                #   11: 50 52 60 61 70 75 80 86 87 89 90
                #   12: 50 52 60 61 70 75 80 86 87 89 90 90a 100 103
                #        120 121
                #   13: 75 80 86 87 89 90 90a 100 103 110 120 121
                # sm_101 (Jetson Thor) is not a general nvcc target in
                # 11.x/12.x and is renumbered to sm_110 in 13.x, so it
                # only builds with the 13 major.
                local cuda_supported
                case ${cuda_major:-12} in
                  13)
                    cuda_supported="75 80 86 87 89 90 90a 100 103 110 120 121"
                    ;;
                  11)
                    cuda_supported="50 52 60 61 70 75 80 86 87 89 90"
                    ;;
                  *)
                    cuda_supported="50 52 60 61 70 75 80 86 87 89 90 90a 100 103 120 121"
                    ;;
                esac
                local arch cuda_archs=() cuda_dropped=()
                for arch in {{ range $i, $g := .Values.gpus }}{{ trimPrefix "sm_" $g }} {{ end }}; do
                  use cuda_sm_${arch} || continue
                  if has "${arch}" ${cuda_supported} ; then
                    cuda_archs+=("${arch}")
                  else
                    cuda_dropped+=("${arch}")
                  fi
                done
                if [[ ${#cuda_archs[@]} -gt 0 || ${#cuda_dropped[@]} -gt 0 ]] ; then
                  if [[ ${#cuda_dropped[@]} -gt 0 ]] ; then
                    ewarn "Dropping CUDA architectures unsupported by the installed toolkit (major ${cuda_major:-unknown}): $(join ' ' "${cuda_dropped[@]}")"
                  fi
                  if [[ ${#cuda_archs[@]} -eq 0 ]] ; then
                    die "all enabled cuda_sm_* flags are unsupported by the installed CUDA toolkit; enable flags matching your card, or override with MYCMAKEARGS=\"-DCMAKE_CUDA_ARCHITECTURES=...\""
                  fi
                  mycmakeargs+=(
                    -DCMAKE_CUDA_ARCHITECTURES="$(join ';' "${cuda_archs[@]}")"
                  )
                fi
                mycmakeargs+=(
                  -DGGML_CUDA_NCCL=$(usex nccl ON OFF)
                )
              fi
              cmake_src_configure
            }
            src_prepare() {
              default
              go-module_src_prepare
              cmake_src_prepare
            }
            src_compile() {
              cmake_src_compile
              local ollama_ldflags=(
                 "-X github.com/ollama/ollama/version.Version=${PV}"
              )
              go build --ldflags "${ollama_ldflags[*]}" -mod=mod . || die "compile failed"
            }
            src_install() {
              cmake_src_install
              dobin {{ .Values.pn }}
              diropts -m0750 -o ollama -g ollama
              dodir /var/lib/ollama /var/lib/ollama/models/
              keepdir /var/lib/ollama/
              diropts
              dodoc README.md
              newconfd "${FILESDIR}"/ollama.confd ollama
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/ollama.service
              else
                newinitd "${FILESDIR}"/ollama.initd ollama
              fi
              newenvd "${FILESDIR}"/ollama.envd "90ollama"
            }

    - opencode:
        github:
          user: anomalyco
          repo: opencode
          # Version detection from the git tags (per the request in
          # mark-issues#840): the v-prefix is stripped by builtin-github.
          # The tags are the upstream source-of-truth release line; note the
          # tag listing currently leads with the 2.x line plus a vscode-*
          # series (skipped by the generator's version parsing).
          query: tags
        # Source build following upstream's own non-binary recipe
        # (nix/opencode.nix + nix/node_modules.nix in the repo). Repo facts
        # verified against the tag tarballs v1.19.4 and v2.1.4:
        #   * TypeScript/Bun workspaces monorepo; packageManager: bun@1.4.4.
        #   * The CLI binary is produced by script/build.ts of the CLI
        #     workspace (packages/opencode at v1.x, renamed to packages/cli
        #     at v2.x) via Bun.build({ compile: { target:
        #     "bun-linux-x64|arm64" } }): bun bundles the app and embeds its
        #     runtime, so dev-lang/go is NOT involved (the old Go TUI is
        #     gone; no go.mod exists in either tag, the TUI is TypeScript
        #     via @opentui/core, and dev-lang/go is deliberately absent).
        #   * dev-lang/bun IS needed for the build (BDEPEND below, the
        #     any-of group also accepts the binary flavour dev-lang/bun-bin
        #     that landed in lang-kit meanwhile); the build additionally
        #     needs npm-registry access for "bun install --frozen-lockfile"
        #     (node_modules is not vendored in the tarball; upstream nix
        #     isolates that into a separate hashed fixed-output derivation,
        #     and build.ts even re-fetches cross-libc native packages when
        #     not skipped). See PR #480 for the evidence; this definition
        #     is the honest best-effort source spec requested upstream-side.
        vars:
          desc: The open source AI coding agent (built from sources)
          # The bun-compiled output embeds a runtime in the ELF; stripping it
          # post-build is exactly what the pnpm-bin/ollama binaries avoid.
          # "bun install" fetches from registry.npmjs.org at build time (the
          # tag tarballs do not vendor node_modules), so opt out of the
          # network sandbox like net-libs/deno does.
          restrict: 'strip network-sandbox'
          bdepend: '|| ( dev-lang/bun dev-lang/bun-bin )'
          # /usr/bin/opencode is also shipped by the binary flavour of this
          # same autogen group; the pair mutually blocks (same idiom as the
          # RDEPEND="!cat/pkg" blocker lines used across the core-kit tree).
          rdepend: '!app-ai/opencode-bin'
          body: |
            src_prepare() {
              default
              # packages/script/src/index.ts hard-fails unless the running
              # bun satisfies ^1.4.4 (root package.json packageManager pin).
              # Downgrade the throw to a warning, exactly like the postPatch
              # of upstream's nix/opencode.nix derivation.
              sed -i \
                's/throw new Error(`This script requires bun/console.warn(`Warning: This script requires bun/' \
                packages/script/src/index.ts || die
            }

            src_configure() { :; }

            src_compile() {
              # Keep bun's download cache inside the build area.
              export BUN_INSTALL_CACHE_DIR="${T}/bun-cache"

              # Pin the embedded version/channel: without OPENCODE_VERSION
              # the shared build script queries registry.npmjs.org at build
              # time, and without OPENCODE_CHANNEL it shells out to git,
              # neither of which belongs in an ebuild sandbox (nix recipe
              # sets the same pair).
              export OPENCODE_VERSION="{{ .Values.pv }}"
              export OPENCODE_CHANNEL="prod"
              # The bundle is memory-hungry; same bump as nix/opencode.nix.
              export NODE_OPTIONS="--max-old-space-size=4096"

              # Install the JS dependency graph from the checked-in lockfile,
              # scoped like upstream's nix/node_modules.nix recipe (root
              # workspace for peer resolution + the CLI, the embedded web UI
              # and the desktop workspace). Scripts are skipped: they only
              # set up dev tooling. NOTE: this needs network access; see the
              # spec comment and PR #480 for the offline-build discussion.
              bun install \
                --filter './' \
                --filter './packages/cli' \
                --filter './packages/desktop' \
                --filter './packages/app' \
                --frozen-lockfile \
                --ignore-scripts \
                --no-progress || die "bun install failed (needs npm-registry access)"

              # --single: build only the native glibc target of this ARCH
              #   (v1 wrote dist/opencode-linux-<arch>/, v2 dist/cli-linux-
              #   <arch>/, so the install phase globs for the binary).
              # --skip-install: dependency graph prepared just above.
              local clipkg=packages/cli
              [[ -d ${clipkg} ]] || clipkg=packages/opencode
              cd "${clipkg}" || die
              bun --bun ./script/build.ts --single --skip-install || die
            }

            src_install() {
              # dist/<target>/bin/opencode, exactly one target with --single.
              local bin=$(find packages/cli/dist packages/opencode/dist \
                -type f -path '*/bin/opencode' -print -quit 2>/dev/null)
              [[ -n ${bin} ]] || die "compiled binary not found under packages/*/dist"
              newbin "${bin}" opencode
            }

    - opencode-bin:
        github:
          user: anomalyco
          repo: opencode
          # Upstream has thousands of tags (including the vscode-* line),
          # the tag listing never reaches the current releases in one page
          # fetch, so do not require tag presence (same as llama_cpp above).
          ignore_tags: true
        # simple.tmpl (as used by dev-util/pnpm-bin), not the group's
        # simple-github.tmpl: the latter emits a post_src_unpack() that
        # renames the source tarball unpack dir, but this atom downloads
        # only prebuilt release assets, so there is nothing to rename.
        template: ../../templates/simple.tmpl
        # Upstream (renamed from sst/opencode) publishes bun-compiled
        # standalone executables as release assets. The auto-generated
        # release tarball is source-only, so download the per-arch linux
        # asset instead (same scheme as dev-util/pnpm-bin). The tarballs
        # ship the single ./opencode executable and nothing else; the
        # -musl and -baseline variants are skipped: mark is glibc and
        # the baseline builds target pre-AVX2 CPUs only.
        # Note: the local asset names keep the "opencode-" distfile prefix
        # so distfiles stay identical to the previously verified ones.
        assets:
          - name: 'opencode-{{ .Values.version }}-amd64-linux.tar.gz'
            matcher: '^opencode-linux-x64\.tar\.gz$'
            use: amd64
          - name: 'opencode-{{ .Values.version }}-arm64-linux.tar.gz'
            matcher: '^opencode-linux-arm64\.tar\.gz$'
            use: arm64
        vars:
          iuse: amd64 arm64
          desc: The open source AI coding agent (upstream binary)
          restrict: strip
          # See the source-flavoured entry above: the two packages install
          # the same /usr/bin/opencode and must not coexist.
          rdepend: '!app-ai/opencode'
          # The asset tarballs carry the bare ./opencode executable at the
          # archive root (no top-level directory), so the default
          # src_unpack() extracts it straight into ${WORKDIR}; pointing S
          # there (same s: override idiom used across the dev-kit autogen
          # specs) lets src_install pick it up without any custom phase.
          s: '${WORKDIR}'
          extra_envs:
            - 'QA_PREBUILT="/usr/bin/opencode"'
          body: |
            src_install() {
              newbin opencode opencode
            }

    - claude-code-bin:
        github:
          user: anthropics
          # Equal to PN up to the -bin postfix; pinned explicitly per
          # the pi-bin idiom (macaroni-os/kit-fixups#512 review).
          repo: claude-code
        # simple.tmpl (not the group's simple-github.tmpl): this atom
        # downloads only prebuilt release assets, so there is no
        # <user>-<repo>-* unpack dir for the generated post_src_unpack()
        # to rename.
        template: ../../templates/simple.tmpl
        # Upstream (anthropics/claude-code) publishes self-contained
        # native builds of the Claude Code CLI (single-file executables
        # with the runtime embedded) as release assets, alongside the npm
        # package. The claude-linux-x64/arm64 assets are the glibc
        # builds; the *-musl variants are skipped (mark is glibc), as
        # are the darwin/windows assets and the SHASUMS signing files.
        # Release titles and tags are plain "v2.1.322" semver; the
        # leading v is stripped automatically, so no transform applies.
        # There is no source flavour: the GitHub repository is the
        # product's issue-tracker/docs/ecosystem face (full recursive
        # tree: 1983 entries dominated by mods/ customization modules
        # that run inside the installed CLI against its public API,
        # plus examples/, plugins/ and the changelog; no CLI
        # implementation anywhere), while the product itself ships
        # bundled. The -bin postfix marks the upstream-binary flavour
        # per the maintainer convention (macaroni-os/mark-issues#867
        # review; discord-bin is the tree precedent for a bin-only
        # package).
        assets:
          - name: 'claude-code-bin-{{ .Values.version }}-amd64-linux.tar.gz'
            matcher: '^claude-linux-x64\.tar\.gz$'
            use: amd64
          - name: 'claude-code-bin-{{ .Values.version }}-arm64-linux.tar.gz'
            matcher: '^claude-linux-arm64\.tar\.gz$'
            use: arm64
        vars:
          iuse: amd64 arm64
          # The repository's LICENSE.md is a one-line proprietary
          # notice ("(c) Anthropic PBC. All rights reserved. Use is
          # subject to Anthropic's Commercial Terms of Service").
          # GitHub's license detector does not classify it (its API
          # probe returns 404), and that probe is the lookup the
          # generator uses to auto-fill LICENSE=, so the identifier is
          # set explicitly per the macaroni-os/mark-issues#867 review.
          license: Anthropic PBC
          desc: Anthropic's Claude Code agentic coding CLI (upstream binary)
          restrict: strip
          # The asset carries the single ./claude executable at the
          # archive root (no top-level directory; name is identical on
          # both arches), so the default src_unpack drops it straight
          # into the workdir (opencode-bin idiom).
          s: '${WORKDIR}'
          extra_envs:
            - 'QA_PREBUILT="/usr/bin/claude"'
          body: |
            src_install() {
              newbin claude claude
            }

# app-ai/codex and app-ai/codex-bin track the same upstream repository
# (openai/codex), so per the macaroni-os/kit-fixups#512 review they live
# in a dedicated cluster whose defaults pin the shared github block; the
# entries keep only their flavour-specific template/assets/vars
# (macaroni-os/mark-issues#867).
codex:
  generator: builtin-github
  defaults:
    category: app-ai
    files_dir: "{{ .Values.pn }}"
    # simple-github.tmpl for the source flavour (its generated
    # post_src_unpack() renames the API-tarball root openai-codex-<sha7>
    # to S); the codex-bin entry overrides it with simple.tmpl.
    template: ../../templates/simple-github.tmpl
    github:
      user: openai
      # Equal to the source flavour's PN, but pinned explicitly because
      # the -bin postfix makes the sibling's PN differ from it (the
      # pi-cluster idiom from the PR #512 review).
      repo: codex
      # The release tags carry a rust- prefix ("rust-v0.167.0") while the
      # release titles are plain semver ("0.167.0"), and the repository
      # has thousands of tags, so builtin-github's tag-listing
      # cross-check never matches a release unless tag presence is
      # dropped (same situation and remedy as the opencode-bin entry of
      # the ai_github cluster; discriminating probe: with the flag
      # removed, generation ends in "No versions found"). With
      # ignore_tags the recorded sha is the release target_commitish;
      # neither flavour references it. The ~1270 alpha releases are
      # filtered natively as prereleases.
      ignore_tags: true
  packages:

    - codex-bin:
        # simple.tmpl, not the cluster's simple-github.tmpl: this atom
        # downloads only prebuilt release assets, so there is no
        # <user>-<repo>-* unpack dir for the generated post_src_unpack()
        # to rename (opencode-bin idiom).
        template: ../../templates/simple.tmpl
        # Upstream (openai/codex) builds the CLI in Rust and publishes
        # static-pie musl binaries as release assets; there are no glibc
        # linux assets, and static binaries run unchanged on the glibc
        # hosts (verified: 'codex --version' prints codex-cli 0.167.0 in
        # the mark-unstable sandbox). The bare per-target asset is the
        # artefact the official npm platform packages
        # (codex-npm-linux-x64/arm64) wrap, i.e. the standalone-supported
        # distribution shape; the codex-package-* assets additionally
        # bundle optional sidecars (bwrap, ripgrep, code-mode host,
        # voice stack) that the CLI runs without, so they are not needed
        # for the binary flavour. The .zst/.sigstore/.dmg/.exe/.whl
        # assets are for other platforms or verification and are skipped
        # (mark is linux-only).
        # The complete upstream package asset, not the bare codex binary:
        # the CLI runs a background app-server daemon and refuses to start
        # without an InstallContext package layout (codex-package.json +
        # bin/ + codex-resources/ + codex-path/), and its search check
        # needs the bundled ripgrep shipped in codex-path/rg
        # (macaroni-os/mark-issues#867 review). The tarball root has no
        # top-level directory, so S stays the workdir.
        assets:
          - name: 'codex-bin-{{ .Values.version }}-amd64-linux.tar.gz'
            matcher: '^codex-package-x86_64-unknown-linux-musl\.tar\.gz$'
            use: amd64
          - name: 'codex-bin-{{ .Values.version }}-arm64-linux.tar.gz'
            matcher: '^codex-package-aarch64-unknown-linux-musl\.tar\.gz$'
            use: arm64
        vars:
          iuse: amd64 arm64
          desc: OpenAI's Codex CLI coding agent (upstream binary)
          # Prebuilt, already-stripped static-pie ELFs; nothing compiles
          # here (same option the opencode-bin entry uses).
          restrict: strip
          # /usr/bin/codex is also shipped by the source flavour below;
          # the pair mutually blocks (the opencode/pi idiom).
          # RDEPEND on the distro packages per the review on this PR:
          # bubblewrap for the sandboxing backend and ripgrep for the
          # doctor search check (shipped as sys-apps/ripgrep-bin in
          # macaroni-os/kit-fixups#571). The package also carries its
          # own verified copies under codex-resources/.
          rdepend: |
            !app-ai/codex
            sys-apps/bubblewrap
            sys-apps/ripgrep-bin
          # The asset unpacks the single executable at the archive root
          # under its raw target-triple name (codex-x86_64-unknown-linux-
          # musl / codex-aarch64-unknown-linux-musl), so S is the workdir
          # and src_install globs the name, which differs per USE arch.
          s: '${WORKDIR}'
          extra_envs:
            - 'QA_PREBUILT="/usr/lib/codex/bin/* /usr/lib/codex/codex-resources/voice/bin/* /usr/lib/codex/codex-resources/voice/lib/*"'
          # Install shape per the macaroni-os/mark-issues#867 review:
          # the whole upstream package under /usr/lib/codex and
          # /usr/bin/codex as a symlink into it (install-context resolves
          # the package layout from the real executable path).
          body: |
            src_install() {
              local required
              for required in codex-package.json bin/codex bin/codex-code-mode-host ; do
                [[ -f ${required} ]] || die "upstream package is missing ${required}"
                if [[ ${required} != codex-package.json ]]; then
                  [[ -x ${required} ]] || die "upstream helper is not executable: ${required}"
                fi
              done

              dodir /usr/lib/codex
              cp -a codex-package.json bin codex-path codex-resources \
                "${ED}/usr/lib/codex/" || die "failed to install upstream package"
              # The bundled helpers are distro packages here: bwrap from
              # sys-apps/bubblewrap and rg from sys-apps/ripgrep-bin
              # (RDEPEND), per the review on this PR.
              rm -f "${ED}"/usr/lib/codex/codex-resources/bwrap \
                "${ED}"/usr/lib/codex/codex-path/rg || die "failed to drop bundled helpers"
              dosym ../lib/codex/bin/codex /usr/bin/codex
            }

    - codex:
        # Source flavour (macaroni-os/mark-issues#867): the CLI is pure
        # Rust from the codex-rs/ workspace; the npm package is only a
        # thin wrapper around the same binary, and the optional
        # code-mode host sidecar that embeds V8 is a different binary,
        # not built here.
        # No explicit source asset (the kit's source-flavour idiom):
        # builtin-github recovers the api.github.com tarball of the
        # release tag, whose unpack root is openai-codex-<sha7>; the
        # cluster template simple-github.tmpl renames it to S.
        # Build recipe verified in the mark-unstable sandbox
        # (rust-bin 1.96.1, 28 cores): cargo build --release -p codex-cli
        # --bin codex finished in 24m06s with zero errors (1060 crates),
        # producing a glibc ELF that dynamically links the system
        # libssl/libcrypto/libz (ldd-verified); 'codex --version' smoke
        # -> codex-cli 0.167.0.
        vars:

          python_compat: python3+
          iuse: voice
          inherit:
            - python-any-r1
            - toolchain-funcs
          desc: OpenAI's Codex CLI coding agent
          # Cargo resolves the whole workspace lock at build time, which
          # pins ~1296 crates.io packages plus 13 git dependencies
          # (forks of crossterm, tungstenite, sqlx, rmcp, h3, nucleo,
          # runfiles, mxc-sdk and rusty_v8), so network-sandbox is
          # stripped — the same accepted shape as the opencode and pi
          # source entries of this kit. The rust extension (offline
          # mark-rust-bundle path) was tested with full autogen and is
          # not usable today: mark-devkit's retrieveCargoLock scans only
          # the archive's first-level directories, while codex keeps its
          # workspace in codex-rs/ with no root Cargo.lock, so the
          # extension aborts with "Cargo.lock file not found". Even with
          # a nested-lock option, the bundle would clone the rusty_v8
          # fork with its multi-GB chromium submodule tree although
          # --bin codex never compiles v8 (the v8 puller,
          # codex-code-mode-runtime, belongs to the code-mode-host
          # sidecar). A lock-subdir option plus a git-dep-aware
          # crates_skipped in mark-devkit are the feature asks that
          # would let this move to the bundle path; flipping this entry
          # to extensions: [rust] + inherit: cargo is then a two-line
          # change.
          restrict: network-sandbox
          bdepend: |
            >=virtual/rust-1.96
            dev-libs/openssl
            virtual/pkgconfig
            sys-libs/zlib
            sys-apps/coreutils

          # These the libraries needed for voice:
          # libgstapp.so
          # libgstaudioconvert.so
          # libgstaudioresample.so
          # libgstcoreelements.so
          # libgstopus.so
          # libgstrtp.so
          # libgstrtpmanager.so
          rdepend: |
            !app-ai/codex-bin
            dev-libs/openssl
            sys-libs/zlib
            voice? (
              media-libs/gstreamer
              media-libs/gst-plugins-good
              media-libs/gst-plugins-bad[opus]
            )
            || (
              sys-apps/ripgrep-bin
              sys-apps/ripgrep
            )
            sys-apps/bubblewrap
          depend: '${RDEPEND}'
          patches:
            - codex-0.167.1-python39.patch
            - codex-0.167.1-system-ripgrep.patch
            - codex-0.167.1-system-voice.patch

            #src_compile() {
              # Keep the cargo registry and git checkouts in the build
              # area (they are fetched by src_compile, not src_unpack,
              # because the dependency graph is network-resolved).
            #  export CARGO_HOME="${T}/cargo-home"
            #  cd codex-rs || die
            #  cargo build --release -p codex-cli --bin codex \
            #    --target-dir target || die
            #}
          body: |
            src_compile() {
              # Keep the cargo registry and git checkouts in the build
              # area (they are fetched by src_compile, not src_unpack,
              # because the dependency graph is network-resolved).
              export CARGO_HOME="${T}/cargo-home"
              export CARGO_TARGET_DIR="${S}/codex-rs/target"
              export CODEX_REPO_ROOT="${S}"
              export TMPDIR="${T}"
              export STABLE_GIT_COMMIT="{{ .Values.sha }}"

              local rust_target
              rust_target=$(rustc -vV | sed -n 's/^host: //p') || die
              [[ -n ${rust_target} ]] || die "could not determine the native Rust target"
              case ${rust_target} in
                x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu) ;;
                *) die "native voice resources require x86_64 or aarch64 glibc Linux" ;;
              esac

              # Use the externally packaged sandbox; Codex embeds its exact digest.
              local bwrap
              bwrap=$(command -v bwrap) || die "bwrap (sys-apps/bubblewrap) must be installed."
              CODEX_BWRAP_SHA256=$(sha256sum "${bwrap}") || die
              export CODEX_BWRAP_SHA256=${CODEX_BWRAP_SHA256%% *}

              local rg_bin
              rg_bin=$(command -v rg) || die "ripgrep must be installed."

              cd "${S}" || die
              # Upstream builds codex, code-mode-host and exec-server, configures the
              # matching checksum-verified V8 artifacts, and writes the package manifest.
              ${EPYTHON} scripts/build_codex_package.py \
                --bwrap-bin "${bwrap}" \
                --rg-bin "${rg_bin}" \
                --target "${rust_target}" \
                --variant codex \
                --package-version "{{ .Values.pv }}" \
                --cargo-profile release \
                --strip all --strip-tool "$(tc-getSTRIP)" \
                --package-dir "${T}/codex-package" --force || die "assembling Codex package failed"

              if use voice ; then

                # Use the system GStreamer ABI and the seven explicitly loaded plugins.
                local gst_libdir plugin

                gst_libdir=$(pkg-config --variable=libdir gstreamer-1.0) || die
                export CODEX_SYSTEM_GSTREAMER_CORE="${gst_libdir}/libgstreamer-1.0.so.0"
                CODEX_SYSTEM_GSTREAMER_PLUGIN_DIR=$(pkg-config --variable=pluginsdir gstreamer-1.0) || die
                export CODEX_SYSTEM_GSTREAMER_PLUGIN_DIR
                [[ -f ${CODEX_SYSTEM_GSTREAMER_CORE} ]] || die "system GStreamer library is missing"
                [[ -n ${CODEX_SYSTEM_GSTREAMER_PLUGIN_DIR} ]] || die "system GStreamer plugin path is missing"
                for plugin in app audioconvert audioresample coreelements opus rtp rtpmanager; do
                  [[ -f ${CODEX_SYSTEM_GSTREAMER_PLUGIN_DIR}/libgst${plugin}.so ]] || die "missing GStreamer plugin: ${plugin}"
                done

                ${EPYTHON} "${FILESDIR}/build_codex_voice.py" \
                  --source "${S}" \
                  --package "${T}/codex-package" \
                  --output "${T}/codex-package-voice" \
                  --target "${rust_target}" \
                  --commit "${STABLE_GIT_COMMIT}" --version "{{ .Values.pv }}" \
                  --pkg-config "pkg-config" \
                  --strip "$(tc-getSTRIP)" \
                  || die "building and assembling voice resources failed"
              fi
            }
            src_install() {
              local package_dir="${T}"/codex-package
              for b in codex codex-code-mode-host codex-exec-server ; do
                dobin "${package_dir}"/bin/${b}
              done
              # Remove bwrap and ripgrep binary and the bin/*. We use the packages.
              rm -rf "${package_dir}"/codex-path "${package_dir}"/bin/
              dodir /usr/lib/codex/
              cp -a "${package_dir}/codex-package.json" "${package_dir}/codex-resources/" \
                "${ED}/usr/lib/codex/" || die
              if use voice ; then
                  cp -a "${T}"/codex-package-voice/codex-resources \
                  "${ED}/usr/lib/codex/" || die
              fi
              rm "${ED}"/usr/lib/codex/codex-resources/bwrap || true
              # Executables were stripped before the voice manifest was generated.
              # Preserve all bytes covered by its checksums and the embedded bwrap digest.
              dostrip -x /usr/lib/codex
              dodoc README.md
            }


# pi-bin and pi track the same upstream repository (earendil-works/pi),
# so per the macaroni-os/kit-fixups#512 review they live in a dedicated
# cluster whose defaults define the common keys once and the package
# entries keep only the flavour-specific vars/assets/body.
pi:
  generator: builtin-github
  defaults:
    category: app-ai
    files_dir: "{{ .Values.pn }}"
    # simple.tmpl for both flavours, not simple-github.tmpl: they download
    # uploaded release assets whose archives unpack into known directories
    # (the per-platform binaries into a versionless pi/ wrapper directory
    # that upstream build-binaries.sh adds "for mise compatibility", the
    # source snapshot into pi-<ver>/), so there is no <user>-<repo>-*
    # unpack dir for the generated post_src_unpack() to rename (and it
    # would match nothing).
    template: ../../templates/simple.tmpl
    github:
      user: earendil-works
      # The upstream repository is earendil-works/pi for both flavours:
      # equal to PN for pi, but pinned explicitly here because the -bin
      # postfix (PR #512 review) makes that one PN differ from it.
      repo: pi
    vars:
      # strip: the installed ELF is bun-compiled and embeds its own
      # runtime in both flavours (pi builds with the same bun --compile
      # recipe). network-sandbox: pi needs registry.npmjs.org because
      # npm ci installs the lockfile (the source archive is
      # dependency-free by design), like the opencode source entry in PR
      # #480; pi-bin restricts it out too, same option the backrest entry
      # in core-server-kit/autogen.kit.d/tools.yml uses, as asked in the
      # PR #512 review.
      restrict: 'strip network-sandbox'
      # QA_PREBUILT is identical in both flavours: /usr/lib/pi/pi is the
      # bun-compiled ELF and the native/ tree carries the TUI
      # linux-platform-*.node addons, checked-in prebuilds staged
      # verbatim, so both must survive the QA binary scan untouched.
      extra_envs:
        - 'QA_PREBUILT="/usr/lib/pi/pi /usr/lib/pi/native/*/*/*/*.node"'
  packages:

    - pi-bin:
        # Upstream ships bun-compiled standalone executables of its
        # "AI agent toolkit: unified LLM API, agent loop, TUI, coding
        # agent CLI" as per-platform release assets
        # (macaroni-os/mark-issues#853). The pi-*-source.tar.gz asset is
        # the source snapshot handled by the pi entry below and the
        # pi-coding-agent-install-package.* / SHA256SUMS assets are
        # installer helper files; none belong in the distfiles.
        # darwin/windows assets are skipped (mark is linux-only). Asset
        # names verified against v1.4.0; the release titles are plain
        # semver ("v1.4.0"), so the default version parsing applies and
        # no transform is needed.
        assets:
          - name: 'pi-{{ .Values.version }}-amd64-linux.tar.gz'
            matcher: '^pi-linux-x64\.tar\.gz$'
            use: amd64
          - name: 'pi-{{ .Values.version }}-arm64-linux.tar.gz'
            matcher: '^pi-linux-arm64\.tar\.gz$'
            use: arm64
        vars:
          iuse: amd64 arm64
          desc: 'AI agent toolkit: unified LLM API, agent loop, TUI, coding agent CLI (upstream binary)'
          # /usr/bin/pi is also shipped by the source-built flavour below;
          # the pair mutually blocks, same idiom as the opencode /
          # opencode-bin entry pair in the ai_github cluster (PR #480).
          rdepend: '!app-ai/pi'
          # pi-bin is the only flavour that needs an explicit S: the asset
          # tarball unpacks into the versionless pi/ wrapper directory
          # (upstream build-binaries.sh adds it "for mise
          # compatibility"), where portage's default S=${WORKDIR}/${P}
          # would expect pi-bin-<ver>/ (macaroni-os/kit-fixups#512
          # review: "This is the default. It's only needed for pi-bin").
          s: '${WORKDIR}/pi'
          # The bun-compiled binary resolves every runtime sidecar
          # relative to dirname(process.execPath) (/proc/self/exe, which
          # follows symlinks): packages/coding-agent/src/config.ts
          # derives the package dir (isBunBinary/getPackageDir), the
          # theme/ directory and export-html/ from it, photon.ts loads
          # photon_rs_bg.wasm next to the executable, and the TUI probes
          # the native/ prebuilds there last. So the resource tree is
          # installed as a whole under /usr/lib/pi and /usr/bin/pi is a
          # symlink into it. docs/ is installed because the binary
          # self-references package-relative docs paths at runtime: the
          # model-catalog hint prints absolute <pkgdir>/docs/*.md (proved
          # with 'pi --list-models' against a docs-less install, and the
          # executable embeds providers.md/models.md/extensions.md
          # references). examples/ is demo TypeScript source the program
          # never reads, so it is not installed (the same content lives
          # in the upstream repo); README/CHANGELOG go in via dodoc.
          # LICENSE (MIT) is taken from the GitHub API, same as the
          # opencode-bin entry in the ai_github cluster.
          body: |
            src_install() {
              # Install the executable together with every sidecar in
              # one directory so the execPath-relative lookups keep
              # working through the /usr/bin/pi symlink.
              insinto /usr/lib/pi
              doins -r native theme export-html assets docs
              doins photon_rs_bg.wasm package.json
              exeinto /usr/lib/pi
              doexe pi
              dosym /usr/lib/pi/pi /usr/bin/pi
              dodoc README.md CHANGELOG.md
            }

    - pi:
        # Source-built sibling of app-ai/pi-bin above, completing the
        # opencode / opencode-bin pattern from PR #480
        # (macaroni-os/mark-issues#853).
        # Why the UPLOADED source asset and not the GitHub-generated tag
        # tarball: the release pipeline first runs npm run hydrate:model-data
        # and force-adds the git-ignored result (packages/ai/src/
        # models.generated.ts plus packages/ai/src/providers/data/*.json)
        # into the archive; the validator in scripts/create-source-archive.sh
        # requires those paths and the checked-in packages/tui/native
        # prebuilds, while refusing node_modules/ and binaries/. The
        # auto-generated tarball of the same commit lacks the model data,
        # so npm run build:offline cannot work from it; the uploaded asset
        # is the only complete source snapshot, and it is exactly what CI
        # compiles the release binaries from (.github/workflows/
        # build-binaries.yml).
        # Build recipe = scripts/build-binaries.sh --offline-model-data
        # restricted to the linux branch for ${ARCH}: npm ci --ignore-scripts,
        # npm run build:offline, then the bun --compile of the coding-agent
        # CLI plus the sidecar staging, so the installed tree matches the
        # binary flavour. CI pins bun 1.4.4 and node 22 (root package.json
        # engines: node >= 22.19.0), hence the BDEPEND floor below.
        assets:
          - name: 'pi-{{ .Values.version }}-source.tar.gz'
            # Anchored at the end with escaped dots: the only v1.4.0 asset
            # ending in -source.tar.gz is pi-1.4.0-source.tar.gz; the binary
            # flavour assets (pi-linux-x64.tar.gz & co), the installer
            # helpers (pi-coding-agent-install-package.*) and SHA256SUMS
            # cannot match.
            matcher: '\-source\.tar\.gz$'
        vars:
          desc: 'AI agent toolkit: unified LLM API, agent loop, TUI, coding agent CLI (built from sources)'
          # No s: key here, unlike pi-bin above: the uploaded source
          # archive unpacks into a pi-<ver>/ root (scripts/
          # create-source-archive.sh git-archives with prefix
          # "pi-${version}"), which is exactly portage's default
          # S=${WORKDIR}/${P} (macaroni-os/kit-fixups#512 review).
          bdepend: |
            >=net-libs/nodejs-22.19.0
            || ( dev-lang/bun dev-lang/bun-bin )
          # Same /usr/bin/pi as the binary flavour above; the pair
          # mutually blocks (opencode idiom, PR #480).
          rdepend: '!app-ai/pi-bin'
          body: |
            src_compile() {
              # Upstream release recipe (scripts/build-binaries.sh
              # --offline-model-data), linux only. Keep npm's cache and
              # HOME inside the build area.
              export HOME="${T}"
              export npm_config_cache="${T}/npm-cache"

              # Install the JS dependency graph from the committed
              # package-lock.json (.npmrc has save-exact=true, so pins
              # are exact). --ignore-scripts exactly like upstream: the
              # hooks are dev tooling (the husky prepare would want git).
              npm ci --ignore-scripts || die "npm ci failed (needs npm-registry access)"

              # Workspace chain build telemetry -> chord -> tui ->
              # codemode -> mcp -> ai:build:offline -> durable -> env ->
              # agent -> coding-agent; the offline variant never shells
              # out to hydrate:model-data, the hydrated model snapshot
              # is compiled in from the archive.
              npm run build:offline || die

              cd packages/coding-agent || die
              local bun_target platform_arch
              case ${ARCH} in
                amd64) bun_target=bun-linux-x64-baseline; platform_arch=linux-x64 ;;
                arm64) bun_target=bun-linux-arm64; platform_arch=linux-arm64 ;;
                *) die "unsupported ARCH: ${ARCH}" ;;
              esac

              # --compile embeds the bun runtime (hence RESTRICT=strip);
              # the two worker scripts must stay explicit entrypoints so
              # that they are embedded (upstream comment), and the
              # autoload opt-outs are upstream issues #7684 and #10473.
              bun build --compile --no-compile-autoload-bunfig \
                --no-compile-autoload-dotenv --target="${bun_target}" \
                ./dist/bun/cli.js ./src/utils/image-resize-worker.ts \
                ./src/extensions/codemode/worker.ts --outfile dist/pi || die

              # Stage the release directory like the "Copy shared files"
              # loop of scripts/build-binaries.sh. examples/ is skipped:
              # demo TypeScript the program never reads, and the pi-bin
              # flavour does not install it either.
              local stage=${S}/pi-stage
              mkdir -p "${stage}"/theme "${stage}"/assets \
                "${stage}"/native/linux/prebuilds || die
              cp dist/pi package.json README.md CHANGELOG.md "${stage}"/ || die
              cp ../../node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm \
                "${stage}"/ || die
              cp dist/modes/interactive/theme/*.json "${stage}"/theme/ || die
              cp dist/modes/interactive/assets/* "${stage}"/assets/ || die
              cp -r dist/core/export-html docs "${stage}"/ || die
              cp -R ../tui/native/linux/prebuilds/"${platform_arch}" \
                "${stage}"/native/linux/prebuilds/ || die
            }

            src_install() {
              # Identical file set and layout to the pi-bin entry above:
              # the executable resolves every runtime sidecar relative to
              # dirname(process.execPath) (getPackageDir in
              # packages/coding-agent/src/config.ts), so the whole staged
              # tree goes under /usr/lib/pi and /usr/bin/pi is a symlink
              # into it; README/CHANGELOG go in via dodoc.
              cd "${S}/pi-stage" || die
              insinto /usr/lib/pi
              doins -r native theme export-html assets docs
              doins photon_rs_bg.wasm package.json
              exeinto /usr/lib/pi
              doexe pi
              dosym /usr/lib/pi/pi /usr/bin/pi
              dodoc README.md CHANGELOG.md
            }

llama_cpp:
  generator: builtin-github
  defaults:
    category: app-ai
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    markdevkit_min_version: 0.35.0
    github:
      user: ggml-org
      repo: llama.cpp
      ignore_tags: true
    transform:
      - kind: regex
        match: "b"
        replace: "0.0."
    vars:
      inherit:
        - cmake
      nvidia_cuda_capability:
        - 120
        - 100
        - 87
        - 89
        - 75
        #- 61
        # Maybe we can use all directly.

      # The single source of truth for the NVIDIA compute capabilities
      # this kit can target, one sm_* per line. The iuse, required_use,
      # and the src_configure architecture loop are all rendered from
      # this list, so a new generation is added here and nowhere else.
      #
      # The gfxcard-nvidia-<gen> ego mix-ins (core-kit) enable a
      # generation's flags:
      #   maxwell    sm_50 sm_52
      #   pascal     sm_60 sm_61
      #   volta      sm_70
      #   turing     sm_75
      #   ampere     sm_80 sm_86 sm_87
      #   ada        sm_89
      #   hopper     sm_90 sm_90a
      #   blackwell  sm_100 sm_101 sm_103 sm_110 sm_120 sm_121
      #
      # sm_101 (Jetson Thor) is renumbered to sm_110 by the 13.x
      # toolkit, so it is declared alongside it.
      gpus:
        #   maxwell
        - sm_50
        - sm_52
        #   pascal
        - sm_60
        - sm_61
        #   volta
        - sm_70
        #   turing
        - sm_75
        #   ampere
        - sm_80
        - sm_86
        - sm_87
        #   ada
        - sm_89
        #   hopper
        - sm_90
        - sm_90a
        #   blackwell
        - sm_100
        - sm_101
        - sm_103
        - sm_110
        - sm_120
        - sm_121

      # cuda-native: Used to force local GPU identification. It is
      # kept as a per-emerge escape hatch because the toolkit auto-
      # detection is not perfect; it is outclassed by the cuda_sm_*
      # flags and the raw -D of MYCMAKEARGS.
      iuse: |-
        static blas cuda nccl vulkan cuda-native
        {{- range $g := .Values.gpus }}
        cuda_{{ $g }}
        {{- end }}
      required_use: |-
        nccl? ( cuda )
        {{- range $g := .Values.gpus }}
        cuda_{{ $g }}? ( cuda )
        {{- end }}
      cdepend: |
        cuda? (
          dev-util/nvidia-cuda-toolkit
        )
        nccl? (
          dev-util/nvidia-nccl
        )
        vulkan? (
          dev-util/vulkan-tools
          media-libs/vulkan-layers
          media-libs/vulkan-loader
          media-libs/shaderc
          sci-libs/gsl
        )
        blas? (
          virtual/blas
          virtual/lapack
        )
        {{ .Values.cdepend_extra }}
      bdepend: |
        vulkan? (
          dev-util/vulkan-headers
        )
      rdepend: '${CDEPEND}'
      depend: '${CDEPEND}'
      body: |
        src_configure() {
          addpredict /proc/self/task
          if use blas ; then
            # It seems that -lcblas -lblas is not injected. It's inject only -llapack
            export LDFLAGS="${LDFLAGS} -lcblas -lblas"
          fi
          export BUILD_COMMIT={{ .Values.sha }}

          local mycmakeargs=(
            -DBUILD_SHARED_LIBS=$(usex static OFF ON)
            -DGGML_CUDA=$(usex cuda ON OFF)
            -DGGML_BLAS=$(usex blas ON OFF)
            -DGGML_VULKAN=$(usex vulkan ON OFF)
            -DGGML_BLAS_VENDOR=Generic
            -DGGML_CUDA_ENABLE_UNIFIED_MEMORY=1
            -DLLAMA_USE_PREBUILT_UI=OFF
          )
          local cuda_archs= cuda_major= cuda_supported=
          local arch cuda_flagged=() cuda_dropped=()
          if use cuda ; then
            # Multi-GPU support is optional: nccl is OFF by default and a
            # rebuild of dev-util/nvidia-nccl (or nvidia-cuda-toolkit,
            # which it depends on) marks this package to rebuild, since it
            # is a build dependency.
            mycmakeargs+=(
              -DGGML_CUDA_NCCL=$(usex nccl ON OFF)
            )
            # The architecture list comes from the enabled cuda_sm_*
            # flags, filtered against the set the installed toolkit
            # major can target (same per-major sets as
            # app-ai/ollama; CUDA only drops architectures at major
            # boundaries, and sm_101 is renumbered to sm_110 in 13.x).
            cuda_major=$(
              nvcc --version 2>/dev/null |
              sed -n 's/.*release \([0-9][0-9]*\).*/\1/p'
            )
            case ${cuda_major:-12} in
              13)
                cuda_supported="75 80 86 87 89 90 90a 100 103 110 120 121"
                ;;
              11)
                cuda_supported="50 52 60 61 70 75 80 86 87 89 90"
                ;;
              *)
                [[ -z ${cuda_major} ]] && \
                  ewarn "Could not detect the CUDA toolkit major version (nvcc not found); defaulting to the CUDA 12 supported set"
                cuda_supported="50 52 60 61 70 75 80 86 87 89 90 90a 100 103 120 121"
                ;;
            esac
            for arch in {{ range $i, $g := .Values.gpus }}{{ trimPrefix "sm_" $g }} {{ end }}; do
              use cuda_sm_${arch} || continue
              if has "${arch}" ${cuda_supported} ; then
                cuda_flagged+=("${arch}")
              else
                cuda_dropped+=("${arch}")
              fi
            done
            if [[ ${#cuda_flagged[@]} -gt 0 || ${#cuda_dropped[@]} -gt 0 ]] ; then
              if [[ ${#cuda_dropped[@]} -gt 0 ]] ; then
                ewarn "Dropping CUDA architectures unsupported by the installed toolkit (major ${cuda_major:-unknown}): $(join ' ' "${cuda_dropped[@]}")"
              fi
              if [[ ${#cuda_flagged[@]} -eq 0 ]] ; then
                die "all enabled cuda_sm_* flags are unsupported by the installed CUDA toolkit; enable flags matching your card, or override with MYCMAKEARGS=\"-DCMAKE_CUDA_ARCHITECTURES=...\""
              fi
              cuda_archs="$(join ';' "${cuda_flagged[@]}")"
            fi
          fi
          # Precedence: the enabled cuda_sm_* flags, then the explicit
          # cuda-native USE flag (per-emerge choice), then the package
          # default. A raw -D in MYCMAKEARGS still speaks last, since the
          # cmake eclass appends it after mycmakeargs and cmake's last -D
          # wins.
          if [[ -z ${cuda_archs} ]] ; then
            if use cuda-native ; then
              cuda_archs=native
            else
              cuda_archs='{{ .Values.nvidia_cuda_capability | join ";" }}'
            fi
          fi
          mycmakeargs+=(
            -DCMAKE_CUDA_ARCHITECTURES="${cuda_archs}"
          )
          cmake_src_configure
        }
        src_install() {
          cmake_src_install
          dodoc README.md SECURITY.md CONTRIBUTING.md
        }



  extensions_defs:
    golang:
      opts:

  packages:

    - llama-cpp:
        github:
          experimental: true
          match: '^b.*'
        vars:
          slot: snapshot
          cdepend_extra: |
            !app-ai/llama-cpp:0

    - llama-cpp:
        github:
          match: '^[^b]'
          # keep this high because there
          # are a lot of snapshots.
          # If this fails, also the snapshot fails.
          num_pages: 10
        vars:
          cdepend_extra: |
            !app-ai/llama-cpp:snapshot

strata:
  generator: builtin-github
  defaults:
    category: app-ai
    # Service payload directory SHARED with app-ai/strata-bin (the
    # macaroni-os/kit-fixups#631 review ask: "I think that both strata
    # and strata-bin could share the same directory"). Literal, not the
    # "{{ .Values.pn }}" default, so the sharing is explicit and PN-
    # independent: ai-kit/autogen.kit.d/strata/ holds both unit sets,
    # each atom installs only its own PN-named files from it (strata.*
    # here, strata-control.* in app-ai/strata-bin), so the file sets
    # stay disjoint and the atoms remain co-installable.
    files_dir: strata
    template: ../../templates/simple-github.tmpl
    # Upstream (Niko1221/Strata) release ASSETS are tens-of-GB model packs
    # (*.pack) plus installers: runtime downloads, never part of SRC_URI.
    # The atom tracks the tag line: v-prefixed semver with interleaved
    # four-segment patch tags (v0.2.14.1, v0.2.13.1), all valid Portage PVs
    # once the leading v is stripped. query: tags because the release
    # TITLES are free text ("Strata 0.2.16: Strata's own engine code,
    # ..."); github.match then keeps only pure-version tags - upstream also
    # carries a v0.2.0-beta that is NOT marked as a pre-release and would
    # fail the whole version selection when parsed as a Portage PV.
    github:
      user: Niko1221
      repo: Strata
      query: tags
      match: '^v[0-9][0-9.]*$'
  packages:

    - strata:
        assets:
          - name: "{{ .Values.p }}.tar.gz"
            url: "https://api.github.com/repos/Niko1221/Strata/tarball/v{{ .Values.pv }}"
        vars:
          # systemd: systemd_dounit needs the systemd eclass inherited
          # (the in-kit ollama entry calls it without inheriting -- a
          # latent bug on ollama's systemd side; not this PR's scope).
          inherit:
            - cmake
            - systemd
          desc: Local inference engine for Qwen3.8-Flash-Next on NVIDIA GPUs
          homepage: https://github.com/Niko1221/Strata
          license: MIT
          # Upstream's own recipe (tools/packaging/build_cuda_linux.sh)
          # always configures Release. The cmake eclass build type does not
          # define NDEBUG, and on this engine family a non-NDEBUG CUDA build
          # keeps driver-API error paths that the link line does not carry
          # (macaroni-os/kit-fixups#628). Set before inherit, hence
          # extra_envs (same shape as app-shells/fish).
          extra_envs:
            - 'CMAKE_BUILD_TYPE=Release'
          # The single source of truth for the NVIDIA compute capabilities
          # this kit can target (same rendering pattern as app-ai/ollama and
          # app-ai/maya). Strata refuses compute capabilities below 7.5
          # (cmake/backends/cuda.cmake: "needs an NVIDIA GPU of compute
          # capability 7.5 or newer"), so unlike ollama this list starts at
          # Turing; sm_52/sm_60/sm_70 exist upstream only as the experimental
          # -DSTRATA_EXPERIMENTAL_SM60=ON CUDA 12.x builds and are not
          # exposed here.
          gpus:
            #   turing
            - sm_75
            #   ampere
            - sm_80
            - sm_86
            - sm_87
            #   ada
            - sm_89
            #   hopper
            - sm_90
            - sm_90a
            #   blackwell
            - sm_100
            - sm_101
            - sm_103
            - sm_110
            - sm_120
            - sm_121
          # Default target when USE=cuda without any cuda_sm_* flag:
          # upstream's own default (cmake/backends/cuda.cmake sets
          # CMAKE_CUDA_ARCHITECTURES to 120).
          nvidia_cuda_capability:
            - 120
          # There is no CPU-only engine: the strata executable is defined by
          # cmake/strata_gpu_engine.cmake only inside if(STRATA_ENABLE_CUDA
          # OR STRATA_ENABLE_HIP), so without USE=cuda the package installs
          # the GGUF artifact tools (strata-plan, strata-gguf, strata-dequant)
          # only. The HIP backend (STRATA_ENABLE_HIP, needs ROCm hipcc) and
          # the SYCL backend (STRATA_ENABLE_SYCL, a separate sycl/ project
          # needing icpx + oneMKL) are follow-ups: the tree has no matching
          # toolkit; Metal is Apple-only. The upstream test suite is never
          # built (STRATA_BUILD_TESTS=OFF, house rule). ggml is vendored in
          # the tag tarball (engine/third_party/strata-ggml) and in this
          # Release configuration is not even configured (configure line:
          # "Strata: no ggml in this build"): nothing is downloaded.
          # systemd selects the unit flavour of the service payload
          # (app-ai/ollama idiom: systemd unit with the flag, OpenRC
          # conf.d + init.d without it; /etc/conf.d installs in both
          # cases and the unit reads it through EnvironmentFile). No
          # sys-apps/systemd dependency: exactly the ollama precedent,
          # which declares nothing for the systemd USE.
          iuse: |-
            cuda cuda-native systemd
            {{- range $g := .Values.gpus }}
            cuda_{{ $g }}
            {{- end }}
          required_use: |-
            {{- range $g := .Values.gpus }}
            cuda_{{ $g }}? ( cuda )
            {{- end }}
          cdepend: |
            cuda? (
              dev-util/nvidia-cuda-toolkit
            )
          rdepend: '${CDEPEND}'
          depend: '${CDEPEND}'
          body: |
            src_prepare() {
              # The CMake project root is engine/, not the tag tarball's root
              # (which also holds terminal/ and app/). _cmake_check_build_dir
              # takes CMAKE_USE_DIR as-is, so set it globally here and both
              # cmake_src_prepare and cmake_src_configure use it; BUILD_DIR
              # stays the eclass out-of-source default.
              CMAKE_USE_DIR="${S}/engine"
              cmake_src_prepare
            }
            src_configure() {
              addpredict /proc/self/task
              local mycmakeargs=(
                -DSTRATA_BUILD_TESTS=OFF
                -DSTRATA_WERROR=OFF
                -DSTRATA_PORTABLE=ON
                -DSTRATA_ENABLE_CUDA=$(usex cuda ON OFF)
              )
              local cuda_archs= cuda_major= cuda_supported=
              local arch cuda_flagged=() cuda_dropped=()
              if use cuda ; then
                # The architecture list comes from the enabled cuda_sm_*
                # flags, filtered against the set the installed toolkit
                # major can target (same per-major sets as app-ai/ollama;
                # CUDA only drops architectures at major boundaries, and
                # sm_101 is renumbered to sm_110 in the 13.x toolkits).
                cuda_major=$(
                  nvcc --version 2>/dev/null |
                  sed -n 's/.*release \([0-9][0-9]*\).*/\1/p'
                )
                case ${cuda_major:-13} in
                  13)
                    cuda_supported="75 80 86 87 89 90 90a 100 103 110 120 121"
                    ;;
                  *)
                    [[ -z ${cuda_major} ]] && \
                      ewarn "Could not detect the CUDA toolkit major version (nvcc not found); defaulting to the CUDA 12 supported set"
                    cuda_supported="60 61 70 75 80 86 87 89 90 90a 100 103 120 121"
                    ;;
                esac
                for arch in {{ range $i, $g := .Values.gpus }}{{ trimPrefix "sm_" $g }} {{ end }}; do
                  use cuda_sm_${arch} || continue
                  if has "${arch}" ${cuda_supported} ; then
                    cuda_flagged+=("${arch}")
                  else
                    cuda_dropped+=("${arch}")
                  fi
                done
                if [[ ${#cuda_flagged[@]} -gt 0 || ${#cuda_dropped[@]} -gt 0 ]] ; then
                  if [[ ${#cuda_dropped[@]} -gt 0 ]] ; then
                    ewarn "Dropping CUDA architectures unsupported by the installed toolkit (major ${cuda_major:-unknown}): $(join ' ' "${cuda_dropped[@]}")"
                  fi
                  if [[ ${#cuda_flagged[@]} -eq 0 ]] ; then
                    die "all enabled cuda_sm_* flags are unsupported by the installed CUDA toolkit; enable flags matching your card, or override with MYCMAKEARGS=\"-DCMAKE_CUDA_ARCHITECTURES=...\""
                  fi
                  cuda_archs="$(join ';' "${cuda_flagged[@]}")"
                fi
              fi
              # Precedence (as in app-ai/llama-cpp and app-ai/maya): the
              # enabled cuda_sm_* flags, then the explicit cuda-native USE
              # flag, then the package default. A raw -D in MYCMAKEARGS
              # still speaks last.
              if [[ -z ${cuda_archs} ]] ; then
                if use cuda-native ; then
                  cuda_archs=native
                else
                  cuda_archs='{{ .Values.nvidia_cuda_capability | join ";" }}'
                fi
              fi
              if use cuda ; then
                mycmakeargs+=(
                  -DCMAKE_CUDA_ARCHITECTURES="${cuda_archs}"
                )
              fi
              cmake_src_configure
            }
            src_install() {
              # Upstream's CMake project defines no install() rules; stage
              # the built executables by name (the cmake eclass builds in
              # BUILD_DIR). The Qwen3.6 sibling binaries (strata-q36,
              # strata-device, strata-load, ...) are development/diagnostic
              # programs; upstream's package recipe stages the engine plus
              # the artifact tools only.
              local t
              for t in strata-plan strata-gguf strata-dequant ; do
                test -x "${BUILD_DIR}"/${t} || die "${t} was not built"
                dobin "${BUILD_DIR}"/${t}
              done
              if use cuda ; then
                test -x "${BUILD_DIR}"/strata || die "the strata engine was not built although USE=cuda"
                dobin "${BUILD_DIR}"/strata
              fi
              dodoc README.md LICENSE
              # Service payload from the strata/ files_dir shared with
              # app-ai/strata-bin (macaroni-os/kit-fixups#631 review):
              # conf.d always, then exactly ONE init flavour (geaaru's
              # rule on kit-fixups#511 -- the init script goes in the
              # else). The shipped unit and init script refuse to
              # start, with a plain message, when the engine binary is
              # absent (no USE=cuda) or STRATA_ENGINE_ARGS is unset --
              # the engine serves its GEN/T protocol only for a model
              # that already exists on disk (docs/SOURCE_INSTALL.md).
              newconfd "${FILESDIR}"/strata.confd strata
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/strata.service
              else
                newinitd "${FILESDIR}"/strata.initd strata
              fi
            }
            pkg_postinst() {
              elog "app-ai/strata installs Strata's C++ inference engine (the"
              elog "strata binary is built only with USE=cuda; upstream provides"
              elog "no CPU-only engine) and its GGUF artifact tools. The engine"
              elog "needs an NVIDIA driver (libcuda.so.1) at run time and is"
              elog "driven by Strata's terminal/desktop layer together with model"
              elog "packs downloaded at run time; nothing model-related ships"
              elog "with the package (see macaroni-os/mark-issues#933)."
              elog "Service: /etc/conf.d/strata plus /etc/init.d/strata"
              elog "(or /usr/lib/systemd/system/strata.service with"
              elog "USE=systemd) supervise the engine's --serve request"
              elog "protocol (READY/GEN/T over stdin/stdout; the stdio"
              elog "end-point is a FIFO, see the conf.d comments). Set"
              elog "STRATA_ENGINE_ARGS to the args of your model's run"
              elog "config before enabling it; without USE=cuda there"
              elog "is no engine binary to run. The HTTP front-end that"
              elog "drives this worker ships with app-ai/strata-bin"
              elog "(strata-control.service, from the same shared"
              elog "payload directory; macaroni-os/kit-fixups#631)."
            }
maya:
  generator: builtin-github
  defaults:
    category: app-ai
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      user: mw00
      repo: project-maya
    # Upstream (mw00/project-maya) publishes no release assets: builtin-github
    # recovers the api.github.com source tarball for the tag, whose unpack
    # root <user>-<repo>-<sha7> is renamed by the template's post_src_unpack.
    #
    # The second asset is the llama.cpp checkout upstream pins for ggml
    # (CMakeLists.txt FetchContent GIT_TAG, the same commit as setup.py's
    # LLAMA_CPP_COMMIT). The network sandbox forbids that clone at build
    # time, so it is delivered as a distfile and fed through upstream's own
    # STRATA_GGML_DIR switch instead of FetchContent. When a bumped release
    # fails to compile against the pinned ggml, move llama_cpp_sha to the
    # commit the new release pins (CMakeLists.txt, STRATA_GGML_DIR block).
  packages:

    - maya:
        assets:
          - name: "{{ .Values.p }}.tar.gz"
            url: "https://api.github.com/repos/mw00/project-maya/tarball/v{{ .Values.pv }}"
          - name: "llama-cpp-{{ .Values.llama_cpp_sha }}.tar.gz"
            url: "https://github.com/ggml-org/llama.cpp/archive/{{ .Values.llama_cpp_sha }}.tar.gz"
        vars:
          llama_cpp_sha: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          # systemd_dounit needs the systemd eclass, enewuser and
          # enewgroup the user eclass (ollama's inherit tail; the
          # in-kit ollama entry calls systemd_dounit without the
          # former -- a latent bug, not replicated here).
          inherit:
            - cmake
            - systemd
            - user
          desc: Local inference engine for huge GGUF MoE models, with a web dashboard (GPU required)
          homepage: https://github.com/mw00/project-maya
          license: MIT
          # Upstream builds are always Release (CMakeLists.txt forces
          # CMAKE_BUILD_TYPE to Release when unset): with the eclass default
          # the ggml CUDA check macros keep driver-API paths the link line
          # does not carry (undefined reference to cuGetErrorString), and
          # NDEBUG is exactly what Release compiles define. Set before
          # inherit, hence extra_envs (same shape as app-shells/fish).
          extra_envs:
            - 'CMAKE_BUILD_TYPE=Release'
          # The single source of truth for the NVIDIA compute capabilities
          # this kit can target (same rendering pattern as app-ai/ollama and
          # app-ai/llama-cpp). Maya itself refuses compute capabilities below
          # sm_60 (CMakeLists.txt: "needs an NVIDIA GPU of compute capability
          # 6.0 or newer"), so unlike ollama this list starts at Pascal.
          gpus:
            #   pascal
            - sm_60
            - sm_61
            #   volta
            - sm_70
            #   turing
            - sm_75
            #   ampere
            - sm_80
            - sm_86
            - sm_87
            #   ada
            - sm_89
            #   hopper
            - sm_90
            - sm_90a
            #   blackwell
            - sm_100
            - sm_101
            - sm_103
            - sm_110
            - sm_120
            - sm_121
          # Default target when USE=cuda without any cuda_sm_* flag:
          # upstream's own default (CMakeLists.txt sets
          # CMAKE_CUDA_ARCHITECTURES to 120).
          nvidia_cuda_capability:
            - 120
          # There is no CPU-only engine: the `maya` executable is defined by
          # CMakeLists.txt only inside if(STRATA_ENABLE_CUDA OR
          # STRATA_ENABLE_HIP), so without USE=cuda the package installs the
          # ggml artifact tools (strata-gguf, strata-dequant, strata-plan)
          # and the dashboard layer only. The HIP backend is not exposed
          # because the tree has no ROCm toolkit yet; Metal is Apple-only.
          # The upstream test suite is never built (STRATA_BUILD_TESTS=OFF,
          # house rule).
          # systemd selects the unit flavour of the service payload
          # (the ollama idiom: unit with the flag, OpenRC script
          # without; /etc/conf.d installs in both cases). No
          # sys-apps/systemd RDEPEND, as in ollama and strata-bin.
          iuse: |-
            cuda cuda-native systemd
            {{- range $g := .Values.gpus }}
            cuda_{{ $g }}
            {{- end }}
          required_use: |-
            {{- range $g := .Values.gpus }}
            cuda_{{ $g }}? ( cuda )
            {{- end }}
          cdepend: |
            cuda? (
              dev-util/nvidia-cuda-toolkit
            )
          # Python deps of the installed dashboard (the full
          # determination is recorded in the PR description):
          # * No python eclass applies: setup.py is not a distribution but
          #   the installer's helper module (no setup()/setuptools/distutils
          #   call, no pyproject.toml/setup.cfg); upstream pip-installs its
          #   PY_PACKAGES list into its own .venv at run time (setup.py
          #   pip_install). distutils-r1, PYTHON_COMPAT and the pydeps
          #   machinery are rendered only by mark-devkit's builtin-pypi
          #   generator over pypi-generic.tmpl, which needs a PyPI
          #   distribution, and project-maya is not on PyPI (the pypi.org
          #   "maya" project is unrelated). Probe: python_compat and pydeps
          #   added to this atom render nothing under builtin-github.
          # * jinja2 is both necessary and sufficient at serve time: the
          #   module-level third-party closure of `import maya` and of
          #   `import serve.server` over the whole installed /usr/share/maya
          #   tree is exactly jinja2 (serve/frontend.py), and a model-free
          #   headless dashboard run (`python3 serve/server.py --engine
          #   mock`, python 3.11.16) renders the page, answers /api/tags
          #   and /metrics and completes a chat completion with only
          #   dev-lang/python + dev-python/jinja installed. The same import
          #   fails on the 3.9 interpreter of mark-unstable (the floor note
          #   in pkg_postinst).
          # * The rest of upstream's PY_PACKAGES stays undeclared: psutil
          #   (engine monitoring), numpy and PIL (vision) and jsonschema
          #   (structured outputs) are guarded function-local imports whose
          #   except branches degrade gracefully or raise a per-request
          #   "pip install ..." error - optional features in upstream's own
          #   code, which it delivers through that .venv; regex is imported
          #   only by the offline tools/strata_tokenizer.py CLI; tqdm and
          #   requests are imported by nothing in the shipped tree; and
          #   cmake/ninja are installer executables, not imports. The tree
          #   could not carry the optional set as atoms today anyway: the
          #   only jsonschema here is 4.5.1, below upstream's >=4.18,<5
          #   pin, and dev-python/tqdm and dev-python/textual do not exist.
          # * The atom is slot-less without ${PYTHON_USEDEP} on purpose:
          #   the dashboard runs under the system interpreter, while the
          #   python eclasses bind deps to PYTHON_TARGETS - the release
          #   branches resolve dev-python for python3_9 only, so
          #   target-pinned deps would misrepresent the >=3.10 floor.
          rdepend: |
            dev-lang/python
            dev-python/jinja
            ${CDEPEND}
          depend: '${CDEPEND}'
          body: |
            pkg_setup() {
              ebegin "Ensuring maya user/group exist"
              enewgroup maya
              enewuser maya -1 -1 /var/lib/maya maya
            }
            src_prepare() {
              # EAPI 7 does not dispatch the cmake eclass' src_prepare
              # through default (cf. dev-util/opencl-icd-loader).
              cmake_src_prepare
              # Engines resolve via BUILD = ROOT / "build" (maya.py:103),
              # the single source of every engine path; they install in
              # /usr/bin, so point the constant there.
              sed -i 's|^BUILD = ROOT / "build"$|BUILD = Path("/usr/bin")|' \
                maya.py || die "engine-path sed failed (BUILD constant in maya.py)"
              # The same constant is the --exe default of the offline
              # CLIs (tools/maya_quant/kl_eval.py:29, zs_engine.py:22,
              # tools/strata/glm53_long_gate.py:76).
              sed -i 's|pathlib\.Path(__file__)\.resolve()\.parents\[2\] / "build" / "maya"|pathlib.Path("/usr/bin") / "maya"|g' \
                tools/maya_quant/kl_eval.py tools/maya_quant/zs_engine.py \
                tools/strata/glm53_long_gate.py || die "tools engine-path sed failed"
              # Model downloads default to ROOT.parent/Maya-data/models
              # (six sites in maya.py): /usr/share/Maya-data on a system
              # prefix. Move the default to the user's home; upstream's
              # --models-dir and installer.models_dir still override it.
              sed -i 's|ROOT\.parent / "Maya-data" / "models"|Path.home() / "Maya-data" / "models"|g' \
                maya.py || die "model-dir sed failed (maya.py)"
              # serve/models.py is NOT sed'ed: its fallback feeds
              # models_dirs(), a storage listing that filters home
              # folders out by design, not a download target.
            }
            src_configure() {
              addpredict /proc/self/task
              local mycmakeargs=(
                -DSTRATA_BUILD_TESTS=OFF
                -DSTRATA_WERROR=OFF
                -DSTRATA_GGML_DIR=${WORKDIR}/llama.cpp-{{ .Values.llama_cpp_sha }}
                -DSTRATA_ENABLE_CUDA=$(usex cuda ON OFF)
              )
              local cuda_archs= cuda_major= cuda_supported=
              local arch cuda_flagged=() cuda_dropped=()
              if use cuda ; then
                # The enabled cuda_sm_* flags filtered against the set
                # the installed toolkit major targets (per-major sets
                # as in app-ai/ollama).
                cuda_major=$(
                  nvcc --version 2>/dev/null |
                  sed -n 's/.*release \([0-9][0-9]*\).*/\1/p'
                )
                case ${cuda_major:-13} in
                  13)
                    cuda_supported="75 80 86 87 89 90 90a 100 103 110 120 121"
                    ;;
                  *)
                    [[ -z ${cuda_major} ]] && \
                      ewarn "Could not detect the CUDA toolkit major version (nvcc not found); defaulting to the CUDA 12 supported set"
                    cuda_supported="60 61 70 75 80 86 87 89 90 90a 100 103 120 121"
                    ;;
                esac
                for arch in {{ range $i, $g := .Values.gpus }}{{ trimPrefix "sm_" $g }} {{ end }}; do
                  use cuda_sm_${arch} || continue
                  if has "${arch}" ${cuda_supported} ; then
                    cuda_flagged+=("${arch}")
                  else
                    cuda_dropped+=("${arch}")
                  fi
                done
                if [[ ${#cuda_flagged[@]} -gt 0 || ${#cuda_dropped[@]} -gt 0 ]] ; then
                  if [[ ${#cuda_dropped[@]} -gt 0 ]] ; then
                    ewarn "Dropping CUDA architectures unsupported by the installed toolkit (major ${cuda_major:-unknown}): $(join ' ' "${cuda_dropped[@]}")"
                  fi
                  if [[ ${#cuda_flagged[@]} -eq 0 ]] ; then
                    die "all enabled cuda_sm_* flags are unsupported by the installed CUDA toolkit; enable flags matching your card, or override with MYCMAKEARGS=\"-DCMAKE_CUDA_ARCHITECTURES=...\""
                  fi
                  cuda_archs="$(join ';' "${cuda_flagged[@]}")"
                fi
              fi
              # Precedence (as in app-ai/llama-cpp): flags, then
              # cuda-native, then the default; MYCMAKEARGS speaks last.
              if [[ -z ${cuda_archs} ]] ; then
                if use cuda-native ; then
                  cuda_archs=native
                else
                  cuda_archs='{{ .Values.nvidia_cuda_capability | join ";" }}'
                fi
              fi
              if use cuda ; then
                mycmakeargs+=(
                  -DCMAKE_CUDA_ARCHITECTURES="${cuda_archs}"
                )
              fi
              cmake_src_configure
            }
            src_install() {
              # Upstream defines no install() rules; stage the binaries
              # by name (the cmake eclass builds in BUILD_DIR).
              local t
              for t in strata-plan strata-gguf strata-dequant ; do
                test -x "${BUILD_DIR}"/${t} || die "${t} was not built"
                dobin "${BUILD_DIR}"/${t}
              done
              if use cuda ; then
                test -x "${BUILD_DIR}"/maya || die "the maya engine was not built although USE=cuda"
                dobin "${BUILD_DIR}"/maya
                # maya-ds4/maya-mm3 are defined only above their own
                # CUDA arch floors (CMakeLists.txt); install what built.
                local e
                for e in maya-ds4 maya-mm3 ; do
                  if [[ -x "${BUILD_DIR}"/${e} ]] ; then
                    dobin "${BUILD_DIR}"/${e}
                  fi
                done
              fi
              # The dashboard layer is a directory-relative Python app
              # (maya.py resolves ROOT to its own directory): app
              # sources and data files only.
              insinto /usr/share/maya
              doins -r serve tools data assets
              doins maya.py setup.py chat.py VERSION
              dodoc README.md SECURITY.md CONTRIBUTING.md
              dodoc LICENSE LICENSE.deepseek-v41 LICENSE.minimax-m31 LICENSE.qwen-community-1.0
              # /usr/bin/maya is the engine binary, so the dashboard
              # launcher takes the service-side name (the ollama
              # binary-vs-service split); maya.service runs this same
              # launcher, so the unit and the shell share one path.
              printf '%s\n' \
                '#!/bin/sh' \
                '# Project Maya dashboard launcher (app-ai/maya): the' \
                '# packaged dashboard on the system interpreter; engines' \
                '# resolve from /usr/bin and downloads default to' \
                '# ~/Maya-data/models (see pkg_postinst).' \
                '#   maya-server' \
                '#       -> the dashboard on the mock engine' \
                '#   maya-server --engine maya --config maya-<model>.json' \
                '#       -> serve a downloaded model' \
                'exec python3 /usr/share/maya/serve/server.py "$@"' \
                > "${T}"/maya-server
              # newbin: the insinto above is still in effect (newins
              # would stage under /usr/share/maya).
              newbin "${T}"/maya-server maya-server
              # Service payload: /etc/conf.d always, then exactly one
              # init flavour -- the systemd unit with USE=systemd, the
              # OpenRC script without it; the unit reads the same
              # conf.d through EnvironmentFile-.
              newconfd "${FILESDIR}"/maya.confd maya
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/maya.service
              else
                newinitd "${FILESDIR}"/maya.initd maya
              fi
              diropts -m0750 -o maya -g maya
              dodir /var/lib/maya
              keepdir /var/lib/maya
              diropts
            }
            pkg_postinst() {
              elog "app-ai/maya installs the engine binaries (USE=cuda only;"
              elog "upstream has no CPU-only engine) and the ggml artifact tools"
              elog "in /usr/bin, the dashboard layer in /usr/share/maya, and the"
              elog "dashboard launcher /usr/bin/maya-server (the name"
              elog "/usr/bin/maya is the engine itself)."
              elog ""
              elog "Model downloads default to ~/Maya-data/models; override"
              elog "with --models-dir on maya.py's setup flows or an"
              elog "installer.models_dir config entry."
              elog ""
              elog "The dashboard service: configure /etc/conf.d/maya"
              elog "(MAYA_HOST, MAYA_PORT, MAYA_API_KEY, MAYA_SERVER_ARGS)"
              elog "and enable it with rc-update add maya default, or"
              elog "systemctl enable maya with USE=systemd (which installs"
              elog "the unit instead of the init script). It runs as user"
              elog "maya with HOME=/var/lib/maya and never downloads:"
              elog "without a model's run config in MAYA_SERVER_ARGS the"
              elog "scripted mock engine answers. Set MAYA_API_KEY before"
              elog "binding MAYA_HOST to a routable address."
              elog ""
              elog "Per upstream the dashboard needs a Python 3.10 or newer"
              elog "interpreter, which the tree currently masks (see"
              elog "macaroni-os/mark-issues#932); the native engines are"
              elog "unaffected. Nothing model-related ships with the package."
            }

strata_bin:
  generator: builtin-github
  defaults:
    category: app-ai
    # One payload directory for BOTH Strata atoms (the review ask on
    # macaroni-os/kit-fixups#631: "I think that both strata and
    # strata-bin could share the same directory"): a LITERAL files_dir,
    # not the "{{ .Values.pn }}" default the ai_github cluster uses --
    # PN is strata-bin here, yet the files live together with the
    # source atom's unit files in ai-kit/autogen.kit.d/strata/. Each
    # entry installs only its own PN-named set from that shared
    # directory (strata-control.* below, strata.* in app-ai/strata),
    # so the two atoms stay co-installable with disjoint file sets.
    files_dir: strata
    # simple.tmpl, not simple-github.tmpl: only prebuilt release assets are
    # downloaded, so there is no <user>-<repo>-* unpack dir for the generated
    # post_src_unpack() to rename (opencode-bin idiom).
    template: ../../templates/simple.tmpl
    github:
      user: Niko1221
      # PN is strata-bin; pin the repository name explicitly (pi-bin idiom).
      repo: Strata
      # Release titles are free text ("Strata 0.2.16: Strata's own engine
      # code, ..."); the transform chain on the package entry reduces the
      # title to the bare version (probe evidence captured in
      # macaroni-os/kit-fixups#631: without it the run fails with
      # "No versions found").
      query: releases
  packages:

    - strata-bin:
        # Release titles are free text ("Strata 0.2.16: Strata's own engine
        # code, a new folder layout, ...") and builtin-github parses the
        # TITLE in releases mode: reduce it to the bare version (strip the
        # leading product word, then cut the message tail at the first
        # colon -- the string/regex transform idiom of
        # net-im/mattermost-desktop-bin). Upstream title-format drift then
        # fails loudly as "No versions found" at the next bump, which is
        # the honest outcome for a release-asset atom.
        transform:
          - kind: string
            match: 'Strata '
            replace: ''
          - kind: regex
            match: ':.*$'
            replace: ''
        # The strata-control release tarball: upstream's self-contained
        # Terminal distribution (bin/strata launcher + relocatable private
        # CPython 3.12 + every wheel it imports, see BUNDLE.json), a release
        # asset of every APP tag (v0.2.16 ships control 0.1.62). It extracts
        # with stock unpack() and runs fully headless: ldd over the extracted
        # tree needs nothing beyond the glibc base.
        #
        # VERSION SKEW (the design point of this entry): control/engine
        # components version INDEPENDENTLY of the app tags and can even be
        # hotfixed inside an existing release (v0.2.15 ships control 0.1.61
        # where v0.2.16 ships 0.1.62; v0.2.14 hosts BOTH 0.1.60 and the
        # 0.1.60.1 reupload), so the DOWNLOAD URL must not be templated from
        # {{ .Values.version }}: the version-free matcher lets
        # builtin-github resolve the control tarball from the selected
        # release itself -- the component version rides per tag with no
        # pins (selector probes: v0.2.16 -> control-0.1.62, v0.2.15 ->
        # control-0.1.61). The local distfile name is app-versioned (the
        # asset carries the component version upstream, so the two names
        # differ by design -- the name/url two-var rule of the kit-fixups
        # assets convention keeps every PV's distfile unique in DISTDIR).
        # The per-release install-manifest.txt and strata-feed.json assets
        # carry the platform -> component version + sha256 mapping for
        # bump-time cross-checks. Known multi-match nuance (probed): on a
        # historical tag hosting two control versions side by side (v0.2.14:
        # 0.1.60 + the 0.1.60.1 reupload that its install-manifest.txt marks
        # canonical) the matcher resolves deterministically to 0.1.60 --
        # buildable and self-consistent, just not the reupload; pin a one-off
        # url: asset if such a tag ever needs the hotfixed bytes. The
        # shipping flow is unaffected: upstream posts hotfix reuploads with
        # the next app tag (0.1.61 shipped on v0.2.15) and the tip release
        # carries exactly one linux-x86_64 control asset.
        # USE surface for the engines, as prescribed by the maintainer on
        # macaroni-os/kit-fixups#631 review (2026-11-19): one custom USE
        # per backend, plus REQUIRED_USE relationships to the arch flags,
        # because mark-devkit assets carry a single USE condition per
        # entry -- "arm64? ( cuda13? ( <URL> ) )" is not expressible, "we
        # use a custom USEs and later on required_use we add relationship
        # to the arches uses amd64 and arm64". USE names cannot carry
        # hyphens, so upstream backend ids map 1:1 with _ for -:
        # cuda-cuda13 -> cuda13, hip-rx6000 -> hip_rx6000, sycl -> sycl;
        # the arm64 side takes the arm64_ prefix. Real linux asset matrix
        # (captured per-tag sweep, table in the PR body): x86_64 ships
        # cuda-cuda12, cuda-cuda13, hip-rx6000, hip-rx7900, hip-rx9070,
        # hip-halo, sycl; aarch64 ships cuda-cuda13 only; the hip-rdna2/
        # hip-rdna3 ids of the review sketch exist on WINDOWS only.
        # Engines are OFF by default: the control-only install is the
        # verified green default and upstream's signed runtime feed
        # ("strata-control update") keeps working either way.
        # Distfile names follow the maintainer's sketch,
        # '{{ .Values.p }}-<component>-<arch>[-<backend>].tar.gz': the
        # pn-PV prefix keeps every PV's distfiles unique in DISTDIR while
        # the URL side stays a version-free matcher (the skew note above).
        # Fluctuation caveat (repro in the PR body): upstream does not
        # ship a stable asset set per tag -- v0.2.15 has ZERO linux-x86_64
        # engine assets, v0.2.14 lacks sycl, aarch64 starts at v0.2.7 --
        # and generation resolves and downloads EVERY asset regardless of
        # USE, with no per-asset optional field (AutogenAsset: use/name/
        # matcher/prefix/url/local). A historical tag missing a gated
        # backend therefore fails generation with the hard error "no asset
        # found for matcher"; the shipping flow (the tip release, which
        # carries the full matrix) is unaffected.
        assets:
          - name: '{{ .Values.p }}-strata-control-linux-x86_64.tar.gz'
            matcher: '^strata-control-[0-9.]+-linux-x86_64\.tar\.gz$'
            use: amd64
          - name: '{{ .Values.p }}-strata-control-linux-aarch64.tar.gz'
            matcher: '^strata-control-[0-9.]+-linux-aarch64\.tar\.gz$'
            use: arm64
          - name: '{{ .Values.p }}-strata-engine-linux-x86_64-cuda-cuda12.tar.gz'
            matcher: '^strata-engine-[0-9.]+-linux-x86_64-cuda-cuda12\.tar\.gz$'
            use: cuda12
          - name: '{{ .Values.p }}-strata-engine-linux-x86_64-cuda-cuda13.tar.gz'
            matcher: '^strata-engine-[0-9.]+-linux-x86_64-cuda-cuda13\.tar\.gz$'
            use: cuda13
          - name: '{{ .Values.p }}-strata-engine-linux-x86_64-hip-rx6000.tar.gz'
            matcher: '^strata-engine-[0-9.]+-linux-x86_64-hip-rx6000\.tar\.gz$'
            use: hip_rx6000
          - name: '{{ .Values.p }}-strata-engine-linux-x86_64-hip-rx7900.tar.gz'
            matcher: '^strata-engine-[0-9.]+-linux-x86_64-hip-rx7900\.tar\.gz$'
            use: hip_rx7900
          - name: '{{ .Values.p }}-strata-engine-linux-x86_64-hip-rx9070.tar.gz'
            matcher: '^strata-engine-[0-9.]+-linux-x86_64-hip-rx9070\.tar\.gz$'
            use: hip_rx9070
          - name: '{{ .Values.p }}-strata-engine-linux-x86_64-hip-halo.tar.gz'
            matcher: '^strata-engine-[0-9.]+-linux-x86_64-hip-halo\.tar\.gz$'
            use: hip_halo
          - name: '{{ .Values.p }}-strata-engine-linux-x86_64-sycl.tar.gz'
            matcher: '^strata-engine-[0-9.]+-linux-x86_64-sycl\.tar\.gz$'
            use: sycl
          - name: '{{ .Values.p }}-strata-engine-linux-aarch64-cuda-cuda13.tar.gz'
            matcher: '^strata-engine-[0-9.]+-linux-aarch64-cuda-cuda13\.tar\.gz$'
            use: arm64_cuda13
        vars:
          # systemd_dounit needs the systemd eclass inherited. (The
          # in-kit ollama entry calls systemd_dounit without inheriting
          # it -- a latent bug on ollama's systemd side; this PR does
          # not touch ollama.)
          inherit:
            - systemd
          # Single source of truth for the engine USE surface, rendered at
          # template level, not expanded at bash level (the app-ai/maya
          # cuda_* and media-kit ffmpeg cpu_flags_* clusters' idiom). One
          # assets entry above per flag; keep the two in sync.
          engine_uses_amd64:
            - cuda12
            - cuda13
            - hip_rx6000
            - hip_rx7900
            - hip_rx9070
            - hip_halo
            - sycl
          engine_uses_arm64:
            - cuda13
          # amd64/arm64 come from the arch-gated control assets, the
          # opencode-bin/claude-code-bin precedent in this kit. The
          # systemd flag selects the unit flavour of the service
          # payload (the app-ai/ollama idiom: systemd unit with the
          # flag, OpenRC init.d without it; /etc/conf.d installs in
          # both cases and the unit reads it through EnvironmentFile).
          # No sys-apps/systemd dependency: exactly the ollama
          # precedent, which declares nothing for the systemd USE.
          iuse: |-
            amd64 arm64 systemd
            {{- range $f := .Values.engine_uses_amd64 }} {{ $f }}{{ end }}
            {{- range $f := .Values.engine_uses_arm64 }} arm64_{{ $f }}{{ end }}
          # Each backend USE requires its architecture, exactly the
          # relationship the review asked for: enabling an engine on an
          # arch without assets becomes unsatisfiable instead of silently
          # fetching nothing.
          required_use: |-
            {{- range $f := .Values.engine_uses_amd64 }} {{ $f }}? ( amd64 ){{ end }}
            {{- range $f := .Values.engine_uses_arm64 }} arm64_{{ $f }}? ( arm64 ){{ end }}
          desc: Strata Terminal and serving API for local AI (upstream binary)
          homepage: https://github.com/Niko1221/Strata
          # The repository license is MIT (GitHub license API: spdx_id MIT);
          # the bundle vendors CPython 3.12 and its wheels -- their licences
          # ship inside the tree (BUNDLE.json records the exact set).
          license: MIT
          # Prebuilt ELFs: the embedded CPython interpreter, its extension
          # modules and the bundled shared libraries must not be stripped.
          restrict: strip
          # Self-contained by design: python/bin/python3.12 --version and
          # the serve-dependency import probe (jinja2, yaml, regex, psutil,
          # requests, numpy, PIL, ssl, sqlite3) all pass from the moved
          # tree, and ldd over every extracted ELF resolves all 0 misses
          # outside the bundle except the glibc object files. The engine
          # bundles say the same (engine-component.json records relative
          # paths + sha256; SYSTEM-LIBS.txt lists only glibc objects plus
          # libstdc++/libgcc_s, both from the system toolchain every stage
          # ships; the relocated cuda13 tree ran "strata 0.1.62" rc 0 with
          # bundled libcublas/libcublasLt/libcudart resolving at the new
          # paths -- headless, no GPU executed).
          rdepend: |
            sys-libs/glibc
          # The control tarball is FLAT (6931 entries at the root: bin/,
          # python/, serve/, strata.py, ...); custom src_unpack below
          # extracts it into ${S} and each engine bundle into its own
          # directory (see the collision note in src_install).
          s: '${WORKDIR}/control'
          extra_envs:
            # Every ELF under /usr/lib/strata-bin is an upstream prebuild,
            # the USE-gated engine subtrees included; browser-kit's
            # QA_PREBUILT="*" is the whole-tree precedent and
            # app-ai/codex-bin the /usr/lib/<pn>/* one.
            - 'QA_PREBUILT="/usr/lib/strata-bin/*"'
          body: |
            src_unpack() {
              # All distfiles here are FLAT archives (no top-level dir) and
              # the engine bundles share file names with each other (each
              # ships its own ./strata, BUILD.json, engine-component.json),
              # so they must extract into separate directories; portage's
              # unpack() cannot target one, hence direct tar with the
              # control bundle at ${S} (the cp -a idiom of the control-only
              # shape this entry keeps) and each engine under
              # ${WORKDIR}/engine-dist/<distfile>/.
              mkdir -p "${S}" || die
              local f d have_control=0
              for f in ${A}; do
                d="${WORKDIR}/engine-dist/${f}"
                case "${f}" in
                  *-strata-control-*)
                    d="${S}"
                    have_control=1
                    ;;
                esac
                mkdir -p "${d}" || die
                tar xzf "${DISTDIR}/${f}" -C "${d}" || die "unpacking ${f}"
              done
              [ "${have_control}" -eq 1 ] ||
                die "no strata-control distfile for this architecture"
            }

            src_install() {
              local dest=/usr/lib/strata-bin
              dodir "${dest}"
              # Keep the bundle layout and upstream's exec bits (108
              # executables including the interpreter and bin/strata; doins
              # would flatten them to 644) via the cp -a idiom.
              cp -a "${S}/." "${D}${dest}/" || die "installing strata-control tree"
              # The bundle's launcher resolves its own path following
              # symlinks on purpose ("so `strata` can live on PATH", see
              # the header of bin/strata) -- sandbox-proved: dosym'd into
              # /usr/bin, --version rc 0 from the moved tree. The public
              # name is strata-control, NOT strata: app-ai/strata, the
              # SOURCE atom of the same upstream
              # (macaroni-os/kit-fixups#630), installs /usr/bin/strata --
              # file sets stay disjoint by construction, so no mutual
              # block is needed.
              dosym "${dest}/bin/strata" /usr/bin/strata-control

              # USE-selected engine bundles -> ${dest}/engines/<backend>/
              # (upstream's own backend token, e.g. cuda-cuda13). NOT
              # /usr/bin: the engine's main binary is also named strata
              # and must not collide with app-ai/strata (#630); the
              # directory is wired in by 'strata components add-build'
              # below, which is exactly its folder contract (strata, its
              # libraries and BUILD.json).
              local f name backend
              for f in "${WORKDIR}/engine-dist/"*-strata-engine-*; do
                [ -d "${f}" ] || continue
                name="$(basename "${f}")"
                backend="${name#*-strata-engine-}"
                backend="${backend%.tar.gz}"
                backend="${backend#linux-x86_64-}"
                backend="${backend#linux-aarch64-}"
                dodir "${dest}/engines/${backend}"
                cp -a "${f}/." "${D}${dest}/engines/${backend}/" ||
                  die "installing strata engine ${backend}"
              done

              # Service payload from the shared strata/ files_dir (the
              # macaroni-os/kit-fixups#631 review ask): conf.d always,
              # then exactly ONE init flavour (geaaru's rule on
              # kit-fixups#511 -- the init script goes in the else).
              # strata-control.service reads the same
              # /etc/conf.d/strata-control through EnvironmentFile-,
              # like the ollama unit reads /etc/conf.d/ollama.
              newconfd "${FILESDIR}"/strata-control.confd strata-control
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/strata-control.service
              else
                newinitd "${FILESDIR}"/strata-control.initd strata-control
              fi
            }

            pkg_postinst() {
              elog "${PF} is the upstream strata-control bundle installed"
              elog "under /usr/lib/strata-bin; start it as"
              elog "/usr/bin/strata-control."
              elog "Engines enabled via USE install under"
              elog "/usr/lib/strata-bin/engines/<backend>/ (NOT on PATH:"
              elog "the engine binary is also named strata and belongs to"
              elog "app-ai/strata, kit-fixups#630). Wire one up with the"
              elog "CLI's own contract (docs/SOURCE_INSTALL.md:"
              elog "'strata components add-build <folder>', the folder"
              elog "holding strata, its libraries and BUILD.json), e.g."
              elog "  strata-control components add-build \\"
              elog "    /usr/lib/strata-bin/engines/cuda-cuda13"
              elog "-- it is then a local, unsigned engine in use; 'use"
              elog "newest' goes back to upstream's signed runtime feed,"
              elog "which 'strata-control update' keeps serving either way"
              elog "(see macaroni-os/mark-issues#949)."
              elog "Headless serving: create a model run config first"
              elog "with 'strata-control launch' (the guided flow, or"
              elog "--yes --no-tui; that flow is where models are"
              elog "downloaded and prepared), point STRATA_PROFILE in"
              elog "/etc/conf.d/strata-control at its JSON path, then"
              elog "enable the service -- rc-update add"
              elog "strata-control default (OpenRC) or systemctl enable"
              elog "strata-control (USE=systemd, which installs the"
              elog "unit instead of the init script). The service runs"
              elog "'strata-control serve' and never downloads:"
              elog "without STRATA_PROFILE it refuses to start, on"
              elog "purpose. app-ai/strata, the source atom of the same"
              elog "upstream, ships the matching strata unit set from"
              elog "the same shared payload directory (the follow-up to"
              elog "macaroni-os/kit-fixups#631)."
            }
