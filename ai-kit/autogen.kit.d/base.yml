ai_github:
  generator: builtin-github
  defaults:
    category: app-ai
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases

  extensions_defs:
    golang:
      opts:

  packages:

    - docker-model:
        github:
          user: docker
          repo: model-runner
        extensions:
          - golang
        transform:
          - kind: string
            match: 'Docker Model Runner v'
            replace: ''
        vars:
          inherit:
            - go-module
          bdepend: |
            virtual/pkgconfig
            compress? ( app-arch/upx-bin )
          iuse: compress +runner
          body: |
            src_compile() {
              # Compile model-cli
              pushd cmd/cli >/dev/null
              local cli_ldflags=(
                "-X \"github.com/{{ .Values.github_user }}/{{ .Values.github_repo }}/cmd/cli/desktop.Version={{ .Values.version }}\""
              )
              local runner_ldflags=(
                "-X \"main.Version={{ .Values.version }}\""
              )
              go build \
                -ldflags "${cli_ldflags[*]}" \
                -o ../../{{ .Values.pn }} -v -x || die
              popd >/dev/null
              if use compress ; then
                upx --brute -1 {{ .Values.pn }} || die
              fi

              if use runner ; then
                go build \
                  -ldflags "${runner_ldflags[*]}" \
                  -o model-runner
              fi
            }
            src_install() {
              exeinto /usr/libexec/docker/cli-plugins
              doexe {{ .Values.pn }}
              dodoc README.md
              if use runner ; then
                dobin model-runner
              fi
            }

    - docker-agent:
        github:
          user: docker
        extensions:
          - golang
        vars:
          inherit:
            - go-module
          bdepend: |
            virtual/pkgconfig
            compress? ( app-arch/upx-bin )
          iuse: +compress
          body: |
            src_compile() {
              custom_ldflags=(
                "-X \"github.com/{{ .Values.github_user }}/{{ .Values.github_repo }}/pkg/version.Version={{ .Values.version }}\""
                "-X \"github.com/{{ .Values.github_user }}/{{ .Values.github_repo }}/pkg/version.Commit={{ .Values.sha }}\""
              )
              go build \
                -ldflags "${custom_ldflags[*]}" \
                -o {{ .Values.pn }} -v -x || die
              if use compress ; then
                upx --brute -1 {{ .Values.pn }} || die
              fi
            }
            src_install() {
              exeinto /usr/libexec/docker/cli-plugins
              doexe {{ .Values.pn }}
              dodoc README.md
            }

    - ollama:
        # TODO:
        # - improve integration with ROCm
        extensions:
          - golang
        vars:
          inherit:
            - go-module
            - cmake
            - user
          # The single source of truth for the NVIDIA compute capabilities
          # this kit can target, one sm_* per line. The iuse, required_use,
          # and the src_configure architecture loop are all rendered from
          # this list, so a new generation is added here and nowhere else.
          #
          # The gfxcard-nvidia-<gen> ego mix-ins (core-kit) enable a
          # generation's flags:
          #   maxwell    sm_50 sm_52
          #   pascal     sm_60 sm_61
          #   volta      sm_70
          #   turing     sm_75
          #   ampere     sm_80 sm_86 sm_87
          #   ada        sm_89
          #   hopper     sm_90 sm_90a
          #   blackwell  sm_100 sm_101 sm_103 sm_110 sm_120 sm_121
          #
          # sm_101 (Jetson Thor) is renumbered to sm_110 by the 13.x
          # toolkit, so it is declared alongside it.
          gpus:
            #   maxwell
            - sm_50
            - sm_52
            #   pascal
            - sm_60
            - sm_61
            #   volta
            - sm_70
            #   turing
            - sm_75
            #   ampere
            - sm_80
            - sm_86
            - sm_87
            #   ada
            - sm_89
            #   hopper
            - sm_90
            - sm_90a
            #   blackwell
            - sm_100
            - sm_101
            - sm_103
            - sm_110
            - sm_120
            - sm_121

          iuse: |-
            systemd clang cuda nccl vulkan
            {{- range $g := .Values.gpus }} cuda_{{ $g }}{{ end }}
          required_use: |-
            nccl? ( cuda )
            {{- range $g := .Values.gpus }} cuda_{{ $g }}? ( cuda ){{ end }}
          bdepend: |
            >=dev-lang/go-1.24
            clang? ( sys-devel/clang )
          rdepend: |
            vulkan? (
              media-libs/vulkan-loader
              media-libs/shaderc
            )
            cuda? (
              dev-util/nvidia-cuda-toolkit
            )
            nccl? (
              dev-util/nvidia-nccl
            )
          depend: '${RDEPEND}'
          # It seems that trying to set this flags
          # breaks cmake. An upstream bug?
          #  -DGGML_CUDA=$(usex cuda ON OFF)
          #  -DGGML_VULKAN=$(usex vulkan ON OFF)
          body: |
            pkg_setup() {
              ebegin "Ensuring ollama user/group exist"
              enewgroup ollama
              enewuser ollama -1 -1 /var/lib/ollama ollama
            }
            src_configure() {
              addpredict /proc/self/task
              local mycmakeargs=()
              if use clang ; then
                mycmakeargs+=(
                  -DCMAKE_C_COMPILER=clang
                  -DCMAKE_CXX_COMPILER=clang++
                )
              fi
              if use cuda ; then
                # Upstream builds GPU backend payloads only when asked to
                # (OLLAMA_LLAMA_BACKENDS, empty by default), and each payload
                # targets one CUDA major. nvidia-cuda-toolkit allows only one
                # CUDA major at a time, so detect the installed one and build
                # only the matching backend.
                local cuda_major=
                cuda_major=$(
                  nvcc --version 2>/dev/null |
                  sed -n 's/.*release \([0-9][0-9]*\).*/\1/p'
                )
                case ${cuda_major:-12} in
                  13)
                    mycmakeargs+=(
                      -DOLLAMA_LLAMA_BACKENDS=cuda_v13
                    )
                    ;;
                  *)
                    [[ -z ${cuda_major} ]] && \
                      ewarn "Could not detect the CUDA toolkit major version (nvcc not found); defaulting to the CUDA 12 backend"
                    mycmakeargs+=(
                      -DOLLAMA_LLAMA_BACKENDS=cuda_v12
                    )
                    ;;
                esac
                # The architecture list comes from the enabled cuda_sm_*
                # flags, filtered against the set the installed toolkit
                # major can target. CUDA only drops architectures at major
                # boundaries, so the per-major sets are:
                #   11: 50 52 60 61 70 75 80 86 87 89 90
                #   12: 50 52 60 61 70 75 80 86 87 89 90 90a 100 103
                #        120 121
                #   13: 75 80 86 87 89 90 90a 100 103 110 120 121
                # sm_101 (Jetson Thor) is not a general nvcc target in
                # 11.x/12.x and is renumbered to sm_110 in 13.x, so it
                # only builds with the 13 major.
                local cuda_supported
                case ${cuda_major:-12} in
                  13)
                    cuda_supported="75 80 86 87 89 90 90a 100 103 110 120 121"
                    ;;
                  11)
                    cuda_supported="50 52 60 61 70 75 80 86 87 89 90"
                    ;;
                  *)
                    cuda_supported="50 52 60 61 70 75 80 86 87 89 90 90a 100 103 120 121"
                    ;;
                esac
                local arch cuda_archs=() cuda_dropped=()
                for arch in {{ range $i, $g := .Values.gpus }}{{ trimPrefix "sm_" $g }} {{ end }}; do
                  use cuda_sm_${arch} || continue
                  if has "${arch}" ${cuda_supported} ; then
                    cuda_archs+=("${arch}")
                  else
                    cuda_dropped+=("${arch}")
                  fi
                done
                if [[ ${#cuda_archs[@]} -gt 0 || ${#cuda_dropped[@]} -gt 0 ]] ; then
                  if [[ ${#cuda_dropped[@]} -gt 0 ]] ; then
                    ewarn "Dropping CUDA architectures unsupported by the installed toolkit (major ${cuda_major:-unknown}): $(join ' ' "${cuda_dropped[@]}")"
                  fi
                  if [[ ${#cuda_archs[@]} -eq 0 ]] ; then
                    die "all enabled cuda_sm_* flags are unsupported by the installed CUDA toolkit; enable flags matching your card, or override with MYCMAKEARGS=\"-DCMAKE_CUDA_ARCHITECTURES=...\""
                  fi
                  mycmakeargs+=(
                    -DCMAKE_CUDA_ARCHITECTURES="$(join ';' "${cuda_archs[@]}")"
                  )
                fi
                mycmakeargs+=(
                  -DGGML_CUDA_NCCL=$(usex nccl ON OFF)
                )
              fi
              cmake_src_configure
            }
            src_prepare() {
              default
              go-module_src_prepare
              cmake_src_prepare
            }
            src_compile() {
              cmake_src_compile
              local ollama_ldflags=(
                 "-X github.com/ollama/ollama/version.Version=${PV}"
              )
              go build --ldflags "${ollama_ldflags[*]}" -mod=mod . || die "compile failed"
            }
            src_install() {
              cmake_src_install
              dobin {{ .Values.pn }}
              diropts -m0750 -o ollama -g ollama
              dodir /var/lib/ollama /var/lib/ollama/models/
              keepdir /var/lib/ollama/
              diropts
              dodoc README.md
              newconfd "${FILESDIR}"/ollama.confd ollama
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/ollama.service
              else
                newinitd "${FILESDIR}"/ollama.initd ollama
              fi
              newenvd "${FILESDIR}"/ollama.envd "90ollama"
            }

    - opencode:
        github:
          user: anomalyco
          repo: opencode
          # Version detection from the git tags (per the request in
          # mark-issues#840): the v-prefix is stripped by builtin-github.
          # The tags are the upstream source-of-truth release line; note the
          # tag listing currently leads with the 2.x line plus a vscode-*
          # series (skipped by the generator's version parsing).
          query: tags
        # Source build following upstream's own non-binary recipe
        # (nix/opencode.nix + nix/node_modules.nix in the repo). Repo facts
        # verified against the tag tarballs v1.19.4 and v2.1.4:
        #   * TypeScript/Bun workspaces monorepo; packageManager: bun@1.4.4.
        #   * The CLI binary is produced by script/build.ts of the CLI
        #     workspace (packages/opencode at v1.x, renamed to packages/cli
        #     at v2.x) via Bun.build({ compile: { target:
        #     "bun-linux-x64|arm64" } }): bun bundles the app and embeds its
        #     runtime, so dev-lang/go is NOT involved (the old Go TUI is
        #     gone; no go.mod exists in either tag, the TUI is TypeScript
        #     via @opentui/core, and dev-lang/go is deliberately absent).
        #   * dev-lang/bun IS needed for the build (BDEPEND below, the
        #     any-of group also accepts the binary flavour dev-lang/bun-bin
        #     that landed in lang-kit meanwhile); the build additionally
        #     needs npm-registry access for "bun install --frozen-lockfile"
        #     (node_modules is not vendored in the tarball; upstream nix
        #     isolates that into a separate hashed fixed-output derivation,
        #     and build.ts even re-fetches cross-libc native packages when
        #     not skipped). See PR #480 for the evidence; this definition
        #     is the honest best-effort source spec requested upstream-side.
        vars:
          desc: The open source AI coding agent (built from sources)
          # The bun-compiled output embeds a runtime in the ELF; stripping it
          # post-build is exactly what the pnpm-bin/ollama binaries avoid.
          # "bun install" fetches from registry.npmjs.org at build time (the
          # tag tarballs do not vendor node_modules), so opt out of the
          # network sandbox like net-libs/deno does.
          restrict: 'strip network-sandbox'
          bdepend: '|| ( dev-lang/bun dev-lang/bun-bin )'
          # /usr/bin/opencode is also shipped by the binary flavour of this
          # same autogen group; the pair mutually blocks (same idiom as the
          # RDEPEND="!cat/pkg" blocker lines used across the core-kit tree).
          rdepend: '!app-ai/opencode-bin'
          body: |
            src_prepare() {
              default
              # packages/script/src/index.ts hard-fails unless the running
              # bun satisfies ^1.4.4 (root package.json packageManager pin).
              # Downgrade the throw to a warning, exactly like the postPatch
              # of upstream's nix/opencode.nix derivation.
              sed -i \
                's/throw new Error(`This script requires bun/console.warn(`Warning: This script requires bun/' \
                packages/script/src/index.ts || die
            }

            src_configure() { :; }

            src_compile() {
              # Keep bun's download cache inside the build area.
              export BUN_INSTALL_CACHE_DIR="${T}/bun-cache"

              # Pin the embedded version/channel: without OPENCODE_VERSION
              # the shared build script queries registry.npmjs.org at build
              # time, and without OPENCODE_CHANNEL it shells out to git,
              # neither of which belongs in an ebuild sandbox (nix recipe
              # sets the same pair).
              export OPENCODE_VERSION="{{ .Values.pv }}"
              export OPENCODE_CHANNEL="prod"
              # The bundle is memory-hungry; same bump as nix/opencode.nix.
              export NODE_OPTIONS="--max-old-space-size=4096"

              # Install the JS dependency graph from the checked-in lockfile,
              # scoped like upstream's nix/node_modules.nix recipe (root
              # workspace for peer resolution + the CLI, the embedded web UI
              # and the desktop workspace). Scripts are skipped: they only
              # set up dev tooling. NOTE: this needs network access; see the
              # spec comment and PR #480 for the offline-build discussion.
              bun install \
                --filter './' \
                --filter './packages/cli' \
                --filter './packages/desktop' \
                --filter './packages/app' \
                --frozen-lockfile \
                --ignore-scripts \
                --no-progress || die "bun install failed (needs npm-registry access)"

              # --single: build only the native glibc target of this ARCH
              #   (v1 wrote dist/opencode-linux-<arch>/, v2 dist/cli-linux-
              #   <arch>/, so the install phase globs for the binary).
              # --skip-install: dependency graph prepared just above.
              local clipkg=packages/cli
              [[ -d ${clipkg} ]] || clipkg=packages/opencode
              cd "${clipkg}" || die
              bun --bun ./script/build.ts --single --skip-install || die
            }

            src_install() {
              # dist/<target>/bin/opencode, exactly one target with --single.
              local bin=$(find packages/cli/dist packages/opencode/dist \
                -type f -path '*/bin/opencode' -print -quit 2>/dev/null)
              [[ -n ${bin} ]] || die "compiled binary not found under packages/*/dist"
              newbin "${bin}" opencode
            }

    - opencode-bin:
        github:
          user: anomalyco
          repo: opencode
          # Upstream has thousands of tags (including the vscode-* line),
          # the tag listing never reaches the current releases in one page
          # fetch, so do not require tag presence (same as llama_cpp above).
          ignore_tags: true
        # simple.tmpl (as used by dev-util/pnpm-bin), not the group's
        # simple-github.tmpl: the latter emits a post_src_unpack() that
        # renames the source tarball unpack dir, but this atom downloads
        # only prebuilt release assets, so there is nothing to rename.
        template: ../../templates/simple.tmpl
        # Upstream (renamed from sst/opencode) publishes bun-compiled
        # standalone executables as release assets. The auto-generated
        # release tarball is source-only, so download the per-arch linux
        # asset instead (same scheme as dev-util/pnpm-bin). The tarballs
        # ship the single ./opencode executable and nothing else; the
        # -musl and -baseline variants are skipped: mark is glibc and
        # the baseline builds target pre-AVX2 CPUs only.
        # Note: the local asset names keep the "opencode-" distfile prefix
        # so distfiles stay identical to the previously verified ones.
        assets:
          - name: 'opencode-{{ .Values.version }}-amd64-linux.tar.gz'
            matcher: '^opencode-linux-x64\.tar\.gz$'
            use: amd64
          - name: 'opencode-{{ .Values.version }}-arm64-linux.tar.gz'
            matcher: '^opencode-linux-arm64\.tar\.gz$'
            use: arm64
        vars:
          iuse: amd64 arm64
          desc: The open source AI coding agent (upstream binary)
          restrict: strip
          # See the source-flavoured entry above: the two packages install
          # the same /usr/bin/opencode and must not coexist.
          rdepend: '!app-ai/opencode'
          # The asset tarballs carry the bare ./opencode executable at the
          # archive root (no top-level directory), so the default
          # src_unpack() extracts it straight into ${WORKDIR}; pointing S
          # there (same s: override idiom used across the dev-kit autogen
          # specs) lets src_install pick it up without any custom phase.
          s: '${WORKDIR}'
          extra_envs:
            - 'QA_PREBUILT="/usr/bin/opencode"'
          body: |
            src_install() {
              newbin opencode opencode
            }

# pi-bin and pi track the same upstream repository (earendil-works/pi),
# so per the macaroni-os/kit-fixups#512 review they live in a dedicated
# cluster whose defaults define the common keys once and the package
# entries keep only the flavour-specific vars/assets/body.
pi:
  generator: builtin-github
  defaults:
    category: app-ai
    files_dir: "{{ .Values.pn }}"
    # simple.tmpl for both flavours, not simple-github.tmpl: they download
    # uploaded release assets whose archives unpack into known directories
    # (the per-platform binaries into a versionless pi/ wrapper directory
    # that upstream build-binaries.sh adds "for mise compatibility", the
    # source snapshot into pi-<ver>/), so there is no <user>-<repo>-*
    # unpack dir for the generated post_src_unpack() to rename (and it
    # would match nothing).
    template: ../../templates/simple.tmpl
    github:
      user: earendil-works
      # The upstream repository is earendil-works/pi for both flavours:
      # equal to PN for pi, but pinned explicitly here because the -bin
      # postfix (PR #512 review) makes that one PN differ from it.
      repo: pi
    vars:
      # strip: the installed ELF is bun-compiled and embeds its own
      # runtime in both flavours (pi builds with the same bun --compile
      # recipe). network-sandbox: pi needs registry.npmjs.org because
      # npm ci installs the lockfile (the source archive is
      # dependency-free by design), like the opencode source entry in PR
      # #480; pi-bin restricts it out too, same option the backrest entry
      # in core-server-kit/autogen.kit.d/tools.yml uses, as asked in the
      # PR #512 review.
      restrict: 'strip network-sandbox'
      # QA_PREBUILT is identical in both flavours: /usr/lib/pi/pi is the
      # bun-compiled ELF and the native/ tree carries the TUI
      # linux-platform-*.node addons, checked-in prebuilds staged
      # verbatim, so both must survive the QA binary scan untouched.
      extra_envs:
        - 'QA_PREBUILT="/usr/lib/pi/pi /usr/lib/pi/native/*/*/*/*.node"'
  packages:

    - pi-bin:
        # Upstream ships bun-compiled standalone executables of its
        # "AI agent toolkit: unified LLM API, agent loop, TUI, coding
        # agent CLI" as per-platform release assets
        # (macaroni-os/mark-issues#853). The pi-*-source.tar.gz asset is
        # the source snapshot handled by the pi entry below and the
        # pi-coding-agent-install-package.* / SHA256SUMS assets are
        # installer helper files; none belong in the distfiles.
        # darwin/windows assets are skipped (mark is linux-only). Asset
        # names verified against v1.4.0; the release titles are plain
        # semver ("v1.4.0"), so the default version parsing applies and
        # no transform is needed.
        assets:
          - name: 'pi-{{ .Values.version }}-amd64-linux.tar.gz'
            matcher: '^pi-linux-x64\.tar\.gz$'
            use: amd64
          - name: 'pi-{{ .Values.version }}-arm64-linux.tar.gz'
            matcher: '^pi-linux-arm64\.tar\.gz$'
            use: arm64
        vars:
          iuse: amd64 arm64
          desc: 'AI agent toolkit: unified LLM API, agent loop, TUI, coding agent CLI (upstream binary)'
          # /usr/bin/pi is also shipped by the source-built flavour below;
          # the pair mutually blocks, same idiom as the opencode /
          # opencode-bin entry pair in the ai_github cluster (PR #480).
          rdepend: '!app-ai/pi'
          # pi-bin is the only flavour that needs an explicit S: the asset
          # tarball unpacks into the versionless pi/ wrapper directory
          # (upstream build-binaries.sh adds it "for mise
          # compatibility"), where portage's default S=${WORKDIR}/${P}
          # would expect pi-bin-<ver>/ (macaroni-os/kit-fixups#512
          # review: "This is the default. It's only needed for pi-bin").
          s: '${WORKDIR}/pi'
          # The bun-compiled binary resolves every runtime sidecar
          # relative to dirname(process.execPath) (/proc/self/exe, which
          # follows symlinks): packages/coding-agent/src/config.ts
          # derives the package dir (isBunBinary/getPackageDir), the
          # theme/ directory and export-html/ from it, photon.ts loads
          # photon_rs_bg.wasm next to the executable, and the TUI probes
          # the native/ prebuilds there last. So the resource tree is
          # installed as a whole under /usr/lib/pi and /usr/bin/pi is a
          # symlink into it. docs/ is installed because the binary
          # self-references package-relative docs paths at runtime: the
          # model-catalog hint prints absolute <pkgdir>/docs/*.md (proved
          # with 'pi --list-models' against a docs-less install, and the
          # executable embeds providers.md/models.md/extensions.md
          # references). examples/ is demo TypeScript source the program
          # never reads, so it is not installed (the same content lives
          # in the upstream repo); README/CHANGELOG go in via dodoc.
          # LICENSE (MIT) is taken from the GitHub API, same as the
          # opencode-bin entry in the ai_github cluster.
          body: |
            src_install() {
              # Install the executable together with every sidecar in
              # one directory so the execPath-relative lookups keep
              # working through the /usr/bin/pi symlink.
              insinto /usr/lib/pi
              doins -r native theme export-html assets docs
              doins photon_rs_bg.wasm package.json
              exeinto /usr/lib/pi
              doexe pi
              dosym /usr/lib/pi/pi /usr/bin/pi
              dodoc README.md CHANGELOG.md
            }

    - pi:
        # Source-built sibling of app-ai/pi-bin above, completing the
        # opencode / opencode-bin pattern from PR #480
        # (macaroni-os/mark-issues#853).
        # Why the UPLOADED source asset and not the GitHub-generated tag
        # tarball: the release pipeline first runs npm run hydrate:model-data
        # and force-adds the git-ignored result (packages/ai/src/
        # models.generated.ts plus packages/ai/src/providers/data/*.json)
        # into the archive; the validator in scripts/create-source-archive.sh
        # requires those paths and the checked-in packages/tui/native
        # prebuilds, while refusing node_modules/ and binaries/. The
        # auto-generated tarball of the same commit lacks the model data,
        # so npm run build:offline cannot work from it; the uploaded asset
        # is the only complete source snapshot, and it is exactly what CI
        # compiles the release binaries from (.github/workflows/
        # build-binaries.yml).
        # Build recipe = scripts/build-binaries.sh --offline-model-data
        # restricted to the linux branch for ${ARCH}: npm ci --ignore-scripts,
        # npm run build:offline, then the bun --compile of the coding-agent
        # CLI plus the sidecar staging, so the installed tree matches the
        # binary flavour. CI pins bun 1.4.4 and node 22 (root package.json
        # engines: node >= 22.19.0), hence the BDEPEND floor below.
        assets:
          - name: 'pi-{{ .Values.version }}-source.tar.gz'
            # Anchored at the end with escaped dots: the only v1.4.0 asset
            # ending in -source.tar.gz is pi-1.4.0-source.tar.gz; the binary
            # flavour assets (pi-linux-x64.tar.gz & co), the installer
            # helpers (pi-coding-agent-install-package.*) and SHA256SUMS
            # cannot match.
            matcher: '\-source\.tar\.gz$'
        vars:
          desc: 'AI agent toolkit: unified LLM API, agent loop, TUI, coding agent CLI (built from sources)'
          # No s: key here, unlike pi-bin above: the uploaded source
          # archive unpacks into a pi-<ver>/ root (scripts/
          # create-source-archive.sh git-archives with prefix
          # "pi-${version}"), which is exactly portage's default
          # S=${WORKDIR}/${P} (macaroni-os/kit-fixups#512 review).
          bdepend: |
            >=net-libs/nodejs-22.19.0
            || ( dev-lang/bun dev-lang/bun-bin )
          # Same /usr/bin/pi as the binary flavour above; the pair
          # mutually blocks (opencode idiom, PR #480).
          rdepend: '!app-ai/pi-bin'
          body: |
            src_compile() {
              # Upstream release recipe (scripts/build-binaries.sh
              # --offline-model-data), linux only. Keep npm's cache and
              # HOME inside the build area.
              export HOME="${T}"
              export npm_config_cache="${T}/npm-cache"

              # Install the JS dependency graph from the committed
              # package-lock.json (.npmrc has save-exact=true, so pins
              # are exact). --ignore-scripts exactly like upstream: the
              # hooks are dev tooling (the husky prepare would want git).
              npm ci --ignore-scripts || die "npm ci failed (needs npm-registry access)"

              # Workspace chain build telemetry -> chord -> tui ->
              # codemode -> mcp -> ai:build:offline -> durable -> env ->
              # agent -> coding-agent; the offline variant never shells
              # out to hydrate:model-data, the hydrated model snapshot
              # is compiled in from the archive.
              npm run build:offline || die

              cd packages/coding-agent || die
              local bun_target platform_arch
              case ${ARCH} in
                amd64) bun_target=bun-linux-x64-baseline; platform_arch=linux-x64 ;;
                arm64) bun_target=bun-linux-arm64; platform_arch=linux-arm64 ;;
                *) die "unsupported ARCH: ${ARCH}" ;;
              esac

              # --compile embeds the bun runtime (hence RESTRICT=strip);
              # the two worker scripts must stay explicit entrypoints so
              # that they are embedded (upstream comment), and the
              # autoload opt-outs are upstream issues #7684 and #10473.
              bun build --compile --no-compile-autoload-bunfig \
                --no-compile-autoload-dotenv --target="${bun_target}" \
                ./dist/bun/cli.js ./src/utils/image-resize-worker.ts \
                ./src/extensions/codemode/worker.ts --outfile dist/pi || die

              # Stage the release directory like the "Copy shared files"
              # loop of scripts/build-binaries.sh. examples/ is skipped:
              # demo TypeScript the program never reads, and the pi-bin
              # flavour does not install it either.
              local stage=${S}/pi-stage
              mkdir -p "${stage}"/theme "${stage}"/assets \
                "${stage}"/native/linux/prebuilds || die
              cp dist/pi package.json README.md CHANGELOG.md "${stage}"/ || die
              cp ../../node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm \
                "${stage}"/ || die
              cp dist/modes/interactive/theme/*.json "${stage}"/theme/ || die
              cp dist/modes/interactive/assets/* "${stage}"/assets/ || die
              cp -r dist/core/export-html docs "${stage}"/ || die
              cp -R ../tui/native/linux/prebuilds/"${platform_arch}" \
                "${stage}"/native/linux/prebuilds/ || die
            }

            src_install() {
              # Identical file set and layout to the pi-bin entry above:
              # the executable resolves every runtime sidecar relative to
              # dirname(process.execPath) (getPackageDir in
              # packages/coding-agent/src/config.ts), so the whole staged
              # tree goes under /usr/lib/pi and /usr/bin/pi is a symlink
              # into it; README/CHANGELOG go in via dodoc.
              cd "${S}/pi-stage" || die
              insinto /usr/lib/pi
              doins -r native theme export-html assets docs
              doins photon_rs_bg.wasm package.json
              exeinto /usr/lib/pi
              doexe pi
              dosym /usr/lib/pi/pi /usr/bin/pi
              dodoc README.md CHANGELOG.md
            }

llama_cpp:
  generator: builtin-github
  defaults:
    category: app-ai
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    markdevkit_min_version: 0.35.0
    github:
      user: ggml-org
      repo: llama.cpp
      ignore_tags: true
    transform:
      - kind: regex
        match: "b"
        replace: "0.0."
    vars:
      inherit:
        - cmake
      nvidia_cuda_capability:
        - 120
        - 100
        - 87
        - 89
        - 75
        #- 61
        # Maybe we can use all directly.

      # The single source of truth for the NVIDIA compute capabilities
      # this kit can target, one sm_* per line. The iuse, required_use,
      # and the src_configure architecture loop are all rendered from
      # this list, so a new generation is added here and nowhere else.
      #
      # The gfxcard-nvidia-<gen> ego mix-ins (core-kit) enable a
      # generation's flags:
      #   maxwell    sm_50 sm_52
      #   pascal     sm_60 sm_61
      #   volta      sm_70
      #   turing     sm_75
      #   ampere     sm_80 sm_86 sm_87
      #   ada        sm_89
      #   hopper     sm_90 sm_90a
      #   blackwell  sm_100 sm_101 sm_103 sm_110 sm_120 sm_121
      #
      # sm_101 (Jetson Thor) is renumbered to sm_110 by the 13.x
      # toolkit, so it is declared alongside it.
      gpus:
        #   maxwell
        - sm_50
        - sm_52
        #   pascal
        - sm_60
        - sm_61
        #   volta
        - sm_70
        #   turing
        - sm_75
        #   ampere
        - sm_80
        - sm_86
        - sm_87
        #   ada
        - sm_89
        #   hopper
        - sm_90
        - sm_90a
        #   blackwell
        - sm_100
        - sm_101
        - sm_103
        - sm_110
        - sm_120
        - sm_121

      # cuda-native: Used to force local GPU identification. It is
      # kept as a per-emerge escape hatch because the toolkit auto-
      # detection is not perfect; it is outclassed by the cuda_sm_*
      # flags and the raw -D of MYCMAKEARGS.
      iuse: |-
        static blas cuda nccl vulkan cuda-native
        {{- range $g := .Values.gpus }}
        cuda_{{ $g }}
        {{- end }}
      required_use: |-
        nccl? ( cuda )
        {{- range $g := .Values.gpus }}
        cuda_{{ $g }}? ( cuda )
        {{- end }}
      cdepend: |
        cuda? (
          dev-util/nvidia-cuda-toolkit
        )
        nccl? (
          dev-util/nvidia-nccl
        )
        vulkan? (
          dev-util/vulkan-tools
          media-libs/vulkan-layers
          media-libs/vulkan-loader
          media-libs/shaderc
          sci-libs/gsl
        )
        blas? (
          virtual/blas
          virtual/lapack
        )
        {{ .Values.cdepend_extra }}
      bdepend: |
        vulkan? (
          dev-util/vulkan-headers
        )
      rdepend: '${CDEPEND}'
      depend: '${CDEPEND}'
      body: |
        src_configure() {
          addpredict /proc/self/task
          if use blas ; then
            # It seems that -lcblas -lblas is not injected. It's inject only -llapack
            export LDFLAGS="${LDFLAGS} -lcblas -lblas"
          fi
          export BUILD_COMMIT={{ .Values.sha }}

          local mycmakeargs=(
            -DBUILD_SHARED_LIBS=$(usex static OFF ON)
            -DGGML_CUDA=$(usex cuda ON OFF)
            -DGGML_BLAS=$(usex blas ON OFF)
            -DGGML_VULKAN=$(usex vulkan ON OFF)
            -DGGML_BLAS_VENDOR=Generic
            -DGGML_CUDA_ENABLE_UNIFIED_MEMORY=1
          )
          local cuda_archs= cuda_major= cuda_supported=
          local arch cuda_flagged=() cuda_dropped=()
          if use cuda ; then
            # Multi-GPU support is optional: nccl is OFF by default and a
            # rebuild of dev-util/nvidia-nccl (or nvidia-cuda-toolkit,
            # which it depends on) marks this package to rebuild, since it
            # is a build dependency.
            mycmakeargs+=(
              -DGGML_CUDA_NCCL=$(usex nccl ON OFF)
            )
            # The architecture list comes from the enabled cuda_sm_*
            # flags, filtered against the set the installed toolkit
            # major can target (same per-major sets as
            # app-ai/ollama; CUDA only drops architectures at major
            # boundaries, and sm_101 is renumbered to sm_110 in 13.x).
            cuda_major=$(
              nvcc --version 2>/dev/null |
              sed -n 's/.*release \([0-9][0-9]*\).*/\1/p'
            )
            case ${cuda_major:-12} in
              13)
                cuda_supported="75 80 86 87 89 90 90a 100 103 110 120 121"
                ;;
              11)
                cuda_supported="50 52 60 61 70 75 80 86 87 89 90"
                ;;
              *)
                [[ -z ${cuda_major} ]] && \
                  ewarn "Could not detect the CUDA toolkit major version (nvcc not found); defaulting to the CUDA 12 supported set"
                cuda_supported="50 52 60 61 70 75 80 86 87 89 90 90a 100 103 120 121"
                ;;
            esac
            for arch in {{ range $i, $g := .Values.gpus }}{{ trimPrefix "sm_" $g }} {{ end }}; do
              use cuda_sm_${arch} || continue
              if has "${arch}" ${cuda_supported} ; then
                cuda_flagged+=("${arch}")
              else
                cuda_dropped+=("${arch}")
              fi
            done
            if [[ ${#cuda_flagged[@]} -gt 0 || ${#cuda_dropped[@]} -gt 0 ]] ; then
              if [[ ${#cuda_dropped[@]} -gt 0 ]] ; then
                ewarn "Dropping CUDA architectures unsupported by the installed toolkit (major ${cuda_major:-unknown}): $(join ' ' "${cuda_dropped[@]}")"
              fi
              if [[ ${#cuda_flagged[@]} -eq 0 ]] ; then
                die "all enabled cuda_sm_* flags are unsupported by the installed CUDA toolkit; enable flags matching your card, or override with MYCMAKEARGS=\"-DCMAKE_CUDA_ARCHITECTURES=...\""
              fi
              cuda_archs="$(join ';' "${cuda_flagged[@]}")"
            fi
          fi
          # Precedence: the enabled cuda_sm_* flags, then the explicit
          # cuda-native USE flag (per-emerge choice), then the package
          # default. A raw -D in MYCMAKEARGS still speaks last, since the
          # cmake eclass appends it after mycmakeargs and cmake's last -D
          # wins.
          if [[ -z ${cuda_archs} ]] ; then
            if use cuda-native ; then
              cuda_archs=native
            else
              cuda_archs='{{ .Values.nvidia_cuda_capability | join ";" }}'
            fi
          fi
          mycmakeargs+=(
            -DCMAKE_CUDA_ARCHITECTURES="${cuda_archs}"
          )
          cmake_src_configure
        }
        src_install() {
          cmake_src_install
          dodoc README.md SECURITY.md CONTRIBUTING.md
        }



  extensions_defs:
    golang:
      opts:

  packages:

    - llama-cpp:
        github:
          experimental: true
          match: '^b.*'
        vars:
          slot: snapshot
          cdepend_extra: |
            !app-ai/llama-cpp:0

    - llama-cpp:
        github:
          match: '^[^b]'
          # keep this high because there
          # are a lot of snapshots.
          # If this fails, also the snapshot fails.
          num_pages: 10
        vars:
          cdepend_extra: |
            !app-ai/llama-cpp:snapshot
