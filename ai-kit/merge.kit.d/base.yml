sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-xl"

- name: "ai-kit"
  url: "https://github.com/macaroni-os/ai-kit"
  branch: "mark-xl"

target:
  name: ai-kit
  url: "https://github.com/macaroni-os/ai-kit"
  branch: mark-v

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-ai/docker-agent
    - pkg: app-ai/docker-model

    - pkg: app-ai/ollama
    - pkg: app-ai/llama-cpp
