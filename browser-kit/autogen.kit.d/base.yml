  packages:
    - firefox:
        vars:
          # This system will be unable to play DRM-protected content without CONFIG_SECCOMP kernel option
          homepage: https://www.mozilla.org/en-US/firefox/
          desc: Firefox Web Browser
          license: MPL-2.0 GPL-2 LGPL-2.1
          python_compat: python3+
          inherit:
            - desktop
            - flag-o-matic
            - gnome2-utils
            - multiprocessing
            - toolchain-funcs
            - pax-utils
            - python-any-r1
            - virtualx
            - xdg
          # Set statically LLVM version to ensure compilation
          # of the package with the tested release.
          llvm_slot: 20
          patches:
            - 00-fix-fortify-system-wrappers.patch
            - 01-fix-rust-target.patch
            - 02-bmo-847568-support-system-harfbuzz-graphite2.patch
            - 03-loong0001-Enable-WebRTC-for-loongarch64.patch
            - 04-loong0001-Enable-WebRTC-for-loongarch64.patch
            - 05-loong0004-Fix-ycbcr-chromium_types-warning.patch
            - 06-sandbox-sched_setscheduler.patch
            - 07-rust-lto-thin.patch

          # +system-av1 requires dav1d 1.5. keep off for now.
          iuse: |
            amd64 +clang dbus debug eme-free hwaccl jack libproxy lto +openh264 pgo pulseaudio sndio
            system-av1 +system-harfbuzz +system-icu +system-jpeg +system-libevent +system-libvpx
            system-png system-python-libs +system-webp +gmp-autoupdate screecast +X
            +pulseaudio selinux wayland wifi screencast system-pipewire telemetry
            l10n_ach l10n_af l10n_an l10n_ar l10n_ast l10n_az l10n_be l10n_bg l10n_bn l10n_br
            l10n_bs l10n_ca-valencia l10n_ca l10n_cak l10n_cs l10n_cy l10n_da l10n_de l10n_dsb
            l10n_el l10n_en-CA l10n_en-GB l10n_en-US l10n_eo l10n_es-AR l10n_es-CL l10n_es-ES
            l10n_es-MX l10n_et l10n_eu l10n_fa l10n_ff l10n_fi l10n_fr l10n_fur l10n_fy-NL
            l10n_ga-IE l10n_gd l10n_gl l10n_gn l10n_gu-IN l10n_he l10n_hi-IN l10n_hr l10n_hsb
            l10n_hu l10n_hy-AM l10n_ia l10n_id l10n_is l10n_it l10n_ja l10n_ka l10n_kab l10n_kk
            l10n_km l10n_kn l10n_ko l10n_lij l10n_lt l10n_lv l10n_mk l10n_mr l10n_ms l10n_my
            l10n_nb-NO l10n_ne-NP l10n_nl l10n_nn-NO l10n_oc l10n_pa-IN l10n_pl l10n_pt-BR
            l10n_pt-PT l10n_rm l10n_ro l10n_ru l10n_sat l10n_sc l10n_sco l10n_si l10n_sk l10n_skr
            l10n_sl l10n_son l10n_sq l10n_sr l10n_sv-SE l10n_szl l10n_ta l10n_te l10n_tg l10n_th
            l10n_tl l10n_tr l10n_trs l10n_uk l10n_ur l10n_uz l10n_vi l10n_xh l10n_zh-CN l10n_zh-TW
          required_use: |
            debug? ( !system-av1 )
            pgo? ( lto )
            wayland? ( dbus )
            wifi? ( dbus )
            || ( X wayland )
            screecast? ( wayland )
          bdepend: |
            ${PYTHON_DEPS}
            app-arch/unzip
            app-arch/zip
            dev-util/cbindgen
            net-libs/nodejs
            virtual/pkgconfig
            virtual/rust
            || (
              (
                sys-devel/clang:{{ .Values.llvm_slot }}
                sys-devel/llvm:{{ .Values.llvm_slot }}
                clang? (
                  sys-devel/lld
                  pgo? ( sys-libs/compiler-rt-sanitizers[profile] )
                )
              )
            )
            amd64? ( dev-lang/nasm )
          cdepend: |
            dev-libs/glib
            dev-libs/atk
            dev-libs/expat
            dev-libs/libffi:=
            dev-libs/nss
            dev-libs/nspr
            media-libs/alsa-lib
            media-libs/fontconfig
            media-libs/freetype
            media-libs/mesa
            media-video/ffmpeg
            sys-libs/zlib
            virtual/freedesktop-icon-theme
            x11-libs/cairo
            x11-libs/gdk-pixbuf
            x11-libs/pango
            x11-libs/pixman
            dbus? (
              dev-libs/dbus-glib
              sys-apps/dbus
            )
            jack? ( virtual/jack )
            libproxy? ( net-libs/libproxy )
            selinux? ( sec-policy/selinux-mozilla )
            sndio? ( media-sound/sndio )
            screencast? ( media-video/pipewire:= )
            system-av1? (
              media-libs/dav1d:=
              media-libs/libaom:=
            )
            system-harfbuzz? (
              media-gfx/graphite2
              media-libs/harfbuzz:=
            )
            system-icu? ( dev-libs/icu:= )
            system-jpeg? ( media-libs/libjpeg-turbo )
            system-libevent? ( dev-libs/libevent[threads] )
            system-libvpx? ( media-libs/libvpx[postproc] )
            system-png? ( media-libs/libpng[apng] )
            system-webp? ( media-libs/libwebp )
            wayland? (
              x11-libs/gtk+:3[wayland]
              x11-libs/libdrm
              x11-libs/libxkbcommon[wayland(-)]
            )
            wifi? (
              kernel_linux? (
                dev-libs/dbus-glib
                net-misc/networkmanager
                sys-apps/dbus
              )
            )
            X? (
              virtual/opengl
              x11-libs/cairo[X]
              x11-libs/gtk+:3[X]
              x11-libs/libX11
              x11-libs/libXcomposite
              x11-libs/libXdamage
              x11-libs/libXext
              x11-libs/libXfixes
              x11-libs/libxkbcommon[X]
              x11-libs/libXrandr
              x11-libs/libXtst
              x11-libs/libxcb:=
            )
          rdepend: |
            ${CDEPEND}
            jack? ( virtual/jack )
            openh264? ( media-libs/openh264:*[plugin] )
            pulseaudio? (
              || (
                media-sound/pulseaudio
                media-sound/apulse
              )
            )
          depend: |
            ${CDEPEND}
            pulseaudio? ( media-sound/pulseaudio )
            X? (
              x11-libs/libICE
              x11-libs/libSM
            )
          body: |-
            # Allow MOZ_GMP_PLUGIN_LIST to be set in an eclass or
            # overridden in the enviromnent (advanced hackers only)
            if [[ -z "${MOZ_GMP_PLUGIN_LIST+set}" ]] ; then
              MOZ_GMP_PLUGIN_LIST=( gmp-gmpopenh264 gmp-widevinecdm )
            fi
            {{ .Values.src_unpack }}
            {{ .Values.moz_install_xpi }}
            pkg_setup() {
              python-any-r1_pkg_setup

              # Avoid PGO profiling problems due to enviroment leakage
              # These should *always* be cleaned up anyway
              unset \
                DBUS_SESSION_BUS_ADDRESS \
                DISPLAY \
                ORBIT_SOCKETDIR \
                SESSION_MANAGER \
                XAUTHORITY \
                XDG_CACHE_HOME \
                XDG_SESSION_COOKIE

              # Build system is using /proc/self/oom_score_adj, bug #604394
              addpredict /proc/self/oom_score_adj

              if use pgo ; then
                # Allow access to GPU during PGO run
                local ati_cards mesa_cards nvidia_cards render_cards
                shopt -s nullglob

                ati_cards=$(echo -n /dev/ati/card* | sed 's/ /:/g')
                if [[ -n "${ati_cards}" ]] ; then
                  addpredict "${ati_cards}"
                fi

                mesa_cards=$(echo -n /dev/dri/card* | sed 's/ /:/g')
                if [[ -n "${mesa_cards}" ]] ; then
                  addpredict "${mesa_cards}"
                fi

                nvidia_cards=$(echo -n /dev/nvidia* | sed 's/ /:/g')
                if [[ -n "${nvidia_cards}" ]] ; then
                  addpredict "${nvidia_cards}"
                fi

                render_cards=$(echo -n /dev/dri/renderD128* | sed 's/ /:/g')
                if [[ -n "${render_cards}" ]] ; then
                  addpredict "${render_cards}"
                fi

                shopt -u nullglob
              fi

              # Ensure we use C locale when building, bug #746215
              export LC_ALL=C
            }
            _clear_vendor_checksums() {
              sed -i 's/\("files":{\)[^}]*/\1/' third_party/rust/$1/.cargo-checksum.json
            }
            src_prepare() {
              default

              # Copy Macaroni distribution.ini
              cp ${FILESDIR}/distribution.ini "${WORKDIR}/"

              eapply_user

              # Make cargo respect MAKEOPTS
              export CARGO_BUILD_JOBS="$(makeopts_jobs)"

              # Make LTO respect MAKEOPTS
              sed -i \
                -e "s/multiprocessing.cpu_count()/$(makeopts_jobs)/" \
                "${S}"/build/moz.configure/lto-pgo.configure \
                || die "sed failed to set num_cores"

              # Make ICU respect MAKEOPTS
              sed -i \
                -e "s/multiprocessing.cpu_count()/$(makeopts_jobs)/" \
                "${S}"/intl/icu_sources_data.py \
                || die "sed failed to set num_cores"

              # sed-in toolchain prefix
              sed -i \
                -e "s/objdump/${CHOST}-objdump/" \
                "${S}"/python/mozbuild/mozbuild/configure/check_debug_ranges.py \
                || die "sed failed to set toolchain prefix"

              sed -i \
                -e 's/ccache_stats = None/return None/' \
                "${S}"/python/mozbuild/mozbuild/controller/building.py \
                || die "sed failed to disable ccache stats call"

              einfo "Removing pre-built binaries ..."
              find "${S}"/third_party -type f \( -name '*.so' -o -name '*.o' \) -print -delete || die

              # Create build dir
              BUILD_DIR="${WORKDIR}/${PN}_build"
              mkdir -p "${BUILD_DIR}" || die

              _clear_vendor_checksums audio_thread_priority
              _clear_vendor_checksums libc

              # Mozilla API keys (see https://location.services.mozilla.com/api)
              # Note: These are for Gentoo Linux use ONLY. For your own distribution, please
              # get your own set of keys.
              if [[ -z "${MOZ_API_KEY_MOZILLA+set}" ]] ; then
                MOZ_API_KEY_MOZILLA="edb3d487-3a84-46m0ap1e3-9dfd-92b5efaaa005"
              fi

              echo -n "${MOZ_API_KEY_MOZILLA//m0ap1/}" > "${S}"/api-mozilla.key || die

              xdg_environment_reset
            }
            mozconfig_add_options_ac() {
              local reason=${1}
              shift
              local option
              for option in ${@} ; do
                echo "ac_add_options ${option} # ${reason}" >>${MOZCONFIG}
              done
            }
            mozconfig_add_options_mk() {
              local reason=${1}
              shift
              local option
              for option in ${@} ; do
                echo "mk_add_options ${option} # ${reason}" >>${MOZCONFIG}
              done
            }
            mozconfig_use_enable() {
              local flag=$(use_enable "${@}")
              mozconfig_add_options_ac "$(use ${1} && echo +${1} || echo -${1})" "${flag}"
            }
            mozconfig_use_with() {
              local flag=$(use_with "${@}")
              mozconfig_add_options_ac "$(use ${1} && echo +${1} || echo -${1})" "${flag}"
            }
            src_configure() {
              if use clang; then
                extra_cflags="-I/usr/lib/clang/{{ .Values.slot }}/include/"
                export CPPFLAGS="-I/usr/lib/clang/{{ .Values.slot }}/include/"
                local -x CC=${CHOST}-clang
                local -x CXX=${CHOST}-clang++
                strip-unsupported-flags
              fi

              tc-export CC CXX LD AR NM OBJDUMP RANLIB PKG_CONFIG
              # Pass the correct toolchain paths through cbindgen
              if tc-is-cross-compiler ; then
                export BINDGEN_CFLAGS="${SYSROOT:+--sysroot=${ESYSROOT}} --target=${CHOST} ${BINDGEN_CFLAGS-}"
              fi

              # Set MOZILLA_FIVE_HOME
              export MOZILLA_FIVE_HOME="/usr/$(get_libdir)/${PN}"

              # python/mach/mach/mixin/process.py fails to detect SHELL
              export SHELL="${EPREFIX}/bin/bash"

              # Set state path
              export MOZBUILD_STATE_PATH="${BUILD_DIR}"

              # Set MOZCONFIG
              export MOZCONFIG="${S}/.mozconfig"

              # Initialize MOZCONFIG
              mozconfig_add_options_ac '' --enable-application=browser

              export MOZILLA_OFFICIAL=1

              export RUST_TARGET="x86_64-unknown-linux-gnu"

              mozconfig_add_options_ac 'Macaroni default' \
                --allow-addon-sideload \
                --disable-cargo-incremental \
                --disable-crashreporter \
                --disable-install-strip \
                --disable-parental-controls \
                --disable-strip \
                --disable-updater \
                --enable-negotiateauth \
                --enable-new-pass-manager \
                --enable-official-branding \
                --enable-release \
                --enable-system-ffi \
                --enable-system-pixman \
                --host="${CBUILD:-${CHOST}}" \
                --libdir="${EPREFIX}/usr/$(get_libdir)" \
                --prefix="${EPREFIX}/usr" \
                --target="${CHOST}" \
                --without-ccache \
                --without-wasm-sandboxed-libraries \
                --with-intl-api \
                --with-libclang-path="$(llvm-config --libdir)" \
                --with-system-nspr \
                --with-system-nss \
                --with-system-zlib \
                --with-toolchain-prefix="${CHOST}-" \
                --with-unsigned-addon-scopes=app,system \
                --update-channel=release

                if ! use x86 && [[ ${CHOST} != armv*h* ]] ; then
                  mozconfig_add_options_ac '' --enable-rust-simd
                fi
                mozconfig_add_options_ac '' --enable-sandbox
                mozconfig_add_options_ac '' --with-mozilla-api-keyfile="${S}/api-mozilla.key"

                mozconfig_use_with system-av1
                mozconfig_use_with system-harfbuzz
                mozconfig_use_with system-icu
                mozconfig_use_with system-jpeg
                mozconfig_use_with system-libevent
                mozconfig_use_with system-libvpx
                mozconfig_use_with system-pipewire
                mozconfig_use_with system-png
                mozconfig_use_with system-webp

                mozconfig_use_enable dbus
                mozconfig_use_enable libproxy

                use eme-free && mozconfig_add_options_ac '+eme-free' --disable-eme

                local myaudiobackends=""
                use jack && myaudiobackends+="jack,"
                use sndio && myaudiobackends+="sndio,"
                use pulseaudio && myaudiobackends+="pulseaudio,"
                ! use pulseaudio && myaudiobackends+="alsa,"

                mozconfig_add_options_ac '--enable-audio-backends' --enable-audio-backends="${myaudiobackends::-1}"

                mozconfig_use_enable wifi necko-wifi

                if use X && use wayland ; then
                  mozconfig_add_options_ac '+x11+wayland' --enable-default-toolkit=cairo-gtk3-x11-wayland
                elif ! use X && use wayland ; then
                  mozconfig_add_options_ac '+wayland' --enable-default-toolkit=cairo-gtk3-wayland-only
                else
                  mozconfig_add_options_ac '+x11' --enable-default-toolkit=cairo-gtk3-x11-only
                fi

                mozconfig_add_options_ac 'no wasm-sandbox' --without-wasm-sandboxed-libraries
                mozconfig_use_with system-harfbuzz system-graphite2

                # Debug flag was handled via configure
                filter-flags '-g*'

                # System-av1 fix
                use system-av1 && append-ldflags "-Wl,--undefined-version"

                # Make revdep-rebuild.sh happy; Also required for musl
                append-ldflags -Wl,-rpath="${MOZILLA_FIVE_HOME}",--enable-new-dtags

                # Pass $MAKEOPTS to build system
                export MOZ_MAKE_FLAGS="${MAKEOPTS}"

                # Use system's Python environment
                export PIP_NETWORK_INSTALL_RESTRICTED_VIRTUALENVS=mach

                export MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE="none"

                if ! use telemetry; then
                  mozconfig_add_options_mk '-telemetry setting' "MOZ_CRASHREPORTER=0"
                  mozconfig_add_options_mk '-telemetry setting' "MOZ_DATA_REPORTING=0"
                  mozconfig_add_options_mk '-telemetry setting' "MOZ_SERVICES_HEALTHREPORT=0"
                  mozconfig_add_options_mk '-telemetry setting' "MOZ_TELEMETRY_REPORTING=0"
                fi

                mozconfig_use_enable test tests

                # Disable notification when build system has finished
                export MOZ_NOSPAM=1

                # Portage sets XARGS environment variable to "xargs -r" by default which
                # breaks build system's check_prog() function which doesn't support arguments
                mozconfig_add_options_ac 'Gentoo default' "XARGS=${EPREFIX}/usr/bin/xargs"

                # Set build dir
                mozconfig_add_options_mk 'Gentoo default' "MOZ_OBJDIR=${BUILD_DIR}"

                # Show flags we will use
                einfo "Build BINDGEN_CFLAGS:\t${BINDGEN_CFLAGS:-no value set}"
                einfo "Build CFLAGS:\t\t${CFLAGS:-no value set}"
                einfo "Build CXXFLAGS:\t\t${CXXFLAGS:-no value set}"
                einfo "Build LDFLAGS:\t\t${LDFLAGS:-no value set}"
                einfo "Build RUSTFLAGS:\t\t${RUSTFLAGS:-no value set}"

                # Handle EXTRA_CONF and show summary
                local ac opt hash reason

                ./mach configure || die
            }
            src_compile() {
              local virtx_cmd=

              if use pgo ; then
                virtx_cmd=virtx

                # Reset and cleanup environment variables used by GNOME/XDG
                gnome2_environment_reset

                addpredict /root
              fi

              if ! use X && use wayland; then
                local -x GDK_BACKEND=wayland
              else
                local -x GDK_BACKEND=x11
              fi

              ${virtx_cmd} ./mach build --verbose \
                || die
            }
            src_install() {
              # Set MOZILLA_FIVE_HOME
              local MOZILLA_FIVE_HOME="/usr/$(get_libdir)/${PN}"

              # xpcshell is getting called during install
              pax-mark m \
                "${BUILD_DIR}"/dist/bin/xpcshell \
                "${BUILD_DIR}"/dist/bin/${PN} \
                "${BUILD_DIR}"/dist/bin/plugin-container

              DESTDIR="${D}" ./mach install || die

              # Upstream cannot ship symlink but we can (bmo#658850)
              rm "${ED}${MOZILLA_FIVE_HOME}/${PN}-bin" || die
              dosym ${PN} ${MOZILLA_FIVE_HOME}/${PN}-bin

              # Don't install llvm-symbolizer from sys-devel/llvm package
              if [[ -f "${ED}${MOZILLA_FIVE_HOME}/llvm-symbolizer" ]] ; then
                rm -v "${ED}${MOZILLA_FIVE_HOME}/llvm-symbolizer" || die
              fi

              # Install policy (currently only used to disable application updates)
              insinto "${MOZILLA_FIVE_HOME}/distribution"
              newins "${FILESDIR}"/distribution.ini distribution.ini
              # Set version
              sed -i -e "s|^version=.*|version=${PV}|g" \
                ${ED}/${MOZILLA_FIVE_HOME}/distribution/distribution.ini
              newins "${FILESDIR}"/disable-auto-update.policy.json policies.json

              # Install system-wide preferences
              local PREFS_DIR="${MOZILLA_FIVE_HOME}/browser/defaults/preferences"
              insinto "${PREFS_DIR}"
              newins "${FILESDIR}"/macaroni-default-prefs.js macaroni-prefs.js

              local MACARONI_PREFS="${ED}${PREFS_DIR}/gentoo-prefs.js"

              if ! use gmp-autoupdate ; then
                local plugin
                for plugin in "${MOZ_GMP_PLUGIN_LIST[@]}" ; do
                  einfo "Disabling auto-update for ${plugin} plugin ..."
                  echo "pref(\"media.${plugin}.autoupdate\",   false);\n" >> "${MACARONI_PREFS}"
                done
              fi

              # Force the graphite pref if USE=system-harfbuzz is enabled, since the pref cannot disable it
              if use system-harfbuzz ; then
                echo "sticky_pref(\"gfx.font_rendering.graphite.enabled\", true);\n" >> "${MACARONI_PREFS}"
              fi

              # Install language packs
              local langpacks=( $(find "${WORKDIR}/language_packs" -type f -name '*.xpi') )
              if [[ -n "${langpacks}" ]] ; then
                moz_install_xpi "${MOZILLA_FIVE_HOME}/distribution/extensions" "${langpacks[@]}"
              fi

              # Install icons
              local icon_srcdir="${S}/browser/branding/official"
              local icon_symbolic_file="${FILESDIR}/icon/firefox-symbolic.svg"
              insinto /usr/share/icons/hicolor/symbolic/apps
              newins "${icon_symbolic_file}" ${PN}-symbolic.svg

              local icon size
              for icon in "${icon_srcdir}"/default*.png ; do
                size=${icon%.png}
                size=${size##*/default}
                if [[ ${size} -eq 48 ]] ; then
                  newicon "${icon}" ${PN}.png
                fi
                newicon -s ${size} "${icon}" ${PN}.png
              done

              # Install menu
              local app_name="Mozilla ${MOZ_PN^}"
              local desktop_file="${FILESDIR}/icon/${PN}.desktop"
              local desktop_filename="${PN}.desktop"
              local exec_command="${PN}"
              local icon="${PN}"
              local use_wayland="false"

              if use wayland ; then
                use_wayland="true"
              fi

              cp "${desktop_file}" "${WORKDIR}/${PN}.desktop-template" || die

              sed -i \
                -e "s:@NAME@:${app_name}:" \
                -e "s:@EXEC@:${exec_command}:" \
                -e "s:@ICON@:${icon}:" \
                "${WORKDIR}/${PN}.desktop-template" \
                || die

              newmenu "${WORKDIR}/${PN}.desktop-template" "${desktop_filename}"

              rm "${WORKDIR}/${PN}.desktop-template" || die

              # Install wrapper script
              [[ -f "${ED}/usr/bin/${PN}" ]] && rm "${ED}/usr/bin/${PN}"
              newbin "${FILESDIR}/${PN}.sh" ${PN}

              # Update wrapper
              sed -i \
                -e "s:@PREFIX@:${EPREFIX}/usr:" \
                -e "s:@MOZ_FIVE_HOME@:${MOZILLA_FIVE_HOME}:" \
                -e "s:@APULSELIB_DIR@:${apulselib}:" \
                -e "s:@DEFAULT_WAYLAND@:${use_wayland}:" \
                "${ED}/usr/bin/${PN}" \
                || die

            }
            pkg_preinst() {
              xdg_pkg_preinst
            }
            pkg_postinst() {
              xdg_pkg_postinst
            }

    - firefox-bin:
        vars:
          # This system will be unable to play DRM-protected content without CONFIG_SECCOMP kernel option
          homepage: https://www.mozilla.org/en-US/firefox/
          desc: Firefox Web Browser Precompiled (stable)
          license: MPL-2.0 GPL-2 LGPL-2.1
          s: "${WORKDIR}/firefox"
          inherit:
            - desktop
            - pax-utils
            - xdg
          iuse: |
            amd64 +alsa +ffmpeg geckodriver +pulseaudio selinux wayland startup-notification
            l10n_ach l10n_af l10n_an l10n_ar l10n_ast l10n_az l10n_be l10n_bg l10n_bn l10n_br
            l10n_bs l10n_ca-valencia l10n_ca l10n_cak l10n_cs l10n_cy l10n_da l10n_de l10n_dsb
            l10n_el l10n_en-CA l10n_en-GB l10n_en-US l10n_eo l10n_es-AR l10n_es-CL l10n_es-ES
            l10n_es-MX l10n_et l10n_eu l10n_fa l10n_ff l10n_fi l10n_fr l10n_fur l10n_fy-NL
            l10n_ga-IE l10n_gd l10n_gl l10n_gn l10n_gu-IN l10n_he l10n_hi-IN l10n_hr l10n_hsb
            l10n_hu l10n_hy-AM l10n_ia l10n_id l10n_is l10n_it l10n_ja l10n_ka l10n_kab l10n_kk
            l10n_km l10n_kn l10n_ko l10n_lij l10n_lt l10n_lv l10n_mk l10n_mr l10n_ms l10n_my
            l10n_nb-NO l10n_ne-NP l10n_nl l10n_nn-NO l10n_oc l10n_pa-IN l10n_pl l10n_pt-BR
            l10n_pt-PT l10n_rm l10n_ro l10n_ru l10n_sat l10n_sc l10n_sco l10n_si l10n_sk l10n_skr
            l10n_sl l10n_son l10n_sq l10n_sr l10n_sv-SE l10n_szl l10n_ta l10n_te l10n_tg l10n_th
            l10n_tl l10n_tr l10n_trs l10n_uk l10n_ur l10n_uz l10n_vi l10n_xh l10n_zh-CN l10n_zh-TW
          depend: |
            app-arch/unzip
            alsa? (
              !pulseaudio? (
                dev-util/patchelf
                media-sound/apulse
              )
            )
          rdepend: |
            dev-libs/atk
            sys-apps/dbus
            dev-libs/dbus-glib
            dev-libs/glib:2
            media-libs/fontconfig
            media-libs/freetype
            x11-libs/cairo[X]
            x11-libs/gdk-pixbuf
            x11-libs/gtk+:2
            x11-libs/gtk+:3
            x11-libs/libX11
            x11-libs/libXcomposite
            x11-libs/libXdamage
            x11-libs/libXext
            x11-libs/libXfixes
            x11-libs/libXrender
            x11-libs/libXt
            x11-libs/pango
            virtual/freedesktop-icon-theme
            alsa? (
              !pulseaudio? ( media-sound/apulse )
            )
            geckodriver? ( www-apps/geckodriver )
            pulseaudio? ( media-sound/pulseaudio )
            ffmpeg? ( media-video/ffmpeg )
            selinux? ( sec-policy/selinux-mozilla )

          extra_envs:
            - RESTRICT="strip"
            - |
              QA_PREBUILT="
              opt/firefox/*.so
              opt/firefox/firefox
              opt/firefox/crashreporter
              opt/firefox/webapprt-stub
              opt/firefox/plugin-container
              opt/firefox/mozilla-xremote-client
              opt/firefox/updater
              opt/firefox/minidump-analyzer
              opt/firefox/pingsender
              "


          body: |
            # Allow MOZ_GMP_PLUGIN_LIST to be set in an eclass or
            # overridden in the enviromnent (advanced hackers only)
            if [[ -z "${MOZ_GMP_PLUGIN_LIST+set}" ]] ; then
              MOZ_GMP_PLUGIN_LIST=( gmp-gmpopenh264 gmp-widevinecdm )
            fi
            {{ .Values.src_unpack }}
            {{ .Values.moz_install_xpi }}
            src_install() {
              local MOZILLA_FIVE_HOME=/opt/{{ .Values.pn | replace "-bin" "" }}
              dodir /opt
              cd "${ED}"/opt &>/dev/null || die
              mv "${S}" "${ED}"/${MOZILLA_FIVE_HOME} || die
              pax-mark m "${ED}/"${MOZILLA_FIVE_HOME}/{firefox,firefox-bin,plugin-container}
              # Patch alsa support
              local apulselib=
              if use alsa && ! use pulseaudio ; then
                apulselib="${EPREFIX}/usr/$(get_libdir)/apulse"
                patchelf --set-rpath "${apulselib}" "${ED}${MOZILLA_FIVE_HOME}/libxul.so" || die
              fi
              # Install policy (currently only used to disable application updates)
              insinto "${MOZILLA_FIVE_HOME}/distribution"
              newins "${FILESDIR}"/disable-auto-update.policy.json policies.json
              # Install system-wide preferences
              local PREFS_DIR="${MOZILLA_FIVE_HOME}/browser/defaults/preferences"
              insinto "${PREFS_DIR}"
              newins "${FILESDIR}"/all-macaroni.js all-macaroni.js

              # Fix prefs that make no sense for a system-wide install
              insinto ${MOZILLA_FIVE_HOME}/defaults/pref/
              doins "${FILESDIR}"/local-settings.js

              local MACARONI_PREFS="${ED}${PREFS_DIR}/all-macaroni.js"

              for plugin in "${MOZ_GMP_PLUGIN_LIST[@]}" ; do
              einfo "Disabling auto-update for ${plugin} plugin ..."
              cat >>"${MACARONI_PREFS}" <<-EOF || die "failed to disable autoupdate for ${plugin} media plugin"
              pref("media.${plugin}.autoupdate",   false);
              EOF
              done
              # Install language packs
              local langpacks=( $(find "${WORKDIR}/language_packs" -type f -name '*.xpi') )
              if [[ -n "${langpacks}" ]] ; then
                moz_install_xpi "${MOZILLA_FIVE_HOME}/distribution/extensions" "${langpacks[@]}"
              fi


              # Install icons
              local icon_srcdir="${ED}/${MOZILLA_FIVE_HOME}/browser/chrome/icons/default"
              local icon size
              for icon in "${icon_srcdir}"/default*.png ; do
                size=${icon%.png}
                size=${size##*/default}

                if [[ ${size} -eq 48 ]] ; then
                  newicon "${icon}" ${PN}.png
                fi

                newicon -s ${size} "${icon}" ${PN}.png
              done

              # Install menu
              local app_name="Mozilla Firefox (bin)"
              local desktop_file="${FILESDIR}/${PN}.desktop"
              local desktop_filename="${PN}.desktop"
              local exec_command="${PN}"
              local icon="${PN}"
              local use_wayland="false"

              if use wayland ; then
                use_wayland="true"
              fi

              cp "${desktop_file}" "${WORKDIR}/${PN}.desktop-template" || die

              sed -i \
                -e "s:@NAME@:${app_name}:" \
                -e "s:@EXEC@:${exec_command}:" \
                -e "s:@ICON@:${icon}:" \
                "${WORKDIR}/${PN}.desktop-template" \
                || die

              newmenu "${WORKDIR}/${PN}.desktop-template" "${desktop_filename}"

              rm "${WORKDIR}/${PN}.desktop-template" || die

              # Create /usr/bin/firefox-bin or /usr/bin/firefox-dev-bin
              [[ -f "${ED}/usr/bin/${PN}" ]] && rm "${ED}/usr/bin/${PN}"

              dodir /usr/bin/
              local apulselib=$(usex pulseaudio "" $(usex alsa "/usr/$(get_libdir)/apulse:" ""))
              cat <<-EOF >"${ED}/"usr/bin/${PN}
              #!/bin/sh
              unset LD_PRELOAD
              LD_LIBRARY_PATH="${apulselib}${MOZILLA_FIVE_HOME}/" \\
              GTK_PATH=/usr/$(get_libdir)/gtk-3.0/ \\
              exec ${MOZILLA_FIVE_HOME}/{{ .Values.pn | replace "-bin" ""}} "\$@"
              EOF
              fperms 0755 /usr/bin/${PN}

              # revdep-rebuild entry
              insinto /etc/revdep-rebuild
              echo "SEARCH_DIRS_MASK=${MOZILLA_FIVE_HOME}" >> ${T}/10${PN}
              doins "${T}"/10${PN}
            }
            pkg_postinst() {
              # Update mimedb for the new .desktop file
              xdg_desktop_database_update
              xdg_icon_cache_update
              if ! has_version 'gnome-base/gconf' || ! has_version 'gnome-base/orbit' \
                || ! has_version 'net-misc/curl'; then
                einfo
                einfo "For using the crashreporter, you need gnome-base/gconf,"
                einfo "gnome-base/orbit and net-misc/curl emerged."
                einfo
              fi
              elog
              elog "Note regarding Trusted Recursive Resolver aka DNS-over-HTTPS (DoH):"
              elog "Due to privacy concerns (encrypting DNS might be a good thing, sending all"
              elog "DNS traffic to Cloudflare by default is not a good idea and applications"
              elog "should respect OS configured settings), \"network.trr.mode\" was set to 5"
              elog "(\"Off by choice\") by default."
              elog "You can enable DNS-over-HTTPS in ${PN^}'s preferences."
            }
            pkg_postrm() {
              xdg_icon_cache_update
            }

google_chrome:
  generator: custom
  generator_opts:
    script: generators/chrome.sh
    enable_set_version: false

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: www-client
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}_amd64.deb"
        url: "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-{{ .Values.appendix }}/google-chrome-{{ .Values.appendix }}_{{ .Values.version }}-1_amd64.deb"

    vars:
      homepage: https://www.google.com/chrome
      extra_envs:
        - |
          CHROMIUM_LANGS="am ar bg bn ca cs da de el en-GB es es-419 et fa fi fil fr gu he
                          hi hr hu id it ja kn ko lt lv ml mr ms nb nl pl pt-BR pt-PT ro ru sk sl sr
                          sv sw ta te th tr uk vi zh-CN zh-TW"
        - QA_PREBUILT="*"
        - QA_DESKTOP_FILE="usr/share/applications/google-chrome.*\\.desktop"
        - CHROME_HOME="opt/google/chrome${PN#google-chrome}"
      inherit:
        - chromium-2
        - eutils
        - gnome2-utils
        - pax-utils
        - unpacker
        - xdg-utils
      s: ${WORKDIR}
      license: google-chrome
      iuse: selinux amd64
      restrict: bindist strip
      rdepend: |
        dev-libs/wayland
        app-accessibility/at-spi2-atk:2
        app-arch/bzip2
        app-misc/ca-certificates
        dev-libs/atk
        dev-libs/expat
        dev-libs/glib:2
        dev-libs/nspr
        >=dev-libs/nss-3.26
        media-libs/alsa-lib
        media-libs/fontconfig
        media-libs/freetype:2
        net-print/cups
        sys-apps/dbus
        sys-libs/libcap
        x11-libs/cairo
        x11-libs/gdk-pixbuf:2
        x11-libs/gtk+:3[X]
        x11-libs/libX11
        x11-libs/libXcomposite
        x11-libs/libXcursor
        x11-libs/libXdamage
        x11-libs/libXext
        x11-libs/libXfixes
        x11-libs/libXi
        x11-libs/libxkbcommon
        x11-libs/libXrandr
        x11-libs/libXrender
        x11-libs/libXScrnSaver
        x11-libs/libXtst
        x11-libs/libxcb
        x11-libs/pango
        x11-misc/xdg-utils
        selinux? ( sec-policy/selinux-chromium )
      body: |
        pkg_pretend() {
          # Protect against people using autounmask overzealously
          use amd64 || die "google-chrome only works on amd64"
        }
        pkg_setup() {
          chromium_suid_sandbox_check_kernel_config
        }
        src_unpack() {
          :
        }
        src_install() {
          {{- if eq .Values.channel "stable" }}
          local MY_PN="${PN}-stable"
          {{- else }}
          local MY_PN="${PN}"
          {{- end }}

          dodir /
          cd "${ED}" || die
          unpacker
          rm -r etc usr/share/menu || true
          mv usr/share/doc/${MY_PN} usr/share/doc/${PF} || die
          gzip -d usr/share/doc/${PF}/changelog.gz || die
          gzip -d usr/share/man/man1/${MY_PN}.1.gz || die
          if [[ -L usr/share/man/man1/google-chrome.1.gz ]]; then
            rm usr/share/man/man1/google-chrome.1.gz || die
            dosym ${MY_PN}.1 usr/share/man/man1/google-chrome.1
          fi
          pushd "${CHROME_HOME}/locales" > /dev/null || die
          chromium_remove_language_paks
          popd > /dev/null || die
          {{- if eq .Values.channel "stable" }}
          local suffix=""
          {{- else }}
          local suffix=_{{ .Values.channel }}
          {{- end }}
          local size
          for size in 16 24 32 48 64 128 256 ; do
            insinto "/usr/share/icons/hicolor/${size}x${size}/apps"
            newins "${CHROME_HOME}/product_logo_${size}${suffix}.png" ${PN}.png
          done

          pax-mark m "${CHROME_HOME}/chrome"
        }
        pkg_postrm() {
          xdg_icon_cache_update
          xdg_desktop_database_update
        }
        pkg_postinst() {
          xdg_icon_cache_update
          xdg_desktop_database_update
        }


  packages:
    - google-chrome:
        vars:
          desc: The web browser from Google (stable channel)
          channel: stable
          appendix: stable

    - google-chrome-beta:
        vars:
          desc: The web browser from Google (beta channel)
          channel: beta
          appendix: beta

    - google-chrome-unstable:
        vars:
          desc: The web browser from Google (unstable channel)
          channel: dev
          appendix: unstable


vivaldi:
  generator: custom
  generator_opts:
    script: generators/vivaldi.sh
    enable_set_version: false

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: www-client
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}_amd64.deb"
        url: "https://downloads.vivaldi.com/stable/vivaldi-stable_{{ .Values.version }}-1_amd64.deb"
        use: amd64
# Disable arm package for now. Website is broken.
#      - name: "{{ .Values.pn }}-{{ .Values.version }}_armhf.deb"
#        url: "https://downloads.vivaldi.com/stable/vivaldi-stable_{{ .Values.version }}-1_armhf.deb"
#        use: arm

      - name: "{{ .Values.pn }}-{{ .Values.version }}_arm64.deb"
        url: "https://downloads.vivaldi.com/stable/vivaldi-stable_{{ .Values.version }}-1_arm64.deb"
        use: arm64

  packages:
    - vivaldi:
        vars:
          homepage: https://vivaldi.com/
          desc: A browser for our friends
          iuse: widevine amd64 arm arm64
          inherit:
            - chromium-2
            - unpacker
            - toolchain-funcs
            - xdg-utils
          license: Vivaldi
          s: ${WORKDIR}
          extra_envs:
            - |
              CHROMIUM_LANGS="
                af am ar be bg bn ca cs da de de-CH el en-GB en-US eo es es-419 es-PE et eu
                fa fi fil fr fy gd gl gu he hi hr hu hy id io is it ja jbo ka kn ko ku lt
                lv mk ml mr ms nb nl nn pl pt-BR pt-PT ro ru sc sk sl sq sr sv sw ta te th
                tr uk vi zh-CN zh-TW
              "
            - VIVALDI_HOME="opt/${PN}"
            - QA_PREBUILT="*"
          rdepend: |
            dev-libs/expat
            dev-libs/glib:2
            dev-libs/nspr
            dev-libs/nss
            media-libs/alsa-lib
            media-libs/fontconfig
            media-libs/freetype
            media-libs/speex
            net-print/cups
            sys-apps/dbus
            sys-libs/libcap
            x11-libs/cairo
            x11-libs/gdk-pixbuf
            x11-libs/gtk+:3
            x11-libs/libX11
            x11-libs/libXScrnSaver
            x11-libs/libXcomposite
            x11-libs/libXcursor
            x11-libs/libXdamage
            x11-libs/libXext
            x11-libs/libXfixes
            x11-libs/libXi
            x11-libs/libXrandr
            x11-libs/libXrender
            x11-libs/libXtst
            x11-libs/pango[X]
            widevine? (
              || ( www-client/google-chrome
                www-client/google-chrome-beta
                www-client/google-chrome-unstable
              )
            )
          body: |
            src_unpack() {
              unpack_deb ${A}
            }
            src_prepare() {
              iconv -c -t UTF-8 usr/share/applications/{{ .Values.pn }}-stable.desktop > "${T}"/{{ .Values.pn }}-stable.desktop || die
              mv "${T}"/{{ .Values.pn }}-stable.desktop usr/share/applications/{{ .Values.pn }}-stable.desktop || die
              mv usr/share/doc/{{ .Values.pn }}-stable usr/share/doc/${PF} || die
              chmod 0755 usr/share/doc/${PF} || die
              gunzip usr/share/doc/${PF}/changelog.gz || die
              rm \
                _gpgbuilder \
                etc/cron.daily/${PN} \
                || die
              rmdir \
                etc/cron.daily/ \
                etc/ \
                || die
              use widevine || (rm opt/${PN}/WidevineCdm || die)
              local c d
              for d in 16 22 24 32 48 64 128 256; do
                mkdir -p usr/share/icons/hicolor/${d}x${d}/apps || die
                cp \
                  ${VIVALDI_HOME}/product_logo_${d}.png \
                  usr/share/icons/hicolor/${d}x${d}/apps/${PN}.png || die
              done
              pushd "${VIVALDI_HOME}/locales" > /dev/null || die
              chromium_remove_language_paks
              popd > /dev/null || die
              eapply_user
            }
            src_install() {
              rm -r usr/share/appdata || die
              mv * "${D}" || die
              dosym /${VIVALDI_HOME}/${PN} /usr/bin/${PN}
              fperms 4711 /${VIVALDI_HOME}/vivaldi-sandbox
            }
            pkg_postrm() {
              xdg_desktop_database_update
              xdg_icon_cache_update
            }
            pkg_postinst() {
              xdg_desktop_database_update
              xdg_icon_cache_update
            }



waterfox:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: www-client
    dir:
      url: "https://www.waterfox.net/docs/"
      matcher: "/docs/releases/[1-9.]+[0-9.]+[0-9].*"
      exclude: "beta"

  packages:
    - waterfox-bin:
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.bz2"
            url: 'https://cdn1.waterfox.net/waterfox/releases/{{ .Values.version }}/Linux_x86_64/waterfox-{{ .Values.version }}.tar.bz2'
            use: amd64
        vars:
          homepage: https://www.waterfox.net/
          desc: Waterfox Web Browser Precompiled (stable)
          license: MPL-2.0 GPL-2 LGPL-2.1
          s: "${WORKDIR}/waterfox"
          inherit:
            - desktop
            - pax-utils
            - xdg
          iuse: |
            amd64 +alsa +ffmpeg geckodriver +pulseaudio selinux
          depend: |
            app-arch/unzip
            alsa? (
              !pulseaudio? (
                dev-util/patchelf
                media-sound/apulse
              )
            )
          rdepend: |
            dev-libs/atk
            sys-apps/dbus
            dev-libs/dbus-glib
            dev-libs/glib:2
            media-libs/fontconfig
            media-libs/freetype
            x11-libs/cairo[X]
            x11-libs/gdk-pixbuf
            x11-libs/gtk+:2
            x11-libs/gtk+:3
            x11-libs/libX11
            x11-libs/libXcomposite
            x11-libs/libXdamage
            x11-libs/libXext
            x11-libs/libXfixes
            x11-libs/libXrender
            x11-libs/libXt
            x11-libs/pango
            virtual/freedesktop-icon-theme
            alsa? (
              !pulseaudio? ( media-sound/apulse )
            )
            geckodriver? ( www-apps/geckodriver )
            pulseaudio? ( media-sound/pulseaudio )
            ffmpeg? ( media-video/ffmpeg )
            selinux? ( sec-policy/selinux-mozilla )

          extra_envs:
            - RESTRICT="strip"
            - |
              QA_PREBUILT="
              /opt/waterfox/*.so
              /opt/waterfox/waterfox-bin
              /opt/waterfox/updater
              /opt/waterfox/glxtext
              /opt/waterfox/vaapitest
              "

          body: |
            src_install() {
              local WATERFOX_HOME=/opt/{{ .Values.pn | replace "-bin" "" }}
              dodir /opt
              cd "${ED}"/opt &>/dev/null || die
              mv "${S}" "${ED}"/${WATERFOX_HOME} || die
              pax-mark m "${ED}/"${WATERFOX_HOME}/{waterfox,waterfox-bin}
              # Patch alsa support
              local apulselib=
              if use alsa && ! use pulseaudio ; then
                apulselib="${EPREFIX}/usr/$(get_libdir)/apulse"
                patchelf --set-rpath "${apulselib}" "${ED}${WATERFOX_HOME}/libxul.so" || die
              fi
              # Install policy (currently only used to disable application updates)
              insinto "${WATERFOX_HOME}/distribution"
              newins "${FILESDIR}"/disable-auto-update.policy.json policies.json
              # Install system-wide preferences
              local PREFS_DIR="${WATERFOX_HOME}/browser/defaults/preferences"
              insinto "${PREFS_DIR}"
              newins "${FILESDIR}"/all-macaroni.js all-macaroni.js

              # Fix prefs that make no sense for a system-wide install
              insinto ${WATERFOX_HOME}/defaults/pref/
              doins "${FILESDIR}"/local-settings.js

              local MACARONI_PREFS="${ED}${PREFS_DIR}/all-macaroni.js"

              # Install icons
              local icon_srcdir="${ED}/${WATERFOX_HOME}/browser/chrome/icons/default"
              local icon size
              for icon in "${icon_srcdir}"/default*.png ; do
                size=${icon%.png}
                size=${size##*/default}

                if [[ ${size} -eq 48 ]] ; then
                  newicon "${icon}" ${PN}.png
                fi

                newicon -s ${size} "${icon}" ${PN}.png
              done

              # Install icons
              local icon_srcdir="${S}/browser/branding/official"
              local icon_symbolic_file="${FILESDIR}/icon/waterfox-symbolic.svg"
              insinto /usr/share/icons/hicolor/symbolic/apps
              newins "${icon_symbolic_file}" ${PN}-symbolic.svg

              # Install menu
              local app_name="Waterfox (bin)"
              local desktop_file="${FILESDIR}/icon/${PN}.desktop"
              local desktop_filename="${PN}.desktop"
              local exec_command="${PN}"
              local icon="${PN}"

              cp "${desktop_file}" "${WORKDIR}/${PN}.desktop-template" || die

              sed -i \
                -e "s:@NAME@:${app_name}:" \
                -e "s:@EXEC@:${exec_command}:" \
                -e "s:@ICON@:${icon}:" \
                "${WORKDIR}/${PN}.desktop-template" \
                || die

              newmenu "${WORKDIR}/${PN}.desktop-template" "${desktop_filename}"

              rm "${WORKDIR}/${PN}.desktop-template" || die

              [[ -f "${ED}/usr/bin/${PN}" ]] && rm "${ED}/usr/bin/${PN}"

              dodir /usr/bin/
              local apulselib=$(usex pulseaudio "" $(usex alsa "/usr/$(get_libdir)/apulse:" ""))
              cat <<-EOF >"${ED}/"usr/bin/${PN}
              #!/bin/sh
              unset LD_PRELOAD
              LD_LIBRARY_PATH="${apulselib}${WATERFOX_HOME}/" \\
              GTK_PATH=/usr/$(get_libdir)/gtk-3.0/ \\
              exec ${WATERFOX_HOME}/{{ .Values.pn | replace "-bin" ""}} "\$@"
              EOF
              fperms 0755 /usr/bin/${PN}

              # revdep-rebuild entry
              insinto /etc/revdep-rebuild
              echo "SEARCH_DIRS_MASK=${WATERFOX_HOME}" >> ${T}/10${PN}
              doins "${T}"/10${PN}
            }
            pkg_postinst() {
              # Update mimedb for the new .desktop file
              xdg_desktop_database_update
              xdg_icon_cache_update
            }
            pkg_postrm() {
              xdg_icon_cache_update
            }
