brave_github:
  generator: builtin-github
  defaults:
    category: www-client
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    github:
      query: releases

  packages:
    - brave-bin:
        github:
          user: brave
          repo: brave-browser
          num_pages: 5
          per_page: 100
          match: Release
        transform:
          - kind: string
            match: "Release "
            replace: ""
          - kind: regex
            match: "\\(.*\\)"
            replace: ""
          # Drop garbage from release string!
          - kind: regex
            match: "[\\r\\n]+$"
            replace: ""
          - kind: regex
            match: "[\\space]+$"
            replace: ""
          - kind: string
            match: "v"
            replace: ""
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-amd64.zip'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-browser-.*-linux-amd64.zip$'

        exclude:
          # Broken release without tarball
          - 1.83.119

        vars:
          desc: Brave Web Browser
          homepage: https://brave.com
          license: MPL-2.0
          inherit:
            - chromium-2
            - xdg-utils
            - desktop
          extra_envs:
            - |
              CHROMIUM_LANGS="am ar bg bn ca cs da de el en-GB en-US es es-419 et fa fi fil fr gu he hi \
                hr hu id it ja kn ko lt lv ml mr ms nb nl pl pt-BR pt-PT ro ru sk sl sr sv \
                sw ta te th tr uk vi zh-CN zh-TW"
            - QA_PREBUILT="*"

          iuse: gnome-keyring
          cdepend: |
            dev-libs/libpthread-stubs
            x11-libs/libxcb
            x11-libs/libxkbcommon
            x11-libs/libXcomposite
            x11-libs/libXcursor
            x11-libs/libXdamage
            x11-libs/libXext
            x11-libs/libXfixes
            x11-libs/libXi
            x11-libs/libXrender
            x11-libs/libXtst
            x11-libs/libxshmfence
            x11-libs/libXxf86vm
            x11-libs/libXScrnSaver
            x11-libs/libXrandr
            x11-libs/libXau
            x11-libs/libXdmcp
            x11-libs/libXinerama
            dev-libs/glib
            dev-libs/nss
            dev-libs/nspr
            net-print/cups
            sys-apps/dbus
            dev-libs/expat
            media-libs/alsa-lib
            x11-libs/pango
            x11-libs/cairo
            dev-libs/gobject-introspection
            dev-libs/atk
            app-accessibility/at-spi2-core
            app-accessibility/at-spi2-atk
            x11-libs/gtk+
            x11-libs/gdk-pixbuf
            virtual/libffi
            dev-libs/libpcre
            net-libs/gnutls
            sys-libs/zlib
            dev-libs/fribidi
            media-libs/harfbuzz
            media-libs/fontconfig
            media-libs/freetype
            x11-libs/pixman
            media-libs/libpng
            media-libs/libepoxy
            dev-libs/libbsd
            dev-libs/libunistring
            dev-libs/libtasn1
            dev-libs/nettle
            dev-libs/gmp
            net-dns/libidn2
            media-gfx/graphite2
            app-arch/bzip2
          depend: |
            ${CDEPEND}
            gnome-base/gconf:2
          rdepend: ${CDEPEND}
          s: ${WORKDIR}
          body: |
            src_prepare() {
              pushd "${S}/locales" > /dev/null || die
                chromium_remove_language_paks
              popd > /dev/null || die
              default
            }
            src_install() {
              declare BRAVE_HOME=/opt/{{ .Values.pn | replace "-bin" "" }}

              dodir ${BRAVE_HOME%/*}

              insinto ${BRAVE_HOME}
                doins -r *

              exeinto ${BRAVE_HOME}
                doexe brave
                doexe chrome_crashpad_handler

              dosym ${BRAVE_HOME}/brave /usr/bin/${PN} || die

              newicon "${FILESDIR}/braveAbout.png" "${PN}.png" || die
              newicon -s 128 "${FILESDIR}/braveAbout.png" "${PN}.png" || die

              # install-xattr doesnt approve using domenu or doins from FILESDIR
              cp "${FILESDIR}"/${PN}.desktop "${S}"
              domenu "${S}"/${PN}.desktop
            }
            pkg_postinst() {
              xdg_desktop_database_update
              xdg_mimeinfo_database_update
              elog "If using a debian-sources(-lts) kernel, you will need to type the following to allow brave to run:"
              elog
              elog "echo 1 > /proc/sys/kernel/unprivileged_userns_clone"
              elog
              elog "To make this setting persistent after reboot, type:"
              elog
              elog "sysctl -w kernel.unprivileged_userns_clone=1"
            }
            pkg_postrm() {
              xdg_desktop_database_update
              xdg_mimeinfo_database_update
            }



opera:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: www-client
    dir:
      url: "https://get.geo.opera.com/pub/opera/desktop/"
      matcher: "^120.*"
    assets:
      - name: "{{ .Values.pn }}-stable_{{ .Values.version }}_amd64.deb"
        url: "https://get.geo.opera.com/pub/opera/desktop/{{ .Values.version }}/linux/opera-stable_{{ .Values.version }}_amd64.deb"

  packages:
    - opera:
        vars:
          extra_envs:
            - |
              CHROMIUM_LANGS="am ar bg bn ca cs da de el en-GB en-US es es-419 et fa fi fil fr gu he hi \
                hr hu id it ja kn ko lt lv ml mr ms nb nl pl pt-BR pt-PT ro ru sk sl sr sv \
                sw ta te th tr uk vi zh-CN zh-TW"
            - QA_PREBUILT="*"

          homepage: https://www.opera.com/
          desc: A fast and secure web browser
          license: OPERA-2014
          s: ${WORKDIR}
          rdepend: |
            dev-libs/expat
            dev-libs/glib:2
            dev-libs/nspr
            dev-libs/nss
            media-libs/alsa-lib
            media-libs/fontconfig
            media-libs/freetype
            net-misc/curl
            net-print/cups
            sys-apps/dbus
            x11-libs/cairo
            x11-libs/gdk-pixbuf
            x11-libs/gtk+:3
            x11-libs/libX11
            x11-libs/libXScrnSaver
            x11-libs/libXcomposite
            x11-libs/libXcursor
            x11-libs/libXdamage
            x11-libs/libXext
            x11-libs/libXfixes
            x11-libs/libXi
            x11-libs/libXrandr
            x11-libs/libXrender
            x11-libs/libXtst
            x11-libs/libnotify
            x11-libs/pango[X]
          inherit:
            - chromium-2
            - xdg-utils
            - unpacker
            - desktop
          body: |
            src_unpack() {
              unpack_deb ${A}
            }
            src_prepare() {
              default
              OPERA_HOME="usr/$(get_libdir)/${PN}"
              case ${ARCH} in
                amd64)
                  mv usr/lib/x86_64-linux-gnu usr/$(get_libdir) || die
                  rm -r usr/lib || die
                  ;;
              esac
              rm usr/bin/${PN} || die
              rm usr/share/doc/${PN}-stable/copyright || die
              mv usr/share/doc/${PN}-stable usr/share/doc/${PF} || die
              gunzip usr/share/doc/${PF}/changelog.gz || die
              pushd "${OPERA_HOME}"/localization > /dev/null || die
              chromium_remove_language_paks
              popd > /dev/null || die
              sed -i \
                -e 's|^TargetEnvironment|X-&|g' \
                usr/share/applications/${PN}.desktop || die
            }
            src_install() {
              rm "${OPERA_HOME}"/${PN}_autoupdate || die
              mv * "${D}" || die
              dosym ../$(get_libdir)/${PN}/${PN} /usr/bin/${PN}
              fperms 4711 /"${OPERA_HOME}"/opera_sandbox
            }
            pkg_postinst() {
              xdg_desktop_database_update
              xdg_mimeinfo_database_update
            }
            pkg_postrm() {
              xdg_desktop_database_update
              xdg_mimeinfo_database_update
            }



firefox:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: www-client
    dir:
      url: "{{ .Values.baseurl }}/"
      matcher: '[1-9][0-9][0-9].*'
      exclude: "esr|b[0-9]|test|rc[0-9]"
    vars:
      baseurl: 'https://archive.mozilla.org/pub/firefox/releases'
      src_unpack: |
        src_unpack() {
          einfo "${A}"
          local _lp_dir="${WORKDIR}/language_packs"
          local _src_file

          if [[ ! -d "${_lp_dir}" ]] ; then
            mkdir "${_lp_dir}" || die
          fi

          for _src_file in ${A} ; do
            if [[ ${_src_file} == *.xpi ]]; then
              cp "${DISTDIR}/${_src_file}" "${_lp_dir}" || die "Failed to copy '${_src_file}' to '${_lp_dir}'!"
            else
              unpack ${_src_file}
            fi
          done
        }
      moz_install_xpi: |
        moz_install_xpi() {
          debug-print-function ${FUNCNAME} "$@"

          if [[ ${#} -lt 2 ]] ; then
            die "${FUNCNAME} requires at least two arguments"
          fi

          local DESTDIR=${1}
          shift

          insinto "${DESTDIR}"

          local emid xpi_file xpi_tmp_dir
          for xpi_file in "${@}" ; do
            emid=
            xpi_tmp_dir=$(mktemp -d --tmpdir="${T}")
            # Unpack XPI
            unzip -qq "${xpi_file}" -d "${xpi_tmp_dir}" || die
            # Determine extension ID
            if [[ -f "${xpi_tmp_dir}/install.rdf" ]] ; then
              emid=$(
                sed -n -e '/install-manifest/,$ { /em:id/!d; s/.*[\">]\([^\"<>]*\)[\"<].*/\1/; p; q }' \
                "${xpi_tmp_dir}/install.rdf")
              [[ -z "${emid}" ]] && die "failed to determine extension id from install.rdf"
            elif [[ -f "${xpi_tmp_dir}/manifest.json" ]] ; then
              emid=$(sed -n -e 's/.*"id": "\([^"]*\)".*/\1/p' "${xpi_tmp_dir}/manifest.json")
              [[ -z "${emid}" ]] && die "failed to determine extension id from manifest.json"
            else
              die "failed to determine extension id"
            fi

            einfo "Installing ${emid}.xpi into ${ED}/${DESTDIR} ..."
            newins "${xpi_file}" "${emid}.xpi"
          done
        }
    assets:
      - name: '{{- if eq .Values.pn "firefox-bin" }}{{ .Values.pn }}_x86_64-{{ .Values.version }}{{- else }}{{ .Values.pn }}-{{ .Values.version }}.source{{- end }}.tar.xz'
        url: '{{ .Values.baseurl }}/{{ .Values.version }}/{{- if eq .Values.pn "firefox-bin" }}linux-x86_64/en-US/firefox-{{ .Values.version }}{{- else }}source/firefox-{{ .Values.version }}.source{{- end }}.tar.xz'
        use: amd64

      - name: '{{ .Values.pn | replace "-bin" "" }}_x86_64-{{ .Values.version }}-ach.xpi'
        url: "{{ .Values.baseurl }}/{{ .Values.version }}/linux-x86_64/xpi/ach.xpi"
        use: l10n_ach

      - name: '{{ .Values.pn | replace "-bin" "" }}_x86_64-{{ .Values.version }}-af.xpi'
        url: "{{ .Values.baseurl }}/{{ .Values.version }}/linux-x86_64/xpi/af.xpi"
