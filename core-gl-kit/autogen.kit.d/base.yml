gitlab_freedesktop_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: app-misc
    dir:
      url: 'https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags'
      matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/releases/[0-9.]+"
      # Skip release candidate/beta versions
      exclude: '90[0-9]$'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/archive/{{ .Values.original_version }}/{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
    vars:
      license: MIT
      inherit:
        - meson

  packages:

    - libdecor:
        category: gui-libs
        vars:
          desc: A client-side decorations library for Wayland clients
          homepage: https://gitlab.freedesktop.org/libdecor/libdecor
          gitlab_user: libdecor
          gitlab_repo: libdecor
          license: MIT
          iuse: +dbus +gtk examples
          rdepend: |
            dev-libs/wayland
            x11-libs/pango
            x11-libs/cairo
            dbus? ( sys-apps/dbus )
            gtk? ( x11-libs/gtk+:3 )
            examples? (
              media-libs/libglvnd
              x11-libs/libxkbcommon
            )
          depend: |
            ${RDEPEND}
            dev-libs/wayland-protocols
          bdepend: |
            dev-util/wayland-scanner
            virtual/pkgconfig
          body: |
            src_configure() {
              local emesonargs=(
                # Avoid auto-magic, built-in feature of meson
                -Dauto_features=disabled
                $(meson_feature gtk)
                $(meson_feature dbus)
                $(meson_use examples demo)
                -Dinstall_demo=true
              )
              meson_src_configure
            }

    - switcheroo-control:
        category: sys-power
        vars:
          desc: D-Bus service to check the availability of dual-GPU
          python_compat: python3+
          license: GPL-3
          slot: '0'
          homepage: https://gitlab.freedesktop.org/hadess/switcheroo-control/
          gitlab_user: hadess
          gitlab_repo: switcheroo-control
          inherit:
              - meson
              - python-single-r1
              - systemd
          iuse: gtk-doc systemd
          required_use: '${PYTHON_REQUIRED_USE}'
          rdepend: |
              ${PYTHON_DEPS}
              $(python_gen_cond_dep 'dev-python/pygobject:3[${PYTHON_USEDEP}]')
              >=dev-libs/glib-2.56.0:2
              >=dev-libs/libgudev-232:=
          depend: '${RDEPEND}'
          bdepend: |
              $(python_gen_cond_dep 'dev-python/pygobject:3[${PYTHON_USEDEP}]')
              dev-util/gdbus-codegen
              gtk-doc? ( dev-util/gtk-doc )
          body: |
            python_check_deps() {
              python_has_version "dev-python/pygobject:3[${PYTHON_USEDEP}]"
            }
            src_configure() {
              local emesonargs=(
                -Dsystemdsystemunitdir="$(systemd_get_systemunitdir)"
                $(meson_use gtk-doc gtk_doc)
                -Dtests=false
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              python_fix_shebang "${ED}"/usr/bin/switcherooctl
              if ! systemd ; then
                newinitd "${FILESDIR}"/${PN}-init.d ${PN}
              fi
            }
            pkg_postinst() {
              if [[ -z "${REPLACING_VERSIONS}" ]]; then
                elog "You need to enable the service:"
                if systemd_is_booted; then
                  elog "# systemctl enable ${PN}"
                else
                  elog "# rc-update add ${PN} default"
                fi
              fi
            }

    - wayland-utils:
        vars:
          desc: Display information about supported Wayland protocols and current compositor
          homepage: https://gitlab.freedesktop.org/wayland/wayland-utils
          gitlab_user: wayland
          gitlab_repo: wayland-utils
          rdepend: |
            dev-libs/wayland
            x11-libs/libdrm
          depend: |
            ${RDEPEND}
            dev-libs/wayland-protocols
          bdepend: |
            dev-util/wayland-scanner
          body: |
            src_configure() {
              local emesonargs=(
                -Ddrm=enabled
              )
              meson_src_configure
            }


