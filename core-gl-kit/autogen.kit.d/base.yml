vulkan_pkgs:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: dev-util
    github:
      user: KhronosGroup
      match: "vulkan-sdk-"
      query: tags
    transform:
      - kind: string
        match: "vulkan-sdk-"
        replace: ""

  packages:

    - glslang:
        vars:
          python_compat: python3+
          inherit:
            - cmake-utils
            - python-any-r1
          depend: |
            dev-util/spirv-tools
          bdepend: |
            ${PYTHON_DEPS}
            dev-util/spirv-tools
          body: |
            src_configure() {
              local mycmakeargs=(
                -DALLOW_EXTERNAL_SPIRV_TOOLS=1
              )
              cmake-utils_src_configure
            }
            # Override the src_install to add additonal libraries
            src_install() {
              default
              cmake-utils_src_install
              mv ${WORKDIR}/*glslang-*_build/OGLCompilersDLL/libOGLCompiler.a ${ED}/usr/lib64
              mv ${WORKDIR}/*glslang-*_build/glslang/OSDependent/Unix/libOSDependent.a ${ED}/usr/lib64
            }

    - spirv-tools:
        github:
          repo: SPIRV-Tools
        exclude:
          # Temporary until mark-devkit > 0.26.0
          - "^20[0-9][0-9]"

        vars:
          python_compat: python3+
          inherit:
            - cmake-utils
            - python-any-r1
          bdepend: |
            ${PYTHON_DEPS}
            >=dev-util/spirv-headers-{{ .Values.version }}
          depend: |
            dev-util/spirv-headers

          body: |
            src_configure() {
              local mycmakeargs=(
                "-DSPIRV-Headers_SOURCE_DIR=/usr/"
                "-DSPIRV_WERROR=OFF"
                "-DSPIRV_TOOLS_BUILD_STATIC=OFF"
                "-DBUILD_SHARED_LIBS=ON"
              )
              cmake-utils_src_configure
            }


    - volk:
        github:
          user: zeux
        vars:
          inherit:
            - cmake-utils
          rdepend: |
            >=media-libs/vulkan-loader-{{ .Values.version }}
          depend: |
            ${RDEPEND}
            >=dev-util/vulkan-headers-{{ .Values.version }}
          body: |
            src_configure() {
              local mycmakeargs=(
                -DVOLK_INSTALL=on
              )
              cmake-utils_src_configure
            }

    - vulkan-headers:
        github:
          repo: Vulkan-Headers
        vars:
          inherit:
            - cmake-utils
          bdepend: |
            dev-util/cmake

    - vulkan-layers:
        category: media-libs
        github:
          repo: Vulkan-ValidationLayers
        vars:
          python_compat: python3+
          inherit:
            - cmake-utils
            - python-any-r1
          iuse: wayland X
          bdepend: |
            dev-util/cmake
            ${PYTHON_DEPS}
          depend: |
            dev-util/glslang
            dev-util/spirv-tools
            dev-util/vulkan-headers
            dev-util/vulkan-utility-libraries
            dev-cpp/robin-hood-hashing
            wayland? ( dev-libs/wayland:= )
            X? (
              x11-libs/libX11:=
              x11-libs/libXrandr:=
            )
          body: |
            src_configure() {
              local mycmakeargs=(
                -DCMAKE_SKIP_RPATH=ON
                -DBUILD_WSI_WAYLAND_SUPPORT=$(usex wayland)
                -DBUILD_WSI_XCB_SUPPORT=$(usex X)
                -DBUILD_WSI_XLIB_SUPPORT=$(usex X)
                -DBUILD_TESTS=OFF
                -DGLSLANG_INSTALL_DIR="/usr"
                -DCMAKE_INSTALL_INCLUDEDIR="/usr/include/"
                -DSPIRV_HEADERS_INSTALL_DIR="/usr"
              )
              cmake-utils_src_configure
            }

    - vulkan-loader:
        category: media-libs
        github:
          repo: Vulkan-Loader
        vars:
          python_compat: python3+
          inherit:
            - cmake-utils
            - python-any-r1
          iuse: layers wayland X
          bdepend: |
            dev-util/cmake
          depend: |
            {{- $v := .Values.version }}
            ${PYTHON_DEPS}
            >=dev-util/vulkan-headers-{{ join "." ( slice ( splitList "." $v ) 0 3 ) }}
            wayland? ( dev-libs/wayland:= )
            X? (
              x11-libs/libX11:=
              x11-libs/libXrandr:=
            )
          pdepend: |
            {{- $v := .Values.version }}
            layers? (
              >=media-libs/vulkan-layers-{{ join "." ( slice ( splitList "." $v ) 0 3 ) }}
            )
          body: |
            post_src_prepare() {
              # on 64-bit systems, have pkgconfig file reference 'libvulkan' not 'libvulkan64'.
              sed -i -e s'/^Libs:.*$/Libs: -L${libdir} -lvulkan/' loader/vulkan.pc.in || die
            }
            src_configure() {
              local mycmakeargs=(
                -DCMAKE_SKIP_RPATH=ON
                -DBUILD_TESTS=OFF
                -DBUILD_LOADER=ON
                -DBUILD_WSI_WAYLAND_SUPPORT=$(usex wayland)
                -DBUILD_WSI_XCB_SUPPORT=$(usex X)
                -DBUILD_WSI_XLIB_SUPPORT=$(usex X)
                -DVULKAN_HEADERS_INSTALL_DIR="${ESYSROOT}/usr"
              )
              cmake-utils_src_configure
            }
            src_install() {
              keepdir /etc/vulkan/icd.d
              cmake-utils_src_install
            }

    - vulkan-tools:
        github:
          repo: Vulkan-Tools
        vars:
          python_compat: python3+
          iuse: cube wayland +X
          required_use: |
            !cube? ( || ( X wayland ) ) cube? ( ^^ ( X wayland ) )
          inherit:
            - cmake-utils
            - python-any-r1
          bdepend: |
            ${PYTHON_DEPS}
            dev-util/cmake
            cube? ( dev-util/glslang:= )
          rdepend: |
            {{- $v := .Values.version }}
            >=media-libs/vulkan-loader-{{ join "." ( slice ( splitList "." $v ) 0 3 ) }}:=[wayland,X?]
            wayland? ( dev-libs/wayland:= )
            X? (
              x11-libs/libX11:=
              x11-libs/libXrandr:=
            )
          depend: |
            {{- $v := .Values.version }}
            ${RDEPEND}
            >=dev-util/vulkan-headers-{{ join "." ( slice ( splitList "." $v ) 0 3 ) }}
            >=dev-util/volk-{{ join "." ( slice ( splitList "." $v ) 0 3 ) }}
          body: |
            pkg_setup() {
              python-any-r1_pkg_setup
            }
            src_configure() {
              local mycmakeargs=(
                -DCMAKE_SKIP_RPATH=ON
                -DBUILD_VULKANINFO=ON
                -DBUILD_CUBE=$(usex cube)
                -DBUILD_WSI_WAYLAND_SUPPORT=$(usex wayland)
                -DBUILD_WSI_XCB_SUPPORT=$(usex X)
                -DBUILD_WSI_XLIB_SUPPORT=$(usex X)
                -DVULKAN_HEADERS_INSTALL_DIR="${EPREFIX}/usr"
              )
              use cube && mycmakeargs+=(
                -DGLSLANG_INSTALL_DIR="${EPREFIX}/usr"
                -DCUBE_WSI_SELECTION=$(usex X XCB WAYLAND)
              )
              cmake-utils_src_configure
            }
            src_install() {
              cmake-utils_src_install
            }

    - vulkan-utility-libraries:
        github:
          repo: Vulkan-Utility-Libraries
        vars:
          python_compat: python3+
          inherit:
            - cmake-utils
            - python-any-r1
          bdepend: |
            ${PYTHON_DEPS}
            dev-util/cmake
          depend: |
            {{- $v := .Values.version }}
            >=dev-util/vulkan-headers-{{ join "." ( slice ( splitList "." $v ) 0 3 ) }}
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_TESTS=OFF
              )
              cmake-utils_src_configure
            }


opencl_stuff:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: dev-util
    github:
      user: KhronosGroup
      query: tags

  packages:
    - opencl-headers:
        github:
          repo: OpenCL-Headers
        vars:
          inherit:
            - cmake

    - opencl-icd-loader:
        github:
          repo: OpenCL-ICD-Loader
        vars:
          rdepend: |
            !dev-libs/ocl-icd
          depend: |
            >=dev-util/opencl-headers-{{ .Values.version }}
          inherit:
            - cmake
            - prefix
          body: |
            src_prepare() {
              hprefixify loader/icd_platform.h
              cmake_src_prepare
            }

freeglut:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: media-libs
    github:
      query: tags

  packages:

    - freeglut:
        exclude:
          - "rc"
        vars:
          inherit:
            - cmake
          iuse: static-libs
          rdepend: |
            virtual/glu
            virtual/opengl
            x11-libs/libX11
            x11-libs/libXext
            x11-libs/libXi
            x11-libs/libXrandr
            x11-libs/libXxf86vm
          depend: |
            ${RDEPEND}
            x11-base/xorg-proto
          bdepend: |
            virtual/pkgconfig
          body: |
            src_configure() {
              local mycmakeargs=(
                "-DFREEGLUT_GLES=OFF"
                "-DFREEGLUT_BUILD_DEMOS=OFF"
                "-DFREEGLUT_BUILD_STATIC_LIBS=$(usex static-libs ON OFF)"
              )
              cmake_src_configure
            }
            src_install() {
              cmake_src_install
              cp "${ED}"/usr/$(get_libdir)/pkgconfig/{,free}glut.pc || die
            }

glu:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs

    dir:
      url: https://archive.mesa3d.org/glu/
      matcher: "glu-.*.tar.xz$"
      exclude: "rc"

    transform:
      - kind: string
        match: 'glu-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''

    vars:
      desc: The OpenGL Utility Library
      homepage: https://gitlab.freedesktop.org/mesa/glu
      inherit:
        - meson
      iuse: +libglvnd
      license: SGI-B-2.0
      rdepend: |
        virtual/opengl
        libglvnd? ( media-libs/libglvnd )
      depend: '${RDEPEND}'
      body: |
        src_configure() {
          local emesonargs=(
            -Dgl_provider=$(usex libglvnd glvnd gl)
          )
          meson_src_configure
        }

  packages:
    - glu:


mesa:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: media-libs

    dir:
      url: https://archive.mesa3d.org/
      matcher: "mesa-.*.tar.xz$"
      exclude: "rc"

    transform:
      - kind: string
        match: 'mesa-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''

    vars:
      python_compat: python3+
      license: MIT
      homepage: https://www.mesa3d.org/ https://mesa.freedesktop.org/
      desc: OpenGL-like graphic library for Linux
      inherit:
        - meson
        - python-any-r1

      radeon_cards:
        - r300
        - r600
        - radeon
        - radeonsi
      video_cards:
        - freedreno
        - intel
        - lima
        - nouveau
        - panfrost
        - v3d
        - vc4
        - virgl
        - vivante
        - vmware
      iuse: |
        cpu_flags_x86_sse2 d3d9 debug +egl +gbm gles1 +gles2 +glvnd +llvm
        lm_sensors opencl unwind vaapi valgrind vulkan
        vulkan-overlay wayland +X xa zink +zstd llvm_targets_AMDGPU
      required_use: |
        d3d9?   ( || ( video_cards_intel video_cards_r300 video_cards_r600 video_cards_radeonsi video_cards_nouveau video_cards_vmware ) )
        vulkan? ( video_cards_radeonsi? ( llvm ) )
        vulkan-overlay? ( vulkan )
        video_cards_radeon? ( llvm )
        video_cards_r300?   ( llvm )
        video_cards_radeonsi?   ( llvm )
        xa? ( X )
        zink? ( vulkan )
      rdepend: |
        dev-libs/expat
        media-libs/libglvnd[X?]
        sys-libs/zlib
        unwind? ( sys-libs/libunwind )
        llvm? (
          video_cards_radeonsi? (
            virtual/libelf:0=
          )
          video_cards_r600? (
            virtual/libelf:0=
          )
          video_cards_radeon? (
            virtual/libelf:0=
          )
          dev-libs/libclc
        )
        lm_sensors? ( sys-apps/lm_sensors:= )
        opencl? (
              virtual/opencl
              dev-libs/libclc
              virtual/libelf:0=
            )
        vaapi? (
          x11-libs/libva:=
        )
        wayland? (
          dev-libs/wayland:=
        )
        x11-libs/libdrm[video_cards_freedreno?,video_cards_intel?,video_cards_nouveau?,video_cards_vc4?,video_cards_vivante?,video_cards_vmware?]
        vulkan-overlay? ( dev-util/glslang:0= )
        X? (
          x11-libs/libX11:=
          x11-libs/libxshmfence:=
          x11-libs/libXext:=
          x11-libs/libXxf86vm:=
          x11-libs/libxcb:=
          x11-libs/libXfixes:=
        )
        zink? ( media-libs/vulkan-loader:= )
        zstd? ( app-arch/zstd:= )
        vulkan? (
          dev-util/glslang
          >=dev-util/spirv-tools-1.4.328.1
          dev-util/spirv-llvm-translator
        )
        {{- range $target := .Values.radeon_cards }}
        video_cards_{{ $target }}? (
          x11-libs/libdrm[video_cards_radeon]
          sys-devel/llvm[llvm_targets_AMDGPU]
        )
        {{- end }}
        video_cards_radeonsi? (
          x11-libs/libdrm[video_cards_amdgpu]
          sys-devel/llvm[llvm_targets_AMDGPU]
        )

      depend: |
        ${RDEPEND}
        valgrind? ( dev-util/valgrind )
        wayland? ( dev-libs/wayland-protocols )
        X? (
          x11-libs/libXrandr
          x11-base/xorg-proto
        )
      bdepend: |
        ${PYTHON_DEPS}
        sys-devel/bison
        sys-devel/flex
        virtual/pkgconfig
        $(python_gen_any_dep "
          >=dev-python/mako-0.8.0[\${PYTHON_USEDEP}]
          dev-python/pyyaml[\${PYTHON_USEDEP}]"
        )
        wayland? ( dev-util/wayland-scanner )

      body: |
        pkg_setup() {
          python-any-r1_pkg_setup
        }
        src_configure() {
          local emesonargs=()
          local llvm_version=$(clang --version  | grep version  | cut -d' ' -f 4 | cut -d'.' -f1)

          local platforms
          use X && platforms+="x11"
          use wayland && platforms+=",wayland"
          emesonargs+=(-Dplatforms=${platforms#,})

          if use video_cards_r600 ||
             use video_cards_radeonsi ||
             use video_cards_nouveau; then
            emesonargs+=($(meson_feature vaapi gallium-va))
            use vaapi && emesonargs+=( -Dva-libs-path="${EPREFIX}"/usr/$(get_libdir)/va/drivers )
          else
            emesonargs+=(-Dgallium-va=disabled)
          fi

          gallium_enable !llvm softpipe
          gallium_enable llvm llvmpipe
          gallium_enable video_cards_freedreno freedreno
          gallium_enable video_cards_intel crocus i915 iris
          gallium_enable video_cards_lima lima
          gallium_enable video_cards_nouveau nouveau
          gallium_enable video_cards_panfrost panfrost
          gallium_enable video_cards_v3d v3d
          gallium_enable video_cards_vc4 vc4
          gallium_enable video_cards_virgl virgl
          gallium_enable video_cards_vivante etnaviv
          gallium_enable video_cards_vmware svga
          gallium_enable zink zink

          gallium_enable video_cards_r300 r300
          gallium_enable video_cards_r600 r600
          gallium_enable video_cards_radeonsi radeonsi
          if ! use video_cards_r300 && \
            ! use video_cards_r600; then
            gallium_enable video_cards_radeon r300 r600
          fi

          if use vulkan; then
            vulkan_enable video_cards_freedreno freedreno
            vulkan_enable video_cards_intel intel
            vulkan_enable video_cards_panfrost panfros
            vulkan_enable video_cards_radeonsi amd
            vulkan_enable video_cards_v3d broadcom
            vulkan_enable video_cards_virgl virtio
          fi

          driver_list() {
            local drivers="$(sort -u <<< "${1// /$'\n'}")"
            echo "${drivers//$'\n'/,}"
          }

          local vulkan_layers
          use vulkan && vulkan_layers+="device-select"
          use vulkan-overlay && vulkan_layers+=",overlay"
          emesonargs+=(-Dvulkan-layers=${vulkan_layers#,})

          # Force PKG_CONFIG_PATH for LLVMSPIRVLib
          PKG_CONFIG_PATH="/usr/lib/llvm/${llvm_version}/$(get_libdir)/pkgconfig"

          emesonargs+=(
            -Dbuild-tests=false
            -Dexpat=enabled
            -Dglx=$(usex X dri disabled)
            $(meson_feature egl)
            $(meson_feature gbm)
            $(meson_feature glvnd)
            $(meson_feature gles1)
            $(meson_feature gles2)
            $(meson_feature llvm)
            $(meson_feature lm_sensors lmsensors)
            $(meson_feature unwind libunwind)
            $(meson_feature zstd)
            $(meson_use cpu_flags_x86_sse2 sse2)
            -Dvalgrind=$(usex valgrind auto disabled)
            -Dgallium-drivers=$(driver_list "${GALLIUM_DRIVERS[*]}")
            -Dvulkan-drivers=$(driver_list "${VULKAN_DRIVERS[*]}")
            --buildtype $(usex debug debug plain)
            -Db_ndebug=$(usex debug false true)
          )
          meson_src_configure
        }
        gallium_enable() {
          if [[ $1 == -- ]] || use $1; then
            shift
            GALLIUM_DRIVERS+=("$@")
          fi
        }
        vulkan_enable() {
          if [[ $1 == -- ]] || use $1; then
            shift
            VULKAN_DRIVERS+=("$@")
          fi
        }

  packages:
    - mesa:

    # Keep mesa 25 for now
    - mesa:
        selector:
          - '<26.0'



ocl_icd:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: dev-libs
    github:
      user: OCL-dev
      query: tags

  packages:
    - ocl-icd:
        vars:
          inherit:
            - autotools
            - flag-o-matic
            - ruby-single
          extra_envs:
            - 'USE_RUBY="ruby30 ruby31 ruby32"'
          bdepend: |
            ${RUBY_DEPS}
          depend: |
            dev-util/opencl-headers
            app-text/asciidoc
          rdepend: |
            !dev-libs/opencl-icd-loader
          body: |
            src_prepare() {
              replace-flags -Os -O2 # bug 646122
              default
              eautoreconf
            }
            src_configure() {
              # dev-util/opencl-headers ARE official Khronos Group headers, what this option
              # does is disable the use of the bundled ones
              ECONF_SOURCE="${S}" econf --enable-pthread-once --disable-official-khronos-headers
            }
            src_install() {
              default
              # Drop .la files
              find "${ED}" -name '*.la' -delete || die
            }

nvidia_stuff:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: gui-libs
    github:
      user: NVIDIA
      query: tags
    vars:
      inherit:
        - meson
  packages:

    - egl-gbm:
        vars:
          rdepend: |
            media-libs/mesa[gbm(+)]
            x11-libs/libdrm
          depend: |
            ${RDEPEND}
            gui-libs/eglexternalplatform
            media-libs/libglvnd
          body: |
            src_install() {
              meson_src_install
              insinto /usr/share/egl/egl_external_platform.d
              doins "${FILESDIR}"/15_nvidia_gbm.json
            }

    - egl-wayland:
        vars:
          rdepend: |
            dev-libs/wayland
            x11-libs/libdrm
          depend: |
            ${RDEPEND}
            dev-libs/wayland-protocols
            gui-libs/eglexternalplatform
            media-libs/libglvnd
          bdepend: |
            dev-util/wayland-scanner
          patches:
            - egl-wayland-1.1.6-remove-werror.patch
          body: |
            src_install() {
              meson_src_install
              insinto /usr/share/egl/egl_external_platform.d
              doins "${FILESDIR}"/10_nvidia_wayland.json
            }

    - eglexternalplatform:

    - libglvnd:
        revision: 1
        category: media-libs
        vars:
          python_compat: python3+
          inherit:
            - meson
            - python-any-r1
          iuse: +asm +egl +gles +gles2 +glx +headers tls +X
          bdepend: |
            ${PYTHON_DEPS}
          rdepend: |
            X? (
              x11-libs/libX11
              x11-libs/libXext
            )
          depend: |
            ${RDEPEND}
            X? (
              x11-base/xorg-proto
            )
          patches:
            - libglvnd-1.7.0-backport-pr291.patch
          body: |
            src_prepare() {
              default
              sed -i -e "/^PLATFORM_SYMBOLS/a \    '__gentoo_check_ldflags__'," bin/symbols-check.py || die
            }
            src_configure() {
              local emesonargs=(
                -Dasm=$(usex asm enabled disabled)
                -Degl=$(usex egl true false)
                -Dgles1=$(usex gles true false)
                -Dgles2=$(usex gles2 true false)
                -Dglx=$(usex glx enabled disabled)
                -Dheaders=$(usex headers true false)
                -Dtls=$(usex tls true false)
                -Dx11=$(usex X enabled disabled)
              )
              use elibc_musl && emesonargs+=( -Dtls=false )
              meson_src_configure
            }
            src_compile() {
              meson_src_compile
            }
            src_install() {
              meson_src_install
            }


x11_input_drivers:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: x11-drivers

    dir:
      url: https://www.x.org/releases/individual/driver/
      exclude: "99.*"
    vars:
      inherit:
        - autotools
        - flag-o-matic
      extra_envs:
        - 'WANT_AUTOCONF="latest"'
        - 'WANT_AUTOMAKE="latest"'
        - 'AUTOTOOLS_AUTORECONF="1"'
      desc: Driver for xorg-server
      body: |
        pkg_setup() {
          append-ldflags -Wl,-z,lazy
        }
        src_prepare() {
          eautoreconf || die
          default
        }
        src_install() {
          default
          find "${D}" -type f -name '*.la' -delete || die
        }
      depend: |
        ${RDEPEND}
        x11-base/xorg-proto
        sys-devel/libtool
        sys-devel/m4
        sys-libs/mtdev

  packages:
    - xf86-input-evdev:
        dir:
          matcher: "xf86-input-evdev-.*.tar.xz$"
        transform:
          - kind: string
            match: 'xf86-input-evdev-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          rdepend: |
            x11-base/xorg-server
            x11-misc/util-macros
            dev-libs/libevdev
            x11-libs/libXi
            x11-libs/libXtst
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
            x11-base/xorg-proto
            sys-devel/libtool
            sys-devel/m4
            sys-libs/mtdev

    - xf86-input-libinput:
        dir:
          matcher: "xf86-input-libinput-.*.tar.xz$"
        transform:
          - kind: string
