media_fonts_noop:
  generator: builtin-noop
  template:
    engine: helm

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: media-fonts

  packages:
    - sedgwick-ave-display:
        vars:
          versions:
            - "20250621"
          # SIL Open Font License Version 1.1
          license: OFL
          desc: Sedgwick Ave Display Font
          inherit:
            - font
          bdepend: |
            app-arch/unzip
          s: "${WORKDIR}"
          body: |
            src_install() {
              local fontdir=/usr/share/fonts
              insinto ${fontdir}
              doins ${S}/SedgwickAveDisplay-Regular.ttf
            }
            pkg_postrm() {
              font_pkg_postrm
            }
            pkg_postinst() {
              font_pkg_postinst
            }
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.zip"
            url: https://font.download/dl/font/sedgwick-ave-display.zip


gnome_release_pkgs:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  extensions_defs:
    rust:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-fonts
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.tar.xz"
      exclude: "beta|rc|alpha"
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""

    vars:
      license: OFL-1.1
      homepage: 'https://gitlab.gnome.org/GNOME/{{ .Values.pkgname | default .Values.pn }}'
      release: 49
      inherit:
        - font
        - meson

  packages:

    - adwaita-fonts:
        vars:
          desc: The typefaces for GNOME
          body: |
            src_configure() {
              local emesonargs=(
                -Ddatadir="${EPREFIX}/usr/share"
              )
              meson_src_configure
            }

