nvidia_drivers:
  generator: builtin-dirlisting

  defaults:
    category: x11-drivers
    files_dir: "{{ .Values.pn }}"
    template: templates/nvidia-drivers.tmpl
    dir:
      url: https://download.nvidia.com/XFree86/Linux-x86_64/
    assets:
      - name: NVIDIA-Linux-x86_64-{{ .Values.version }}-no-compat32.run
        url: http://download.nvidia.com/XFree86/Linux-x86_64/{{ .Values.version }}/NVIDIA-Linux-x86_64-{{ .Values.version }}-no-compat32.run
        use: amd64

      - name: NVIDIA-Linux-aarch64-{{ .Values.version }}.run
        url: http://download.nvidia.com/XFree86/Linux-aarch64/{{ .Values.version }}/NVIDIA-Linux-aarch64-{{ .Values.version }}.run
        use: arm64

  packages:
    - nvidia-drivers:
        # 535.86
        vars:
          slot: 535
          max_kernel_version: 6.12
        dir:
          matcher: "535.*"
        # The selector is needed in order
        # to compare only the version of this
        # slot. The package autogen process
        # doesn't use slot for compare versions.
        selector:
          - '<536'
          - '>534'

    - nvidia-drivers:
        # 550.*
        vars:
          slot: 550
          max_kernel_version: 6.14
        dir:
          matcher: "550.*"
        selector:
          - '<551'
          - '>549'

    - nvidia-drivers:
        # 555.*
        vars:
          slot: 555
          max_kernel_version: 6.14
        dir:
          matcher: "555.*"
        selector:
          - '<556'
          - '>554'

    - nvidia-drivers:
        # 560.*
        vars:
          slot: 560
          max_kernel_version: 6.14
        dir:
          matcher: "560.*"
        selector:
          - '<561'
          - '>559'

    - nvidia-drivers:
        # 565.*
        vars:
          slot: 565
          max_kernel_version: 6.14
        dir:
          matcher: "565.*"
        selector:
          - '<566'
          - '>564'

    - nvidia-drivers:
        # 570.*
        vars:
          slot: 570
          max_kernel_version: 6.14
        dir:
          matcher: "570.*"
        selector:
          - '<571'
          - '>569'

    - nvidia-drivers:
        # 575.*
        vars:
          slot: 575
          max_kernel_version: 6.14
        dir:
          matcher: "575.*"
        selector:
          # version broken
          - '!=575.64.05'
          - '<576'
          - '>574'

