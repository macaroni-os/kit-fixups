sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-gl-kit
  url: "https://github.com/macaroni-os/core-gl-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: dev-libs/ocl-icd

    - pkg: dev-util/glslang
    - pkg: dev-util/opencl-headers
    - pkg: dev-util/opencl-icd-loader
    - pkg: dev-util/spirv-tools
    - pkg: dev-util/volk
    - pkg: dev-util/vulkan-headers
    - pkg: dev-util/vulkan-tools
    - pkg: dev-util/vulkan-utility-libraries

    - pkg: gui-libs/eglexternalplatform
    - pkg: gui-libs/egl-gbm
    - pkg: gui-libs/egl-wayland

    - pkg: x11-drivers/xf86-input-evdev
    - pkg: x11-drivers/xf86-input-libinput
    - pkg: x11-drivers/xf86-input-mouse
    - pkg: x11-drivers/xf86-input-synaptics
    - pkg: x11-drivers/xf86-input-vmmouse
    - pkg: x11-drivers/xf86-input-wacom

    - pkg: media-fonts/sedgwick-ave-display

    - pkg: media-libs/freeglut
    - pkg: media-libs/glu
    - pkg: media-libs/libglvnd
    - pkg: media-libs/mesa
    - pkg: media-libs/vulkan-layers
    - pkg: media-libs/vulkan-loader

    # 535 release
    - pkg: x11-drivers/nvidia-drivers:535
      conditions:
        - '>=x11-drivers/nvidia-drivers-535:535'
    # 550 release
    - pkg: x11-drivers/nvidia-drivers:550
      conditions:
        - '>=x11-drivers/nvidia-drivers-550:550'
    # 555 release
    - pkg: x11-drivers/nvidia-drivers:555
      conditions:
        - '>=x11-drivers/nvidia-drivers-555:555'
    # 560 release
    - pkg: x11-drivers/nvidia-drivers:560
      conditions:
        - '>=x11-drivers/nvidia-drivers-560:560'
    # 565 release
    - pkg: x11-drivers/nvidia-drivers:565
      conditions:
        - '>=x11-drivers/nvidia-drivers-565:565'
    # 570 release
    - pkg: x11-drivers/nvidia-drivers:570
      conditions:
        - '>=x11-drivers/nvidia-drivers-570:570'
    # 575 release
    - pkg: x11-drivers/nvidia-drivers:575
      conditions:
        - '>=x11-drivers/nvidia-drivers-575:575'
    # 580 release
    - pkg: x11-drivers/nvidia-drivers:580
      conditions:
        - '>=x11-drivers/nvidia-drivers-580:580'

    # 535 release
    - pkg: x11-drivers/nvidia-kernel-modules:535
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-535:535'

    # 550 release
    - pkg: x11-drivers/nvidia-kernel-modules:550
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-550:550'

    # 555 release
    - pkg: x11-drivers/nvidia-kernel-modules:555
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-555:555'

    # 560 release
    - pkg: x11-drivers/nvidia-kernel-modules:560
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-560:560'

    # 565 release
    - pkg: x11-drivers/nvidia-kernel-modules:565
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-565:565'

    # 570 release
    - pkg: x11-drivers/nvidia-kernel-modules:570
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-570:570'

    # 575 release
    - pkg: x11-drivers/nvidia-kernel-modules:575
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-575:575'

    # 580 release
    - pkg: x11-drivers/nvidia-kernel-modules:580
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-580:580'
