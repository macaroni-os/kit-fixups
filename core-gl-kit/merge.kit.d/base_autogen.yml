sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-gl-kit
  url: "https://github.com/macaroni-os/core-gl-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: media-fonts/sedgwick-ave-display

    # 535 release
    - pkg: x11-drivers/nvidia-drivers:535
    # 550 release
    - pkg: x11-drivers/nvidia-drivers:550
    # 555 release
    - pkg: x11-drivers/nvidia-drivers:555
    # 560 release
    - pkg: x11-drivers/nvidia-drivers:560
    # 565 release
    - pkg: x11-drivers/nvidia-drivers:565
    # 570 release
    - pkg: x11-drivers/nvidia-drivers:570
    # 575 release
    - pkg: x11-drivers/nvidia-drivers:575

    # 535 release
    - pkg: x11-drivers/nvidia-kernel-modules:535
    # 550 release
    - pkg: x11-drivers/nvidia-kernel-modules:550
    # 555 release
    - pkg: x11-drivers/nvidia-kernel-modules:555
    # 560 release
    - pkg: x11-drivers/nvidia-kernel-modules:560
    # 565 release
    - pkg: x11-drivers/nvidia-kernel-modules:565
    # 570 release
    - pkg: x11-drivers/nvidia-kernel-modules:570
    # 575 release
    - pkg: x11-drivers/nvidia-kernel-modules:575
