sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-gl-kit
  url: "https://github.com/macaroni-os/core-gl-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: media-fonts/sedgwick-ave-display

    # 535 release
    - pkg: x11-drivers/nvidia-drivers:535
      conditions:
        - '>=x11-drivers/nvidia-drivers-535'
        - '<x11-drivers/nvidia-drivers-536'
    # 550 release
    - pkg: x11-drivers/nvidia-drivers:550
      conditions:
        - '>=x11-drivers/nvidia-drivers-550'
        - '<x11-drivers/nvidia-drivers-551'
    # 555 release
    - pkg: x11-drivers/nvidia-drivers:555
      conditions:
        - '>=x11-drivers/nvidia-drivers-555'
        - '<x11-drivers/nvidia-drivers-556'
    # 560 release
    - pkg: x11-drivers/nvidia-drivers:560
      conditions:
        - '>=x11-drivers/nvidia-drivers-560'
        - '<x11-drivers/nvidia-drivers-561'
    # 565 release
    - pkg: x11-drivers/nvidia-drivers:565
      conditions:
        - '>=x11-drivers/nvidia-drivers-565'
        - '<x11-drivers/nvidia-drivers-566'
    # 570 release
    - pkg: x11-drivers/nvidia-drivers:570
      conditions:
        - '>=x11-drivers/nvidia-drivers-570'
        - '<x11-drivers/nvidia-drivers-571'
    # 575 release
    - pkg: x11-drivers/nvidia-drivers:575
      conditions:
        - '>=x11-drivers/nvidia-drivers-575'
        - '<x11-drivers/nvidia-drivers-576'
    # 580 release
    - pkg: x11-drivers/nvidia-drivers:580
      conditions:
        - '>=x11-drivers/nvidia-drivers-580'
        - '<x11-drivers/nvidia-drivers-581'

    # 535 release
    - pkg: x11-drivers/nvidia-kernel-modules:535
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-535'
        - '<x11-drivers/nvidia-kernel-modules-536'

    # 550 release
    - pkg: x11-drivers/nvidia-kernel-modules:550
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-550'
        - '<x11-drivers/nvidia-kernel-modules-551'

    # 555 release
    - pkg: x11-drivers/nvidia-kernel-modules:555
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-555'
        - '<x11-drivers/nvidia-kernel-modules-556'

    # 560 release
    - pkg: x11-drivers/nvidia-kernel-modules:560
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-560'
        - '<x11-drivers/nvidia-kernel-modules-561'

    # 565 release
    - pkg: x11-drivers/nvidia-kernel-modules:565
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-565'
        - '<x11-drivers/nvidia-kernel-modules-566'

    # 570 release
    - pkg: x11-drivers/nvidia-kernel-modules:570
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-570'
        - '<x11-drivers/nvidia-kernel-modules-571'

    # 575 release
    - pkg: x11-drivers/nvidia-kernel-modules:575
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-575'
        - '<x11-drivers/nvidia-kernel-modules-576'

    # 580 release
    - pkg: x11-drivers/nvidia-kernel-modules:580
      conditions:
        - '>=x11-drivers/nvidia-kernel-modules-580'
        - '<x11-drivers/nvidia-kernel-modules-581'
