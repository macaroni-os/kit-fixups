libxml2:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-libs
    dir:
      url: https://download.gnome.org/sources/{{ .Values.tname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.tname | default .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      s: '${WORKDIR}/{{ .Values.tname | default .Values.pn }}-{{ .Values.version }}'
      slot: '2'
      python_compat: python3+
      inherit:
        - python-r1
        - meson
      desc: XML C parser and toolkit
      homepage: https://gitlab.gnome.org/GNOME/libxml2/-/wikis/home
      iuse: doc icu python readline static-libs +lzma
      required_use: python? ( ${PYTHON_REQUIRED_USE} )
      rdepend: |
        virtual/libiconv
        sys-libs/zlib:=
        icu? ( dev-libs/icu:= )
        lzma? ( app-arch/xz-utils:= )
        readline? ( sys-libs/readline:= )
      depend: |
        ${RDEPEND}
        ${PYTHON_DEPS}
      bdepend: |
        virtual/pkgconfig
      pdepend: |
        python? ( >=dev-python/libxml2-python-{{ .Values.version }} )
      release: '2.15'
      body: |
        src_prepare() {
          default
          sed -e "/^dir_doc/ s/meson.project_name()$/\'${PF}\'/" -i meson.build || die
          # Permit to compile libxml2 on stage3 without git installed.
          # Hack git command with echo in order to print an empty string.
          sed -e 's|git|echo|g' -e 's|describe||g' -i meson.build || die
        }
        src_configure() {
          local emesonargs=(
            -Ddefault_library=$(usex static-libs both shared)
            $(meson_feature icu)
            $(meson_feature doc docs)
            $(meson_feature readline)
            $(meson_feature readline history)
            -Dpython=disabled
            -Dschematron=enabled
            # There has been a clean break with a soname bump.
            # It's time to deal with the breakage.
            # bug #935452
            -Dlegacy=disabled
          )
          meson_src_configure
        }
        src_install() {
          meson_src_install
        }
        pkg_postinst() {
          # We don't want to do the xmlcatalog during stage1, as xmlcatalog will not
          # be in / and stage1 builds to ROOT=/tmp/stage1root. This fixes bug #208887.
          if [[ -n "${ROOT}" ]]; then
            elog "Skipping XML catalog creation for stage building (bug #208887)."
          else
            # Need an XML catalog, so no-one writes to a non-existent one
            CATALOG="${EROOT}/etc/xml/catalog"
            if [[ ! -e "${CATALOG}" ]]; then
              [[ -d "${EROOT}/etc/xml" ]] || mkdir -p "${EROOT}/etc/xml"
              "${EPREFIX}"/usr/bin/xmlcatalog --create > "${CATALOG}"
              einfo "Created XML catalog in ${CATALOG}"
            fi
          fi
        }

  packages:
    - libxml2:


libcap:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: sys-libs
    template: ../../templates/simple.tmpl
    dir:
      url: https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/
      matcher: "{{ .Values.pn }}-2.*.tar.gz$"

    transform:
      - kind: string
        match: "{{ .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.gz"
        replace: ""
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
        url: https://git.kernel.org/pub/scm/libs/libcap/libcap.git/snapshot/{{ .Values.pn }}-{{ .Values.version }}.tar.gz

    vars:
      desc: "POSIX 1003.1e capabilities"
      homepage: "https://sites.google.com/site/fullycapable/"
      license: "|| ( GPL-2 BSD ) pam? ( || ( LGPL-2+ BSD ) )"
      slot: '0'
      inherit:
        - pam
        - toolchain-funcs
      iuse: pam +static-libs tools
      rdepend: |
        pam? ( sys-libs/pam )
      depend: |
        ${RDEPEND}
        sys-kernel/linux-headers
      bdepend:
        sys-apps/diffutils
        tools? ( dev-lang/go )
      body: |
        run_emake() {
          local args=(
          	exec_prefix="${EPREFIX}"
          	lib_prefix="${EPREFIX}/usr"
          	lib="$(get_libdir)"
          	prefix="${EPREFIX}/usr"
          	PAM_CAP="$(usex pam yes no)"
          	DYNAMIC=yes
          	GOLANG="$(usex tools yes no)"
          )
          emake "${args[@]}" "$@"
        }
        src_compile() {
          local BUILD_CC
          tc-export_build_env BUILD_CC
          run_emake
        }
        src_install() {
          run_emake DESTDIR="${D}" install
          gen_usr_ldscript -a cap
          if ! use static-libs; then
            rm "${ED}"/usr/$(get_libdir)/lib{cap,psx}.a || die
          fi
          # install pam plugins ourselves
          if [[ -d "${ED%/}"/usr/$(get_libdir)/security ]] ; then
            rm -rf "${ED}"/usr/$(get_libdir)/security || die
          fi
          if use pam; then
            dopammod pam_cap/pam_cap.so
            dopamsecurity '' pam_cap/capability.conf
          fi
        }

  packages:
    - libcap:

expat:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-libs
    template: ../../templates/simple.tmpl

    github:
      user: libexpat
      repo: libexpat
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.original_version }}.tar.xz'
        matcher: '{{ .Values.pn }}-.*.tar.xz'
    vars:
      inherit:
        - autotools
      iuse: examples static-libs unicode
      bdepend: |
        unicode? (
          sys-devel/automake
          sys-devel/autoconf
          sys-devel/libtool
        )
        app-portage/elt-patches
      docs:
        - README.md
      body: |
        src_prepare() {
          default
          # fix interpreter to be a recent/good shell
          sed -i -e "1s:/bin/sh:${BASH}:" conftools/get-version.sh || die
          if use unicode; then
            cp -R "${S}" "${S}"w || die
            pushd "${S}"w >/dev/null
            find -name Makefile.am \
              -exec sed \
              -e 's,libexpat\.la,libexpatw.la,' \
              -e 's,libexpat_la,libexpatw_la,' \
              -i {} + || die
            eautoreconf
            popd >/dev/null
          fi
        }
        src_configure() {
          local myconf="$(use_enable static-libs static) --without-docbook"
          mkdir -p "${BUILD_DIR}"w || die
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            CPPFLAGS="${CPPFLAGS} -DXML_UNICODE" ECONF_SOURCE="${S}"w econf ${myconf}
            popd >/dev/null
          fi
          ECONF_SOURCE="${S}" econf ${myconf}
        }
        src_compile() {
          emake
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            emake -C lib
            popd >/dev/null
          fi
        }
        src_install() {
          emake install DESTDIR="${D}"
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            emake -C lib install DESTDIR="${D}"
            popd >/dev/null

            pushd "${ED}"/usr/$(get_libdir)/pkgconfig >/dev/null
            cp expat.pc expatw.pc
            sed -i -e '/^Libs/s:-lexpat:&w:' expatw.pc || die
            popd >/dev/null
          fi
          einstalldocs
          doman doc/xmlwf.1
          # Note: Use of HTML_DOCS would add unwanted "doc" subfolder
          docinto html
          dodoc doc/*.{css,html}
          if use examples; then
            docinto examples
            dodoc examples/*.c
            docompress -x usr/share/doc/${PF}/examples
          fi
          find "${D}" -name '*.la' -type f -delete || die
        }

  packages:
    - expat:


