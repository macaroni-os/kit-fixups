zlib:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: sys-libs
    template: ../../templates/simple.tmpl

    github:
      user: madler
    transform:
      # Release titles are "zlib 1.4" (libffi precedent).
      - kind: string
        match: 'zlib '
        replace: ''
    assets:
      - name: '{{ .Values.p }}.tar.gz'
        matcher: '{{ .Values.pn }}-.*\.tar\.gz$'
    vars:
      desc: Standard (de)compression library
      homepage: https://zlib.net/
      license: ZLIB
      iuse: minizip static-libs
      inherit:
        - autotools
        - toolchain-funcs
      # The tree ebuild sets AUTOTOOLS_AUTO_DEPEND=no and forms the autotools
      # dependency only for the minizip flavour (eautoreconf runs in
      # contrib/minizip only). extra_envs renders before the inherit line.
      extra_envs:
        - 'AUTOTOOLS_AUTO_DEPEND=no'
      depend: |
        minizip? ( ${AUTOTOOLS_DEPEND} )
      patches:
        - zlib-1.4-minizip-drop-crypt-header.patch
      body: |
        src_prepare() {
          default
          if use minizip ; then
            cd contrib/minizip || die
            eautoreconf
          fi
        }

        src_configure() {
          # not an autoconf script, so can't use econf
          local uname=$(/usr/share/gnuconfig/config.sub "${CHOST}" | cut -d- -f3)
          "${S}"/configure \
            --shared \
            --prefix=/usr \
            --libdir=/usr/$(get_libdir) \
            ${uname:+--uname=${uname}} \
            || die

          if use minizip ; then
            local minizipdir="contrib/minizip"
            cd ${minizipdir} || die
            ECONF_SOURCE="${S}/${minizipdir}" \
            econf $(use_enable static-libs static)
          fi
        }

        src_compile() {
          emake
          use minizip && emake -C contrib/minizip
        }

        sed_macros() {
          sed -i -r 's:\<(O[FN])\>:_Z_\1:g' "$@" || die
        }

        src_install() {
          emake install DESTDIR="${D}" LDCONFIG=:
          gen_usr_ldscript -a z
          sed_macros "${ED}"/usr/include/*.h
          if use minizip ; then
            emake -C contrib/minizip install DESTDIR="${D}"
            sed_macros "${ED}"/usr/include/minizip/*.h
          fi
          use static-libs || rm -f "${ED}"/usr/$(get_libdir)/lib{z,minizip}.{a,la}
          dodoc FAQ README ChangeLog doc/*.txt
          use minizip && dodoc contrib/minizip/*.txt
        }

  packages:
    - zlib:
        revision: 1

bash:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-shells
    dir:
      url: 'https://gnuftp.mirror.garr.it/bash/'
      # GNU publishes consolidated patch-level tarballs (bash-5.2.NN.tar.gz)
      # next to the base release, so the "patch series" policy is simply the
      # newest patch-level tarball: .sig, -patches/, -alpha/-beta/-rc entries
      # are filtered by the anchored matcher below.
      matcher: 'bash-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.gz$'
    transform:
      - kind: string
        match: 'bash-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    # The listing serves both the 5.2.NN patch-level tarballs and the 5.3
    # line; each track is declared as its own packages entry below so the
    # spec can generate both versions at once.
    vars:
      desc: The standard GNU Bourne again shell
      homepage: https://tiswww.case.edu/php/chet/bash/bashtop.html
      license: GPL-3
      iuse: afs bashlogger examples mem-scramble +net nls plugins +readline static
      inherit:
        - flag-o-matic
        - toolchain-funcs
      patches:
        - bash-5.0-syslog-history-extern.patch
      rdepend: |
        >=sys-libs/ncurses-5.2-r2:0=
        nls? ( virtual/libintl )
      depend: |
        ${RDEPEND}
        static? ( sys-libs/ncurses:0=[static-libs] )
      body: |
        pkg_setup() {
          if is-flag -malign-double ; then
            eerror "Detected bad CFLAGS '-malign-double'.  Do not use this"
            eerror "as it breaks LFS (struct stat64) on x86."
            die "REMOvE -malign-double from your CFLAGS"
          fi

          if use bashlogger ; then
            ewarn "The logging patch should ONLY be used in restricted (i.e. honeypot) envs."
            ewarn "This will log ALL output you enter into the shell, you have been warned."
          fi
        }

        src_prepare() {
          # Avoid regenerating docs after patches.
          sed -i -r '/^(HS|RL)USER/s:=.*:=:' doc/Makefile.in || die
          touch -r . doc/* || die

          # Context diff written against ../bash-5.0-patched/: needs -p0.
          eapply -p0 "${PATCHES[@]}"
          eapply_user
        }

        src_configure() {
          use static && append-ldflags -static

          local myconf=(
            --disable-profiling

            # Force linking with system curses ... the bundled termcap lib
            # sucks bad compared to ncurses.  For the most part, ncurses
            # is here because readline needs it.  But bash itself calls
            # ncurses in one or two small places :(.
            --with-curses

            $(use_enable mem-scramble)
            $(use_enable net net-redirections)
            $(use_enable readline)
            $(use_enable readline bang-history)
            $(use_enable readline history)
            $(use_with afs)
            $(use_with mem-scramble bash-malloc)
          )

          # For descriptions of these, see config-top.h
          append-cppflags \
            -DDEFAULT_PATH_VALUE=\'\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\' \
            -DSTANDARD_UTILS_PATH=\'\"/bin:/usr/bin:/sbin:/usr/sbin\"\' \
            -DSYS_BASHRC=\'\"/etc/bash/bashrc\"\' \
            -DSYS_BASH_LOGOUT=\'\"/etc/bash/bash_logout\"\' \
            -DNON_INTERACTIVE_LOGIN_SHELLS \
            -DSSH_SOURCE_BASHRC \
            $(use bashlogger && echo -DSYSLOG_HISTORY)

          use nls || myconf+=( --disable-nls )

          if use plugins ; then
            append-ldflags -Wl,-rpath,"/usr/$(get_libdir)/bash"
          else
            # Disable the plugins logic by hand since bash doesn't
            # provide a way of doing it.
            export ac_cv_func_dl{close,open,sym}=no \
              ac_cv_lib_dl_dlopen=no ac_cv_header_dlfcn_h=no

            sed -i \
              -e '/LOCAL_LDFLAGS=/s:-rdynamic::' \
              configure || die
          fi

          tc-export AR

          econf "${myconf[@]}"
        }

        src_compile() {
          emake

          if use plugins ; then
            emake -C examples/loadables all others
          fi
        }

        src_install() {
          local d f

          default

          dodir /bin
          mv "${ED}"/usr/bin/bash "${ED}"/bin/ || die
          dosym bash /bin/rbash

          insinto /etc/bash
          doins "${FILESDIR}"/bash_logout
          doins "${FILESDIR}"/bashrc

          keepdir /etc/bash/bashrc.d

          insinto /etc/skel
          for f in bash{_logout,_profile,rc} ; do
            newins "${FILESDIR}"/dot-${f} .${f}
          done

          local sed_args=(
            -e "s:#${USERLAND}#@::"
            -e '/#@/d'
          )

          if ! use readline ; then
            sed_args+=(
              -e '/^shopt -s histappend/s:^:#:'
              -e 's:use_color=true:use_color=false:'
            )
          fi

          sed -i \
            "${sed_args[@]}" \
            "${ED}"/etc/skel/.bashrc \
            "${ED}"/etc/bash/bashrc || die

          if use plugins ; then
            exeinto /usr/$(get_libdir)/bash
            doexe $(echo examples/loadables/*.o | sed 's:\.o::g')

            insinto /usr/include/bash-plugins
            doins *.h builtins/*.h include/*.h lib/{glob/glob.h,tilde/tilde.h}
          fi

          if use examples ; then
            for d in examples/{functions,misc,scripts,startup-files} ; do
              exeinto /usr/share/doc/${PF}/${d}
              docinto ${d}
              for f in ${d}/* ; do
                if [[ ${f##*/} != PERMISSION ]] && [[ ${f##*/} != *README ]] ; then
                  doexe ${f}
                else
                  dodoc ${f}
                fi
              done
            done
          fi

          doman doc/*.1
          newdoc CWRU/changelog ChangeLog
          dosym bash.info /usr/share/info/bashref.info
        }

        pkg_preinst() {
          if [[ -e ${EROOT}/etc/bashrc ]] && [[ ! -d ${EROOT}/etc/bash ]] ; then
            mkdir -p "${EROOT}"/etc/bash
            mv -f "${EROOT}"/etc/bashrc "${EROOT}"/etc/bash/
          fi
        }

        pkg_postinst() {
          # If /bin/sh does not exist, provide it
          if [[ ! -e ${EROOT}/bin/sh ]] ; then
            ln -sf bash "${EROOT}"/bin/sh
          fi
        }

  packages:
    - bash:
        # 5.2 track: consolidated bash-5.2.NN patch-level tarballs.
        selector:
          - '>=5.2'
          - '<5.3'
    - bash:
        # 5.3 track: base 5.3 release; a future bash-5.3.NN tarball is picked
        # up by the same matcher automatically.
        selector:
          - '>=5.3'
          - '<5.4'

timezone_data:
  # Rolling IANA tzdb releases (tzdata<YYYY><letter>): the releases dirlisting
  # is the only machine-readable upstream channel (probed 2026-11-15:
  # github.com/eggert/tz has 0 releases, iana/time-zones does not exist, no
  # Forgejo). The <YYYY><letter> form is already a valid portage PV, so the
  # transform only strips the tzdata prefix and the .tar.gz suffix; letter
  # suffixes sort correctly (2026f > 2026a > 2025b > 2025a). The tree ebuild
  # fetches a second tzcode<PV>.tar.gz distfile sharing the same version: it
  # rides along as an asset so the generated Manifest covers every distfile.
  # The end-anchored gz matcher structurally drops the .tar.lz/.Z siblings,
  # the .asc/.sign files and the 2-digit-year entries; data.iana.org serves
  # the exact same bytes as the tree Manifest hashes (no Content-Encoding).
  # macaroni-os/mark-issues#925 (epic #880); conversion precedent #573.
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    category: sys-libs

  packages:

    - timezone-data:
        dir:
          url: https://data.iana.org/time-zones/releases/
          matcher: 'tzdata[0-9]{4}[a-z]\.tar\.gz$'
        transform:
          - kind: string
            match: 'tzdata'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        assets:
          - name: 'tzdata{{ .Values.version }}.tar.gz'
            url: 'https://data.iana.org/time-zones/releases/tzdata{{ .Values.version }}.tar.gz'
          - name: 'tzcode{{ .Values.version }}.tar.gz'
            url: 'https://data.iana.org/time-zones/releases/tzcode{{ .Values.version }}.tar.gz'
        vars:
          desc: Timezone data (/usr/share/zoneinfo) and utilities (tzselect/zic/zdump)
          homepage: https://www.iana.org/time-zones
          license: BSD public-domain
          slot: '0'
          iuse: nls leaps-timezone
          inherit:
            - toolchain-funcs
            - flag-o-matic
          s: '${WORKDIR}'
          # simple.tmpl renders RDEPEND before DEPEND, so ${DEPEND} inside
          # rdepend would render empty: write both literally (tree semantics:
          # DEPEND=nls? ( virtual/libintl ), RDEPEND=${DEPEND} + glibc blocker).
          depend: 'nls? ( virtual/libintl )'
          rdepend: |
            nls? ( virtual/libintl )
            !sys-libs/glibc[vanilla(+)]
          body: |
            src_prepare() {
              default

              # check_web contacts validator.w3.org
              sed -i -e 's/check_tables check_web/check_tables/g' \
                Makefile || die "Failed to disable check_web"

            }

            src_configure() {
              tc-export CC

              append-lfs-flags

              append-cppflags -DHAVE_GETTEXT=$(usex nls 1 0) -DTZ_DOMAIN='\"libc\"'
              LDLIBS=""
              if use nls ; then
                # See if an external libintl is available.
                local c="${T}/test"
                echo 'main(){}' > "${c}.c"
                if $(tc-getCC) ${CPPFLAGS} ${CFLAGS} ${LDFLAGS} "${c}.c" -o "${c}" -lintl 2>/dev/null ; then
                  LDLIBS+=" -lintl"
                fi
              fi
            }

            _emake() {
              emake \
                REDO=$(usex leaps-timezone posix_right posix_only) \
                TZDATA_TEXT= \
                ZICDIR='/usr/bin' \
                "$@"
            }

            src_compile() {
              _emake \
                AR="$(tc-getAR)" \
                cc="$(tc-getCC)" \
                RANLIB="$(tc-getRANLIB)" \
                CFLAGS="${CFLAGS} -std=gnu99 ${CPPFLAGS}" \
                LDFLAGS="${LDFLAGS}" \
                LDLIBS="${LDLIBS}"
            }

            src_install() {
              local zic=""
              _emake install ${zic} DESTDIR="${D}" LIBDIR="/nukeit"
              rm -rf "${D}/nukeit" "${ED}/etc" || die

              insinto /usr/share/zoneinfo
              doins "${S}"/leap-seconds.list

              # Delete man pages installed by man-pages package.
              rm "${ED}"/usr/share/man/man5/tzfile.5* "${ED}"/usr/share/man/man8/{tzselect,zdump,zic}.8 || die
              dodoc CONTRIBUTING README NEWS *.html
            }

            get_TIMEZONE() {
              local tz src="/etc/timezone"
              if [[ -e ${src} ]] ; then
                tz=$(sed -e 's:#.*::' -e 's:[[:space:]]*::g' -e '/^$/d' "${src}")
              else
                tz="FOOKABLOIE"
              fi
              [[ -z ${tz} ]] && return 1 || echo "${tz}"
            }

            pkg_preinst() {
              local tz=$(get_TIMEZONE)
              if [[ ${tz} == right/* || ${tz} == posix/* ]] ; then
                eerror "The right & posix subdirs are no longer installed as subdirs -- they have been"
                eerror "relocated to match upstream paths as sibling paths.  Further, posix/xxx is the"
                eerror "same as xxx, so you should simply drop the posix/ prefix.  You also should not"
                eerror "be using right/xxx for the system timezone as it breaks programs."
                die "Please fix your timezone setting"
              fi

              # Trim the symlink by hand to avoid portage's automatic protection checks.
              rm -f /usr/share/zoneinfo/posix

              if has_version "<=${CATEGORY}/${PN}-2015c" ; then
                elog "Support for accessing posix/ and right/ directly has been dropped to match"
                elog "upstream.  There is no need to set TZ=posix/xxx as it is the same as TZ=xxx."
                elog "For TZ=right/, you can use TZ=../zoneinfo-leaps/xxx instead.  See this post"
                elog "for details: https://mm.icann.org/pipermail/tz/2015-February/022024.html"
              fi
            }

            configure_tz_data() {
              # make sure the /etc/localtime file does not get stale
              local tz src="/etc/timezone" etc_lt="/etc/localtime"

              # If it's a symlink, assume the user knows what they're doing and
              # they're managing it themselves.
              if [[ -L "${etc_lt}" ]] ; then
                einfo "Assuming your ${etc_lt} symlink is what you want; skipping update."
                return 0
              fi

              if ! tz=$(get_TIMEZONE) ; then
                einfo "Assuming your empty ${etc_lt} file is what you want; skipping update."
                return 0
              fi
              if [[ "${tz}" == "FOOKABLOIE" ]] ; then
                elog "You do not have TIMEZONE set in ${src}."

                if [[ ! -e "${etc_lt}" ]] ; then
                  cp -f /usr/share/zoneinfo/Factory "${etc_lt}"
                  elog "Setting ${etc_lt} to Factory."
                else
                  elog "Skipping auto-update of ${etc_lt}."
                fi
                return 0
              fi

              if [[ ! -e "/usr/share/zoneinfo/${tz}" ]] ; then
                elog "You have an invalid TIMEZONE setting in ${src}"
                elog "Your ${etc_lt} has been reset to Factory; enjoy!"
                tz="Factory"
              fi
              einfo "Updating ${etc_lt} with /usr/share/zoneinfo/${tz}"
              cp -f "/usr/share/zoneinfo/${tz}" "${etc_lt}"
            }

            pkg_config() {
              configure_tz_data
            }

            pkg_postinst() {
              configure_tz_data
            }

# sys-devel/patch dual-track spec: hoisted out of core_dirlisting into its own
# definition key (kit-fixups#601 review 4580668562) so the shared vars/spec and
# the (byte-identical) body live once under defaults; entries keep only deltas.
patch:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-devel
    dir:
      url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
      matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      desc: Utility to apply diffs to files
      homepage: https://www.gnu.org/software/patch/patch.html
      license: GPL-3+
      iuse: static xattr
      inherit:
        - flag-o-matic
      rdepend: |
        xattr? ( sys-apps/attr )
      depend: '${RDEPEND}'
      body: |
        src_configure() {
          use static && append-ldflags -static

          local myeconfargs=(
            $(use_enable xattr)
          )
          # Do not let $ED mess up the search for `ed`.
          ac_cv_path_ED=$(type -P ed) \
            econf "${myeconfargs[@]}"
        }
  packages:
    # Legacy 2.7.6 track: still served on the mark-iii/mark-i/mark-v release
    # branches (and mark-xl). Capped below 2.8; the 12 security fixes apply to
    # this track only (dry-run against 2.8: 11/12 already absorbed, fix2 only
    # with fuzz 2 — see macaroni-os/mark-issues#920).
    - patch:
        selector:
          - '>=2.7.6'
          - '<2.8'
        revision: 4
        vars:
          patches:
            - patch-2.7.6-fix-test-suite.patch
            - patch-2.7.6-fix-error-handling-with-git-style-patches.patch
            - patch-2.7.6-CVE-2018-6951.patch
            - patch-2.7.6-allow-input-files-to-be-missing-for-ed-style-patches.patch
            - patch-2.7.6-CVE-2018-1000156.patch
            - patch-2.7.6-CVE-2018-6952.patch
            - patch-2.7.6-Do-not-crash-when-RLIMIT_NOFILE-is-set-to-RLIM_INFINITY.patch
            - patch-2.7.6-CVE-2018-1000156-fix1.patch
            - patch-2.7.6-CVE-2018-1000156-fix2.patch
            - patch-2.7.6-CVE-2019-13636.patch
            - patch-2.7.6-CVE-2019-13638.patch
            - patch-2.7.6-Avoid-invalid-memory-access-in-context-format-diffs.patch
    # Current track: the dirlisting tip (patch-2.8.1 as of conversion, so the
    # bot auto-tracks future GNU releases). Upstream absorbed all 12 legacy
    # patches, hence the empty patches list on this track.
    - patch:
        vars:
          patches: []