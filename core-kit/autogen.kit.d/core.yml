    - gettext:
        category: sys-devel
        vars:
          body: |
            pkg_setup() {
              java-pkg-opt-2_pkg_setup
            }
            src_prepare() {
              java-pkg-opt-2_src_prepare
              default
              elibtoolize
            }
            src_configure() {
              local myconf=(
                # switches common to runtime and top-level
                --cache-file=${S}/config.cache
                # Emacs support is now in a separate package
                --without-emacs
                --without-lispdir
                # glib depends on us so avoid circular deps
                --with-included-glib
                # libcroco depends on glib which ... ^^^
                --with-included-libcroco
                # this will _disable_ libunistring (since it is not bundled),
                --with-included-libunistring
                # Never build libintl since it's in dev-libs/libintl now.
                --without-included-gettext
                # Never build bundled copy of libxml2.
                --without-included-libxml
                --disable-csharp
                --without-cvs
                $(use_enable acl)
                $(use_enable cxx c++)
                $(use_enable cxx libasprintf)
                $(use_with git)
                $(use_enable java)
                $(use_enable ncurses curses)
                $(use_enable nls)
                $(use_enable openmp)
                $(use_enable static-libs static)
                $(use_enable xattr attr)
              )
              local ECONF_SOURCE="${S}"
              econf "${myconf[@]}"
            }
            src_install() {
              emake DESTDIR="${D}" install
              dosym msgfmt /usr/bin/gmsgfmt # bug #43435
              dobin gettext-tools/misc/gettextize
              # 909041 never install libintl which upstream insists on building
              rm -f "${ED}"/usr/$(get_libdir)/libintl.* "${ED}"/usr/include/libintl.h
              find "${ED}" -type f -name "*.la" -delete || die
              if use java ; then
                java-pkg_dojar "${ED}"/usr/share/${PN}/*.jar
                rm "${ED}"/usr/share/${PN}/*.jar || die
                rm "${ED}"/usr/share/${PN}/*.class || die
                if use doc ; then
                  java-pkg_dojavadoc "${ED}"/usr/share/doc/${PF}/html/javadoc2
                fi
              fi
              dodoc AUTHORS ChangeLog NEWS README THANKS
              if use doc ; then
                docinto html
                dodoc "${ED}"/usr/share/doc/${PF}/*.html
              else
                rm -rf "${ED}"/usr/share/doc/${PF}/{csharpdoc,examples,javadoc2,javadoc1}
              fi
              rm "${ED}"/usr/share/doc/${PF}/*.html || die
            }
            pkg_preinst() {
              java-pkg-opt-2_pkg_preinst
            }

          depend: |
            virtual/libiconv
            virtual/libintl
            dev-libs/libxml2
            dev-libs/expat
            acl? ( virtual/acl )
            ncurses? ( sys-libs/ncurses )
            java? ( virtual/jdk )
          bdepend: |
            git? (  dev-vcs/git )
          pdepend: |
            emacs? ( app-emacs/po-mode )
          rdepend: |
            ${DEPEND}
            git? (  dev-vcs/git )
            java? ( virtual/jdk )
          inherit:
            - libtool
            - java-pkg-opt-2
          license: GPL-3+ cxx? ( LGPL-2.1+ )
          homepage: https://www.gnu.org/software/gettext/
          desc: GNU locale utilities
          iuse: acl -cvs +cxx doc emacs git java ncurses nls openmp static-libs xattr
        dir:
          url: https://ftp.gnu.org/pub/gnu/gettext/
          matcher: "gettext-.*.tar.xz$"
        transform:
          - kind: string
            match: 'gettext-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"

    # GNU serves libidn2 from the shared libidn/ directory, next to the
    # unrelated libidn-1.x line, .tar.xz/.tar.lz variants, detached .sig
    # proofs and a rolling libidn2-latest.tar.gz. The anchored matcher keeps
    # all of those out so the generator only ever selects a stable
    # libidn2-<ver>.tar.gz release (probed live: the newest is 2.3.8, also
    # the newest tag on https://gitlab.com/libidn/libidn2).
    - libidn2:
        category: net-dns
        dir:
          url: https://ftp.gnu.org/gnu/libidn/
          matcher: '^libidn2-[0-9]+(\.[0-9]+)+\.tar\.gz$'
        transform:
          - kind: string
            match: 'libidn2-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        vars:
          desc: An implementation of the IDNA2008 specifications (RFCs 5890, 5891, 5892, 5893)
          homepage: https://www.gnu.org/software/libidn/#libidn2 https://gitlab.com/libidn/libidn2
          license: GPL-2+ LGPL-3+
          slot: '0/2'
          iuse: static-libs
          inherit:
            - toolchain-funcs
          rdepend: |
            dev-libs/libunistring
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-lang/perl
            sys-apps/help2man
          body: |
            src_configure() {
              econf \
                CC_FOR_BUILD="$(tc-getBUILD_CC)" \
                $(use_enable static-libs static) \
                --disable-doc \
                --disable-gcc-warnings \
                --disable-gtk-doc
            }

            src_install() {
              default
              find "${D}" -name '*.la' -delete || die
            }

    - libcap-ng:
        category: sys-libs
        dir:
          url: https://people.redhat.com/sgrubb/libcap-ng/
          matcher: "libcap-ng-.*.tar.gz$"
        transform:
          - kind: string
            match: 'libcap-ng-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"

        vars:
          python_compat: python3+
          inherit:
            - autotools
            - flag-o-matic
            - python-r1
          rdepend: |
            python? ( ${PYTHON_DEPS} )
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
            python? ( dev-lang/swig )
          required_use: |
            python? ( ${PYTHON_REQUIRED_USE} )
          iuse: python static-libs
          license: LGPL-2.1
          homepage: https://people.redhat.com/sgrubb/libcap-ng/
          desc: POSIX 1003.1e capabilities
          body: |
            src_prepare() {
              # Apply patch from upstream
              sed -i -e '/^PYTHON = $(PYTHON)/d' bindings/python3/Makefile.am || die
              default
              eautoreconf
            }
            src_configure() {
              use sparc && replace-flags -O? -O0
              local ECONF_SOURCE="${S}"
              local myconf=(
                $(use_enable static-libs static)
                --with-capability_header="${ESYSROOT}"/usr/include/linux/capability.h
              )
              local pythonconf=( --without-python3 )
              if use python ; then
                setup_python_flags_configure() {
                  pythonconf=( --with-python3 )
                  run_in_build_dir econf "${pythonconf[@]}" "${myconf[@]}"
                }
                python_foreach_impl setup_python_flags_configure
              else
                local BUILD_DIR=${WORKDIR}/build
                run_in_build_dir econf "${pythonconf[@]}" "${myconf[@]}"
              fi
            }
            src_compile() {
              if use python; then
                python_foreach_impl run_in_build_dir emake
              else
                local BUILD_DIR=${WORKDIR}/build
                emake -C "${BUILD_DIR}"
              fi
            }
            src_install() {
              if use python; then
                python_foreach_impl run_in_build_dir emake DESTDIR="${D}" install
              else
                local BUILD_DIR=${WORKDIR}/build
                emake -C "${BUILD_DIR}" DESTDIR="${D}" install
              fi
              find "${ED}" -name '*.la' -delete || die
            }

    - gmp:
        category: dev-libs
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          desc: Library for arbitrary-precision arithmetic on different type of numbers
          homepage: https://gmplib.org/
          license: '|| ( LGPL-3+ GPL-2+ )'
          # Subslot reflects the C (libgmp.so.10) and C++ (libgmpxx.so.4) SONAMEs.
          inherit:
            - gnuconfig
            - libtool
            - toolchain-funcs
          iuse: '+asm +cpudetection +cxx pic +static-libs'
          required_use: 'cpudetection? ( asm )'
          restrict: '!cpudetection? ( bindist )'
          bdepend: |
            app-arch/xz-utils
            sys-devel/m4
          docs:
            - AUTHORS
            - ChangeLog
            - NEWS
            - README
            - doc/configuration
            - doc/isa_abi_headache
          patches:
            - gmp-6.1.0-noexecstack-detect.patch
            - gmp-6.2.1-no-zarch.patch
          body: |
            src_prepare() {
              default

              # We cannot run autotools here as gcc depends on this package
              elibtoolize

              # GMP uses the "ABI" env var during configure as does portage
              # (econf). To avoid patching the source constantly, wrap things
              # up so GMP always sees the value it expects.
              mv configure configure.wrapped || die
              cat <<-\EOF > configure
                #!/usr/bin/env sh
                exec env ABI="${GMPABI}" "$0.wrapped" "$@"
                EOF

              # Patches to original configure might have lost the +x bit.
              chmod a+rx configure{,.wrapped} || die

              # Save the upstream files named config.{guess,sub} which are
              # wrappers around the gnuconfig versions.
              mkdir "${T}"/gmp-gnuconfig || die
              mv config.guess "${T}"/gmp-gnuconfig/config.guess || die
              mv config.sub "${T}"/gmp-gnuconfig/config.sub || die
              # Grab fresh copies from gnuconfig.
              touch config.guess config.sub || die
              gnuconfig_update
              # Rename the fresh copies to the filenames the wrappers from
              # GMP expect.
              mv config.guess configfsf.guess || die
              mv config.sub configfsf.sub || die
            }

            src_configure() {
              # ABI mappings (needs all architectures supported)
              case ${ABI} in
                32|x86) GMPABI=32 ;;
                64|amd64|n64) GMPABI=64 ;;
                [onx]32) GMPABI=${ABI} ;;
              esac
              export GMPABI

              tc-export CC

              # https://gmplib.org/manual/Notes-for-Package-Builds
              local myeconfargs=(
                CC_FOR_BUILD="$(tc-getBUILD_CC)"

                --localstatedir=/var/state/gmp
                --enable-shared

                $(use_enable asm assembly)
                # fat is needed to avoid gmp installing either purely generic
                # or specific-to-used-CPU code: with it the build dispatches
                # between CPU variants at runtime on amd64/x86.
                $(use_enable cpudetection fat)
                $(use_enable cxx)
                $(use_enable static-libs static)

                # --with-pic forces static libraries to be built as PIC
                # and without TEXTRELs.
                $(use pic && echo --with-pic)
              )

              # Move the wrappers from GMP back into place (may have been
              # destroyed by previous econf run)
              cp "${T}"/gmp-gnuconfig/config.guess "${S}"/config.guess || die
              cp "${T}"/gmp-gnuconfig/config.sub "${S}"/config.sub || die

              # Without the fat build, pin the build to the processor GMP's
              # own config.guess reports so the tuned code paths match the
              # build machine.
              if ! use cpudetection ; then
                local gmp_host=$("${S}"/config.guess || die "failed to run config.guess")

                if [[ -z ${gmp_host} ]] ; then
                  die "Empty result from GMP's custom config.guess!"
                fi

                einfo "GMP guessed processor type: ${gmp_host}"
                ewarn "This build will only work on this machine. Enable USE=cpudetection for binary packages!"
                export ac_cv_build="${gmp_host}"
                export ac_cv_host="${gmp_host}"
              fi

              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
            }

            src_install() {
              emake DESTDIR="${D}" install

              # Should be a standalone lib
              rm -f "${ED}"/usr/$(get_libdir)/libgmp.la

              # This requires libgmp
              local la="${ED}/usr/$(get_libdir)/libgmpxx.la"
              if ! use static-libs ; then
                rm -f "${la}" || die
              fi

              einstalldocs
            }

    # RAR is proprietary freeware shipped by rarlab.com as PREBUILT Linux
    # binaries: there is no source release, so this entry tracks the binary
    # drop and the ebuild only installs the unpacked files.
    - rar:
        category: app-arch
        # rarlab serves no directory listing (https://www.rarlab.com/rar/
        # answers 403), but its download page is parseable HTML that links the
        # current drops. Drop names carry a three-digit version
        # (rarlinux-x64-723.tar.gz is 7.23) and beta drops a b suffix
        # (rarlinux-x64-730b2.tar.gz); the matcher excludes those, and a
        # negative probe with a b-only matcher proves the beta link is on the
        # page (the run reaches it and stops with "No versions found").
        dir:
          url: 'https://www.rarlab.com/download.htm'
          matcher: 'rarlinux-x64-[0-9]+\.tar\.gz$'
        transform:
          - kind: regex
            match: '^rarlinux-x64-([0-9]+)\.tar\.gz$'
            replace: '$1'
          - kind: regex
            match: '^([0-9])([0-9]+)$'
            replace: '${1}.${2}'
        vars:
          desc: RAR compressor/uncompressor
          homepage: https://rarlab.com/
          license: RAR BSD BSD-2
          # Only the x64 Linux drop exists upstream: the 32-bit
          # rarlinux-<ver>.tar.gz is gone (404 since the 7.x line).
          keywords: '-* ~amd64'
          restrict: bindist
          rdepend: 'sys-libs/glibc'
          # The tarball unpacks into ${WORKDIR}/rar, without a versioned dir.
          s: '${WORKDIR}/{{ .Values.pn }}'
          # Prebuilt and already stripped: the same QA exemptions the tree
          # ebuild declared.
          extra_envs:
            - 'QA_FLAGS_IGNORED="opt/rar/rar opt/rar/unrar"'
            - 'QA_PRESTRIPPED="opt/rar/rar opt/rar/unrar"'
          body: |
            src_compile() { :; }

            src_prepare() {
              default
              rm -f license.txt || die
            }

            src_install() {
              exeinto /opt/rar
              doexe rar unrar || die

              dodir /opt/bin
              dosym ../rar/rar /opt/bin/rar || die
              dosym ../rar/unrar /opt/bin/unrar || die

              insinto /opt/rar
              doins default.sfx rarfiles.lst || die
              dodoc *.txt
            }


    - findutils:
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          desc: GNU utilities for finding files
          homepage: https://www.gnu.org/software/findutils/
          license: GPL-3+
          iuse: nls selinux static
          inherit:
            - flag-o-matic
          rdepend: |
            selinux? ( sys-libs/libselinux )
            nls? ( virtual/libintl )
          depend: '${RDEPEND}'
          # xz-utils unpacks the .tar.xz distfile; gettext is only needed with NLS on
          bdepend: |
            app-arch/xz-utils
            nls? ( sys-devel/gettext )
          body: |
            pkg_setup() {
              # enable long file name support for getcwd()
              export gl_cv_func_getcwd_path_max=yes
            }
            src_prepare() {
              # Don't build or install locate because it conflicts with mlocate,
              # which is a secure version of locate.
              sed \
                -e '/^SUBDIRS/s@locate@@' \
                -e '/^built_programs/s@ frcode locate updatedb@@' \
                -i Makefile.in || die

              default
            }
            src_configure() {
              if use static; then
                append-flags -pthread
                append-ldflags -static
              fi

              program_prefix=$(usex userland_GNU '' g)
              local myeconfargs=(
                --with-packager="MacaroniOS"
                --with-packager-version="{{ .Values.pv }}"
                --with-packager-bug-reports="https://github.com/macaroni-os/mark-issues/issues"
                --program-prefix=${program_prefix}
                $(use_enable nls)
                $(use_with selinux)
                --libexecdir='$(libdir)'/find
              )
              econf "${myeconfargs[@]}"
            }
            src_compile() {
              # We don't build locate, but the docs want a file in there.
              emake -C locate dblocation.texi
              default
            }

unzip:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-arch
    # Info-ZIP upstream is dormant (the 6.0 sources date from 2009), so the
    # only thing that moves is Debian's patch set: the pool names it
    # `unzip_6.0-NN.debian.tar.xz` and the `_pNN` version suffix tracks that
    # Debian patch revision, not an upstream release. A new Debian revision
    # therefore bumps the package automatically.
    # `+debXXuN` names are stable-branch updates of an already published
    # revision; their patch stacks differ from the same `-NN` uploaded to
    # unstable, so they are skipped instead of being mapped onto `_pNN`.
    dir:
      url: 'https://ftp.debian.org/debian/pool/main/u/unzip/'
      matcher: 'unzip_6\.0-[0-9]+\.debian\.tar\.xz$'
    transform:
      - kind: regex
        match: '^unzip_6\.0-([0-9]+)\.debian\.tar\.xz$'
        replace: '6.0_p$1'
    # A non-empty `assets:` list must repeat the tracked artefact first
    # (mark-devkit does not keep it implicitly); the Debian file name is
    # re-derived from `pv` because the distfile keeps its upstream name.
    assets:
      - name: 'unzip_6.0-{{ .Values.pv | replace "6.0_p" "" }}.debian.tar.xz'
      - name: 'unzip60.tar.gz'
        url: 'https://downloads.sourceforge.net/infozip/unzip60.tar.gz'
    vars:
      desc: unzipper for pkzip-compressed files
      homepage: https://www.info-zip.org/
      license: Info-ZIP
      iuse: bzip2 natspec unicode
      inherit:
        - flag-o-matic
        - toolchain-funcs
      # The Debian patch tarball unpacks into ${WORKDIR}/debian, next to the
      # Info-ZIP sources in ${WORKDIR}/unzip60.
      s: '${WORKDIR}/unzip60'
      # simple.tmpl emits RDEPEND before DEPEND, so the shared dependency
      # list lives on the RDEPEND side and DEPEND points at it.
      rdepend: |
        bzip2? ( app-arch/bzip2 )
        natspec? ( dev-libs/libnatspec )
      depend: '${RDEPEND}'
      patches:
        - unzip-6.0-no-exec-stack.patch
        - unzip-6.0-format-security.patch
        - unzip-6.0-fix-false-overlap-detection-on-32bit-systems.patch
      body: |
        src_prepare() {
          # debian/patches/series is Debian's canonical application order and
          # is the only correct one from revision 31 on, where the patch file
          # names lost their numeric prefix (globbing them applies patches out
          # of order and fails on process.c/extract.c). All four hunks of the
          # local patch set still apply on top (verified with
          # patch -p1 --dry-run on both revisions).
          local deb="${WORKDIR}/debian/patches" p
          while read -r p; do
            [[ -n "${p}" ]] || continue
            [[ "${p}" == *this-is-debian-unzip.patch ]] && continue
            eapply "${deb}/${p}"
          done < "${deb}/series"

          default

          # natspec support is a patch rather than an upstream option: it
          # includes natspec.h and links libnatspec unconditionally, so it
          # must stay behind the USE flag.
          use natspec && eapply "${FILESDIR}"/unzip-6.0-natspec.patch

          sed -i -r \
            -e '/^CFLAGS/d' \
            -e '/CFLAGS/s:-O[0-9]?:$(CFLAGS) $(CPPFLAGS):' \
            -e '/^STRIP/s:=.*:=true:' \
            -e "s:\<CC *= *\"?g?cc2?\"?\>:CC=\"$(tc-getCC)\":" \
            -e "s:\<LD *= *\"?(g?cc2?|ld)\"?\>:LD=\"$(tc-getCC)\":" \
            -e "s:\<AS *= *\"?(g?cc2?|as)\"?\>:AS=\"$(tc-getCC)\":" \
            -e 's:LF2 = -s:LF2 = :' \
            -e 's:LF = :LF = $(LDFLAGS) :' \
            -e 's:SL = :SL = $(LDFLAGS) :' \
            -e 's:FL = :FL = $(LDFLAGS) :' \
            -e "/^#L_BZ2/s:^$(use bzip2 && echo .)::" \
            -e 's:$(AS) :$(AS) $(ASFLAGS) :g' \
            unix/Makefile \
            || die "sed unix/Makefile failed"

          # Delete bundled code to make sure we don't use it.
          rm -r bzip2 || die
        }

        src_configure() {
          # Mark builds a single native ABI (no multilib), so the tree's
          # get_abi_CFLAGS-based ASFLAGS plumbing and the non-Linux TARGETs
          # are dropped with it.
          case ${CHOST} in
            i?86*-*linux*) TARGET="linux_asm" ;;
            *linux*)       TARGET="linux_noasm" ;;
            *) die "Unsupported CHOST ${CHOST}: only Linux targets are supported" ;;
          esac

          append-cppflags -DNO_LCHMOD -DLARGE_FILE_SUPPORT
          use bzip2 && append-cppflags -DUSE_BZIP2
          use unicode && append-cppflags -DUNICODE_SUPPORT -DUNICODE_WCHAR -DUTF8_MAYBE_NATIVE -DUSE_ICONV_MAPPING
        }

        src_compile() {
          emake -f unix/Makefile ${TARGET}
        }

        src_install() {
          dobin unzip funzip unzipsfx unix/zipgrep
          dosym unzip /usr/bin/zipinfo
          doman man/*.1
          dodoc BUGS History* README ToDo WHERE
        }

  packages:
    - unzip:

libtools_pkgs:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-libs
    assets:
      - name: "libtool-{{ .Values.version }}.tar.xz"

  packages:
    - libltdl:
        vars:
          desc: A shared library tool for developers
          homepage: https://www.gnu.org/software/libtool/
          license: GPL-2
          iuse: static-libs
          s: "${WORKDIR}/libtool-${PV}/libltdl"
          body: |
            src_configure() {
              ECONF_SOURCE=${S}
              econf --enable-ltdl-install \
                $(use_enable static-libs static)
            }
            src_install() {
              emake DESTDIR="${D}" install
            }

        dir:
          url: https://ftp.wayne.edu/gnu/libtool/
          matcher: "libtool-.*.tar.xz$"
        transform:
          - kind: string
            match: 'libtool-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''

    - libtool:
        category: sys-devel
        # Same libtool tarball as the sibling dev-libs/libltdl entry; the
        # matcher tracks only the real release tarballs (diff/xdelta sidecars
        # end in .diff.gz/.xdelta and pre-2.4.2 releases have no .xz at all).
        # libtool-2.6.2 is the current upstream stable line (2.6.0/2.6.1 were
        # alpha/beta per the bundled NEWS).
        dir:
          url: https://ftp.wayne.edu/gnu/libtool/
          matcher: "libtool-.*.tar.xz$"
        transform:
          - kind: string
            match: 'libtool-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          desc: A shared library tool for developers
          homepage: https://www.gnu.org/software/libtool/
          license: GPL-2
          slot: '2'
          iuse: vanilla
          extra_envs:
            - 'LIBTOOLIZE="true"'
            - 'WANT_LIBTOOL="none"'
          inherit:
            - autotools
            - epunt-cxx
          rdepend: |
            sys-devel/gnuconfig
            >=sys-devel/autoconf-2.69
            >=sys-devel/automake-1.13
            dev-libs/libltdl:0
            !<sys-apps/sandbox-2.10-r4
          depend: |
            ${RDEPEND}
            app-arch/xz-utils
          # Two of the twelve tree patches survive on 2.6.2 (both dry-run
          # clean with offset only, and neither touches the amd64 path):
          # the powerpc64le ELF emulation fix (upstream still maps
          # powerpc64le only in the 32-bit branch of m4/libtool.m4) and the
          # C++ -pthread/-lpthread workaround (Gentoo bug 650876; 2.6.2 only
          # appends -pthread to new_inherited_linker_flags, it does not add
          # -lpthread to deplibs for -nostdlib g++ linking). The other ten
          # are dropped: link-specs, link-fsanitize, libtoolize-slow and
          # sed-quote-speedup are absorbed upstream in 2.4.7 (its NEWS lists
          # the -fsanitize=*/-specs=* linker pass-through, the libtoolize
          # m4-recursion slowdown fix and the $SED $sed_quote_subst
          # mitigation for bug#20006); link-fuse-ld (build-aux/ltmain.in
          # already carries -fuse-ld=*) and libtoolize-delay-help
          # (libtoolize.in carries the exact func_help override) are
          # verbatim in 2.6.2; the fbsd/darwin/mint/eprefix patches target
          # platforms this kit does not ship (no EPREFIX in new autogens).
          patches:
            - libtool-2.6.2-pthread_bootstrapped.patch
            - libtool-2.6.2-ppc64le.patch
          body: |
            src_prepare() {
              if use vanilla ; then
                eapply_user
                return 0
              fi

              default

              pushd libltdl >/dev/null
              AT_NOELIBTOOLIZE=yes eautoreconf
              popd >/dev/null
              AT_NOELIBTOOLIZE=yes eautoreconf
              epunt_cxx

              # Make sure timestamps don't trigger a rebuild of man pages.
              touch doc/*.1
              export HELP2MAN=false
            }
            src_configure() {
              export CONFIG_SHELL="$(type -P bash)"
              export ac_cv_path_SED="$(basename "$(type -P sed)")"
              ECONF_SOURCE=${S} econf --disable-ltdl-install
            }
            src_install() {
              default

              local x
              while read -d $'\0' -r x ; do
                ln -sf /usr/share/gnuconfig/${x##*/} "${x}" || die
              done < <(find "${ED}" '(' -name config.guess -o -name config.sub ')' -print0)
            }


tcsh:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-shells
    # astron.com publishes the official release tarballs with an Apache
    # directory listing; the .asc signatures and the beta/ and old/
    # directories are filtered out by the anchored matcher below.
    dir:
      url: 'https://astron.com/pub/tcsh/'
      matcher: 'tcsh-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$'
    transform:
      - kind: string
        match: 'tcsh-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    vars:
      desc: Enhanced version of the Berkeley C shell (csh)
      homepage: https://www.tcsh.org/
      license: BSD
      iuse: nls
      docs:
        - FAQ
        - Fixes
        - Ported
        - README.md
        - WishList
        - Y2K
      inherit:
        - flag-o-matic
        - autotools
      # we need gettext because we run autoconf (AM_ICONV)
      rdepend: |
        >=sys-libs/ncurses-5.1:0=
        sys-libs/libxcrypt
        virtual/libiconv
      depend: |
        ${RDEPEND}
        sys-devel/gettext
      restrict: test
      patches:
        - tcsh-6.24.01-ftbfs-gcc-10.patch
        - tcsh-6.24.01-no-dot-in-default-path.patch
        - tcsh-6.21.00-use-ncurses.patch
      body: |
        src_prepare() {
          default

          eautoreconf

          # unify ECHO behaviour
          echo "#undef ECHO_STYLE" >> config_f.h
          echo "#define ECHO_STYLE BOTH_ECHO" >> config_f.h
        }

        src_configure() {
          # tcsh compiles in the locations of the system startup files
          # and the directories appended to its default PATH.
          append-cppflags \
            -D_PATH_DOTCSHRC="'\"/etc/csh.cshrc\"'" \
            -D_PATH_DOTLOGIN="'\"/etc/csh.login\"'" \
            -D_PATH_DOTLOGOUT="'\"/etc/csh.logout\"'" \
            -D_PATH_USRBIN="'\"/usr/bin\"'" \
            -D_PATH_BIN="'\"/bin\"'"

          # musl's utmp is non-functional
          if use elibc_musl ; then
            export ac_cv_header_utmp_h=no
            export ac_cv_header_utmpx_h=no
          fi

          local myeconfargs=(
            # keep the binary in /bin as the other shells in the kit do
            --bindir=/bin
            --prefix=/usr
            --datarootdir=/usr/share
            $(use_enable nls)
          )
          econf "${myeconfargs[@]}"
        }

        src_install() {
          emake DESTDIR="${D}" install install.man

          einstalldocs

          insinto /etc
          doins "${FILESDIR}"/csh.cshrc "${FILESDIR}"/csh.login

          # add csh -> tcsh symlink
          dosym tcsh /bin/csh
        }

  packages:
    - tcsh:

savannah_sys_apps_http:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    vars:
      license: LGPL-2.1
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"

  packages:
    - attr:
        vars:
          body: |

            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              unset PLATFORM
              export OPTIMIZER=${CFLAGS}
              export DEBUG=-DNDEBUG

              tc-ld-disable-gold

              local myeconfargs=(
                --bindir="${EPREFIX}"/bin
                --libexecdir="${EPREFIX}"/usr/$(get_libdir)
                --enable-shared
                $(use_enable static-libs static)
                $(use_enable nls)
                $(use_enable debug)
              )
              econf "${myeconfargs[@]}"
            }

            src_install() {
              emake DESTDIR="${D}" install

              # we install attr into /bin, so we need the shared lib with it
              gen_usr_ldscript -a attr

              # Add a wrapper until people upgrade.
              insinto /usr/include/attr
              newins "${FILESDIR}"/xattr-shim.h xattr.h

              if ! use static-libs; then
                find "${ED}" -name '*.la' -delete || die
              fi

              einstalldocs
            }

          depend: |
            nls? ( sys-devel/gettext )
          inherit:
            - libtool
            - toolchain-funcs
            - usr-ldscript
          homepage: https://savannah.nongnu.org/projects/attr
          desc: Extended attributes tools
          iuse: debug nls static-libs
        dir:
          url: http://download.savannah.nongnu.org/releases/attr/
          matcher: "attr-.*.tar.gz$"
        transform:
          - kind: string
            match: 'attr-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''

    - acl:
        vars:
          body: |

            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              local myeconfargs=(
                --bindir="${EPREFIX}"/bin
                --libexecdir="${EPREFIX}"/usr/$(get_libdir)
                $(use_enable static-libs static)
                $(use_enable nls)
              )
              econf "${myeconfargs[@]}"
            }

            src_install() {
              default

              gen_usr_ldscript -a acl

              use static-libs || prune_libtool_files --all
            }

          depend: |
            nls? ( sys-devel/gettext )
          homepage: https://savannah.nongnu.org/projects/acl
          desc: access control list utilities, libraries and headers
          iuse: nls static-libs
          inherit:
            - libtool
            - toolchain-funcs
            - usr-ldscript
            - ltprune
        dir:
          url: http://download.savannah.nongnu.org/releases/acl/
          matcher: "acl-.*.tar.gz$"
        transform:
          - kind: string
            match: 'acl-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''

automake:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-devel
    dir:
      url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
      matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      desc: Used to generate Makefile.in from Makefile.am
      homepage: https://www.gnu.org/software/automake/
      license: GPL-2
      rdepend: |
        dev-lang/perl
        >=sys-devel/automake-wrapper-11
        >=sys-devel/autoconf-2.69:*
        sys-devel/gnuconfig
      depend: '${RDEPEND}'
      bdepend: |
        app-arch/gzip
        sys-apps/help2man
      patches:
        - automake-1.16.2-py3-compile.patch
        - automake-1.16.2-fix-instmany-python.sh-test.patch
        - automake-1.16.2-fix-py-compile-basedir.sh-test.patch
      body: |
        src_prepare() {
          default
          export WANT_AUTOCONF=2.5
          # Don't try wrapping the autotools this thing runs as it tends
          # to be a bit esoteric, and the script does `set -e` itself.
          if [[ ${SLOT} == 1.16 ]] ; then
            ./bootstrap || die
          fi
          # Pin the API version the ebuild is slotted for.
          sed -i -e "/APIVERSION=/s:=.*:=${SLOT}:" configure || die

          # Without texinfo the shipped info pages are kept as is; refresh
          # their stamps so the build does not try to regenerate them.
          if ! has_version sys-apps/texinfo ; then
            touch doc/{stamp-vti,version.texi,automake.info} || die
          fi
        }

        src_configure() {
          default
        }

        # Slot the info pages. Do this without munging the source so we
        # don't have to depend on texinfo to regen things.
        slot_info_pages() {
          pushd "${ED}"/usr/share/info >/dev/null || die
          rm -f dir

          # Rewrite all the references to other pages.
          # before: * aclocal-invocation: (automake)aclocal Invocation.   Generating aclocal.m4.
          # after:  * aclocal-invocation v1.16: (automake-1.16)aclocal Invocation.   Generating aclocal.m4.
          local p pages=( *.info ) args=()
          for p in "${pages[@]/%.info}" ; do
            args+=(
              -e "/START-INFO-DIR-ENTRY/,/END-INFO-DIR-ENTRY/s|: (${p})| v${SLOT}&|"
              -e "s:(${p}):(${p}-${SLOT}):g"
            )
          done
          sed -i "${args[@]}" * || die

          # Rewrite all the file references, and rename them in the process.
          local f d
          for f in * ; do
            d=${f/.info/-${SLOT}.info}
            mv "${f}" "${d}" || die
            sed -i -e "s:${f}:${d}:g" * || die
          done

          popd >/dev/null || die
        }

        src_install() {
          default

          slot_info_pages
          rm "${ED}"/usr/share/aclocal/README || die
          rmdir "${ED}"/usr/share/aclocal || die
          rm \
            "${ED}"/usr/bin/{aclocal,automake} \
            "${ED}"/usr/share/man/man1/{aclocal,automake}.1 || die

          # Remove all config.guess and config.sub files, replacing them
          # with a symlink to the gnuconfig version.
          local x
          for x in guess sub ; do
            dosym ../gnuconfig/config.${x} \
              /usr/share/${PN}-${SLOT}/config.${x}
          done

          # Avoid a QA message about a pre-compressed file in docs.
          local tarfile="${ED}/usr/share/doc/${PF}/amhello-1.0.tar.gz"
          if [[ -f "${tarfile}" ]] ; then
            gunzip "${tarfile}" || die
          fi
        }

  packages:
    - automake:
        # 1.16 track (current tree slot).
        selector:
          - '>=1.16'
          - '<1.17'
        vars:
          slot: '1.16'
    - automake:
        # 1.19 track: 1.17/1.18 are skipped on purpose (review ask).
        selector:
          - '>=1.19'
          - '<1.20'
        vars:
          slot: '1.19'
          # py-compile/basedir fixes are upstream in this line; the test-only
          # instmany limit patch still applies (dry-run verified).
          patches:
            - automake-1.16.2-fix-instmany-python.sh-test.patch
    - automake:
        # 1.20 track.
        selector:
          - '>=1.20'
          - '<1.21'
        vars:
          slot: '1.20'
          patches:
            - automake-1.16.2-fix-instmany-python.sh-test.patch

sys_apps_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    vars:
      license: LGPL-2.1

  packages:

    - icu:
        category: dev-libs
        desc: 'International Components for Unicode'
        template: ../../templates/simple.tmpl
        github:
          user: unicode-org
        transform:
          - kind: string
            match: 'ICU '
            replace: ''
        assets:
          - name: '{{ .Values.pn }}4c-{{ .Values.version }}-sources.tgz'
            matcher: '{{ .Values.pn }}4c-.*-sources.tgz$'
        vars:
          license: BSD
          iuse: debug doc examples static-libs
          python_compat: python3+
          inherit:
            - autotools
            - flag-o-matic
            - python-any-r1
            - toolchain-funcs
          bdepend: |
            ${PYTHON_DEPS}
            sys-devel/autoconf-archive
            virtual/pkgconfig
            doc? ( app-doc/doxygen[dot] )
          s: '${WORKDIR}/{{ .Values.pn }}/source'
          body: |
            src_prepare() {
              default
              # Disable renaming as it is stupid thing to do
              sed -i \
                -e "s/#define U_DISABLE_RENAMING 0/#define U_DISABLE_RENAMING 1/" \
                common/unicode/uconfig.h || die
              # Fix linking of icudata
              sed -i \
                -e "s:LDFLAGSICUDT=-nodefaultlibs -nostdlib:LDFLAGSICUDT=:" \
                config/mh-linux || die
              # Append doxygen configuration to configure
              sed -i \
                -e 's:icudefs.mk:icudefs.mk Doxyfile:' \
                configure.ac || die
              eautoreconf
            }
            src_configure() {
              append-cxxflags -std=c++17
              local myeconfargs=(
                --disable-renaming
                --disable-samples
                --disable-layoutex
                $(use_enable debug)
                $(use_enable static-libs static)
                $(use_enable examples samples)
              )
              # icu tries to use clang by default
              tc-export CC CXX
              # make sure we configure with the same shell as we run icu-config
              # with, or ECHO_N, ECHO_T and ECHO_C will be wrongly defined
              export CONFIG_SHELL="${EPREFIX}/bin/sh"
              # probably have no /bin/sh in prefix-chain
              [[ -x ${CONFIG_SHELL} ]] || CONFIG_SHELL="${BASH}"
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
            }

    - shadow:
        github:
          user: shadow-maint
          # The release 4.17.4 is without name
          # and not catched correctly.
          query: tags
        vars:
          license: BSD GPL-2
        selector:
          - '>=4.17.0'
        exclude:
          - '-rc'
          # Ignore weird tags.
          - '^20'
          - '^19'

    - libffi:
        transform:
          - kind: string
            match: 'libffi '
            replace: ''
        template: ../../templates/simple.tmpl
        category: dev-libs
        github:
          user: libffi
          query: releases
        vars:
          inherit:
            - preserve-libs
          license: MIT
          iuse: debug exec-static-trampoline pax_kernel static-libs
          desc: Portable, high level programming interface to various calling conventions
          homepage: https://sourceware.org/libffi/ https://github.com/libffi/libffi/
          body: |
            src_configure() {
              ECONF_SOURCE="${S}" econf \
                --prefix="${EPREFIX}"/usr/ \
                --includedir="${EPREFIX}"/usr/$(get_libdir)/${PN}/include \
                --disable-multi-os-directory \
                $(use_enable static-libs static) \
                $(use_enable exec-static-trampoline exec-static-tramp) \
                $(use_enable pax_kernel pax_emutramp) \
                $(use_enable debug)
            }

            src_install() {
              einstalldocs
              emake DESTDIR="${D}" install
              find "${ED}" -name "*.la" -delete || die
            }
            pkg_preinst() {
              preserve_old_lib /usr/$(get_libdir)/libffi.so.7
            }
            pkg_postinst() {
              preserve_old_lib_notify /usr/$(get_libdir)/libffi.so.7
            }

        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
            matcher: "libffi-.*.tar.gz"


readline:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-libs
    dir:
      url: 'https://gnuftp.mirror.garr.it/readline/'
      # GNU publishes consolidated patch-level tarballs
      # (readline-X.Y.NN.tar.gz) next to the base release and the
      # readline-X.Y-patches/ directories, so the upstream patch-set
      # policy is "newest consolidated tarball": the anchored matcher
      # below filters the .sig files, the -alpha/-beta/-rc tarballs and
      # the patch-level directories.
      matcher: '^readline-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.gz$'
    transform:
      - kind: string
        match: 'readline-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    # The listing already serves the 8.3 line (readline-8.3.tar.gz plus
    # 8.3-alpha/-beta/-rcN): every core-kit branch ships the 8.2 track,
    # so keep the 8.2.NN patch levels auto-tracked and cap the major.
    # Drop this selector to follow the 8.3 line.
    selector:
      - '>=8.2'
      - '<8.3'
    vars:
      desc: Another cute console display library
      homepage: https://tiswww.case.edu/php/chet/readline/rltop.html
      license: GPL-3
      iuse: static-libs +unicode utils
      inherit:
        - flag-o-matic
        - preserve-libs
        - toolchain-funcs
        - usr-ldscript
      patches:
        - readline-5.0-no_rpath.patch
        - readline-6.2-rlfe-tgoto.patch
        - readline-7.0-headers.patch
        - readline-8.0-headers.patch
      rdepend: |
        >=sys-libs/ncurses-5.9-r3:=[static-libs?]
      depend: |
        ${RDEPEND}
      bdepend: |
        virtual/pkgconfig
      extra_envs:
        - 'HTML_DOCS="doc/history.html doc/readline.html doc/rluserman.html"'
      body: |
        src_prepare() {
          default

          # Force ncurses linking.
          # Use pkg-config to get the right values.
          local ncurses_libs=$($(tc-getPKG_CONFIG) ncurses$(usex unicode w '') --libs)

          sed -i \
            -e "/^SHLIB_LIBS=/s:=.*:='${ncurses_libs}':" \
            support/shobj-conf || die
          sed -i \
            -e "/^[[:space:]]*LIBS=.-lncurses/s:-lncurses:${ncurses_libs}:" \
            examples/rlfe/configure || die

          ln -s ../.. examples/rlfe/readline || die # for local readline headers
        }

        src_configure() {
          # fix implicit decls with widechar funcs
          append-cppflags -D_GNU_SOURCE
          # https://lists.gnu.org/archive/html/bug-readline/2010-07/msg00013.html
          append-cppflags -Dxrealloc=_rl_realloc -Dxmalloc=_rl_malloc -Dxfree=_rl_free

          # Make sure configure picks a better ar than the default one.
          export ac_cv_prog_AR=$(tc-getAR)

          # Force the test since we used sed above to force it.
          export bash_cv_termcap_lib=ncurses

          # This is for rlfe, but we need to make sure LDFLAGS doesn't
          # change so we can re-use the config cache file between the two.
          append-ldflags -L.

          chmod +x configure

          local myeconfargs=(
            --cache-file="${S}"/config.cache
            --with-curses
            $(use_enable static-libs static)
          )
          ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"

          if use utils ; then
            # code is full of AC_TRY_RUN()
            mkdir -p examples/rlfe || die
            cd examples/rlfe || die
            ECONF_SOURCE="${S}"/examples/rlfe \
              econf --cache-file="${S}"/config.cache
          fi
        }

        src_compile() {
          emake

          if use utils ; then
            # code is full of AC_TRY_RUN()
            cd examples/rlfe || die
            local l
            for l in readline history ; do
              ln -s ../../shlib/lib${l}$(get_libname)* lib${l}$(get_libname) || die
              ln -s ../../lib${l}.a lib${l}.a || die
            done
            emake
          fi
        }

        src_install() {
          default

          gen_usr_ldscript -a readline history

          if use utils ; then
            dobin examples/rlfe/rlfe
          fi

          einstalldocs
          dodoc USAGE
          docinto ps
          dodoc doc/*.ps
        }

        pkg_preinst() {
          # Keep old SONAMEs until the reverse dependencies are rebuilt.
          preserve_old_lib \
            /$(get_libdir)/lib{history,readline}$(get_libname 4) \
            /$(get_libdir)/lib{history,readline}$(get_libname 5) \
            /$(get_libdir)/lib{history,readline}$(get_libname 6) \
            /$(get_libdir)/lib{history,readline}$(get_libname 7)
        }

        pkg_postinst() {
          preserve_old_lib_notify \
            /$(get_libdir)/lib{history,readline}$(get_libname 4) \
            /$(get_libdir)/lib{history,readline}$(get_libname 5) \
            /$(get_libdir)/lib{history,readline}$(get_libname 6) \
            /$(get_libdir)/lib{history,readline}$(get_libname 7)
        }

  packages:
    - readline:

app_arch_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: app-arch
    template: ../../templates/simple-github.tmpl

  packages:
    - brotli:
        github:
          user: google

        vars:
          inherit:
            - cmake
          pdepend: |
            python? ( dev-python/brotlipy )
          iuse: python
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_TESTING=false
              )
              cmake_src_configure
            }

    - xz-utils:
        # The official release tarball unpacks to xz-<pv> while pn is
        # xz-utils, so the default ${WORKDIR}/${P} does NOT apply (probed
        # with tar tzf on the 5.8.4 asset).
        template: ../../templates/simple.tmpl
        github:
          user: tukaani-project
          repo: xz
          # Release titles are "XZ Utils <pv> (stable)"/"Stable"/"(old
          # stable)" shaped; ancient ones lack the prefix ("5.4.2 Stable",
          # "XZ 5.2.11 Old Stable"). Filter the mixed history on the raw
          # title, then extract the version from the surviving titles.
          match: '^XZ Utils '
        transform:
          - kind: regex
            match: '^(XZ Utils )?(\S+).*$'
            replace: '${2}'
        # Unstable lines (5.7.x alpha/beta) are released with
        # prerelease=true and are skipped by the generator; these excludes
        # guard an experimental-mode run anyway.
        exclude:
          - 'alpha'
          - 'beta'
        assets:
          - name: '{{ .Values.tname }}-{{ .Values.pv }}.tar.gz'
            matcher: '{{ .Values.tname }}-{{ .Values.pv }}\.tar\.gz$'
        vars:
          tname: xz
          s: '${WORKDIR}/xz-{{ .Values.pv }}'
          desc: utils for managing LZMA compressed files
          homepage: https://tukaani.org/xz/
          license: public-domain LGPL-2.1+ GPL-2+
          iuse: '+extra-filters nls static-libs'
          inherit:
            - libtool
            - preserve-libs
            - usr-ldscript
          # House: no FreeBSD (elibc_FreeBSD dropped from the tree IUSE).
          rdepend: |
            !<app-arch/lzma-4.63
            !<app-arch/p7zip-4.57
            !<app-i18n/man-pages-de-2.16
          depend: '${RDEPEND}'
          body: |
            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              local myconf=(
                --enable-threads
                $(use_enable nls)
                $(use_enable static-libs static)
              )
              if ! use extra-filters ; then
                myconf+=(
                  # LZMA1 + LZMA2 for standard .lzma & .xz files
                  --enable-encoders=lzma1,lzma2
                  --enable-decoders=lzma1,lzma2
                  # those are used by default, depending on preset
                  --enable-match-finders=hc3,hc4,bt4
                  # CRC64 is used by default, though some (old?) files use CRC32
                  --enable-checks=crc32,crc64
                )
              fi
              ECONF_SOURCE="${S}" econf "${myconf[@]}"
            }

            src_install() {
              default
              gen_usr_ldscript -a lzma
              find "${ED}" -type f -name '*.la' -delete || die
              rm "${ED}"/usr/share/doc/${PF}/COPYING* || die
            }

            pkg_preinst() {
              preserve_old_lib /usr/$(get_libdir)/liblzma$(get_libname 0)
            }

            pkg_postinst() {
              preserve_old_lib_notify /usr/$(get_libdir)/liblzma$(get_libname 0)
            }


pxz:
  generator: builtin-noop

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: app-arch
    template: ../../templates/simple.tmpl
    # Upstream publishes no GitHub releases and carries no tags at all (live
    # probe 2026-11-15: releases=0, tags=0) and its home page has no distfile
    # listing, so there is nothing machine-readable to track: this is a pinned
    # builtin-noop. Upstream is NOT dormant - master still moves by commit
    # (latest 824de5dd, 2026-03-17) and the Fedora dist-git spec tracks that
    # same commit - so the pin follows the current master. Bump = update
    # `versions` and `sha` together.
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}.tar.gz'
        url: 'https://github.com/jnovy/pxz/archive/{{ .Values.sha }}.tar.gz'
    vars:
      versions:
        - '5.0_pre20260317'
      sha: 824de5dd22df3ba54bfe2cdd76029a62e53201fe
      desc: Parallel implementation of the XZ compression utility
      homepage: https://jnovy.fedorapeople.org/pxz/
      license: GPL-2
      inherit:
        - toolchain-funcs
      # Needs the library from xz-utils and the libgomp runtime from gcc.
      rdepend: |
        app-arch/xz-utils
        sys-devel/gcc:*[openmp]
      depend: '${RDEPEND}'
      body: |
        # The distfile name carries the commit sha (review ask), so vcs-snapshot
        # no longer renames the archive root: move it into ${S} explicitly.
        post_src_unpack() {
          mv ${WORKDIR}/{{ .Values.pn }}-* "${S}"
        }

        src_prepare() {
          tc-check-openmp
          tc-export CC
          export BINDIR=/usr/bin
          export MANDIR=/usr/share/man
          default
        }

  packages:
    - pxz:


libpcre2:
  generator: builtin-github

  defaults:
    category: dev-libs
    template: ../../templates/simple.tmpl
    github:
      user: PCRE2Project
      repo: pcre2
      query: releases
      # `query: releases` derives the version from the release TITLE, and the
      # PCRE2 titles are not uniform: the modern ones are "PCRE2 10.NN" or
      # "PCRE2-10.NN", while the historic 10.3x/10.4x entries carry free text
      # ("PCRE2-10.35 Historic release copied here") or a lowercase prefix.
      # Keep only the clean titles (live probe 2026-11-15: 30 releases, the
      # newest being pcre2-10.49 titled "PCRE2 10.49"). This also drops the
      # -RC* pre-releases structurally, so no `exclude:` is needed.
      match: '^PCRE2[- ]\d+\.\d+$'
    transform:
      - kind: string
        match: 'PCRE2 '
        replace: ''
      - kind: string
        match: 'PCRE2-'
        replace: ''
    # Upstream publishes the official tarballs as release assets next to
    # .gz/.zip and their .sig files (probed 2026-11-15). Pin the .tar.bz2
    # flavour the tree Manifest already uses; the anchored matcher keeps the
    # sig/gz/zip siblings out. The distfile keeps the upstream name
    # (pcre2-<ver>) so it stays byte-identical with the tree distfile.
    assets:
      - name: 'pcre2-{{ .Values.pv }}.tar.bz2'
        matcher: '^pcre2-[0-9]+\.[0-9]+\.tar\.bz2$'
    vars:
      desc: Perl-compatible regular expression library
      homepage: https://www.pcre.org/
      license: BSD
      iuse: bzip2 +jit libedit pcre16 +pcre32 +readline +recursion-limit static-libs unicode zlib
      required_use: '?? ( libedit readline )'
      inherit:
        - autotools
        - libtool
      rdepend: |
        bzip2? ( app-arch/bzip2 )
        zlib? ( sys-libs/zlib )
        libedit? ( dev-libs/libedit )
        readline? ( sys-libs/readline:0= )
      # The tree guarded this with `userland_GNU?`; the Macaroni profiles set
      # USERLAND="GNU" (captured 2026-11-15), so the dependency is always on.
      depend: |
        ${RDEPEND}
        >=sys-apps/findutils-4.4.0
      bdepend: virtual/pkgconfig
      # The upstream tarball root is pcre2-<ver> (the atom keeps the `lib`
      # prefix, the distfile does not), so the default ${WORKDIR}/${P}
      # directory does not exist.
      s: '${WORKDIR}/pcre2-{{ .Values.pv }}'
      body: |
        src_prepare() {
          default
          elibtoolize
        }

        src_configure() {
          local myeconfargs=(
            --enable-pcre2-8
            --enable-shared
            --htmldir=/usr/share/doc/${PF}/html
            --with-match-limit-depth=$(usex recursion-limit 8192 MATCH_LIMIT)
            $(use_enable bzip2 pcre2grep-libbz2)
            $(use_enable libedit pcre2test-libedit)
            $(use_enable readline pcre2test-libreadline)
            $(use_enable zlib pcre2grep-libz)
            $(use_enable jit)
            $(use_enable jit pcre2grep-jit)
            $(use_enable pcre16 pcre2-16)
            $(use_enable pcre32 pcre2-32)
            $(use_enable static-libs static)
            $(use_enable unicode)
          )
          ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
        }

        src_compile() {
          emake V=1
        }

        src_install() {
          emake DESTDIR="${D}" install
          find "${ED}" -name "*.la" -delete || die
        }

  packages:
    - libpcre2:

libxml2:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-libs
    dir:
      url: https://download.gnome.org/sources/{{ .Values.tname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.tname | default .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      s: '${WORKDIR}/{{ .Values.tname | default .Values.pn }}-{{ .Values.version }}'
      slot: '2'
      python_compat: python3+
      inherit:
        - python-r1
        - meson
      desc: XML C parser and toolkit
      homepage: https://gitlab.gnome.org/GNOME/libxml2/-/wikis/home
      iuse: doc icu python readline static-libs +lzma
      required_use: python? ( ${PYTHON_REQUIRED_USE} )
      rdepend: |
        virtual/libiconv
        sys-libs/zlib:=
        icu? ( dev-libs/icu:= )
        lzma? ( app-arch/xz-utils:= )
        readline? ( sys-libs/readline:= )
      depend: |
        ${RDEPEND}
        ${PYTHON_DEPS}
      bdepend: |
        virtual/pkgconfig
      pdepend: |
        python? ( >=dev-python/libxml2-python-{{ .Values.version }} )
      release: '2.15'
      body: |
        src_prepare() {
          default
          sed -e "/^dir_doc/ s/meson.project_name()$/\'${PF}\'/" -i meson.build || die
          # Permit to compile libxml2 on stage3 without git installed.
          # Hack git command with echo in order to print an empty string.
          sed -e 's|git|echo|g' -e 's|describe||g' -i meson.build || die
        }
        src_configure() {
          local emesonargs=(
            -Ddefault_library=$(usex static-libs both shared)
            $(meson_feature icu)
            $(meson_feature doc docs)
            $(meson_feature readline)
            $(meson_feature readline history)
            -Dpython=disabled
            -Dschematron=enabled
            # There has been a clean break with a soname bump.
            # It's time to deal with the breakage.
            # bug #935452
            -Dlegacy=disabled
          )
          meson_src_configure
        }
        src_install() {
          meson_src_install
        }
        pkg_postinst() {
          # We don't want to do the xmlcatalog during stage1, as xmlcatalog will not
          # be in / and stage1 builds to ROOT=/tmp/stage1root. This fixes bug #208887.
          if [[ -n "${ROOT}" ]]; then
            elog "Skipping XML catalog creation for stage building (bug #208887)."
          else
            # Need an XML catalog, so no-one writes to a non-existent one
            CATALOG="${EROOT}/etc/xml/catalog"
            if [[ ! -e "${CATALOG}" ]]; then
              [[ -d "${EROOT}/etc/xml" ]] || mkdir -p "${EROOT}/etc/xml"
              "${EPREFIX}"/usr/bin/xmlcatalog --create > "${CATALOG}"
              einfo "Created XML catalog in ${CATALOG}"
            fi
          fi
        }

  packages:
    - libxml2:


libcap:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: sys-libs
    template: ../../templates/simple.tmpl
    dir:
      url: https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/
      matcher: "{{ .Values.pn }}-2.*.tar.gz$"

    transform:
      - kind: string
        match: "{{ .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.gz"
        replace: ""
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
        url: https://git.kernel.org/pub/scm/libs/libcap/libcap.git/snapshot/{{ .Values.pn }}-{{ .Values.version }}.tar.gz

    vars:
      desc: "POSIX 1003.1e capabilities"
      homepage: "https://sites.google.com/site/fullycapable/"
      license: "|| ( GPL-2 BSD ) pam? ( || ( LGPL-2+ BSD ) )"
      slot: '0'
      inherit:
        - pam
        - toolchain-funcs
      iuse: pam +static-libs tools
      rdepend: |
        pam? ( sys-libs/pam )
      depend: |
        ${RDEPEND}
        sys-kernel/linux-headers
      bdepend:
        sys-apps/diffutils
        tools? ( dev-lang/go )
      body: |
        run_emake() {
          local args=(
          	exec_prefix="${EPREFIX}"
          	lib_prefix="${EPREFIX}/usr"
          	lib="$(get_libdir)"
          	prefix="${EPREFIX}/usr"
          	PAM_CAP="$(usex pam yes no)"
          	DYNAMIC=yes
          	GOLANG="$(usex tools yes no)"
          )
          emake "${args[@]}" "$@"
        }
        src_compile() {
          local BUILD_CC
          tc-export_build_env BUILD_CC
          run_emake
        }
        src_install() {
          run_emake DESTDIR="${D}" install
          gen_usr_ldscript -a cap
          if ! use static-libs; then
            rm "${ED}"/usr/$(get_libdir)/lib{cap,psx}.a || die
          fi
          # install pam plugins ourselves
          if [[ -d "${ED%/}"/usr/$(get_libdir)/security ]] ; then
            rm -rf "${ED}"/usr/$(get_libdir)/security || die
          fi
          if use pam; then
            dopammod pam_cap/pam_cap.so
            dopamsecurity '' pam_cap/capability.conf
          fi
        }

  packages:
    - libcap:

zstd:
  generator: builtin-github

  defaults:
    category: app-arch
    template: ../../templates/simple.tmpl
    github:
      # Upstream moved from facebook/zstd to meta/zstd (GitHub redirects the
      # old owner); use the canonical one.
      user: meta
    # Release titles are "Zstandard v1.5.7": strip the product prefix (the
    # leading v is removed by the generator itself).
    transform:
      - kind: string
        match: "Zstandard v"
        replace: ""

  packages:
    - zstd:
        vars:
          desc: zstd fast compression library
          homepage: https://facebook.github.io/zstd/
          license: '|| ( BSD GPL-2 )'
          slot: '0/1'
          inherit:
            - flag-o-matic
            - toolchain-funcs
          iuse: lz4 static-libs +threads
          rdepend: |
            app-arch/xz-utils
            lz4? ( app-arch/lz4 )
          depend: '${RDEPEND}'
          body: |
            src_compile() {
              export CC="$(tc-getCC)"
              export CXX="$(tc-getCXX)"
              export AR="$(tc-getAR)"
              export PREFIX="/usr"
              export LIBDIR="/usr/$(get_libdir)"

              local libzstd_targets=( libzstd{,.a}$(usex threads '-mt' '') )

              emake -C lib "${libzstd_targets[@]}" libzstd.pc

              emake HAVE_LZ4="$(usex lz4 1 0)" zstd

              emake -C contrib/pzstd
            }

            src_install() {
              # src_install runs in its own shell, so re-export the install paths.
              export PREFIX="/usr"
              export LIBDIR="/usr/$(get_libdir)"

              emake -C lib DESTDIR="${D}" install

              emake -C programs DESTDIR="${D}" install

              emake -C contrib/pzstd DESTDIR="${D}" install

              einstalldocs

              # src_install_all is not a valid phase in this portage
              # (EAPI 7), so the tree's static-libs cleanup hook never ran.
              # Keep the intended behaviour where it actually executes.
              if ! use static-libs ; then
                find "${ED}" -name "*.a" -delete || die
              fi
            }
        assets:
          # Official release tarball: unpacks into the default ${P} root,
          # hence simple.tmpl and no post_src_unpack.
          - name: '{{ .Values.p }}.tar.gz'
            matcher: 'zstd-.*\.tar\.gz$'

expat:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-libs
    template: ../../templates/simple.tmpl

    github:
      user: libexpat
      repo: libexpat
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.original_version }}.tar.xz'
        matcher: '{{ .Values.pn }}-.*.tar.xz'
    vars:
      inherit:
        - autotools
      iuse: examples static-libs unicode
      bdepend: |
        unicode? (
          sys-devel/automake
          sys-devel/autoconf
          sys-devel/libtool
        )
        app-portage/elt-patches
      docs:
        - README.md
      body: |
        src_prepare() {
          default
          # fix interpreter to be a recent/good shell
          sed -i -e "1s:/bin/sh:${BASH}:" conftools/get-version.sh || die
          if use unicode; then
            cp -R "${S}" "${S}"w || die
            pushd "${S}"w >/dev/null
            find -name Makefile.am \
              -exec sed \
              -e 's,libexpat\.la,libexpatw.la,' \
              -e 's,libexpat_la,libexpatw_la,' \
              -i {} + || die
            eautoreconf
            popd >/dev/null
          fi
        }
        src_configure() {
          local myconf="$(use_enable static-libs static) --without-docbook"
          mkdir -p "${BUILD_DIR}"w || die
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            CPPFLAGS="${CPPFLAGS} -DXML_UNICODE" ECONF_SOURCE="${S}"w econf ${myconf}
            popd >/dev/null
          fi
          ECONF_SOURCE="${S}" econf ${myconf}
        }
        src_compile() {
          emake
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            emake -C lib
            popd >/dev/null
          fi
        }
        src_install() {
          emake install DESTDIR="${D}"
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            emake -C lib install DESTDIR="${D}"
            popd >/dev/null

            pushd "${ED}"/usr/$(get_libdir)/pkgconfig >/dev/null
            cp expat.pc expatw.pc
            sed -i -e '/^Libs/s:-lexpat:&w:' expatw.pc || die
            popd >/dev/null
          fi
          einstalldocs
          doman doc/xmlwf.1
          # Note: Use of HTML_DOCS would add unwanted "doc" subfolder
          docinto html
          dodoc doc/*.{css,html}
          if use examples; then
            docinto examples
            dodoc examples/*.c
            docompress -x usr/share/doc/${PF}/examples
          fi
          find "${D}" -name '*.la' -type f -delete || die
        }

  packages:
    - expat:


