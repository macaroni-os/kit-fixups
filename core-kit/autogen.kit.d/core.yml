tcsh:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-shells
    # astron.com publishes the official release tarballs with an Apache
    # directory listing; the .asc signatures and the beta/ and old/
    # directories are filtered out by the anchored matcher below.
    dir:
      url: 'https://astron.com/pub/tcsh/'
      matcher: 'tcsh-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$'
    transform:
      - kind: string
        match: 'tcsh-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    vars:
      desc: Enhanced version of the Berkeley C shell (csh)
      homepage: https://www.tcsh.org/
      license: BSD
      iuse: nls
      docs:
        - FAQ
        - Fixes
        - Ported
        - README.md
        - WishList
        - Y2K
      inherit:
        - flag-o-matic
        - autotools
      # we need gettext because we run autoconf (AM_ICONV)
      rdepend: |
        >=sys-libs/ncurses-5.1:0=
        sys-libs/libxcrypt
        virtual/libiconv
      depend: |
        ${RDEPEND}
        sys-devel/gettext
      restrict: test
      patches:
        - tcsh-6.24.01-ftbfs-gcc-10.patch
        - tcsh-6.24.01-no-dot-in-default-path.patch
        - tcsh-6.21.00-use-ncurses.patch
      body: |
        src_prepare() {
          default

          eautoreconf

          # unify ECHO behaviour
          echo "#undef ECHO_STYLE" >> config_f.h
          echo "#define ECHO_STYLE BOTH_ECHO" >> config_f.h
        }

        src_configure() {
          # tcsh compiles in the locations of the system startup files
          # and the directories appended to its default PATH.
          append-cppflags \
            -D_PATH_DOTCSHRC="'\"/etc/csh.cshrc\"'" \
            -D_PATH_DOTLOGIN="'\"/etc/csh.login\"'" \
            -D_PATH_DOTLOGOUT="'\"/etc/csh.logout\"'" \
            -D_PATH_USRBIN="'\"/usr/bin\"'" \
            -D_PATH_BIN="'\"/bin\"'"

          # musl's utmp is non-functional
          if use elibc_musl ; then
            export ac_cv_header_utmp_h=no
            export ac_cv_header_utmpx_h=no
          fi

          local myeconfargs=(
            # keep the binary in /bin as the other shells in the kit do
            --bindir=/bin
            --prefix=/usr
            --datarootdir=/usr/share
            $(use_enable nls)
          )
          econf "${myeconfargs[@]}"
        }

        src_install() {
          emake DESTDIR="${D}" install install.man

          einstalldocs

          insinto /etc
          doins "${FILESDIR}"/csh.cshrc "${FILESDIR}"/csh.login

          # add csh -> tcsh symlink
          dosym tcsh /bin/csh
        }

  packages:
    - tcsh:

savannah_sys_apps_http:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    vars:
      license: LGPL-2.1
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"

  packages:
    - attr:
        vars:
          body: |

            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              unset PLATFORM
              export OPTIMIZER=${CFLAGS}
              export DEBUG=-DNDEBUG

              tc-ld-disable-gold

              local myeconfargs=(
                --bindir="${EPREFIX}"/bin
                --libexecdir="${EPREFIX}"/usr/$(get_libdir)
                --enable-shared
                $(use_enable static-libs static)
                $(use_enable nls)
                $(use_enable debug)
              )
              econf "${myeconfargs[@]}"
            }

            src_install() {
              emake DESTDIR="${D}" install

              # we install attr into /bin, so we need the shared lib with it
              gen_usr_ldscript -a attr

              # Add a wrapper until people upgrade.
              insinto /usr/include/attr
              newins "${FILESDIR}"/xattr-shim.h xattr.h

              if ! use static-libs; then
                find "${ED}" -name '*.la' -delete || die
              fi

              einstalldocs
            }

          depend: |
            nls? ( sys-devel/gettext )
          inherit:
            - libtool
            - toolchain-funcs
            - usr-ldscript
          homepage: https://savannah.nongnu.org/projects/attr
          desc: Extended attributes tools
          iuse: debug nls static-libs
        dir:
          url: http://download.savannah.nongnu.org/releases/attr/
          matcher: "attr-.*.tar.gz$"
        transform:
          - kind: string
            match: 'attr-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''

    - acl:
        vars:
          body: |

            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              local myeconfargs=(
                --bindir="${EPREFIX}"/bin
                --libexecdir="${EPREFIX}"/usr/$(get_libdir)
                $(use_enable static-libs static)
                $(use_enable nls)
              )
              econf "${myeconfargs[@]}"
            }

            src_install() {
              default

              gen_usr_ldscript -a acl

              use static-libs || prune_libtool_files --all
            }

          depend: |
            nls? ( sys-devel/gettext )
          homepage: https://savannah.nongnu.org/projects/acl
          desc: access control list utilities, libraries and headers
          iuse: nls static-libs
          inherit:
            - libtool
            - toolchain-funcs
            - usr-ldscript
            - ltprune
        dir:
          url: http://download.savannah.nongnu.org/releases/acl/
          matcher: "acl-.*.tar.gz$"
        transform:
          - kind: string
            match: 'acl-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''

sys_apps_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    vars:
      license: LGPL-2.1

  packages:

    - icu:
        category: dev-libs
        desc: 'International Components for Unicode'
        template: ../../templates/simple.tmpl
        github:
          user: unicode-org
        transform:
          - kind: string
            match: 'ICU '
            replace: ''
        assets:
          - name: '{{ .Values.pn }}4c-{{ .Values.version }}-sources.tgz'
            matcher: '{{ .Values.pn }}4c-.*-sources.tgz$'
        vars:
          license: BSD
          iuse: debug doc examples static-libs
          python_compat: python3+
          inherit:
            - autotools
            - flag-o-matic
            - python-any-r1
            - toolchain-funcs
          bdepend: |
            ${PYTHON_DEPS}
            sys-devel/autoconf-archive
            virtual/pkgconfig
            doc? ( app-doc/doxygen[dot] )
          s: '${WORKDIR}/{{ .Values.pn }}/source'
          body: |
            src_prepare() {
              default
              # Disable renaming as it is stupid thing to do
              sed -i \
                -e "s/#define U_DISABLE_RENAMING 0/#define U_DISABLE_RENAMING 1/" \
                common/unicode/uconfig.h || die
              # Fix linking of icudata
              sed -i \
                -e "s:LDFLAGSICUDT=-nodefaultlibs -nostdlib:LDFLAGSICUDT=:" \
                config/mh-linux || die
              # Append doxygen configuration to configure
              sed -i \
                -e 's:icudefs.mk:icudefs.mk Doxyfile:' \
                configure.ac || die
              eautoreconf
            }
            src_configure() {
              append-cxxflags -std=c++17
              local myeconfargs=(
                --disable-renaming
                --disable-samples
                --disable-layoutex
                $(use_enable debug)
                $(use_enable static-libs static)
                $(use_enable examples samples)
              )
              # icu tries to use clang by default
              tc-export CC CXX
              # make sure we configure with the same shell as we run icu-config
              # with, or ECHO_N, ECHO_T and ECHO_C will be wrongly defined
              export CONFIG_SHELL="${EPREFIX}/bin/sh"
              # probably have no /bin/sh in prefix-chain
              [[ -x ${CONFIG_SHELL} ]] || CONFIG_SHELL="${BASH}"
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
            }

    - shadow:
        github:
          user: shadow-maint
          # The release 4.17.4 is without name
          # and not catched correctly.
          query: tags
        vars:
          license: BSD GPL-2
        selector:
          - '>=4.17.0'
        exclude:
          - '-rc'
          # Ignore weird tags.
          - '^20'
          - '^19'

    - libffi:
        transform:
          - kind: string
            match: 'libffi '
            replace: ''
        template: ../../templates/simple.tmpl
        category: dev-libs
        github:
          user: libffi
          query: releases
        vars:
          inherit:
            - preserve-libs
          license: MIT
          iuse: debug exec-static-trampoline pax_kernel static-libs
          desc: Portable, high level programming interface to various calling conventions
          homepage: https://sourceware.org/libffi/ https://github.com/libffi/libffi/
          body: |
            src_configure() {
              ECONF_SOURCE="${S}" econf \
                --prefix="${EPREFIX}"/usr/ \
                --includedir="${EPREFIX}"/usr/$(get_libdir)/${PN}/include \
                --disable-multi-os-directory \
                $(use_enable static-libs static) \
                $(use_enable exec-static-trampoline exec-static-tramp) \
                $(use_enable pax_kernel pax_emutramp) \
                $(use_enable debug)
            }

            src_install() {
              einstalldocs
              emake DESTDIR="${D}" install
              find "${ED}" -name "*.la" -delete || die
            }
            pkg_preinst() {
              preserve_old_lib /usr/$(get_libdir)/libffi.so.7
            }
            pkg_postinst() {
              preserve_old_lib_notify /usr/$(get_libdir)/libffi.so.7
            }

        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
            matcher: "libffi-.*.tar.gz"


app_arch_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: app-arch
    template: ../../templates/simple-github.tmpl

  packages:
    - brotli:
        github:
          user: google

        vars:
          inherit:
            - cmake
          pdepend: |
            python? ( dev-python/brotlipy )
          iuse: python
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_TESTING=false
              )
              cmake_src_configure
            }

    - xz-utils:
        # The official release tarball unpacks to xz-<pv> while pn is
        # xz-utils, so the default ${WORKDIR}/${P} does NOT apply (probed
        # with tar tzf on the 5.8.4 asset).
        template: ../../templates/simple.tmpl
        github:
          user: tukaani-project
          repo: xz
          # Release titles are "XZ Utils <pv> (stable)"/"Stable"/"(old
          # stable)" shaped; ancient ones lack the prefix ("5.4.2 Stable",
          # "XZ 5.2.11 Old Stable"). Filter the mixed history on the raw
          # title, then extract the version from the surviving titles.
          match: '^XZ Utils '
        transform:
          - kind: regex
            match: '^(XZ Utils )?(\S+).*$'
            replace: '${2}'
        # Unstable lines (5.7.x alpha/beta) are released with
        # prerelease=true and are skipped by the generator; these excludes
        # guard an experimental-mode run anyway.
        exclude:
          - 'alpha'
          - 'beta'
        assets:
          - name: '{{ .Values.tname }}-{{ .Values.pv }}.tar.gz'
            matcher: '{{ .Values.tname }}-{{ .Values.pv }}\.tar\.gz$'
        vars:
          tname: xz
          s: '${WORKDIR}/xz-{{ .Values.pv }}'
          desc: utils for managing LZMA compressed files
          homepage: https://tukaani.org/xz/
          license: public-domain LGPL-2.1+ GPL-2+
          iuse: '+extra-filters nls static-libs'
          inherit:
            - libtool
            - preserve-libs
            - usr-ldscript
          # House: no FreeBSD (elibc_FreeBSD dropped from the tree IUSE).
          rdepend: |
            !<app-arch/lzma-4.63
            !<app-arch/p7zip-4.57
            !<app-i18n/man-pages-de-2.16
          depend: '${RDEPEND}'
          body: |
            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              local myconf=(
                --enable-threads
                $(use_enable nls)
                $(use_enable static-libs static)
              )
              if ! use extra-filters ; then
                myconf+=(
                  # LZMA1 + LZMA2 for standard .lzma & .xz files
                  --enable-encoders=lzma1,lzma2
                  --enable-decoders=lzma1,lzma2
                  # those are used by default, depending on preset
                  --enable-match-finders=hc3,hc4,bt4
                  # CRC64 is used by default, though some (old?) files use CRC32
                  --enable-checks=crc32,crc64
                )
              fi
              ECONF_SOURCE="${S}" econf "${myconf[@]}"
            }

            src_install() {
              default
              gen_usr_ldscript -a lzma
              find "${ED}" -type f -name '*.la' -delete || die
              rm "${ED}"/usr/share/doc/${PF}/COPYING* || die
            }

            pkg_preinst() {
              preserve_old_lib /usr/$(get_libdir)/liblzma$(get_libname 0)
            }

            pkg_postinst() {
              preserve_old_lib_notify /usr/$(get_libdir)/liblzma$(get_libname 0)
            }


pxz:
  generator: builtin-noop

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: app-arch
    template: ../../templates/simple.tmpl
    # Upstream publishes no GitHub releases and carries no tags at all (live
    # probe 2026-11-15: releases=0, tags=0) and its home page has no distfile
    # listing, so there is nothing machine-readable to track: this is a pinned
    # builtin-noop. Upstream is NOT dormant - master still moves by commit
    # (latest 824de5dd, 2026-03-17) and the Fedora dist-git spec tracks that
    # same commit - so the pin follows the current master. Bump = update
    # `versions` and `sha` together.
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}.tar.gz'
        url: 'https://github.com/jnovy/pxz/archive/{{ .Values.sha }}.tar.gz'
    vars:
      versions:
        - '5.0_pre20260317'
      sha: 824de5dd22df3ba54bfe2cdd76029a62e53201fe
      desc: Parallel implementation of the XZ compression utility
      homepage: https://jnovy.fedorapeople.org/pxz/
      license: GPL-2
      inherit:
        - toolchain-funcs
      # Needs the library from xz-utils and the libgomp runtime from gcc.
      rdepend: |
        app-arch/xz-utils
        sys-devel/gcc:*[openmp]
      depend: '${RDEPEND}'
      body: |
        # The distfile name carries the commit sha (review ask), so vcs-snapshot
        # no longer renames the archive root: move it into ${S} explicitly.
        post_src_unpack() {
          mv ${WORKDIR}/{{ .Values.pn }}-* "${S}"
        }

        src_prepare() {
          tc-check-openmp
          tc-export CC
          export BINDIR=/usr/bin
          export MANDIR=/usr/share/man
          default
        }

  packages:
    - pxz:


libxml2:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-libs
    dir:
      url: https://download.gnome.org/sources/{{ .Values.tname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.tname | default .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      s: '${WORKDIR}/{{ .Values.tname | default .Values.pn }}-{{ .Values.version }}'
      slot: '2'
      python_compat: python3+
      inherit:
        - python-r1
        - meson
      desc: XML C parser and toolkit
      homepage: https://gitlab.gnome.org/GNOME/libxml2/-/wikis/home
      iuse: doc icu python readline static-libs +lzma
      required_use: python? ( ${PYTHON_REQUIRED_USE} )
      rdepend: |
        virtual/libiconv
        sys-libs/zlib:=
        icu? ( dev-libs/icu:= )
        lzma? ( app-arch/xz-utils:= )
        readline? ( sys-libs/readline:= )
      depend: |
        ${RDEPEND}
        ${PYTHON_DEPS}
      bdepend: |
        virtual/pkgconfig
      pdepend: |
        python? ( >=dev-python/libxml2-python-{{ .Values.version }} )
      release: '2.15'
      body: |
        src_prepare() {
          default
          sed -e "/^dir_doc/ s/meson.project_name()$/\'${PF}\'/" -i meson.build || die
          # Permit to compile libxml2 on stage3 without git installed.
          # Hack git command with echo in order to print an empty string.
          sed -e 's|git|echo|g' -e 's|describe||g' -i meson.build || die
        }
        src_configure() {
          local emesonargs=(
            -Ddefault_library=$(usex static-libs both shared)
            $(meson_feature icu)
            $(meson_feature doc docs)
            $(meson_feature readline)
            $(meson_feature readline history)
            -Dpython=disabled
            -Dschematron=enabled
            # There has been a clean break with a soname bump.
            # It's time to deal with the breakage.
            # bug #935452
            -Dlegacy=disabled
          )
          meson_src_configure
        }
        src_install() {
          meson_src_install
        }
        pkg_postinst() {
          # We don't want to do the xmlcatalog during stage1, as xmlcatalog will not
          # be in / and stage1 builds to ROOT=/tmp/stage1root. This fixes bug #208887.
          if [[ -n "${ROOT}" ]]; then
            elog "Skipping XML catalog creation for stage building (bug #208887)."
          else
            # Need an XML catalog, so no-one writes to a non-existent one
            CATALOG="${EROOT}/etc/xml/catalog"
            if [[ ! -e "${CATALOG}" ]]; then
              [[ -d "${EROOT}/etc/xml" ]] || mkdir -p "${EROOT}/etc/xml"
              "${EPREFIX}"/usr/bin/xmlcatalog --create > "${CATALOG}"
              einfo "Created XML catalog in ${CATALOG}"
            fi
          fi
        }

  packages:
    - libxml2:


libcap:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: sys-libs
    template: ../../templates/simple.tmpl
    dir:
      url: https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/
      matcher: "{{ .Values.pn }}-2.*.tar.gz$"

    transform:
      - kind: string
        match: "{{ .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.gz"
        replace: ""
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
        url: https://git.kernel.org/pub/scm/libs/libcap/libcap.git/snapshot/{{ .Values.pn }}-{{ .Values.version }}.tar.gz

    vars:
      desc: "POSIX 1003.1e capabilities"
      homepage: "https://sites.google.com/site/fullycapable/"
      license: "|| ( GPL-2 BSD ) pam? ( || ( LGPL-2+ BSD ) )"
      slot: '0'
      inherit:
        - pam
        - toolchain-funcs
      iuse: pam +static-libs tools
      rdepend: |
        pam? ( sys-libs/pam )
      depend: |
        ${RDEPEND}
        sys-kernel/linux-headers
      bdepend:
        sys-apps/diffutils
        tools? ( dev-lang/go )
      body: |
        run_emake() {
          local args=(
          	exec_prefix="${EPREFIX}"
          	lib_prefix="${EPREFIX}/usr"
          	lib="$(get_libdir)"
          	prefix="${EPREFIX}/usr"
          	PAM_CAP="$(usex pam yes no)"
          	DYNAMIC=yes
          	GOLANG="$(usex tools yes no)"
          )
          emake "${args[@]}" "$@"
        }
        src_compile() {
          local BUILD_CC
          tc-export_build_env BUILD_CC
          run_emake
        }
        src_install() {
          run_emake DESTDIR="${D}" install
          gen_usr_ldscript -a cap
          if ! use static-libs; then
            rm "${ED}"/usr/$(get_libdir)/lib{cap,psx}.a || die
          fi
          # install pam plugins ourselves
          if [[ -d "${ED%/}"/usr/$(get_libdir)/security ]] ; then
            rm -rf "${ED}"/usr/$(get_libdir)/security || die
          fi
          if use pam; then
            dopammod pam_cap/pam_cap.so
            dopamsecurity '' pam_cap/capability.conf
          fi
        }

  packages:
    - libcap:

zstd:
  generator: builtin-github

  defaults:
    category: app-arch
    template: ../../templates/simple.tmpl
    github:
      # Upstream moved from facebook/zstd to meta/zstd (GitHub redirects the
      # old owner); use the canonical one.
      user: meta
    # Release titles are "Zstandard v1.5.7": strip the product prefix (the
    # leading v is removed by the generator itself).
    transform:
      - kind: string
        match: "Zstandard v"
        replace: ""

  packages:
    - zstd:
        vars:
          desc: zstd fast compression library
          homepage: https://facebook.github.io/zstd/
          license: '|| ( BSD GPL-2 )'
          slot: '0/1'
          inherit:
            - flag-o-matic
            - toolchain-funcs
          iuse: lz4 static-libs +threads
          rdepend: |
            app-arch/xz-utils
            lz4? ( app-arch/lz4 )
          depend: '${RDEPEND}'
          body: |
            src_compile() {
              export CC="$(tc-getCC)"
              export CXX="$(tc-getCXX)"
              export AR="$(tc-getAR)"
              export PREFIX="/usr"
              export LIBDIR="/usr/$(get_libdir)"

              local libzstd_targets=( libzstd{,.a}$(usex threads '-mt' '') )

              emake -C lib "${libzstd_targets[@]}" libzstd.pc

              emake HAVE_LZ4="$(usex lz4 1 0)" zstd

              emake -C contrib/pzstd
            }

            src_install() {
              # src_install runs in its own shell, so re-export the install paths.
              export PREFIX="/usr"
              export LIBDIR="/usr/$(get_libdir)"

              emake -C lib DESTDIR="${D}" install

              emake -C programs DESTDIR="${D}" install

              emake -C contrib/pzstd DESTDIR="${D}" install

              einstalldocs

              # src_install_all is not a valid phase in this portage
              # (EAPI 7), so the tree's static-libs cleanup hook never ran.
              # Keep the intended behaviour where it actually executes.
              if ! use static-libs ; then
                find "${ED}" -name "*.a" -delete || die
              fi
            }
        assets:
          # Official release tarball: unpacks into the default ${P} root,
          # hence simple.tmpl and no post_src_unpack.
          - name: '{{ .Values.p }}.tar.gz'
            matcher: 'zstd-.*\.tar\.gz$'

expat:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-libs
    template: ../../templates/simple.tmpl

    github:
      user: libexpat
      repo: libexpat
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.original_version }}.tar.xz'
        matcher: '{{ .Values.pn }}-.*.tar.xz'
    vars:
      inherit:
        - autotools
      iuse: examples static-libs unicode
      bdepend: |
        unicode? (
          sys-devel/automake
          sys-devel/autoconf
          sys-devel/libtool
        )
        app-portage/elt-patches
      docs:
        - README.md
      body: |
        src_prepare() {
          default
          # fix interpreter to be a recent/good shell
          sed -i -e "1s:/bin/sh:${BASH}:" conftools/get-version.sh || die
          if use unicode; then
            cp -R "${S}" "${S}"w || die
            pushd "${S}"w >/dev/null
            find -name Makefile.am \
              -exec sed \
              -e 's,libexpat\.la,libexpatw.la,' \
              -e 's,libexpat_la,libexpatw_la,' \
              -i {} + || die
            eautoreconf
            popd >/dev/null
          fi
        }
        src_configure() {
          local myconf="$(use_enable static-libs static) --without-docbook"
          mkdir -p "${BUILD_DIR}"w || die
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            CPPFLAGS="${CPPFLAGS} -DXML_UNICODE" ECONF_SOURCE="${S}"w econf ${myconf}
            popd >/dev/null
          fi
          ECONF_SOURCE="${S}" econf ${myconf}
        }
        src_compile() {
          emake
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            emake -C lib
            popd >/dev/null
          fi
        }
        src_install() {
          emake install DESTDIR="${D}"
          if use unicode; then
            pushd "${BUILD_DIR}"w >/dev/null
            emake -C lib install DESTDIR="${D}"
            popd >/dev/null

            pushd "${ED}"/usr/$(get_libdir)/pkgconfig >/dev/null
            cp expat.pc expatw.pc
            sed -i -e '/^Libs/s:-lexpat:&w:' expatw.pc || die
            popd >/dev/null
          fi
          einstalldocs
          doman doc/xmlwf.1
          # Note: Use of HTML_DOCS would add unwanted "doc" subfolder
          docinto html
          dodoc doc/*.{css,html}
          if use examples; then
            docinto examples
            dodoc examples/*.c
            docompress -x usr/share/doc/${PF}/examples
          fi
          find "${D}" -name '*.la' -type f -delete || die
        }

  packages:
    - expat:


