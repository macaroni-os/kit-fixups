elfutils:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-libs
    dir:
      url: https://sourceware.org/elfutils/ftp
      matcher: "^0[.0-9]+"
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://sourceware.org/elfutils/ftp/{{ .Values.version }}/{{ .Values.pn }}-{{ .Values.pv }}.tar.bz2'

    vars:
      inherit:
        - autotools
        - flag-o-matic
      desc: Libraries/utilities to handle ELF objects (drop in replacement for libelf)
      homepage: https://sourceware.org/elfutils/
      license: '|| ( GPL-2+ LGPL-3+ ) utils? ( GPL-3+ )'
      iuse: bzip2 debuginfod libarchive lzma nls static-libs +threads +utils valgrind zstd
      rdepend: |
        sys-libs/zlib[static-libs?]
        bzip2? ( app-arch/bzip2[static-libs?] )
        lzma? ( app-arch/xz-utils[static-libs?] )
        zstd? ( app-arch/zstd:=[static-libs?] )
        debuginfod? (
          dev-db/sqlite:3=
          dev-libs/json-c:=
          net-libs/libmicrohttpd:=
          net-misc/curl[static-libs?]
        )
        libarchive? ( app-arch/libarchive:= )

      depend: |
        ${RDEPEND}
        valgrind? ( dev-util/valgrind )
      bdepend: |
        sys-devel/flex
        sys-devel/m4
        nls? ( sys-devel/gettext )
      required_use: |
        debuginfod? ( libarchive )
      body: |
        src_prepare() {
          default
          eautoreconf
          if ! use static-libs; then
            sed -i -e '/^lib_LIBRARIES/s:=.*:=:' -e '/^%.os/s:%.o$::' lib{asm,dw,elf}/Makefile.in || die
          fi
          # https://sourceware.org/PR23914
          sed -i 's:-Werror::' */Makefile.in || die
        }
        src_configure() {
          unset LEX YACC

          local myeconfargs=(
            $(use_enable nls)
            $(use_enable debuginfod)
            $(use_enable debuginfod libdebuginfod)
            $(use_enable valgrind valgrind-annotations)
            $(use_enable threads thread-safety)
            # Valgrind option is just for running tests under it; dodgy under sandbox
            # and indeed even w/ glibc with newer instructions.
            --disable-valgrind
            --program-prefix="eu-"
            --with-zlib
            $(use_with bzip2 bzlib)
            $(use_with libarchive)
            $(use_with lzma)
            $(use_with zstd)

          )
          # Valgrind option is just for running tests under it; dodgy under sandbox
          # and indeed even w/ glibc with newer instructions.
          #
          ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
        }
        src_install() {
          default
          einstalldocs
          dodoc NOTES
          # These build quick, and are needed for most tests, so don't
          # disable their building when the USE flag is disabled.
          if ! use utils; then
            rm -rf "${ED}"/usr/bin || die
          fi
        }

  packages:

    - elfutils:

util_linux:
  generator: builtin-github
  defaults:
    category: sys-apps
    template: ../../templates/simple-github.tmpl
    github:
      user: util-linux
      query: tags
    exclude:
      - '-rc'
      - '-devel'
      - '-start'

  packages:
    - util-linux:
        files_dir: "{{ .Values.pn }}"
        vars:
          desc: Various useful Linux utilities
          homepage: https://www.kernel.org/pub/linux/utils/util-linux/
          license: GPL-2 GPL-3 LGPL-2.1 BSD-4 MIT public-domain
          iuse: audit build +caps +cramfs cryptsetup fdformat hardlink kill +logger magic ncurses nls pam python +readline rtas selinux slang static-libs su +suid tty-helpers udev unicode
          inherit:
            - autotools
            - toolchain-funcs
            - libtool
            - flag-o-matic
            - bash-completion-r1
            - usr-ldscript
            - pam
          rdepend: |
            virtual/libc:=
            audit? ( >=sys-process/audit-2.6:= )
            caps? ( sys-libs/libcap-ng )
            cramfs? ( sys-libs/zlib:= )
            cryptsetup? ( sys-fs/cryptsetup )
            hardlink? ( dev-libs/libpcre2:= )
            ncurses? (
              sys-libs/ncurses:=
              magic? ( sys-apps/file:0= )
            )
            nls? ( virtual/libintl )
            pam? ( sys-libs/pam )
            readline? ( sys-libs/readline:0= )
            rtas? ( sys-libs/librtas )
            selinux? ( >=sys-libs/libselinux-2.2.2-r4 )
            slang? ( sys-libs/slang )
            udev? ( virtual/libudev:= )
            hardlink? ( !app-arch/hardlink )
            logger? ( !>=app-admin/sysklogd-2.0[logger] )
            kill? (
              !sys-apps/coreutils[kill]
              !sys-process/procps[kill]
            )
            su? ( !sys-apps/shadow[su] )
            !net-wireless/rfkill
          depend: |
            ${RDEPEND}
            virtual/os-headers
          bdepend: |
            virtual/pkgconfig
            nls? ( sys-devel/gettext )
          required_use: su? ( pam )
          # Keep the bindings in a separate package and pull them in as a
          # PDEPEND to avoid the build-time Python dependency cycle
          # (macaroni-os/mark-issues#859).
          pdepend: python? ( sys-apps/util-linux-python )
          restrict: test
          body: |
            pkg_pretend() {
              if use su && ! use suid ; then
                elog "su will be installed as suid despite USE=-suid"
                elog "To use su without suid, see e.g. Portage's suidctl feature."
              fi
            }

            src_prepare() {
              default
              ./autogen.sh || die
              eautoreconf
            }

            src_configure() {
              export ac_cv_header_security_pam_misc_h=$(usex pam)
              export ac_cv_header_security_pam_appl_h=$(usex pam)

              # Undo bad ncurses handling by upstream. Fall back to pkg-config.
              export NCURSES6_CONFIG=false NCURSES5_CONFIG=false
              export NCURSESW6_CONFIG=false NCURSESW5_CONFIG=false

              # Avoid automagic dependency on ppc*
              export ac_cv_lib_rtas_rtas_get_sysparm=$(usex rtas)

              local myeconfargs=(
                --enable-fs-paths-extra="/usr/sbin:/bin:/usr/bin"
                --disable-liblastlog2
                --with-bashcompletiondir="$(get_bashcompdir)"
                --without-python
                $(use_enable suid makeinstall-chown)
                $(use_enable suid makeinstall-setuid)
                $(use_with readline)
                $(use_with slang)
                --without-systemd
                $(use_with udev)
                $(usex ncurses "$(use_with magic libmagic)" '--without-libmagic')
                $(usex ncurses "$(use_with unicode ncursesw)" '--without-ncursesw')
                $(usex ncurses "$(use_with !unicode ncurses)" '--without-ncurses')
                $(use_with audit)
                $(tc-has-tls || echo --disable-tls)
                --disable-asciidoc
                $(use_enable nls)
                $(use_enable unicode widechar)
                $(use_enable static-libs static)
                $(use_with ncurses tinfo)
                $(use_with selinux)
                --disable-chfn-chsh
                --disable-login
                --disable-newgrp
                --disable-nologin
                --disable-pylibmount
                --disable-raw
                --disable-vipw
                --enable-agetty
                --enable-bash-completion
                --enable-line
                --enable-partx
                --enable-rename
                --enable-rfkill
                --enable-schedutils
                --without-systemdsystemunitdir
                $(use_enable caps setpriv)
                $(use_enable cramfs)
                $(use_enable fdformat)
                $(use_enable hardlink)
                $(use_enable kill)
                $(use_enable logger)
                $(use_enable ncurses pg)
                $(use_enable su)
                $(use_enable tty-helpers mesg)
                $(use_enable tty-helpers wall)
                $(use_enable tty-helpers write)
                $(use_with cryptsetup)
              )
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
            }

            src_compile() {
              emake all
            }

            src_install() {
              emake DESTDIR="${D}" install

              # need the libs in /
              gen_usr_ldscript -a blkid fdisk mount smartcols uuid

              dodoc AUTHORS NEWS README* Documentation/{TODO,*.txt,releases/*}

              # e2fsprogs-libs didnt install .la files, and .pc work fine
              find "${ED}" -name "*.la" -delete || die

              if use pam ; then
                # See https://github.com/util-linux/util-linux/blob/master/Documentation/PAM-configuration.txt
                newpamd "${FILESDIR}/runuser.pamd" runuser
                newpamd "${FILESDIR}/runuser-l.pamd" runuser-l
                newpamd "${FILESDIR}/su-l.pamd" su-l
              fi

              if use su && ! use suid ; then
                # Always force suid su, even when USE=-suid, as su is useless
                # for the overwhelming-majority case without suid.
                # Users who wish to truly have a no-suid su can strip it out
                # via e.g. Portage's suidctl or some other hook.
                fperms u+s /bin/su
              fi

              # Bash completion for "runuser" command is provided by same file which
              # would also provide bash completion for "su" command. However, we don't
              # use "su" command from this package. This triggers a known QA warning
              # which we ignore for now to magically keep bash completion for "su"
              # command which shadow package does not provide.
            }

            pkg_postinst() {
              if ! use tty-helpers ; then
                elog "The mesg/wall/write tools have been disabled due to USE=-tty-helpers."
              fi

              if [[ -z ${REPLACING_VERSIONS} ]] ; then
                elog "The agetty util now clears the terminal by default. You"
                elog "might want to add --noclear to your /etc/inittab lines."
              fi
            }

    - util-linux-python:
        files_dir: util-linux
        github:
          user: util-linux
          repo: util-linux
          query: tags
        vars:
          desc: Python bindings for the util-linux libmount library
          homepage: https://www.kernel.org/pub/linux/utils/util-linux/
          license: LGPL-3+
          python_compat: python3+
          inherit:
            - autotools
            - toolchain-funcs
            - libtool
            - flag-o-matic
            - python-r1
            - multiprocessing
          rdepend: |
            ${PYTHON_DEPS}
            ~sys-apps/util-linux-{{ .Values.pv }}
          depend: |
            ${RDEPEND}
            virtual/os-headers
          bdepend: virtual/pkgconfig
          required_use: ${PYTHON_REQUIRED_USE}
          restrict: test
          body: |
            src_prepare() {
              default
              ./autogen.sh || die
              eautoreconf
            }

            python_configure() {
              local myeconfargs=(
                --disable-all-programs
                --disable-bash-completion
                --without-systemdsystemunitdir
                --with-python
                --enable-libblkid
                --enable-libmount
                --enable-pylibmount
              )
              mkdir "${BUILD_DIR}" || die
              pushd "${BUILD_DIR}" >/dev/null || die
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
              popd >/dev/null || die
            }

            python_compile() {
              pushd "${BUILD_DIR}" >/dev/null || die
              emake
              popd >/dev/null || die
            }

            python_install() {
              pushd "${BUILD_DIR}" >/dev/null || die
              emake DESTDIR="${D}" \
                install-pylibmountexecLTLIBRARIES \
                install-pylibmountexecPYTHON
              python_optimize
              popd >/dev/null || die
            }

            src_configure() {
              python_foreach_impl python_configure
            }

            src_compile() {
              python_foreach_impl python_compile
            }

            src_install() {
              python_foreach_impl python_install
              # The automake python install target pulls in the libmount and
              # libblkid install targets; those libraries belong to util-linux.
              find "${ED}"/usr/$(get_libdir) -maxdepth 1 \( -name 'libblkid.*' -o -name 'libmount.*' \) -delete || die
              find "${ED}" -name "*.la" -delete || die
            }

lz4:
  generator: builtin-github

  defaults:
    category: app-arch
    template: ../../templates/simple-github.tmpl
    github:
      user: lz4
      query: tags

  packages:
    - lz4:
        vars:
          desc: Extremely Fast Compression algorithm
          homepage: https://github.com/lz4/lz4
          license: 'BSD-2 GPL-2'
          slot: '0/1'
          iuse: static-libs
          inherit:
            - cmake
          body: |
            CMAKE_USE_DIR="${S}/build/cmake"

            src_configure() {
