    - gawk:
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          desc: GNU awk pattern-matching language
          homepage: https://www.gnu.org/software/gawk/gawk.html
          license: GPL-2
          iuse: mpfr nls readline
          inherit:
            - toolchain-funcs
          # xz-utils unpacks the .tar.xz distfile; bison regenerates the parser
          # if missing and texinfo builds the info pages; gettext is NLS-only
          bdepend: |
            app-arch/xz-utils
            >=sys-apps/texinfo-6.7
            >=sys-devel/bison-3.4.1
            nls? ( sys-devel/gettext )
          rdepend: |
            dev-libs/gmp:0=
            mpfr? ( dev-libs/mpfr:0= )
            readline? ( sys-libs/readline:0= )
          depend: '${RDEPEND}'
          body: |
            src_prepare() {
              default

              # use symlinks rather than hardlinks, and disable version links
              sed -i \
                -e '/^LN =/s:=.*:= $(LN_S):' \
                -e '/install-exec-hook:/s|$|\nfoo:|' \
                Makefile.in doc/Makefile.in || die
              sed -i '/^pty1:$/s|$|\n_pty1:|' test/Makefile.in || die
            }
            src_configure() {
              export ac_cv_libsigsegv=no
              local myeconfargs=(
                --libexec='$(libdir)/misc'
                $(use_with mpfr)
                $(use_enable nls)
                $(use_with readline)
              )
              econf "${myeconfargs[@]}"
            }
            src_install() {
              rm -rf README_d # automatic dodocs barfs
              default

              # Install headers
              insinto /usr/include/awk
              doins *.h
              rm "${ED}"/usr/include/awk/config.h || die
            }
            pkg_postinst() {
              # symlink creation here as the links do not belong to gawk, but to any awk
              local l
              for l in "${EROOT}"/usr/share/man/man1/gawk.1* "${EROOT}"/usr/bin/gawk ; do
                if [[ -e ${l} ]] && ! [[ -e ${l/gawk/awk} ]] ; then
                  ln -s "${l##*/}" "${l/gawk/awk}" || die
                fi
              done
              if ! [[ -e ${EROOT}/bin/awk ]] ; then
                ln -s "../usr/bin/gawk" "${EROOT}/bin/awk" || die
              fi
            }


