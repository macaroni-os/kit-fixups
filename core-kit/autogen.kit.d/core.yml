arch_dirlisting:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-arch

  packages:

    - ca-certificates:
        category: app-misc
        dir:
          url: http://ftp.debian.org/debian/pool/main/c/ca-certificates/
          matcher: "ca-certificates_.*_all.deb$"
        transform:
          - kind: string
            match: "ca-certificates_"
            replace: ""
          - kind: string
            match: "_all.deb"
            replace: ""
        vars:
          inherit:
            - unpacker
          desc: Common CA Certificates PEM files
          homepage: https://packages.debian.org/sid/ca-certificates
          license: MPL-1.1
          s: '${WORKDIR}'
          # debianutils: we run `run-parts`
          cdepend: |
            !app-misc/c_rehash
            sys-apps/debianutils
          bdepend: '${CDEPEND}'
          rdepend: '${CDEPEND}'
          body: |
            src_unpack() {
              # Do all the work in the image subdir to avoid conflicting with source
              # dirs in ${WORKDIR}.  Need to perform everything in the offset #381937
              mkdir -p "image/${EPREFIX}" || die
              cd "image/${EPREFIX}" || die

              unpacker_src_unpack
            }
            src_prepare() {
              cd "image/${EPREFIX}" || die
              default
              eapply -p2 "${FILESDIR}"/${PN}-20150426-root.patch
              local relp=$(echo "${EPREFIX}" | sed -e 's:[^/]\+:..:g')
              sed -i \
                -e '/="$ROOT/s:ROOT:ROOT'"${EPREFIX}"':' \
                -e '/RELPATH="\.\./s:"$:'"${relp}"'":' \
                usr/sbin/update-ca-certificates || die
            }
            src_compile() {
              cd "image/${EPREFIX}" || die
              mv usr/share/doc/{ca-certificates,${PF}} || die
              (
                echo "# Automatically generated by ${CATEGORY}/${PF}"
                echo "# $(date -u)"
                echo "# Do not edit."
                cd "usr/share/ca-certificates" || die
                find * -name '*.crt' | LC_ALL=C sort
              ) > etc/ca-certificates.conf

              sh usr/sbin/update-ca-certificates --root "${S}/image" || die
            }
            src_install() {
              cp -pPR image/* "${D}"/ || die
              echo 'CONFIG_PROTECT_MASK="/etc/ca-certificates.conf"' > 98ca-certificates
              doenvd 98ca-certificates
            }


    - sharutils:
        dir:
          url: https://ftp.gnu.org/gnu/sharutils/
          matcher: "sharutils-.*.tar.xz$"
        transform:
          - kind: string
            match: "sharutils-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        vars:
          desc: Tools to deal with shar archives
          homepage: https://www.gnu.org/software/sharutils/
          iuse: nls
          depend: |
            app-arch/xz-utils
            sys-apps/texinfo
            nls? ( sys-devel/gettext )
          inherit:
            - flag-o-matic
            - autotools
          patches:
            - sharutils-4.15.2-CVE-2018-1000097.patch
            - sharutils-4.15.2-gcc-10.patch
            - sharutils-4.15.2-glibc228.patch
          body: |
            src_prepare() {
              default
              append-cflags $(test-flags-CC -Wno-error=format-security)
              append-cflags -std=gnu17
              eautoreconf
            }

            src_configure() {
              econf $(use_enable nls)
            }



core_dirlisting:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps

  packages:

    - coreutils:
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: "{{ .Values.pn }}-.*.tar.xz$"
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
        vars:
          lib_depend:
            - use: 'acl'
              dep:
                - sys-apps/acl
              dep_use:
                - static-libs
            - use: 'caps'
              dep:
                - sys-libs/libcap
              dep_use:
                - static-libs
            - use: 'gmp'
              dep:
                - dev-libs/gmp:=
              dep_use:
                - static-libs
            - use: 'xattr'
              dep:
                - sys-apps/attr
              dep_use:
                - static-libs
            - use: 'openssl'
              dep:
                - dev-libs/openssl:=
              dep_use:
                - static-libs
          rdepend: |
            !static? (
              {{- range $p := .Values.lib_depend }}
                {{- if $p.use | default false }}
              {{ $p.use }}? (
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
                  {{ $d }}
                    {{- else }}
                  {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
                  {{ $d }}
                  {{- end }}
                  {{- end }}
              )
                {{- else }}
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
              {{ $d }}
                    {{- else }}
              {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
              {{ $d }}
                  {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
            )
            nls? ( virtual/libintl )
            hostname? ( !sys-apps/net-tools[hostname] )
            kill? (
              !sys-apps/util-linux[kill]
              !sys-process/procps[kill]
            )
            !<sys-apps/shadow-4.17.3
          depend: |
            !static? (
              {{- range $p := .Values.lib_depend }}
                {{- if $p.use | default false }}
              {{ $p.use }}? (
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
                  {{ $d }}
                    {{- else }}
                  {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
                  {{ $d }}
                  {{- end }}
                  {{- end }}
              )
                {{- else }}
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
              {{ $d }}
                    {{- else }}
              {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
              {{ $d }}
                  {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
            )
            static? (
              {{- range $p := .Values.lib_depend }}
                {{- if $p.use | default false }}
              {{ $p.use }}? (
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- $i = add1 $i }}
                      {{- if ( eq $i 1 ) }}
                        {{- $uses = $u }}
                      {{- else }}
                        {{- $uses = list $uses $u | join "," }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
                  {{ $d }}
                    {{- else }}
                  {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
                  {{ $d }}
                  {{- end }}
                  {{- end }}
              )
                {{- else }}
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- $i = add1 $i }}
                      {{- if ( eq $i 1 ) }}
                        {{- $uses = $u }}
                      {{- else }}
                        {{- $uses = list $uses $u | join "," }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
              {{ $d }}
                    {{- else }}
              {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
              {{ $d }}
                  {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
            )
          bdepend: |
            app-arch/xz-utils
            dev-lang/perl
          inherit:
            - flag-o-matic
            - toolchain-funcs
          license: GPL-3
          homepage: https://www.gnu.org/software/coreutils/
          desc: Standard GNU utilities (chmod, cp, dd, ls, sort, tr, head, wc, who,...)
          iuse: acl caps gmp hostname kill multicall nls +openssl +split-usr static xattr
          body: |
            src_prepare() {
              default
              set -- man/*.x
              touch ${@/%x/1} || die
              # Avoid perl dep for compiled in dircolors default (bug #348642)
              if ! has_version dev-lang/perl ; then
                touch src/dircolors.h || die
                touch ${@/%x/1} || die
              fi
            }
            src_configure() {
              local myconf=(
                --with-packager="MacaroniOS"
                --with-packager-version="{{ .Values.version }}"
                --with-packager-bug-reports="https://github.com/macaroni-os/mark-issues"
                # kill/uptime - procps
                # su          - shadow
                # hostname    - net-tools
                --enable-install-program="arch,$(usev hostname),$(usev kill)"
                --enable-no-install-program="$(usev !hostname),$(usev !kill),su,uptime"
                --enable-largefile
                $(usex caps '' --disable-libcap)
                $(use_enable nls)
                $(use_enable acl)
                $(use_enable multicall single-binary)
                $(use_enable xattr)
                $(use_with gmp libgmp)
                $(use_with openssl)
              )

              if use gmp ; then
                myconf+=( --with-libgmp-prefix="${ESYSROOT}"/usr )
              fi

              export gl_cv_func_mknod_works=yes

              if use static ; then
                append-ldflags -static
                # bug #321821
                sed -i '/elf_sys=yes/s:yes:no:' configure || die
              fi

              export ac_cv_{header_selinux_{context,flash,selinux}_h,search_setfilecon}=no
              econf "${myconf[@]}"
            }
            src_install() {
              default
              insinto /etc
              newins src/dircolors.hin DIR_COLORS
              if use split-usr ; then
                cd "${ED}"/usr/bin || die
                dodir /bin
                # Move critical binaries into /bin (required by FHS)
                local fhs="cat chgrp chmod chown cp date dd df echo false ln ls
                           mkdir mknod mv pwd rm rmdir stty sync true uname"
                mv ${fhs} ../../bin/ || die "Could not move FHS bins!"
                if use hostname ; then
                  mv hostname ../../bin/ || die
                fi
                if use kill ; then
                  mv kill ../../bin/ || die
                fi
                # Move critical binaries into /bin (common scripts)
                # (Why are these required for booting?)
                local com="basename chroot cut dir dirname du env expr head mkfifo
                           mktemp readlink seq sleep sort tail touch tr tty vdir wc yes"
                mv ${com} ../../bin/ || die "Could not move common bins!"

                # Create a symlink for uname in /usr/bin/ since autotools require it.
                # (Other than uname, we need to figure out why we are
                # creating symlinks for these in /usr/bin instead of leaving
                # the files there in the first place...)
                local x
                for x in ${com} uname ; do
                  dosym ../../bin/${x} /usr/bin/${x}
                done
              fi
            }

    - mime-types:
        category: app-misc
        dir:
          url: https://releases.pagure.org/mailcap/
          matcher: "mailcap-.*.tar.xz$"
        vars:
          homepage: https://pagure.io/mailcap
          desc: Provides /etc/mime.types file
          license: GPL-2
          s: "${WORKDIR}/mailcap-${PV}"
          body: |

            src_install() {
              insinto /etc
              doins mime.types
            }
        transform:
          - kind: string
            match: 'mailcap-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: "mailcap-{{ .Values.version }}.tar.xz"

    - which:
        vars:
          body: |

            src_configure() {
              append-lfs-flags
              tc-export AR
              default
            }

          inherit:
            - flag-o-matic
            - toolchain-funcs
          license: GPL-3
          homepage: https://carlowood.github.io/which/
          desc: Prints out location of specified executables that are in your path
        dir:
          url: https://gnuftp.mirror.garr.it/which/
          matcher: "which-.*.tar.gz$"
        transform:
          - kind: string
            match: 'which-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        assets:
          - name: "which-{{ .Values.version }}.tar.gz"

    - debianutils:
        vars:
          body: |
            src_prepare() {
              # Avoid adding po4a dependency, upstream refreshes manpages.
              sed -i -e '/SUBDIRS/s|po4a||' Makefile.am || die
              default
              eautoreconf
            }
            src_configure() {
              use static && append-ldflags -static
              default
            }

            src_install() {
              into /
              dobin tempfile run-parts
              if use installkernel ; then
                dosbin installkernel
              fi
              into /usr
              dobin ischroot
              dosbin savelog
              doman ischroot.1 tempfile.1 run-parts.8 savelog.8
              use installkernel && doman installkernel.8
              keepdir /etc/kernel/postinst.d
            }

          inherit:
            - autotools
            - flag-o-matic
          iuse: +installkernel static
          desc: A selection of tools from Debian
          homepage: https://packages.qa.debian.org/d/debianutils.html
          license: BSD GPL-2 SMAIL
          s: ${WORKDIR}/debianutils
        dir:
          url: http://ftp.it.debian.org/debian/pool/main/d/debianutils/
          matcher: "debianutils_.*.tar.xz$"
        transform:
          - kind: string
            match: 'debianutils_'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: "debianutils_{{ .Values.version }}.tar.xz"

    - autoconf-archive:
        category: sys-devel
        vars:
          rdepend: |
            !>=gnome-base/gnome-common-3.14.0-r1[-autoconf-archive(+)]
          license: GPL-3
          homepage: https://www.gnu.org/software/autoconf-archive/
          desc: GNU Autoconf Macro Archive
        dir:
          url: http://gnu.mirror.constant.com/autoconf-archive/
          matcher: "autoconf-archive-.*.tar.xz$"
        transform:
          - kind: string
            match: 'autoconf-archive-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"


    - gettext:
        category: sys-devel
        vars:
          body: |
            pkg_setup() {
              java-pkg-opt-2_pkg_setup
            }
            src_prepare() {
              java-pkg-opt-2_src_prepare
              default
              elibtoolize
            }
            src_configure() {
              local myconf=(
                # switches common to runtime and top-level
                --cache-file=${S}/config.cache
                # Emacs support is now in a separate package
                --without-emacs
                --without-lispdir
                # glib depends on us so avoid circular deps
                --with-included-glib
                # libcroco depends on glib which ... ^^^
                --with-included-libcroco
                # this will _disable_ libunistring (since it is not bundled),
                --with-included-libunistring
                # Never build libintl since it's in dev-libs/libintl now.
                --without-included-gettext
                # Never build bundled copy of libxml2.
                --without-included-libxml
                --disable-csharp
                --without-cvs
                $(use_enable acl)
                $(use_enable cxx c++)
                $(use_enable cxx libasprintf)
                $(use_with git)
                $(use_enable java)
                $(use_enable ncurses curses)
                $(use_enable nls)
                $(use_enable openmp)
                $(use_enable static-libs static)
                $(use_enable xattr attr)
              )
              local ECONF_SOURCE="${S}"
              econf "${myconf[@]}"
            }
            src_install() {
              emake DESTDIR="${D}" install
              dosym msgfmt /usr/bin/gmsgfmt # bug #43435
              dobin gettext-tools/misc/gettextize
              # 909041 never install libintl which upstream insists on building
              rm -f "${ED}"/usr/$(get_libdir)/libintl.* "${ED}"/usr/include/libintl.h
              find "${ED}" -type f -name "*.la" -delete || die
              if use java ; then
                java-pkg_dojar "${ED}"/usr/share/${PN}/*.jar
                rm "${ED}"/usr/share/${PN}/*.jar || die
                rm "${ED}"/usr/share/${PN}/*.class || die
                if use doc ; then
                  java-pkg_dojavadoc "${ED}"/usr/share/doc/${PF}/html/javadoc2
                fi
              fi
              dodoc AUTHORS ChangeLog NEWS README THANKS
              if use doc ; then
                docinto html
                dodoc "${ED}"/usr/share/doc/${PF}/*.html
              else
                rm -rf "${ED}"/usr/share/doc/${PF}/{csharpdoc,examples,javadoc2,javadoc1}
              fi
              rm "${ED}"/usr/share/doc/${PF}/*.html || die
            }
            pkg_preinst() {
              java-pkg-opt-2_pkg_preinst
            }

          depend: |
            virtual/libiconv
            virtual/libintl
            dev-libs/libxml2
            dev-libs/expat
            acl? ( virtual/acl )
            ncurses? ( sys-libs/ncurses )
            java? ( virtual/jdk )
          bdepend: |
            git? (  dev-vcs/git )
          pdepend: |
            emacs? ( app-emacs/po-mode )
          rdepend: |
            ${DEPEND}
            git? (  dev-vcs/git )
            java? ( virtual/jdk )
          inherit:
            - libtool
            - java-pkg-opt-2
          license: GPL-3+ cxx? ( LGPL-2.1+ )
          homepage: https://www.gnu.org/software/gettext/
          desc: GNU locale utilities
          iuse: acl -cvs +cxx doc emacs git java ncurses nls openmp static-libs xattr
        dir:
          url: https://ftp.gnu.org/pub/gnu/gettext/
          matcher: "gettext-.*.tar.xz$"
        transform:
          - kind: string
            match: 'gettext-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"

    - libcap-ng:
        category: sys-libs
        dir:
          url: https://people.redhat.com/sgrubb/libcap-ng/
          matcher: "libcap-ng-.*.tar.gz$"
        transform:
          - kind: string
            match: 'libcap-ng-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"

        vars:
          python_compat: python3+
          inherit:
            - autotools
            - flag-o-matic
            - python-r1
          rdepend: |
            python? ( ${PYTHON_DEPS} )
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
            python? ( dev-lang/swig )
          required_use: |
            python? ( ${PYTHON_REQUIRED_USE} )
          iuse: python static-libs
          license: LGPL-2.1
          homepage: https://people.redhat.com/sgrubb/libcap-ng/
          desc: POSIX 1003.1e capabilities
          body: |
            src_prepare() {
              # Apply patch from upstream
              sed -i -e '/^PYTHON = $(PYTHON)/d' bindings/python3/Makefile.am || die
              default
              eautoreconf
            }
            src_configure() {
              use sparc && replace-flags -O? -O0
              local ECONF_SOURCE="${S}"
              local myconf=(
                $(use_enable static-libs static)
                --with-capability_header="${ESYSROOT}"/usr/include/linux/capability.h
              )
              local pythonconf=( --without-python3 )
              if use python ; then
                setup_python_flags_configure() {
                  pythonconf=( --with-python3 )
                  run_in_build_dir econf "${pythonconf[@]}" "${myconf[@]}"
                }
                python_foreach_impl setup_python_flags_configure
              else
                local BUILD_DIR=${WORKDIR}/build
                run_in_build_dir econf "${pythonconf[@]}" "${myconf[@]}"
              fi
            }
            src_compile() {
              if use python; then
                python_foreach_impl run_in_build_dir emake
              else
                local BUILD_DIR=${WORKDIR}/build
                emake -C "${BUILD_DIR}"
              fi
            }
            src_install() {
              if use python; then
                python_foreach_impl run_in_build_dir emake DESTDIR="${D}" install
              else
                local BUILD_DIR=${WORKDIR}/build
                emake -C "${BUILD_DIR}" DESTDIR="${D}" install
              fi
              find "${ED}" -name '*.la' -delete || die
            }


libtools_pkgs:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-libs
    assets:
      - name: "libtool-{{ .Values.version }}.tar.xz"

  packages:
    - libltdl:
        vars:
          desc: A shared library tool for developers
          homepage: https://www.gnu.org/software/libtool/
          license: GPL-2
          iuse: static-libs
          s: "${WORKDIR}/libtool-${PV}/libltdl"
          body: |
            src_configure() {
              ECONF_SOURCE=${S}
              econf --enable-ltdl-install \
                $(use_enable static-libs static)
            }
            src_install() {
              emake DESTDIR="${D}" install
            }

        dir:
          url: https://ftp.wayne.edu/gnu/libtool/
          matcher: "libtool-.*.tar.xz$"
        transform:
          - kind: string
            match: 'libtool-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''


savannah_sys_apps_http:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    vars:
      license: LGPL-2.1
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"

  packages:
    - attr:
        vars:
          body: |

            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              unset PLATFORM
              export OPTIMIZER=${CFLAGS}
              export DEBUG=-DNDEBUG

              tc-ld-disable-gold

              local myeconfargs=(
                --bindir="${EPREFIX}"/bin
                --libexecdir="${EPREFIX}"/usr/$(get_libdir)
                --enable-shared
                $(use_enable static-libs static)
                $(use_enable nls)
                $(use_enable debug)
              )
              econf "${myeconfargs[@]}"
            }

            src_install() {
              emake DESTDIR="${D}" install

              # we install attr into /bin, so we need the shared lib with it
              gen_usr_ldscript -a attr

              # Add a wrapper until people upgrade.
              insinto /usr/include/attr
              newins "${FILESDIR}"/xattr-shim.h xattr.h

              if ! use static-libs; then
                find "${ED}" -name '*.la' -delete || die
              fi

              einstalldocs
            }

          depend: |
            nls? ( sys-devel/gettext )
          inherit:
            - libtool
            - toolchain-funcs
            - usr-ldscript
          homepage: https://savannah.nongnu.org/projects/attr
          desc: Extended attributes tools
          iuse: debug nls static-libs
        dir:
          url: http://download.savannah.nongnu.org/releases/attr/
          matcher: "attr-.*.tar.gz$"
        transform:
          - kind: string
            match: 'attr-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''

    - acl:
        vars:
          body: |

            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              local myeconfargs=(
                --bindir="${EPREFIX}"/bin
                --libexecdir="${EPREFIX}"/usr/$(get_libdir)
                $(use_enable static-libs static)
                $(use_enable nls)
              )
              econf "${myeconfargs[@]}"
            }

            src_install() {
              default

              gen_usr_ldscript -a acl

              use static-libs || prune_libtool_files --all
            }

          depend: |
            nls? ( sys-devel/gettext )
          homepage: https://savannah.nongnu.org/projects/acl
          desc: access control list utilities, libraries and headers
          iuse: nls static-libs
          inherit:
            - libtool
            - toolchain-funcs
            - usr-ldscript
            - ltprune
        dir:
          url: http://download.savannah.nongnu.org/releases/acl/
          matcher: "acl-.*.tar.gz$"
        transform:
          - kind: string
            match: 'acl-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''

sys_apps_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    vars:
      license: LGPL-2.1

  packages:

    - icu:
        category: dev-libs
        desc: 'International Components for Unicode'
        template: ../../templates/simple.tmpl
        github:
          user: unicode-org
        transform:
          - kind: string
            match: 'ICU '
            replace: ''
        assets:
          - name: '{{ .Values.pn }}4c-{{ .Values.version }}-sources.tgz'
            matcher: '{{ .Values.pn }}4c-.*-sources.tgz$'
        vars:
          license: BSD
          iuse: debug doc examples static-libs
          python_compat: python3+
          inherit:
            - autotools
            - flag-o-matic
            - python-any-r1
            - toolchain-funcs
          bdepend: |
            ${PYTHON_DEPS}
            sys-devel/autoconf-archive
            virtual/pkgconfig
            doc? ( app-doc/doxygen[dot] )
          s: '${WORKDIR}/{{ .Values.pn }}/source'
          body: |
            src_prepare() {
              default
              # Disable renaming as it is stupid thing to do
              sed -i \
                -e "s/#define U_DISABLE_RENAMING 0/#define U_DISABLE_RENAMING 1/" \
                common/unicode/uconfig.h || die
              # Fix linking of icudata
              sed -i \
                -e "s:LDFLAGSICUDT=-nodefaultlibs -nostdlib:LDFLAGSICUDT=:" \
                config/mh-linux || die
              # Append doxygen configuration to configure
              sed -i \
                -e 's:icudefs.mk:icudefs.mk Doxyfile:' \
                configure.ac || die
              eautoreconf
            }
            src_configure() {
              append-cxxflags -std=c++17
              local myeconfargs=(
                --disable-renaming
                --disable-samples
                --disable-layoutex
                $(use_enable debug)
                $(use_enable static-libs static)
                $(use_enable examples samples)
              )
              # icu tries to use clang by default
              tc-export CC CXX
              # make sure we configure with the same shell as we run icu-config
              # with, or ECHO_N, ECHO_T and ECHO_C will be wrongly defined
              export CONFIG_SHELL="${EPREFIX}/bin/sh"
              # probably have no /bin/sh in prefix-chain
              [[ -x ${CONFIG_SHELL} ]] || CONFIG_SHELL="${BASH}"
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
            }

    - shadow:
        github:
          user: shadow-maint
          # The release 4.17.4 is without name
          # and not catched correctly.
          query: tags
        vars:
          license: BSD GPL-2
        selector:
          - '>=4.17.0'
        exclude:
          - '-rc'
          # Ignore weird tags.
          - '^20'
          - '^19'

    - libffi:
        transform:
          - kind: string
            match: 'libffi '
            replace: ''
        template: ../../templates/simple.tmpl
        category: dev-libs
        github:
          user: libffi
          query: releases
        vars:
          inherit:
            - preserve-libs
          license: MIT
          iuse: debug exec-static-trampoline pax_kernel static-libs
          desc: Portable, high level programming interface to various calling conventions
          homepage: https://sourceware.org/libffi/ https://github.com/libffi/libffi/
          body: |
            src_configure() {
              ECONF_SOURCE="${S}" econf \
                --prefix="${EPREFIX}"/usr/ \
                --includedir="${EPREFIX}"/usr/$(get_libdir)/${PN}/include \
                --disable-multi-os-directory \
                $(use_enable static-libs static) \
                $(use_enable exec-static-trampoline exec-static-tramp) \
                $(use_enable pax_kernel pax_emutramp) \
                $(use_enable debug)
            }

            src_install() {
              einstalldocs
              emake DESTDIR="${D}" install
              find "${ED}" -name "*.la" -delete || die
            }
            pkg_preinst() {
              preserve_old_lib /usr/$(get_libdir)/libffi.so.7
            }
            pkg_postinst() {
              preserve_old_lib_notify /usr/$(get_libdir)/libffi.so.7
            }

        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
            matcher: "libffi-.*.tar.gz"


app_arch_github:
  generator: builtin-github
  defaults:
