arch_dirlisting:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-arch

  packages:

    - ca-certificates:
        category: app-misc
        dir:
          url: http://ftp.debian.org/debian/pool/main/c/ca-certificates/
          matcher: "ca-certificates_.*_all.deb$"
        transform:
          - kind: string
            match: "ca-certificates_"
            replace: ""
          # Support NMU (Non-Maintainer Upload) releases too
          - kind: string
            match: "+nmu"
            replace: "."
          - kind: string
            match: "_all.deb"
            replace: ""
        vars:
          inherit:
            - unpacker
          desc: Common CA Certificates PEM files
          homepage: https://packages.debian.org/sid/ca-certificates
          license: MPL-1.1
          s: '${WORKDIR}'
          # debianutils: we run `run-parts`
          cdepend: |
            !app-misc/c_rehash
            sys-apps/debianutils
          bdepend: '${CDEPEND}'
          rdepend: '${CDEPEND}'
          body: |
            src_unpack() {
              # Do all the work in the image subdir to avoid conflicting with source
              # dirs in ${WORKDIR}.  Need to perform everything in the offset #381937
              mkdir -p "image/${EPREFIX}" || die
              cd "image/${EPREFIX}" || die

              unpacker_src_unpack
            }
            src_prepare() {
              cd "image/${EPREFIX}" || die
              default
              eapply -p2 "${FILESDIR}"/${PN}-20150426-root.patch
              local relp=$(echo "${EPREFIX}" | sed -e 's:[^/]\+:..:g')
              sed -i \
                -e '/="$ROOT/s:ROOT:ROOT'"${EPREFIX}"':' \
                -e '/RELPATH="\.\./s:"$:'"${relp}"'":' \
                usr/sbin/update-ca-certificates || die
            }
            src_compile() {
              cd "image/${EPREFIX}" || die
              mv usr/share/doc/{ca-certificates,${PF}} || die
              (
                echo "# Automatically generated by ${CATEGORY}/${PF}"
                echo "# $(date -u)"
                echo "# Do not edit."
                cd "usr/share/ca-certificates" || die
                find * -name '*.crt' | LC_ALL=C sort
              ) > etc/ca-certificates.conf

              sh usr/sbin/update-ca-certificates --root "${S}/image" || die
            }
            src_install() {
              cp -pPR image/* "${D}"/ || die
              echo 'CONFIG_PROTECT_MASK="/etc/ca-certificates.conf"' > 98ca-certificates
              doenvd 98ca-certificates
            }


    - dpkg:
        # Keep the last dpkg release that works with the tree perl
        # (dev-lang/perl-5.32.0, perl-kit): dpkg >= 1.22 needs perl >= 5.32.1
        # and >= 1.23 needs perl >= 5.36.0 (m4/dpkg-progs.m4 of the release
        # tarballs). Maintainer decision (geaaru, kit-fixups#587,
        # 2026-11-15): keep the last version working with perl 5.32.0 via
        # the selector; lift the cap when the kit perl moves past 5.32.1.
        selector:
          - '<1.22'
        dir:
          url: http://deb.debian.org/debian/pool/main/d/dpkg/
          matcher: "dpkg_.*\\.tar\\.xz$"
        transform:
          - kind: string
            match: "dpkg_"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        vars:
          desc: Package maintenance system for Debian
          homepage: https://packages.qa.debian.org/dpkg
          license: GPL-2+
          iuse: +bzip2 +lzma nls selinux static-libs unicode +update-alternatives +zstd +zlib
          # perl coupling via subslot dep per maintainer review, kit-fixups#587
          rdepend: |
            dev-lang/perl:=
            app-crypt/libmd
            bzip2? ( app-arch/bzip2 )
            lzma? ( app-arch/xz-utils )
            nls? ( virtual/libintl )
            selinux? ( sys-libs/libselinux )
            zstd? ( app-arch/zstd )
            zlib? ( >=sys-libs/zlib-1.1.4 )
          depend: |
            ${RDEPEND}
            app-arch/xz-utils
            virtual/pkgconfig
            nls? (
              app-text/po4a
              >=sys-devel/gettext-0.18.2
            )
          inherit:
            - eutils
            - toolchain-funcs
          docs:
            - ChangeLog
            - THANKS
            - TODO
          body: |
            src_prepare() {
              use nls && strip-linguas -i po

              default
            }

            src_configure() {
              tc-export CC
              econf \
                $(use_enable nls) \
                $(use_enable static-libs static) \
                $(use_enable unicode) \
                $(use_enable update-alternatives) \
                $(use_with bzip2 libbz2) \
                $(use_with lzma liblzma) \
                $(use_with selinux libselinux) \
                $(use_with zstd libzstd) \
                $(use_with zlib libz) \
                --disable-compiler-warnings \
                --disable-compiler-optimizations \
                --disable-linker-optimizations \
                --disable-dselect \
                --disable-silent-rules \
                --disable-start-stop-daemon \
                --localstatedir=/var
            }

            src_compile() {
              emake AR=$(tc-getAR)
            }

            src_install() {
              default

              keepdir \
                /usr/$(get_libdir)/db/methods/{mnt,floppy,disk} \
                /var/lib/dpkg/{alternatives,info,parts,updates}

              find "${D}" -name '*.la' -type f -delete || die
            }

    - sharutils:
        dir:
          url: https://ftp.gnu.org/gnu/sharutils/
          matcher: "sharutils-.*.tar.xz$"
        transform:
          - kind: string
            match: "sharutils-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        vars:
          desc: Tools to deal with shar archives
          homepage: https://www.gnu.org/software/sharutils/
          iuse: nls
          depend: |
            app-arch/xz-utils
            sys-apps/texinfo
            nls? ( sys-devel/gettext )
          inherit:
            - flag-o-matic
            - autotools
          patches:
            - sharutils-4.15.2-CVE-2018-1000097.patch
            - sharutils-4.15.2-gcc-10.patch
            - sharutils-4.15.2-glibc228.patch
          body: |
            src_prepare() {
              default
              append-cflags $(test-flags-CC -Wno-error=format-security)
              append-cflags -std=gnu17
              eautoreconf
            }

            src_configure() {
              econf $(use_enable nls)
            }



core_dirlisting:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps

  packages:

    - bzip2:
        category: app-arch
        dir:
          url: 'https://sourceware.org/pub/{{ .Values.pn }}/'
          matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.gz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        vars:
          desc: Freely available, patent free, high-quality data compressor.
          homepage: https://sourceware.org/bzip2/
          license: BZIP2
          # HTML_DOCS renders as a top-level ebuild line via extra_envs
          # (consumed by einstalldocs); SLOT drops to the template default
          # 0 — no consumer pins the 0/1 subslot, only slot-agnostic
          # `app-arch/bzip2:0=` atoms exist in the tree corpora.
          extra_envs:
            - 'HTML_DOCS=( manual.html )'
          iuse: static static-libs
          inherit:
            - toolchain-funcs
            - autotools
            - usr-ldscript
          docs:
            - CHANGES
            - README{,.COMPILATION.PROBLEMS,.XML.STUFF}
            - manual.pdf
          # Upstream ships no configure/build system; the tree patches fix
          # flags, SONAME, man links, progress reporting and out-of-tree
          # builds and stay live exactly as in the tree PATCHES array.
          patches:
            - bzip2-1.0.4-makefile-CFLAGS.patch
            - bzip2-1.0.8-saneso.patch
            - bzip2-1.0.4-man-links.patch
            - bzip2-1.0.6-progress.patch
            - bzip2-1.0.3-no-test.patch
            - bzip2-1.0.8-mingw.patch
            - bzip2-1.0.8-out-of-tree-build.patch
          # body: tree-ebuild phases with the multilib-minimal wrappers
          # dropped (house stance: plain autotools, no multilib). bzip2 is a
          # plain-Makefile project, so there is no econf call: the Makefiles
          # are invoked through plain emake calls after tc-export CC AR
          # RANLIB, with VPATH kept inline (review round 3). The
          # multilib_src_compile/src_install/src_install_all phases become
          # src_compile/src_install, the native-ABI if-guard is dropped and
          # usr-ldscript/gen_usr_ldscript keep the installed layout (real
          # libbz2 in /lib64 + /usr/lib64 GNU ld script) byte-for-byte the
          # same file set as before. {{ .Values.pv }} keeps the libbz2.so
          # soname strings literal, the $pv_major/$pv_majmin render vars
          # replace the ${PV%%.*}/${PV%.*} shell expansions of the
          # for-loop symlink set. The template normalizes the 2-space
          # indentation to tabs at render time.
          body: |
            {{ $pv_major := first ( splitList "." .Values.pv ) }}
            {{ $pv_majmin := trimSuffix ( printf ".%s" ( last ( splitList "." .Values.pv ) ) ) .Values.pv }}

            src_prepare() {
              default

              # - Use right man path
              # - Generate symlinks instead of hardlinks
              # - pass custom variables to control libdir
              sed -i \
                -e 's:\$(PREFIX)/man:\$(PREFIX)/share/man:g' \
                -e 's:ln -s -f $(PREFIX)/bin/:ln -s -f :' \
                -e 's:$(PREFIX)/lib:$(PREFIX)/$(LIBDIR):g' \
                Makefile || die
            }

            src_compile() {
              # Toolchain vars exported at the top of src_compile (review
              # round 3); VPATH kept inline with emake — its impact for a
              # plain-Makefile project is deliberately unchanged.
              tc-export CC AR RANLIB
              emake VPATH="${S}" -f "${S}"/Makefile-libbz2_so all
              # Make sure we link against the shared lib
              ln -s libbz2.so.{{ .Values.pv }} libbz2.so || die
              emake VPATH="${S}" -f "${S}"/Makefile all LDFLAGS="${LDFLAGS} $(usex static -static '')"
            }

            src_install() {
              into /usr

              # Install the shared lib manually.  We install:
              #  .x.x.x - standard shared lib behavior
              #  .x.x   - SONAME some distros use
              #  .x     - SONAME MacaroniOS uses
              dolib.so libbz2.so.{{ .Values.pv }}
              local v
              for v in libbz2.so libbz2.so.{{ $pv_major }} libbz2.so.{{ $pv_majmin }} ; do
                dosym libbz2.so.{{ .Values.pv }} /usr/$(get_libdir)/${v}
              done
              use static-libs && dolib.a libbz2.a

              gen_usr_ldscript -a bz2

              dobin bzip2recover
              into /
              dobin bzip2

              # `make install` doesn't cope with out-of-tree builds, nor with
              # installing just non-binaries, so handle things ourselves.
              insinto /usr/include
              doins bzlib.h
              into /usr
              dobin bz{diff,grep,more}
              doman *.1

              dosym bzdiff /usr/bin/bzcmp
              dosym bzdiff.1 /usr/share/man/man1/bzcmp.1

              dosym bzmore /usr/bin/bzless
              dosym bzmore.1 /usr/share/man/man1/bzless.1

              local x
              for x in bunzip2 bzcat bzip2recover ; do
                dosym bzip2.1 /usr/share/man/man1/${x}.1
              done
              for x in bz{e,f}grep ; do
                dosym bzgrep /usr/bin/${x}
                dosym bzgrep.1 /usr/share/man/man1/${x}.1
              done

              einstalldocs

              # move "important" bzip2 binaries to /bin and use the shared libbz2.so
              dosym bzip2 /bin/bzcat
              dosym bzip2 /bin/bunzip2
            }
    - tar:
        category: app-arch
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: "{{ .Values.pn }}-.*.tar.xz$"
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        revision: 1
        vars:
          desc: Use this to make tarballs :)
          homepage: https://www.gnu.org/software/tar/
          license: GPL-3+
          iuse: acl minimal nls selinux userland_GNU xattr
          rdepend: |
            acl? ( virtual/acl )
            selinux? ( sys-libs/libselinux )
          depend: |
            ${RDEPEND}
            sys-apps/attr
          bdepend: |
            nls? ( sys-devel/gettext )
          patches:
            - tar-1.35-acl-2.4.0.patch
          body: |
            src_prepare() {
              default

              if ! use userland_GNU ; then
                sed -i \
                  -e 's:/backup\.sh:/gbackup.sh:' \
                  scripts/{backup,dump-remind,restore}.in \
                  || die "sed non-GNU"
              fi
            }
            src_configure() {
              export gl_cv_warn_c__fanalyzer=no

              local myeconfargs=(
                --bindir=/bin
                --enable-backup-scripts
                --libexecdir=/usr/sbin
                $(usex userland_GNU "" "--program-prefix=g")
                $(use_with acl posix-acls)
                $(use_enable nls)
                $(use_with selinux)
                $(use_with xattr xattrs)
              )
              FORCE_UNSAFE_CONFIGURE=1 econf "${myeconfargs[@]}"
            }
            src_install() {
              default

              local p=$(usex userland_GNU "" "g")
              if [[ -z ${p} ]] ; then
                exeinto /etc
                doexe "${FILESDIR}"/rmt
              fi

              # autoconf looks for gtar before tar (in configure scripts), hence
              # in Prefix it is important that it is there, otherwise, a gtar from
              # the host system (FreeBSD, Solaris, Darwin) will be found instead
              # of the Prefix provided (GNU) tar
              if use prefix ; then
                dosym tar /bin/gtar
              fi

              mv "${ED}"/usr/sbin/${p}backup{,-tar} || die
              mv "${ED}"/usr/sbin/${p}restore{,-tar} || die

              if use minimal ; then
                find "${ED}"/etc "${ED}"/*bin/ "${ED}"/usr/*bin/ \
                  -type f -a '!' '(' -name tar -o -name ${p}tar ')' \
                  -delete || die
              fi
            }


    - cpio:
        category: app-arch
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.bz2$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        vars:
          desc: A file archival tool which can also read and write tar files
          homepage: https://www.gnu.org/software/cpio/cpio.html
          license: GPL-3
          iuse: nls
          # 2.15 already contains the gcc-10 duplicate-declaration fix and the
          # CVE-2021-38185 rewrite (both tree patches reverse/fail with
          # patch -p1 --dry-run); it still needs the ATTRIB_PACKED fallback for
          # non-GNU compilers, which this patch applies (offset -1).
          patches:
            - cpio-2.12-non-gnu-compilers.patch
          body: |
            src_configure() {
              local myeconfargs=(
                $(use_enable nls)
                --bindir=/bin
                --with-rmt=/usr/sbin/rmt
              )
              econf "${myeconfargs[@]}"
            }

    - pax:
        category: app-arch
        # MirBSD has no GitHub/Forgejo repository: paxmirabilis ships as a flat
        # cpio.gz in a machine-readable dist listing, so builtin-dirlisting tracks
        # new releases automatically and selects the newest one (20240817 at
        # conversion time; the tree carried 20161104). The official
        # mbsd.evolvis.org mirror is used instead of www.mirbsd.org on purpose:
        # the primary host sends `Content-Encoding: x-gzip`, which the mark-devkit
        # Go HTTP client transparently decompresses, so its generated Manifest
        # would hash the decompressed cpio (625664 B) while portage fetches the
        # gzip (179245 B) and always fails the checksum. The mirror serves the
        # identical bytes as application/octet-stream and its TLS endpoint works
        # with current curl/OpenSSL.
        dir:
          url: 'https://mbsd.evolvis.org/MirOS/dist/mir/cpio/'
          matcher: 'paxmirabilis-[0-9]+\.cpio\.gz$'
        transform:
          - kind: string
            match: 'paxmirabilis-'
            replace: ''
          - kind: string
            match: '.cpio.gz'
            replace: ''
        # The tree's files/pax-20160306-glibc-to-linux.patch is NOT carried over:
        # upstream replaced those __GLIBC__ guards with HAVE_SETPGENT and all four
        # hunks fail `patch -p1 --dry-run` on 20240817. dev-libs/libbsd is dropped
        # as well - the 2024 sources bundle their own strmode/strtonum/reallocarray
        # compat layer (verified: ldd shows only libc.so.6).
        vars:
          desc: A POSIX standard archive tool
          homepage: https://www.mirbsd.org/pax.htm
          license: BSD
          inherit:
            - unpacker
            - toolchain-funcs
            - flag-o-matic
          # unpacker.eclass pipes the .cpio.gz through `gzip -dc | cpio`, so the
          # cpio binary is the only extra build-time tool (unpacker_src_uri_depends).
          bdepend: 'app-arch/cpio'
          # The cpio payload unpacks to ${WORKDIR}/pax, not ${WORKDIR}/${P}.
          s: '${WORKDIR}/{{ .Values.pn }}'
          body: |
            src_configure() {
              tc-export CC
              tc-getPROG SIZE size
            }

            # Upstream ships Build.sh, the supported way to build outside MirBSD;
            # it probes the libc feature set (the 2016 hand-frozen CPPFLAGS no
            # longer cover the 2024 sources) and also generates the man pages.
            src_compile() {
              sh ./Build.sh || die
            }

            src_install() {
              dobin pax
              doman pax.1

              dosym pax /usr/bin/paxcpio
              newman cpio.1 paxcpio.1

              dosym pax /usr/bin/paxtar
              newman tar.1 paxtar.1
    - dash:
        category: app-shells
        dir:
          url: 'http://gondor.apana.org.au/~herbert/dash/files/'
          matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.gz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        vars:
          desc: Debian Almquist Shell
          homepage: http://gondor.apana.org.au/~herbert/dash/
          license: BSD
          inherit:
            - flag-o-matic
            - toolchain-funcs
          iuse: libedit static
          bdepend: virtual/pkgconfig
          rdepend: |
            !static? ( libedit? ( dev-libs/libedit ) )
          depend: |
            ${RDEPEND}
            libedit? ( static? ( dev-libs/libedit[static-libs] ) )
          body: |
            src_prepare() {
              default

              # Use pkg-config for libedit linkage
              sed -i \
                -e "/LIBS/s:-ledit:\`$(tc-getPKG_CONFIG) --libs libedit $(usex static --static '')\`:" \
                configure || die
            }

            src_configure() {
              append-cppflags -DJOBS=$(usex libedit 1 0)
              use static && append-ldflags -static

              local myeconfargs=(
                CC_FOR_BUILD="$(tc-getBUILD_CC)"
                --bindir=/bin
                --enable-fnmatch
                $(use_with libedit)
              )
              econf "${myeconfargs[@]}"
            }

    - coreutils:
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: "{{ .Values.pn }}-.*.tar.xz$"
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
        vars:
          lib_depend:
            - use: 'acl'
              dep:
                - sys-apps/acl
              dep_use:
                - static-libs
            - use: 'caps'
              dep:
                - sys-libs/libcap
              dep_use:
                - static-libs
            - use: 'gmp'
              dep:
                - dev-libs/gmp:=
              dep_use:
                - static-libs
            - use: 'xattr'
              dep:
                - sys-apps/attr
              dep_use:
                - static-libs
            - use: 'openssl'
              dep:
                - dev-libs/openssl:=
              dep_use:
                - static-libs
          rdepend: |
            !static? (
              {{- range $p := .Values.lib_depend }}
                {{- if $p.use | default false }}
              {{ $p.use }}? (
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
                  {{ $d }}
                    {{- else }}
                  {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
                  {{ $d }}
                  {{- end }}
                  {{- end }}
              )
                {{- else }}
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
              {{ $d }}
                    {{- else }}
              {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
              {{ $d }}
                  {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
            )
            nls? ( virtual/libintl )
            hostname? ( !sys-apps/net-tools[hostname] )
            kill? (
              !sys-apps/util-linux[kill]
              !sys-process/procps[kill]
            )
            !<sys-apps/shadow-4.17.3
          depend: |
            !static? (
              {{- range $p := .Values.lib_depend }}
                {{- if $p.use | default false }}
              {{ $p.use }}? (
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
                  {{ $d }}
                    {{- else }}
                  {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
                  {{ $d }}
                  {{- end }}
                  {{- end }}
              )
                {{- else }}
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
              {{ $d }}
                    {{- else }}
              {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
              {{ $d }}
                  {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
            )
            static? (
              {{- range $p := .Values.lib_depend }}
                {{- if $p.use | default false }}
              {{ $p.use }}? (
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- $i = add1 $i }}
                      {{- if ( eq $i 1 ) }}
                        {{- $uses = $u }}
                      {{- else }}
                        {{- $uses = list $uses $u | join "," }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
                  {{ $d }}
                    {{- else }}
                  {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
                  {{ $d }}
                  {{- end }}
                  {{- end }}
              )
                {{- else }}
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- $i = add1 $i }}
                      {{- if ( eq $i 1 ) }}
                        {{- $uses = $u }}
                      {{- else }}
                        {{- $uses = list $uses $u | join "," }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
              {{ $d }}
                    {{- else }}
              {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
              {{ $d }}
                  {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
            )
          bdepend: |
            app-arch/xz-utils
            dev-lang/perl
          inherit:
            - flag-o-matic
            - toolchain-funcs
          license: GPL-3
          homepage: https://www.gnu.org/software/coreutils/
          desc: Standard GNU utilities (chmod, cp, dd, ls, sort, tr, head, wc, who,...)
          iuse: acl caps gmp hostname kill multicall nls +openssl +split-usr static xattr
          body: |
            src_prepare() {
              default
              set -- man/*.x
              touch ${@/%x/1} || die
              # Avoid perl dep for compiled in dircolors default (bug #348642)
              if ! has_version dev-lang/perl ; then
                touch src/dircolors.h || die
                touch ${@/%x/1} || die
              fi
            }
            src_configure() {
              local myconf=(
                --with-packager="MacaroniOS"
                --with-packager-version="{{ .Values.version }}"
                --with-packager-bug-reports="https://github.com/macaroni-os/mark-issues"
                # kill/uptime - procps
                # su          - shadow
                # hostname    - net-tools
                --enable-install-program="arch,$(usev hostname),$(usev kill)"
                --enable-no-install-program="$(usev !hostname),$(usev !kill),su,uptime"
                --enable-largefile
                $(usex caps '' --disable-libcap)
                $(use_enable nls)
                $(use_enable acl)
                $(use_enable multicall single-binary)
                $(use_enable xattr)
                $(use_with gmp libgmp)
                $(use_with openssl)
              )

              if use gmp ; then
                myconf+=( --with-libgmp-prefix="${ESYSROOT}"/usr )
              fi

              export gl_cv_func_mknod_works=yes

              if use static ; then
                append-ldflags -static
                # bug #321821
                sed -i '/elf_sys=yes/s:yes:no:' configure || die
              fi

              export ac_cv_{header_selinux_{context,flash,selinux}_h,search_setfilecon}=no
              econf "${myconf[@]}"
            }
            src_install() {
              default
              insinto /etc
              newins src/dircolors.hin DIR_COLORS
              if use split-usr ; then
                cd "${ED}"/usr/bin || die
                dodir /bin
                # Move critical binaries into /bin (required by FHS)
                local fhs="cat chgrp chmod chown cp date dd df echo false ln ls
                           mkdir mknod mv pwd rm rmdir stty sync true uname"
                mv ${fhs} ../../bin/ || die "Could not move FHS bins!"
                if use hostname ; then
                  mv hostname ../../bin/ || die
                fi
                if use kill ; then
                  mv kill ../../bin/ || die
                fi
                # Move critical binaries into /bin (common scripts)
                # (Why are these required for booting?)
                local com="basename chroot cut dir dirname du env expr head mkfifo
                           mktemp readlink seq sleep sort tail touch tr tty vdir wc yes"
                mv ${com} ../../bin/ || die "Could not move common bins!"

                # Create a symlink for uname in /usr/bin/ since autotools require it.
                # (Other than uname, we need to figure out why we are
                # creating symlinks for these in /usr/bin instead of leaving
                # the files there in the first place...)
                local x
                for x in ${com} uname ; do
                  dosym ../../bin/${x} /usr/bin/${x}
                done
              fi
            }

    - gzip:
        category: app-arch
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          desc: Standard GNU compressor
          homepage: https://www.gnu.org/software/gzip/
          license: GPL-3
          iuse: pic static
          inherit:
            - flag-o-matic
          body: |
            src_prepare() {
              # install symlinks
              sed -i -e 's/ln "$$source" "$$dest" || //' Makefile.in || die
              default
            }
            src_configure() {
              use static && append-flags -static
              # avoid text relocation in gzip
              use pic && export DEFS="NO_ASM"
              econf --disable-gcc-warnings
            }
            src_install() {
              default
              docinto txt
              dodoc algorithm.doc gzip.doc

              # keep most things in /usr, just the fun stuff in /
              dodir /bin
              mv "${ED}"/usr/bin/{gunzip,gzip,uncompress,zcat} "${ED}"/bin/ || die
              sed -e "s:/usr::" -i "${ED}"/bin/gunzip || die
            }

