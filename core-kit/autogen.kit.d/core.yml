    - gettext:
        category: sys-devel
        vars:
          body: |
            pkg_setup() {
              java-pkg-opt-2_pkg_setup
            }
            src_prepare() {
              java-pkg-opt-2_src_prepare
              default
              elibtoolize
            }
            src_configure() {
              local myconf=(
                # switches common to runtime and top-level
                --cache-file=${S}/config.cache
                # Emacs support is now in a separate package
                --without-emacs
                --without-lispdir
                # glib depends on us so avoid circular deps
                --with-included-glib
                # libcroco depends on glib which ... ^^^
                --with-included-libcroco
                # this will _disable_ libunistring (since it is not bundled),
                --with-included-libunistring
                # Never build libintl since it's in dev-libs/libintl now.
                --without-included-gettext
                # Never build bundled copy of libxml2.
                --without-included-libxml
                --disable-csharp
                --without-cvs
                $(use_enable acl)
                $(use_enable cxx c++)
                $(use_enable cxx libasprintf)
                $(use_with git)
                $(use_enable java)
                $(use_enable ncurses curses)
                $(use_enable nls)
                $(use_enable openmp)
                $(use_enable static-libs static)
                $(use_enable xattr attr)
              )
              local ECONF_SOURCE="${S}"
              econf "${myconf[@]}"
            }
            src_install() {
              emake DESTDIR="${D}" install
              dosym msgfmt /usr/bin/gmsgfmt # bug #43435
              dobin gettext-tools/misc/gettextize
              # 909041 never install libintl which upstream insists on building
              rm -f "${ED}"/usr/$(get_libdir)/libintl.* "${ED}"/usr/include/libintl.h
              find "${ED}" -type f -name "*.la" -delete || die
              if use java ; then
                java-pkg_dojar "${ED}"/usr/share/${PN}/*.jar
                rm "${ED}"/usr/share/${PN}/*.jar || die
                rm "${ED}"/usr/share/${PN}/*.class || die
                if use doc ; then
                  java-pkg_dojavadoc "${ED}"/usr/share/doc/${PF}/html/javadoc2
                fi
              fi
              dodoc AUTHORS ChangeLog NEWS README THANKS
              if use doc ; then
                docinto html
                dodoc "${ED}"/usr/share/doc/${PF}/*.html
              else
                rm -rf "${ED}"/usr/share/doc/${PF}/{csharpdoc,examples,javadoc2,javadoc1}
              fi
              rm "${ED}"/usr/share/doc/${PF}/*.html || die
            }
            pkg_preinst() {
              java-pkg-opt-2_pkg_preinst
            }

          depend: |
            virtual/libiconv
            virtual/libintl
            dev-libs/libxml2
            dev-libs/expat
            acl? ( virtual/acl )
            ncurses? ( sys-libs/ncurses )
            java? ( virtual/jdk )
          bdepend: |
            git? (  dev-vcs/git )
          pdepend: |
            emacs? ( app-emacs/po-mode )
          rdepend: |
            ${DEPEND}
            git? (  dev-vcs/git )
            java? ( virtual/jdk )
          inherit:
            - libtool
            - java-pkg-opt-2
          license: GPL-3+ cxx? ( LGPL-2.1+ )
          homepage: https://www.gnu.org/software/gettext/
          desc: GNU locale utilities
          iuse: acl -cvs +cxx doc emacs git java ncurses nls openmp static-libs xattr
        dir:
          url: https://ftp.gnu.org/pub/gnu/gettext/
          matcher: "gettext-.*.tar.xz$"
        transform:
          - kind: string
            match: 'gettext-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"

    # GNU serves libidn2 from the shared libidn/ directory, next to the
    # unrelated libidn-1.x line, .tar.xz/.tar.lz variants, detached .sig
    # proofs and a rolling libidn2-latest.tar.gz. The anchored matcher keeps
    # all of those out so the generator only ever selects a stable
    # libidn2-<ver>.tar.gz release (probed live: the newest is 2.3.8, also
    # the newest tag on https://gitlab.com/libidn/libidn2).
    - libidn2:
        category: net-dns
        dir:
          url: https://ftp.gnu.org/gnu/libidn/
          matcher: '^libidn2-[0-9]+(\.[0-9]+)+\.tar\.gz$'
        transform:
          - kind: string
            match: 'libidn2-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        vars:
          desc: An implementation of the IDNA2008 specifications (RFCs 5890, 5891, 5892, 5893)
          homepage: https://www.gnu.org/software/libidn/#libidn2 https://gitlab.com/libidn/libidn2
          license: GPL-2+ LGPL-3+
          slot: '0/2'
          iuse: static-libs
          inherit:
            - toolchain-funcs
          rdepend: |
            dev-libs/libunistring
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-lang/perl
            sys-apps/help2man
          body: |
            src_configure() {
              econf \
                CC_FOR_BUILD="$(tc-getBUILD_CC)" \
                $(use_enable static-libs static) \
                --disable-doc \
                --disable-gcc-warnings \
                --disable-gtk-doc
            }

            src_install() {
              default
              find "${D}" -name '*.la' -delete || die
            }

    - libcap-ng:
        category: sys-libs
        dir:
          url: https://people.redhat.com/sgrubb/libcap-ng/
          matcher: "libcap-ng-.*.tar.gz$"
        transform:
          - kind: string
            match: 'libcap-ng-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"

        vars:
          python_compat: python3+
          inherit:
            - autotools
            - flag-o-matic
            - python-r1
          rdepend: |
            python? ( ${PYTHON_DEPS} )
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
            python? ( dev-lang/swig )
          required_use: |
            python? ( ${PYTHON_REQUIRED_USE} )
          iuse: python static-libs
          license: LGPL-2.1
          homepage: https://people.redhat.com/sgrubb/libcap-ng/
          desc: POSIX 1003.1e capabilities
          body: |
            src_prepare() {
              # Apply patch from upstream
              sed -i -e '/^PYTHON = $(PYTHON)/d' bindings/python3/Makefile.am || die
              default
              eautoreconf
            }
            src_configure() {
              use sparc && replace-flags -O? -O0
              local ECONF_SOURCE="${S}"
              local myconf=(
                $(use_enable static-libs static)
                --with-capability_header="${ESYSROOT}"/usr/include/linux/capability.h
              )
              local pythonconf=( --without-python3 )
              if use python ; then
                setup_python_flags_configure() {
                  pythonconf=( --with-python3 )
                  run_in_build_dir econf "${pythonconf[@]}" "${myconf[@]}"
                }
                python_foreach_impl setup_python_flags_configure
              else
                local BUILD_DIR=${WORKDIR}/build
                run_in_build_dir econf "${pythonconf[@]}" "${myconf[@]}"
              fi
            }
            src_compile() {
              if use python; then
                python_foreach_impl run_in_build_dir emake
              else
                local BUILD_DIR=${WORKDIR}/build
                emake -C "${BUILD_DIR}"
              fi
            }
            src_install() {
              if use python; then
                python_foreach_impl run_in_build_dir emake DESTDIR="${D}" install
              else
                local BUILD_DIR=${WORKDIR}/build
                emake -C "${BUILD_DIR}" DESTDIR="${D}" install
              fi
              find "${ED}" -name '*.la' -delete || die
            }

    # RAR is proprietary freeware shipped by rarlab.com as PREBUILT Linux
    # binaries: there is no source release, so this entry tracks the binary
    # drop and the ebuild only installs the unpacked files.
    - rar:
        category: app-arch
        # rarlab serves no directory listing (https://www.rarlab.com/rar/
        # answers 403), but its download page is parseable HTML that links the
        # current drops. Drop names carry a three-digit version
        # (rarlinux-x64-723.tar.gz is 7.23) and beta drops a b suffix
        # (rarlinux-x64-730b2.tar.gz); the matcher excludes those, and a
        # negative probe with a b-only matcher proves the beta link is on the
        # page (the run reaches it and stops with "No versions found").
        dir:
          url: 'https://www.rarlab.com/download.htm'
          matcher: 'rarlinux-x64-[0-9]+\.tar\.gz$'
        transform:
          - kind: regex
            match: '^rarlinux-x64-([0-9]+)\.tar\.gz$'
            replace: '$1'
          - kind: regex
            match: '^([0-9])([0-9]+)$'
            replace: '${1}.${2}'
        vars:
          desc: RAR compressor/uncompressor
          homepage: https://rarlab.com/
          license: RAR BSD BSD-2
          # Only the x64 Linux drop exists upstream: the 32-bit
          # rarlinux-<ver>.tar.gz is gone (404 since the 7.x line).
          keywords: '-* ~amd64'
          restrict: bindist
          rdepend: 'sys-libs/glibc'
          # The tarball unpacks into ${WORKDIR}/rar, without a versioned dir.
          s: '${WORKDIR}/{{ .Values.pn }}'
          # Prebuilt and already stripped: the same QA exemptions the tree
          # ebuild declared.
          extra_envs:
            - 'QA_FLAGS_IGNORED="opt/rar/rar opt/rar/unrar"'
            - 'QA_PRESTRIPPED="opt/rar/rar opt/rar/unrar"'
          body: |
            src_compile() { :; }

            src_prepare() {
              default
              rm -f license.txt || die
            }

            src_install() {
              exeinto /opt/rar
              doexe rar unrar || die

              dodir /opt/bin
              dosym ../rar/rar /opt/bin/rar || die
              dosym ../rar/unrar /opt/bin/unrar || die

              insinto /opt/rar
              doins default.sfx rarfiles.lst || die
              dodoc *.txt
            }


    - findutils:
        dir:
          url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
          matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          desc: GNU utilities for finding files
          homepage: https://www.gnu.org/software/findutils/
          license: GPL-3+
          iuse: nls selinux static
          inherit:
            - flag-o-matic
          rdepend: |
            selinux? ( sys-libs/libselinux )
            nls? ( virtual/libintl )
          depend: '${RDEPEND}'
          # xz-utils unpacks the .tar.xz distfile; gettext is only needed with NLS on
          bdepend: |
            app-arch/xz-utils
            nls? ( sys-devel/gettext )
          body: |
            pkg_setup() {
              # enable long file name support for getcwd()
              export gl_cv_func_getcwd_path_max=yes
            }
            src_prepare() {
              # Don't build or install locate because it conflicts with mlocate,
              # which is a secure version of locate.
              sed \
                -e '/^SUBDIRS/s@locate@@' \
                -e '/^built_programs/s@ frcode locate updatedb@@' \
                -i Makefile.in || die

              default
            }
            src_configure() {
              if use static; then
                append-flags -pthread
                append-ldflags -static
              fi

              program_prefix=$(usex userland_GNU '' g)
              local myeconfargs=(
                --with-packager="MacaroniOS"
                --with-packager-version="{{ .Values.pv }}"
                --with-packager-bug-reports="https://github.com/macaroni-os/mark-issues/issues"
                --program-prefix=${program_prefix}
                $(use_enable nls)
                $(use_with selinux)
                --libexecdir='$(libdir)'/find
              )
              econf "${myeconfargs[@]}"
            }
            src_compile() {
              # We don't build locate, but the docs want a file in there.
              emake -C locate dblocation.texi
              default
            }

unzip:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-arch
    # Info-ZIP upstream is dormant (the 6.0 sources date from 2009), so the
    # only thing that moves is Debian's patch set: the pool names it
    # `unzip_6.0-NN.debian.tar.xz` and the `_pNN` version suffix tracks that
    # Debian patch revision, not an upstream release. A new Debian revision
    # therefore bumps the package automatically.
    # `+debXXuN` names are stable-branch updates of an already published
    # revision; their patch stacks differ from the same `-NN` uploaded to
    # unstable, so they are skipped instead of being mapped onto `_pNN`.
    dir:
      url: 'https://ftp.debian.org/debian/pool/main/u/unzip/'
      matcher: 'unzip_6\.0-[0-9]+\.debian\.tar\.xz$'
    transform:
      - kind: regex
        match: '^unzip_6\.0-([0-9]+)\.debian\.tar\.xz$'
        replace: '6.0_p$1'
    # A non-empty `assets:` list must repeat the tracked artefact first
    # (mark-devkit does not keep it implicitly); the Debian file name is
    # re-derived from `pv` because the distfile keeps its upstream name.
    assets:
      - name: 'unzip_6.0-{{ .Values.pv | replace "6.0_p" "" }}.debian.tar.xz'
      - name: 'unzip60.tar.gz'
        url: 'https://downloads.sourceforge.net/infozip/unzip60.tar.gz'
    vars:
      desc: unzipper for pkzip-compressed files
      homepage: https://www.info-zip.org/
      license: Info-ZIP
      iuse: bzip2 natspec unicode
      inherit:
        - flag-o-matic
        - toolchain-funcs
      # The Debian patch tarball unpacks into ${WORKDIR}/debian, next to the
      # Info-ZIP sources in ${WORKDIR}/unzip60.
      s: '${WORKDIR}/unzip60'
      # simple.tmpl emits RDEPEND before DEPEND, so the shared dependency
      # list lives on the RDEPEND side and DEPEND points at it.
      rdepend: |
        bzip2? ( app-arch/bzip2 )
        natspec? ( dev-libs/libnatspec )
      depend: '${RDEPEND}'
      patches:
        - unzip-6.0-no-exec-stack.patch
        - unzip-6.0-format-security.patch
        - unzip-6.0-fix-false-overlap-detection-on-32bit-systems.patch
      body: |
        src_prepare() {
          # debian/patches/series is Debian's canonical application order and
          # is the only correct one from revision 31 on, where the patch file
          # names lost their numeric prefix (globbing them applies patches out
          # of order and fails on process.c/extract.c). All four hunks of the
          # local patch set still apply on top (verified with
          # patch -p1 --dry-run on both revisions).
          local deb="${WORKDIR}/debian/patches" p
          while read -r p; do
            [[ -n "${p}" ]] || continue
            [[ "${p}" == *this-is-debian-unzip.patch ]] && continue
            eapply "${deb}/${p}"
          done < "${deb}/series"

          default

          # natspec support is a patch rather than an upstream option: it
          # includes natspec.h and links libnatspec unconditionally, so it
          # must stay behind the USE flag.
          use natspec && eapply "${FILESDIR}"/unzip-6.0-natspec.patch

          sed -i -r \
            -e '/^CFLAGS/d' \
            -e '/CFLAGS/s:-O[0-9]?:$(CFLAGS) $(CPPFLAGS):' \
            -e '/^STRIP/s:=.*:=true:' \
            -e "s:\<CC *= *\"?g?cc2?\"?\>:CC=\"$(tc-getCC)\":" \
            -e "s:\<LD *= *\"?(g?cc2?|ld)\"?\>:LD=\"$(tc-getCC)\":" \
            -e "s:\<AS *= *\"?(g?cc2?|as)\"?\>:AS=\"$(tc-getCC)\":" \
            -e 's:LF2 = -s:LF2 = :' \
            -e 's:LF = :LF = $(LDFLAGS) :' \
            -e 's:SL = :SL = $(LDFLAGS) :' \
            -e 's:FL = :FL = $(LDFLAGS) :' \
            -e "/^#L_BZ2/s:^$(use bzip2 && echo .)::" \
            -e 's:$(AS) :$(AS) $(ASFLAGS) :g' \
            unix/Makefile \
            || die "sed unix/Makefile failed"

          # Delete bundled code to make sure we don't use it.
          rm -r bzip2 || die
        }

        src_configure() {
          # Mark builds a single native ABI (no multilib), so the tree's
          # get_abi_CFLAGS-based ASFLAGS plumbing and the non-Linux TARGETs
          # are dropped with it.
          case ${CHOST} in
            i?86*-*linux*) TARGET="linux_asm" ;;
            *linux*)       TARGET="linux_noasm" ;;
            *) die "Unsupported CHOST ${CHOST}: only Linux targets are supported" ;;
          esac

          append-cppflags -DNO_LCHMOD -DLARGE_FILE_SUPPORT
          use bzip2 && append-cppflags -DUSE_BZIP2
          use unicode && append-cppflags -DUNICODE_SUPPORT -DUNICODE_WCHAR -DUTF8_MAYBE_NATIVE -DUSE_ICONV_MAPPING
        }

        src_compile() {
          emake -f unix/Makefile ${TARGET}
        }

        src_install() {
          dobin unzip funzip unzipsfx unix/zipgrep
          dosym unzip /usr/bin/zipinfo
          doman man/*.1
          dodoc BUGS History* README ToDo WHERE
        }

  packages:
    - unzip:

libtools_pkgs:
