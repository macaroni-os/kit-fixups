zsh:
  # zsh.org/pub carries the official release tarballs, which ship the
  # pre-generated Doc/zshall.1 man page that src_prepare rewrites with soelim.
  # The zsh-users/zsh tag archives are cut from git and lack both configure
  # and Doc/zshall.1 (verified with `tar tf`), so builtin-github cannot be
  # used for the source; the pub/ directory listing tracks the same releases.
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-shells

  packages:

    - zsh:
        dir:
          url: https://www.zsh.org/pub/
          matcher: '^zsh-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.xz$'
        transform:
          - kind: string
            match: "zsh-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        # The main release tarball must be listed first: once assets are
        # declared the generator does not re-add it implicitly.
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
          - name: "{{ .Values.pn }}-{{ .Values.version }}-doc.tar.xz"
            url: "https://www.zsh.org/pub/zsh-{{ .Values.version }}-doc.tar.xz"
            use: doc
        vars:
          desc: UNIX Shell similar to the Korn shell
          homepage: https://www.zsh.org/
          license: "ZSH gdbm? ( GPL-2 )"
          slot: "0"
          iuse: caps debug doc examples gdbm maildir pcre static unicode
          patches:
            - zsh-5.7.1-ncurses_colors.patch
            - zsh-5.3-init.d-gentoo.diff
          inherit:
            - autotools
            - flag-o-matic
          rdepend: |
            >=sys-libs/ncurses-5.1:0=
            static? ( >=sys-libs/ncurses-5.7-r4:0=[static-libs] )
            caps? ( sys-libs/libcap )
            pcre? (
              >=dev-libs/libpcre-3.9
              static? ( >=dev-libs/libpcre-3.9[static-libs] )
            )
            gdbm? ( sys-libs/gdbm:= )
            !<sys-apps/baselayout-2.4.1
          depend: |
            ${RDEPEND}
            sys-apps/groff
          pdepend: examples? ( app-doc/zsh-lovers )
          body: |
            src_prepare() {
              # fix zshall problem with soelim
              ln -s Doc man1 || die
              mv Doc/zshall.1 Doc/zshall.1.soelim || die
              soelim Doc/zshall.1.soelim > Doc/zshall.1 || die

              default
              eautoreconf
            }

            src_configure() {
              local myconf=(
                --bindir="/bin"
                --libdir="/usr/$(get_libdir)"
                --enable-etcdir="/etc/zsh"
                --enable-runhelpdir="/usr/share/zsh/{{ .Values.pv }}/help"
                --enable-fndir="/usr/share/zsh/{{ .Values.pv }}/functions"
                --enable-site-fndir="/usr/share/zsh/site-functions"
                --enable-function-subdirs
                --with-tcsetpgrp
                --with-term-lib="$(usex unicode 'tinfow ncursesw' 'tinfo ncurses')"
                $(use_enable maildir maildir-support)
                $(use_enable pcre)
                $(use_enable caps cap)
                $(use_enable unicode multibyte)
                $(use_enable gdbm)
              )

              if use static ; then
                myconf+=( --disable-dynamic )
                append-ldflags -static
              fi
              if use debug ; then
                myconf+=(
                  --enable-zsh-debug
                  --enable-zsh-mem-debug
                  --enable-zsh-mem-warning
                  --enable-zsh-secure-free
                  --enable-zsh-hash-debug
                )
              fi

              econf "${myconf[@]}"

              if use static ; then
                # compile all modules statically
                # removed cap and curses because linking fails
                sed -e "s,link=no,link=static,g" \
                  -e "/^name=zsh\/cap/s,link=static,link=no," \
                  -e "/^name=zsh\/curses/s,link=static,link=no," \
                  -i "${S}"/config.modules || die
                if ! use gdbm ; then
                  sed -i '/^name=zsh\/db\/gdbm/s,link=static,link=no,' \
                    "${S}"/config.modules || die
                fi
              fi
            }

            src_test() {
              addpredict /dev/ptmx
              local i
              for i in C02cond.ztst V08zpty.ztst X02zlevi.ztst Y01completion.ztst Y02compmatch.ztst Y03arguments.ztst ; do
                rm "${S}"/Test/${i} || die
              done
              emake check
            }

            src_install() {
              emake DESTDIR="${D}" install $(usex doc "install.info" "")

              insinto /etc/zsh
              newins "${FILESDIR}"/zprofile-4 zprofile

              keepdir /usr/share/zsh/site-functions
              insinto /usr/share/zsh/{{ .Values.pv }}/functions/Prompts
              newins "${FILESDIR}"/prompt_gentoo_setup-1 prompt_gentoo_setup

              local i

              # install miscellaneous scripts
              sed -e "s:/usr/local/bin/perl:/usr/bin/perl:g" \
                -e "s:/usr/local/bin/zsh:/bin/zsh:g" \
                -i {Util,Misc}/* || die
              for i in Util Misc ; do
                insinto /usr/share/zsh/{{ .Values.pv }}/${i}
                doins ${i}/*
              done

              # install header files
              insinto /usr/include/zsh
              doins config.h Src/*.epro
              for i in Src/{zsh.mdh,*.h} ; do
                sed -e 's@\.\./config\.h@config.h@' \
                  -e 's@#\(\s*\)include "\([^"]\+\)"@#\1include <zsh/\2>@' \
                  -i "${i}"
                doins "${i}"
              done

              dodoc ChangeLog* META-FAQ NEWS README config.modules

              if use doc ; then
                pushd "${WORKDIR}/${P}" >/dev/null || die
                dodoc Doc/zsh.{dvi,pdf}
                docinto html
                dodoc Doc/*.html
                popd >/dev/null || die
              fi

              docinto StartupFiles
              dodoc StartupFiles/z*
            }

            pkg_postinst() {
              if [[ -z ${REPLACING_VERSIONS} ]] ; then
                echo
                elog "If you want to enable Portage completions and the Gentoo prompt,"
                elog "emerge app-shells/gentoo-zsh-completions and add"
                elog "	autoload -U compinit promptinit"
                elog "	compinit"
                elog "	promptinit; prompt gentoo"
                elog "to your ~/.zshrc"
                echo
                elog "Also, if you want to enable cache for the completions, add"
                elog "	zstyle ':completion::complete:*' use-cache 1"
                elog "to your ~/.zshrc"
                echo
                elog "Note that a system zprofile startup file is installed. This will override"
                elog "PATH and possibly other variables that a user may set in ~/.zshenv."
                elog "Custom PATH settings and similar overridden variables can be moved to ~/.zprofile"
                elog "or other user startup files that are sourced after the system zprofile."
                echo
                elog "If PATH must be set in ~/.zshenv to affect things like non-login ssh shells,"
                elog "one method is to use a separate path-setting file that is conditionally sourced"
                elog "in ~/.zshenv and also sourced from ~/.zprofile. For more information, see the"
                elog "zshenv example in ${EROOT}/usr/share/doc/${PF}/StartupFiles/."
                echo
                elog "See https://wiki.gentoo.org/wiki/Zsh/HOWTO for more introduction documentation."
                echo
              fi
            }

locale_gen:
  generator: builtin-github
  defaults:
    category: sys-apps
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      user: gentoo
      repo: locale-gen
      query: tags
    selector:
      - '<3.0'
    transform:
      - kind: string
        match: "{{ .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.bz2"
        replace: ""
    vars:
      desc: 'Generate locales based upon the config file /etc/locale.gen'
      homepage: 'https://gitweb.gentoo.org/proj/locale-gen.git/ https://github.com/gentoo/locale-gen'
      rdepend: |
        app-shells/bash
        >=sys-libs/glibc-2.41
      depend: '${RDEPEND}'
      body: |
        src_install() {
          dosbin locale-gen
          doman *.[0-8]
          insinto /etc
          doins locale.gen
          keepdir /usr/lib/locale
        }

  packages:
    - locale-gen:


elfutils:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-libs
    dir:
      url: https://sourceware.org/elfutils/ftp
      matcher: "^0[.0-9]+"
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://sourceware.org/elfutils/ftp/{{ .Values.version }}/{{ .Values.pn }}-{{ .Values.pv }}.tar.bz2'

    vars:
      inherit:
        - autotools
        - flag-o-matic
      desc: Libraries/utilities to handle ELF objects (drop in replacement for libelf)
      homepage: https://sourceware.org/elfutils/
      license: '|| ( GPL-2+ LGPL-3+ ) utils? ( GPL-3+ )'
      iuse: bzip2 debuginfod libarchive lzma nls static-libs +threads +utils valgrind zstd
      rdepend: |
        sys-libs/zlib[static-libs?]
        bzip2? ( app-arch/bzip2[static-libs?] )
        lzma? ( app-arch/xz-utils[static-libs?] )
        zstd? ( app-arch/zstd:=[static-libs?] )
        debuginfod? (
          dev-db/sqlite:3=
          dev-libs/json-c:=
          net-libs/libmicrohttpd:=
          net-misc/curl[static-libs?]
        )
        libarchive? ( app-arch/libarchive:= )

      depend: |
        ${RDEPEND}
        valgrind? ( dev-util/valgrind )
      bdepend: |
        sys-devel/flex
        sys-devel/m4
        nls? ( sys-devel/gettext )
      required_use: |
        debuginfod? ( libarchive )
      body: |
        src_prepare() {
          default
          eautoreconf
          if ! use static-libs; then
            sed -i -e '/^lib_LIBRARIES/s:=.*:=:' -e '/^%.os/s:%.o$::' lib{asm,dw,elf}/Makefile.in || die
          fi
          # https://sourceware.org/PR23914
          sed -i 's:-Werror::' */Makefile.in || die
        }
        src_configure() {
          unset LEX YACC

          local myeconfargs=(
            $(use_enable nls)
            $(use_enable debuginfod)
            $(use_enable debuginfod libdebuginfod)
            $(use_enable valgrind valgrind-annotations)
            $(use_enable threads thread-safety)
            # Valgrind option is just for running tests under it; dodgy under sandbox
            # and indeed even w/ glibc with newer instructions.
            --disable-valgrind
            --program-prefix="eu-"
            --with-zlib
            $(use_with bzip2 bzlib)
            $(use_with libarchive)
            $(use_with lzma)
            $(use_with zstd)

          )
          # Valgrind option is just for running tests under it; dodgy under sandbox
          # and indeed even w/ glibc with newer instructions.
          #
          ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
        }
        src_install() {
          default
          einstalldocs
          dodoc NOTES
          # These build quick, and are needed for most tests, so don't
          # disable their building when the USE flag is disabled.
          if ! use utils; then
            rm -rf "${ED}"/usr/bin || die
          fi
        }

  packages:

    - elfutils:

zlib_ng:
  generator: builtin-github

  defaults:
    category: sys-libs
    template: ../../templates/simple-github.tmpl
    github:
      user: zlib-ng
      # Upstream publishes only prebuilt Windows binaries as release assets, so
      # the source is the generator's api.github.com tarball and
      # simple-github.tmpl moves its <user>-<repo>-<sha> unpack root into ${S}.
      query: releases
      # The tag of each release is cross-checked against the tags endpoint,
      # whose page size is 30: 2.3.3 only shows up on page 3 (the first pages
      # are filled with old version-sorting tags). The generator walks
      # num_pages - 1 pages: 6 covers the current 109 tags with room to grow.
      num_pages: 6
    transform:
      # Release titles sometimes carry a suffix ("2.3.2 - Hotfix").
      - kind: string
        match: " - Hotfix"
        replace: ""

  packages:
    - zlib-ng:
        vars:
          desc: "zlib replacement with optimizations for 'next generation' systems."
          homepage: https://github.com/zlib-ng/zlib-ng
          license: ZLIB
          inherit:
            - cmake
          # The supported cpu_flags_* surface lives in one variable and is
          # rendered into IUSE with the template (media-kit pattern), not
          # expanded at bash level.
          # cpu_flags_x86_sse4a is the flag that used to drive the old
          # WITH_SSE4 switch (renamed WITH_SSE42 in zlib-ng 2.1).
          cpu_flags:
            - x86_avx2
            - x86_sse2
            - x86_ssse3
            - x86_sse4a
            - x86_pclmul
            - arm_crc32
            - arm_neon
            - ppc_vsx2
          iuse: |
            compat
            {{- range $f := .Values.cpu_flags }}
            cpu_flags_{{ $f }}
            {{- end }}
          # The compat build replaces the system zlib.
          rdepend: 'compat? ( !sys-libs/zlib )'
          # zlib-ng 2.3 only builds its gtest suite for static builds and the
          # cmake eclass always sets BUILD_SHARED_LIBS=ON, so upstream disables
          # WITH_GTEST itself and the remaining ctest suites need no extra dep.
          body: |
            src_configure() {
              local mycmakeargs=(
                -DZLIB_COMPAT="$(usex compat)"
                # zlib-ng 2.2 removed the WITH_UNALIGNED switch (zbuild.h now
                # follows __ARM_FEATURE_UNALIGNED); the test suite is not part
                # of the package build.
                -DBUILD_TESTING=OFF
              )

              # The intrinsics options are all defined conditionally, so we need
              # to enable them on/off per-arch here for now.
              if use amd64 || use x86 ; then
                mycmakeargs+=(
                  -DWITH_AVX2=$(usex cpu_flags_x86_avx2)
                  -DWITH_SSE2=$(usex cpu_flags_x86_sse2)
                  -DWITH_SSSE3=$(usex cpu_flags_x86_ssse3)
                  -DWITH_SSE42=$(usex cpu_flags_x86_sse4a)
                  -DWITH_PCLMULQDQ=$(usex cpu_flags_x86_pclmul)
                )
              fi

              if use arm || use arm64 ; then
                mycmakeargs+=(
                  -DWITH_ARMV8=$(usex cpu_flags_arm_crc32)
                  -DWITH_NEON=$(usex cpu_flags_arm_neon)
                )
              fi

              if use ppc || use ppc64 ; then
                # The POWER8 support is VSX which was introduced
                # VSX2 was introduced with POWER8, so use that as a proxy for it
                mycmakeargs+=(
                  -DWITH_POWER8=$(usex cpu_flags_ppc_vsx2)
                )
              fi

              # TODO: There's no s390x USE_EXPAND yet

              cmake_src_configure
            }

            src_install() {
              cmake_src_install

              if use compat ; then
                ewarn "zlib-ng is experimental and replacing the system zlib is dangerous"
                ewarn "Please be careful!"
                ewarn
                ewarn "The following link explains the guarantees (and what is NOT guaranteed):"
                ewarn "https://github.com/zlib-ng/zlib-ng/blob/2.0.x/PORTING.md"
              fi
            }

util_linux:
  generator: builtin-github
  defaults:
    category: sys-apps
    template: ../../templates/simple-github.tmpl
    github:
      user: util-linux
      query: tags
    exclude:
      - '-rc'
      - '-devel'
      - '-start'

  packages:
    - util-linux:
        files_dir: "{{ .Values.pn }}"
        vars:
          desc: Various useful Linux utilities
          homepage: https://www.kernel.org/pub/linux/utils/util-linux/
          license: GPL-2 GPL-3 LGPL-2.1 BSD-4 MIT public-domain
          iuse: audit build +caps +cramfs cryptsetup fdformat hardlink kill +logger magic ncurses nls pam python +readline rtas selinux slang static-libs su +suid tty-helpers udev unicode
          inherit:
            - autotools
            - toolchain-funcs
            - libtool
            - flag-o-matic
            - bash-completion-r1
            - usr-ldscript
            - pam
          rdepend: |
            virtual/libc:=
            audit? ( >=sys-process/audit-2.6:= )
            caps? ( sys-libs/libcap-ng )
            cramfs? ( sys-libs/zlib:= )
            cryptsetup? ( sys-fs/cryptsetup )
            hardlink? ( dev-libs/libpcre2:= )
            ncurses? (
              sys-libs/ncurses:=
              magic? ( sys-apps/file:0= )
            )
            nls? ( virtual/libintl )
            pam? ( sys-libs/pam )
            readline? ( sys-libs/readline:0= )
            rtas? ( sys-libs/librtas )
            selinux? ( >=sys-libs/libselinux-2.2.2-r4 )
            slang? ( sys-libs/slang )
            udev? ( virtual/libudev:= )
            hardlink? ( !app-arch/hardlink )
            logger? ( !>=app-admin/sysklogd-2.0[logger] )
            kill? (
              !sys-apps/coreutils[kill]
              !sys-process/procps[kill]
            )
            su? ( !sys-apps/shadow[su] )
            !net-wireless/rfkill
          depend: |
            ${RDEPEND}
            virtual/os-headers
          bdepend: |
            virtual/pkgconfig
            nls? ( sys-devel/gettext )
          required_use: su? ( pam )
          # Keep the bindings in a separate package and pull them in as a
          # PDEPEND to avoid the build-time Python dependency cycle
          # (macaroni-os/mark-issues#859).
          pdepend: python? ( sys-apps/util-linux-python )
          restrict: test
          body: |
            pkg_pretend() {
              if use su && ! use suid ; then
                elog "su will be installed as suid despite USE=-suid"
                elog "To use su without suid, see e.g. Portage's suidctl feature."
              fi
            }

            src_prepare() {
              default
              ./autogen.sh || die
              eautoreconf
            }

            src_configure() {
              export ac_cv_header_security_pam_misc_h=$(usex pam)
              export ac_cv_header_security_pam_appl_h=$(usex pam)

              # Undo bad ncurses handling by upstream. Fall back to pkg-config.
              export NCURSES6_CONFIG=false NCURSES5_CONFIG=false
              export NCURSESW6_CONFIG=false NCURSESW5_CONFIG=false

              # Avoid automagic dependency on ppc*
              export ac_cv_lib_rtas_rtas_get_sysparm=$(usex rtas)

              local myeconfargs=(
                --enable-fs-paths-extra="/usr/sbin:/bin:/usr/bin"
                --disable-liblastlog2
                --with-bashcompletiondir="$(get_bashcompdir)"
                --without-python
                $(use_enable suid makeinstall-chown)
                $(use_enable suid makeinstall-setuid)
                $(use_with readline)
                $(use_with slang)
                --without-systemd
                $(use_with udev)
                $(usex ncurses "$(use_with magic libmagic)" '--without-libmagic')
                $(usex ncurses "$(use_with unicode ncursesw)" '--without-ncursesw')
                $(usex ncurses "$(use_with !unicode ncurses)" '--without-ncurses')
                $(use_with audit)
                $(tc-has-tls || echo --disable-tls)
                --disable-asciidoc
                $(use_enable nls)
                $(use_enable unicode widechar)
                $(use_enable static-libs static)
                $(use_with ncurses tinfo)
                $(use_with selinux)
                --disable-chfn-chsh
                --disable-login
                --disable-newgrp
                --disable-nologin
                --disable-pylibmount
                --disable-raw
                --disable-vipw
                --enable-agetty
                --enable-bash-completion
                --enable-line
                --enable-partx
                --enable-rename
                --enable-rfkill
                --enable-schedutils
                --without-systemdsystemunitdir
                $(use_enable caps setpriv)
                $(use_enable cramfs)
                $(use_enable fdformat)
                $(use_enable hardlink)
                $(use_enable kill)
                $(use_enable logger)
                $(use_enable ncurses pg)
                $(use_enable su)
                $(use_enable tty-helpers mesg)
                $(use_enable tty-helpers wall)
                $(use_enable tty-helpers write)
                $(use_with cryptsetup)
              )
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
            }

            src_compile() {
              emake all
            }

            src_install() {
              emake DESTDIR="${D}" install

              # need the libs in /
              gen_usr_ldscript -a blkid fdisk mount smartcols uuid

              dodoc AUTHORS NEWS README* Documentation/{TODO,*.txt,releases/*}

              # e2fsprogs-libs didnt install .la files, and .pc work fine
              find "${ED}" -name "*.la" -delete || die

              if use pam ; then
                # See https://github.com/util-linux/util-linux/blob/master/Documentation/PAM-configuration.txt
                newpamd "${FILESDIR}/runuser.pamd" runuser
                newpamd "${FILESDIR}/runuser-l.pamd" runuser-l
                newpamd "${FILESDIR}/su-l.pamd" su-l
              fi

              if use su && ! use suid ; then
                # Always force suid su, even when USE=-suid, as su is useless
                # for the overwhelming-majority case without suid.
                # Users who wish to truly have a no-suid su can strip it out
                # via e.g. Portage's suidctl or some other hook.
                fperms u+s /bin/su
              fi

              # Bash completion for "runuser" command is provided by same file which
              # would also provide bash completion for "su" command. However, we don't
              # use "su" command from this package. This triggers a known QA warning
              # which we ignore for now to magically keep bash completion for "su"
              # command which shadow package does not provide.
            }

            pkg_postinst() {
              if ! use tty-helpers ; then
                elog "The mesg/wall/write tools have been disabled due to USE=-tty-helpers."
              fi

              if [[ -z ${REPLACING_VERSIONS} ]] ; then
                elog "The agetty util now clears the terminal by default. You"
                elog "might want to add --noclear to your /etc/inittab lines."
              fi
            }

    - util-linux-python:
        files_dir: util-linux
        github:
          user: util-linux
          repo: util-linux
          query: tags
        vars:
          desc: Python bindings for the util-linux libmount library
          homepage: https://www.kernel.org/pub/linux/utils/util-linux/
          license: LGPL-3+
          python_compat: python3+
          inherit:
            - autotools
            - toolchain-funcs
            - libtool
            - flag-o-matic
            - python-r1
            - multiprocessing
          rdepend: |
            ${PYTHON_DEPS}
            ~sys-apps/util-linux-{{ .Values.pv }}
          depend: |
            ${RDEPEND}
            virtual/os-headers
          bdepend: virtual/pkgconfig
          required_use: ${PYTHON_REQUIRED_USE}
          restrict: test
          body: |
            src_prepare() {
              default
              ./autogen.sh || die
              eautoreconf
            }

            python_configure() {
              local myeconfargs=(
                --disable-all-programs
                --disable-bash-completion
                --without-systemdsystemunitdir
                --with-python
                --enable-libblkid
                --enable-libmount
                --enable-pylibmount
              )
              mkdir "${BUILD_DIR}" || die
              pushd "${BUILD_DIR}" >/dev/null || die
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
              popd >/dev/null || die
            }

            python_compile() {
              pushd "${BUILD_DIR}" >/dev/null || die
              emake
              popd >/dev/null || die
            }

            python_install() {
              pushd "${BUILD_DIR}" >/dev/null || die
              emake DESTDIR="${D}" \
                install-pylibmountexecLTLIBRARIES \
                install-pylibmountexecPYTHON
              python_optimize
              popd >/dev/null || die
            }

            src_configure() {
              python_foreach_impl python_configure
            }

            src_compile() {
              python_foreach_impl python_compile
            }

            src_install() {
              python_foreach_impl python_install
              # The automake python install target pulls in the libmount and
              # libblkid install targets; those libraries belong to util-linux.
              find "${ED}"/usr/$(get_libdir) -maxdepth 1 \( -name 'libblkid.*' -o -name 'libmount.*' \) -delete || die
              find "${ED}" -name "*.la" -delete || die
            }

lz4:
  generator: builtin-github

  defaults:
