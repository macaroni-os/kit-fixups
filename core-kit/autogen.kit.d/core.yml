snappy:
  generator: builtin-github

  defaults:
    category: app-arch
    template: ../../templates/simple-github.tmpl
    github:
      user: google
      repo: snappy
      query: tags

  packages:
    - snappy:
        vars:
          desc: A high-speed compression/decompression library by Google
          homepage: https://github.com/google/snappy
          license: BSD
          inherit:
            - cmake
          docs:
            - format_description.txt
            - framing_format.txt
            - NEWS
            - README.md
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_SHARED_LIBS=ON
                # The test and benchmark frameworks live in the
                # third_party/ git submodules, which are missing from
                # the release source tarballs.
                -DSNAPPY_BUILD_TESTS=OFF
                -DSNAPPY_BUILD_BENCHMARKS=OFF
                # Optional compression libs only used by tests and
                # benchmarks, kept off as the tree ebuild did.
                -DHAVE_LIBZ=NO
                -DHAVE_LIBLZO2=NO
                -DHAVE_LIBLZ4=NO
              )
              cmake_src_configure
            }

# sys-libs/ncurses (macaroni-os/mark-issues#923)
#
# Upstream (invisible-island.net) has no GitHub; the autoindex at
# /archives/ncurses/current/ lists the dated full snapshot tarballs of the
# current release line (ncurses-<ver>-<YYYYMMDD>.tgz, one file per weekly
# patch level; the .asc siblings and the MD5sums/dev-patches.zip entries
# are excluded by the matcher). The listing is read on upstream's own
# mirror invisible-mirror.net: the primary host serves the same listing
# but rejects the generator's Go user-agent with 403, and the legacy
# ebuild already fetched its distfiles from the mirror. The tree tracks
# patch levels (6.5_p20240511 = base 6.5 tarball plus the 20240504 and
# 20240511 weekly patch.gz chain), so the dated snapshots are the matching
# upstream artefact and the version transform maps "6.6-20261114" to the
# tree's "_p" scheme (6.6_p20261114). The snapshot unpack root keeps
# upstream's dashed name, hence the post_src_unpack() rename to ${S}.
ncurses:
  generator: builtin-dirlisting

  defaults:
    category: sys-libs
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"

  packages:
    - ncurses:
        dir:
          url: https://invisible-mirror.net/archives/ncurses/current/
          matcher: 'ncurses-[0-9]+\.[0-9]+-[0-9]{8}\.tgz$'
        transform:
          - kind: string
            match: 'ncurses-'
            replace: ''
          - kind: string
            match: '.tgz'
            replace: ''
          - kind: regex
            match: '-'
            replace: '_p'
        vars:
          desc: console display library
          homepage: https://www.gnu.org/software/ncurses/ https://invisible-island.net/ncurses/
          license: MIT
          # Top-level constant consumed by src_configure/src_compile/
          # src_install: portage runs every phase in a fresh shell, the
          # array cannot be set inside a phase function.
          extra_envs:
            - 'NCURSES_TARGETS=( ncurses ncursesw ncursest ncursestw )'
          inherit:
            - toolchain-funcs
            - preserve-libs
            - usr-ldscript
          # doc/test USE dropped per house convention; the two upstream
          # weekly patch.gz distfiles of the legacy ebuild (20240504 and
          # 20240511) are absorbed by the newer dated snapshot.
          iuse: ada +cxx debug gpm minimal profile static-libs tinfo trace unicode
          depend: |
            gpm? ( sys-libs/gpm )
          rdepend: |
            ${DEPEND}
            !<=sys-libs/ncurses-5.9-r4:5
            !<sys-libs/slang-2.3.2_pre23
            !<x11-terms/rxvt-unicode-9.06-r3
            !<x11-terms/st-0.6-r1
          patches:
            - ncurses-5.7-nongnu.patch
            - ncurses-6.0-rxvt-unicode-9.15.patch
            - ncurses-6.0-pkg-config.patch
            - ncurses-6.0-ticlib.patch
            - ncurses-6.2_p20210123-cppflags-cross.patch
          body: |
            post_src_unpack() {
              mv ${WORKDIR}/ncurses-* ${S} || die
            }

            src_configure() {
              unset TERMINFO
              tc-export_build_env BUILD_{CC,CPP}
              BUILD_CPPFLAGS+=" -D_GNU_SOURCE"
              local BUILD_DIR="${WORKDIR}/build"

              local t
              for t in "${NCURSES_TARGETS[@]}" ; do
                do_configure "${t}"
              done
            }

            do_configure() {
              local target=$1
              shift

              mkdir -p "${BUILD_DIR}/${target}" || die
              cd "${BUILD_DIR}/${target}" || die

              local conf=(
                # We need the basic terminfo files in /etc for
                # embedded/recovery.
                --with-terminfo-dirs="/etc/terminfo:/usr/share/terminfo"

                # Enable installation of .pc files.
                --enable-pc-files
                # This path is used to control where the .pc files are
                # installed.
                --with-pkg-config-libdir="/usr/$(get_libdir)/pkgconfig"

                # Now the rest of the various standard flags.
                --with-shared
                --without-hashed-db
                $(use_with ada)
                $(use_with cxx)
                $(use_with cxx cxx-binding)
                --with-cxx-shared
                $(use_with debug)
                $(use_with profile)
                # The configure script uses ldd to parse the linked output
                # which is flaky for cross-compiling/multilib/ldd
                # versions/etc...
                $(use_with gpm gpm libgpm.so.1)
                # Required for building on mingw-w64, and possibly other
                # windows platforms
                $(use_enable kernel_Winnt term-driver)
                --disable-termcap
                --enable-symlinks
                --with-rcs-ids
                --with-manpage-format=normal
                --enable-const
                --enable-colorfgbg
                --enable-hard-tabs
                --enable-echo
                $(use_enable !ada warnings)
                $(use_with debug assertions)
                $(use_enable !debug leaks)
                $(use_with debug expanded)
                $(use_with !debug macros)
                --with-progs
                $(use_with trace)
                $(use_with tinfo termlib)
                --disable-stripping
                --disable-pkg-ldflags
              )

              if [[ ${target} == ncurses*w ]] ; then
                conf+=( --enable-widec )
              else
                conf+=( --disable-widec )
              fi
              if [[ ${target} == ncursest* ]] ; then
                conf+=( --with-{pthread,reentrant} )
              else
                conf+=( --without-{pthread,reentrant} )
              fi
              # Make sure each variant goes in a unique location.
              if [[ ${target} == "ncurses" ]] ; then
                # "ncurses" variant goes into /usr/include
                conf+=( --enable-overwrite )
              else
                conf+=( --includedir="/usr/include/${target}" )
              fi
              ECONF_SOURCE="${S}" \
              econf "${conf[@]}" "$@"
            }

            src_compile() {
              local BUILD_DIR="${WORKDIR}/build"

              local t
              for t in "${NCURSES_TARGETS[@]}" ; do
                do_compile "${t}"
              done
            }

            do_compile() {
              local target=$1
              shift

              cd "${BUILD_DIR}/${target}" || die

              # A little hack to fix parallel builds ... they break when
              # generating sources so if we generate the sources first (in
              # non-parallel), we can then build the rest of the package in
              # parallel. This is not really a perf hit since the source
              # generation is quite small.
              emake -j1 sources
              # For some reason, sources depends on pc-files which depends on
              # compiled libraries which depends on sources which ...
              # Manually delete the pc-files file so the install step will
              # create the .pc files we want.
              rm -f misc/pc-files || die
              emake "$@"
            }

            src_install() {
              local BUILD_DIR="${WORKDIR}/build"

              local target
              for target in "${NCURSES_TARGETS[@]}" ; do
                emake -C "${BUILD_DIR}/${target}" DESTDIR="${D}" install
              done

              # Move main libraries into /.
              gen_usr_ldscript -a \
                "${NCURSES_TARGETS[@]}" \
                $(usex tinfo 'tinfow tinfo' '')

              if ! tc-is-static-only ; then
                # Provide a link for -lcurses.
                ln -sf libncurses$(get_libname) "${ED}"/usr/$(get_libdir)/libcurses$(get_libname) || die
              fi

              # don't delete '*.dll.a', needed for linking
              if ! use static-libs; then
                find "${ED}"/usr/ -name '*.a' ! -name '*.dll.a' -delete || die
              fi

              dosym $(sed 's@[^/]\+@..@g' <<< $(get_libdir))/share/terminfo \
                /usr/$(get_libdir)/terminfo

              # We need the basic terminfo files in /etc for embedded/recovery.
              einfo "Installing basic terminfo files in /etc..."
              local terms=(
                # Dumb/simple values that show up when using the in-kernel VT.
                ansi console dumb linux
                vt{52,100,102,200,220}
                # [u]rxvt users used to be pretty common.
                rxvt{,-unicode}{,-256color}
                # xterm users are common, as is terminals re-using/spoofing it.
                xterm xterm-{,256}color
                # screen is common (and reused by tmux).
                screen{,-256color}
                screen.xterm-256color
              )
              local x
              for x in "${terms[@]}"; do
                local termfile=$(find "${ED}"/usr/share/terminfo/ -name "${x}" 2>/dev/null)
                local basedir=$(basename "$(dirname "${termfile}")")

                if [[ -n ${termfile} ]] ; then
                  dodir "/etc/terminfo/${basedir}"
                  mv "${termfile}" "${ED}/etc/terminfo/${basedir}/" || die
                  dosym "../../../../etc/terminfo/${basedir}/${x}" \
                    "/usr/share/terminfo/${basedir}/${x}"
                fi
              done

              echo "CONFIG_PROTECT_MASK=\"/etc/terminfo\"" | newenvd - 50ncurses

              use minimal && rm -r "${ED}"/usr/share/terminfo*
              # Because ncurses5-config --terminfo returns the directory we
              # keep it
              keepdir /usr/share/terminfo

              cd "${S}" || die
              dodoc ANNOUNCE MANIFEST NEWS README* TO-DO doc/*.doc
            }

            pkg_preinst() {
              preserve_old_lib /$(get_libdir)/libncurses.so.5
              preserve_old_lib /$(get_libdir)/libncursesw.so.5
            }

            pkg_postinst() {
              preserve_old_lib_notify /$(get_libdir)/libncurses.so.5
              preserve_old_lib_notify /$(get_libdir)/libncursesw.so.5
            }
libsigc++:
  generator: builtin-github

  defaults:
    category: dev-libs
    template: ../../templates/simple.tmpl
    github:
      user: libsigcplusplus
      repo: libsigcplusplus
    assets:
      # Uploaded release asset; the sibling .sha256sum files are filtered by
      # the end anchor (regex matchers are substring searches by default).
      - name: '{{ .Values.p }}.tar.xz'
        matcher: '^libsigc\+\+-{{ .Values.pv }}\.tar\.xz$'
    vars:
      desc: Typesafe callback system for standard C++
      homepage: http://libsigc.sourceforge.net/
      license: LGPL-2.1+
      # House platform: the doc/test USE flags of the autotools tree ebuilds
      # are dropped (docs are read online, tests belong in workflows) and the
      # multilib handling is not carried over; the meson
      # build-{documentation,examples,tests} options are disabled
      # unconditionally (build-examples/build-tests default to true).
      inherit:
        - meson
        - flag-o-matic
      iuse: static-libs
      body: |
        src_configure() {
          # libsigc++ requires C++ exceptions; a -fno-exceptions in the
          # environment breaks the build (filter kept from the tree ebuilds).
          filter-flags -fno-exceptions
          local emesonargs=(
            -Dbuild-documentation=false
            -Dbuild-examples=false
            -Dbuild-tests=false
            # meson has no static-libs option; default_library is the mapping
            # used by the libxml2 cluster in this file.
            -Ddefault_library=$(usex static-libs both shared)
          )
          meson_src_configure
        }

  packages:
    # The 2.x and 3.x API lines are maintained in parallel upstream (releases
    # published on both tracks) and are co-installable via SLOT=2/SLOT=3,
    # mirroring the two legacy merge atoms. Modern libsigc++ is meson-only,
    # hence the eclass switch from the autotools tree ebuilds.
    - libsigc++:
        selector:
          - '>=2.10'
          # The 2.99.x releases are the development series of the 3.0 API,
          # not the 2.x maintenance line, and sort above 2.12.x.
          - '<2.99'
        vars:
          slot: '2'
    - libsigc++:
        selector:
          - '>=3'
        vars:
          slot: '3'

libarchive:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: app-arch
    template: ../../templates/simple.tmpl

    github:
      user: libarchive
    # Release titles are "Libarchive <version>" (zlib "zlib 1.4" precedent).
    transform:
      - kind: string
        match: 'Libarchive '
        replace: ''
    # Official release asset; the unpack root is ${P} (libarchive-<ver>/).
    assets:
      - name: '{{ .Values.p }}.tar.gz'
        matcher: '{{ .Values.pn }}-.*\.tar\.gz$'
    vars:
      desc: Multi-format archive and compression library
      homepage: https://www.libarchive.org/
      license: BSD BSD-2 BSD-4 public-domain
      slot: '0/13'
      # libressl simplified to the house ssl flag: dev-libs/libressl exists in
      # no kit; +ssl preserves the tree's default-on openssl provider.
      iuse: acl blake2 +bzip2 +e2fsprogs expat +iconv +ssl lz4 +lzma lzo nettle static-libs +threads xattr +zlib zstd
      inherit:
        - libtool
      rdepend: |
        acl? ( virtual/acl )
        blake2? ( app-crypt/libb2 )
        bzip2? ( app-arch/bzip2 )
        expat? ( dev-libs/expat )
        !expat? ( dev-libs/libxml2 )
        iconv? ( virtual/libiconv )
        xattr? ( sys-apps/attr )
        ssl? ( dev-libs/openssl:= )
        lz4? ( >=app-arch/lz4-0_p131:0= )
        lzma? ( app-arch/xz-utils )
        lzo? ( >=dev-libs/lzo-2 )
        nettle? ( dev-libs/nettle:0= )
        zlib? ( sys-libs/zlib )
        zstd? ( app-arch/zstd )
      # simple.tmpl renders RDEPEND before DEPEND, so the literals live in
      # rdepend: and depend: passes ${RDEPEND} through (libedit pattern).
      depend: |
        ${RDEPEND}
        virtual/os-headers
        e2fsprogs? ( sys-fs/e2fsprogs )
      body: |
        src_configure() {
          export ac_cv_header_ext2fs_ext2_fs_h=$(usex e2fsprogs)

          local myconf=(
            $(use_enable acl)
            $(use_enable static-libs static)
            $(use_enable xattr)
            $(use_with blake2 libb2)
            $(use_with bzip2 bz2lib)
            $(use_with expat)
            $(use_with !expat xml2)
            $(use_with iconv)
            $(use_with lz4)
            $(use_with lzma)
            $(use_with lzo lzo2)
            $(use_with nettle)
            $(use_with zlib)
            $(use_with zstd)
            $(use_with ssl openssl)
            --enable-bsdcat=$(tc-is-static-only && echo static || echo shared)
            --enable-bsdcpio=$(tc-is-static-only && echo static || echo shared)
            --enable-bsdtar=$(tc-is-static-only && echo static || echo shared)

            # Windows-specific
            --without-cng
          )

          ECONF_SOURCE="${S}" econf "${myconf[@]}"
        }

        src_install() {
          emake DESTDIR="${D}" install

          # Libs.private: should be used from libarchive.pc instead
          find "${ED}" -type f -name "*.la" -delete || die
        }

  packages:
    - libarchive:

zlib:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: sys-libs
    template: ../../templates/simple.tmpl

    github:
      user: madler
    transform:
      # Release titles are "zlib 1.4" (libffi precedent).
      - kind: string
        match: 'zlib '
        replace: ''
    assets:
      - name: '{{ .Values.p }}.tar.gz'
        matcher: '{{ .Values.pn }}-.*\.tar\.gz$'
    vars:
      desc: Standard (de)compression library
      homepage: https://zlib.net/
      license: ZLIB
      iuse: minizip static-libs
      inherit:
        - autotools
        - toolchain-funcs
      # The tree ebuild sets AUTOTOOLS_AUTO_DEPEND=no and forms the autotools
      # dependency only for the minizip flavour (eautoreconf runs in
      # contrib/minizip only). extra_envs renders before the inherit line.
      extra_envs:
        - 'AUTOTOOLS_AUTO_DEPEND=no'
      depend: |
        minizip? ( ${AUTOTOOLS_DEPEND} )
      patches:
        - zlib-1.4-minizip-drop-crypt-header.patch
      body: |
        src_prepare() {
          default
          if use minizip ; then
            cd contrib/minizip || die
            eautoreconf
          fi
        }

        src_configure() {
          # not an autoconf script, so can't use econf
          local uname=$(/usr/share/gnuconfig/config.sub "${CHOST}" | cut -d- -f3)
          "${S}"/configure \
            --shared \
            --prefix=/usr \
            --libdir=/usr/$(get_libdir) \
            ${uname:+--uname=${uname}} \
            || die

          if use minizip ; then
            local minizipdir="contrib/minizip"
            cd ${minizipdir} || die
            ECONF_SOURCE="${S}/${minizipdir}" \
            econf $(use_enable static-libs static)
          fi
        }

        src_compile() {
          emake
          use minizip && emake -C contrib/minizip
        }

        sed_macros() {
          sed -i -r 's:\<(O[FN])\>:_Z_\1:g' "$@" || die
        }

        src_install() {
          emake install DESTDIR="${D}" LDCONFIG=:
          gen_usr_ldscript -a z
          sed_macros "${ED}"/usr/include/*.h
          if use minizip ; then
            emake -C contrib/minizip install DESTDIR="${D}"
            sed_macros "${ED}"/usr/include/minizip/*.h
          fi
          use static-libs || rm -f "${ED}"/usr/$(get_libdir)/lib{z,minizip}.{a,la}
          dodoc FAQ README ChangeLog doc/*.txt
          use minizip && dodoc contrib/minizip/*.txt
        }

  packages:
    - zlib:
        revision: 1

bash:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: app-shells
    dir:
      url: 'https://gnuftp.mirror.garr.it/bash/'
      # GNU publishes consolidated patch-level tarballs (bash-5.2.NN.tar.gz)
      # next to the base release, so the "patch series" policy is simply the
      # newest patch-level tarball: .sig, -patches/, -alpha/-beta/-rc entries
      # are filtered by the anchored matcher below.
      matcher: 'bash-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.gz$'
    transform:
      - kind: string
        match: 'bash-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    # The listing serves both the 5.2.NN patch-level tarballs and the 5.3
    # line; each track is declared as its own packages entry below so the
    # spec can generate both versions at once.
    vars:
      desc: The standard GNU Bourne again shell
      homepage: https://tiswww.case.edu/php/chet/bash/bashtop.html
      license: GPL-3
      iuse: afs bashlogger examples mem-scramble +net nls plugins +readline static
      inherit:
        - flag-o-matic
        - toolchain-funcs
      patches:
        - bash-5.0-syslog-history-extern.patch
      rdepend: |
        >=sys-libs/ncurses-5.2-r2:0=
        nls? ( virtual/libintl )
      depend: |
        ${RDEPEND}
        static? ( sys-libs/ncurses:0=[static-libs] )
      body: |
        pkg_setup() {
          if is-flag -malign-double ; then
            eerror "Detected bad CFLAGS '-malign-double'.  Do not use this"
            eerror "as it breaks LFS (struct stat64) on x86."
            die "REMOvE -malign-double from your CFLAGS"
          fi

          if use bashlogger ; then
            ewarn "The logging patch should ONLY be used in restricted (i.e. honeypot) envs."
            ewarn "This will log ALL output you enter into the shell, you have been warned."
          fi
        }

        src_prepare() {
          # Avoid regenerating docs after patches.
          sed -i -r '/^(HS|RL)USER/s:=.*:=:' doc/Makefile.in || die
          touch -r . doc/* || die

          # Context diff written against ../bash-5.0-patched/: needs -p0.
          eapply -p0 "${PATCHES[@]}"
          eapply_user
        }

        src_configure() {
          use static && append-ldflags -static

          local myconf=(
            --disable-profiling

            # Force linking with system curses ... the bundled termcap lib
            # sucks bad compared to ncurses.  For the most part, ncurses
            # is here because readline needs it.  But bash itself calls
            # ncurses in one or two small places :(.
            --with-curses

            $(use_enable mem-scramble)
            $(use_enable net net-redirections)
            $(use_enable readline)
            $(use_enable readline bang-history)
            $(use_enable readline history)
            $(use_with afs)
            $(use_with mem-scramble bash-malloc)
          )

          # For descriptions of these, see config-top.h
          append-cppflags \
            -DDEFAULT_PATH_VALUE=\'\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\' \
            -DSTANDARD_UTILS_PATH=\'\"/bin:/usr/bin:/sbin:/usr/sbin\"\' \
            -DSYS_BASHRC=\'\"/etc/bash/bashrc\"\' \
            -DSYS_BASH_LOGOUT=\'\"/etc/bash/bash_logout\"\' \
            -DNON_INTERACTIVE_LOGIN_SHELLS \
            -DSSH_SOURCE_BASHRC \
            $(use bashlogger && echo -DSYSLOG_HISTORY)

          use nls || myconf+=( --disable-nls )

          if use plugins ; then
            append-ldflags -Wl,-rpath,"/usr/$(get_libdir)/bash"
          else
            # Disable the plugins logic by hand since bash doesn't
            # provide a way of doing it.
            export ac_cv_func_dl{close,open,sym}=no \
              ac_cv_lib_dl_dlopen=no ac_cv_header_dlfcn_h=no

            sed -i \
              -e '/LOCAL_LDFLAGS=/s:-rdynamic::' \
              configure || die
          fi

          tc-export AR

          econf "${myconf[@]}"
        }

        src_compile() {
          emake

          if use plugins ; then
            emake -C examples/loadables all others
          fi
        }

        src_install() {
          local d f

          default

          dodir /bin
          mv "${ED}"/usr/bin/bash "${ED}"/bin/ || die
          dosym bash /bin/rbash

          insinto /etc/bash
          doins "${FILESDIR}"/bash_logout
          doins "${FILESDIR}"/bashrc

          keepdir /etc/bash/bashrc.d

          insinto /etc/skel
          for f in bash{_logout,_profile,rc} ; do
            newins "${FILESDIR}"/dot-${f} .${f}
          done

          local sed_args=(
            -e "s:#${USERLAND}#@::"
            -e '/#@/d'
          )

          if ! use readline ; then
            sed_args+=(
              -e '/^shopt -s histappend/s:^:#:'
              -e 's:use_color=true:use_color=false:'
            )
          fi

          sed -i \
            "${sed_args[@]}" \
            "${ED}"/etc/skel/.bashrc \
            "${ED}"/etc/bash/bashrc || die

          if use plugins ; then
            exeinto /usr/$(get_libdir)/bash
            doexe $(echo examples/loadables/*.o | sed 's:\.o::g')

            insinto /usr/include/bash-plugins
            doins *.h builtins/*.h include/*.h lib/{glob/glob.h,tilde/tilde.h}
          fi

          if use examples ; then
            for d in examples/{functions,misc,scripts,startup-files} ; do
              exeinto /usr/share/doc/${PF}/${d}
              docinto ${d}
              for f in ${d}/* ; do
                if [[ ${f##*/} != PERMISSION ]] && [[ ${f##*/} != *README ]] ; then
                  doexe ${f}
                else
                  dodoc ${f}
                fi
              done
            done
          fi

          doman doc/*.1
          newdoc CWRU/changelog ChangeLog
          dosym bash.info /usr/share/info/bashref.info
        }

        pkg_preinst() {
          if [[ -e ${EROOT}/etc/bashrc ]] && [[ ! -d ${EROOT}/etc/bash ]] ; then
            mkdir -p "${EROOT}"/etc/bash
            mv -f "${EROOT}"/etc/bashrc "${EROOT}"/etc/bash/
          fi
        }

        pkg_postinst() {
          # If /bin/sh does not exist, provide it
          if [[ ! -e ${EROOT}/bin/sh ]] ; then
            ln -sf bash "${EROOT}"/bin/sh
          fi
        }

  packages:
    - bash:
        # 5.2 track: consolidated bash-5.2.NN patch-level tarballs.
        selector:
          - '>=5.2'
          - '<5.3'
    - bash:
        # 5.3 track: base 5.3 release; a future bash-5.3.NN tarball is picked
        # up by the same matcher automatically.
        selector:
          - '>=5.3'
          - '<5.4'

timezone_data:
  # Rolling IANA tzdb releases (tzdata<YYYY><letter>): the releases dirlisting
  # is the only machine-readable upstream channel (probed 2026-11-15:
  # github.com/eggert/tz has 0 releases, iana/time-zones does not exist, no
  # Forgejo). The <YYYY><letter> form is already a valid portage PV, so the
  # transform only strips the tzdata prefix and the .tar.gz suffix; letter
  # suffixes sort correctly (2026f > 2026a > 2025b > 2025a). The tree ebuild
  # fetches a second tzcode<PV>.tar.gz distfile sharing the same version: it
  # rides along as an asset so the generated Manifest covers every distfile.
  # The end-anchored gz matcher structurally drops the .tar.lz/.Z siblings,
  # the .asc/.sign files and the 2-digit-year entries; data.iana.org serves
  # the exact same bytes as the tree Manifest hashes (no Content-Encoding).
  # macaroni-os/mark-issues#925 (epic #880); conversion precedent #573.
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    category: sys-libs

  packages:

    - timezone-data:
        dir:
          url: https://data.iana.org/time-zones/releases/
          matcher: 'tzdata[0-9]{4}[a-z]\.tar\.gz$'
        transform:
          - kind: string
            match: 'tzdata'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        assets:
          - name: 'tzdata{{ .Values.version }}.tar.gz'
            url: 'https://data.iana.org/time-zones/releases/tzdata{{ .Values.version }}.tar.gz'
          - name: 'tzcode{{ .Values.version }}.tar.gz'
            url: 'https://data.iana.org/time-zones/releases/tzcode{{ .Values.version }}.tar.gz'
        vars:
          desc: Timezone data (/usr/share/zoneinfo) and utilities (tzselect/zic/zdump)
          homepage: https://www.iana.org/time-zones
          license: BSD public-domain
          slot: '0'
          iuse: nls leaps-timezone
          inherit:
            - toolchain-funcs
            - flag-o-matic
          s: '${WORKDIR}'
          # simple.tmpl renders RDEPEND before DEPEND, so ${DEPEND} inside
          # rdepend would render empty: write both literally (tree semantics:
          # DEPEND=nls? ( virtual/libintl ), RDEPEND=${DEPEND} + glibc blocker).
          depend: 'nls? ( virtual/libintl )'
          rdepend: |
            nls? ( virtual/libintl )
            !sys-libs/glibc[vanilla(+)]
          body: |
            src_prepare() {
              default

              # check_web contacts validator.w3.org
              sed -i -e 's/check_tables check_web/check_tables/g' \
                Makefile || die "Failed to disable check_web"

            }

            src_configure() {
              tc-export CC

              append-lfs-flags

              append-cppflags -DHAVE_GETTEXT=$(usex nls 1 0) -DTZ_DOMAIN='\"libc\"'
              LDLIBS=""
              if use nls ; then
                # See if an external libintl is available.
                local c="${T}/test"
                echo 'main(){}' > "${c}.c"
                if $(tc-getCC) ${CPPFLAGS} ${CFLAGS} ${LDFLAGS} "${c}.c" -o "${c}" -lintl 2>/dev/null ; then
                  LDLIBS+=" -lintl"
                fi
              fi
            }

            _emake() {
              emake \
                REDO=$(usex leaps-timezone posix_right posix_only) \
                TZDATA_TEXT= \
                ZICDIR='/usr/bin' \
                "$@"
            }

            src_compile() {
              _emake \
                AR="$(tc-getAR)" \
                cc="$(tc-getCC)" \
                RANLIB="$(tc-getRANLIB)" \
                CFLAGS="${CFLAGS} -std=gnu99 ${CPPFLAGS}" \
                LDFLAGS="${LDFLAGS}" \
                LDLIBS="${LDLIBS}"
            }

            src_install() {
              local zic=""
              _emake install ${zic} DESTDIR="${D}" LIBDIR="/nukeit"
              rm -rf "${D}/nukeit" "${ED}/etc" || die

              insinto /usr/share/zoneinfo
              doins "${S}"/leap-seconds.list

              # Delete man pages installed by man-pages package.
              rm "${ED}"/usr/share/man/man5/tzfile.5* "${ED}"/usr/share/man/man8/{tzselect,zdump,zic}.8 || die
              dodoc CONTRIBUTING README NEWS *.html
            }

            get_TIMEZONE() {
              local tz src="/etc/timezone"
              if [[ -e ${src} ]] ; then
                tz=$(sed -e 's:#.*::' -e 's:[[:space:]]*::g' -e '/^$/d' "${src}")
              else
                tz="FOOKABLOIE"
              fi
              [[ -z ${tz} ]] && return 1 || echo "${tz}"
            }

            pkg_preinst() {
              local tz=$(get_TIMEZONE)
              if [[ ${tz} == right/* || ${tz} == posix/* ]] ; then
                eerror "The right & posix subdirs are no longer installed as subdirs -- they have been"
                eerror "relocated to match upstream paths as sibling paths.  Further, posix/xxx is the"
                eerror "same as xxx, so you should simply drop the posix/ prefix.  You also should not"
                eerror "be using right/xxx for the system timezone as it breaks programs."
                die "Please fix your timezone setting"
              fi

              # Trim the symlink by hand to avoid portage's automatic protection checks.
              rm -f /usr/share/zoneinfo/posix

              if has_version "<=${CATEGORY}/${PN}-2015c" ; then
                elog "Support for accessing posix/ and right/ directly has been dropped to match"
                elog "upstream.  There is no need to set TZ=posix/xxx as it is the same as TZ=xxx."
                elog "For TZ=right/, you can use TZ=../zoneinfo-leaps/xxx instead.  See this post"
                elog "for details: https://mm.icann.org/pipermail/tz/2015-February/022024.html"
              fi
            }

            configure_tz_data() {
              # make sure the /etc/localtime file does not get stale
              local tz src="/etc/timezone" etc_lt="/etc/localtime"

              # If it's a symlink, assume the user knows what they're doing and
              # they're managing it themselves.
              if [[ -L "${etc_lt}" ]] ; then
                einfo "Assuming your ${etc_lt} symlink is what you want; skipping update."
                return 0
              fi

              if ! tz=$(get_TIMEZONE) ; then
                einfo "Assuming your empty ${etc_lt} file is what you want; skipping update."
                return 0
              fi
              if [[ "${tz}" == "FOOKABLOIE" ]] ; then
                elog "You do not have TIMEZONE set in ${src}."

                if [[ ! -e "${etc_lt}" ]] ; then
                  cp -f /usr/share/zoneinfo/Factory "${etc_lt}"
                  elog "Setting ${etc_lt} to Factory."
                else
                  elog "Skipping auto-update of ${etc_lt}."
                fi
                return 0
              fi

              if [[ ! -e "/usr/share/zoneinfo/${tz}" ]] ; then
                elog "You have an invalid TIMEZONE setting in ${src}"
                elog "Your ${etc_lt} has been reset to Factory; enjoy!"
                tz="Factory"
              fi
              einfo "Updating ${etc_lt} with /usr/share/zoneinfo/${tz}"
              cp -f "/usr/share/zoneinfo/${tz}" "${etc_lt}"
            }

            pkg_config() {
              configure_tz_data
            }

            pkg_postinst() {
              configure_tz_data
            }

# sys-devel/patch dual-track spec: hoisted out of core_dirlisting into its own
# definition key (kit-fixups#601 review 4580668562) so the shared vars/spec and
# the (byte-identical) body live once under defaults; entries keep only deltas.
patch:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-devel
    dir:
      url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
      matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      desc: Utility to apply diffs to files
      homepage: https://www.gnu.org/software/patch/patch.html
      license: GPL-3+
      iuse: static xattr
      inherit:
        - flag-o-matic
      rdepend: |
        xattr? ( sys-apps/attr )
      depend: '${RDEPEND}'
      body: |
        src_configure() {
          use static && append-ldflags -static

          local myeconfargs=(
            $(use_enable xattr)
          )
          # Do not let $ED mess up the search for `ed`.
          ac_cv_path_ED=$(type -P ed) \
            econf "${myeconfargs[@]}"
        }
  packages:
    # Legacy 2.7.6 track: still served on the mark-iii/mark-i/mark-v release
    # branches (and mark-xl). Capped below 2.8; the 12 security fixes apply to
    # this track only (dry-run against 2.8: 11/12 already absorbed, fix2 only
    # with fuzz 2 — see macaroni-os/mark-issues#920).
    - patch:
        selector:
          - '>=2.7.6'
          - '<2.8'
        revision: 4
        vars:
          patches:
            - patch-2.7.6-fix-test-suite.patch
            - patch-2.7.6-fix-error-handling-with-git-style-patches.patch
            - patch-2.7.6-CVE-2018-6951.patch
            - patch-2.7.6-allow-input-files-to-be-missing-for-ed-style-patches.patch
            - patch-2.7.6-CVE-2018-1000156.patch
            - patch-2.7.6-CVE-2018-6952.patch
            - patch-2.7.6-Do-not-crash-when-RLIMIT_NOFILE-is-set-to-RLIM_INFINITY.patch
            - patch-2.7.6-CVE-2018-1000156-fix1.patch
            - patch-2.7.6-CVE-2018-1000156-fix2.patch
            - patch-2.7.6-CVE-2019-13636.patch
            - patch-2.7.6-CVE-2019-13638.patch
            - patch-2.7.6-Avoid-invalid-memory-access-in-context-format-diffs.patch
    # Current track: the dirlisting tip (patch-2.8.1 as of conversion, so the
    # bot auto-tracks future GNU releases). Upstream absorbed all 12 legacy
    # patches, hence the empty patches list on this track.
    - patch:
        vars:
          patches: []

grep:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    dir:
      url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
      matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.xz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      desc: GNU regular expression matcher
      homepage: https://www.gnu.org/software/grep/
      license: GPL-3
      iuse: nls pcre static
      inherit:
        - flag-o-matic
      docs:
        - AUTHORS
        - ChangeLog
        - NEWS
        - README
        - THANKS
        - TODO
      # USE=static links libpcre2 in at build time; the runtime dep carries only the shared library
      rdepend: |
        !static? ( pcre? ( dev-libs/libpcre2 ) )
        nls? ( virtual/libintl )
        virtual/libiconv
      depend: |
        ${RDEPEND}
        static? ( pcre? ( dev-libs/libpcre2[static-libs(+)] ) )
      bdepend: |
        app-arch/xz-utils
        virtual/pkgconfig
        nls? ( sys-devel/gettext )
      body: |
        src_prepare() {
          sed -i \
            -e "s:@SHELL@:/bin/sh:g" \
            -e "s:@grep@:/bin/grep:" \
            src/egrep.sh || die

          default
        }
        src_configure() {
          use static && append-ldflags -static
          # don't link against libsigsegv even when available
          export ac_cv_libsigsegv=no

          local myeconfargs=(
            --bindir=/bin
            $(use_enable nls)
            $(use_enable pcre perl-regexp)
          )
          econf "${myeconfargs[@]}"
        }

  packages:
    # Legacy 3.11 track: still served in-tree and on the release branches
    # whose merge atom carries conditions >=sys-apps/grep-3.11 +
    # <sys-apps/grep-3.12 (macaroni-os/kit-fixups#593 review, thread
    # 4583240302: N merge conditions == N selector'd packages entries).
    - grep:
        selector:
          - '>=3.11'
          - '<3.12'

    # Current track: the dirlisting tip (grep-3.12 as of conversion), the
    # >=sys-apps/grep-3.12 line of the merge atom.
    - grep:
        selector:
          - '>=3.12'

less:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    dir:
      url: https://www.greenwoodsoftware.com/less/download.html
      matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)*\.tar\.gz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    # Upstream publishes a download page, not a directory autoindex; the
    # generator joins dir.url + href verbatim (mark-devkit 0.36.1
    # builtin_dirlisting.go), so pin the dist URL explicitly (libcap/elfutils
    # precedent).
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
        url: 'https://www.greenwoodsoftware.com/less/{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
    vars:
      desc: Excellent text file viewer
      homepage: http://www.greenwoodsoftware.com/less/
      license: '|| ( GPL-3 BSD-2 )'
      iuse: pcre unicode
      # Same dependency set for build and run as the tree ebuild's DEPEND
      # with RDEPEND="${DEPEND}"; literals live in rdepend because the
      # template emits RDEPEND before DEPEND.
      rdepend: |
        >=app-misc/editor-wrapper-3
        >=sys-libs/ncurses-5.2:0=
        pcre? ( dev-libs/libpcre2 )
        sys-apps/groff
      depend: '${RDEPEND}'
      body: |
        src_configure() {
          export ac_cv_lib_ncursesw_initscr=$(usex unicode)
          export ac_cv_lib_ncurses_initscr=$(usex !unicode)
          local myeconfargs=(
            --with-regex=$(usex pcre pcre2 posix)
            --with-editor=/usr/libexec/editor
          )
          econf "${myeconfargs[@]}"
        }
        src_install() {
          default
          newbin "${FILESDIR}"/lesspipe-r1.sh lesspipe
          newenvd "${FILESDIR}"/less.envd 70less
        }

  packages:
    # 668 line: the merge atom carries conditions '>=sys-apps/less-668' +
    # '<sys-apps/less-678' (core-kit@mark-unstable/mark-xl/mark-iii/mark-31/
    # mark-v all serve less-668.ebuild), so this entry carries the matching
    # selector and is GENERATED like the tip track. Upstream's download page
    # currently jumps from 661 to 678 - no href for any 662..677 release, even
    # though the tarballs are still served (less-668.tar.gz answers HTTP 200) -
    # so the candidate comes from `versions` (the merged pxz spelling), which
    # the dirlisting generator reads as the candidate set, while the selector
    # still bounds it: pinning '661' here instead selects nothing (probe in the
    # PR body), so a future release can never silently move this line off 668.
    - less:
        selector:
          - '>=668'
          - '<678'
        vars:
          versions:
            - '668'

    # Current line: the download-page tip (less-710 as of this round), the
    # '>=sys-apps/less-678' line of the merge atom.
    - less:
        selector:
          - '>=678'

minizip_ng:
  generator: builtin-github

  defaults:
    category: sys-libs
    template: ../../templates/simple.tmpl

    github:
      user: zlib-ng

    # Upstream has never published a pre-release (probed 2026-11-15: 45/45
    # releases and 86/86 tags, zero rc/beta); keep the filter so a future
    # 4.3.0-rc can never be picked up by the floating track.
    exclude:
      - 'rc'
      - 'beta'

    vars:
      inherit:
        - cmake
      desc: Fork of the popular zip manipulation library found in the zlib distribution.
      homepage: https://github.com/zlib-ng/minizip-ng
      license: ZLIB
      slot: '0'
      iuse: compat openssl zstd
      # minizip-ng automagically prefers sys-libs/zlib-ng when it is installed,
      # so depend on it explicitly: it is the better-tested zlib here. The
      # compat USE flag provides zlib's own minizip API, so it blocks on it.
      rdepend: |-
        app-arch/bzip2
        app-arch/xz-utils
        sys-libs/zlib-ng
        virtual/libiconv
        compat? ( !sys-libs/zlib[minizip] )
        openssl? ( dev-libs/openssl:= )
        zstd? ( app-arch/zstd:= )
      depend: |-
        ${RDEPEND}
      body: |
        post_src_unpack() {
          mv ${WORKDIR}/{{ .Values.github_user }}-{{ .Values.github_repo }}-* ${S} || die
        }

        src_configure() {
          local mycmakeargs=(
            -DMZ_COMPAT=$(usex compat)


            -DMZ_FETCH_LIBS=OFF
            -DMZ_FORCE_FETCH_LIBS=OFF

            # Compression library options
            -DMZ_ZLIB=ON
            -DMZ_BZIP2=ON
            -DMZ_LZMA=ON
        {{- if .Values.no_ppmd }}
            # The PPMD codec (4.2.0+) git-clones ip7z/7zip during configure:
            # that clone_repo() call is not gated by MZ_FETCH_LIBS, so it
            # cannot be satisfied under network-sandbox, and the 4.0.x line
            # this package was built from has no PPMD support at all. Keep the
            # codec off until its sources ship as a tracked distfile.
            -DMZ_PPMD=OFF
        {{- end }}
            -DMZ_ZSTD=$(usex zstd)
            -DMZ_LIBCOMP=OFF

            # Encryption support options
            -DMZ_PKCRYPT=ON
            -DMZ_WZAES=ON
            -DMZ_OPENSSL=$(usex openssl)
            # MZ_LIBBSD -- Builds with libbsd crypto random
            # Turning this option on breaks compilation on Funtoo next
            -DMZ_LIBBSD=OFF
            -DMZ_SIGNING=ON

            # Character conversion options
            -DMZ_ICONV=ON
          )

          cmake_src_configure
        }

        src_install() {
          cmake_src_install

          if use compat ; then
            ewarn "minizip-ng is experimental and replacing the system zlib[minizip] is dangerous"
            ewarn "Please be careful!"
          fi
        }

  packages:
    # 4.0.x track: the release line still served in-tree and on the release
    # branches (mark-31 carries 4.0.9 + 4.0.10, mark-iii carries 4.0.8).
    # PPMD does not exist here, so the codec stays untouched.
    - minizip-ng:
        selector:
          - '>=4.0.0'
          - '<4.0.10'

    # current track: floats the upstream tip within the 4.x line. Upstream
    # pins SOVERSION 4 for all of 4.x (CMakeLists set(SOVERSION "4") on both
    # 4.0.10 and 4.2.2), so the library is ABI-stable inside the major and
    # SLOT=0 holds; 5.0+ needs a slot review before it can be tracked.
    - minizip-ng:
        selector:
          - '>=4.0.10'
          - '<5.0.0'
        vars:
          no_ppmd: true
groff:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    dir:
      url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
      matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.gz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    vars:
      desc: Text formatter used for man pages
      homepage: https://www.gnu.org/software/groff/groff.html
      license: GPL-2
      iuse: examples uchardet X
      inherit:
        - toolchain-funcs
      docs:
        - BUG-REPORT
        - ChangeLog
        - MORE.STUFF
        - NEWS
        - PROBLEMS
        - PROJECTS
        - README
        - TODO
      # utf8 hyphen handling in the man/mdoc local macros (tree payload, kept byte-identical)
      patches:
        - groff-1.19.2-man-unicode-dashes.patch
      rdepend: |
        uchardet? ( app-i18n/uchardet )
        X? (
          x11-libs/libICE
          x11-libs/libSM
          x11-libs/libX11
          x11-libs/libXaw
          x11-libs/libXmu
          x11-libs/libXt
        )
      depend: '${RDEPEND}'
      bdepend: |
        dev-lang/perl
        sys-apps/texinfo
      body: |
        src_prepare() {
          default

          # Honor the MacaroniOS docdir
          sed -i -e "s|^docdir =.*|docdir = \"/usr/share/doc/${PF}\"|g" \
            Makefile.in \
            || die "failed to modify Makefile.in"

          # OS stamp rendered into man page headers
          cat <<-EOF >> tmac/mdoc.local || die
          .ds volume-operating-system MacaroniOS
          .ds operating-system MacaroniOS/${KERNEL}
          .ds default-operating-system MacaroniOS/${KERNEL}
          EOF

          # make sure we don't get a crappy `g' nameprefix on UNIX systems with real
          # troff (GROFF_G macro runs some test to see, its own troff doesn't satisfy)
          sed -i -e 's/^[ \t]\+g=g$/g=/' configure || die
        }
        src_configure() {
          local myeconfargs=(
            --with-appdefdir="/usr/share/X11/app-defaults"
            --without-compatibility-wrappers   # no Prefix support in the MacaroniOS trees; keep tree behavior
            $(use_with uchardet)
            $(use_with X x)
          )

          econf "${myeconfargs[@]}"
        }
        src_compile() {
          emake AR="$(tc-getAR)"
        }
        src_install() {
          default

          # The following links are required for man
          dosym eqn /usr/bin/geqn
          dosym tbl /usr/bin/gtbl

          if ! use examples ; then
            # The pdf files might not be generated if ghostscript is unavailable
            local pdf="${ED}/usr/share/doc/${PF}/examples/mom/mom-pdf.pdf"
            if [[ -e ${pdf} ]] ; then
              # Keep mom-pdf.pdf since it's more of a manual than an example
              mv "${pdf}" "${ED}/usr/share/doc/${PF}/pdf/" || die
            fi
            rm -rf "${ED}/usr/share/doc/${PF}/examples"
          fi
        }
  packages:
    # Legacy 1.23.0 line: still served in-tree and on the release branches
    # (core-kit@mark-unstable/mark-xl/mark-iii/mark-31/mark-i/mark-v all carry
    # exactly groff-1.23.0.ebuild, contents API 2026-11-16). The merge atom
    # defines this line with conditions '>=sys-apps/groff-1.23.0' +
    # '<sys-apps/groff-1.24', so this entry mirrors that bound verbatim
    # (macaroni-os/kit-fixups#596 review, thread 4592459818: N merge
    # conditions == N selector'd packages entries — the merged grep shape of
    # macaroni-os/kit-fixups#593). The GARR listing still carries
    # groff-1.23.0.tar.gz (probed), so the candidate needs no `versions`
    # pin: the selector alone bounds this line to 1.23.0.
    - groff:
        selector:
          - '>=1.23.0'
          - '<1.24'

    # Current track: the dirlisting tip (groff-1.25.0 as of conversion), the
    # '>=sys-apps/groff-1.24' line of the merge atom.
    - groff:
        selector:
          - '>=1.24'

file:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    dir:
      url: 'https://astron.com/pub/{{ .Values.pn }}/'
      matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.tar\.gz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    vars:
      desc: Identify a file's format by scanning binary data for patterns
      homepage: https://www.darwinsys.com/file/
      license: BSD-2
      iuse: bzip2 lzma python seccomp static-libs zlib
      inherit:
        - libtool
        - toolchain-funcs
      # sys-apps/grep backs the src_prepare getcwd guard in the seccomp sed
      bdepend: sys-apps/grep
      # The compression libs are USE-conditional build+runtime dependencies,
      # not extra distfiles, so they stay deps (no assets: keys). simple.tmpl
      # renders RDEPEND before DEPEND, so both are spelled out as literals
      # (libedit pattern): RDEPEND = DEPEND + the runtime-only seccomp dep.
      # The Python bindings are not part of this package anymore - they moved
      # to the file_python definition below (macaroni-os/kit-fixups#603 review).
      depend: |
        bzip2? ( app-arch/bzip2 )
        lzma? ( app-arch/xz-utils )
        zlib? ( >=sys-libs/zlib-1.2.8-r1 )
      rdepend: |
        bzip2? ( app-arch/bzip2 )
        lzma? ( app-arch/xz-utils )
        zlib? ( >=sys-libs/zlib-1.2.8-r1 )
        seccomp? ( sys-libs/libseccomp )
      # The bindings package pulls this one in at runtime, so the parent pulls
      # it in as a PDEPEND: that keeps Python out of the build-time closure of a
      # core package (macaroni-os/kit-fixups#603 review 4583309456), the same
      # shape as the merged sys-apps/util-linux entry.
      pdepend: python? ( ~sys-apps/file-python-{{ .Values.pv }} )
      body: |
        src_prepare() {
          # Allow getcwd in file's own seccomp filter so the portage
          # sandbox keeps working during the build.
          if ! $(grep getcwd src/seccomp.c) ; then
            sed -i -e "/ALLOW_RULE(writev)/s@\$@\n\tALLOW_RULE(getcwd);\t// Used by Gentoo's portage sandbox@" \
              src/seccomp.c || die
          fi
          default
          elibtoolize
        }
        src_configure() {
          local myeconfargs=(
            --enable-fsect-man5
            $(use_enable bzip2 bzlib)
            $(use_enable lzma xzlib)
            $(use_enable seccomp libseccomp)
            $(use_enable static-libs static)
            $(use_enable zlib)
          )
          econf "${myeconfargs[@]}"
        }
        src_install() {
          default
          dodoc ChangeLog MAINT

          # Required for `file -C`
          insinto /usr/share/misc/magic
          doins -r magic/Magdir/*
          find "${ED}" -type f -name "*.la" -delete || die
        }

  packages:
    # 5.46 line: still served on the release branches (core-kit@mark-xl,
    # mark-iii, mark-31 and mark-v carry file-5.46-r1; mark-unstable and
    # mark-i carry file-5.46). Mirrors the merge atom conditions
    # '>=sys-apps/file-5.46' + '<sys-apps/file-5.47'.
    - file:
        selector:
          - '>=5.46'
          - '<5.47'

    # Current line: the astron.com listing tip (5.48 as of this round), the
    # '>=sys-apps/file-5.47' line of the merge atom.
    - file:
        selector:
          - '>=5.47'

file_python:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    # Same upstream tarball as the parent: the listing, matcher and transforms
    # carry the literal 'file-' prefix here because .Values.pn is file-python
    # (the sys-apps/util-linux-python shape).
    dir:
      url: 'https://astron.com/pub/file/'
      matcher: 'file-[0-9]+(\.[0-9]+)+\.tar\.gz$'
    transform:
      - kind: string
        match: 'file-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
    vars:
      desc: Python bindings for the libmagic library
      homepage: https://www.darwinsys.com/file/
      license: BSD-2
      python_compat: python3+
      required_use: ${PYTHON_REQUIRED_USE}
      inherit:
        - distutils-r1
      # Pure-ctypes bindings (python/magic.py): they need the parent's libmagic
      # at runtime and setuptools at build time; the version pin lives on this
      # side so the PDEPEND of the parent stays cycle-free.
      rdepend: |
        ${PYTHON_DEPS}
        ~sys-apps/file-{{ .Values.pv }}
      depend: |
        ${RDEPEND}
        dev-python/setuptools[${PYTHON_USEDEP}]
      # the tarball root is file-<PV>; the bindings live in its python/ dir
      s: '${WORKDIR}/file-{{ .Values.pv }}/python'
  packages:
    # Both served lines, with the selectors of the parent file: entries above
    # (macaroni-os/ai-agent-playbook#27: N merge conditions == N entries).
    - file-python:
        selector:
          - '>=5.46'
          - '<5.47'

    - file-python:
        selector:
          - '>=5.47'
# sys-apps/sysvinit dual-line spec: own definition key (kit-fixups#608 review 4580756429)
# so the <3.0 line and the new releases each get their own selector; the shared spec,
# vars and body (byte-identical between the lines) live once under defaults; entries
# keep only their deltas (selector bound, distfile origin, per-track patches).
sysvinit:
  generator: builtin-github
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    # Upstream moved from the savannah download area (frozen at 3.04,
    # 2022-04-26) to the GitHub repo designated on the savannah project
    # page, so version discovery follows GitHub tags (releases only cover
    # 3.01+). The distfile stays the official savannah .tar.xz whose
    # unpack root is ${P} (GitHub tag archives would be .tar.gz named
    # with the tag and unpack as <repo>-<sha>; the .tar.xz anchor also
    # keeps the tree distfile name/hash, see macaroni-os/mark-issues#912).
    github:
      user: slicer69
      query: tags
    exclude:
      - '-beta'
    vars:
      license: GPL-2
      desc: /sbin/init - parent of all processes
      homepage: https://savannah.nongnu.org/projects/sysvinit
      iuse: selinux ibm static
      inherit:
        - toolchain-funcs
        - flag-o-matic
      cdepend: |
        selinux? (
          >=sys-libs/libselinux-1.28
        )
      depend: |
        ${CDEPEND}
        virtual/os-headers
      rdepend: |
        ${CDEPEND}
        selinux? ( sec-policy/selinux-shutdown )
        !<sys-apps/openrc-0.13
      body: |
        {{- if .Values.gh_tarball }}post_src_unpack() {
          mv {{ .Values.github_user }}-{{ .Values.github_repo }}-* "${S}"
        }
        {{ end -}}
        src_prepare() {
          default

          sed -i \
            -e '/^CPPFLAGS =$/d' \
            -e '/^override CFLAGS +=/s/ -fstack-protector-strong//' \
            src/Makefile || die

          # last/lastb/mesg/mountpoint/sulogin/utmpdump/wall have moved to util-linux
          sed -i -r \
            -e '/^(USR)?S?BIN/s:\<(last|lastb|mesg|mountpoint|sulogin|utmpdump|wall)\>::g' \
            -e '/^MAN[18]/s:\<(last|lastb|mesg|mountpoint|sulogin|utmpdump|wall)[.][18]\>::g' \
            src/Makefile || die

          # pidof has moved to >=procps-3.3.9
          sed -i -r \
            -e '/\/bin\/pidof/d' \
            -e '/^MAN8/s:\<pidof.8\>::g' \
            src/Makefile || die

          # logsave is already in e2fsprogs
          sed -i -r \
            -e '/^(USR)?S?BIN/s:\<logsave\>::g' \
            -e '/^MAN8/s:\<logsave.8\>::g' \
            src/Makefile || die

          # Mung inittab for specific architectures
          cd "${WORKDIR}" || die
          cp "${FILESDIR}"/inittab-2.95 inittab || die "cp inittab"
          local insert=()
          use ppc && insert=( '#psc0:12345:respawn:/sbin/agetty 115200 ttyPSC0 linux' )
          use arm && insert=( '#f0:12345:respawn:/sbin/agetty 9600 ttyFB0 vt100' )
          use arm64 && insert=( 'f0:12345:respawn:/sbin/agetty 9600 ttyAMA0 vt100' )
          use hppa && insert=( 'b0:12345:respawn:/sbin/agetty 9600 ttyB0 vt100' )
          use s390 && insert=( 's0:12345:respawn:/sbin/agetty 38400 console dumb' )
          if use ibm ; then
            insert+=(
              '#hvc0:2345:respawn:/sbin/agetty -L 9600 hvc0'
              '#hvsi:2345:respawn:/sbin/agetty -L 19200 hvsi0'
            )
          fi
          (use arm || use mips || use sh || use sparc) && sed -i '/ttyS0/s:#::' inittab
          if use x86 || use amd64 ; then
            sed -i \
              -e '/ttyS[01]/s:9600:115200:' \
              inittab
          fi
          if [[ ${#insert[@]} -gt 0 ]] ; then
            printf '%s\n' '' '# Architecture specific features' "${insert[@]}" >> inittab
          fi
        }

        src_compile() {
          tc-export CC
          append-lfs-flags
          export DISTRO=
          export VERSION="${PV}"
          use static && append-ldflags -static
          emake -C src $(usex selinux 'WITH_SELINUX=yes' '')
        }

        src_install() {
          emake -C src install ROOT="${D}"
          dodoc README doc/*

          insinto /etc
          doins "${WORKDIR}"/inittab

          # dead symlink
          rm "${ED}"/usr/bin/lastb || die

          newinitd "${FILESDIR}"/bootlogd.initd bootlogd
        }

        pkg_postinst() {
          # Reload init to fix unmounting problems of / on next reboot.
          # This is really needed, as without the new version of init cause init
          # not to quit properly on reboot, and causes a fsck of / on next reboot.
          if [[ "${ROOT}" == "/" ]] || [[ "${ROOT}" == "" ]]; then
            if [[ -e /dev/initctl && ! -e /run/initctl ]]; then
              ln -s /dev/initctl /run/initctl
            fi
            # Do not return an error if this fails
            /sbin/telinit U &>/dev/null
          fi

          elog "The last/lastb/mesg/mountpoint/sulogin/utmpdump/wall tools have been moved to"
          elog "sys-apps/util-linux. The pidof tool has been moved to sys-process/procps."

          # Required for new bootlogd service
          if [[ ! -e "${EROOT}/var/log/boot" ]] ; then
            touch "${EROOT}/var/log/boot"
          fi
        }
  packages:
    # Freeze the 2.x line (macaroni-os/mark-issues#912): the tree-shipped
    # shutdown-h patch (standalone -h/-P/-H, bug 449354) fails its man-page
    # hunk on every version from 2.99 on and is NOT absorbed upstream
    # (patch -R dry-run fails even at tag 3.15), while the kexec patch
    # conflicts from 3.08 where upstream re-implemented kexec itself.
    # From 3.12 the Makefile installs pidof as $(base_bindir)/pidof, so the
    # ebuild /bin/pidof prune below is a silent no-op there. Verified with
    # patch -p1 --dry-run/-R --dry-run across tags 2.95..3.15 (PR evidence).
    # The 3.x line rides the separate entry below (unpatched, tag-tarball
    # distfile); measured at 3.15: merge rc=0 and the only installed-file delta
    # vs 2.95-r1 is the new /bin/pidof -> /sbin/killall5 symlink; procps keeps
    # /usr/bin/pidof, so there is no file collision on the current tree.
    - sysvinit:
        selector:
          - '<2.99'
        assets:
          - name: '{{ .Values.p }}.tar.xz'
            url: 'https://download.savannah.nongnu.org/releases/sysvinit/{{ .Values.p }}.tar.xz'
        vars:
          patches:
            - sysvinit-2.86-kexec.patch
            - sysvinit-2.94_beta-shutdown-single.patch
            - sysvinit-2.95_beta-shutdown-h.patch
    # New 3.x line (selector >=3.0): upstream re-implemented kexec from 3.08, the
    # 2.95_beta shutdown-h man hunks never apply from 2.99 on and the savannah area is
    # frozen at 3.04, so this track ships without the 2.x patches (patches: []) and
    # takes the builtin-github tag-tarball recovery instead of the pinned savannah
    # asset (gh_tarball: true renders the unpack-root mv).
    - sysvinit:
        selector:
          - '>=3.0'
        vars:
          patches: []
          gh_tarball: true

# GNU make — the build tool behind every autoconf/automake package in every
# kit. Converted merge-only -> autogen per macaroni-os/mark-issues#919.
#
# Two release lines (macaroni-os/kit-fixups#611 review), mirroring the merged
# sysvinit and patch shapes in this file: the common body/deps live ONCE in
# defaults.vars and each packages: entry carries only its line-specific keys
# (selector, revision, patches).
#   * stable 4.2.x line (selector >=4.2,<4.3, revision 4): what every branch
#     serves today — mark-unstable, mark-iii and mark-xl all carry
#     make-4.2.1-r4. The merge.kit.d/core_autogen.yml conditions keep this
#     line served on the release branches; moving >=4.3 there is a whole-kit
#     rebuild-sweep call that stays with the maintainers (4.3/4.4 changed
#     pattern-rule and intermediate handling, the jobserver protocol, SHELL
#     selection and .NOTINTERMEDIATE behavior).
#   * tip line (selector >=4.3): mark-unstable floats forward here and the
#     generator auto-tracks it (GNU make 4.4.1, 2023-02-26, at conversion).
#     The 4.2.x patches are not carried on this track (patches: []) — the
#     glob/perl526/pselect fixes are absorbed upstream and the darwin/cxx
#     house patches conflict (patch --dry-run against 4.4.1 fails; PR
#     evidence). The guile USE stays declared on both lines for ebuild
#     parity; note upstream removed the guile extension itself in 4.4, where
#     the configure flag degrades to a warning — simplifying the tip-side
#     IUSE is a possible follow-up.
#
# Upstream probe 2026-11-15, https://ftp.gnu.org/gnu/make/ (full listing,
# 47 entries): tip is make-4.4.1 (2023-02-26, .tar.gz/.tar.lz), then 4.4
# (2022-10-31) and 4.3 (2020-01-19). The 4.2 line: 4.2 (2016-05-22) and
# 4.2.1 (2016-06-10). >=4.3 ships no .tar.bz2 at all (the tree distfile for
# 4.2.1 is .tar.bz2), so the tip entry overrides the bz2-anchored
# matcher/transform pair with a gz-anchored one; the 4.2 line keeps the
# defaults pair byte-identical to the served ebuild.
# make pre-releases use .9x versions (make-4.2.90 … 4.4.0.91) and live only
# on alpha.gnu.org, never in the stable directory scanned here; the
# dir.exclude regexes pre-filter them should that ever change. (A
# github-style match: key is inert for builtin-dirlisting — no Match field
# on AutogenDirlistingProps in mark-devkit 0.36.1 — so the guards sit on
# dir.exclude, which the generator does compile.) GitHub carries no
# first-party make releases (gnu-mirror-unofficial/make: 0 releases, 0
# tags), hence builtin-dirlisting and not builtin-github. GARR mirror
# chosen per this file's existing GNU cluster: sha512 AND blake2b of
# gnuftp.mirror.garr.it/make/make-4.2.1.tar.bz2 are byte-identical to the
# tree Manifest digests (verified 2026-11-15).
make:
  generator: builtin-dirlisting

  defaults:
    category: sys-devel
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    dir:
      url: 'https://gnuftp.mirror.garr.it/{{ .Values.pn }}/'
      matcher: '{{ .Values.pn }}-[0-9]+(\.[0-9]+)+\.{{ .Values.tarball_ext }}$'
      # pre-release guard: .9x betas (make-4.2.90.tar.bz2/4.4.0.91.tar.gz) never wanted
      exclude: '\.9[0-9]+.*\.{{ .Values.tarball_ext }}$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.{{ .Values.tarball_ext }}'
        replace: ''
    vars:
      desc: Standard tool to compile source trees
      homepage: https://www.gnu.org/software/make/make.html
      license: GPL-3+
      iuse: guile nls static
      inherit:
        - flag-o-matic
      # CDEPEND renders first in simple.tmpl, so the refs below resolve
      cdepend: |
        guile? ( >=dev-scheme/guile-1.8:= )
      rdepend: |
        ${CDEPEND}
        nls? ( virtual/libintl )
      depend: |
        ${CDEPEND}
        nls? ( sys-devel/gettext )
      body: |
        {{- if .Values.special_prepare }}src_prepare() {
          default
          # These patches require special handling as they modify configure.ac
          # which in turn triggers maintainer-mode when being applied the
          # usual way.
          eapply -Z "${FILESDIR}"/make-4.2.1-glob-v2.patch \
            "${FILESDIR}"/{{ .Values.p }}-guile-2.2.patch
        }
        {{ end -}}
        src_configure() {
          use static && append-ldflags -static
          local myeconfargs=(
            --program-prefix=g
            $(use_with guile)
            $(use_enable nls)
          )
          econf "${myeconfargs[@]}"
        }
        src_install() {
          emake DESTDIR="${D}" install
          dodoc AUTHORS NEWS README*
          if [[ ${USERLAND} == "GNU" ]] ; then
            # we install everywhere as 'gmake' but on GNU systems,
            # symlink 'make' to 'gmake'
            dosym gmake /usr/bin/make
            dosym gmake.1 /usr/share/man/man1/make.1
          fi
        }

  packages:

    # Stable 4.2.x line: the selection every branch serves today
    # (make-4.2.1-r4). Selector bounds mirror the merge atom's conditions
    # one-for-one. The five PATCHES entries plus the two configure.ac
    # patches applied through the guarded src_prepare (special_prepare,
    # maintainer-mode trap) are 4.2.x-only.
    - make:
        selector:
          - '>=4.2'
          - '<4.3'
        revision: 4
        vars:
          tarball_ext: tar.bz2
          special_prepare: true
          patches:
            - make-3.82-darwin-library_search-dylib.patch
            - make-4.2-default-cxx.patch
            - make-4.2.1-perl526.patch
            - make-4.2.1-glob-internals.patch
            - make-4.2.1-pselect-non-blocking.patch

    # Tip line: the generator floats to the GNU make tip (4.4.1 at
    # conversion). No .tar.bz2 exists at >=4.3 on the mirror, so this entry
    # pins only tarball_ext: tar.gz and the shared dir/transform pair above
    # renders it; patches: [] because the 4.2.x set does not apply
    # (dry-run conflicts, fixes absorbed). mark-iii/mark-xl keep the stable
    # line above until the >=4.3 rebuild sweep is decided.
    - make:
        selector:
          - '>=4.3'
        vars:
          tarball_ext: tar.gz
          patches: []
