sources:
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-testing"
  #commit_sha1: "1456ea54c3efae418e8de419af2ea1b66ab2cbaa"

- name: "core-server-kit"
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: "mark-testing"

- name: "core-hw-kit"
  url: "https://github.com/macaroni-os/core-hw-kit"
  branch: "mark-testing"

- name: "perl-kit"
  url: "https://github.com/macaroni-os/perl-kit"
  branch: "mark-testing"

- name: "python-kit"
  url: "https://github.com/macaroni-os/python-kit"
  branch: "mark-testing"

- name: "python-modules-kit"
  url: "https://github.com/macaroni-os/python-modules-kit"
  branch: "mark-testing"

- name: "security-kit"
  url: "https://github.com/macaroni-os/security-kit"
  branch: "mark-testing"

target:
  name: core-kit
  url: "https://github.com/macaroni-os/core-kit"
  branch: mark-unstable

  metadata:
    # layout_masters: "core-kit"
    # Normally aliases are needed only in the core-kit kit.
    aliases:
      - gentoo

    manifest_hashes:
      - BLAKE2B
      - SHA512

    manifest_required_hashes:
      - SHA512

  fixups:
    include:
      - dir: ../../static/licenses
        to: licenses

      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

      - dir: ../profiles/
        to: profiles
        keep_files:
          # Avoid to remove generated files.
          - categories$
          - repo_name$
          - thirdpartymirrors$

      - dir: ../../eclass/
        to: eclass

      - dir: ../sets/
        to: sets

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: sys-devel/binutils:2.40
    - pkg: sys-libs/binutils-libs

    - pkg: app-arch/bzip2
    - pkg: app-arch/cpio
    - pkg: app-arch/dpkg
    - pkg: app-arch/gzip
    - pkg: app-arch/libarchive
    - pkg: app-arch/lz4
    - pkg: app-arch/pax
    - pkg: app-arch/pxz
    - pkg: app-arch/rar
    - pkg: app-arch/tar
    - pkg: app-arch/snappy
    - pkg: app-arch/unzip
    - pkg: app-arch/xz-utils
    - pkg: app-arch/zstd

    - pkg: app-shells/bash
    - pkg: app-shells/dash
    - pkg: app-shells/tcsh
    - pkg: app-shells/zsh

    - pkg: dev-libs/libpcre
    - pkg: dev-libs/libsigc++:2
    - pkg: dev-libs/libsigc++:3
    - pkg: dev-libs/gmp


    - pkg: dev-libs/libpcre2

    - pkg: net-dns/libidn2

    - pkg: sys-apps/baselayout
    - pkg: sys-apps/diffutils
    - pkg: sys-apps/file
    - pkg: sys-apps/findutils
    - pkg: sys-apps/gawk
    - pkg: sys-apps/grep
    - pkg: sys-apps/groff
    - pkg: sys-apps/less
    - pkg: sys-apps/sed
    - pkg: sys-apps/sysvinit
    - pkg: sys-apps/util-linux

    - pkg: sys-devel/automake:1.16
    - pkg: sys-devel/autoconf:2.1
    - pkg: sys-devel/autoconf:2.69
    - pkg: sys-devel/autoconf:latest
    - pkg: sys-devel/libtool:2
    - pkg: sys-devel/gnuconfig
    - pkg: sys-devel/m4
    - pkg: sys-devel/make
    - pkg: sys-devel/patch

    - pkg: sys-libs/minizip-ng
    - pkg: sys-libs/ncurses
    - pkg: sys-libs/readline
    - pkg: sys-libs/timezone-data
    - pkg: sys-libs/zlib
    - pkg: sys-libs/zlib-ng
