sources:
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-kit
  url: "https://github.com/macaroni-os/core-kit"
  branch: mark-unstable

  metadata:
    # layout_masters: "core-kit"
    # Normally aliases are needed only in the core-kit kit.
    aliases:
      - gentoo

    manifest_hashes:
      - BLAKE2B
      - SHA512

    manifest_required_hashes:
      - SHA512

  thirdpartymirrors:
    # The following list is get from old tree.
    # Probably it needs a clean.

    - alias: 3dgamers
      uri:
        - ftp://ftp.planetmirror.com/pub/3dgamers/games/

    - alias: apache
      uri:
        - http://apache.claz.org/
        - http://apache.cs.utah.edu/
        - http://apache.ip-guide.com/
        - http://apache.mesi.com.ar/
        - http://apache.mirrors.hoobly.com/
        - http://apache.mirrors.ionfish.org/
        - http://apache.mirrors.lucidnetworks.net/
        - http://apache.mirrors.tds.net/
        - http://apache.osuosl.org/
        - http://apache.spinellicreations.com/
        - http://download.nextag.com/apache/
        - http://ftp.wayne.edu/apache/
        - http://mirror.cc.columbia.edu/pub/software/apache/
        - http://mirror.cogentco.com/pub/apache/
        - http://mirror.jax.hugeserver.com/apache/
        - http://mirror.metrocast.net/apache/
        - http://mirror.nexcess.net/apache/
        - http://mirror.olnevhost.net/pub/apache/
        - http://mirror.reverse.net/pub/apache/
        - http://mirror.stjschools.org/public/apache/
        - http://mirrors.advancedhosters.com/apache/
        - http://mirrors.gigenet.com/apache/
        - http://mirrors.ibiblio.org/apache/
        - http://mirrors.koehn.com/apache/
        - http://mirrors.ocf.berkeley.edu/apache/
        - http://mirrors.sonic.net/apache/
        - http://supergsego.com/apache/
        - http://www.gtlib.gatech.edu/pub/apache/
        - http://www.namesdir.com/mirrors/apache/
        - http://www.trieuvan.com/apache/
        - http://www.webhostingreviewjam.com/mirror/apache/
        - ftp://apache.cs.utah.edu/apache.org/
        - ftp://apache.mirrors.tds.net/pub/apache.org/
        - ftp://ftp.osuosl.org/pub/apache/
        - ftp://mirror.reverse.net/pub/apache/

    - alias: cpan
      uri:
        - http://cpan.metacpan.org
        - http://search.cpan.org/CPAN
        - http://www.cpan.org

    - alias: debian
      uri:
        - http://ftp.au.debian.org/debian/
        - http://ftp.at.debian.org/debian/
        - http://ftp.by.debian.org/debian/
        - http://ftp.be.debian.org/debian/
        - http://ftp.br.debian.org/debian/
        - http://ftp.bg.debian.org/debian/
        - http://ftp.ca.debian.org/debian/
        - http://ftp2.cn.debian.org/debian/
        - http://ftp.cn.debian.org/debian/
        - http://ftp.hr.debian.org/debian/
        - http://ftp.cz.debian.org/debian/
        - http://ftp.dk.debian.org/debian/
        - http://ftp.sv.debian.org/debian/
        - http://ftp.ee.debian.org/debian/
        - http://ftp.fi.debian.org/debian/
        - http://ftp.fr.debian.org/debian/
        - http://ftp2.de.debian.org/debian/
        - http://ftp.de.debian.org/debian/
        - http://ftp.gr.debian.org/debian/
        - http://ftp.hu.debian.org/debian/
        - http://ftp.is.debian.org/debian/
        - http://ftp.ie.debian.org/debian/
        - http://ftp.it.debian.org/debian/
        - http://ftp.jp.debian.org/debian/
        - http://ftp.kr.debian.org/debian/
        - http://ftp.lt.debian.org/debian/
        - http://ftp.mx.debian.org/debian/
        - http://ftp.md.debian.org/debian/
        - http://ftp.nl.debian.org/debian/
        - http://ftp.nc.debian.org/debian/
        - http://ftp.nz.debian.org/debian/
        - http://ftp.no.debian.org/debian/
        - http://ftp.pl.debian.org/debian/
        - http://ftp.pt.debian.org/debian/
        - http://ftp.ro.debian.org/debian/
        - http://ftp.ru.debian.org/debian/
        - http://ftp.sg.debian.org/debian/
        - http://ftp.sk.debian.org/debian/
        - http://ftp.si.debian.org/debian/
        - http://ftp.es.debian.org/debian/
        - http://ftp.se.debian.org/debian/
        - http://ftp.ch.debian.org/debian/
        - http://ftp.tw.debian.org/debian/
        - http://ftp.tr.debian.org/debian/
        - http://ftp.ua.debian.org/debian/
        - http://ftp.uk.debian.org/debian/
        - http://ftp.us.debian.org/debian/

    - alias: github
      uri:
        - https://github.com/downloads

    - alias: gnome
      uri:
        - https://download.gnome.org/

    - alias: gnu
      uri:
        - http://ftpmirror.gnu.org/
        - http://ftp.gnu.org/gnu/

    - alias: gnu-alpha
      uri:
        - ftp://alpha.gnu.org/gnu/
        - http://alpha.gnu.org/gnu/
        - ftp://ftp.funet.fi/pub/gnu/alpha/gnu/
        - http://www.nic.funet.fi/pub/gnu/alpha/gnu/
        - ftp://gnualpha.uib.no/pub/gnualpha/
        - http://gnualpha.uib.no/
        - ftp://mirrors.fe.up.pt/pub/gnu-alpha/
        - http://mirrors.fe.up.pt/pub/gnu-alpha/
        - http://mirror.lihnidos.org/GNU/alpha/gnu/
        - http://mirrors.ibiblio.org/gnu/alpha/gnu/

    - alias: gnupg
      uri:
        - ftp://ftp.gnupg.org/gcrypt/
        - http://mirrors.dotsrc.org/gcrypt/
        - http://artfiles.org/gnupg.org/
        - http://ftp.heanet.ie/mirrors/ftp.gnupg.org/gcrypt/
        - ftp://sunsite.icm.edu.pl/pub/security/gnupg/
        - http://gd.tuwien.ac.at/privacy/gnupg/
        - http://www.ring.gr.jp/pub/net/gnupg/
        - ftp://ftp.ring.gr.jp/pub/net/gnupg/

    - alias: kde
      uri:
        - https://download.kde.org
        - https://mirrors.xtom.com/kde
        - https://mirror.kumi.systems/kde/ftp
        - https://mirror.csclub.uwaterloo.ca/kde
        - ftp://mirrors.dotsrc.org/kde

    - alias: kernel
      uri:
        - http://www.kernel.org/pub

    - alias: lokigames
      uri:
        - http://updates.lokigames.com

    - alias: nongnu
      uri:
        - http://download.savannah.nongnu.org/releases/
        - http://ftp.cc.uoc.gr/mirrors/nongnu.org/
        - http://ftp.twaren.net/Unix/NonGNU/
        - http://mirror.csclub.uwaterloo.ca/nongnu/
        - ftp://mirror.csclub.uwaterloo.ca/nongnu/
        - http://mirrors.fe.up.pt/pub/nongnu/
        - ftp://mirrors.fe.up.pt/pub/nongnu/
        - http://nongnu.askapache.com/
        - http://nongnu.uib.no/
        - ftp://nongnu.uib.no/pub/nongnu/
        - http://savannah.c3sl.ufpr.br/
        - ftp://savannah.c3sl.ufpr.br/savannah-nongnu/
        - ftp://ftp.twaren.net/Unix/NonGNU/

    - alias: pypi
      uri:
        - https://pypi.python.org/packages/source
        - https://files.pythonhosted.org/packages/source

    - alias: quakeunity
      uri:
        - http://www.mirrorservice.org/sites/quakeunity.com

    - alias: sourceforge
      uri:
        - http://download.sourceforge.net

    - alias: sourceforge.jp
      uri:
        - http://iij.dl.sourceforge.jp
        - http://osdn.dl.sourceforge.jp
        - http://globalbase.dl.sourceforge.jp
        - http://jaist.dl.sourceforge.jp

    - alias: xorg
      uri:
        - https://www.x.org/releases/individual/
        - https://www.x.org/archive/individual/

    - alias: gentoo
      uri:
        # ATTENTION: Portage add /distfiles/ path by default on URL defined in GENTOO_MIRRORS
        #            but on thirdpartymirrors file we need the full path.
        - https://distfiles.macaronios.org/mark-distfiles/distfiles
        - https://distfiles.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/

        - http://gentoo.osuosl.org/distfiles
        - http://ftp.halifax.rwth-aachen.de/gentoo/distfiles

    - alias: funtoo
      uri:
        - https://distfiles.macaronios.org/mark-distfiles/distfiles
        - https://distfiles.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/

    - alias: macaroni
      uri:
        - https://distfiles.macaronios.org/mark-distfiles/distfiles
        - https://distfiles.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/

  fixups:
    include:
      - dir: ../../static/licenses
        to: licenses

      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

      - dir: ../profiles/
        to: profiles
        keep_files:
          # Avoid to remove generated files.
          - categories$
          - repo_name$
          - thirdpartymirrors$

      - dir: ../../eclass/
        to: eclass

      - dir: ../sets/
        to: sets

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: app-arch/brotli
    - pkg: app-arch/bzip2

    # capped at <1.22: dpkg >= 1.22 needs perl >= 5.32.1 and >= 1.23 needs
    # >= 5.36.0, the tree carries dev-lang/perl-5.32.0 (perl-kit)
    - pkg: app-arch/dpkg
      conditions:
        - '<app-arch/dpkg-1.22'

    # 1.13 track: still served on release branches carrying gzip-1.13
    - pkg: app-arch/gzip
      conditions:
        - '>=app-arch/gzip-1.13'
        - '<app-arch/gzip-1.14'

    # current stable track, auto-tracked by the generator
    - pkg: app-arch/gzip
      conditions:
        - '>=app-arch/gzip-1.14'

    - pkg: app-arch/libarchive
    - pkg: app-arch/lz4

    # 2.13 track: still served on release branches carrying cpio-2.13
    - pkg: app-arch/cpio
      conditions:
        - '>=app-arch/cpio-2.13'
        - '<app-arch/cpio-2.14'

    # current stable track, auto-tracked by the generator
    - pkg: app-arch/cpio
      conditions:
        - '>=app-arch/cpio-2.14'
    - pkg: app-arch/pax
    - pkg: app-arch/pxz
    # 5.6 track: still served in-tree and on release branches carrying xz-utils-5.6.x
    - pkg: app-arch/xz-utils
      conditions:
        - '>=app-arch/xz-utils-5.6.3'
        - '<app-arch/xz-utils-5.7'

    # current stable track, auto-tracked by the generator
    - pkg: app-arch/xz-utils
      conditions:
        - '>=app-arch/xz-utils-5.8'
    - pkg: app-arch/rar
    - pkg: app-arch/sharutils
    - pkg: app-arch/tar
    - pkg: app-arch/snappy

    - pkg: app-misc/ca-certificates
    - pkg: app-misc/mime-types
    - pkg: app-shells/bash

    # 0.5.12 track: still served on release branches carrying dash-0.5.12
    - pkg: app-shells/dash
      conditions:
        - '>=app-shells/dash-0.5.12'
        - '<app-shells/dash-0.5.13'

    # current stable track, auto-tracked by the generator
    - pkg: app-shells/dash
      conditions:
        - '>=app-shells/dash-0.5.13'

    - pkg: dev-libs/elfutils
    - pkg: dev-libs/expat
    - pkg: dev-libs/gmp
    # Python dep
    - pkg: dev-libs/libffi
    - pkg: dev-libs/libltdl
    - pkg: dev-libs/libxml2:2
    - pkg: dev-libs/icu

    - pkg: net-dns/libidn2
    # 1.23.0 track: still served in-tree and on release branches carrying groff-1.23.0
    - pkg: sys-apps/groff
      conditions:
        - '>=sys-apps/groff-1.23.0'
        - '<sys-apps/groff-1.24'

    # current stable track, auto-tracked by the generator
    - pkg: sys-apps/groff
      conditions:
        - '>=sys-apps/groff-1.24'

    - pkg: sys-apps/acl
    - pkg: sys-apps/attr
    - pkg: sys-apps/coreutils
    - pkg: sys-apps/debianutils

    # 3.10 track: still served in-tree and on release branches carrying diffutils-3.10
    - pkg: sys-apps/diffutils
      conditions:
        - '>=sys-apps/diffutils-3.10'
        - '<sys-apps/diffutils-3.11'

    # current stable track, auto-tracked by the generator
    - pkg: sys-apps/diffutils
      conditions:
        - '>=sys-apps/diffutils-3.12'

    # 4.9 track: still served in-tree and on release branches carrying sed-4.9
    - pkg: sys-apps/sed
      conditions:
        - '>=sys-apps/sed-4.9'
        - '<sys-apps/sed-4.10'

    # current stable track, auto-tracked by the generator
    - pkg: sys-apps/sed
      conditions:
        - '>=sys-apps/sed-4.10'

    # 5.1 track: still served on release branches carrying gawk-5.1.0
    - pkg: sys-apps/gawk
      conditions:
        - '>=sys-apps/gawk-5.1.0'
        - '<sys-apps/gawk-5.2'

    # current stable track, auto-tracked by the generator
    - pkg: sys-apps/gawk
      conditions:
        - '>=sys-apps/gawk-5.2'
    # 3.11 track: still served in-tree and on release branches carrying grep-3.11
    - pkg: sys-apps/grep
      conditions:
        - '>=sys-apps/grep-3.11'
        - '<sys-apps/grep-3.12'

    # current stable track, auto-tracked by the generator
    - pkg: sys-apps/grep
      conditions:
        - '>=sys-apps/grep-3.12'

    # 668 track: still served on release branches carrying less-668
    - pkg: sys-apps/less
      conditions:
        - '>=sys-apps/less-668'
        - '<sys-apps/less-678'

    # current stable track, auto-tracked by the generator
    - pkg: sys-apps/less
      conditions:
        - '>=sys-apps/less-678'

    # 5.46 track: still served on release branches carrying file-5.46-r1
    - pkg: sys-apps/file
      conditions:
        - '>=sys-apps/file-5.46'
        - '<sys-apps/file-5.47'

    # current stable track, auto-tracked by the generator
    - pkg: sys-apps/file
      conditions:
        - '>=sys-apps/file-5.47'

    # Python bindings split out of sys-apps/file (macaroni-os/kit-fixups#603
    # review 4583309456): the same two served lines as the parent atom, so
    # every release line gets its own generated bindings package.
    - pkg: sys-apps/file-python
      conditions:
        - '>=sys-apps/file-python-5.46'
        - '<sys-apps/file-python-5.47'

    - pkg: sys-apps/file-python
      conditions:
        - '>=sys-apps/file-python-5.47'
    - pkg: sys-apps/which
    - pkg: sys-apps/shadow
    # 2.x line: the 3.x tags break the shipped shutdown-h/kexec patches
    # (man hunks from 2.99, kexec re-implemented in 3.08) so the 2.x atoms stay
    # capped below 2.99; 2.99 itself is intentionally served on no line
    # (macaroni-os/mark-issues#912, kit-fixups#608 review 4580756429)
    - pkg: sys-apps/sysvinit
      conditions:
        - '<sys-apps/sysvinit-2.99'

    # new 3.x line: unpatched upstream releases from 3.0 up (kit-fixups#608)
    - pkg: sys-apps/sysvinit
      conditions:
        - '>=sys-apps/sysvinit-3.0'
    - pkg: sys-apps/util-linux
    - pkg: sys-apps/util-linux-python
    - pkg: sys-apps/locale-gen

    - pkg: sys-devel/autoconf-archive

    - pkg: sys-devel/gcc:12.3.0
    - pkg: sys-devel/gcc:14
    - pkg: sys-devel/gcc:15
    - pkg: sys-devel/gcc:16

    - pkg: sys-devel/gettext
    - pkg: sys-devel/libtool:2

    # 1.4.19 track: still served on release branches carrying m4-1.4.19
    - pkg: sys-devel/m4
      conditions:
        - '>=sys-devel/m4-1.4.19'
        - '<sys-devel/m4-1.4.20'

    # current stable track, auto-tracked by the generator
    - pkg: sys-devel/m4
      conditions:
        - '>=sys-devel/m4-1.4.20'
    # 4.2.x stable line — the selection every branch serves today
    # (make-4.2.1-r4). Kept bounded so the release branches stay on the
    # stable line while the 4.3+ line below floats forward
    # (macaroni-os/kit-fixups#611 review); the >=4.3 whole-kit rebuild-sweep
    # policy on the release branches stays a maintainer call
    # (macaroni-os/mark-issues#919). Generator rationale lives in
    # autogen.kit.d/core.yml.
    - pkg: sys-devel/make
      conditions:
        - '>=sys-devel/make-4.2'
        - '<sys-devel/make-4.3'

    # new 4.3+ line: mark-unstable floats here (generator tip 4.4.1 at
    # conversion, 2023-02-26); mark-iii/mark-xl keep 4.2.1-r4 via the
    # conditions above until the >=4.3 rebuild sweep is decided
    # (macaroni-os/kit-fixups#611 review, thread 4607038521).
    - pkg: sys-devel/make
      conditions:
        - '>=sys-devel/make-4.3'


    # 2.7.6 track: still served on release branches carrying patch-2.7.6
    # (mark-iii/mark-i/mark-v; mark-xl keeps it alongside the newer tracks)
    - pkg: sys-devel/patch
      conditions:
        - '>=sys-devel/patch-2.7.6'
        - '<sys-devel/patch-2.8'

    # 2.8 track: still served on release branches carrying patch-2.8-r1
    # (mark-31/mark-xl/mark-v) until the 2.8.1 tip propagates
    - pkg: sys-devel/patch
      conditions:
        - '>=sys-devel/patch-2.8'
        - '<sys-devel/patch-2.8.1'

    # current track, auto-tracked by the generator (GNU patch 2.8.1 tip)
    - pkg: sys-devel/patch
      conditions:
        - '>=sys-devel/patch-2.8.1'

    # 4.0.x track: still served in-tree and on the release branches
    # (mark-31 carries 4.0.9 + 4.0.10, mark-iii carries 4.0.8); kept by the
    # clean phase while the generator floats the 4.x tip.
    - pkg: sys-libs/minizip-ng
      conditions:
        - '>=sys-libs/minizip-ng-4.0.0'
        - '<sys-libs/minizip-ng-4.0.10'

    # current track, auto-tracked by the generator; capped at the SONAME
    # boundary (upstream keeps SOVERSION 4 across all of 4.x)
    - pkg: sys-libs/minizip-ng
      conditions:
        - '>=sys-libs/minizip-ng-4.0.10'
        - '<sys-libs/minizip-ng-5.0.0'

    - pkg: sys-libs/libcap
    - pkg: sys-libs/libcap-ng
    - pkg: sys-libs/glibc:2.2
    - pkg: sys-libs/timezone-data
    - pkg: sys-libs/zlib

    - pkg: sys-libs/ncurses

    - pkg: virtual/libffi
    - pkg: virtual/acl
    - pkg: virtual/awk
    - pkg: virtual/fortran
    - pkg: virtual/libc
    - pkg: virtual/libelf
    - pkg: virtual/libiconv
    - pkg: virtual/libintl
    - pkg: virtual/pager
    - pkg: virtual/shadow
    - pkg: virtual/tmpfiles

    # one track everywhere: mark-xl, mark-iii and mark-31 all serve
    # findutils-4.10.0 (core-kit contents API, 2026-11-15), so no bounded
    # legacy atom is needed; the unbounded atom follows the GNU ftp line
    # whose generator tip is 4.11.0.
    - pkg: sys-apps/findutils

    - pkg: app-arch/zstd

    - pkg: app-shells/tcsh

    - pkg: app-arch/unzip

    - pkg: dev-libs/libpcre2

    - pkg: app-shells/zsh

    - pkg: sys-libs/readline

    - pkg: sys-devel/gnuconfig
    # 2.x API line: upstream maintains 2.x and 3.x in parallel;
    # the tree carries slot 2 co-installed with slot 3.
    - pkg: dev-libs/libsigc++:2
        - '>=dev-libs/libsigc++-2.10'
        - '<dev-libs/libsigc++-3'
    # 3.x API line, auto-tracked by the generator
    - pkg: dev-libs/libsigc++:3
        - '>=dev-libs/libsigc++-3'

    - pkg: sys-libs/zlib-ng

    # 1.16 track: the kit carries automake:1.16 on mark-unstable, mark-xl,
    # mark-iii and mark-31. The generator caps the dirlisting selector below
    # 1.17 (upstream ships 1.17/1.18/1.19 and a major re-slot is not part of
    # macaroni-os/mark-issues#914), the same bound drives the clean/merge phases.
    - pkg: sys-devel/automake:1.16
      conditions:
        - '>=sys-devel/automake-1.16'
        - '<sys-devel/automake-1.17'

    - pkg: sys-devel/automake:1.19
      conditions:
        - '>=sys-devel/automake-1.19'
        - '<sys-devel/automake-1.20'

    - pkg: sys-devel/automake:1.20
      conditions:
        - '>=sys-devel/automake-1.20'
        - '<sys-devel/automake-1.21'

    # Pinned builtin-noop (distro content, no upstream). Unconditional:
    # every release branch carries baselayout-3.0-r1.
    - pkg: sys-apps/baselayout

    # The 2.40 line is the track served on every kit branch
    # (binutils-2.40_p5-r1): see the binutils package comment in
    # autogen.kit.d/core.yml.
    - pkg: sys-devel/binutils
      conditions:
        - '>=sys-devel/binutils-2.40_p5'

    # Skeleton package: patchless, no distfile, exact-pinned with
    # sys-devel/binutils-2.40_p5-r1 (see the binutils-libs entry in
    # autogen.kit.d/core.yml). Unconditional: every release branch serves
    # binutils-libs-2.40_p5-r1, so there is a single track to keep.
    - pkg: sys-libs/binutils-libs

    - pkg: sys-devel/autoconf:latest
