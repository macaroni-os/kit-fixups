sources:
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-kit
  url: "https://github.com/macaroni-os/core-kit"
  branch: mark-unstable

  metadata:
    # layout_masters: "core-kit"
    # Normally aliases are needed only in the core-kit kit.
    aliases:
      - gentoo

    manifest_hashes:
      - BLAKE2B
      - SHA512

    manifest_required_hashes:
      - SHA512

  thirdpartymirrors:
    # The following list is get from old tree.
    # Probably it needs a clean.

    - alias: 3dgamers
      uri:
        - ftp://ftp.planetmirror.com/pub/3dgamers/games/

    - alias: apache
      uri:
        - http://apache.claz.org/
        - http://apache.cs.utah.edu/
        - http://apache.ip-guide.com/
        - http://apache.mesi.com.ar/
        - http://apache.mirrors.hoobly.com/
        - http://apache.mirrors.ionfish.org/
        - http://apache.mirrors.lucidnetworks.net/
        - http://apache.mirrors.tds.net/
        - http://apache.osuosl.org/
        - http://apache.spinellicreations.com/
        - http://download.nextag.com/apache/
        - http://ftp.wayne.edu/apache/
        - http://mirror.cc.columbia.edu/pub/software/apache/
        - http://mirror.cogentco.com/pub/apache/
        - http://mirror.jax.hugeserver.com/apache/
        - http://mirror.metrocast.net/apache/
        - http://mirror.nexcess.net/apache/
        - http://mirror.olnevhost.net/pub/apache/
        - http://mirror.reverse.net/pub/apache/
        - http://mirror.stjschools.org/public/apache/
        - http://mirrors.advancedhosters.com/apache/
        - http://mirrors.gigenet.com/apache/
        - http://mirrors.ibiblio.org/apache/
        - http://mirrors.koehn.com/apache/
        - http://mirrors.ocf.berkeley.edu/apache/
        - http://mirrors.sonic.net/apache/
        - http://supergsego.com/apache/
        - http://www.gtlib.gatech.edu/pub/apache/
        - http://www.namesdir.com/mirrors/apache/
        - http://www.trieuvan.com/apache/
        - http://www.webhostingreviewjam.com/mirror/apache/
        - ftp://apache.cs.utah.edu/apache.org/
        - ftp://apache.mirrors.tds.net/pub/apache.org/
        - ftp://ftp.osuosl.org/pub/apache/
        - ftp://mirror.reverse.net/pub/apache/

    - alias: cpan
      uri:
        - http://cpan.metacpan.org
        - http://search.cpan.org/CPAN
        - http://www.cpan.org

    - alias: debian
      uri:
        - http://ftp.au.debian.org/debian/
        - http://ftp.at.debian.org/debian/
        - http://ftp.by.debian.org/debian/
        - http://ftp.be.debian.org/debian/
        - http://ftp.br.debian.org/debian/
        - http://ftp.bg.debian.org/debian/
        - http://ftp.ca.debian.org/debian/
        - http://ftp2.cn.debian.org/debian/
        - http://ftp.cn.debian.org/debian/
        - http://ftp.hr.debian.org/debian/
        - http://ftp.cz.debian.org/debian/
        - http://ftp.dk.debian.org/debian/
        - http://ftp.sv.debian.org/debian/
        - http://ftp.ee.debian.org/debian/
        - http://ftp.fi.debian.org/debian/
        - http://ftp.fr.debian.org/debian/
        - http://ftp2.de.debian.org/debian/
        - http://ftp.de.debian.org/debian/
        - http://ftp.gr.debian.org/debian/
        - http://ftp.hu.debian.org/debian/
        - http://ftp.is.debian.org/debian/
        - http://ftp.ie.debian.org/debian/
        - http://ftp.it.debian.org/debian/
        - http://ftp.jp.debian.org/debian/
        - http://ftp.kr.debian.org/debian/
        - http://ftp.lt.debian.org/debian/
        - http://ftp.mx.debian.org/debian/
        - http://ftp.md.debian.org/debian/
        - http://ftp.nl.debian.org/debian/
        - http://ftp.nc.debian.org/debian/
        - http://ftp.nz.debian.org/debian/
        - http://ftp.no.debian.org/debian/
        - http://ftp.pl.debian.org/debian/
        - http://ftp.pt.debian.org/debian/
        - http://ftp.ro.debian.org/debian/
        - http://ftp.ru.debian.org/debian/
        - http://ftp.sg.debian.org/debian/
        - http://ftp.sk.debian.org/debian/
        - http://ftp.si.debian.org/debian/
        - http://ftp.es.debian.org/debian/
        - http://ftp.se.debian.org/debian/
        - http://ftp.ch.debian.org/debian/
        - http://ftp.tw.debian.org/debian/
        - http://ftp.tr.debian.org/debian/
        - http://ftp.ua.debian.org/debian/
        - http://ftp.uk.debian.org/debian/
        - http://ftp.us.debian.org/debian/

    - alias: github
      uri:
        - https://github.com/downloads

    - alias: gnome
      uri:
        - https://download.gnome.org/

    - alias: gnu
      uri:
        - http://ftpmirror.gnu.org/
        - http://ftp.gnu.org/gnu/

    - alias: gnu-alpha
      uri:
        - ftp://alpha.gnu.org/gnu/
        - http://alpha.gnu.org/gnu/
        - ftp://ftp.funet.fi/pub/gnu/alpha/gnu/
        - http://www.nic.funet.fi/pub/gnu/alpha/gnu/
        - ftp://gnualpha.uib.no/pub/gnualpha/
        - http://gnualpha.uib.no/
        - ftp://mirrors.fe.up.pt/pub/gnu-alpha/
        - http://mirrors.fe.up.pt/pub/gnu-alpha/
        - http://mirror.lihnidos.org/GNU/alpha/gnu/
        - http://mirrors.ibiblio.org/gnu/alpha/gnu/

    - alias: gnupg
      uri:
        - ftp://ftp.gnupg.org/gcrypt/
        - http://mirrors.dotsrc.org/gcrypt/
        - http://artfiles.org/gnupg.org/
        - http://ftp.heanet.ie/mirrors/ftp.gnupg.org/gcrypt/
        - ftp://sunsite.icm.edu.pl/pub/security/gnupg/
        - http://gd.tuwien.ac.at/privacy/gnupg/
        - http://www.ring.gr.jp/pub/net/gnupg/
        - ftp://ftp.ring.gr.jp/pub/net/gnupg/

    - alias: kde
      uri:
        - https://download.kde.org
        - https://mirrors.xtom.com/kde
        - https://mirror.kumi.systems/kde/ftp
        - https://mirror.csclub.uwaterloo.ca/kde
        - ftp://mirrors.dotsrc.org/kde

    - alias: kernel
      uri:
        - http://www.kernel.org/pub

    - alias: lokigames
      uri:
        - http://updates.lokigames.com

    - alias: nongnu
      uri:
        - http://download.savannah.nongnu.org/releases/
        - http://ftp.cc.uoc.gr/mirrors/nongnu.org/
        - http://ftp.twaren.net/Unix/NonGNU/
        - http://mirror.csclub.uwaterloo.ca/nongnu/
        - ftp://mirror.csclub.uwaterloo.ca/nongnu/
        - http://mirrors.fe.up.pt/pub/nongnu/
        - ftp://mirrors.fe.up.pt/pub/nongnu/
        - http://nongnu.askapache.com/
        - http://nongnu.uib.no/
        - ftp://nongnu.uib.no/pub/nongnu/
        - http://savannah.c3sl.ufpr.br/
        - ftp://savannah.c3sl.ufpr.br/savannah-nongnu/
        - ftp://ftp.twaren.net/Unix/NonGNU/

    - alias: pypi
      uri:
        - https://pypi.python.org/packages/source
        - https://files.pythonhosted.org/packages/source

    - alias: quakeunity
      uri:
        - http://www.mirrorservice.org/sites/quakeunity.com

    - alias: sourceforge
      uri:
        - http://download.sourceforge.net

    - alias: sourceforge.jp
      uri:
        - http://iij.dl.sourceforge.jp
        - http://osdn.dl.sourceforge.jp
        - http://globalbase.dl.sourceforge.jp
        - http://jaist.dl.sourceforge.jp

    - alias: xorg
      uri:
        - https://www.x.org/releases/individual/
        - https://www.x.org/archive/individual/

    - alias: gentoo
      uri:
        # ATTENTION: Portage add /distfiles/ path by default on URL defined in GENTOO_MIRRORS
        #            but on thirdpartymirrors file we need the full path.
        - https://distfiles.macaronios.org/mark-distfiles/distfiles
        - https://distfiles.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/

        - http://gentoo.osuosl.org/distfiles
        - http://ftp.halifax.rwth-aachen.de/gentoo/distfiles

    - alias: funtoo
      uri:
        - https://distfiles.macaronios.org/mark-distfiles/distfiles
        - https://distfiles.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/

    - alias: macaroni
      uri:
        - https://distfiles.macaronios.org/mark-distfiles/distfiles
        - https://distfiles.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/distfiles
        - https://distfiles-flat.macaronios.org/

  fixups:
    include:
      - dir: ../../static/licenses
        to: licenses

      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

      - dir: ../profiles/
        to: profiles
        keep_files:
          # Avoid to remove generated files.
          - categories$
          - repo_name$
          - thirdpartymirrors$

      - dir: ../../eclass/
        to: eclass

      - dir: ../sets/
        to: sets

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: app-arch/brotli
    - pkg: app-arch/sharutils

    - pkg: app-misc/ca-certificates
    - pkg: app-misc/mime-types

    - pkg: dev-libs/expat
    # Python dep
    - pkg: dev-libs/libffi
    - pkg: dev-libs/libltdl
    - pkg: dev-libs/libxml2:2
    - pkg: dev-libs/icu

    - pkg: sys-apps/acl
    - pkg: sys-apps/attr
    - pkg: sys-apps/coreutils
    - pkg: sys-apps/debianutils
    - pkg: sys-apps/which
    - pkg: sys-apps/shadow
    - pkg: sys-apps/locale-gen

    - pkg: sys-devel/autoconf-archive
    - pkg: sys-devel/gcc
    - pkg: sys-devel/gettext

    - pkg: sys-libs/libcap
    - pkg: sys-libs/libcap-ng
    - pkg: sys-libs/glibc:2.2

    - pkg: virtual/libffi
    - pkg: virtual/acl
    - pkg: virtual/awk
    - pkg: virtual/fortran
    - pkg: virtual/libc
    - pkg: virtual/libelf
    - pkg: virtual/libiconv
    - pkg: virtual/libintl
    - pkg: virtual/pager
    - pkg: virtual/shadow
    - pkg: virtual/tmpfiles
