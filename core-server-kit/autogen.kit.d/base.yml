
thin_provisioning_tools:
  generator: builtin-github
  defaults:
    template: ../../templates/simple-github.tmpl
    files_dir: '{{ .Values.pn }}'
    category: sys-fs
    github:
      query: releases

  extensions_defs:
    rust:
      opts:
        crates_skipped: thinp

  packages:

    - thin-provisioning-tools:
        template: ../../templates/simple.tmpl
        category: sys-block
        extensions:
          - rust
        github:
          query: tags
          user: jthornber
        vars:
          iuse: debug io-uring
          inherit:
            - cargo
          docs:
            - CHANGES
            - COPYING
            - README.md
            - doc/TODO.md
            - doc/thinp-version-2/notes.md
          extra_envs:
            - 'QA_FLAGS_IGNORED="usr/sbin/pdata_tools"'
          depend: |
            sys-fs/lvm2
          bdepend: |
            virtual/pkgconfig
            virtual/rust
            app-text/asciidoc
            sys-devel/clang
            sys-fs/lvm2
          body: |
            src_unpack() {
              cargo_src_unpack
              rm -rf ${S}
              mv ${WORKDIR}/jthornber-thin-provisioning-tools-* ${S} || die
              # Patch rio library to ignore unused qualifications.
              # Needed for io-uring use flag.
              sed -i -e '/unused_qualifications/d' \
                ${WORKDIR}/mark-rust-bundle-${PN}/*rio-*/src/lib.rs
              # Fix compilation with rust <1.87 (see https://github.com/sipemu/anofox-statistics-rs/issues/4)
              sed -i -e 's|io_block_size.is_multiple_of(BLOCK_SIZE)|io_block_size % BLOCK_SIZE == 0|g' \
                ${S}/src/io_engine/sync.rs || die
            }
            src_configure() {
              local llvm_slot=$(clang --version | grep version | awk '{ print $4 }' | cut -d'.' -f 1)
              export BINDGEN_EXTRA_CLANG_ARGS="${BINDGEN_EXTRA_CLANG_ARGS} -I/usr/lib/clang/${llvm_slot}/include"
              local myfeatures=( $(usex io-uring io_uring '') )
              cargo_src_configure
            }
            src_install() {
              cargo_target_dir="${CARGO_TARGET_DIR:-target}/$(usex debug debug release)"
              emake \
                DESTDIR="${D}" \
                DATADIR="${ED}/usr/share" \
                PDATA_TOOLS="${cargo_target_dir}/pdata_tools" \
                install
              einstalldocs
            }


general_github:
  generator: builtin-github
  defaults:
    template: ../../templates/simple-github.tmpl
    files_dir: '{{ .Values.pn }}'
    category: sys-fs
    github:
      query: releases

  packages:

    - fuse:
        template: ../../templates/simple.tmpl
        github:
          user: libfuse
          repo: libfuse
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
            matcher: '{{ .Values.pn }}-.*.tar.gz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
        vars:
          python_compat: python3+
          inherit:
            - flag-o-matic
            - meson
            - udev
            - python-any-r1
          slot: 3
          iuse: +suid
          bdepend: |
            virtual/pkgconfig
          rdepend: |
            sys-fs/fuse-common
          docs:
            - AUTHORS
            - ChangeLog.rst
            - README.md
            - doc/README.NFS
            - doc/kernel.txt
          body: |
            src_configure() {
              # bug #853058
              filter-lto
              local emesonargs=(
                -Dexamples=false
                -Dtests=false
                -Duseroot=false
                -Dinitscriptdir=
                -Dudevrulesdir="${EPREFIX}$(get_udevdir)/rules.d"
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              # Installed via fuse-common
              rm -r "${ED}"{/etc,$(get_udevdir)} || die
              # useroot=false prevents the build system from doing this.
              use suid && fperms u+s /usr/bin/fusermount3
              # manually install man pages to respect compression
              rm -r "${ED}"/usr/share/man || die
              doman doc/{fusermount3.1,mount.fuse3.8}
            }


    - libostree:
        template: ../../templates/simple.tmpl
        github:
          user: ostreedev
          repo: ostree
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            matcher: '{{ .Values.pn }}-.*.tar.xz$'
        vars:
          inherit:
            - autotools
            - systemd
            - tmpfiles
          iuse: |
            avahi curl dracut gnutls +gpg +http2 introspection
            doc +libmount man openssl systemd sodium +soup
          required_use: |
            || ( soup curl )
          # We force using of soup 3 for new releases.
          rdepend: |
            dev-libs/ding-libs
            dev-libs/glib:2
            app-arch/xz-utils
            app-arch/libarchive
            sys-libs/zlib
            sys-fs/fuse:3=
            avahi? ( net-dns/avahi )
            curl? ( net-misc/curl )
            gnutls? ( net-libs/gnutls )
            openssl? ( dev-libs/openssl )
            sodium? ( dev-libs/libsodium )
            soup? ( net-libs/libsoup:3 )
            libmount? ( sys-apps/util-linux )
          depend: |
            ${RDEPEND}
            curl? ( net-libs/libsoup:3 )
            introspection? ( dev-libs/gobject-introspection )
            doc? ( dev-util/gtk-doc )
            man? ( dev-libs/libxslt )
          bdepend: |
            virtual/pkgconfig
            sys-fs/e2fsprogs
            sys-devel/bison
          body: |
            src_prepare() {
                default
                eautoreconf
            }
            src_configure() {
                unset YACC
                local econfargs=(
                    --enable-man
                    --enable-shared
                    --with-grub2-mkconfig-path=grub-mkconfig
                    --with-modern-grub
                    --with-libarchive
                    --without-selinux
                    $(use_with curl)
                    $(use_with dracut dracut yesbutnoconf) #816867
                    $(use_enable doc gtk-doc)
                    $(usex introspection --enable-introspection={,} yes no)
                    $(use_with gpg gpgme)
                    $(use_enable http2)
                    $(use_with soup soup3)
                    --without-soup # libsoup:2.4
                    $(use_with libmount)
                    $(use_with sodium ed25519-libsodium)
                    $(use_with systemd libsystemd)
                    $(use_with avahi)
                )
                if use systemd; then
                    econfargs+=( --with-systemdsystemunitdir="$(systemd_get_systemunitdir)" )
                fi
                # Crypto for checksums:
                # prefer gnutls over openssl if both are selected
                if use gnutls; then
                    econfargs+=( --with-crypto=gnutls )
                elif use openssl; then
                    econfargs+=( --with-crypto=openssl )
                else
                    econfargs+=( --with-crypto=glib )
                fi
                unset ${!XDG_*}
                econf "${econfargs[@]}"
            }
            src_install() {
                default
                rm -f ${D}/etc/grub.d/15_ostree
                dotmpfiles src/boot/ostree-tmpfiles.conf #901797
                find "${D}" -name '*.la' -type f -delete || die
            }
            pkg_postinst() {
                tmpfiles_process ostree-tmpfiles.conf
            }

eudev:
  generator: builtin-github
  defaults:
    category: sys-fs
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    github:
      query: releases
      user: eudev-project
    transform:
      - kind: string
        match: 'Release '
        replace: ''

    exclude:
      - 'Pre-release'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'

    vars:
      inherit:
        - autotools
        - toolchain-funcs
        - user
      iuse: +hwdb +kmod introspection +rule-generator static-libs
      cdepend: |
        sys-apps/util-linux
        introspection? ( dev-libs/gobject-introspection:= )
        kmod? ( sys-apps/kmod )
        !sys-apps/gentoo-systemd-integration
        !sys-apps/systemd
      depend: |
        ${CDEPEND}
        dev-util/gperf
        virtual/os-headers
        virtual/pkgconfig
        sys-devel/make
        sys-kernel/linux-headers
        dev-util/intltool
      rdepend: |
        ${CDEPEND}
        !sys-fs/udev
        !sys-apps/systemd
        !sys-fs/udev-init-scripts
      pdepend: |
        hwdb? ( sys-apps/hwids[udev] )
      body: |
        src_prepare() {
          # change rules back to group uucp instead of dialout for now
          sed -e 's/GROUP="dialout"/GROUP="uucp"/' -i rules/*.rules \
          || die "failed to change group dialout to uucp"
          # FL-9484: enable net-generator for VMware virtual interfaces:
          sed -i -e '/^# ignore VMWare/,+1d' rule_generator/75-persistent-net-generator.rules || die "fail"
          eapply_user
          eautoreconf
        }
        src_configure() {
          tc-export CC #463846
          export cc_cv_CFLAGS__flto=no #502950

          # Keep sorted by ./configure --help and only pass --disable flags
          # when *required* to avoid external deps or unnecessary compile
          local econf_args
          econf_args=(
            ac_cv_search_cap_init=
            ac_cv_header_sys_capability_h=yes
            DBUS_CFLAGS=' '
            DBUS_LIBS=' '
            --with-rootprefix=
            --with-rootrundir=/run
            --exec-prefix="${EPREFIX}"
            --bindir="${EPREFIX}"/bin
            --includedir="${EPREFIX}"/usr/include
            --libdir="${EPREFIX}"/usr/$(get_libdir)
            --with-rootlibexecdir="${EPREFIX}"/lib/udev
            --enable-split-usr
            --enable-manpages
            --disable-hwdb
            --disable-selinux
            --with-rootlibdir="${EPREFIX}"/$(get_libdir)
            $(use_enable introspection)
            $(use_enable kmod)
            $(use_enable static-libs static)
            $(use_enable rule-generator)
          )
          ECONF_SOURCE="${S}" econf "${econf_args[@]}"
        }
        src_install() {
            find "${D}" -name '*.la' -delete || die
            insinto /lib/udev/rules.d
            for x in udev udev-trigger udev-settle; do
                doinitd "${FILESDIR}"/$x
            done
            doins "${FILESDIR}"/40-macaroni.rules
            use rule-generator && doinitd "${FILESDIR}"/udev-postmount
            default
        }
        add_initd_to_runlevel() {
            if [[ ! -x "${EROOT}"/etc/init.d/${1} ]]; then
                die "${EROOT}/etc/init.d/${1} not found."
            fi
            if [[ ! -d "${EROOT}"/etc/runlevels/${2} ]]; then
                die "Runlevel ${2} not found."
            fi
            if [[ ! -L "${EROOT}/etc/runlevels/${2}/${1}" ]]; then
                ln -snf /etc/init.d/${1} "${EROOT}"/etc/runlevels/${2}/${1} || die "Couldn't add ${1} to runlevel ${2}"
                ewarn "Adding ${1} to the ${2} runlevel"
            fi
        }
        pkg_postinst() {
          # TODO: replace this with entities.
          enewgroup input
          enewgroup kvm 78
          enewgroup render
          mkdir -p "${EROOT}"run
          # "losetup -f" is confused if there is an empty /dev/loop/, Bug #338766
          # So try to remove it here (will only work if empty).
          rmdir "${EROOT}"dev/loop 2>/dev/null
          if [[ -d ${EROOT}dev/loop ]]; then
              ewarn "Please make sure your remove /dev/loop,"
              ewarn "else losetup may be confused when looking for unused devices."
          fi
          # REPLACING_VERSIONS should only ever have zero or 1 values but in case it doesn't,
          # process it as a list.  We only care about the zero case (new install) or the case where
          # the same version is being re-emerged.  If there is a second version, allow it to abort.
          local rv rvres=doitnew
          for rv in ${REPLACING_VERSIONS} ; do
              if [[ ${rvres} == doit* ]]; then
                  if [[ ${rv%-r*} == ${PV} ]]; then
                      rvres=doit
                  else
                      rvres=${rv}
                  fi
              fi
          done
          if use hwdb && has_version 'sys-apps/hwids[udev]'; then
              udevadm hwdb --update --root="${ROOT%/}"
              # https://cgit.freedesktop.org/systemd/systemd/commit/?id=1fab57c209035f7e66198343074e9cee06718bda
              # reload database after it has be rebuilt, but only if we are not upgrading
              if [[ ${rvres} == doit* ]] && [[ ${ROOT%/} == "" ]]; then
                  udevadm control --reload
              fi
          fi
          if [[ ${rvres} != doitnew ]]; then
              ewarn
              ewarn "You need to restart eudev as soon as possible to make the"
              ewarn "upgrade go into effect:"
              ewarn "\t/etc/init.d/udev --nodeps restart"
          fi
          for f in udev udev-trigger; do
              add_initd_to_runlevel $f sysinit
          done
          if use rule-generator; then
              add_initd_to_runlevel udev-postmount default
          fi
        }

  packages:
    - eudev:


sssd:
  generator: builtin-github
  defaults:
    category: sys-auth
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases
      user: SSSD
      repo: sssd
        #num_pages: 2
      ignore_tags: true

    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''

    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
        matcher: '{{ .Values.pn }}-.*.tar.gz$'

    vars:
      inherit:
        - autotools
        - flag-o-matic
        - linux-info
        - optfeature
        - plocale
        - python-single-r1
        - pam
        - systemd
        - tmpfiles
        - toolchain-funcs
        - udev
        - user

      iuse: cifs doc +man +netlink nfsv4 nls passkey python samba subid sudo systemd systemtap
      python_compat: python3+
      required_use: python? ( ${PYTHON_REQUIRED_USE} )

      depend: |
        app-crypt/mit-krb5
        app-crypt/p11-kit
        dev-libs/ding-libs
        dev-libs/cyrus-sasl[kerberos]
        dev-libs/jansson:=
        dev-libs/libpcre2:=
        dev-libs/libunistring:=
        dev-libs/popt
        dev-libs/openssl:=
        net-dns/bind-tools[gssapi]
        net-dns/c-ares:=
        cifs? ( net-fs/cifs-utils[acl] )
        net-nds/openldap:=[sasl,experimental]
        sys-apps/dbus
        sys-apps/keyutils
        sys-apps/shadow
        sys-libs/ldb:=
        >=sys-libs/libcap-2.77
        sys-libs/pam
        sys-libs/talloc
        sys-libs/tdb
        sys-libs/tevent
        virtual/libintl
        netlink? ( dev-libs/libnl:3 )
        nfsv4? ( net-fs/nfs-utils )
        passkey? (
          dev-libs/libfido2
          sys-apps/pcsc-lite[policykit]
        )
        python? (
          ${PYTHON_DEPS}
          systemd? (
            $(python_gen_cond_dep '
              dev-python/python-systemd[${PYTHON_USEDEP}]
            ')
          )
        )
        samba? ( net-fs/samba[winbind] )
        systemd? (
          sys-apps/systemd:=
          sys-apps/util-linux
        )
        systemtap? ( dev-debug/systemtap )
      rdepend: '${DEPEND}'
      bdepend: |
        sys-libs/libcap
        virtual/pkgconfig
        ${PYTHON_DEPS}
        doc? ( app-doc/doxygen )
        man? (
          app-text/docbook-xml-dtd:4.5
          dev-libs/libxslt
          nls? ( app-text/po4a )
          )
        nls? ( sys-devel/gettext )

      patches:
      extra_envs:
        # Ukrainian translation causes compile failure, so skip it for now
        - 'PLOCALES="ca de es fr ja ko pt_BR ru sv tr"'
        - 'PLOCALES_BIN="${PLOCALES} bg cs eu fi hu id it ka nb nl pl pt tg zh_TW zh_CN"'
        - 'PLOCALE_BACKUP="sv"'
        - 'CONFIG_CHECK="~KEYS"'

      body: |
        pkg_setup() {
          linux-info_pkg_setup
          python-single-r1_pkg_setup
          enewgroup sssd 547
          enewuser sssd 547 /var/lib/sss /sbin/nologin sssd
        }
        src_prepare() {
          default
          plocale_get_locales > src/man/po/LINGUAS || die
          sed -i \
          	-e "/_langs]/ s/ .*//" \
          	src/man/po/po4a.cfg \
          	|| die
          enable_locale() {
          	local locale=${1}
          	sed -i \
          		-e "/_langs]/ s/$/ ${locale}/" \
          		src/man/po/po4a.cfg \
          		|| die
          }
          plocale_for_each_locale enable_locale
          PLOCALES="${PLOCALES_BIN}"
          plocale_get_locales > po/LINGUAS || die
          sed -i \
          	-e 's:/var/run:/run:' \
          	src/examples/logrotate \
          	|| die
          # disable flaky test, see https://github.com/SSSD/sssd/issues/5631
          sed -i \
          	-e '/^\s*pam-srv-tests[ \\]*$/d' \
          	Makefile.am \
          	|| die
          # requires valgrind headers installed, see
          # https://github.com/SSSD/sssd/pull/7845
          sed -i \
          	-e '/^\s*test_iobuf[ \\]*$/d' \
          	Makefile.am \
          	|| die
          eautoreconf
        }

        src_configure() {
          local native_dbus_cflags=$($(tc-getPKG_CONFIG) --cflags dbus-1 || die)
          local myconf=()

          myconf+=(
          	--libexecdir="${EPREFIX}"/usr/libexec
          	--localstatedir="${EPREFIX}"/var
          	--runstatedir="${EPREFIX}"/run
          	--sbindir="${EPREFIX}"/usr/sbin
          	--with-pid-path="${EPREFIX}"/run/sssd
          	--with-plugin-path="${EPREFIX}"/usr/$(get_libdir)/sssd
          	--enable-pammoddir="${EPREFIX}"/$(getpam_mod_dir)
          	--with-ldb-lib-dir="${EPREFIX}"/usr/$(get_libdir)/samba/ldb
          	--with-db-path="${EPREFIX}"/var/lib/sss/db
          	--with-gpo-cache-path="${EPREFIX}"/var/lib/sss/gpo_cache
          	--with-pubconf-path="${EPREFIX}"/var/lib/sss/pubconf
          	--with-pipe-path="${EPREFIX}"/var/lib/sss/pipes
          	--with-mcache-path="${EPREFIX}"/var/lib/sss/mc
          	--with-secrets-db-path="${EPREFIX}"/var/lib/sss/secrets
          	--with-log-path="${EPREFIX}"/var/log/sssd
          	--with-tmpfilesdir=/usr/lib/tmpfiles.d
          	--with-udevrulesdir="$(get_udevdir)/rules.d"
          	--with-kcm
          	--enable-kcm-renewal
          	--with-os=gentoo
          	--disable-rpath
          	--disable-static
          	# Valgrind is only used for tests
          	--disable-valgrind
          	$(use_with samba)
          	--with-smb-idmap-interface-version=6
          	$(use_enable cifs cifs-idmap-plugin)
          	--without-selinux
          	--enable-krb5-locator-plugin
          	$(use_enable samba pac-responder)
          	$(use_with nfsv4 nfsv4-idmapd-plugin)
          	$(use_enable nls)
          	$(use_with netlink libnl)
          	$(use_with man manpages)
          	$(use_with sudo)
          	--with-autofs
          	--with-ssh
          	--without-oidc-child
          	$(use_with passkey)
          	$(use_with subid)
          	$(use_enable systemtap)
          	--without-python2-bindings
          	$(use_with python python3-bindings)
          	# Annoyingly configure requires that you pick systemd XOR sysv
          	--with-initscript=$(usex systemd systemd sysv)
          	--with-sssd-user=sssd
          	KRB5_CONFIG="${ESYSROOT}"/usr/bin/krb5-config
          	CPPFLAGS="${CPPFLAGS} -I${ESYSROOT}/usr/include/samba-4.0"
          )

          use systemd && myconf+=(
          	--with-systemdunitdir=$(systemd_get_systemunitdir)
          )

          econf "${myconf[@]}"
          echo $S
        }

        src_compile() {
          default
          use doc && emake docs
        }

        src_install() {
          emake -j1 DESTDIR="${D}" install
          if use python; then
            python_fix_shebang "${ED}"
            python_optimize
          fi
          einstalldocs

          insinto /etc/sssd
          insopts -m600
          doins src/examples/sssd-example.conf

          insinto /etc/logrotate.d
          insopts -m644
          newins src/examples/logrotate sssd

          newconfd "${FILESDIR}"/sssd.conf sssd

          keepdir /var/lib/sss/db
          keepdir /var/lib/sss/deskprofile
          keepdir /var/lib/sss/gpo_cache
          keepdir /var/lib/sss/keytabs
          keepdir /var/lib/sss/mc
          keepdir /var/lib/sss/pipes/private
          keepdir /var/lib/sss/pubconf/krb5.include.d
          keepdir /var/lib/sss/secrets
          keepdir /var/log/sssd
          keepdir /etc/sssd/conf.d
          keepdir /etc/sssd/pki

          # strip empty dirs
          if ! use doc; then
            rm -r "${ED}"/usr/share/doc/"${PF}"/doc || die
            rm -r "${ED}"/usr/share/doc/"${PF}"/{hbac,idmap,nss_idmap}_doc || die
          fi

          rm -r "${ED}"/run || die
          find "${ED}" -type f -name '*.la' -delete || die
        }

        pkg_postinst() {
          tmpfiles_process sssd-tmpfiles.conf
          echo
          elog "You must set up sssd.conf (default installed into /etc/sssd)"
          elog "and (optionally) configuration in /etc/pam.d in order to use SSSD"
          elog "features."
          echo
          optfeature "Kerberos keytab renew (see krb5_renew_interval)" app-crypt/adcli

          if ! use python; then
                    echo
                    ewarn "sssctl analyze will not work because the python USE flag is disabled."
          fi
        }
  packages:
    - sssd:
