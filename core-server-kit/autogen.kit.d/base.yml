
thin_provisioning_tools:
  generator: builtin-github
  defaults:
    template: ../../templates/simple-github.tmpl
    files_dir: '{{ .Values.pn }}'
    category: sys-fs
    github:
      query: releases

  extensions_defs:
    rust:
      opts:
        crates_skipped: thinp

  packages:

    - thin-provisioning-tools:
        template: ../../templates/simple.tmpl
        category: sys-block
        extensions:
          - rust
        github:
          query: tags
          user: jthornber
        vars:
          iuse: debug io-uring
          inherit:
            - cargo
          docs:
            - CHANGES
            - COPYING
            - README.md
            - doc/TODO.md
            - doc/thinp-version-2/notes.md
          extra_envs:
            - 'QA_FLAGS_IGNORED="usr/sbin/pdata_tools"'
          depend: |
            sys-fs/lvm2
          bdepend: |
            virtual/pkgconfig
            virtual/rust
            app-text/asciidoc
            sys-devel/clang
            sys-fs/lvm2
          body: |
            src_unpack() {
              cargo_src_unpack
              rm -rf ${S}
              mv ${WORKDIR}/jthornber-thin-provisioning-tools-* ${S} || die
              # Patch rio library to ignore unused qualifications.
              # Needed for io-uring use flag.
              sed -i -e '/unused_qualifications/d' \
                ${WORKDIR}/mark-rust-bundle-${PN}/*rio-*/src/lib.rs
              # Fix compilation with rust <1.87 (see https://github.com/sipemu/anofox-statistics-rs/issues/4)
              sed -i -e 's|io_block_size.is_multiple_of(BLOCK_SIZE)|io_block_size % BLOCK_SIZE == 0|g' \
                ${S}/src/io_engine/sync.rs || die
            }
            src_configure() {
              local llvm_slot=$(clang --version | grep version | awk '{ print $4 }' | cut -d'.' -f 1)
              export BINDGEN_EXTRA_CLANG_ARGS="${BINDGEN_EXTRA_CLANG_ARGS} -I/usr/lib/clang/${llvm_slot}/include"
              local myfeatures=( $(usex io-uring io_uring '') )
              cargo_src_configure
            }
            src_install() {
              cargo_target_dir="${CARGO_TARGET_DIR:-target}/$(usex debug debug release)"
              emake \
                DESTDIR="${D}" \
                DATADIR="${ED}/usr/share" \
                PDATA_TOOLS="${cargo_target_dir}/pdata_tools" \
                install
              einstalldocs
            }


general_github:
  generator: builtin-github
  defaults:
    template: ../../templates/simple-github.tmpl
    files_dir: '{{ .Values.pn }}'
    category: sys-fs
    github:
      query: releases

  packages:

    - libqb:
        template: ../../templates/simple.tmpl
        category: sys-cluster
        github:
          user: ClusterLabs
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            matcher: '{{ .Values.pn }}-.*.tar.xz$'
        vars:
          license: LGPL-2.1
          iuse: systemd examples
          inherit:
            - autotools
          rdepend: |
            dev-libs/glib:2
            dev-libs/libxml2:=
          depend: '${RDEPEND}'
          bdepend: |
            app-arch/xz-utils
          docs:
            - ChangeLog
            - README.markdown
          body: |
            src_prepare() {
              default
              # Skip installation of text documents without value
              sed -e '/dist_doc_DATA/d' -i Makefile.am || die
              # Do not append version suffix "-yank"
              sed 's|1-yank|1|' -i configure.ac || die
              eautoreconf
            }
            src_configure() {
              econf \
                --disable-static \
                --disable-debug \
                --with-socket-dir=/run \
                $(use_enable systemd systemd-journal)
            }
            src_install() {
              emake install DESTDIR="${D}"
              if use examples ; then
                docinto examples
                dodoc examples/*.c
              fi
              einstalldocs
              find "${D}" -name '*.la' -delete || die
            }

    - fuse:
        template: ../../templates/simple.tmpl
        github:
          user: libfuse
          repo: libfuse
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
            matcher: '{{ .Values.pn }}-.*.tar.gz$'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
        vars:
          python_compat: python3+
          inherit:
            - flag-o-matic
            - meson
            - udev
            - python-any-r1
          slot: 3
          iuse: +suid
          bdepend: |
            virtual/pkgconfig
          rdepend: |
            sys-fs/fuse-common
          docs:
            - AUTHORS
            - ChangeLog.rst
            - README.md
            - doc/README.NFS
            - doc/kernel.txt
          body: |
            src_configure() {
              # bug #853058
              filter-lto
              local emesonargs=(
                -Dexamples=false
                -Dtests=false
                -Duseroot=false
                -Dinitscriptdir=
                -Dudevrulesdir="${EPREFIX}$(get_udevdir)/rules.d"
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              # Installed via fuse-common
              rm -r "${ED}"{/etc,$(get_udevdir)} || die
              # useroot=false prevents the build system from doing this.
              use suid && fperms u+s /usr/bin/fusermount3
              # manually install man pages to respect compression
              rm -r "${ED}"/usr/share/man || die
              doman doc/{fusermount3.1,mount.fuse3.8}
            }


    - libostree:
        template: ../../templates/simple.tmpl
        github:
          user: ostreedev
          repo: ostree
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            matcher: '{{ .Values.pn }}-.*.tar.xz$'
        vars:
          inherit:
            - autotools
            - systemd
            - tmpfiles
          iuse: |
            avahi curl dracut gnutls +gpg +http2 introspection
            doc +libmount man openssl systemd sodium +soup
          required_use: |
            || ( soup curl )
          # We force using of soup 3 for new releases.
          rdepend: |
            dev-libs/ding-libs
            dev-libs/glib:2
            app-arch/xz-utils
            app-arch/libarchive
            sys-libs/zlib
            sys-fs/fuse:3=
            avahi? ( net-dns/avahi )
            curl? ( net-misc/curl )
            gnutls? ( net-libs/gnutls )
            openssl? ( dev-libs/openssl )
            sodium? ( dev-libs/libsodium )
            soup? ( net-libs/libsoup:3 )
            libmount? ( sys-apps/util-linux )
          depend: |
            ${RDEPEND}
            curl? ( net-libs/libsoup:3 )
            introspection? ( dev-libs/gobject-introspection )
            doc? ( dev-util/gtk-doc )
            man? ( dev-libs/libxslt )
          bdepend: |
            virtual/pkgconfig
            sys-fs/e2fsprogs
            sys-devel/bison
          body: |
            src_prepare() {
                default
                eautoreconf
            }
            src_configure() {
                unset YACC
                local econfargs=(
                    --enable-man
                    --enable-shared
                    --with-grub2-mkconfig-path=grub-mkconfig
                    --with-modern-grub
                    --with-libarchive
                    --without-selinux
                    $(use_with curl)
                    $(use_with dracut dracut yesbutnoconf) #816867
                    $(use_enable doc gtk-doc)
                    $(usex introspection --enable-introspection={,} yes no)
                    $(use_with gpg gpgme)
                    $(use_enable http2)
                    $(use_with soup soup3)
                    --without-soup # libsoup:2.4
                    $(use_with libmount)
                    $(use_with sodium ed25519-libsodium)
                    $(use_with systemd libsystemd)
                    $(use_with avahi)
                )
                if use systemd; then
                    econfargs+=( --with-systemdsystemunitdir="$(systemd_get_systemunitdir)" )
                fi
                # Crypto for checksums:
                # prefer gnutls over openssl if both are selected
                if use gnutls; then
                    econfargs+=( --with-crypto=gnutls )
                elif use openssl; then
                    econfargs+=( --with-crypto=openssl )
                else
                    econfargs+=( --with-crypto=glib )
                fi
                unset ${!XDG_*}
                econf "${econfargs[@]}"
            }
            src_install() {
                default
                rm -f ${D}/etc/grub.d/15_ostree
                dotmpfiles src/boot/ostree-tmpfiles.conf #901797
                find "${D}" -name '*.la' -type f -delete || die
            }
            pkg_postinst() {
                tmpfiles_process ostree-tmpfiles.conf
            }

eudev:
  generator: builtin-github
  defaults:
    category: sys-fs
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    github:
      query: releases
      user: eudev-project
    transform:
      - kind: string
        match: 'Release '
        replace: ''

    exclude:
      - 'Pre-release'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'

    vars:
      inherit:
        - autotools
        - toolchain-funcs
        - user
      iuse: +hwdb +kmod introspection +rule-generator static-libs
      cdepend: |
        sys-apps/util-linux
        introspection? ( dev-libs/gobject-introspection:= )
        kmod? ( sys-apps/kmod )
        !sys-apps/gentoo-systemd-integration
        !sys-apps/systemd
      depend: |
        ${CDEPEND}
        dev-util/gperf
        virtual/os-headers
        virtual/pkgconfig
        sys-devel/make
        sys-kernel/linux-headers
        dev-util/intltool
      rdepend: |
        ${CDEPEND}
        !sys-fs/udev
        !sys-apps/systemd
        !sys-fs/udev-init-scripts
      pdepend: |
        hwdb? ( sys-apps/hwids[udev] )
      body: |
        src_prepare() {
          # change rules back to group uucp instead of dialout for now
          sed -e 's/GROUP="dialout"/GROUP="uucp"/' -i rules/*.rules \
          || die "failed to change group dialout to uucp"
          # FL-9484: enable net-generator for VMware virtual interfaces:
          sed -i -e '/^# ignore VMWare/,+1d' rule_generator/75-persistent-net-generator.rules || die "fail"
          eapply_user
          eautoreconf
        }
        src_configure() {
          tc-export CC #463846
          export cc_cv_CFLAGS__flto=no #502950

          # Keep sorted by ./configure --help and only pass --disable flags
          # when *required* to avoid external deps or unnecessary compile
          local econf_args
          econf_args=(
            ac_cv_search_cap_init=
            ac_cv_header_sys_capability_h=yes
            DBUS_CFLAGS=' '
            DBUS_LIBS=' '
            --with-rootprefix=
            --with-rootrundir=/run
            --exec-prefix="${EPREFIX}"
            --bindir="${EPREFIX}"/bin
            --includedir="${EPREFIX}"/usr/include
            --libdir="${EPREFIX}"/usr/$(get_libdir)
            --with-rootlibexecdir="${EPREFIX}"/lib/udev
            --enable-split-usr
            --enable-manpages
            --disable-hwdb
            --disable-selinux
            --with-rootlibdir="${EPREFIX}"/$(get_libdir)
            $(use_enable introspection)
            $(use_enable kmod)
            $(use_enable static-libs static)
            $(use_enable rule-generator)
          )
          ECONF_SOURCE="${S}" econf "${econf_args[@]}"
        }
        src_install() {
            find "${D}" -name '*.la' -delete || die
            insinto /lib/udev/rules.d
            for x in udev udev-trigger udev-settle; do
                doinitd "${FILESDIR}"/$x
            done
            doins "${FILESDIR}"/40-macaroni.rules
            use rule-generator && doinitd "${FILESDIR}"/udev-postmount
            default
        }
        add_initd_to_runlevel() {
            if [[ ! -x "${EROOT}"/etc/init.d/${1} ]]; then
                die "${EROOT}/etc/init.d/${1} not found."
            fi
            if [[ ! -d "${EROOT}"/etc/runlevels/${2} ]]; then
                die "Runlevel ${2} not found."
            fi
            if [[ ! -L "${EROOT}/etc/runlevels/${2}/${1}" ]]; then
                ln -snf /etc/init.d/${1} "${EROOT}"/etc/runlevels/${2}/${1} || die "Couldn't add ${1} to runlevel ${2}"
                ewarn "Adding ${1} to the ${2} runlevel"
            fi
        }
        pkg_postinst() {
          # TODO: replace this with entities.
          enewgroup input
          enewgroup kvm 78
          enewgroup render
          mkdir -p "${EROOT}"run
          # "losetup -f" is confused if there is an empty /dev/loop/, Bug #338766
          # So try to remove it here (will only work if empty).
          rmdir "${EROOT}"dev/loop 2>/dev/null
          if [[ -d ${EROOT}dev/loop ]]; then
              ewarn "Please make sure your remove /dev/loop,"
              ewarn "else losetup may be confused when looking for unused devices."
          fi
          # REPLACING_VERSIONS should only ever have zero or 1 values but in case it doesn't,
          # process it as a list.  We only care about the zero case (new install) or the case where
          # the same version is being re-emerged.  If there is a second version, allow it to abort.
          local rv rvres=doitnew
          for rv in ${REPLACING_VERSIONS} ; do
              if [[ ${rvres} == doit* ]]; then
                  if [[ ${rv%-r*} == ${PV} ]]; then
                      rvres=doit
                  else
                      rvres=${rv}
                  fi
              fi
          done
          if use hwdb && has_version 'sys-apps/hwids[udev]'; then
              udevadm hwdb --update --root="${ROOT%/}"
              # https://cgit.freedesktop.org/systemd/systemd/commit/?id=1fab57c209035f7e66198343074e9cee06718bda
              # reload database after it has be rebuilt, but only if we are not upgrading
              if [[ ${rvres} == doit* ]] && [[ ${ROOT%/} == "" ]]; then
                  udevadm control --reload
              fi
          fi
          if [[ ${rvres} != doitnew ]]; then
              ewarn
              ewarn "You need to restart eudev as soon as possible to make the"
              ewarn "upgrade go into effect:"
              ewarn "\t/etc/init.d/udev --nodeps restart"
          fi
          for f in udev udev-trigger; do
              add_initd_to_runlevel $f sysinit
          done
          if use rule-generator; then
              add_initd_to_runlevel udev-postmount default
          fi
        }

  packages:
    - eudev:


sssd:
  generator: builtin-github
  defaults:
    category: sys-auth
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases
      user: SSSD
      repo: sssd
        #num_pages: 2
      ignore_tags: true

    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''

    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
        matcher: '{{ .Values.pn }}-.*.tar.gz$'

    vars:
      inherit:
        - autotools
        - flag-o-matic
        - linux-info
        - optfeature
        - plocale
        - python-single-r1
        - pam
        - systemd
        - tmpfiles
        - toolchain-funcs
        - udev
        - user

      iuse: cifs doc +man +netlink nfsv4 nls passkey python samba subid sudo systemd systemtap
      python_compat: python3+
      required_use: python? ( ${PYTHON_REQUIRED_USE} )

      depend: |
        app-crypt/mit-krb5
        app-crypt/p11-kit
        dev-libs/ding-libs
        dev-libs/cyrus-sasl[kerberos]
        dev-libs/jansson:=
        dev-libs/libpcre2:=
        dev-libs/libunistring:=
        dev-libs/popt
        dev-libs/openssl:=
        net-dns/bind-tools[gssapi]
        net-dns/c-ares:=
        cifs? ( net-fs/cifs-utils[acl] )
        net-nds/openldap:=[sasl,experimental]
        sys-apps/dbus
        sys-apps/keyutils
        sys-apps/shadow
        sys-libs/ldb:=
        >=sys-libs/libcap-2.77
        sys-libs/pam
        sys-libs/talloc
        sys-libs/tdb
        sys-libs/tevent
        virtual/libintl
        netlink? ( dev-libs/libnl:3 )
        nfsv4? ( net-fs/nfs-utils )
        passkey? (
          dev-libs/libfido2
          sys-apps/pcsc-lite[policykit]
        )
        python? (
          ${PYTHON_DEPS}
          systemd? (
            $(python_gen_cond_dep '
              dev-python/python-systemd[${PYTHON_USEDEP}]
            ')
          )
        )
        samba? ( net-fs/samba[winbind] )
        systemd? (
          sys-apps/systemd:=
          sys-apps/util-linux
        )
        systemtap? ( dev-debug/systemtap )
      rdepend: '${DEPEND}'
      bdepend: |
        sys-libs/libcap
        virtual/pkgconfig
        ${PYTHON_DEPS}
        doc? ( app-doc/doxygen )
        man? (
          app-text/docbook-xml-dtd:4.5
          dev-libs/libxslt
          nls? ( app-text/po4a )
          )
        nls? ( sys-devel/gettext )

      patches:
      extra_envs:
        # Ukrainian translation causes compile failure, so skip it for now
        - 'PLOCALES="ca de es fr ja ko pt_BR ru sv tr"'
        - 'PLOCALES_BIN="${PLOCALES} bg cs eu fi hu id it ka nb nl pl pt tg zh_TW zh_CN"'
        - 'PLOCALE_BACKUP="sv"'
        - 'CONFIG_CHECK="~KEYS"'

      body: |
        pkg_setup() {
          linux-info_pkg_setup
          python-single-r1_pkg_setup
          enewgroup sssd 547
          enewuser sssd 547 /var/lib/sss /sbin/nologin sssd
        }
        src_prepare() {
          default
          plocale_get_locales > src/man/po/LINGUAS || die
          sed -i \
          	-e "/_langs]/ s/ .*//" \
          	src/man/po/po4a.cfg \
          	|| die
          enable_locale() {
          	local locale=${1}
          	sed -i \
          		-e "/_langs]/ s/$/ ${locale}/" \
          		src/man/po/po4a.cfg \
          		|| die
          }
          plocale_for_each_locale enable_locale
          PLOCALES="${PLOCALES_BIN}"
          plocale_get_locales > po/LINGUAS || die
          sed -i \
          	-e 's:/var/run:/run:' \
          	src/examples/logrotate \
          	|| die
          # disable flaky test, see https://github.com/SSSD/sssd/issues/5631
          sed -i \
          	-e '/^\s*pam-srv-tests[ \\]*$/d' \
          	Makefile.am \
          	|| die
          # requires valgrind headers installed, see
          # https://github.com/SSSD/sssd/pull/7845
          sed -i \
          	-e '/^\s*test_iobuf[ \\]*$/d' \
          	Makefile.am \
          	|| die
          eautoreconf
        }

        src_configure() {
          local native_dbus_cflags=$($(tc-getPKG_CONFIG) --cflags dbus-1 || die)
          local myconf=()

          myconf+=(
          	--libexecdir="${EPREFIX}"/usr/libexec
          	--localstatedir="${EPREFIX}"/var
          	--runstatedir="${EPREFIX}"/run
          	--sbindir="${EPREFIX}"/usr/sbin
          	--with-pid-path="${EPREFIX}"/run/sssd
          	--with-plugin-path="${EPREFIX}"/usr/$(get_libdir)/sssd
          	--enable-pammoddir="${EPREFIX}"/$(getpam_mod_dir)
          	--with-ldb-lib-dir="${EPREFIX}"/usr/$(get_libdir)/samba/ldb
          	--with-db-path="${EPREFIX}"/var/lib/sss/db
          	--with-gpo-cache-path="${EPREFIX}"/var/lib/sss/gpo_cache
          	--with-pubconf-path="${EPREFIX}"/var/lib/sss/pubconf
          	--with-pipe-path="${EPREFIX}"/var/lib/sss/pipes
          	--with-mcache-path="${EPREFIX}"/var/lib/sss/mc
          	--with-secrets-db-path="${EPREFIX}"/var/lib/sss/secrets
          	--with-log-path="${EPREFIX}"/var/log/sssd
          	--with-tmpfilesdir=/usr/lib/tmpfiles.d
          	--with-udevrulesdir="$(get_udevdir)/rules.d"
          	--with-kcm
          	--enable-kcm-renewal
          	--with-os=gentoo
          	--disable-rpath
          	--disable-static
          	# Valgrind is only used for tests
          	--disable-valgrind
          	$(use_with samba)
          	--with-smb-idmap-interface-version=6
          	$(use_enable cifs cifs-idmap-plugin)
          	--without-selinux
          	--enable-krb5-locator-plugin
          	$(use_enable samba pac-responder)
          	$(use_with nfsv4 nfsv4-idmapd-plugin)
          	$(use_enable nls)
          	$(use_with netlink libnl)
          	$(use_with man manpages)
          	$(use_with sudo)
          	--with-autofs
          	--with-ssh
          	--without-oidc-child
          	$(use_with passkey)
          	$(use_with subid)
          	$(use_enable systemtap)
          	--without-python2-bindings
          	$(use_with python python3-bindings)
          	# Annoyingly configure requires that you pick systemd XOR sysv
          	--with-initscript=$(usex systemd systemd sysv)
          	--with-sssd-user=sssd
          	KRB5_CONFIG="${ESYSROOT}"/usr/bin/krb5-config
          	CPPFLAGS="${CPPFLAGS} -I${ESYSROOT}/usr/include/samba-4.0"
          )

          use systemd && myconf+=(
          	--with-systemdunitdir=$(systemd_get_systemunitdir)
          )

          econf "${myconf[@]}"
          echo $S
        }

        src_compile() {
          default
          use doc && emake docs
        }

        src_install() {
          emake -j1 DESTDIR="${D}" install
          if use python; then
            python_fix_shebang "${ED}"
            python_optimize
          fi
          einstalldocs

          insinto /etc/sssd
          insopts -m600
          doins src/examples/sssd-example.conf

          insinto /etc/logrotate.d
          insopts -m644
          newins src/examples/logrotate sssd

          newconfd "${FILESDIR}"/sssd.conf sssd

          keepdir /var/lib/sss/db
          keepdir /var/lib/sss/deskprofile
          keepdir /var/lib/sss/gpo_cache
          keepdir /var/lib/sss/keytabs
          keepdir /var/lib/sss/mc
          keepdir /var/lib/sss/pipes/private
          keepdir /var/lib/sss/pubconf/krb5.include.d
          keepdir /var/lib/sss/secrets
          keepdir /var/log/sssd
          keepdir /etc/sssd/conf.d
          keepdir /etc/sssd/pki

          # strip empty dirs
          if ! use doc; then
            rm -r "${ED}"/usr/share/doc/"${PF}"/doc || die
            rm -r "${ED}"/usr/share/doc/"${PF}"/{hbac,idmap,nss_idmap}_doc || die
          fi

          rm -r "${ED}"/run || die
          find "${ED}" -type f -name '*.la' -delete || die
        }

        pkg_postinst() {
          tmpfiles_process sssd-tmpfiles.conf
          echo
          elog "You must set up sssd.conf (default installed into /etc/sssd)"
          elog "and (optionally) configuration in /etc/pam.d in order to use SSSD"
          elog "features."
          echo
          optfeature "Kerberos keytab renew (see krb5_renew_interval)" app-crypt/adcli

          if ! use python; then
                    echo
                    ewarn "sssctl analyze will not work because the python USE flag is disabled."
          fi
        }
  packages:
    - sssd:


mysql_community:
  generator: builtin-github
  defaults:
    template: ../../templates/simple-github.tmpl
    category: dev-db
    files_dir: '{{ .Values.pn }}'
    github:
      user: mysql
      repo: mysql-server
      match: 'mysql-cluster-[0-9.]+'
      query: tags
      num_pages: 18
    transform:
      - kind: string
        match: 'mysql-cluster-'
        replace: ''

    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
        url: 'https://cdn.mysql.com/archives/mysql-{{ join "." ( slice ( splitList "." .Values.version ) 0 2 ) }}/mysql-boost-{{ .Values.version }}.tar.gz'
    vars:
      desc: 'A fast, multi-threaded, multi-user SQL database server'
      homepage: https://www.mysql.com/
      license: GPL-2
      iuse: cjk cracklib debug jemalloc latin1 numa +perl profiling router +server tcmalloc
      s: '${WORKDIR}/mysql-{{ .Values.version }}'
      required_use: |
        ?? ( tcmalloc jemalloc )
        cjk? ( server )
        jemalloc? ( server )
        numa? ( server )
        profiling? ( server )
        router? ( server )
        tcmalloc? ( server )
      cdepend: |
        app-arch/lz4:=
        app-arch/zstd:=
        sys-libs/ncurses:=
        sys-libs/zlib:=
        dev-libs/openssl:=
        server? (
          dev-libs/icu:=
          dev-libs/libevent:=[ssl,threads]
          dev-libs/protobuf:=
          net-libs/libtirpc:=
          cjk? ( app-text/mecab:= )
          jemalloc? ( dev-libs/jemalloc:= )
          dev-libs/libaio:=
          sys-process/procps:=
          numa? ( sys-process/numactl )
          tcmalloc? ( dev-util/google-perftools:= )
        )
      depend: |
        ${CDEPEND}
        sys-devel/gcc
        virtual/yacc
        server? ( net-libs/rpcsvc-proto )
      rdepend: |
        ${CDEPEND}
        !dev-db/mariadb
        dev-db/mysql-init-scripts
      pdepend: |
        perl? ( dev-perl/DBD-mysql )
      extra_envs:
        - 'CMAKE_BUILD_TYPE="RelWithDebInfo"'
        - 'CMAKE_MAKEFILE_GENERATOR=emake'
      inherit:
        - cmake
        - flag-o-matic
        - toolchain-funcs
        - user
      body: |
        mysql_init_vars() {
          : ${MY_SHAREDSTATEDIR="${EPREFIX}/usr/share/mysql"}
          : ${MY_SYSCONFDIR="${EPREFIX}/etc/mysql"}
          : ${MY_LOCALSTATEDIR="${EPREFIX}/var/lib/mysql"}
          : ${MY_LOGDIR="${EPREFIX}/var/log/mysql"}
          MY_DATADIR="${MY_LOCALSTATEDIR}"
          export MY_SHAREDSTATEDIR MY_SYSCONFDIR
          export MY_LOCALSTATEDIR MY_LOGDIR
          export MY_DATADIR
        }
        pkg_setup() {
          enewgroup mysql 60 || die "problem adding 'mysql' group"
          enewuser mysql 60 -1 /dev/null mysql || die "problem adding 'mysql' user"
        }
        src_prepare() {
          # Avoid rpm call which would trigger sandbox, #692368
          sed -i \
            -e 's/MY_RPM rpm/MY_RPM rpmNOTEXISTENT/' \
            CMakeLists.txt || die
          # Remove the centos and rhel selinux policies to support mysqld_safe under SELinux
          if [[ -d "${S}/support-files/SELinux" ]] ; then
            echo > "${S}/support-files/SELinux/CMakeLists.txt" || die
          fi
          cmake_src_prepare
        }
        src_configure() {
          # Bug #114895, bug #110149
          filter-flags "-O" "-O[01]"
          append-cxxflags -felide-constructors
          append-cxxflags -std=c++17
          append-flags -fno-strict-aliasing
          mycmakeargs=(
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="$(usex debug '' '-DNDEBUG')"
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="$(usex debug '' '-DNDEBUG')"
            -DMYSQL_DATADIR="/var/lib/mysql"
            -DSYSCONFDIR="/etc/mysql"
            -DINSTALL_BINDIR=bin
            -DINSTALL_DOCDIR=share/doc/${PF}
            -DINSTALL_DOCREADMEDIR=share/doc/${PF}
            -DINSTALL_INCLUDEDIR=include/mysql
            -DINSTALL_INFODIR=share/info
            -DINSTALL_LIBDIR=$(get_libdir)
            -DINSTALL_MANDIR=share/man
            -DINSTALL_MYSQLSHAREDIR=share/mysql
            -DINSTALL_PLUGINDIR=$(get_libdir)/mysql/plugin
            -DINSTALL_MYSQLDATADIR="/var/lib/mysql"
            -DINSTALL_SBINDIR=sbin
            -DINSTALL_SUPPORTFILESDIR="/usr/share/mysql"
            -DCOMPILATION_COMMENT="MacaroniOS Linux {{ .Values.pn }}-{{ .Values.version }}"
            -DWITH_UNIT_TESTS=OFF
            -DWITH_EDITLINE=bundled
            -DWITH_ZLIB=system
            -DWITH_SSL=system
            -DWITH_LIBWRAP=0
            -DENABLED_LOCAL_INFILE=1
            -DMYSQL_UNIX_ADDR="/var/run/mysqld/mysqld.sock"
            -DWITH_DEFAULT_COMPILER_OPTIONS=0
            -DSTACK_DIRECTION=$(tc-stack-grows-down && echo -1 || echo 1)
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            -DWITH_CURL=system
            -DWITH_BOOST="${S}/boost"
            -DWITH_ROUTER=$(usex router ON OFF)
          )
          if is-flagq -fno-lto ; then
            einfo "LTO disabled via {C,CXX,F,FC}FLAGS"
            mycmakeargs+=( -DWITH_LTO=OFF )
          elif is-flagq -flto ; then
            einfo "LTO forced via {C,CXX,F,FC}FLAGS"
            myconf+=( -DWITH_LTO=ON )
          else
            myconf+=( -DWITH_LTO=OFF )
          fi
          mycmakeargs+=( -DINSTALL_MYSQLTESTDIR='' )
          mycmakeargs+=(
            -DWITH_ICU=system
            -DWITH_LZ4=system
            -DWITH_RAPIDJSON=bundled
            -DWITH_ZSTD=system
          )
          if [[ -n "${MYSQL_DEFAULT_CHARSET}" && -n "${MYSQL_DEFAULT_COLLATION}" ]] ; then
            ewarn "You are using a custom charset of ${MYSQL_DEFAULT_CHARSET}"
            ewarn "and a collation of ${MYSQL_DEFAULT_COLLATION}."
            ewarn "You MUST file bugs without these variables set."
            ewarn "Tests will probably fail!"
            mycmakeargs+=(
              -DDEFAULT_CHARSET=${MYSQL_DEFAULT_CHARSET}
              -DDEFAULT_COLLATION=${MYSQL_DEFAULT_COLLATION}
            )
          elif use latin1 ; then
            mycmakeargs+=(
              -DDEFAULT_CHARSET=latin1
              -DDEFAULT_COLLATION=latin1_swedish_ci
            )
          else
            mycmakeargs+=(
              -DDEFAULT_CHARSET=utf8mb4
              -DDEFAULT_COLLATION=utf8mb4_0900_ai_ci
            )
          fi
          if use server ; then
            mycmakeargs+=(
              -DWITH_EXTRA_CHARSETS=all
              -DWITH_DEBUG=$(usex debug)
              -DWITH_MECAB=$(usex cjk system OFF)
              -DWITH_LIBEVENT=system
              -DWITH_PROTOBUF=system
              -DWITH_NUMA=$(usex numa ON OFF)
            )
            if use jemalloc ; then
              mycmakeargs+=( -DWITH_JEMALLOC=ON )
            elif use tcmalloc ; then
              mycmakeargs+=( -DWITH_TCMALLOC=ON )
            fi
            if use profiling ; then
              mycmakeargs+=( -DENABLED_PROFILING=ON )
            fi
            mycmakeargs+=(
              -DWITH_EXAMPLE_STORAGE_ENGINE=0
              -DWITH_ARCHIVE_STORAGE_ENGINE=1
              -DWITH_BLACKHOLE_STORAGE_ENGINE=1
              -DWITH_CSV_STORAGE_ENGINE=1
              -DWITH_FEDERATED_STORAGE_ENGINE=1
              -DWITH_HEAP_STORAGE_ENGINE=1
              -DWITH_INNOBASE_STORAGE_ENGINE=1
              -DWITH_INNODB_MEMCACHED=0
              -DWITH_MYISAMMRG_STORAGE_ENGINE=1
              -DWITH_MYISAM_STORAGE_ENGINE=1
            )
          else
            mycmakeargs+=(
              -DWITHOUT_SERVER=1
              -DWITH_SYSTEMD=no
            )
          fi
          cmake_src_configure
        }
        src_install() {
          cmake_src_install
          # Make sure the vars are correctly initialized
          mysql_init_vars
          # Convenience links
          einfo "Making Convenience links for mysqlcheck multi-call binary"
          dosym "mysqlcheck" "/usr/bin/mysqlanalyze"
          dosym "mysqlcheck" "/usr/bin/mysqlrepair"
          dosym "mysqlcheck" "/usr/bin/mysqloptimize"
          # INSTALL_LAYOUT=STANDALONE causes cmake to create a /usr/data dir
          if [[ -d "${ED}/usr/data" ]] ; then
            rm -Rf "${ED}/usr/data" || die
          fi
          # Unless they explicitly specific USE=test, then do not install the
          # testsuite. It DOES have a use to be installed, esp. when you want to do a
          # validation of your database configuration after tuning it.
          rm -rf "${ED}/${MY_SHAREDSTATEDIR#${EPREFIX}}/mysql-test"
          # Configuration stuff
          einfo "Building default configuration ..."
          insinto "${MY_SYSCONFDIR#${EPREFIX}}"
          [[ -f "${S}/scripts/mysqlaccess.conf" ]] && doins "${S}"/scripts/mysqlaccess.conf
          cp "${FILESDIR}/my.cnf-8.0" "${TMPDIR}/my.cnf" || die
          eprefixify "${TMPDIR}/my.cnf"
          doins "${TMPDIR}/my.cnf"
          insinto "${MY_SYSCONFDIR#${EPREFIX}}/mysql.d"
          cp "${FILESDIR}/my.cnf-8.0.distro-client" "${TMPDIR}/50-distro-client.cnf" || die
          eprefixify "${TMPDIR}/50-distro-client.cnf"
          doins "${TMPDIR}/50-distro-client.cnf"
          mycnf_src="my.cnf-8.0.distro-server"
          sed -e "s!@DATADIR@!${MY_DATADIR}!g" \
            "${FILESDIR}/${mycnf_src}" \
            > "${TMPDIR}/my.cnf.ok" || die
          if use latin1 ; then
            sed -i \
              -e "/character-set/s|utf8mb4|latin1|g" \
              "${TMPDIR}/my.cnf.ok" || die
          fi
          eprefixify "${TMPDIR}/my.cnf.ok"
          newins "${TMPDIR}/my.cnf.ok" 50-distro-server.cnf
          #Remove mytop if perl is not selected
          [[ -e "${ED}/usr/bin/mytop" ]] && ! use perl && rm -f "${ED}/usr/bin/mytop"
          if use router ; then
            rm -rf \
              "${ED}/usr/LICENSE.router" \
              "${ED}/usr/README.router" \
              "${ED}/usr/run" \
              "${ED}/usr/var" \
              || die
          fi
          # Kill old libmysqclient_r symlinks if they exist. Time to fix what depends on them.
          find "${D}" -name 'libmysqlclient_r.*' -type l -delete || die
          local clientlibs_files=(
            ${ED}/usr/bin/perror
            ${ED}/usr/bin/comp_err
            ${ED}/usr/bin/zlib_decompress
            ${ED}/usr/bin/my_print_defaults
            ${ED}/usr/bin/mysql_config
            ${ED}/usr/lib64/libmysqlclient.*
            ${ED}/usr/lib64/pkgconfig
            ${ED}/usr/share/aclocal
            ${ED}/usr/include/mysql
            ${ED}/usr/share/man/man1/my_print_defaults.1*
            ${ED}/usr/share/man/man1/perror.1*
            ${ED}/usr/share/man/man1/zlib_decompress.1*
          )
          # Remove files associated with client libs:
          for x in ${clientlibs_files[@]}; do
            einfo "Removing $x"
            rm -rf $x || die
          done
        }
        pkg_postinst() {
          # Make sure the vars are correctly initialized
          mysql_init_vars
          # Create log directory securely if it does not exist
          # NOTE: $MY_LOGDIR contains $EPREFIX by default
          [[ -d "${MY_LOGDIR}" ]] || install -d -m0750 -o mysql -g mysql "${MY_LOGDIR}"
          # Note about configuration change
          einfo
          elog "Please follow these steps for initial setup. Run these commands as root:"
          einfo
          elog "# mysqld --initialize-insecure --default_authentication_plugin=mysql_native_password --datadir=${EPREFIX}/var/lib/mysql"
          elog "# /etc/init.d/mysql start"
          elog "# mysql_secure_installation"
          einfo
        }

  packages:

    - mysql-community:
        selector:
          - '<8.1'
          # Keep v8.0.45 for now because is the last
          # version having boost as thirdparty lib.
          - '<8.0.46'
        vars:
          slot: '8.0'


