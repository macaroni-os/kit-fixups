net_libs_github:
  generator: builtin-github
  template:
    engine: helm

  defaults:
    template: ../../templates/simple.tmpl
    category: net-libs
    github:
      query: releases

  packages:
    - nghttp2:
        github:
          user: nghttp2
        assets:
          - name: "{{ .Values.github_user }}-{{ .Values.version }}.tar.xz"
            matcher: "nghttp2-.*.tar.xz"
        transform:
          - kind: string
            match: 'nghttp2 v'
            replace: ''
        vars:
          homepage: https://nghttp2.org/
          desc: HTTP/2 C Library
          license: MIT
          iuse: debug hpack-tools jemalloc static-libs +threads utils xml
          rdepend: |
            hpack-tools? ( >=dev-libs/jansson-2.5 )
            jemalloc? ( dev-libs/jemalloc )
            utils? (
              >=dev-libs/libev-4.15
              >=sys-libs/zlib-1.2.3
              net-dns/c-ares:=
            )
            xml? ( >=dev-libs/libxml2-2.7.7:2 )

          depend: |
            ${RDEPEND}
            dev-libs/openssl
            virtual/pkgconfig

          body: |
            src_configure() {
              local myeconfargs=(
                --disable-examples
                --disable-failmalloc
                --disable-werror
                $(use_enable debug)
                $(use_enable hpack-tools)
                $(use_enable static-libs static)
                $(use_enable threads)
                $(use_enable utils app)
                $(use_with jemalloc)
                $(use_with xml libxml2)
              )
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
            }

            src_install() {
              default
              if ! use static-libs ; then
                find "${ED}"/usr -name '*.la' -delete || die
              fi
            }

sys_cluster_github:
  generator: builtin-github
  template:
    engine: j2cli

  defaults:
    category: sys-cluster
    files_dir: "{{ .Values.pn }}"
    github:
      query: tags

  packages:
    - glusterfs:
        github:
          user: gluster
        exclude:
          - '.*dev$'
          - '.*alpha|.*rc.*'

        vars:
          desc: GlusterFS is a powerful network/cluster filesystem
          homepage: https://www.gluster.org/ https://github.com/gluster/glusterfs/
          patches:
            - 11.0-extras-defer-invoking-of-gluster-volume-set-help.patch

