        url: https://github.com/vozlt/nginx-module-vts/archive/v{{ .Values.vhost_traffic_status_version }}.tar.gz
        use: nginx_modules_external_vhost_traffic_status
      - name: naxsi-{{ .Values.naxsi_version }}.tar.gz
        url: https://github.com/wargio/naxsi/archive/{{ .Values.naxsi_version }}.tar.gz
        use: nginx_modules_external_naxsi
      - name: nginx-rtmp-module-{{ .Values.rtmp_version }}.tar.gz
        url: https://github.com/arut/nginx-rtmp-module/archive/v{{ .Values.rtmp_version }}.tar.gz
        use: nginx_modules_external_rtmp
      - name: nginx_accept_language_module-{{ .Values.accept_language_sha }}.tar.gz
        url: https://github.com/giom/nginx_accept_language_module/archive/{{ .Values.accept_language_sha }}.tar.gz
        use: nginx_modules_external_accept_language
      - name: nginx-http-concat-{{ .Values.concat_version }}.tar.gz
        url: https://github.com/alibaba/nginx-http-concat/archive/{{ .Values.concat_version }}.tar.gz
        use: nginx_modules_external_concat
      - name: echo-nginx-module-{{ .Values.echo_version }}.tar.gz
        url: https://github.com/openresty/echo-nginx-module/archive/v{{ .Values.echo_version }}.tar.gz
        use: nginx_modules_external_echo
      - name: ModSecurity-nginx-{{ .Values.modsecurity_version }}.tar.gz
        url: https://github.com/owasp-modsecurity/ModSecurity-nginx/archive/v{{ .Values.modsecurity_version }}.tar.gz
        use: nginx_modules_external_modsecurity
      - name: nginx-push-stream-module-{{ .Values.push_stream_pv }}.tar.gz
        url: https://github.com/wandenberg/nginx-push-stream-module/archive/{{ .Values.push_stream_sha }}.tar.gz
        use: nginx_modules_external_push_stream
      - name: nginx-sticky-module-ng-{{ .Values.sticky_sha }}.tar.gz
        url: https://github.com/dvershinin/nginx-sticky-module-ng/archive/{{ .Values.sticky_sha }}.tar.gz
        use: nginx_modules_external_sticky
      - name: nginx_ajp_module-{{ .Values.ajp_version }}.tar.gz
        url: https://github.com/dvershinin/nginx_ajp_module/archive/v{{ .Values.ajp_version }}.tar.gz
        use: nginx_modules_external_ajp
      - name: njs-{{ .Values.njs_version }}.tar.gz
        url: https://github.com/nginx/njs/archive/{{ .Values.njs_version }}.tar.gz
        use: nginx_modules_external_njs
    vars:
      desc: Robust, small and high performance http and reverse proxy server
      homepage: http://nginx.org
      license: BSD-2
      restrict: test
      iuse: '+aio +http +http2 +http-cache +pcre pcre-jit +poll rtmp +select cpp_test debug full google_perftools +ipv6 libatomic luajit ssl stream systemd threads vim-syntax'
      ndk_version: '0.3.3'
      brotli_version: 1.0.0rc
      upload_progress_version: '0.9.2'
      headers_more_version: '0.37'
      cache_purge_version: '2.3'
      slowfs_cache_version: '1.10'
      dav_ext_version: '3.0.0'
      encrypted_session_sha: '5ab56cebe8771081942b85066ebad05c2017a6f3'
      fancyindex_version: '0.5.2'
      mogilefs_version: '1.0.4'
      push_sha: b95f64c0f49223ebcaddb18609ac5644d41fca14
      lua_version: '0.10.26'
      auth_pam_version: '1.5.5'
      upstream_check_sha: '87bfa66ddf16c17053ba7bbae72400c9939ecf6d'
      metrics_version: '0.1.1'
      vhost_traffic_status_version: '0.2.2'
      naxsi_version: '1.6'
      rtmp_version: '1.2.2'
      accept_language_sha: '2f69842f83dac77f7d98b41a2b31b13b87aeaba7'
      concat_version: '1.2.2'
      echo_version: '0.63'
      modsecurity_version: '1.0.3'
      push_stream_sha: f858fc01e809bc87cc667e1cdd38fc35492cd2f5
      push_stream_pv: 0.5.5-2-gf858fc01
      sticky_sha: '08a395c66e425540982c00482f55034e1fee67b6'
      ajp_version: '0.3.3'
      njs_version: '1.0.2'
      required_use: |-

            full? (
                nginx_modules_http_access
                nginx_modules_http_addition
                nginx_modules_http_auth_basic
                nginx_modules_http_auth_request
                nginx_modules_http_autoindex
                nginx_modules_http_browser
                nginx_modules_http_charset
                nginx_modules_http_dav
                nginx_modules_http_degradation
                nginx_modules_http_empty_gif
                nginx_modules_http_fastcgi
                nginx_modules_http_flv
                nginx_modules_http_geo
                nginx_modules_http_geoip
                nginx_modules_http_grpc
                nginx_modules_http_gunzip
                nginx_modules_http_gzip
                nginx_modules_http_gzip_static
                nginx_modules_http_image_filter
                nginx_modules_http_limit_conn
                nginx_modules_http_limit_req
                nginx_modules_http_map
                nginx_modules_http_memcached
                nginx_modules_http_mirror
                nginx_modules_http_mp4
                nginx_modules_http_perl
                nginx_modules_http_proxy
                nginx_modules_http_random_index
                nginx_modules_http_realip
                nginx_modules_http_referer
                nginx_modules_http_rewrite
                nginx_modules_http_scgi
                nginx_modules_http_secure_link
                nginx_modules_http_split_clients
                nginx_modules_http_ssi
                nginx_modules_http_ssl
                nginx_modules_http_stub_status
                nginx_modules_http_sub
                nginx_modules_http_upstream_hash
                nginx_modules_http_upstream_ip_hash
                nginx_modules_http_upstream_keepalive
                nginx_modules_http_upstream_least_conn
                nginx_modules_http_upstream_zone
                nginx_modules_http_userid
                nginx_modules_http_uwsgi
                nginx_modules_http_xslt
                nginx_modules_mail_imap
                nginx_modules_mail_pop3
                nginx_modules_mail_smtp
                nginx_modules_stream_access
                nginx_modules_stream_geo
                nginx_modules_stream_geoip
                nginx_modules_stream_limit_conn
                nginx_modules_stream_map
                nginx_modules_stream_realip
                nginx_modules_stream_return
                nginx_modules_stream_split_clients
                nginx_modules_stream_ssl_preread
                nginx_modules_stream_upstream_hash
                nginx_modules_stream_upstream_least_conn
                nginx_modules_stream_upstream_zone
            )
            pcre-jit? ( pcre )
            nginx_modules_http_grpc? ( http2 )
            nginx_modules_external_dav_ext? ( nginx_modules_http_dav nginx_modules_http_xslt )
            nginx_modules_external_encrypted_session? ( nginx_modules_external_ndk )
            nginx_modules_external_lua? (
                luajit
                nginx_modules_http_rewrite
            )
            nginx_modules_external_metrics? ( nginx_modules_http_stub_status )
            nginx_modules_external_modsecurity? ( pcre )
            nginx_modules_external_naxsi? ( pcre )
            nginx_modules_external_push_stream? ( ssl )
      patches:
        - patches/nginx-fix-perl-install-path.patch
        - patches/nginx-httpoxy-mitigation-r1.patch
