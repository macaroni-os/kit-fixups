      - name: ngx_slowfs_cache-{{ .Values.slowfs_cache_version }}.tar.gz
        url: https://github.com/FRiCKLE/ngx_slowfs_cache/archive/{{ .Values.slowfs_cache_version }}.tar.gz
        use: nginx_modules_external_slowfs_cache
      - name: nginx-dav-ext-module-{{ .Values.dav_ext_version }}.tar.gz
        url: https://github.com/arut/nginx-dav-ext-module/archive/v{{ .Values.dav_ext_version }}.tar.gz
        use: nginx_modules_external_dav_ext
      - name: encrypted-session-nginx-module-{{ .Values.encrypted_session_sha }}.tar.gz
        url: https://github.com/openresty/encrypted-session-nginx-module/archive/{{ .Values.encrypted_session_sha }}.tar.gz
        use: nginx_modules_external_encrypted_session
      - name: ngx-fancyindex-{{ .Values.fancyindex_version }}.tar.gz
        url: https://github.com/aperezdc/ngx-fancyindex/archive/v{{ .Values.fancyindex_version }}.tar.gz
        use: nginx_modules_external_fancyindex
      - name: nginx-mogilefs-module-{{ .Values.mogilefs_version }}.tar.gz
        url: https://github.com/vkholodkov/nginx-mogilefs-module/archive/{{ .Values.mogilefs_version }}.tar.gz
