      - name: nchan-{{ .Values.push_sha }}.tar.gz
        url: https://github.com/slact/nchan/archive/{{ .Values.push_sha }}.tar.gz
        use: nginx_modules_external_push
      - name: lua-nginx-module-{{ .Values.lua_version }}.tar.gz
        url: https://github.com/openresty/lua-nginx-module/archive/v{{ .Values.lua_version }}.tar.gz
        use: nginx_modules_external_lua
      - name: ngx_http_auth_pam_module-{{ .Values.auth_pam_version }}.tar.gz
        url: https://github.com/stogh/ngx_http_auth_pam_module/archive/v{{ .Values.auth_pam_version }}.tar.gz
        use: nginx_modules_external_auth_pam
      - name: nginx_upstream_check_module-{{ .Values.upstream_check_sha }}.tar.gz
        url: https://github.com/yaoweibin/nginx_upstream_check_module/archive/{{ .Values.upstream_check_sha }}.tar.gz
