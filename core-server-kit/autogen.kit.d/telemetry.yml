grafana:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    category: www-apps
    files_dir: '{{ .Values.pn | replace "-bin" "" }}'
    dir:
      url: https://github.com/grafana/grafana/releases
      matcher: grafana.com/grafana/download

    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
        url: https://dl.grafana.com/oss/release/{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-amd64.tar.gz
        use: amd64

      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-arm64.tar.gz'
        url: https://dl.grafana.com/oss/release/{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-arm64.tar.gz
        use: arm64
    transform:
      - kind: string
        match: "https://grafana.com/grafana/download/"
        replace: ""
    vars:
      license: AGPL-3
      iuse: amd64 arm64 systemd
      inherit:
        - user
        - systemd
  packages:
    - grafana-bin:
        vars:
          desc: The open and composable observability and data visualization platform
          homepage: https://grafana.org https://github.com/grafana/grafana
          rdepend: |
            media-libs/fontconfig
          body: |
            post_src_unpack() {
              mv grafana-* "${S}"
            }
            pkg_setup() {
              enewgroup grafana
              enewuser grafana -1 -1 /usr/share/grafana grafana
            }
            src_install() {
              keepdir /etc/grafana
              insinto /etc/grafana
              newins "${S}"/conf/sample.ini grafana.ini
              rm "${S}"/conf/sample.ini || die

              # Frontend assets
              insinto /usr/share/grafana
              doins -r public conf

              dobin bin/grafana

              newconfd "${FILESDIR}"/grafana.confd grafana
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/grafana.service || die
              else
                newinitd "${FILESDIR}"/grafana.initd.4 grafana
              fi

              keepdir /var/{lib,log}/grafana
              keepdir /var/lib/grafana/{dashboards,plugins}
              fowners grafana:grafana /var/{lib,log}/grafana
              fowners grafana:grafana /var/lib/grafana/{dashboards,plugins}
              fperms 0750 /var/{lib,log}/grafana
              fperms 0750 /var/lib/grafana/{dashboards,plugins}
            }
            postinst() {
              elog "${PN} has built-in log rotation. Please see [log.file] section of"
              elog "/etc/grafana/grafana.ini for related settings."
              elog
              elog "You may add your own custom configuration for app-admin/logrotate if you"
              elog "wish to use external rotation of logs. In this case, you also need to make"
              elog "sure the built-in rotation is turned off."
            }

tempo:
  generator: builtin-github

  defaults:
    template: ../../templates/simple.tmpl
    category: app-metrics
    files_dir: '{{ .Values.pn | replace "-bin" "" }}'
    github:
      user: grafana
      repo: tempo

    vars:
      desc: Grafana Tempo distributed tracing backend
      homepage: https://grafana.com/oss/tempo/ https://github.com/grafana/tempo
      license: AGPL-3
      inherit:
        - user
        - systemd
      docs:
        - CHANGELOG.md
        - LICENSE
        - README.md
      body: |
        {{ $pn := .Values.pn | replace "-bin" "" }}
        pkg_setup() {
          enewgroup tempo 514
          enewuser tempo 514 -1 /var/lib/tempo tempo
        }
        {{- if eq .Values.pn "tempo-bin" }}

        src_compile() { :; }
        {{- else }}

        post_src_unpack() {
          mv {{ .Values.github_user }}-{{ .Values.github_repo }}-* "${S}"
        }

        src_compile() {
          local ldflags="-X main.Version={{ .Values.pv }}-{{ substr 0 7 .Values.sha }}"
          for c in tempo tempo-query tempo-cli ; do
            go build -mod=vendor -trimpath -ldflags "${ldflags}" -o bin/"${c}" ./cmd/"${c}" || die
          done
        }
        {{- end }}

        src_install() {
          {{- if eq .Values.pn "tempo-bin" }}
          dobin tempo tempo-query tempo-cli
          {{- else }}
          dobin bin/tempo bin/tempo-query bin/tempo-cli
          {{- end }}
          einstalldocs
          insinto /etc/tempo
          newins "${FILESDIR}/config.yml" config.yml
          newconfd "${FILESDIR}/{{ $pn }}.confd" {{ $pn }}
          if use systemd ; then
            systemd_dounit "${FILESDIR}/{{ $pn }}.service"
          else
            newinitd "${FILESDIR}/{{ $pn }}.initd" {{ $pn }}
          fi
          keepdir /var/{lib,log}/"{{ $pn }}"
          fowners tempo:tempo /var/{lib,log}/"{{ $pn }}"
          fperms 0750 /var/{lib,log}/"{{ $pn }}"
        }

  packages:
    - tempo:
        vars:
          iuse: systemd
          restrict: strip
          bdepend: |
            dev-lang/go
          rdepend: |
            !app-metrics/tempo-bin

    - tempo-bin:
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
            matcher: '^tempo_{{ .Values.version }}_linux_amd64\.tar\.gz$'
            use: amd64

          - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-arm64.tar.gz'
            matcher: '^tempo_{{ .Values.version }}_linux_arm64\.tar\.gz$'
            use: arm64
        vars:
          iuse: amd64 arm64 systemd
          restrict: strip
          s: '${WORKDIR}'
          rdepend: |
            !app-metrics/tempo

