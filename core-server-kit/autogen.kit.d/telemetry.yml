prometheus-exporters:
  generator: builtin-github

  defaults:
    template: ../../templates/simple.tmpl
    category: app-metrics
    files_dir: '{{ .Values.pn | replace "-bin" "" }}'
    github:
      query: releases
      user: prometheus
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
        matcher: '{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-amd64.tar.gz$'
        use: amd64

      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-arm64.tar.gz'
        matcher: '{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-arm64.tar.gz$'
        use: arm64
    transform:
      - kind: regex
        match: " /.*"
        replace: ""
    vars:
      extra_envs:
        - 'MY_PN=${PN/-bin/}'
        - 'MY_PN_BASE=${MY_PN/_exporter/}'
        - 'EXPORTER_USER="${MY_PN}"'
        - 'EXPORTER_HOME="/var/lib/${MY_PN}"'
      inherit:
        - user
      license: Apache-2.0
      iuse: amd64 arm64
      body: |
        post_src_unpack() {
          mv {{ .Values.github_repo }}-* ${S}
        }

        pkg_setup() {
          enewgroup ${EXPORTER_USER}
          enewuser ${EXPORTER_USER} -1 -1 "${EXPORTER_HOME}" ${EXPORTER_USER}
        }

        src_install() {
          dobin ${MY_PN}
          {{- if eq .Values.pn "blackbox_exporter-bin" }}
          insinto /etc/"${MY_PN}"
          doins ${MY_PN_BASE}.yml
          {{- end }}
          newconfd ${FILESDIR}/${MY_PN}.confd ${MY_PN}
          newinitd ${FILESDIR}/exporter.initd ${MY_PN}
          keepdir /var/{lib,log}/"${MY_PN}"
          fowners ${EXPORTER_USER}:${EXPORTER_USER} /var/{lib,log}/"${MY_PN}"
          fperms 0750 /var/{lib,log}/"${MY_PN}"
        }

  packages:
    - blackbox_exporter-bin:
        github:
          repo: blackbox_exporter
        vars:
          desc: Blackbox prober exporter
          homepage: "https://github.com/prometheus/blackbox_exporter"

    - consul_exporter-bin:
        github:
          repo: consul_exporter
        vars:
          desc: Exporter for Consul metrics
          homepage: "https://github.com/prometheus/consul_exporter"

    - memcached_exporter-bin:
        github:
          repo: memcached_exporter
        vars:
          desc: Exports metrics from memcached servers for consumption by Prometheus.
          homepage: "https://github.com/prometheus/memcached_exporter"

    - mysqld_exporter-bin:
        github:
          repo: mysqld_exporter
        vars:
          desc: Exporter for MySQL server metrics
          homepage: "https://github.com/prometheus/mysqld_exporter"

    - node_exporter-bin:
        github:
          repo: node_exporter
        vars:
          desc: Exporter for machine metrics
          homepage: "https://github.com/prometheus/node_exporter"

    - redis_exporter-bin:
        github:
          user: oliver006
          repo: redis_exporter
        vars:
          desc: Prometheus Exporter for ValKey & Redis Metrics.
          homepage: "https://github.com/prometheus/redis_exporter"

        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-v{{ .Values.version }}.linux-amd64.tar.gz$'
            use: amd64

          - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-arm64.tar.gz'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-v{{ .Values.version }}.linux-arm64.tar.gz$'
            use: arm64

prometheus:
  generator: builtin-github

  defaults:
    template: ../../templates/simple.tmpl
    category: app-metrics
    files_dir: '{{ .Values.pn | replace "-bin" "" }}'
    github:
      query: releases
      user: prometheus

    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
        matcher: '{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-amd64.tar.gz$'
        use: amd64

      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-arm64.tar.gz'
        matcher: '{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-arm64.tar.gz$'
        use: arm64
    transform:
      - kind: regex
        match: " /.*"
        replace: ""
    vars:
      inherit:
        - user
      license: Apache-2.0
      iuse: amd64 arm64
  packages:
    - alertmanager-bin:
        github:
          repo: alertmanager
        vars:
          desc: Prometheus Alertmanager
          extra_envs:
            - 'MY_PN=${PN/-bin/}'
            - 'ALERTMANAGER_USER="${MY_PN}"'
            - 'ALERTMANAGER_HOME="/var/lib/${MY_PN}"'
          body: |
            post_src_unpack() {
              mv {{ .Values.github_repo }}-* ${S}
            }

            pkg_setup() {
              enewgroup ${ALERTMANAGER_USER}
              enewuser ${ALERTMANAGER_USER} -1 -1 "${ALERTMANAGER_HOME}" ${ALERTMANAGER_USER}
            }

            src_install() {
              dobin ${MY_PN} amtool
              insinto /etc/"${MY_PN}"
              doins ${MY_PN}.yml
              newconfd ${FILESDIR}/${MY_PN}.confd ${MY_PN}
              newinitd ${FILESDIR}/${MY_PN}.initd ${MY_PN}
              keepdir /var/{lib,log}/"${MY_PN}"
              fowners ${ALERTMANAGER_USER}:${ALERTMANAGER_USER} /var/{lib,log}/"${MY_PN}"
              fperms 0750 /var/{lib,log}/"${MY_PN}"
            }

    - prometheus-bin:
        github:
          repo: prometheus
        vars:
          extra_envs:
            - 'MY_PN=${PN/-bin/}'
            - 'PROMETHEUS_USER="${MY_PN}"'
            - 'PROMETHEUS_HOME="/var/lib/${MY_PN}"'
          desc: "The Prometheus monitoring system and time series database."
          body: |
            post_src_unpack() {
              mv {{ .Values.github_repo }}-* ${S}
            }

            pkg_setup() {
              enewgroup ${PROMETHEUS_USER}
              enewuser ${PROMETHEUS_USER} -1 -1 "${PROMETHEUS_HOME}" ${PROMETHEUS_USER}
            }

            src_install() {
              dobin ${MY_PN} promtool
              insinto /etc/"${MY_PN}"
              doins ${MY_PN}.yml
              newconfd ${FILESDIR}/${MY_PN}.confd ${MY_PN}
              newinitd ${FILESDIR}/${MY_PN}.initd ${MY_PN}
              keepdir /var/{lib,log}/"${MY_PN}"
              fowners ${PROMETHEUS_USER}:${PROMETHEUS_USER} /var/{lib,log}/"${MY_PN}"
              fperms 0750 /var/{lib,log}/"${MY_PN}"
            }

grafana:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    category: www-apps
    files_dir: '{{ .Values.pn | replace "-bin" "" }}'
    dir:
      url: https://github.com/grafana/grafana/releases
      matcher: grafana.com/grafana/download

    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
        url: https://dl.grafana.com/oss/release/{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-amd64.tar.gz
        use: amd64

      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-arm64.tar.gz'
        url: https://dl.grafana.com/oss/release/{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-arm64.tar.gz
        use: arm64
    transform:
      - kind: string
        match: "https://grafana.com/grafana/download/"
        replace: ""
    vars:
      license: AGPL-3
      iuse: amd64 arm64
      inherit:
        - user
  packages:
    - grafana-bin:
        vars:
          desc: The open and composable observability and data visualization platform
          homepage: https://grafana.org https://github.com/grafana/grafana
          rdepend: |
            media-libs/fontconfig
          body: |
            post_src_unpack() {
              mv grafana-* "${S}"
            }
            pkg_setup() {
              enewgroup grafana
              enewuser grafana -1 -1 /usr/share/grafana grafana
            }
            src_install() {
              keepdir /etc/grafana
              insinto /etc/grafana
              newins "${S}"/conf/sample.ini grafana.ini
              rm "${S}"/conf/sample.ini || die

              # Frontend assets
              insinto /usr/share/grafana
              doins -r public conf

              dobin bin/grafana
              dobin bin/grafana-cli
              dobin bin/grafana-server

              newconfd "${FILESDIR}"/grafana.confd grafana
              newinitd "${FILESDIR}"/grafana.initd.3 grafana

              keepdir /var/{lib,log}/grafana
              keepdir /var/lib/grafana/{dashboards,plugins}
              fowners grafana:grafana /var/{lib,log}/grafana
              fowners grafana:grafana /var/lib/grafana/{dashboards,plugins}
              fperms 0750 /var/{lib,log}/grafana
              fperms 0750 /var/lib/grafana/{dashboards,plugins}
            }
            postinst() {
              elog "${PN} has built-in log rotation. Please see [log.file] section of"
              elog "/etc/grafana/grafana.ini for related settings."
              elog
              elog "You may add your own custom configuration for app-admin/logrotate if you"
              elog "wish to use external rotation of logs. In this case, you also need to make"
              elog "sure the built-in rotation is turned off."
              elog
              elog "As of version 7.0.0, grafana uses a separate plugin to render panels and dashboards to PNGs"
              elog
              elog "If you want this functionality simply run:"
              elog "grafana-cli plugins install grafana-image-renderer"
            }
