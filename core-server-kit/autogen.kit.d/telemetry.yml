prometheus-exporters:
  generator: builtin-github

  defaults:
    template: ../../templates/simple.tmpl
    category: app-metrics
    files_dir: '{{ .Values.pn | replace "-bin" "" }}'
    github:
      query: releases
      user: prometheus
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
        matcher: '{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-amd64.tar.gz$'
        use: amd64

      - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-arm64.tar.gz'
        matcher: '{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}.linux-arm64.tar.gz$'
        use: arm64
    transform:
      - kind: regex
        match: " /.*"
        replace: ""
    vars:
      extra_envs:
        - 'MY_PN=${PN/-bin/}'
        - 'MY_PN_BASE=${MY_PN/_exporter/}'
        - 'EXPORTER_USER="${MY_PN}"'
        - 'EXPORTER_HOME="/var/lib/${MY_PN}"'
      inherit:
        - user
      license: Apache-2.0
      iuse: amd64 arm64
      body: |
        post_src_unpack() {
          mv {{ .Values.github_repo }}-* ${S}
        }

        pkg_setup() {
          enewgroup ${EXPORTER_USER}
          enewuser ${EXPORTER_USER} -1 -1 "${EXPORTER_HOME}" ${EXPORTER_USER}
        }

        src_install() {
          dobin ${MY_PN}
          if [ "${MY_PN}" == "blackbox_exporter" ] ; then
            insinto /etc/"${MY_PN}"
            doins ${MY_PN_BASE}.yml
          fi
          newconfd ${FILESDIR}/${MY_PN}.confd ${MY_PN}
          newinitd ${FILESDIR}/exporter.initd ${MY_PN}
          keepdir /var/{lib,log}/"${MY_PN}"
          fowners ${EXPORTER_USER}:${EXPORTER_USER} /var/{lib,log}/"${MY_PN}"
          fperms 0750 /var/{lib,log}/"${MY_PN}"
        }

  packages:
    - blackbox_exporter-bin:
        github:
          repo: blackbox_exporter
        vars:
          homepage: "https://github.com/prometheus/blackbox_exporter"

    - consul_exporter-bin:
        github:
          repo: consul_exporter
        vars:
          homepage: "https://github.com/prometheus/consul_exporter"

    - memcached_exporter-bin:
        github:
          repo: memcached_exporter
        vars:
          homepage: "https://github.com/prometheus/memcached_exporter"

    - mysqld_exporter-bin:
        github:
          repo: mysqld_exporter
        vars:
          homepage: "https://github.com/prometheus/mysqld_exporter"

