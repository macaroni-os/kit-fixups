python_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    template: "../../templates/pypi-generic.tmpl"
    category: app-admin
    vars:
      du_pep517: setuptools
    python_compat: "python3+"
  packages:
    - ansible:
        selector:
          - '<9.0.2'
        python_requires_ignore: "true"
        vars:
          license: GPL-3+
          rdepend: |
            virtual/ssh
            net-misc/sshpass
        pydeps:
          py:all:
            - cryptography
            - httplib2
            - importlib_resources
            - jinja
            - netaddr
            - paramiko
            - pexpect
            - pyyaml
            - six
          py:all:build:
            - packaging

emulation_modules:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: app-emulation
  packages:

    - qemu:
        dir:
          url: https://download.qemu.org/
          matcher: '{{ .Values.pn }}-.*.tar.xz$'
          exclude: 'rc|reupload'
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
          - kind: string
            match: '-'
            replace: '.'
        vars:
          python_compat: python3+
          desc: QEMU + Kernel-based Virtual Machine userland tools
          homepage: https://www.qemu.org https://www.linux-kvm.org
          license: GPL-2 LGPL-2 BSD-2
          commons_targets:
            - aarch64
            - alpha
            - arm
            - hppa
            - i386
            - loongarch64
            - m68k
            - microblaze
            - microblazeel
            - mips
            - mips64
            - mips64el
            - mipsel
            - nios2
            - or1k
            - ppc
            - ppc64
            - riscv32
            - riscv64
            - s390x
            - sh4
            - sh4eb
            - sparc
            - sparc64
            - x86_64
            - xtensa
            - xtensaeb
          softmmu_targets:
            - avr
            - rx
            - tricore
          user_targets:
            - aarch64_be
            - armeb
            - hexagon
            - mipsn32
            - mipsn32el
            - ppc64le
            - sparc32plus
          inherit:
            - toolchain-funcs
            - python-r1
            - udev
            - fcaps
            - pax-utils
            - xdg-utils
          extra_envs:
            - 'PYTHON_REQ_USE="ncurses,readline"'
            - |
              QA_PREBUILT="
              usr/share/qemu/hppa-firmware.img
              usr/share/qemu/hppa-firmware64.img
              usr/share/qemu/openbios-ppc
              usr/share/qemu/openbios-sparc64
              usr/share/qemu/openbios-sparc32
              usr/share/qemu/opensbi-riscv64-generic-fw_dynamic.elf
              usr/share/qemu/opensbi-riscv32-generic-fw_dynamic.elf
              usr/share/qemu/palcode-clipper
              usr/share/qemu/s390-ccw.img
              usr/share/qemu/s390-netboot.img
              usr/share/qemu/u-boot.e500
              "
            - |
              QA_WX_LOAD="
              usr/bin/qemu-i386
              usr/bin/qemu-x86_64
              usr/bin/qemu-alpha
              usr/bin/qemu-arm
              usr/bin/qemu-cris
              usr/bin/qemu-m68k
              usr/bin/qemu-microblaze
              usr/bin/qemu-microblazeel
              usr/bin/qemu-mips
              usr/bin/qemu-mipsel
              usr/bin/qemu-or1k
              usr/bin/qemu-ppc
              usr/bin/qemu-ppc64
              usr/bin/qemu-sh4
              usr/bin/qemu-sh4eb
              usr/bin/qemu-sparc
              usr/bin/qemu-sparc64
              usr/bin/qemu-armeb
              usr/bin/qemu-sparc32plus
              usr/bin/qemu-s390x
              usr/bin/qemu-unicore32
              "
          patches:
            - qemu-10.1.2-fix_passt.patch
            - qemu-9.0.0-disable-keymap.patch
            - qemu-9.2.0-capstone-include-path.patch
            - qemu-8.1.0-skip-tests.patch
            - qemu-8.1.0-find-sphinx.patch
            - qemu-7.2.16-optionrom-pass-Wl-no-error-rwx-segments.patch
          iuse: |
            accessibility +aio alsa bpf bzip2 capstone +curl debug doc
            +fdt fuse glusterfs +gnutls gtk infiniband iscsi io-uring
            jack jemalloc +jpeg keyutils lzo multipath ncurses nfs
            nls numa opengl +oss pam passt +pin-upstream-blobs
            plugins +png pulseaudio python rbd sasl +seccomp sdl
            sdl-image +slirp smartcard snappy spice ssh static static-user
            systemtap udev usb usbredir vde +vhost-net vhost-user-fs
            virgl virtfs +vnc vte xattr xen zstd
            {{- range $c := .Values.commons_targets }}
            qemu_softmmu_targets_{{ $c }}
            {{- end }}
            {{- range $c := .Values.softmmu_targets }}
            qemu_softmmu_targets_{{ $c }}
            {{- end }}
            {{- range $c := .Values.commons_targets }}
            qemu_user_targets_{{ $c }}
            {{- end }}
            {{- range $c := .Values.user_targets }}
            qemu_user_targets_{{ $c }}
            {{- end }}
          required_use: |
            ${PYTHON_REQUIRED_USE}
            qemu_softmmu_targets_arm? ( fdt )
            qemu_softmmu_targets_microblaze? ( fdt )
            qemu_softmmu_targets_mips64el? ( fdt )
            qemu_softmmu_targets_ppc64? ( fdt )
            qemu_softmmu_targets_ppc? ( fdt )
            qemu_softmmu_targets_riscv32? ( fdt )
            qemu_softmmu_targets_riscv64? ( fdt )
            qemu_softmmu_targets_x86_64? ( fdt )
            sdl-image? ( sdl )
            static? ( static-user !alsa !gtk !jack !opengl !pam !pulseaudio !plugins !rbd !snappy !udev )
            static-user? ( !plugins )
            vhost-user-fs? ( seccomp )
            virgl? ( opengl )
            virtfs? ( xattr )
            vnc? ( gnutls )
            vte? ( gtk )
            multipath? ( udev )
            plugins? ( !static !static-user )
