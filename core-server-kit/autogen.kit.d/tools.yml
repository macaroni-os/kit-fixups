            - dep:
                - sys-libs/libcap-ng
              dep_use:
                - 'static-libs(+)'
            - dep:
                - x11-libs/pixman
              dep_use:
                - 'static-libs(+)'
            - use: accessibility
              dep:
                - app-accessibility/brltty
              dep_use:
                - api
                - 'static-libs(+)'
            - use: aio
