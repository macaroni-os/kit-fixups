python_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    template: "../../templates/pypi-generic.tmpl"
    category: app-admin
    vars:
      du_pep517: setuptools
    python_compat: "python3+"
  packages:
    - ansible:
        selector:
          - '<9.0.2'
        python_requires_ignore: "true"
        vars:
          license: GPL-3+
          rdepend: |
            virtual/ssh
            net-misc/sshpass
        pydeps:
          py:all:
            - cryptography
            - httplib2
            - importlib_resources
            - jinja
            - netaddr
            - paramiko
            - pexpect
            - pyyaml
            - six
          py:all:build:
            - packaging


emulation_modules:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    category: app-emulation
  packages:
    - virt-manager:
        dir:
          url: https://releases.pagure.org/virt-manager/
          matcher: "virt-manager-.*.tar.xz$"
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
        transform:
          - kind: string
            match: 'virt-manager-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          python_compat: "python3+"
          github_user: virt-manager
          github_repo: virt-manager
          license: GPL-2+
          homepage: https://virt-manager.org https://github.com/virt-manager/virt-manager
          desc: A graphical tool for administering virtual machines/containers
          iuse: gtk policykit sasl
          required_use: ${PYTHON_REQUIRED_USE}
          inherit:
            - gnome3
            - python-single-r1
            - meson
          rdepend: |
            ${PYTHON_DEPS}
            || ( dev-libs/libisoburn app-cdr/cdrtools )
            app-emulation/libvirt-glib[introspection]
            $(python_gen_cond_dep '
              dev-libs/libxml2[python,${PYTHON_USEDEP}]
              dev-python/argcomplete[${PYTHON_USEDEP}]
              dev-python/libvirt-python[${PYTHON_USEDEP}]
              dev-python/pygobject:3[${PYTHON_USEDEP}]
              dev-python/requests[${PYTHON_USEDEP}]
            ')
            sys-libs/libosinfo[introspection]
            gtk? (
              gnome-base/dconf
              net-libs/gtk-vnc[gtk3(+),introspection]
              net-misc/spice-gtk[usbredir,gtk3,introspection,sasl?]
              policykit? ( sys-auth/polkit[introspection] )
              sys-apps/dbus[X]
              x11-libs/gtk+:3[introspection]
              || (
                x11-libs/gtksourceview:4[introspection]
                x11-libs/gtksourceview:3.0[introspection]
              )
              x11-libs/vte:2.91[introspection]
            )
          depend: ${RDEPEND}
          bdepend: |
            sys-devel/gettext
          body: |
            src_configure() {
              local emesonargs=(
                -Dupdate-icon-cache=false
                -Dcompile-schemas=false
                -Ddefault-graphics=spice # default
                -Dtests=disabled
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if ! use gtk; then
                rm -r "${ED}/usr/share/applications/${PN}.desktop" || die
                rm -r "${ED}/usr/share/${PN}/icons/" || die
                rm -r "${ED}/usr/share/${PN}/ui/" || die
                rm -r "${ED}/usr/share/icons/" || die
                rm -r "${ED}/usr/bin/${PN}" || die
              fi
              python_fix_shebang "${ED}"
              python_optimize "${ED}"/usr/share/virt-manager/virt{inst,Manager}
            }
            pkg_postinst() {
              use gtk && gnome3_pkg_postinst
            }

sudo:
  generator: builtin-dirlisting
  defaults:
    template: templates/sudo.tmpl
    category: app-admin
  packages:
    - sudo:
        dir:
          url: https://www.sudo.ws/dist/
          matcher: "sudo-.*.tar.gz"
        transform:
          - kind: string
            match: 'sudo-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
          - kind: string
            match: 'p'
            replace: '.'

fish_github:
  generator: builtin-github
  defaults:
    category: app-shells
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl

  extensions_defs:
    rust:
      opts:
        crates_skipped: fish

  packages:
    - fish:
        github:
          user: fish-shell
          repo: fish-shell
        extensions:
          - rust
        transform:
          - kind: string
            match: 'fish '
            replace: ''
          - kind: regex
            match: ' \(.*'
            replace: ''
        vars:
          desc: Friendly Interactive SHell
          homepage: http://fishshell.com/
          inherit:
            - cmake
            - cargo
            - readme.gentoo-r1
            - xdg
          license: GPL-2
          iuse: nls
          rdepend: |
            sys-libs/ncurses
          depend: |
            ${RDEPEND}
            nls? ( sys-devel/gettext )
          extra_envs:
            - CMAKE_BUILD_TYPE=RelWithDebInfo
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            post_src_unpack() {
              if [ -e ${S} ] ; then
                rm -rf ${S}
              fi
              mv {{ .Values.github_user }}-{{ .Values.github_repo }}-* ${S}
            }
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              export FISH_BUILD_VERSION="{{ .Values.version }}-{{ substr 0 7 .Values.sha }}"
              local mycmakeargs=(
                -DCMAKE_INSTALL_BINDIR="${EPREFIX}/bin"
                -DCMAKE_INSTALL_SYSCONFDIR="${EPREFIX}/etc"
                -DCMAKE_INSTALL_LIBDIR="${EPREFIX}/lib"
                -DBUILD_SHARED_LIBS=True
                -DINSTALL_DOCS=OFF
                -DWITH_GETTEXT="$(usex nls)"
              )
              cmake_src_configure
            }
            src_compile() {
              local -x PREFIX="${EPREFIX}/usr"
              local -x DOCDIR="${EPREFIX}/usr/share/doc/${PF}"
              local -x CMAKE_WITH_GETTEXT="$(usex nls 1 0)"
              local -x SYSCONFDIR="${EPREFIX}/etc"
              local -x FISH_BUILD_DOCS
              FISH_BUILD_DOCS=0
              cargo_src_compile
            }
            src_install() {
              cmake_src_install
              keepdir /usr/share/fish/vendor_{completions,conf,functions}.d
              insinto /usr/share/doc/fish
              doins "${FILESDIR}"/README.mark
            }
            pkg_postinst() {
              xdg_pkg_postinst
            }


shells_rust_github:
  generator: builtin-github
  defaults:
    category: app-shells
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    extensions:
      - rust
    vars:
      inherit:
        - cargo
      bdepend: virtual/rust
      depend: '${RDEPEND}'

  extensions_defs:
    rust:
      opts:

  packages:
    - mcfly:
        github:
          user: cantino
        vars:
          rdepend: |
            dev-db/sqlite
          extra_envs:
            - 'QA_FLAGS_IGNORED="/usr/bin/mcfly"'
          body: |
            src_unpack() {
              cargo_src_unpack
              rm -rf ${S}
              mv ${WORKDIR}/{{ .Values.github_user }}-{{ .Values.github_repo }}-* ${S} || die
            }
            src_install() {
              cargo_src_install
              insinto "/usr/share/{{ .Values.pn }}"
              doins "{{ .Values.pn }}".{bash,fish,zsh}
              einstalldocs
            }
            pkg_postinst() {
              elog "To start using {{ .Values.pn }}, add the following to your shell:"
              elog
              elog "~/.bashrc"
              local p="${EPREFIX}/usr/share/{{ .Values.pn }}/{{ .Values.pn }}.bash"
              elog "[[ -f ${p} ]] && source ${p}"
              elog
              elog "~/.config/fish/config.fish"
              local p="${EPREFIX}/usr/share/{{ .Values.pn }}/{{ .Values.pn }}.fish"
              elog "if test -r ${p}"
              elog "    source ${p}"
              elog "    mcfly_key_bindings"
              elog
              elog "~/.zsh"
              local p="${EPREFIX}/usr/share/{{ .Values.pn }}/{{ .Values.pn }}.zsh"
              elog "[[ -f ${p} ]] && source ${p}"
            }

    - starship:
        vars:
          rdepend: |
            dev-libs/openssl
            sys-libs/zlib
          docs:
            - docs/README.md
          desc: The minimal, blazing-fast, and infinitely customizable prompt for any shell!
          body: |
            src_unpack() {
              cargo_src_unpack
              rm -rf ${S}
              mv ${WORKDIR}/{{ .Values.github_user }}-{{ .Values.github_repo }}-* ${S} || die
            }
            src_install() {
              dobin target/release/{{ .Values.pn }}
              default
            }
            pkg_postinst() {
              echo
              elog "Thanks for installing starship."
              elog "For better experience, it's suggested to install some Powerline font."
              elog "You can get some from https://github.com/powerline/fonts"
              echo
            }


shells_go_github:
  generator: builtin-github
  defaults:
    category: app-shells
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    extensions:
      - golang
    vars:
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:
    - fzf:
        github:
          user: junegunn
        vars:
          desc: A command-line fuzzy finder
          inherit:
            - bash-completion-r1
            - go-module
          body: |
            src_compile() {
              emake PREFIX=${EPREFIX}/usr FZF_VERSION=${PV} FZF_REVISION=tarball bin/{{ .Values.pn }}
            }
            src_install() {
              dobin bin/{{ .Values.pn }}
              doman man/man1/{{ .Values.pn }}.1
              dobin bin/{{ .Values.pn }}-tmux
              doman man/man1/{{ .Values.pn }}-tmux.1
              insinto /usr/share/vim/vimfiles/plugin
              doins plugin/{{ .Values.pn }}.vim
              insinto /usr/share/nvim/runtime/plugin
              doins plugin/{{ .Values.pn }}.vim
              newbashcomp shell/completion.bash {{ .Values.pn }} || die
              insinto /usr/share/zsh/site-functions
              newins shell/completion.zsh _{{ .Values.pn }}
              insinto /usr/share/fzf
              doins shell/key-bindings.bash
              doins shell/key-bindings.fish
              doins shell/key-bindings.zsh
            }
            pkg_postinst() {
              if [[ -z "${REPLACING_VERSIONS}" ]]; then
                elog "To add fzf support to your shell, make sure to use the right file"
                elog "from /usr/share/fzf."
                elog
                elog "For bash, add the following line to ~/.bashrc:"
                elog
                elog "	# source /usr/share/fzf/key-bindings.bash"
                elog
                elog "Or create a symlink:"
                elog
                elog "	# ln -s /usr/share/fzf/key-bindings.bash /etc/bash/bashrc.d/fzf.bash"
                elog
                elog "Plugins for Vim and Neovim are installed to respective directories"
                elog "and will work out of the box."
                elog
                elog "For fzf support in tmux see fzf-tmux(1)."
              fi
            }

backup_go_github:
  generator: builtin-github
  defaults:
    category: app-backup
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    extensions:
      - golang
    vars:
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:
    - backrest:
        github:
          user: garethgeorge
        vars:
          inherit:
            - go-module
            - systemd
            - user
          extra_envs:
            - 'EGO_SKIP_TIDY=1'
          restrict: 'network-sandbox'
          rdepend: |
            app-backup/restic
          depend: |
            ${RDEPEND}
            net-libs/nodejs
          iuse: systemd
          body: |
            pkg_setup() {
              ebegin "Ensuring backrest group and user exist"
              enewgroup backrest
              enewuser backrest -1 -1 /var/lib/backrest backrest
              eend $?
            }

            src_compile() {
              pushd webui 2>&1 >/dev/null
              npm install . || die
              popd 2>&1 >/dev/null
              GOOS=linux BACKREST_BUILD_VERSION={{ .Values.version }} \
                go generate ./...
              CGO_ENABLED=0 \
                go build \
                -asmflags "-trimpath=${S}" \
                -gcflags "-trimpath=${S}" \
                -o backrest ./cmd/backrest
            }

            src_install() {
              dobin backrest
              diropts -m0750 -o backrest -g backrest
              dodir /var/lib/backrest/
              fowners backrest:backrest /var/lib/backrest
              keepdir /var/lib/backrest
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/backrest.service backrest.service || die
              else
                newinitd "${FILESDIR}"/backrest.initd backrest
              fi
              newconfd "${FILESDIR}"/backrest.confd backrest
            }




    - restic:
        transform:
          - kind: string
            match: 'restic '
            replace: ''
          #- kind: regex
          #  match: ' -.*'
          #  replace: ''
        vars:
          inherit:
            - go-module
            - bash-completion-r1
          cdepend: |
            sys-fs/fuse:0
          rdepend: '${CDEPEND}'
          depend: '${CDEPEND}'
          body: |
            src_compile() {
              go build -ldflags '-X main.version={{ .Values.version }}' \
                -asmflags "-trimpath=${S}" \
                -gcflags "-trimpath=${S}" \
                -o restic ./cmd/restic
            }
            src_install() {
              dobin restic

              newbashcomp doc/bash-completion.sh "{{ .Values.pn }}"

              insinto /usr/share/zsh/site-functions
              newins doc/zsh-completion.zsh _restic

              insinto /usr/share/fish/vendor_completions.d/
              newins doc/fish-completion.fish "{{ .Values.pn }}"

              doman doc/man/*
              dodoc doc/*.rst
            }


tevent:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: sys-libs
    dir:
      url: 'https://download.samba.org/pub/{{ .Values.pkgname | default .Values.pn }}{{ .Values.suffix | default "" }}'
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.tar.gz$"
      exclude: "rc"
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.gz"
        replace: ""
    vars:
      license: GPL-3
      python_compat: python3+
  packages:

    - tdb:
        vars:
          inherit:
            - python-single-r1
            - autotools
          iuse: python
          desc:  LSimple database API
          homepage: https://tdb.samba.org/
          required_use: '${PYTHON_REQUIRED_USE}'
          rdepend: |
            dev-libs/libbsd
            python? ( ${PYTHON_DEPS} )
          depend: '${RDEPEND}'
          bdepend: |
            ${PYTHON_DEPS}
            app-text/docbook-xml-dtd:4.2
          body: |
            src_prepare() {
              default
              python_fix_shebang .
            }
            src_configure() {
              local extra_opts=(
                --libdir="${EPREFIX}/usr/$(get_libdir)"
                --disable-warnings-as-errors
              )
              if ! use python; then
                extra_opts+=( --disable-python )
              fi
              econf "${extra_opts[@]}"
            }
            src_install() {
              emake DESTDIR="${ED}" install
              use python && python_optimize
            }

    - ldb:
        vars:
          desc: LDAP-like embedded database
          homepage: https://ldb.samba.org
          patches:
            - ldb-1.1.31-fix_PKGCONFIGDIR-when-python-disabled.patch
            - ldb-2.9.0-optional_packages.patch
            - ldb-2.5.2-skip-wav-tevent-check.patch
          inherit:
            - python-single-r1
            - autotools
          iuse: +ldap +lmdb python
          rdepend: |
            dev-libs/libbsd
            dev-libs/popt
            dev-util/cmocka
            sys-libs/talloc
            sys-libs/tdb
            sys-libs/tevent
            ldap? ( net-nds/openldap )
            python? (
              ${PYTHON_DEPS}
              sys-libs/talloc[python,${PYTHON_USEDEP}]
              sys-libs/tdb[python,${PYTHON_USEDEP}]
              sys-libs/tevent[python,${PYTHON_USEDEP}]
            )
          depend: |
            ${RDEPEND}
          bdepend: |
            ${PYTHON_DEPS}
            dev-libs/libxslt
            virtual/pkgconfig
          body: |
            pkg_setup() {
              export DISTCC_DISABLE=1
              python-single-r1_pkg_setup
            }
            src_prepare() {
              default
            }
            src_configure() {
              local myconf=(
                $(usex ldap '' --disable-ldap)
                $(usex lmdb '' --without-ldb-lmdb)
                --disable-rpath
                --disable-rpath-install --bundled-libraries=NONE
                --with-modulesdir="${EPREFIX}"/usr/$(get_libdir)/samba
                --builtin-libraries=NONE
              )
              use python || myconf+=( --disable-python )
              econf "${myconf[@]}"
            }
            src_install() {
              emake DESTDIR="${ED}" install
              use python && python_optimize
            }

    - tevent:
        vars:
          inherit:
            - python-single-r1
            - autotools
          desc: Samba tevent library
          homepage: https://tevent.samba.org/
          iuse: python
          required_use: |
            ${PYTHON_REQUIRED_USE}
          rdepend: |
            dev-libs/libbsd
            sys-libs/talloc
            python? (
              ${PYTHON_DEPS}
              sys-libs/talloc[python,${PYTHON_USEDEP}]
            )
          depend: |
            ${RDEPEND}
            net-libs/libtirpc
          bdepend: |
            ${PYTHON_DEPS}
            virtual/pkgconfig
          body: |
            pkg_setup() {
              python-single-r1_pkg_setup
            }
            src_prepare() {
              default
            }
            src_configure() {
              econf \
                --libdir="${EPREFIX}/usr/$(get_libdir)" \
                --disable-dependency-tracking \
                --disable-warnings-as-errors \
                --bundled-libraries=NONE \
                --builtin-libraries=NONE \
                $(usex python '' '--disable-python')
            }
            src_install() {
              emake DESTDIR="${ED}" install
              use python && python_domodule tevent.py
              insinto /usr/include
              doins tevent_internal.h
            }

github_pkgs:
  generator: builtin-github
  defaults:
    category: sys-libs
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl

  packages:

    - libqb:
        github:
          user: ClusterLabs
        category: sys-cluster
        vars:
          inherit:
            - autotools
          iuse: debug doc examples systemd
          rdepend: |
            dev-libs/glib:2
            dev-libs/libxml2:=
          depend: '${RDEPEND}'
          bdepend: |
            app-arch/xz-utils
            doc? (
              app-text/doxygen[dot]
            )
          docs:
            - README.markdown
          body: |
            src_prepare() {
              default
              # Skip installation of text documents without value
              sed -e '/dist_doc_DATA/d' -i Makefile.am || die
              # Do not append version suffix "-yank"
              sed 's|1-yank|1|' -i configure.ac || die
              eautoreconf
            }
            src_configure() {
              econf \
                --disable-static \
                --with-socket-dir=/run \
                $(use_enable systemd systemd-journal) \
                $(use_enable debug)
            }
            src_compile() {
              default
              use doc && emake doxygen
            }
            src_install() {
              emake install DESTDIR="${D}"
              if use examples ; then
                docinto examples
                dodoc examples/*.c
              fi
              use doc && HTML_DOCS=("docs/html/.")
              einstalldocs
              find "${D}" -name '*.la' -delete || die
            }

    - liburing:
        github:
          user: axboe
        transform:
          - kind: string
            match: 'liburing '
            replace: ''
          - kind: string
            match: 'liburing-'
            replace: ''
          - kind: string
            match: 'Liburing '
            replace: ''
        vars:
          inherit:
            - autotools
            - toolchain-funcs
          iuse: examples static-libs
          bdepend: |
            sys-kernel/linux-headers
          body: |
            src_prepare() {
              default
              if ! use examples; then
                sed -e '/examples/d' Makefile -i || die
              fi
              sed -e '/test/d' Makefile -i || die
            }
            src_configure() {
              local myconf=(
                --prefix="${EPREFIX}/usr"
                --libdir="${EPREFIX}/usr/$(get_libdir)"
                --libdevdir="${EPREFIX}/usr/$(get_libdir)"
                --mandir="${EPREFIX}/usr/share/man"
                --cc="$(tc-getCC)"
                --cxx="$(tc-getCXX)"
                --use-libc
              )
              # No autotools configure! "econf" will fail.
              TMPDIR="${T}" ./configure "${myconf[@]}" || die
            }
            src_compile() {
              emake V=1 AR="$(tc-getAR)" RANLIB="$(tc-getRANLIB)"
            }
            src_install() {
              default
              einstalldocs
              if ! use static-libs ; then
                find "${ED}" -type f -name "*.a" -delete || die
              fi
            }


dbus:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: sys-apps
    dir:
      url: 'https://dbus.freedesktop.org/releases/{{ .Values.pkgname | default .Values.pn }}{{ .Values.suffix | default "" }}'
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.tar.xz$"
      exclude: "rc"
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      license: '|| ( AFL-2.1 GPL-2+ ) Apache-2.0 BSD GPL-2+ LGPL-2.1+ MIT tcltk'
      python_compat: python3+
      inherit:
        - meson
        - python-any-r1
        - systemd
        - tmpfiles
      iuse: debug doc elogind static-libs systemd valgrind user-session X
      required_use: '?? ( elogind systemd )'
      cdepend: |
        dev-libs/expat
        elogind? ( sys-auth/elogind:= )
        systemd? ( sys-apps/systemd:= )
        X? (
          x11-libs/libX11
          x11-libs/libXt
        )
      depend: |
        ${CDEPEND}
        valgrind? ( dev-util/valgrind )
        X? ( x11-base/xorg-proto )
      rdepend: |
        ${CDEPEND}
        systemd? ( virtual/tmpfiles )
      bdepend: |
        ${PYTHON_DEPS}
        app-text/xmlto
        app-text/docbook-xml-dtd:4.4
        sys-devel/autoconf-archive
        virtual/pkgconfig
      patches:
        - dbus-1.16.0-enable-elogind.patch
      body: |
        pkg_setup() {
          enewgroup messagebus
          enewuser messagebus -1 -1 -1 messagebus
          python-any-r1_pkg_setup
        }
        src_configure() {
          local rundir=/run
          local emesonargs=(
            --localstatedir="/var"
            -Druntime_dir="${rundir}"
            -Ddefault_library=$(usex static-libs both shared)
            -Dapparmor=disabled
            -Dasserts=false
            -Dchecks=false
            $(meson_use debug stats)
            $(meson_use debug verbose_mode)
            -Ddbus_user=messagebus
            -Dkqueue=disabled
            $(meson_feature kernel_linux inotify)
            $(meson_feature doc doxygen_docs)
            $(meson_feature doc xml_docs) # Controls man pages

            -Dinstalled_tests=false
            -Dmessage_bus=true
            -Dmodular_tests=disabled
            -Dqt_help=disabled
            -Dtools=true
            $(meson_feature elogind)
            $(meson_feature systemd)
            $(meson_use user-session user_session)
            $(meson_feature X x11_autolaunch)
            $(meson_feature valgrind)

            # libaudit is *only* used in DBus wrt SELinux support, so disable it if
            # not on an SELinux profile.
            -Dselinux=disabled
            -Dlibaudit=disabled

            -Dsession_socket_dir=/tmp
            -Dsystem_pid_file="${rundir}"/dbus.pid
            -Dsystem_socket="${rundir}"/dbus/system_bus_socket
            -Dsystemd_system_unitdir="$(systemd_get_systemunitdir)"
            -Dsystemd_user_unitdir="$(systemd_get_userunitdir)"
          )

          meson_src_configure
        }
        src_install() {
          meson_src_install

          newinitd "${FILESDIR}"/dbus.initd dbus
          exeinto /etc/user/init.d
          newexe "${FILESDIR}/dbus.user.initd" dbus

          if use X; then
            # dbus X session script (bug #77504)
            # turns out to only work for GDM (and startx). has been merged into
            # other desktop (kdm and such scripts)
            exeinto /etc/X11/xinit/xinitrc.d
            newexe "${FILESDIR}"/80-dbus 80-dbus
          fi

          find "${ED}" -name '*.la' -delete || die

          # Needs to exist for dbus sessions to launch
          keepdir /usr/share/dbus-1/services
          keepdir /etc/dbus-1/{session,system}.d
          # machine-id symlink from pkg_postinst()
          keepdir /var/lib/dbus
          # Let the init script create the /var/run/dbus directory
          rm -rf "${ED}"/{,var/}run

          # bug #761763
          rm -rf "${ED}"/usr/lib/sysusers.d

          dodoc AUTHORS NEWS README doc/TODO

          mv "${ED}"/usr/share/doc/dbus/* "${ED}"/usr/share/doc/${PF}/ || die
          rm -rf "${ED}"/usr/share/doc/dbus || die
          }
          pkg_postinst() {
            if use systemd; then
              tmpfiles_process dbus.conf
            fi

            dbus-uuidgen --ensure="${EROOT}"/etc/machine-id
            ln -sf "${EPREFIX}"/etc/machine-id "${EROOT}"/var/lib/dbus/machine-id
          }

  packages:

    - dbus:
