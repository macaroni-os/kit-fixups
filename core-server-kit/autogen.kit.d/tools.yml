          diropts -o gitlab-runner -g gitlab -m0750
          insinto /etc/gitlab-runner
          keepdir /etc/gitlab-runner /var/lib/gitlab-runner
        }

        pkg_postinst() {
          if use systemd; then
            tmpfiles_process gitlab-runner.conf
          fi
          readme.gentoo_print_elog
        }

  packages:
    - gitlab-runner-bin:
