            qemu_softmmu_targets_i386? (
              {{- range $p := .Values.x86_firmware_depend }}
                {{- if $p.use | default false }}
              {{ $p.use }}? (
                {{- range $d := $p.dep }}
                {{- if $p.dep_use | default false }}
                  {{- $uses := "" }}
                  {{- range $idx, $u := $p.dep_use }}
                    {{- if ( eq $idx 0 ) }}
                      {{- $uses = $u }}
                    {{- else }}
                      {{- $uses = list $uses $u | join "," }}
                    {{- end }}
                  {{- end }}
                {{ $d }}[{{ $uses }}]
                {{- else }}
                {{ $d }}
                {{- end }}
              {{- end }}
              )
              {{- else }}
                {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- range $idx, $u := $p.dep_use }}
                      {{- if ( eq $idx 0 ) }}
                      {{- $uses = $u }}
                      {{- else }}
                      {{- $uses = list $uses $u | join "," }}
                      {{- end }}
                    {{- end }}
                {{ $d }}[{{ $uses }}]
                  {{- else }}
                {{ $d }}
                  {{- end }}
                {{- end }}
              {{- end }}
              {{- end }}
            )
            qemu_softmmu_targets_x86_64? (
              {{- range $p := .Values.x86_firmware_depend }}
              {{- if $p.use | default false }}
              {{ $p.use }}? (
              {{- range $d := $p.dep }}
