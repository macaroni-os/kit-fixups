              {{ $p.use }}? (
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs(+)" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
                          {{- $uses = $u }}
                        {{- else }}
                          {{- $uses = list $uses $u | join "," }}
                        {{- end }}
                      {{- end }}
                    {{- end }}
                    {{- if eq $uses "" }}
                  {{ $d }}
                    {{- else }}
                  {{ $d }}[{{ $uses }}]
                    {{- end }}
                  {{- else }}
                  {{ $d }}
                  {{- end }}
                  {{- end }}
              )
                {{- else }}
                  {{- range $d := $p.dep }}
                  {{- if $p.dep_use | default false }}
                    {{- $uses := "" }}
                    {{- $i := 0 }}
                    {{- range $u := $p.dep_use }}
                      {{- if ( not ( eq $u "static-libs(+)" ) ) }}
                        {{- $i = add1 $i }}
                        {{- if ( eq $i 1 ) }}
