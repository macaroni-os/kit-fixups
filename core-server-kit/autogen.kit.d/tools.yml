    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}'
        url: 'https://s3.dualstack.us-east-1.amazonaws.com/gitlab-runner-downloads/v{{ .Values.version }}/binaries/gitlab-runner-linux-amd64'
    transform:
      - kind: string
        match: 'v'
        replace: ''
    vars:
      desc: 'GitLab Runner for executing CI jobs locally (pre-compiled)'
      extra_envs:
        - 'DOC_CONTENTS="Register the runner as root using\\n\\t# gitlab-runner register\\nThis will save the config in /etc/gitlab-runner/config.toml"'
