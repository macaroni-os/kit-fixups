shells_go_github:
  generator: builtin-github
  defaults:
    category: app-shells
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    extensions:
      - golang
    vars:
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:
    - fzf:
        github:
          user: junegunn
        vars:
          desc: A command-line fuzzy finder
          inherit:
            - bash-completion-r1
            - go-module
          body: |
            src_compile() {
              emake PREFIX=${EPREFIX}/usr FZF_VERSION=${PV} FZF_REVISION=tarball bin/{{ .Values.pn }}
            }
            src_install() {
              dobin bin/{{ .Values.pn }}
              doman man/man1/{{ .Values.pn }}.1
              dobin bin/{{ .Values.pn }}-tmux
              doman man/man1/{{ .Values.pn }}-tmux.1
              insinto /usr/share/vim/vimfiles/plugin
              doins plugin/{{ .Values.pn }}.vim
              insinto /usr/share/nvim/runtime/plugin
              doins plugin/{{ .Values.pn }}.vim
              newbashcomp shell/completion.bash {{ .Values.pn }} || die
              insinto /usr/share/zsh/site-functions
              newins shell/completion.zsh _{{ .Values.pn }}
              insinto /usr/share/fzf
              doins shell/key-bindings.bash
              doins shell/key-bindings.fish
              doins shell/key-bindings.zsh
            }
            pkg_postinst() {
              if [[ -z "${REPLACING_VERSIONS}" ]]; then
                elog "To add fzf support to your shell, make sure to use the right file"
                elog "from /usr/share/fzf."
                elog
                elog "For bash, add the following line to ~/.bashrc:"
                elog
                elog "	# source /usr/share/fzf/key-bindings.bash"
                elog
                elog "Or create a symlink:"
                elog
                elog "	# ln -s /usr/share/fzf/key-bindings.bash /etc/bash/bashrc.d/fzf.bash"
                elog
                elog "Plugins for Vim and Neovim are installed to respective directories"
                elog "and will work out of the box."
                elog
                elog "For fzf support in tmux see fzf-tmux(1)."
              fi
            }

backup_go_github:
  generator: builtin-github
  defaults:
    category: app-backup
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    extensions:
      - golang
    vars:
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:
    - backrest:
        github:
          user: garethgeorge
        vars:
          inherit:
            - go-module
            - systemd
            - user
          extra_envs:
            - 'EGO_SKIP_TIDY=1'
          restrict: 'network-sandbox'
          rdepend: |
            app-backup/restic
          depend: |
            ${RDEPEND}
            net-libs/nodejs
          iuse: systemd
          body: |
            pkg_setup() {
              ebegin "Ensuring backrest group and user exist"
              enewgroup backrest
              enewuser backrest -1 -1 /var/lib/backrest backrest
              eend $?
            }

            src_compile() {
              pushd webui 2>&1 >/dev/null
              npm install . || die
              popd 2>&1 >/dev/null
              GOOS=linux BACKREST_BUILD_VERSION={{ .Values.version }} \
                go generate ./...
              CGO_ENABLED=0 \
                go build \
                -asmflags "-trimpath=${S}" \
                -gcflags "-trimpath=${S}" \
                -o backrest ./cmd/backrest
            }

            src_install() {
              dobin backrest
              diropts -m0750 -o backrest -g backrest
              dodir /var/lib/backrest/
              fowners backrest:backrest /var/lib/backrest
              keepdir /var/lib/backrest
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/backrest.service backrest.service || die
              else
                newinitd "${FILESDIR}"/backrest.initd backrest
              fi
              newconfd "${FILESDIR}"/backrest.confd backrest
            }




    - restic:
        transform:
          - kind: string
            match: 'restic '
            replace: ''
          #- kind: regex
          #  match: ' -.*'
          #  replace: ''
        vars:
          inherit:
            - go-module
            - bash-completion-r1
          cdepend: |
            sys-fs/fuse:0
          rdepend: '${CDEPEND}'
          depend: '${CDEPEND}'
          body: |
            src_compile() {
              go build -ldflags '-X main.version={{ .Values.version }}' \
                -asmflags "-trimpath=${S}" \
                -gcflags "-trimpath=${S}" \
                -o restic ./cmd/restic
            }
            src_install() {
              dobin restic

              newbashcomp doc/bash-completion.sh "{{ .Values.pn }}"

              insinto /usr/share/zsh/site-functions
              newins doc/zsh-completion.zsh _restic

              insinto /usr/share/fish/vendor_completions.d/
              newins doc/fish-completion.fish "{{ .Values.pn }}"

              doman doc/man/*
              dodoc doc/*.rst
            }


tevent:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: sys-libs
    dir:
      url: 'https://download.samba.org/pub/{{ .Values.pkgname | default .Values.pn }}{{ .Values.suffix | default "" }}'
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.tar.gz$"
      exclude: "rc"
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.gz"
        replace: ""
    vars:
      license: GPL-3
      python_compat: python3+
  packages:

    - tdb:
        vars:
          inherit:
            - python-single-r1
            - autotools
          iuse: python
          desc:  LSimple database API
          homepage: https://tdb.samba.org/
          required_use: '${PYTHON_REQUIRED_USE}'
          rdepend: |
            dev-libs/libbsd
            python? ( ${PYTHON_DEPS} )
          depend: '${RDEPEND}'
          bdepend: |
            ${PYTHON_DEPS}
            app-text/docbook-xml-dtd:4.2
          body: |
            src_prepare() {
              default
              python_fix_shebang .
            }
            src_configure() {
              local extra_opts=(
                --libdir="${EPREFIX}/usr/$(get_libdir)"
                --disable-warnings-as-errors
              )
              if ! use python; then
                extra_opts+=( --disable-python )
              fi
              econf "${extra_opts[@]}"
            }
            src_install() {
              emake DESTDIR="${ED}" install
              use python && python_optimize
            }

    - ldb:
        revision: 1
        vars:
          desc: LDAP-like embedded database
          homepage: https://ldb.samba.org
          patches:
            - ldb-1.1.31-fix_PKGCONFIGDIR-when-python-disabled.patch
            - ldb-2.9.0-optional_packages.patch
            - ldb-2.5.2-skip-wav-tevent-check.patch
          inherit:
            - python-single-r1
            - autotools
          iuse: +ldap +lmdb python
          rdepend: |
            dev-libs/libbsd
            dev-libs/popt
            dev-util/cmocka
            sys-libs/talloc
            sys-libs/tdb
            sys-libs/tevent
            ldap? ( net-nds/openldap )
            python? (
              ${PYTHON_DEPS}
              sys-libs/talloc[python,${PYTHON_USEDEP}]
              sys-libs/tdb[python,${PYTHON_USEDEP}]
              sys-libs/tevent[python,${PYTHON_USEDEP}]
            )
          depend: |
            ${RDEPEND}
          bdepend: |
            ${PYTHON_DEPS}
            dev-libs/libxslt
            virtual/pkgconfig
          body: |
            pkg_setup() {
              export DISTCC_DISABLE=1
              python-single-r1_pkg_setup
            }
            src_prepare() {
              default
            }
            src_configure() {
              local myconf=(
                $(usex ldap '' --disable-ldap)
                $(usex lmdb '' --without-ldb-lmdb)
                --disable-rpath
                --disable-rpath-install --bundled-libraries=NONE
                --with-modulesdir="${EPREFIX}"/usr/$(get_libdir)/samba
                --builtin-libraries=NONE
              )
              use python || myconf+=( --disable-python )
              econf "${myconf[@]}"
            }
            src_install() {
              emake DESTDIR="${ED}" install
              use python && python_optimize
            }

    - tevent:
        vars:
          inherit:
            - python-single-r1
            - autotools
          desc: Samba tevent library
          homepage: https://tevent.samba.org/
          iuse: python
          required_use: |
            ${PYTHON_REQUIRED_USE}
          rdepend: |
            dev-libs/libbsd
            sys-libs/talloc
            python? (
              ${PYTHON_DEPS}
              sys-libs/talloc[python,${PYTHON_USEDEP}]
            )
          depend: |
            ${RDEPEND}
            net-libs/libtirpc
          bdepend: |
            ${PYTHON_DEPS}
            dev-util/cmocka
            virtual/pkgconfig
          body: |
            pkg_setup() {
              python-single-r1_pkg_setup
            }
            src_prepare() {
              default
            }
            src_configure() {
              econf \
                --libdir="${EPREFIX}/usr/$(get_libdir)" \
                --disable-dependency-tracking \
                --disable-warnings-as-errors \
                --bundled-libraries=NONE \
                --builtin-libraries=NONE \
                $(usex python '' '--disable-python')
            }
            src_install() {
              emake DESTDIR="${ED}" install
              use python && python_domodule tevent.py
              insinto /usr/include
              doins tevent_internal.h
            }

github_pkgs:
  generator: builtin-github
  defaults:
    category: sys-libs
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl

  extensions_defs:
    golang:
      opts:

  packages:

    - incus-ui:
        category: www-apps
        github:
          user: zabbly
          repo: incus-ui-canonical
          query: tags
        transform:
          - kind: string
            match: 'incus-'
            replace: ''
        vars:
          desc: Incus UI web application
          inherit:
            - npmv1
          extra_envs:
            # This package is with a broken package.json
            # It requires dependencies marked as devs for generate
            # the production application. We avoid to set --omit=optional flag.
            - 'NPM_DEFAULT_OPTS="-E --force"'
          # This is needed until mark-devkit will integrate
          # the nodejs bundle extensions.
          restrict: network-sandbox
          body: |
            src_compile() {
              npmv1_src_compile
              npm run build
            }
            src_install() {
              dodir /usr/share/incus-ui
              insinto /usr/share/incus-ui
              doins -r build/ui/*
            }

    - lxcfs:
        category: sys-fs
        github:
          user: lxc
        transform:
          - kind: string
            match: 'LXCFS '
            replace: ''
          - kind: string
            match: ' LTS'
            replace: ''
        vars:
          license: AGPL-3 Apache-2.0 BSD BSD-2 LGPL-3 MIT MPL-2.0
          rdepend: |
            sys-fs/fuse:3=
          depend: '${RDEPEND}'
          iuse: systemd
          bdepend: |
            sys-apps/help2man
            dev-python/jinja
          inherit:
            - meson
            - systemd
          body: |
            pkg_setup() {
              export BUILD_DIR=${WORKDIR}/build
            }
            src_configure() {
              local emesonargs=(
                --localstatedir "${EPREFIX}/var"
                -Dfuse-version=3
                -Dmocks=false
                -Dtests=false
                -Dinit-script=
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/lxcfs.service
              else
                newinitd "${FILESDIR}"/lxcfs.initd lxcfs
              fi
              newconfd "${FILESDIR}"/lxcfs.confd lxcfs
              find "${ED}" -name '*.la' -delete || die
              # we are using own init scripts, so do not need included
              rm -rf "${ED}"/etc/rc.d
            }

    - lxc:
        category: app-emulation
        transform:
          - kind: string
            match: 'LXC '
            replace: ''
          - kind: string
            match: ' LTS'
            replace: ''
        vars:
          license: 'GPL-2 LGPL-2.1 LGPL-3'
          iuse: |
            apparmor +caps examples io-uring man pam seccomp +ssl
            systemd +tools +static tools-multicall lto
          inherit:
            - bash-completion-r1
            - meson
            - systemd
          desc: A userspace interface for the Linux kernel containment features
          rdepend: |
            sys-libs/libcap
            apparmor? ( sys-libs/libapparmor )
            caps? (
              static? (
                sys-libs/libcap[static-libs]
              )
              !static? (
                sys-libs/libcap
              )
            )
            io-uring? ( sys-libs/liburing:= )
            pam? ( sys-libs/pam )
            seccomp? ( sys-libs/libseccomp )
            ssl? ( dev-libs/openssl:= )
            systemd? ( sys-apps/systemd:= )
            sys-apps/dbus
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
            apparmor? ( sys-apps/apparmor )
          bdepend: |
            virtual/pkgconfig
            dev-lang/python
            man? ( app-text/docbook2K )
          docs:
            - AUTHORS
            - CONTRIBUTING.md
            - MAINTAINERS
            - README.md
            - doc/FAQ.txt
          body: |
            src_configure() {
              local emesonargs=(
                --localstatedir "${EPREFIX}/var"
                -Dcoverity-build=false
                -Doss-fuzz=false
                -Dcommands=true
                -Dmemfd-rexec=true
                -Dthread-safety=true
                -Dselinux=false
                $(meson_use apparmor)
                $(meson_use caps capabilities)
                $(meson_use examples)
                $(meson_use io-uring io-uring-event-loop)
                $(meson_use man)
                $(meson_use pam pam-cgroup)
                $(meson_use seccomp)
                $(meson_use ssl openssl)
                # NOTE: At the moment when b_lto is true
                #       the linking phase of lxc-monitor fails
                #       because the __hidden functions are not visible.
                #       See https://github.com/lxc/lxc/issues/4427
                $(meson_use lto b_lto)
                $(meson_use tools)
                $(meson_use tools-multicall)
                -Ddata-path=/var/lib/lxc
                -Ddoc-path=/usr/share/doc/${PF}
                -Dlog-path=/var/log/lxc
                -Drootfs-mount-path=/var/lib/lxc/rootfs
                -Druntime-path=/run
              )
              if use systemd; then
                emesonargs+=( -Dinit-script="systemd" )
              else
                emesonargs+=( -Dinit-script="sysvinit" )
              fi
              if ! use static ; then
                # b_sanitize option is a specific meson
                # option to select the Code sanitizer to use.
                # Change this option seems break linking of a lot of
                # binaries.
                # I avoid to change the value and just replace the
                # check under meson.build file about lxc-init.static
                # binary.
                sed -e "s|'none'|'false'|g" src/lxc/cmd/meson.build -i
              fi
              use tools && emesonargs+=( -Dcapabilities=true )
              if use tools-multicall ; then
                # Rename main binary to avoid conflicts with lxd
                sed -i -e "s|'lxc'|'lxcmulti'|g" src/lxc/tools/meson.build
              fi
              meson_src_configure
            }
            src_install() {
              meson_src_install
              # The main bash-completion file will collide with lxd, need to relocate and update symlinks.
              mkdir -p "${ED}"/$(get_bashcompdir) || die "Failed to create bashcompdir."
              # Quiet portage issue
              mv "${ED}"/$(get_bashcompdir)/_lxc "${ED}"/$(get_bashcompdir)/lxc-start
              if use tools; then
                bashcomp_alias lxc-start lxc-{attach,autostart,cgroup,checkpoint,config,console,copy,create,destroy,device,execute,freeze,info,ls,monitor,snapshot,stop,top,unfreeze,unshare,usernsexec,wait}
              else
                if use tools-multicall ; then
                  bashcomp_alias lxc-start lxc-{attach,autostart,cgroup,checkpoint,config,console,copy,create,destroy,device,execute,freeze,info,ls,monitor,snapshot,stop,top,unfreeze,unshare,usernsexec,wait}
                else
                  bashcomp_alias lxc-start lxc-usernsexec
                fi
              fi
              keepdir /var/lib/cache/lxc /var/lib/lib/lxc
              find "${ED}" -name '*.la' -delete -o -name '*.a' -delete || die
              # Replace upstream sysvinit/systemd files.
              if use systemd; then
                rm -r "${D}$(systemd_get_systemunitdir)" || die "Failed to remove systemd lib dir"
              else
                rm "${ED}"/etc/init.d/lxc-{containers,net} || die "Failed to remove sysvinit scripts"
              fi
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/lxc-monitord.service lxc-monitord.service
                systemd_newunit "${FILESDIR}"/lxc-net.service lxc-net.service
                systemd_newunit "${FILESDIR}"/lxc.service lxc.service
                systemd_newunit "${FILESDIR}"/lxc_at.service "lxc@.service"

                if ! use apparmor ; then
                  sed -i '/lxc-apparmor-load/d' "${D}$(systemd_get_systemunitdir)/lxc.service" || die "Failed to remove apparmor references from lxc.service systemd unit."
                fi
              else
                newinitd "${FILESDIR}/${PN}.initd" ${PN}
              fi
            }
            pkg_postinst() {
              elog
              elog "Run 'lxc-checkconfig' to see optional kernel features."
              elog
            }

    - docker-registry:
        category: app-emulation
        github:
          user: distribution
          repo: distribution
        vars:
          extra_envs:
            - SVCNAME=registry
          inherit:
            - systemd
            - user
          iuse: systemd
          desc: Docker Registry
          body: |
            pkg_setup() {
              enewgroup ${SVCNAME}
              enewuser ${SVCNAME} -1 -1 /dev/null ${SVCNAME}
            }
            src_prepare() {
              default
              sed -i -e "s/git describe.*/echo ${PV})/"\
                -e "s/git rev-parse.*/echo {{ .Values.sha }})/"\
                -e "s/-s -w/-w/" Makefile || die
            }
            src_compile() {
              export -n GOCACHE XDG_CACHE_HOME #681072
              GOPATH="${S}" GO_BUILD_FLAGS="-v" emake binaries
            }
            src_install() {
              exeinto /usr/libexec/{{ .Values.pn }}
              doexe bin/*
              insinto /etc/docker/registry
              newins cmd/registry/config-example.yml config.yml.example
              newconfd "${FILESDIR}/${SVCNAME}.confd" "${SVCNAME}"
              if use systemd ; then
                systemd_dounit "${FILESDIR}/${SVCNAME}.service"
              else
                newinitd "${FILESDIR}/${SVCNAME}.initd" "${SVCNAME}"
              fi
              keepdir /var/{lib,log}/${SVCNAME}
              fowners ${SVCNAME}:${SVCNAME} /var/{lib,log}/${SVCNAME}
              insinto /etc/logrotate.d
              newins "${FILESDIR}/${SVCNAME}.logrotated" "${SVCNAME}"
            }

    - firecracker-bin:
        template: ../../templates/simple.tmpl
        category: app-emulation
        github:
          user: firecracker-microvm
          repo: firecracker
        transform:
          - kind: string
            match: 'Firecracker '
            replace: ''
          - kind: string
            match: 'v'
            replace: ''
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}-x86_64.tgz'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-.*-x86_64.tgz$'
            use: amd64
          - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}-aarch64.tgz'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-.*-aarch64.tgz$'
            use: arm64
        vars:
          iuse: amd64 arm64
          restrict: strip
          s: '${WORKDIR}'
          inherit:
            - user
          extra_envs:
            - |
              QA_PREBUILT="/usr/bin/firecracker
              /usr/bin/jailer"
          body: |
            pkg_setup() {
              enewgroup kvm
            }
            src_compile() { :; }
            src_install() {
              if use amd64; then
                my_arch=x86_64
              elif use arm64; then
                my_arch=aarch64
              fi
              newbin "${WORKDIR}/release-v{{ .Values.version }}-${my_arch}/firecracker-v${PV}-${my_arch}" firecracker
              newbin "${WORKDIR}/release-v{{ .Values.version }}-${my_arch}/jailer-v${PV}-${my_arch}" jailer
            }
            pkg_postinst() {
              elog
              elog "In production, Firecracker is designed to be run securely,"
              elog "inside an execution jail, carefully set up by the jailer binary."
              elog "Jailer is already included in this package."
              elog
              elog "It is recommended to use Firecracker as a non-root user."
              elog "You will need to add yourself to the 'kvm' group:"
              elog "  usermod -aG kvm youruser"
              elog
              elog "Getting Started with Firecracker: https://github.com/firecracker-microvm/firecracker/blob/master/docs/getting-started.md"
              elog "Production Host Setup Recommendations: https://github.com/firecracker-microvm/firecracker/blob/master/docs/prod-host-setup.md"
              elog "README: https://github.com/firecracker-microvm/firecracker/blob/master/README.md"
              elog "The Firecracker Jailer: https://github.com/firecracker-microvm/firecracker/blob/master/docs/jailer.md"
            }

    - docker-compose:
        category: app-emulation
        github:
          user: docker
          repo: compose
        extensions:
          - golang
        vars:
          inherit:
            - bash-completion-r1
            - go-module
          rdepend: |
            app-emulation/docker-cli
          body: |
            src_prepare() {
              default
              # do not strip
              sed -i -e 's/-s -w//' Makefile || die
            }
            src_compile() {
              emake VERSION=v${PV}
            }
            src_install() {
              exeinto /usr/libexec/docker/cli-plugins
              doexe bin/build/docker-compose
              dodoc README.md
            }

    - docker-buildx:
        category: app-emulation
        github:
          user: docker
          repo: buildx
        vars:
          inherit:
            - bash-completion-r1
            - go-module
          slot: 2
          body: |
            src_prepare() {
              default
              # do not strip
              sed -i -e 's/-s -w//' Makefile || die
            }
            src_compile() {
              local _buildx_r='github.com/{{ .Values.github_user }}/{{ .Values.github_repo }}'
              go build -o docker-buildx \
                -v -x -mod=vendor \
                -ldflags "-linkmode=external \
                -X $_buildx_r/version.Version={{ .Values.version }} \
                -X $_buildx_r/version.Revision={{ .Values.sha }} \
                -X $_buildx_r/version.Package=$_buildx_r" \
                ./cmd/buildx
            }
            src_install() {
              exeinto /usr/libexec/docker/cli-plugins
              doexe docker-buildx
              dodoc README.md
            }


    - docker-cli:
        category: app-emulation
        github:
          user: docker
          repo: cli
          query: tags
        exclude:
          - rc
        vars:
          desc: The command-line interface for Docker
          iuse: hardened
          inherit:
            - bash-completion-r1
          bdepend: |
            dev-go/go-md2man
          pdepend: |
            app-emulation/docker-buildx
          restrict: strip
          body: |
            src_prepare() {
              default
              sed -i 's@dockerd\?\.exe@@g' contrib/completion/bash/docker || die
              ln -s vendor.mod go.mod
              ln -s vendor.sum go.sum
            }
            src_compile() {
              export DISABLE_WARN_OUTSIDE_CONTAINER=1
              export GOPATH="${WORKDIR}/${P}"
              export CGO_CFLAGS="-I${ESYSROOT}/usr/include"
              export CGO_LDFLAGS="-L${ESYSROOT}/usr/$(get_libdir)"
              export GOFLAGS="-v -x -mod=vendor"
              emake \
              LDFLAGS="$(usex hardened '-extldflags -fno-PIC' '')" \
              VERSION="{{ .Values.version }}-macaroni" \
              GITCOMMIT="{{ substr 0 7 .Values.sha }}" \
              dynbinary manpages
            }
            src_install() {
              dobin build/docker
              doman man/man*/*
              dobashcomp contrib/completion/bash/*
              bashcomp_alias docker dockerd
              insinto /usr/share/fish/vendor_completions.d/
              doins contrib/completion/fish/docker.fish
              insinto /usr/share/zsh/site-functions
              doins contrib/completion/zsh/_*
            }

    - docker:
        category: app-emulation
        github:
          user: moby
          repo: moby
          query: releases
          #ignore_tags: true
          match: '^29.*'

          num_pages: 10
          per_page: 100
        exclude:
          - rc
        vars:
          inherit:
            - go-module
            - systemd
            - udev
            - user
          iuse: |
            apparmor btrfs +container-init
            +overlay2 seccomp systemd
          cdepend: |
            dev-db/sqlite:3
            apparmor? ( sys-libs/libapparmor )
            btrfs? ( sys-fs/btrfs-progs )
            seccomp? ( sys-libs/libseccomp )
            net-firewall/nftables:=
          depend: '${CDEPEND}'
          rdepend: |
            ${CDEPEND}
            sys-process/procps
            dev-vcs/git
            app-arch/xz-utils
            app-emulation/containerd[apparmor?,btrfs?,seccomp?]
            app-emulation/runc[apparmor?,seccomp?]
            container-init? ( sys-process/tini[static] )
          bdepend: |
            dev-go/go-md2man
            virtual/pkgconfig
          body: |
            pkg_setup() {
              enewgroup docker 48
            }
            src_compile() {
              export DOCKER_GITCOMMIT="{{ substr 0 7 .Values.sha }}"
              export GOPATH="${WORKDIR}/${P}"
              export VERSION="{{ .Values.version }}-macaroni"
              export EXCLUDE_AUTO_BUILDTAG_JOURNALD=$(usex systemd '' 'y')

              # setup CFLAGS and LDFLAGS for separate build target
              # see https://github.com/tianon/docker-overlay/pull/10
              export CGO_CFLAGS="-I${ESYSROOT}/usr/include"
              export CGO_LDFLAGS="-L${ESYSROOT}/usr/$(get_libdir)"

              # let's set up some optional features :)
              export DOCKER_BUILDTAGS=''
              for gd in btrfs overlay2; do
                if ! use $gd; then
                  DOCKER_BUILDTAGS+=" exclude_graphdriver_${gd//-/}"
                fi
              done

              for tag in apparmor seccomp; do
                if use $tag; then
                  DOCKER_BUILDTAGS+=" $tag"
                fi
              done

              export GOFLAGS="-v -x -mod=vendor"
              # build binaries
              ./hack/make.sh dynbinary || die 'dynbinary failed'
              # build man page
              cd man || die
              emake || die
            }
            src_install() {
              dosym containerd /usr/bin/docker-containerd
              dosym containerd-shim-runc-v2 /usr/bin/docker-containerd-shim
              dosym runc /usr/bin/docker-runc
              use container-init && dosym tini /usr/bin/docker-init
              dobin bundles/dynbinary-daemon/dockerd
              dobin bundles/dynbinary-daemon/docker-proxy
              for f in dockerd-rootless-setuptool.sh dockerd-rootless.sh; do
                dosym ../share/docker/contrib/${f} /usr/bin/${f}
              done
              newconfd "${FILESDIR}"/docker.confd docker
              if use systemd ; then
                systemd_dounit contrib/init/systemd/docker.{service,socket}
              else
                newinitd "${FILESDIR}"/docker.initd docker
              fi

              dodoc AUTHORS CONTRIBUTING.md NOTICE README.md
              dodoc -r docs/*
              doman man/man8/dockerd.8

              # note: intentionally not using "doins" so that we preserve +x bits
              dodir /usr/share/${PN}/contrib
              cp -R contrib/* "${ED}/usr/share/${PN}/contrib"
            }
            pkg_postinst() {
              udev_reload
              elog
              elog "To use Docker, the Docker daemon must be running as root. To automatically"
              elog "start the Docker daemon at boot:"
              if systemd_is_booted || has_version sys-apps/systemd; then
                elog "  systemctl enable docker.service"
              else
                elog "  rc-update add docker default"
              fi
              elog
              elog "To use Docker as a non-root user, add yourself to the 'docker' group:"
              elog '  usermod -aG docker <youruser>'
              elog
              if has_version sys-fs/zfs; then
                elog " ZFS storage driver is available"
                elog " Check https://docs.docker.com/storage/storagedriver/zfs-driver for more info"
                elog
              fi
              elog
              elog "For rootless mode support you need sys-apps/shadow, sys-apps/rootlesskit"
              elog "and a network stack for like app-emulation/slirp4netns"
            }
            pkg_postrm() {
              udev_reload
            }


    - runc:
        category: app-emulation
        github:
          user: opencontainers
        exclude:
          - 'rc'
        transform:
          - kind: string
            match: '{{ .Values.pn }} '
            replace: ''
          - kind: regex
            match: ' --.*'
            replace: ''
          - kind: regex
            match: 'v'
            replace: ''
        vars:
          inherit:
            - go-module
          iuse: apparmor hardened +kmem +seccomp
          rdepend: |
            seccomp? ( sys-libs/libseccomp )
            apparmor? ( sys-libs/libapparmor )
          depend: '${RDEPEND}'
          bdepend: |
            dev-go/go-md2man
            virtual/pkgconfig
          body: |
            src_compile() {
              local options=(
                $(usev apparmor)
                $(usev seccomp)
                $(usex kmem '' 'nokmem')
              )
              myemakeargs=(
                BUILDTAGS="${options[*]}"
                COMMIT="{{ .Values.sha }}"
              )
              export GOFLAGS="-v -x -mod=vendor"
              emake "${myemakeargs[@]}" runc man
            }
            src_install() {
              myemakeargs+=(
                PREFIX="${ED}/usr"
                BINDIR="${ED}/usr/bin"
                MANDIR="${ED}/usr/share/man"
              )
              export GOFLAGS="-v -x -mod=vendor"
              emake "${myemakeargs[@]}" install install-man install-bash
              local DOCS=( README.md PRINCIPLES.md docs/. )
              einstalldocs
            }

    - containerd:
        category: app-emulation
        github:
          match: 'containerd [0-9]+.*'
        transform:
          - kind: string
            match: '{{ .Values.pn }} '
            replace: ''
        vars:
          inherit:
            - go-module
            - systemd
          iuse: apparmor btrfs device-mapper +cri hardened +seccomp systemd
          cdepend: |
            btrfs? ( sys-fs/btrfs-progs )
            seccomp? ( sys-libs/libseccomp )
          depend: '${CDEPEND}'
          rdepend: |
            ${CDEPEND}
            app-emulation/runc
          bdepend: |
            virtual/pkgconfig
            dev-go/go-md2man
          restrict: strip
          body: |
            src_prepare() {
              default
              sed -i \
                -e "s/-s -w//" \
                Makefile || die
              sed -i \
                -e "s:/usr/local:/usr:" \
                containerd.service || die
            }
            src_compile() {
              local options=(
                $(usev apparmor)
                $(usex btrfs "" "no_btrfs")
                $(usex cri "" "no_cri")
                $(usex device-mapper "" "no_devmapper")
                $(usev seccomp)
              )
              myemakeargs=(
                BUILDTAGS="${options[*]}"
                LDFLAGS="$(usex hardened '-extldflags -fno-PIC' '')"
                REVISION="{{ .Values.sha }}"
                VERSION="v{{ .Values.version }}"
              )
              export GOFLAGS="-v -x -mod=vendor"
              emake "${myemakeargs[@]}" man -j1 #nowarn
              emake "${myemakeargs[@]}" all
            }
            src_install() {
              dobin bin/*
              doman man/*
              if use systemd ; then
                systemd_dounit containerd.service
              else
                newinitd "${FILESDIR}"/${PN}.initd "${PN}"
              fi
              keepdir /var/lib/containerd
              # we already installed manpages, remove markdown source
              # before installing docs directory
              rm -r docs/man || die
              local DOCS=( ADOPTERS.md README.md RELEASES.md ROADMAP.md SCOPE.md docs/. )
              einstalldocs
            }

    - libqb:
        github:
          user: ClusterLabs
        category: sys-cluster
        vars:
          inherit:
            - autotools
          iuse: debug doc examples systemd
          rdepend: |
            dev-libs/glib:2
            dev-libs/libxml2:=
          depend: '${RDEPEND}'
          bdepend: |
            app-arch/xz-utils
            doc? (
              app-doc/doxygen[dot]
            )
          docs:
            - README.markdown
          body: |
            src_prepare() {
              default
              # Skip installation of text documents without value
              sed -e '/dist_doc_DATA/d' -i Makefile.am || die
              # Do not append version suffix "-yank"
              sed 's|1-yank|1|' -i configure.ac || die
              eautoreconf
            }
            src_configure() {
              econf \
                --disable-static \
                --with-socket-dir=/run \
                $(use_enable systemd systemd-journal) \
                $(use_enable debug)
            }
            src_compile() {
              default
              use doc && emake doxygen
            }
            src_install() {
              emake install DESTDIR="${D}"
              if use examples ; then
                docinto examples
                dodoc examples/*.c
              fi
              use doc && HTML_DOCS=("docs/html/.")
              einstalldocs
              find "${D}" -name '*.la' -delete || die
            }

    - liburing:
        github:
          user: axboe
        transform:
          - kind: string
            match: 'liburing '
            replace: ''
          - kind: string
            match: 'liburing-'
            replace: ''
          - kind: string
            match: 'Liburing '
            replace: ''
        vars:
          inherit:
            - autotools
            - toolchain-funcs
          iuse: examples static-libs
          bdepend: |
            sys-kernel/linux-headers
          body: |
            src_prepare() {
              default
              if ! use examples; then
                sed -e '/examples/d' Makefile -i || die
              fi
              sed -e '/test/d' Makefile -i || die
            }
            src_configure() {
              local myconf=(
                --prefix="${EPREFIX}/usr"
                --libdir="${EPREFIX}/usr/$(get_libdir)"
                --libdevdir="${EPREFIX}/usr/$(get_libdir)"
                --mandir="${EPREFIX}/usr/share/man"
                --cc="$(tc-getCC)"
                --cxx="$(tc-getCXX)"
                --use-libc
              )
              # No autotools configure! "econf" will fail.
              TMPDIR="${T}" ./configure "${myconf[@]}" || die
            }
            src_compile() {
              emake V=1 AR="$(tc-getAR)" RANLIB="$(tc-getRANLIB)"
            }
            src_install() {
              default
              einstalldocs
              if ! use static-libs ; then
                find "${ED}" -type f -name "*.a" -delete || die
              fi
            }


dbus:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: sys-apps
    dir:
      url: 'https://dbus.freedesktop.org/releases/{{ .Values.pkgname | default .Values.pn }}{{ .Values.suffix | default "" }}'
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.tar.xz$"
      exclude: "rc"
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      license: '|| ( AFL-2.1 GPL-2+ ) Apache-2.0 BSD GPL-2+ LGPL-2.1+ MIT tcltk'
      python_compat: python3+
      inherit:
        - meson
        - python-any-r1
        - systemd
        - tmpfiles
        - user
      iuse: debug doc elogind static-libs systemd valgrind user-session X
      required_use: '?? ( elogind systemd )'
      cdepend: |
        dev-libs/expat
        elogind? ( sys-auth/elogind:= )
        systemd? ( sys-apps/systemd:= )
        X? (
          x11-libs/libX11
          x11-libs/libXt
        )
      depend: |
        ${CDEPEND}
        valgrind? ( dev-util/valgrind )
        X? ( x11-base/xorg-proto )
      rdepend: |
        ${CDEPEND}
        systemd? ( virtual/tmpfiles )
      bdepend: |
        ${PYTHON_DEPS}
        app-text/xmlto
        app-text/docbook-xml-dtd:4.4
        sys-devel/autoconf-archive
        virtual/pkgconfig
      patches:
        - dbus-1.16.0-enable-elogind.patch
      body: |
        pkg_setup() {
          enewgroup messagebus
          enewuser messagebus -1 -1 -1 messagebus
          python-any-r1_pkg_setup
        }
        src_configure() {
          local rundir=/run
          local emesonargs=(
            --localstatedir="/var"
            -Druntime_dir="${rundir}"
            -Ddefault_library=$(usex static-libs both shared)
            -Dapparmor=disabled
            -Dasserts=false
            -Dchecks=false
            $(meson_use debug stats)
            $(meson_use debug verbose_mode)
            -Ddbus_user=messagebus
            -Dkqueue=disabled
            $(meson_feature kernel_linux inotify)
            $(meson_feature doc doxygen_docs)
            $(meson_feature doc xml_docs) # Controls man pages

            -Dinstalled_tests=false
            -Dmessage_bus=true
            -Dmodular_tests=disabled
            -Dqt_help=disabled
            -Dtools=true
            $(meson_feature elogind)
            $(meson_feature systemd)
            $(meson_use user-session user_session)
            $(meson_feature X x11_autolaunch)
            $(meson_feature valgrind)

            # libaudit is *only* used in DBus wrt SELinux support, so disable it if
            # not on an SELinux profile.
            -Dselinux=disabled
            -Dlibaudit=disabled

            -Dsession_socket_dir=/tmp
            -Dsystem_pid_file="${rundir}"/dbus.pid
            -Dsystem_socket="${rundir}"/dbus/system_bus_socket
            -Dsystemd_system_unitdir="$(systemd_get_systemunitdir)"
            -Dsystemd_user_unitdir="$(systemd_get_userunitdir)"
          )

          meson_src_configure
        }
        src_install() {
          meson_src_install

          newinitd "${FILESDIR}"/dbus.initd dbus
          exeinto /etc/user/init.d
          newexe "${FILESDIR}/dbus.user.initd" dbus

          if use X; then
            # dbus X session script (bug #77504)
            # turns out to only work for GDM (and startx). has been merged into
            # other desktop (kdm and such scripts)
            exeinto /etc/X11/xinit/xinitrc.d
            newexe "${FILESDIR}"/80-dbus 80-dbus
          fi

          find "${ED}" -name '*.la' -delete || die

          # Needs to exist for dbus sessions to launch
          keepdir /usr/share/dbus-1/services
          keepdir /etc/dbus-1/{session,system}.d
          # machine-id symlink from pkg_postinst()
          keepdir /var/lib/dbus
          # Let the init script create the /var/run/dbus directory
          rm -rf "${ED}"/{,var/}run

          # bug #761763
          rm -rf "${ED}"/usr/lib/sysusers.d

          dodoc AUTHORS NEWS README doc/TODO

          mv "${ED}"/usr/share/doc/dbus/* "${ED}"/usr/share/doc/${PF}/ || die
          rm -rf "${ED}"/usr/share/doc/dbus || die
          }
          pkg_postinst() {
            if use systemd; then
              tmpfiles_process dbus.conf
            fi

            dbus-uuidgen --ensure="${EROOT}"/etc/machine-id
            ln -sf "${EPREFIX}"/etc/machine-id "${EROOT}"/var/lib/dbus/machine-id
          }

  packages:

    - dbus:


libvirt:
  generator: builtin-dirlisting
  defaults:
    category: app-emulation
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    dir:
      url: 'https://download.libvirt.org{{ .Values.extra_path | default "/" }}'
      matcher: '{{ .Values.pn }}-.*.tar.xz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''

  packages:

    - libvirt-glib:
        vars:
          extra_path: '/glib/'
          inherit:
            - meson
            - vala
          desc: GLib and GObject mappings for libvirt
          homepage: https://libvirt.org/ https://gitlab.com/libvirt/libvirt-glib/
          license: LGPL-2.1+
          iuse: +introspection +vala
          required_use: |
            vala? ( introspection )
          rdepend: |
            dev-libs/libxml2:=
            app-emulation/libvirt:=
            dev-libs/glib:2
            introspection? ( dev-libs/gobject-introspection:= )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
            dev-util/gtk-doc-am
            dev-util/intltool
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              default
              use vala && vala_src_prepare
            }
            src_configure() {
              local emesonargs=(
                $(meson_feature introspection)
                $(meson_feature vala vapi)
                -Dtests=disabled
              )
              meson_src_configure
            }

    - libvirt:
        vars:
          python_compat: python3+
          desc: C toolkit to manipulate virtual machines
          homepage: https://www.libvirt.org/
          license: LGPL-2.1
          inherit:
            - bash-completion-r1
            - meson
            - python-any-r1
            - user
          iuse: |
            apparmor audit +caps +dbus dtrace firewalld fuse glusterfs iscsi
            iscsi-direct +libvirtd lvm libssh lxc +macvtap nfs nls numa openvz
            parted pcap policykit +qemu rbd sasl +udev +vepa
            virtualbox virt-network wireshark-plugins xen zfs
          required_use: |
            firewalld? ( virt-network )
            libvirtd? ( || ( lxc openvz qemu virtualbox xen ) )
            lxc? ( caps libvirtd )
            openvz? ( libvirtd )
            policykit? ( dbus )
            qemu? ( libvirtd )
            vepa? ( macvtap )
            virt-network? ( libvirtd )
            virtualbox? ( libvirtd )
            xen? ( libvirtd )
          rdepend: |
            app-misc/scrub
            dev-libs/glib
            dev-libs/libgcrypt:0
            dev-libs/libnl:3
            dev-libs/libxml2
            net-analyzer/openbsd-netcat
            net-libs/gnutls:0=
            net-libs/libssh2
            net-libs/libtirpc
            net-libs/rpcsvc-proto
            net-misc/curl
            sys-apps/dmidecode
            sys-apps/util-linux
            sys-devel/gettext
            sys-libs/ncurses:0=
            sys-libs/readline:=
            apparmor? ( sys-libs/libapparmor )
            audit? ( sys-process/audit )
            caps? ( sys-libs/libcap-ng )
            dbus? ( sys-apps/dbus )
            dtrace? ( dev-util/systemtap )
            firewalld? ( net-firewall/firewalld )
            fuse? ( sys-fs/fuse:0= )
            glusterfs? ( sys-cluster/glusterfs )
            iscsi? ( sys-block/open-iscsi )
            iscsi-direct? ( net-libs/libiscsi )
            libssh? ( net-libs/libssh )
            lvm? ( sys-fs/lvm2[-device-mapper-only(-)] )
            nfs? ( net-fs/nfs-utils )
            numa? (
              sys-process/numactl
              sys-process/numad
            )
            parted? (
              sys-block/parted[device-mapper]
              sys-fs/lvm2[-device-mapper-only(-)]
            )
            pcap? ( net-libs/libpcap )
            policykit? ( sys-auth/polkit )
            qemu? (
              app-emulation/qemu
              dev-libs/json-c
            )
            rbd? ( sys-cluster/ceph )
            sasl? ( dev-libs/cyrus-sasl )
            virt-network? (
              net-dns/dnsmasq[script]
              net-firewall/ebtables
              net-firewall/iptables[ipv6]
              net-misc/radvd
              sys-apps/iproute2[-minimal]
            )
            virtualbox? (
              || (
                app-emulation/virtualbox
                app-emulation/virtualbox-bin
              )
            )
            wireshark-plugins? ( net-analyzer/wireshark:= )
            xen? (
              app-emulation/xen
              app-emulation/xen-tools:=
            )
            udev? (
              virtual/udev
              x11-libs/libpciaccess
            )
            zfs? ( sys-fs/zfs )
          depend: |
            ${RDEPEND}
            ${PYTHON_DEPS}
            app-text/xhtml1
            dev-lang/perl
            dev-libs/libxslt
            dev-perl/XML-XPath
            dev-python/docutils
          bdepend: |
            virtual/pkgconfig
          body: |
            pkg_setup() {
              if use qemu; then
                enewgroup qemu 77
                enewuser qemu 77 -1 -1 "qemu,kvm"
              fi
              use policykit && enewgroup libvirt
            }
            src_prepare() {
              touch "${S}/.mailmap"
              default
              # Tweak the init script:
              cp "${FILESDIR}/libvirtd.init-r19" "${S}/libvirtd.init" || die
              sed -e "s/USE_FLAG_FIREWALLD/$(usex firewalld 'need firewalld' '')/" \
                -i "${S}/libvirtd.init" || die "sed failed"
              #Replacing recurrent patches with sed scripts
              mv src/security/apparmor/usr.lib.libvirt.virt-aa-helper.in \
                src/security/apparmor/usr.libexec.virt-aa-helper.in
              for x in $(grep -rl usr.lib.libvirt.virt-aa-helper.in); do
                sed -e "s/usr.lib.libvirt.virt-aa-helper.in/usr.libexec.virt-aa-helper.in/g" -i $x
              done
              sed -e "s#/sysconfig/libvirt-guests#/sysconfig/libvirt-guests.conf#g" \
                -e "s#/lock/subsys/libvirt-guests#/lock/libvirt-guests#g" \
                -i tools/libvirt-guests.sh.in
            }
            src_configure() {
              local emesonargs=(
                $(meson_feature apparmor)
                $(meson_feature apparmor apparmor_profiles)
                $(meson_feature audit)
                $(meson_feature caps capng)
                $(meson_feature dtrace)
                $(meson_feature firewalld)
                $(meson_feature fuse)
                $(meson_feature glusterfs)
                $(meson_feature glusterfs storage_gluster)
                $(meson_feature iscsi storage_iscsi)
                $(meson_feature iscsi-direct storage_iscsi_direct)
                $(meson_feature libvirtd driver_libvirtd)
                $(meson_feature libssh)
                $(meson_feature lvm storage_lvm)
                $(meson_feature lvm storage_mpath)
                $(meson_feature lxc driver_lxc)
                $(meson_feature nls)
                $(meson_feature numa numactl)
                $(meson_feature numa numad)
                $(meson_feature openvz driver_openvz)
                $(meson_feature parted storage_disk)
                $(meson_feature pcap libpcap)
                $(meson_feature policykit polkit)
                $(meson_feature qemu driver_qemu)
                $(meson_feature qemu json_c)
                $(meson_feature rbd storage_rbd)
                $(meson_feature sasl)
                $(meson_feature udev)
                $(meson_feature virt-network driver_network)
                $(meson_feature virtualbox driver_vbox)
                $(meson_feature wireshark-plugins wireshark_dissector)
                $(meson_feature xen driver_libxl)
                $(meson_feature zfs storage_zfs)
                -Dselinux=disabled
                -Dnetcf=disabled
                -Dsanlock=disabled
                -Ddriver_esx=enabled
                -Dqemu_group=$(usex caps qemu root)
                -Dqemu_user=$(usex caps qemu root)
                -Ddriver_remote=enabled
                -Dstorage_fs=enabled
                -Ddriver_vmware=enabled
                --localstatedir=/var
                -Drunstatedir=/run
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              # Remove bogus, empty directories. They are either not used, or
              # libvirtd is able to create them on demand
              rm -rf "${D}"/etc/sysconfig
              rm -rf "${D}"/var
              rm -rf "${D}"/run
              use libvirtd || return 0
              # From here, only libvirtd-related instructions, be warned!
              newinitd "${S}/libvirtd.init" libvirtd
              newinitd "${FILESDIR}/libvirt-guests.init-r4" libvirt-guests
              newinitd "${FILESDIR}/virtlockd.init-r2" virtlockd
              newinitd "${FILESDIR}/virtlogd.init-r2" virtlogd
              newconfd "${FILESDIR}/libvirtd.confd-r5" libvirtd
              newconfd "${FILESDIR}/libvirt-guests.confd" libvirt-guests
            }
            pkg_preinst() {
              # we only ever want to generate this once
              if [[ -e "${ROOT}"/etc/libvirt/qemu/networks/default.xml ]]; then
                rm -rf "${D}"/etc/libvirt/qemu/networks/default.xml
              fi
            }
            pkg_postinst() {
              if [[ -e "${ROOT}"/etc/libvirt/qemu/networks/default.xml ]]; then
                touch "${ROOT}"/etc/libvirt/qemu/networks/default.xml
              fi
              use libvirtd || return 0
            }

gitlab_runner:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: '1'
    rate_diuration: '5s'
  defaults:
    category: dev-util
    extensions:
      - golang
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}-bin"
    dir:
      url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags'
      matcher: 'v[0-9.]'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/archive/{{ .Values.original_version }}/{{ .Values.gitlab_repo }}-{{ .Values.original_version }}.tar.bz2'
    transform:
      - kind: string
        match: 'v'
        replace: ''
    vars:
      desc: GitLab Runner for executing CI jobs locally
      extra_envs:
        - 'EGO_BUNDLE_POSTFIX="mark-go-bundle"'
      gitlab_user: gitlab-org
      gitlab_repo: gitlab-runner
      homepage: https://gitlab.com/gitlab-org/gitlab-runner
      inherit:
        - go-module
        - systemd
        - tmpfiles
        - user
      iuse: systemd
      license: MIT
      rdepend: |
        systemd? ( sys-apps/systemd )
        !dev-util/gitlab-runner-bin
      restrict: strip
      s: '${WORKDIR}/gitlab-runner-v{{ .Values.pv | default .Values.version }}'
      docs:
        - docs
        - CHANGELOG.md
        - README.md
      body: |
        pkg_setup() {
          enewgroup gitlab 548
          enewuser gitlab-runner 548 -1 -1 gitlab
        }
        src_compile() {
          emake \
            BUILT="$(date -u '+%Y-%m-%dT%H:%M:%S%:z')" \
            REVISION="{{ .Values.sha }}" \
            VERSION={{ .Values.pv | default .Values.version }} \
            runner-and-helper-bin-host
        }
        src_install() {
          exeinto /usr/sbin
          newbin out/binaries/gitlab-runner-linux-* gitlab-runner
          newbin out/binaries/gitlab-runner-helper/gitlab-runner-helper.linux-* gitlab-runner-helper
          einstalldocs
          if use systemd; then
            systemd_dounit "${FILESDIR}"/gitlab-runner.service
            newtmpfiles "${FILESDIR}"/gitlab-runner.tmpfile gitlab-runner.conf
          else
            newconfd "${FILESDIR}"/gitlab-runner.confd gitlab-runner
            newinitd "${FILESDIR}"/gitlab-runner.initd gitlab-runner
          fi
          insopts -o gitlab-runner -g gitlab -m0600
          diropts -o gitlab-runner -g gitlab -m0750
          insinto /etc/gitlab-runner
          keepdir /etc/gitlab-runner /var/lib/{{ .Values.pn }}
          fowners gitlab-runner:gitlab /etc/{{ .Values.pn }}
        }

        pkg_postinst() {
          if use systemd; then
            tmpfiles_process gitlab-runner.conf
          fi
          einfo "Create a runner at Gitlab via Build -> Runners in the menu."
          einfo "Copy the token that appears on the final page."
          einfo
          einfo "Register the runner as root using"
          einfo "\t$ gitlab-runner register --token <paste runner token>\n"
          einfo
          einfo "The config will be saved in /etc/gitlab-runner/config.toml"
        }
  extensions_defs:
    golang:
      opts:

  packages:
    - gitlab-runner:


