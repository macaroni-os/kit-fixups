python_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    template: "../../templates/pypi-generic.tmpl"
    category: app-admin
    vars:
      du_pep517: setuptools
    python_compat: "python3+"
  packages:
    - ansible:
        selector:
          - '<9.0.2'
        python_requires_ignore: "true"
        vars:
          license: GPL-3+
          rdepend: |
            virtual/ssh
            net-misc/sshpass
        pydeps:
          py:all:
            - cryptography
            - httplib2
            - importlib_resources
            - jinja
            - netaddr
            - paramiko
            - pexpect
            - pyyaml
            - six
          py:all:build:
            - packaging


emulation_modules:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    category: app-emulation
  packages:
    - virt-manager:
        dir:
          url: https://releases.pagure.org/virt-manager/
          matcher: "virt-manager-.*.tar.xz$"
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
        transform:
          - kind: string
            match: 'virt-manager-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          python_compat: "python3+"
          github_user: virt-manager
          github_repo: virt-manager
          license: GPL-2+
          homepage: https://virt-manager.org https://github.com/virt-manager/virt-manager
          desc: A graphical tool for administering virtual machines/containers
          iuse: gtk policykit sasl
          required_use: ${PYTHON_REQUIRED_USE}
          inherit:
            - gnome3
            - python-single-r1
            - meson
          rdepend: |
            ${PYTHON_DEPS}
            || ( dev-libs/libisoburn app-cdr/cdrtools )
            app-emulation/libvirt-glib[introspection]
            $(python_gen_cond_dep '
              dev-libs/libxml2[python,${PYTHON_USEDEP}]
              dev-python/argcomplete[${PYTHON_USEDEP}]
              dev-python/libvirt-python[${PYTHON_USEDEP}]
              dev-python/pygobject:3[${PYTHON_USEDEP}]
              dev-python/requests[${PYTHON_USEDEP}]
            ')
            sys-libs/libosinfo[introspection]
            gtk? (
              gnome-base/dconf
              net-libs/gtk-vnc[gtk3(+),introspection]
              net-misc/spice-gtk[usbredir,gtk3,introspection,sasl?]
              policykit? ( sys-auth/polkit[introspection] )
              sys-apps/dbus[X]
              x11-libs/gtk+:3[introspection]
              || (
                x11-libs/gtksourceview:4[introspection]
                x11-libs/gtksourceview:3.0[introspection]
              )
              x11-libs/vte:2.91[introspection]
            )
          depend: ${RDEPEND}
          bdepend: |
            sys-devel/gettext
          body: |
            src_configure() {
              local emesonargs=(
                -Dupdate-icon-cache=false
                -Dcompile-schemas=false
                -Ddefault-graphics=spice # default
                -Dtests=disabled
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if ! use gtk; then
                rm -r "${ED}/usr/share/applications/${PN}.desktop" || die
                rm -r "${ED}/usr/share/${PN}/icons/" || die
                rm -r "${ED}/usr/share/${PN}/ui/" || die
                rm -r "${ED}/usr/share/icons/" || die
                rm -r "${ED}/usr/bin/${PN}" || die
              fi
              python_fix_shebang "${ED}"
              python_optimize "${ED}"/usr/share/virt-manager/virt{inst,Manager}
            }
            pkg_postinst() {
              use gtk && gnome3_pkg_postinst
            }

sudo:
  generator: builtin-dirlisting
  defaults:
    template: templates/sudo.tmpl
    category: app-admin
  packages:
    - sudo:
        dir:
          url: https://www.sudo.ws/dist/
          matcher: "sudo-.*.tar.gz"
        transform:
          - kind: string
            match: 'sudo-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
          - kind: string
            match: 'p'
            replace: '.'

fish_github:
  generator: builtin-github
  defaults:
    category: app-shells
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl

  extensions_defs:
    rust:
      opts:
        crates_skipped: fish

  packages:
    - fish:
        github:
          user: fish-shell
          repo: fish-shell
        extensions:
          - rust
        transform:
          - kind: string
            match: 'fish '
            replace: ''
          - kind: regex
            match: ' \(.*'
            replace: ''
        vars:
          desc: Friendly Interactive SHell
          homepage: http://fishshell.com/
          inherit:
            - cmake
            - cargo
            - readme.gentoo-r1
            - xdg
          license: GPL-2
          iuse: nls
          rdepend: |
            sys-libs/ncurses
          depend: |
            ${RDEPEND}
            nls? ( sys-devel/gettext )
          patches:
            - fish-4.0.2-use-cargo-eclass-for-build.patch
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            post_src_unpack() {
              if [ -e ${S} ] ; then
                rm -rf ${S}
              fi
              mv {{ .Values.github_user }}-{{ .Values.github_repo }}-* ${S}
            }
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              export FISH_BUILD_VERSION="{{ .Values.version }}-{{ substr 0 7 .Values.sha }}"
              local mycmakeargs=(
                -DCMAKE_INSTALL_BINDIR="${EPREFIX}/bin"
                -DCMAKE_INSTALL_SYSCONFDIR="${EPREFIX}/etc"
                -DCMAKE_INSTALL_LIBDIR="${EPREFIX}/lib"
                -DBUILD_SHARED_LIBS=True
                -DCMAKE_BUILD_TYPE=RelWithDebInfo
                -DINSTALL_DOCS=OFF
                -DWITH_GETTEXT="$(usex nls)"
              )
              cmake_src_configure
            }
            src_compile() {
              local -x PREFIX="${EPREFIX}/usr"
              local -x DOCDIR="${EPREFIX}/usr/share/doc/${PF}"
              local -x CMAKE_WITH_GETTEXT="$(usex nls 1 0)"
              local -x SYSCONFDIR="${EPREFIX}/etc"
              local -x FISH_BUILD_DOCS
              FISH_BUILD_DOCS=0
              cargo_src_compile
            }
            src_install() {
              cmake_src_install
              keepdir /usr/share/fish/vendor_{completions,conf,functions}.d
              insinto /usr/share/doc/fish
              doins "${FILESDIR}"/README.mark
            }
            pkg_postinst() {
              xdg_pkg_postinst
            }


shells_rust_github:
  generator: builtin-github
  defaults:
    category: app-shells
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    extensions:
      - rust
    vars:
      inherit:
        - cargo
      bdepend: virtual/rust
      depend: '${RDEPEND}'

  extensions_defs:
    rust:
      opts:

  packages:
    - mcfly:
        github:
          user: cantino
        vars:
          rdepend: |
            dev-db/sqlite
          extra_envs:
            - 'QA_FLAGS_IGNORED="/usr/bin/mcfly"'
          body: |
            src_unpack() {
              cargo_src_unpack
              rm -rf ${S}
              mv ${WORKDIR}/{{ .Values.github_user }}-{{ .Values.github_repo }}-* ${S} || die
            }
            src_install() {
              cargo_src_install
              insinto "/usr/share/{{ .Values.pn }}"
              doins "{{ .Values.pn }}".{bash,fish,zsh}
              einstalldocs
            }
            pkg_postinst() {
              elog "To start using {{ .Values.pn }}, add the following to your shell:"
              elog
              elog "~/.bashrc"
              local p="${EPREFIX}/usr/share/{{ .Values.pn }}/{{ .Values.pn }}.bash"
              elog "[[ -f ${p} ]] && source ${p}"
              elog
              elog "~/.config/fish/config.fish"
              local p="${EPREFIX}/usr/share/{{ .Values.pn }}/{{ .Values.pn }}.fish"
              elog "if test -r ${p}"
              elog "    source ${p}"
              elog "    mcfly_key_bindings"
              elog
              elog "~/.zsh"
              local p="${EPREFIX}/usr/share/{{ .Values.pn }}/{{ .Values.pn }}.zsh"
              elog "[[ -f ${p} ]] && source ${p}"
            }

    - starship:
        vars:
          rdepend: |
            dev-libs/openssl
            sys-libs/zlib
          docs:
            - docs/README.md
          desc: The minimal, blazing-fast, and infinitely customizable prompt for any shell!
          body: |
            src_unpack() {
              cargo_src_unpack
              rm -rf ${S}
              mv ${WORKDIR}/{{ .Values.github_user }}-{{ .Values.github_repo }}-* ${S} || die
            }
            src_install() {
              dobin target/release/{{ .Values.pn }}
              default
            }
            pkg_postinst() {
              echo
              elog "Thanks for installing starship."
              elog "For better experience, it's suggested to install some Powerline font."
              elog "You can get some from https://github.com/powerline/fonts"
              echo
            }


shells_go_github:
  generator: builtin-github
  defaults:
    category: app-shells
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    extensions:
      - golang
    vars:
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:
    - fzf:
        github:
          user: junegunn
        vars:
          desc: A command-line fuzzy finder
          inherit:
            - bash-completion-r1
            - go-module
          body: |
            src_compile() {
              emake PREFIX=${EPREFIX}/usr FZF_VERSION=${PV} FZF_REVISION=tarball bin/{{ .Values.pn }}
            }
            src_install() {
              dobin bin/{{ .Values.pn }}
              doman man/man1/{{ .Values.pn }}.1
              dobin bin/{{ .Values.pn }}-tmux
              doman man/man1/{{ .Values.pn }}-tmux.1
              insinto /usr/share/vim/vimfiles/plugin
              doins plugin/{{ .Values.pn }}.vim
              insinto /usr/share/nvim/runtime/plugin
              doins plugin/{{ .Values.pn }}.vim
              newbashcomp shell/completion.bash {{ .Values.pn }} || die
              insinto /usr/share/zsh/site-functions
              newins shell/completion.zsh _{{ .Values.pn }}
              insinto /usr/share/fzf
              doins shell/key-bindings.bash
              doins shell/key-bindings.fish
              doins shell/key-bindings.zsh
            }
            pkg_postinst() {
              if [[ -z "${REPLACING_VERSIONS}" ]]; then
                elog "To add fzf support to your shell, make sure to use the right file"
                elog "from /usr/share/fzf."
                elog
                elog "For bash, add the following line to ~/.bashrc:"
                elog
                elog "	# source /usr/share/fzf/key-bindings.bash"
                elog
                elog "Or create a symlink:"
                elog
                elog "	# ln -s /usr/share/fzf/key-bindings.bash /etc/bash/bashrc.d/fzf.bash"
                elog
                elog "Plugins for Vim and Neovim are installed to respective directories"
                elog "and will work out of the box."
                elog
                elog "For fzf support in tmux see fzf-tmux(1)."
              fi
            }

backup_go_github:
  generator: builtin-github
  defaults:
    category: app-backup
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    extensions:
      - golang
    vars:
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:
    - backrest:
        github:
          user: garethgeorge
        vars:
          inherit:
            - go-module
            - systemd
            - user
          extra_envs:
            - 'EGO_SKIP_TIDY=1'
          restrict: 'network-sandbox'
          rdepend: |
            app-backup/restic
          depend: |
            ${RDEPEND}
            net-libs/nodejs
          iuse: systemd
          body: |
            pkg_setup() {
              ebegin "Ensuring backrest group and user exist"
              enewgroup backrest
              enewuser backrest -1 -1 /var/lib/backrest backrest
              eend $?
            }

            src_compile() {
              pushd webui 2>&1 >/dev/null
              npm install . || die
              popd 2>&1 >/dev/null
              GOOS=linux BACKREST_BUILD_VERSION={{ .Values.version }} \
                go generate ./...
              CGO_ENABLED=0 \
                go build \
                -asmflags "-trimpath=${S}" \
                -gcflags "-trimpath=${S}" \
                -o backrest ./cmd/backrest
            }

            src_install() {
              dobin backrest
              diropts -m0750 -o backrest -g backrest
              dodir /var/lib/backrest/
              fowners backrest:backrest /var/lib/backrest
              keepdir /var/lib/backrest
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/backrest.service backrest.service || die
              else
                newinitd "${FILESDIR}"/backrest.initd backrest
              fi
              newconfd "${FILESDIR}"/backrest.confd backrest
            }




    - restic:
        transform:
          - kind: string
            match: 'restic '
            replace: ''
          #- kind: regex
          #  match: ' -.*'
          #  replace: ''
        vars:
          inherit:
            - go-module
            - bash-completion-r1
          cdepend: |
            sys-fs/fuse:0
          rdepend: '${CDEPEND}'
          depend: '${CDEPEND}'
          body: |
            src_compile() {
              go build -ldflags '-X main.version={{ .Values.version }}' \
                -asmflags "-trimpath=${S}" \
                -gcflags "-trimpath=${S}" \
                -o restic ./cmd/restic
            }
            src_install() {
              dobin restic

              newbashcomp doc/bash-completion.sh "{{ .Values.pn }}"

              insinto /usr/share/zsh/site-functions
              newins doc/zsh-completion.zsh _restic

              insinto /usr/share/fish/vendor_completions.d/
              newins doc/fish-completion.fish "{{ .Values.pn }}"

              doman doc/man/*
              dodoc doc/*.rst
            }

