          depend: |
            ${CDEPEND}
            sys-firmware/ipxe[qemu]
            sys-firmware/sgabios
            static? (
              dev-libs/glib:2[static-libs(+)]
              sys-libs/zlib:=[static-libs(+)]
              xattr? ( sys-apps/attr[static-libs(+)] )
              {{- range $p := .Values.softmmu_tools_depend }}
              {{- if $p.use | default false }}
              {{ $p.use }}? (
              {{- range $d := $p.dep }}
                {{- if $p.dep_use | default false }}
                  {{- $uses := "" }}
                  {{- range $idx, $u := $p.dep_use }}
                    {{- if ( eq $idx 0 ) }}
