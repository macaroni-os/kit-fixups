fish_github:
  generator: builtin-github
  defaults:
    category: app-shells
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl

  extensions_defs:
    rust:
      opts:
        crates_skipped: fish

  packages:
    - fish:
        github:
          user: fish-shell
          repo: fish-shell
        extensions:
          - rust
        transform:
          - kind: string
            match: 'fish '
            replace: ''
          - kind: regex
            match: ' \(.*'
            replace: ''
        vars:
          desc: Friendly Interactive SHell
          homepage: http://fishshell.com/
          inherit:
            - cmake
            - cargo
            - readme.gentoo-r1
            - xdg
          license: GPL-2
          iuse: nls
          rdepend: |
            sys-libs/ncurses
          depend: |
            ${RDEPEND}
            nls? ( sys-devel/gettext )
          extra_envs:
            - CMAKE_BUILD_TYPE=RelWithDebInfo
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            post_src_unpack() {
              if [ -e ${S} ] ; then
                rm -rf ${S}
              fi
              mv {{ .Values.github_user }}-{{ .Values.github_repo }}-* ${S}
            }
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              export FISH_BUILD_VERSION="{{ .Values.version }}-{{ substr 0 7 .Values.sha }}"
              local mycmakeargs=(
                -DCMAKE_INSTALL_BINDIR="${EPREFIX}/bin"
                -DCMAKE_INSTALL_SYSCONFDIR="${EPREFIX}/etc"
                -DCMAKE_INSTALL_LIBDIR="${EPREFIX}/lib"
                -DBUILD_SHARED_LIBS=True
                -DWITH_DOCS=OFF
                -DWITH_MESSAGE_LOCALIZATION="$(usex nls)"
              )
              cmake_src_configure
            }
            src_compile() {
              local -x PREFIX="${EPREFIX}/usr"
              local -x CMAKE_WITH_GETTEXT="$(usex nls 1 0)"
              local -x SYSCONFDIR="${EPREFIX}/etc"
              local -x FISH_BUILD_DOCS
              FISH_BUILD_DOCS=0
              cargo_src_compile
            }
            src_install() {
              cmake_src_install
              keepdir /usr/share/fish/vendor_{completions,conf,functions}.d
              insinto /usr/share/doc/fish-{{ .Values.version }}
              doins "${FILESDIR}"/README.mark
            }
            pkg_postinst() {
              xdg_pkg_postinst
            }


