sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-server-kit
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: dev-db/firebird

    - pkg: dev-db/mysql-community:8.0

    # InstantClient 19c
    - pkg: dev-db/oracle-instantclient-basic
      conditions:
        - '>=dev-db/oracle-instantclient-basic-19.0.0'
        - '<dev-db/oracle-instantclient-basic-20.0.0'

    # InstantClient 21c
    - pkg: dev-db/oracle-instantclient-basic
      conditions:
        - '>=dev-db/oracle-instantclient-basic-21.0.0'
        - '<dev-db/oracle-instantclient-basic-22.0.0'

    - pkg: sys-auth/sssd

    - pkg: sys-block/thin-provisioning-tools

    - pkg: sys-cluster/libqb

    - pkg: sys-fs/eudev
    - pkg: sys-fs/fuse:3
    - pkg: sys-fs/libostree
