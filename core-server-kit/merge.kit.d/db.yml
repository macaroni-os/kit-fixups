sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-testing"

- name: "core-server-kit"
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: "mark-testing"

- name: "dev-kit"
  url: "https://github.com/macaroni-os/dev-kit"
  branch: "mark-testing"

target:
  name: core-server-kit
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml
  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-admin/mongo-tools

    - pkg: dev-db/sqlite:3
    - pkg: sys-libs/db:18.1
    - pkg: sys-libs/db:5.3
    - pkg: sys-libs/gdbm

    - pkg: dev-db/etcd

    - pkg: dev-db/postgresql:16
    - pkg: dev-db/postgresql:13

    - pkg: dev-db/influxdb
    - pkg: dev-db/mariadb
    - pkg: dev-db/mariadb-connector-c
    - pkg: dev-db/mongodb
    - pkg: dev-db/mysql-community:8.0
    - pkg: dev-db/mysql-init-scripts
    - pkg: dev-db/redis
    - pkg: dev-db/tinycdb
