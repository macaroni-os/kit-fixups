sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-server-kit
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: mark-unstable

  fixups:
    include:

  atoms_defaults:
    max_versions: 3

  atoms:

    # etcd 3.5
    - pkg: dev-db/etcd
      conditions:
        - '<dev-db/etcd-3.6.0'
        - '>=dev-db/etcd-3.5.0'

    # etcd 3.6
    - pkg: dev-db/etcd
      conditions:
        - '<dev-db/etcd-3.7.0'
        - '>=dev-db/etcd-3.6.0'

    # etcd 3.7
    - pkg: dev-db/etcd
      conditions:
        - '<dev-db/etcd-3.8.0'
        - '>=dev-db/etcd-3.7.0'
