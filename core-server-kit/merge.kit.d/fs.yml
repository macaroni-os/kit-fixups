sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-testing"

- name: "core-server-kit"
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: "mark-testing"

- name: "geaaru-kit"
  url: "https://github.com/geaaru/geaaru_overlay"
  branch: "funtoo"

- name: "gnome-kit"
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: "mark-testing"

target:
  name: core-server-kit
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: sys-block/thin-provisioning-tools

    - pkg: sys-fs/btrfs-progs
    - pkg: sys-fs/cryptsetup

    - pkg: sys-fs/eudev

    - pkg: sys-fs/fuse:0
    - pkg: sys-fs/fuse:3
    - pkg: sys-fs/fuse-common
    - pkg: sys-fs/fuse-exfat

    - pkg: sys-fs/libostree
    - pkg: sys-fs/lxcfs

    - pkg: sys-fs/lvm2

    - pkg: sys-fs/dosfstools
    - pkg: sys-fs/e2fsprogs
    - pkg: sys-fs/growpart
    - pkg: sys-fs/reiser4progs
    - pkg: sys-fs/reiserfsprogs
    - pkg: sys-fs/mdadm
    - pkg: sys-fs/mtools
    - pkg: sys-fs/multipath-tools
    - pkg: sys-fs/ncdu
    - pkg: sys-fs/xfsprogs
    - pkg: sys-fs/zfs

    - pkg: sys-fs/cryfs
    - pkg: sys-fs/diskdev_cmds
    - pkg: sys-fs/dmraid
    - pkg: sys-fs/encfs
    - pkg: sys-fs/exfat-utils
    - pkg: sys-fs/f2fs-tools
    - pkg: sys-fs/hfsutils
    - pkg: sys-fs/jfsutils
    - pkg: sys-fs/lsscsi
    - pkg: sys-fs/ntfs3g
    - pkg: sys-fs/squashfs-tools
    - pkg: sys-fs/udftools
    - pkg: sys-fs/udisks
    - pkg: sys-fs/xfsdump

    - pkg: sys-libs/e2fsprogs-libs

    - pkg: virtual/dev-manager
    - pkg: virtual/libudev
    - pkg: virtual/udev

