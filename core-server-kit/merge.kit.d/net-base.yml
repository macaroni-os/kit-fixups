sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

- name: "core-server-kit"
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: "mark-unstable"

- name: "geaaru-kit"
  url: "https://github.com/geaaru/geaaru_overlay"
  branch: "funtoo"

target:
  name: core-server-kit
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: mark-xl

  fixups:
    include:

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: app-admin/apache-tools

    - pkg: net-dialup/freeradius

    - pkg: net-libs/nghttp2

    - pkg: net-misc/curl
    - pkg: net-misc/chrony
    - pkg: net-misc/wget
    - pkg: net-misc/memcached

    - pkg: net-misc/cni-plugins

    - pkg: www-servers/apache:2
    - pkg: www-servers/caddy
    - pkg: www-servers/gunicorn
    - pkg: www-servers/nginx
    - pkg: www-servers/lighttpd
    - pkg: www-servers/tornado

    - pkg: sys-cluster/singularity
    - pkg: sys-cluster/glusterfs
    - pkg: sys-cluster/kubectl

    # Kubernetes node plane (macaroni-os/mark-issues#862)
    - pkg: sys-cluster/kubelet
      conditions:
        - '<sys-cluster/kubelet-1.36.0'
        - '>=sys-cluster/kubelet-1.35.0'

    - pkg: sys-cluster/kubelet
      conditions:
        - '<sys-cluster/kubelet-1.37.0'
        - '>=sys-cluster/kubelet-1.36.0'

    - pkg: sys-cluster/kubelet
      conditions:
        - '<sys-cluster/kubelet-1.38.0'
        - '>=sys-cluster/kubelet-1.37.0'

    - pkg: sys-cluster/kubeadm
      conditions:
        - '<sys-cluster/kubeadm-1.36.0'
        - '>=sys-cluster/kubeadm-1.35.0'

    - pkg: sys-cluster/kubeadm
      conditions:
        - '<sys-cluster/kubeadm-1.37.0'
        - '>=sys-cluster/kubeadm-1.36.0'

    - pkg: sys-cluster/kubeadm
      conditions:
        - '<sys-cluster/kubeadm-1.38.0'
        - '>=sys-cluster/kubeadm-1.37.0'

    # kube-proxy (macaroni-os/mark-issues#862)
    - pkg: sys-cluster/kube-proxy
      conditions:
        - '<sys-cluster/kube-proxy-1.36.0'
        - '>=sys-cluster/kube-proxy-1.35.0'

    - pkg: sys-cluster/kube-proxy
      conditions:
        - '<sys-cluster/kube-proxy-1.37.0'
        - '>=sys-cluster/kube-proxy-1.36.0'

    - pkg: sys-cluster/kube-proxy
      conditions:
        - '<sys-cluster/kube-proxy-1.38.0'
        - '>=sys-cluster/kube-proxy-1.37.0'

    # Kubernetes control plane (macaroni-os/mark-issues#862)
    - pkg: sys-cluster/kube-apiserver
      conditions:
        - '<sys-cluster/kube-apiserver-1.36.0'
        - '>=sys-cluster/kube-apiserver-1.35.0'

    - pkg: sys-cluster/kube-apiserver
      conditions:
        - '<sys-cluster/kube-apiserver-1.37.0'
        - '>=sys-cluster/kube-apiserver-1.36.0'

    - pkg: sys-cluster/kube-apiserver
      conditions:
        - '<sys-cluster/kube-apiserver-1.38.0'
        - '>=sys-cluster/kube-apiserver-1.37.0'

    - pkg: sys-cluster/kube-controller-manager
      conditions:
        - '<sys-cluster/kube-controller-manager-1.36.0'
        - '>=sys-cluster/kube-controller-manager-1.35.0'

    - pkg: sys-cluster/kube-controller-manager
      conditions:
        - '<sys-cluster/kube-controller-manager-1.37.0'
        - '>=sys-cluster/kube-controller-manager-1.36.0'

    - pkg: sys-cluster/kube-controller-manager
      conditions:
        - '<sys-cluster/kube-controller-manager-1.38.0'
        - '>=sys-cluster/kube-controller-manager-1.37.0'

    - pkg: sys-cluster/kube-scheduler
      conditions:
        - '<sys-cluster/kube-scheduler-1.36.0'
        - '>=sys-cluster/kube-scheduler-1.35.0'

    - pkg: sys-cluster/kube-scheduler
      conditions:
        - '<sys-cluster/kube-scheduler-1.37.0'
        - '>=sys-cluster/kube-scheduler-1.36.0'

    - pkg: sys-cluster/kube-scheduler
      conditions:
        - '<sys-cluster/kube-scheduler-1.38.0'
        - '>=sys-cluster/kube-scheduler-1.37.0'

    - pkg: sys-cluster/cilium-cli

    # Cilium agent (macaroni-os/mark-issues#862)
    - pkg: sys-cluster/cilium

    # OVN-Kubernetes 1.4 (ovnkube master/node daemons + ovnkube-identity)
    - pkg: sys-cluster/ovn-kubernetes
      conditions:
        - '<sys-cluster/ovn-kubernetes-1.5.0'
        - '>=sys-cluster/ovn-kubernetes-1.4.0'

    # OVN-Kubernetes 1.3
    - pkg: sys-cluster/ovn-kubernetes
      conditions:
        - '<sys-cluster/ovn-kubernetes-1.4.0'
        - '>=sys-cluster/ovn-kubernetes-1.3.0'

    # OVN-Kubernetes 1.2
    - pkg: sys-cluster/ovn-kubernetes
      conditions:
        - '<sys-cluster/ovn-kubernetes-1.3.0'
        - '>=sys-cluster/ovn-kubernetes-1.2.0'

    # OVN-Kubernetes CNI plugin 1.4 (worker CNI binary)
    - pkg: sys-cluster/ovn-k8s-cni-overlay
      conditions:
        - '<sys-cluster/ovn-k8s-cni-overlay-1.5.0'
        - '>=sys-cluster/ovn-k8s-cni-overlay-1.4.0'

    # OVN-Kubernetes CNI plugin 1.3
    - pkg: sys-cluster/ovn-k8s-cni-overlay
      conditions:
        - '<sys-cluster/ovn-k8s-cni-overlay-1.4.0'
        - '>=sys-cluster/ovn-k8s-cni-overlay-1.3.0'

    # OVN-Kubernetes CNI plugin 1.2
    - pkg: sys-cluster/ovn-k8s-cni-overlay
      conditions:
        - '<sys-cluster/ovn-k8s-cni-overlay-1.3.0'
        - '>=sys-cluster/ovn-k8s-cni-overlay-1.2.0'
