sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-server-kit
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: app-metrics/alertmanager-bin
    - pkg: app-metrics/blackbox_exporter-bin
    - pkg: app-metrics/consul_exporter-bin
    - pkg: app-metrics/memcached_exporter-bin
    - pkg: app-metrics/mysqld_exporter-bin
    - pkg: app-metrics/node_exporter-bin
    - pkg: app-metrics/prometheus-bin
    - pkg: app-metrics/redis_exporter-bin
    - pkg: app-metrics/tempo
    - pkg: app-metrics/tempo-bin
    - pkg: app-metrics/mimir
    - pkg: app-metrics/mimir-bin

    # dual release lines (upstream maintains 3.7 current + 3.6 LTS)
    - pkg: app-metrics/loki
      conditions:
        - '>=app-metrics/loki-3.7.0'
        - '<app-metrics/loki-4.0.0'

    - pkg: app-metrics/loki
      conditions:
        - '>=app-metrics/loki-3.6.0'
        - '<app-metrics/loki-3.7.0'

    - pkg: app-metrics/loki-bin
      conditions:
        - '>=app-metrics/loki-bin-3.7.0'
        - '<app-metrics/loki-bin-4.0.0'

    - pkg: app-metrics/loki-bin
      conditions:
        - '>=app-metrics/loki-bin-3.6.0'
        - '<app-metrics/loki-bin-3.7.0'

    - pkg: www-apps/grafana-bin
