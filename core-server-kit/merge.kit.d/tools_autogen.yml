sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-server-kit
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: mark-unstable

  fixups:
    include:

  atoms_defaults:
    max_versions: 3

  atoms:


    - pkg: app-admin/ansible
    - pkg: app-admin/sudo

    - pkg: app-backup/backrest
    - pkg: app-backup/restic

    - pkg: app-emulation/containerd
    - pkg: app-emulation/qemu
    - pkg: app-emulation/runc
    - pkg: app-emulation/libvirt
    - pkg: app-emulation/libvirt-glib
    - pkg: app-emulation/virt-manager

    - pkg: app-shells/fish
    - pkg: app-shells/fzf
    - pkg: app-shells/mcfly
    - pkg: app-shells/starship

    - pkg: dev-util/gitlab-runner
    - pkg: dev-util/gitlab-runner-bin

    - pkg: sys-apps/dbus

    - pkg: sys-cluster/libqb

    - pkg: sys-libs/ldb
    - pkg: sys-libs/liburing
    - pkg: sys-libs/tdb
    - pkg: sys-libs/tevent
