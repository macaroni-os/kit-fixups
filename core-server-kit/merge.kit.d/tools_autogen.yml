sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: core-server-kit
  url: "https://github.com/macaroni-os/core-server-kit"
  branch: mark-unstable

  fixups:
    include:

  atoms_defaults:
    max_versions: 3

  atoms:


    - pkg: app-admin/ansible
    - pkg: app-admin/sudo

    - pkg: app-backup/backrest
    - pkg: app-backup/restic

    - pkg: app-emulation/containerd
    - pkg: app-emulation/docker
    - pkg: app-emulation/docker-buildx
    - pkg: app-emulation/docker-cli
    - pkg: app-emulation/docker-compose
    - pkg: app-emulation/docker-registry
    - pkg: app-emulation/firecracker-bin
    - pkg: app-emulation/incus
    - pkg: app-emulation/qemu
    - pkg: app-emulation/runc
    - pkg: app-emulation/lxc
    - pkg: app-emulation/lxd
    - pkg: app-emulation/libvirt
    - pkg: app-emulation/libvirt-glib
    - pkg: app-emulation/virt-manager

    - pkg: app-shells/fish
    - pkg: app-shells/fzf
    - pkg: app-shells/mcfly
    - pkg: app-shells/starship

    # Release 10.6
    - pkg: dev-db/mariadb
      conditions:
        - '<dev-db/mariadb-10.7'
        - '>=dev-db/mariadb-10.6'

    # Release 11.4
    - pkg: dev-db/mariadb
      conditions:
        - '<dev-db/mariadb-11.5'
        - '>=dev-db/mariadb-11.4'

    # Release 12.2
    - pkg: dev-db/mariadb
      conditions:
        - '<dev-db/mariadb-12.3'
        - '>=dev-db/mariadb-12.2'

    - pkg: dev-util/gitlab-runner
    - pkg: dev-util/gitlab-runner-bin

    - pkg: www-apps/incus-ui

    - pkg: sys-apps/dbus

    - pkg: sys-cluster/libqb

    - pkg: sys-fs/lxcfs

    - pkg: sys-libs/ldb
    - pkg: sys-libs/liburing
    - pkg: sys-libs/tdb
    - pkg: sys-libs/tevent
