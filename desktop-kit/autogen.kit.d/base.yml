  generator: builtin-github
  defaults:
    template: ../../templates/simple-github.tmpl
    files_dir: '{{ .Values.pn }}'
    category: sys-apps
    github:
      query: releases

  packages:

    - sddm:
        category: x11-misc
        vars:
          extra_envs:
            - 'PLOCALES="ar bn ca cs da de es et eu fi fr he hi_IN hu ie is it ja kk ko lt lv nb nl nn oc pl pt_BR pt_PT ro ru sk sr sr@ijekavian sr@ijekavianlatin sr@latin sv tr uk zh_CN zh_TW"'
          inherit:
            - cmake-utils
            - l10n
            - systemd
            - user
          patches:
            - sddm-0.20.0-respect-user-flags.patch
            - sddm-0.21.0_p20251101-fix-restart-greeter.patch
            - sddm-0.21.0_p20250310-set-XAUTHLOCALHOSTNAME.patch
            - sddm-0.21.0_p20251101-fix-terminal-clearing.patch
          iuse: elogind +pam systemd qt5
          required_use: |
            ?? ( elogind systemd )
          cdepend: |
            qt5? (
              dev-qt/qtcore:5
              dev-qt/qtdbus:5
              dev-qt/qtdeclarative:5
              dev-qt/qtgui:5
              dev-qt/qtnetwork:5
            )
            !qt5? (
              dev-qt/qtbase:6[gui]
              dev-qt/qtdeclarative:6
            )
            sys-libs/pam
            x11-libs/libXau
            x11-libs/libxcb:=
            elogind? (
              sys-auth/elogind
            )
            pam? ( sys-libs/pam )
            systemd? ( sys-apps/systemd:= )
            !systemd? ( sys-power/upower )
          rdepend: |
            ${CDEPEND}
            x11-misc/xcb
          depend: |
            ${CDEPEND}
            dev-python/docutils
            kde-frameworks/extra-cmake-modules
            qt5? (
              dev-qt/linguist-tools:5
            )
          bdepend: |
            virtual/pkgconfig
          body: |
            src_prepare() {
              cmake-utils_src_prepare
              disable_locale() {
                sed -e "/${1}\.ts/d" -i data/translations/CMakeLists.txt || die
              }
              l10n_find_plocales_changes "data/translations" "" ".ts"
              l10n_for_each_disabled_locale_do disable_locale
              sed -e "/^find_package/s/ Test//" -i CMakeLists.txt || die
              cmake_comment_add_subdirectory test
            }
            src_configure() {
              local mycmakeargs=(
                -DENABLE_PAM=$(usex pam)
                -DNO_SYSTEMD=$(usex '!systemd')
                -DUSE_ELOGIND=$(usex 'elogind')
                -DBUILD_MAN_PAGES=ON
                -DDBUS_CONFIG_FILENAME="org.freedesktop.sddm.conf"
              )
              if ! use qt5 ; then
                mycmakeargs+=(
                  -DBUILD_WITH_QT6=ON
                )
              fi
              cmake-utils_src_configure
            }
            src_install() {
              cmake-utils_src_install
              if ! use systemd; then
                insinto /etc/logrotate.d
                newins "${FILESDIR}/sddm.logrotate" sddm
              fi
              # Create a default.conf as upstream dropped /etc/sddm.conf w/o replacement
              local confd="/usr/share/sddm/sddm.conf.d"
              dodir ${confd}
              "${D}"/usr/bin/sddm --example-config > "${D}/${confd}"/00default.conf \
                || die "Failed to create 00default.conf"
              sed -e "/^InputMethod/s/qtvirtualkeyboard//" \
                -i "${D}/${confd}"/00default.conf || die
              if ! use elogind && ! use systemd ; then
                # When both elogind and systemd are disable the configure.ac
                # generates the file /etc/pam.d/sddm-greeter with pam_systemd.so
                # intergration. This generates errors on logs.
                sed -i -e '/pam_systemd.so/d' "${D}"/etc/pam.d/sddm-greeter
              fi
            }
            pkg_postinst() {
              elog "Starting with 0.18.0, SDDM no longer installs /etc/sddm.conf"
              elog "Use it to override specific options. SDDM defaults are now"
              elog "found in: /usr/share/sddm/sddm.conf.d/00default.conf"
              enewgroup ${PN}
              enewuser ${PN} -1 -1 /var/lib/${PN} ${PN},video
              if use systemd ; then
                systemd_reenable sddm.service
              fi
            }

    - xdg-desktop-portal:
        template: ../../templates/simple.tmpl
        github:
          user: flatpak
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            matcher: '{{ .Values.pn }}-.*.tar.xz$'
        vars:
          python_compat: python3+
          inherit:
            - meson
            - python-any-r1
            - systemd
          iuse: geolocation flatpak seccomp systemd udev
          required_use: |
            flatpak? ( seccomp )
          rdepend: |
            dev-libs/glib:2
            dev-libs/json-glib
            media-video/pipewire:=
            sys-fs/fuse:3=
            x11-libs/gdk-pixbuf
            geolocation? ( app-misc/geoclue:2.0 )
            flatpak? ( sys-apps/flatpak )
            seccomp? ( sys-apps/bubblewrap )
            systemd? ( sys-apps/systemd )
            udev? ( dev-libs/libgudev )
            sys-apps/dbus
          depend: '${RDEPEND}'
          bdepend: |
            dev-util/gdbus-codegen
            dev-python/docutils
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_configure() {
              # Avoid issues with sandbox with gst-inspect-1.0
              addpredict /dev/dri
              addpredict /proc/self/task

              local emesonargs=(
                  -Ddbus-service-dir="${EPREFIX}/usr/share/dbus-1/services"
                  -Dsystemd-user-unit-dir="$(systemd_get_userunitdir)"
                  $(meson_feature flatpak flatpak-interfaces)
                  $(meson_feature geolocation geoclue)
                  $(meson_feature udev gudev)
                  $(meson_feature seccomp sandboxed-image-validation)
                  $(meson_feature seccomp sandboxed-sound-validation)
                  -Dsandboxed-sound-validation=disabled
                  $(meson_feature systemd)
                  -Ddocumentation=disabled
                  -Ddatarootdir="${EPREFIX}/usr/share"
                  -Dman-pages=enabled
                  -Dinstalled-tests=false
                  -Dtests=disabled
              )
              meson_src_configure
            }

twm:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: x11-wm
    dir:
      url: 'https://xorg.freedesktop.org/archive/individual/{{ .Values.xorg_path }}'
      exclude: ".99"
      matcher: "{{ .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      license: MIT
      xorg_path: app/
      inherit:
        - autotools
        - flag-o-matic
      homepage: 'https://gitlab.freedesktop.org/xorg/lib/{{ .Values.pn }}'
      desc: X.Org Tab Window Manager
      rdepend: |
        x11-libs/libX11
        x11-libs/libXext
        {{ .Values.rdepend_extra | default "" }}
      depend: |
        ${RDEPEND}
        sys-devel/autoconf
        sys-devel/automake
        sys-devel/libtool
        sys-devel/m4
        x11-misc/util-macros
        media-fonts/font-util
        x11-base/xorg-proto
        {{ .Values.depend_extra | default "" }}
      bdepend: |
        virtual/pkgconfig
      body: |
        {{ .Values.body_extra | default "" }}
        src_prepare() {
          eautoreconf || die
          default
        }
        src_configure() {
          local no_static=""
          # Check if package supports disabling of static libraries
          if grep -q -s "able-static" ${ECONF_SOURCE:-.}/configure; then
            no_static="--disable-static"
          fi
          local econfargs=(
            --enable-shared
            ${no_static}
            {{ .Values.econf_args_extra | default "" }}
          )
          econf "${econfargs[@]}"
        }
        src_install() {
          default
          find "${D}" -type f -name '*.la' -delete || die
          {{ .Values.src_install_extra | default "" }}
        }

  packages:

    - twm:
        vars:
          depend_extra: |
            sys-devel/bison
          rdepend_extra: |
            x11-libs/libXt
            x11-libs/libXmu
            x11-libs/libICE
            x11-libs/libSM

