general_github:
  generator: builtin-github
  defaults:
    template: ../../templates/simple-github.tmpl
    files_dir: '{{ .Values.pn }}'
    category: sys-apps
    github:
      query: releases

  packages:

    - lightdm:
        category: x11-misc
        github:
          user: ubuntu
          match: '^1.*'
          num_pages: 4
        vars:
          homepage: https://github.com/ubuntu/lightdm
          desc: A lightweight display manager
          license: GPL-3 LGPL-3
          inherit:
            - autotools
            - flag-o-matic
            - pam
            - qmake-utils
            - systemd
            - user
            - vala
            - xdg-utils
          iuse: +X audit elogind +gnome +gtk +introspection non_root qt5 +qt6 systemd vala
          required_use: |
            ?? ( elogind systemd )
          restrict: test
          docs:
            - NEWS
          depend: |
            >=dev-libs/glib-2.44.0:2
            dev-libs/libgcrypt
            dev-libs/libxml2:2
            virtual/pam
            x11-libs/libX11
            x11-libs/libXdmcp
            x11-libs/libxcb
            >=x11-libs/libxklavier-5
            audit? ( sys-process/audit )
            gnome? (
              gnome-base/gnome-common
              sys-apps/accountsservice
            )
            introspection? ( >=dev-libs/gobject-introspection-1 )
            qt5? (
              dev-qt/qtcore:5
              dev-qt/qtdbus:5
              dev-qt/qtgui:5
            )
            qt6? (
              dev-qt/qtbase:6[gui]
            )
          rdepend: |
            ${DEPEND}
            >=sys-auth/pambase-20101024-r2
            elogind? ( sys-auth/elogind[pam] )
            X? ( x11-base/xorg-server )
          bdepend: |
            app-text/yelp-tools
            dev-util/gtk-doc-am
            dev-util/intltool
            sys-devel/gettext
            virtual/pkgconfig
            vala? ( $(vala_depend) )
          pdepend: |
            gtk? ( x11-misc/lightdm-gtk-greeter )
          body: |
            pkg_setup() {
              export LIGHTDM_USER=${LIGHTDM_USER:-lightdm}
              if use non_root ; then
                enewgroup ${LIGHTDM_USER} 134
                enewgroup video 27
                enewuser ${LIGHTDM_USER} 134 -1 /var/lib/${LIGHTDM_USER} ${LIGHTDM_USER},video
                esethome ${LIGHTDM_USER} /var/lib/${LIGHTDM_USER}
              fi
            }
            src_prepare() {
              xdg_environment_reset

              sed -i -e 's:getgroups:lightdm_&:' tests/src/libsystem.c || die
              sed -i -e '/minimum-uid/s:500:1000:' data/users.conf || die

              einfo "Fixing the session-wrapper variable in lightdm.conf"
              sed -i -e \
                "/^#session-wrapper/s@^.*@session-wrapper=/etc/${PN}/Xsession@" \
                data/lightdm.conf || die "Failed to fix lightdm.conf"

              if use qt5 ; then
                grep -q 'QT5_VALIDATE_MOC(MOC5)' configure.ac \
                  || die "MOC5 detection hook not found, sed needs updating"
                sed -i -e \
                  "/QT5_VALIDATE_MOC(MOC5)/a AC_SUBST(MOC5,$(qt5_get_bindir)/moc)" \
                  configure.ac || die
              fi
              if use qt6 ; then
                grep -q 'QT6_VALIDATE_MOC(MOC6)' configure.ac \
                  || die "MOC6 detection hook not found, sed needs updating"
                sed -i -e \
                  "/QT6_VALIDATE_MOC(MOC6)/a AC_SUBST(MOC6,$(qt6_get_libdir)/libexec/moc)" \
                  configure.ac || die
              fi

              default

              sed -i /"@YELP_HELP_RULES@"/d help/Makefile.am || die

              use vala && vala_src_prepare

              eautoreconf
            }
            src_configure() {
              local _greeter _session _user
              _greeter=${LIGHTDM_GREETER:=lightdm-gtk-greeter}
              _session=${LIGHTDM_SESSION:=gnome}
              _user="$(usex non_root "${LIGHTDM_USER}" root)"
              einfo "Default greeter: ${_greeter}"
              einfo "Default session: ${_session}"
              einfo "Greeter user: ${_user}"

              if use qt5 && ! use qt6 ; then
                append-cxxflags -std=c++11
              fi

              local myeconfargs=(
                --localstatedir=/var
                --disable-static
                --disable-tests
                $(use_enable audit libaudit)
                $(use_enable introspection)
                $(use_enable qt5 liblightdm-qt5)
                $(use_enable qt6 liblightdm-qt6)
                $(use_enable vala)
                --with-user-session=${_session}
                --with-greeter-session=${_greeter}
                --with-greeter-user=${_user}
              )
              econf "${myeconfargs[@]}"
            }
            src_install() {
              default

              if [[ -d ${ED}/etc/apparmor.d ]]; then
                rm -r "${ED}/etc/apparmor.d" || die \
                  "Failed to remove apparmor profiles"
              fi

              insinto /etc/${PN}
              doins data/{${PN},keys}.conf
              doins "${FILESDIR}"/Xsession
              fperms +x /etc/${PN}/Xsession
              keepdir /var/lib/${PN}-data

              find "${ED}" -type f \( -name '*.a' -o -name "*.la" \) -delete || die

              if [[ -d ${ED}/etc/init ]]; then
                rm -r "${ED}/etc/init" || die "Failed to remove upstart job"
              fi

              rm -r "${ED}"/etc/pam.d/${PN}{,-greeter} || die
              pamd_mimic system-local-login ${PN} auth account password session #372229
              pamd_mimic system-local-login ${PN}-greeter auth account password session #372229
              dopamd "${FILESDIR}"/${PN}-autologin #390863, #423163

              if use systemd ; then
                systemd_dounit "${FILESDIR}/${PN}.service"
              fi
            }
            pkg_postinst() {
              if use systemd ; then
                systemd_reenable "${PN}.service"
              fi

              elog "Even though the default /etc/lightdm/lightdm.conf will work for"
              elog "most users, make sure you configure it to suit your needs before"
              elog "using lightdm for the first time. You can test the configuration"
              elog "file with:"
              elog "  lightdm --test-mode -c /etc/lightdm/lightdm.conf"
              elog "This requires xorg-server to be built with the 'kdrive' USE flag."
              elog ""
              elog "You can set your own default values for LIGHTDM_GREETER,"
              elog "LIGHTDM_SESSION and LIGHTDM_USER in /etc/portage/make.conf"
              elog ""
              elog "Under OpenRC, lightdm is started by the shared xdm init script"
              elog "that ships with x11-base/xorg-server. Set:"
              elog "  DISPLAYMANAGER=\"lightdm\""
              elog "in /etc/conf.d/xdm, then enable it with:"
              elog "  rc-update add xdm default"

              if use systemd ; then
                elog ""
                elog "Under systemd, enable the unit with:"
                elog "  systemctl enable lightdm.service"
              fi
            }

    - sddm:
        category: x11-misc
        vars:
          extra_envs:
            - 'PLOCALES="ar bn ca cs da de es et eu fi fr he hi_IN hu ie is it ja kk ko lt lv nb nl nn oc pl pt_BR pt_PT ro ru sk sr sr@ijekavian sr@ijekavianlatin sr@latin sv tr uk zh_CN zh_TW"'
          inherit:
            - cmake-utils
            - l10n
            - systemd
            - user
          patches:
            - sddm-0.20.0-respect-user-flags.patch
            - sddm-0.21.0_p20251101-fix-restart-greeter.patch
            - sddm-0.21.0_p20250310-set-XAUTHLOCALHOSTNAME.patch
            - sddm-0.21.0_p20251101-fix-terminal-clearing.patch
          iuse: elogind +pam systemd qt5
          required_use: |
            ?? ( elogind systemd )
          cdepend: |
            qt5? (
              dev-qt/qtcore:5
              dev-qt/qtdbus:5
              dev-qt/qtdeclarative:5
              dev-qt/qtgui:5
              dev-qt/qtnetwork:5
            )
            !qt5? (
              dev-qt/qtbase:6[gui]
              dev-qt/qtdeclarative:6
            )
            sys-libs/pam
            x11-libs/libXau
            x11-libs/libxcb:=
            elogind? (
              sys-auth/elogind
            )
            pam? ( sys-libs/pam )
            systemd? ( sys-apps/systemd:= )
            !systemd? ( sys-power/upower )
          rdepend: |
            ${CDEPEND}
            x11-misc/xcb
          depend: |
            ${CDEPEND}
            dev-python/docutils
            kde-frameworks/extra-cmake-modules
            qt5? (
              dev-qt/linguist-tools:5
            )
          bdepend: |
            virtual/pkgconfig
          body: |
            src_prepare() {
              cmake-utils_src_prepare
              disable_locale() {
                sed -e "/${1}\.ts/d" -i data/translations/CMakeLists.txt || die
              }
              l10n_find_plocales_changes "data/translations" "" ".ts"
              l10n_for_each_disabled_locale_do disable_locale
              sed -e "/^find_package/s/ Test//" -i CMakeLists.txt || die
              cmake_comment_add_subdirectory test
            }
            src_configure() {
              local mycmakeargs=(
                -DENABLE_PAM=$(usex pam)
                -DNO_SYSTEMD=$(usex '!systemd')
                -DUSE_ELOGIND=$(usex 'elogind')
                -DBUILD_MAN_PAGES=ON
                -DDBUS_CONFIG_FILENAME="org.freedesktop.sddm.conf"
              )
              if ! use qt5 ; then
                mycmakeargs+=(
                  -DBUILD_WITH_QT6=ON
                )
              fi
              cmake-utils_src_configure
            }
            src_install() {
              cmake-utils_src_install
              if ! use systemd; then
                insinto /etc/logrotate.d
                newins "${FILESDIR}/sddm.logrotate" sddm
              fi
              # Create a default.conf as upstream dropped /etc/sddm.conf w/o replacement
              local confd="/usr/share/sddm/sddm.conf.d"
              dodir ${confd}
              "${D}"/usr/bin/sddm --example-config > "${D}/${confd}"/00default.conf \
                || die "Failed to create 00default.conf"
              sed -e "/^InputMethod/s/qtvirtualkeyboard//" \
                -i "${D}/${confd}"/00default.conf || die
              if ! use elogind && ! use systemd ; then
                # When both elogind and systemd are disable the configure.ac
                # generates the file /etc/pam.d/sddm-greeter with pam_systemd.so
                # intergration. This generates errors on logs.
                sed -i -e '/pam_systemd.so/d' "${D}"/etc/pam.d/sddm-greeter
              fi
            }
            pkg_postinst() {
              elog "Starting with 0.18.0, SDDM no longer installs /etc/sddm.conf"
              elog "Use it to override specific options. SDDM defaults are now"
              elog "found in: /usr/share/sddm/sddm.conf.d/00default.conf"
              enewgroup ${PN}
              enewuser ${PN} -1 -1 /var/lib/${PN} ${PN},video
              if use systemd ; then
                systemd_reenable sddm.service
              fi
            }

    - xdg-desktop-portal:
        template: ../../templates/simple.tmpl
        github:
          user: flatpak
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            matcher: '{{ .Values.pn }}-.*.tar.xz$'
        vars:
          python_compat: python3+
          inherit:
            - meson
            - python-any-r1
            - systemd
          iuse: geolocation flatpak seccomp systemd udev
          required_use: |
            flatpak? ( seccomp )
          rdepend: |
            dev-libs/glib:2
            dev-libs/json-glib
            media-video/pipewire:=
            sys-fs/fuse:3=
            x11-libs/gdk-pixbuf
            geolocation? ( app-misc/geoclue:2.0 )
            flatpak? ( sys-apps/flatpak )
            seccomp? ( sys-apps/bubblewrap )
            systemd? ( sys-apps/systemd )
            udev? ( dev-libs/libgudev )
            sys-apps/dbus
          depend: '${RDEPEND}'
          bdepend: |
            dev-util/gdbus-codegen
            dev-python/docutils
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_configure() {
              # Avoid issues with sandbox with gst-inspect-1.0
              addpredict /dev/dri
              addpredict /proc/self/task

              local emesonargs=(
                  -Ddbus-service-dir="${EPREFIX}/usr/share/dbus-1/services"
                  -Dsystemd-user-unit-dir="$(systemd_get_userunitdir)"
                  $(meson_feature flatpak flatpak-interfaces)
                  $(meson_feature geolocation geoclue)
                  $(meson_feature udev gudev)
                  $(meson_feature seccomp sandboxed-image-validation)
                  $(meson_feature seccomp sandboxed-sound-validation)
                  -Dsandboxed-sound-validation=disabled
                  $(meson_feature systemd)
                  -Ddocumentation=disabled
                  -Ddatarootdir="${EPREFIX}/usr/share"
                  -Dman-pages=enabled
                  -Dinstalled-tests=false
                  -Dtests=disabled
              )
              meson_src_configure
            }

twm:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: x11-wm
    dir:
      url: 'https://xorg.freedesktop.org/archive/individual/{{ .Values.xorg_path }}'
      exclude: ".99"
      matcher: "{{ .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      license: MIT
      xorg_path: app/
      inherit:
        - autotools
        - flag-o-matic
      homepage: 'https://gitlab.freedesktop.org/xorg/lib/{{ .Values.pn }}'
      desc: X.Org Tab Window Manager
      rdepend: |
        x11-libs/libX11
        x11-libs/libXext
        {{ .Values.rdepend_extra | default "" }}
      depend: |
        ${RDEPEND}
        sys-devel/autoconf
        sys-devel/automake
        sys-devel/libtool
        sys-devel/m4
        x11-misc/util-macros
        media-fonts/font-util
        x11-base/xorg-proto
        {{ .Values.depend_extra | default "" }}
      bdepend: |
        virtual/pkgconfig
      body: |
        {{ .Values.body_extra | default "" }}
        src_prepare() {
          eautoreconf || die
          default
        }
        src_configure() {
          local no_static=""
          # Check if package supports disabling of static libraries
          if grep -q -s "able-static" ${ECONF_SOURCE:-.}/configure; then
            no_static="--disable-static"
          fi
          local econfargs=(
            --enable-shared
            ${no_static}
            {{ .Values.econf_args_extra | default "" }}
          )
          econf "${econfargs[@]}"
        }
        src_install() {
          default
          find "${D}" -type f -name '*.la' -delete || die
          {{ .Values.src_install_extra | default "" }}
        }

  packages:

    - twm:
        vars:
          depend_extra: |
            sys-devel/bison
          rdepend_extra: |
            x11-libs/libXt
            x11-libs/libXmu
            x11-libs/libICE
            x11-libs/libSM

