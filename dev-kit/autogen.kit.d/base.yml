grub:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-boot

  packages:
    - grub:
        dir:
          url: https://ftp.gnu.org/gnu/grub/
          matcher: "grub-.*.tar.xz$"
        transform:
          - kind: string
            match: "grub-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
            url: https://ftp.gnu.org/gnu/grub//{{ .Values.pn }}-{{ .Values.version }}.tar.xz

          - name: "unifont-{{ .Values.unifont_version }}.pcf.gz"
            url: https://ftp.gnu.org/gnu/unifont/unifont-{{ .Values.unifont_version }}/unifont-{{ .Values.unifont_version }}.pcf.gz
            use: fonts

          - name: "dejavu-sans-ttf-{{ .Values.dejavu_version }}.zip"
            url: https://download.sourceforge.net/dejavu/dejavu-sans-ttf-{{ .Values.dejavu_version }}.zip
            use: themes
        vars:
          homepage: https://www.gnu.org/software/grub/
          desc: GNU GRUB boot loader
          unifont_version: 15.0.06
          dejavu_version: "2.37"
          extra_envs:
            - 'QA_EXECSTACK="usr/bin/grub-emu* usr/lib/grub/*"'
            - 'QA_PRESTRIPPED="usr/lib/grub/.*"'
            - 'QA_MULTILIB_PATHS="usr/lib/grub/.*"'
            - 'QA_WX_LOAD="usr/lib/grub/*"'
            - 'WANT_LIBTOOL=none'
            - |
              GRUB_ALL_PLATFORMS=( coreboot efi-32 efi-64 emu ieee1275 loongson
                multiboot qemu qemu-mips pc uboot xen xen-32 xen-pvh )
          python_compat: python3+
          license: GPL-3+ BSD MIT fonts? ( GPL-2-with-font-exception ) themes? ( CC-BY-SA-3.0 BitstreamVera )
          slot: 2
          s: '${WORKDIR}/${P%_*}'
          patches:
            - grub-gfxpayload.patch
            - grub-2.02_beta2-KERNEL_GLOBS.patch
            - grub-2.06-test-words.patch
            - grub-2.06-binutils-2.36.patch
            - grub-ktype-macaroni.patch
          iuse: |
            device-mapper doc efiemu +fonts mount nls sdl +themes truetype libzfs
            grub_platforms_coreboot grub_platforms_efi-32 grub_platforms_efi-64
            grub_platforms_emu grub_platforms_ieee1275 grub_platforms_loongson
            grub_platforms_multiboot grub_platforms_qemu grub_platforms_qemu-mips
            grub_platforms_pc grub_platforms_uboot grub_platforms_xen grub_platforms_xen-32
            grub_platforms_xen-pvh

          inherit:
            - bash-completion-r1
            - flag-o-matic
            - multibuild
            - optfeature
            - toolchain-funcs
            - autotools
          required_use: |
            grub_platforms_coreboot? ( fonts )
            grub_platforms_qemu? ( fonts )
            grub_platforms_ieee1275? ( fonts )
            grub_platforms_loongson? ( fonts )
          bdepend: |
            ${PYTHON_DEPS}
            sys-devel/flex
            sys-devel/bison
            sys-apps/help2man
            sys-apps/texinfo
            fonts? (
              media-libs/freetype:2
              virtual/pkgconfig
            )
            themes? (
              app-arch/unzip
              media-libs/freetype:2
              virtual/pkgconfig
            )
            truetype? ( virtual/pkgconfig )
          cdepend: |
            app-arch/xz-utils
            sys-libs/ncurses:0=
            grub_platforms_emu? (
              sdl? ( media-libs/libsdl2 )
            )
            device-mapper? ( >=sys-fs/lvm2-2.02.45 )
            libzfs? ( sys-fs/zfs:= )
            mount? ( sys-fs/fuse:3 )
            truetype? ( media-libs/freetype:2= )
            ppc? ( >=sys-apps/ibm-powerpc-utils-1.3.5 )
            ppc64? ( >=sys-apps/ibm-powerpc-utils-1.3.5 )
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}
            kernel_linux? (
              grub_platforms_efi-32? ( sys-boot/efibootmgr )
              grub_platforms_efi-64? ( sys-boot/efibootmgr )
            )
            nls? ( sys-devel/gettext )
          body: |
            pkg_setup() {
              :
            }
            src_prepare() {
              default
              export PYTHON=true

              eautoreconf

              # Avoid error due to extra_deps.lst missing from source tarball:
              #       make[3]: *** No rule to make target 'grub-core/extra_deps.lst', needed by 'syminfo.lst'.  Stop.
              echo "depends bli part_gpt" > grub-core/extra_deps.lst || die
            }

            grub_do() {
              multibuild_foreach_variant run_in_build_dir "$@"
            }

            grub_do_once() {
              multibuild_for_best_variant run_in_build_dir "$@"
            }

            grub_configure() {
              local platform

              case ${MULTIBUILD_VARIANT} in
                efi*) platform=efi ;;
                xen-pvh) platform=xen_pvh ;;
                xen*) platform=xen ;;
                guessed) ;;
                *) platform=${MULTIBUILD_VARIANT} ;;
              esac

              case ${MULTIBUILD_VARIANT} in
                *-32)
                  if [[ ${CTARGET:-${CHOST}} == x86_64* ]]; then
                    local CTARGET=i386
                  fi ;;
                *-64)
                  if [[ ${CTARGET:-${CHOST}} == i?86* ]]; then
                    local CTARGET=x86_64
                    local -x TARGET_CFLAGS="-Os -march=x86-64 ${TARGET_CFLAGS}"
                    local -x TARGET_CPPFLAGS="-march=x86-64 ${TARGET_CPPFLAGS}"
                  fi ;;
              esac

              local myeconfargs=(
                --disable-werror
                --program-prefix=
                --libdir="${EPREFIX}"/usr/lib
                $(use_enable device-mapper)
                $(use_enable mount grub-mount)
                $(use_enable nls)
                $(use_enable themes grub-themes)
                $(use_enable truetype grub-mkfont)
                $(use_enable libzfs)
                --enable-grub-emu-sdl=no
                $(use_enable sdl grub-emu-sdl2)
                ${platform:+--with-platform=}${platform}

                # Let configure detect this where supported
                $(usex efiemu '' '--disable-efiemu')
              )

              local UNIFONT="unifont-{{ .Values.unifont_version }}"
              local DEJAVU="dejavu-sans-ttf-{{ .Values.dejavu_version }}"

              if use fonts; then
                ln -rs "${WORKDIR}/${UNIFONT}.pcf" unifont.pcf || die
              fi

              if use themes; then
                ln -rs "${WORKDIR}/${DEJAVU}/ttf/DejaVuSans.ttf" DejaVuSans.ttf || die
              fi

              local ECONF_SOURCE="${S}"
              econf "${myeconfargs[@]}"
            }

            src_configure() {
              # Bug 508758.
              replace-flags -O3 -O2

              # Workaround for bug 829165.
              filter-ldflags -pie

              # We don't want to leak flags onto boot code.
              export HOST_CCASFLAGS=${CCASFLAGS}
              export HOST_CFLAGS=${CFLAGS}
              export HOST_CPPFLAGS=${CPPFLAGS}
              export HOST_LDFLAGS=${LDFLAGS}
              unset CCASFLAGS CFLAGS CPPFLAGS LDFLAGS

              tc-ld-disable-gold #439082 #466536 #526348
              export TARGET_LDFLAGS="${TARGET_LDFLAGS} ${LDFLAGS}"
              unset LDFLAGS

              tc-export CC NM OBJCOPY RANLIB STRIP
              tc-export BUILD_CC BUILD_PKG_CONFIG

              # Force configure to use flex & bison; Gentoo bug 887211.
              export LEX=flex
              unset YACC

              MULTIBUILD_VARIANTS=()
              local p
              for p in "${GRUB_ALL_PLATFORMS[@]}"; do
                use "grub_platforms_${p}" && MULTIBUILD_VARIANTS+=( "${p}" )
              done
              [[ ${#MULTIBUILD_VARIANTS[@]} -eq 0 ]] && MULTIBUILD_VARIANTS=( guessed )
              grub_do grub_configure
            }

            src_compile() {
              # Sandbox bug 404013.
              use libzfs && { addpredict /etc/dfs; addpredict /dev/zfs; }

              grub_do emake
              use doc && grub_do_once emake -C docs html
            }

            src_install() {
              grub_do emake install DESTDIR="${D}" bashcompletiondir="$(get_bashcompdir)"
              use doc && grub_do_once emake -C docs install-html DESTDIR="${D}"

              einstalldocs

              insinto /etc/default
              newins "${FILESDIR}"/grub.default-4 grub

              # https://bugs.gentoo.org/231935
              dostrip -x /usr/lib/grub
            }

            pkg_postinst() {
              elog "For information on how to configure GRUB2 please refer to the guide:"
              elog "    https://wiki.gentoo.org/wiki/GRUB2_Quick_Start"

              if has_version 'sys-boot/grub:0'; then
                elog "A migration guide for GRUB Legacy users is available:"
                elog "    https://wiki.gentoo.org/wiki/GRUB2_Migration"
              fi

              if [[ -z ${REPLACING_VERSIONS} ]]; then
                elog
                optfeature "detecting other operating systems (grub-mkconfig)" sys-boot/os-prober
                optfeature "creating rescue media (grub-mkrescue)" dev-libs/libisoburn
                optfeature "enabling RAID device detection" sys-fs/mdadm
              fi

              if has_version sys-boot/os-prober; then
                ewarn "Due to security concerns, os-prober is disabled by default."
                ewarn "Set GRUB_DISABLE_OS_PROBER=false in /etc/default/grub to enable it."
              fi
            }




linear_packages:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-libs


  packages:
    - nss:
        dir:
          url: https://ftp.mozilla.org/pub/security/nss/releases/
          matcher: 'NSS_.*'
        transform:
          - kind: string
            match: "NSS_"
            replace: ""
          - kind: string
            match: "_RTM"
            replace: ""
          - kind: string
            match: "_"
            replace: "."
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
            url: 'https://ftp.mozilla.org/pub/security/nss/releases/{{ .Values.original_version }}/src/{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
        vars:
          desc: Mozilla's Network Security Services library that implements PKI support
          homepage: https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSS
          inherit:
            - flag-o-matic
            - toolchain-funcs
          license: '|| ( MPL-2.0 GPL-2 LGPL-2.1 )'
          iuse: +utils
          rdepend: |
            app-admin/whip
            sys-apps/whip-catalog
            dev-libs/nspr
            dev-db/sqlite
            sys-libs/zlib
            virtual/pkgconfig
          depend: '${RDEPEND}'
          s: '${WORKDIR}/${P}/${PN}'
          extra_envs:
            - 'NSS_CHK_SIGN_LIBS="freebl3 nssdbm3 softokn3"'
          body: |
            nssarch() {
              local t=${1:-${CHOST}}
              case ${t} in
                aarch64*) echo "aarch64" ;;
                x86_64*)  echo "x86_64" ;;
                i?86*)    echo "i686" ;;
                *86*-pc-solaris2*) echo "i86pc" ;;
                hppa*)    echo "parisc" ;;
                *)        tc-arch ${t} ;;
              esac
            }
            src_prepare() {
              default

              sed -e "/print('-Werror')/d" -i -e "s|'-Werror',||g" \
                coreconf/werror.py
              sed -i -e 's|gtests$||g' manifest.mn

              pushd coreconf >/dev/null || die
              # hack nspr paths
              echo 'INCLUDES += -I$(DIST)/include/dbm' \
                >> headers.mk || die "failed to append include"

              # modify install path
              sed -e '/CORE_DEPTH/s:SOURCE_PREFIX.*$:SOURCE_PREFIX = $(CORE_DEPTH)/dist:' \
                -i source.mk || die

              # Respect LDFLAGS
              sed -i -e 's/\$(MKSHLIB) -o/\$(MKSHLIB) \$(LDFLAGS) -o/g' rules.mk
              popd >/dev/null || die

              # dirty hack
              sed -i -e "/CRYPTOLIB/s:\$(SOFTOKEN_LIB_DIR):../freebl/\$(OBJDIR):" \
                lib/ssl/config.mk || die
              sed -i -e "/CRYPTOLIB/s:\$(SOFTOKEN_LIB_DIR):../../lib/freebl/\$(OBJDIR):" \
                cmd/platlibs.mk || die

              strip-flags
            }
            src_compile() {
              # Take care of nspr settings #436216
              local myCPPFLAGS="${CPPFLAGS} $($(tc-getPKG_CONFIG) nspr --cflags)"
              unset NSPR_INCLUDE_DIR

              export NSS_ALLOW_SSLKEYLOGFILE=1
              export NSS_ENABLE_WERROR=0 #567158
              export BUILD_OPT=1
              export NSS_USE_SYSTEM_SQLITE=1
              export NSDISTMODE=copy
              export FREEBL_NO_DEPEND=1
              export FREEBL_LOWHASH=1
              export NSS_SEED_ONLY_DEV_URANDOM=1
              export USE_SYSTEM_ZLIB=1
              export ZLIB_LIBS=-lz
              export ASFLAGS=""
              # Fix build failure on arm64
              export NS_USE_GCC=1
              # Detect compiler type and set proper environment value
              if tc-is-gcc; then
                  export CC_IS_GCC=1
              elif tc-is-clang; then
                  export CC_IS_CLANG=1
              fi

              local d
              local ostest="$(nssarch)"
              if use arm ; then
                ostest=$(tc-arch ${CHOST})
                export USE_N32=1
              else
                export USE_64=1
              fi

              # Build the host tools first.
              NSPR_LIB_DIR="${T}/fakedir" \
              emake -j1 -C coreconf
              makeargs+=( NSINSTALL="${PWD}/$(find -type f -name nsinstall)" )

              # Then build the target tools.
              for d in . lib/dbm ; do
                CPPFLAGS="${myCPPFLAGS}" \
                XCFLAGS="${CFLAGS} ${CPPFLAGS}" \
                NSPR_LIB_DIR="${T}/fakedir" \
                emake -j1 "${makeargs[@]}" -C ${d} OS_TEST="${ostest}"
              done
            }
            src_install() {
              local nss_vmajor=$(awk '/#define.*NSS_VMAJOR/ {print $3}' lib/nss/nss.h)
              local nss_vminor=$(awk '/#define.*NSS_VMINOR/ {print $3}' lib/nss/nss.h)
              local nss_vpatch=$(awk '/#define.*NSS_VPATCH/ {print $3}' lib/nss/nss.h)
              local nspr_version="$(pkg-config --modversion nspr)"

              pushd dist >/dev/null || die

              dodir /usr/$(get_libdir)
              cp -L */lib/*$(get_libname) "${ED}"/usr/$(get_libdir) || die "copying shared libs failed"
              local i
              for i in freebl nssb nssckfw ; do
                cp -L */lib/lib${i}.a "${ED}"/usr/$(get_libdir) || die "copying libs failed"
              done

              # Install nss-config and pkgconfig file
              #
              # pkgconfig files
              dodir /usr/$(get_libdir)/pkgconfig
              local _pc; for _pc in nss.pc nss-util.pc nss-softokn.pc; do
                sed "${FILESDIR}"/$_pc.in \
                  -e "s,%libdir%,/usr/$(get_libdir),g" \
                  -e "s,%prefix%,/usr,g" \
                  -e "s,%exec_prefix%,/usr/bin,g" \
                  -e "s,%includedir%,/usr/include/nss,g" \
                  -e "s,%SOFTOKEN_VERSION%,${PV},g" \
                  -e "s,%NSPR_VERSION%,$nspr_version,g" \
                  -e "s,%NSS_VERSION%,${PV}r,g" \
                  -e "s,%NSSUTIL_VERSION%,${PV},g" \
                  > "${ED}"/usr/$(get_libdir)/pkgconfig/$_pc
              done
              dosym /usr/$(get_libdir)/pkgconfig/nss.pc /usr/$(get_libdir)/pkgconfig/mozilla-nss.pc

              # nss-config
              dodir /usr/bin
              sed "${FILESDIR}"/nss-config.in \
                -e "s,@libdir@,/usr/$(get_libdir),g" \
                -e "s,@prefix@,/usr/bin,g" \
                -e "s,@exec_prefix@,/usr/bin,g" \
                -e "s,@includedir@,/usr/include/nss,g" \
                -e "s,@MOD_MAJOR_VERSION@,${nss_vmajor},g" \
                -e "s,@MOD_MINOR_VERSION@,${nss_vminor},g" \
                -e "s,@MOD_PATCH_VERSION@,${nss_vpatch},g" \
                > "${ED}"/usr/bin/nss-config
              chmod 755 "${ED}"/usr/bin/nss-config

              # all the include files
              insinto /usr/include/nss
              doins public/nss/*.{h,api}
              insinto /usr/include/nss/private
              doins private/nss/{blapi,alghmac,cmac}.h

              popd >/dev/null || die

              local f nssutils
              # Always enabled because we need it for chk generation.
              nssutils=( shlibsign )

              if use utils; then
                nssutils+=(
                  addbuiltin
                  atob
                  baddbdir
                  btoa
                  certutil
                  cmsutil
                  crlutil
                  derdump
                  digest
                  makepqg
                  mangle
                  modutil
                  multinit
                  nonspr10
                  ocspclnt
                  oidcalc
                  p7content
                  p7env
                  p7sign
                  p7verify
                  pk11mode
                  pk12util
                  pp
                  rsaperf
                  selfserv
                  signtool
                  signver
                  ssltap
                  strsclnt
                  symkeyutil
                  tstclnt
                  vfychain
                  vfyserv
                )
                # install man-pages for utils (bug #516810)
                doman doc/nroff/*.1
              fi
              pushd dist/*/bin >/dev/null || die
              for f in ${nssutils[@]}; do
                dobin ${f}
              done
              popd >/dev/null || die

              # Prelink breaks the CHK files. We don't have any reliable way to run
              # shlibsign after prelink.
              dodir /etc/prelink.conf.d
              printf -- "-b ${EPREFIX}/usr/$(get_libdir)/lib%s.so\n" ${NSS_CHK_SIGN_LIBS} \
                > "${ED}"/etc/prelink.conf.d/nss.conf
            }
            pkg_postinst() {
              LIBS="/usr/$(get_libdir)" whip h nss.postinst || die "Failed to run whip h nss.postinst"
            }
            pkg_postrm() {
              LIBS="/usr/$(get_libdir)" whip h nss.postrm || die "Failed to run whip h nss.postrm"
            }


    - liblinear:
        vars:
          license: BSD
          desc: A Library for Large Linear Classification
          homepage: https://www.csie.ntu.edu.tw/~cjlin/liblinear/ https://github.com/cjlin1/liblinear
          iuse: blas
          rdepend: |
            blas? ( virtual/blas )
          depend: |
            ${RDEPEND}
            blas? ( virtual/pkgconfig )
          inherit:
            - toolchain-funcs
          body: |
            src_prepare() {
              default
              sed -i \
                -e '/^CFLAGS/d;/^CXXFLAGS/d' \
                blas/Makefile || die
              sed -i \
                -e 's|make|$(MAKE)|g' \
                -e '/$(LIBS)/s|$(CFLAGS)|& $(LDFLAGS)|g' \
                -e '/^CFLAGS/d;/^CXXFLAGS/d' \
                -e 's|$(SHARED_LIB_FLAG)|& $(LDFLAGS)|g' \
                Makefile || die
            }
            src_compile() {
              emake \
                CC="$(tc-getCC)" \
                CXX="$(tc-getCXX)" \
                CFLAGS="${CFLAGS} -fPIC" \
                CXXFLAGS="${CXXFLAGS} -fPIC" \
                AR="$(tc-getAR)" \
                RANLIB="$(tc-getRANLIB)" \
                lib all
            }
            src_install() {
              dolib.so {{ .Values.pn }}.so.*
              dosym {{ .Values.pn }}.so.* /usr/$(get_libdir)/{{ .Values.pn }}$(get_libname)
              newbin predict {{ .Values.pn }}-predict
              newbin train {{ .Values.pn }}-train
              doheader linear.h
              dodoc README
            }

        dir:
          #https://www.csie.ntu.edu.tw/~cjlin/liblinear/liblinear-2.48.tar.gz
          url: https://www.csie.ntu.edu.tw/~cjlin/liblinear/
          matcher: "liblinear-.*.tar.gz$"
        transform:
          - kind: string
            match: "liblinear-"
            replace: ""
          - kind: string
            match: ".tar.gz"
            replace: ""



dev_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-util
    github:
      query: releases

  extensions_defs:
    golang:
      opts:

    rust:
      opts:

  packages:

    - dqlite:
        template: ../../templates/simple-github.tmpl
        category: dev-libs
        github:
          user: canonical
        # LXD uses 1.18
        selector:
          - '<1.19'

        vars:
          desc: Embeddable, replicated and fault tolerant SQL engine
          inherit:
            - autotools
          license: LGPL-3-with-linking-exception
          iuse: +lz4
          rdepend: |
            dev-db/sqlite:3
            dev-libs/libuv:=
            lz4? ( app-arch/lz4:= )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
          body: |
            src_prepare() {
              default
              sed -i -e '/Werror \\/d' -e 's|-Werror||g' configure.ac
              eautoreconf
            }
            src_configure() {
                local myeconfargs=(
                    --disable-backtrace
                    --disable-debug
                    --disable-sanitize
                    --disable-static
                    # Linking to a separately-built libraft is no longer supported.
                    --enable-build-raft=yes
                    # Will build a bundled libsqlite3.so.
                    --enable-build-sqlite=no
                    $(use_with lz4)
                )
                econf "${myeconfargs[@]}"
            }
            src_install() {
                default
                find "${ED}" -name '*.la' -delete || die
            }

    - go-licenses:
        github:
          user: google
        template: ../../templates/simple-github.tmpl
        extensions:
          - golang
        vars:
          inherit:
            - go-module
          docs:
            - README.md
          body: |
            src_compile() {
              go build -x -v -o {{ .Values.pn }} main.go
            }
            src_install() {
              dobin {{ .Values.pn }}
              einstalldocs
            }

    - scc:
        github:
          user: boyter
        template: ../../templates/simple-github.tmpl
        vars:
          inherit:
            - go-module
          bdepend: dev-lang/go
          docs:
            - README.md
            - CONTRIBUTING.md
          body: |
            src_compile() {
              go build -x -v -mod=vendor -o {{ .Values.pn }} main.go
            }
            src_install() {
              dobin {{ .Values.pn }}
              einstalldocs
            }

    - pnpm-bin:
        github:
          user: pnpm
          repo: pnpm
        category: dev-util
        transform:
          - kind: string
            match: 'pnpm '
            replace: ''
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-amd64-linux'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-linuxstatic-x64'
            use: amd64
          - name: '{{ .Values.pn }}-{{ .Values.version }}-arm64-linux'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-linuxstatic-arm64'
            use: arm64
        vars:
          iuse: amd64 arm64
          desc: Fast, disk space efficient package manager (upstream binary)
          extra_envs:
            - 'QA_PREBUILT="/usr/bin/pnpm"'
          body: |
            src_unpack() {
              mkdir -p "${S}"
            }
            src_configure() { :; }
            src_compile() { :; }
            src_install() {
              if use amd64 ; then
                newbin "${DISTDIR}"/{{ .Values.pn }}-{{ .Values.version }}-amd64-linux pnpm
              fi
              if use arm64 ; then
                newbin "${DISTDIR}"/{{ .Values.pn }}-{{ .Values.version }}-arm64-linux pnpm
              fi
            }

    - libbpf:
        category: dev-libs
        transform:
          - kind: string
            match: '{{ .Values.pn }} '
            replace: ''
          - kind: string
            match: 'v'
            replace: ''
        vars:
          desc: Stand-alone build of libbpf from the Linux kernel
          license: GPL-2 LGPL-2.1 BSD-2
          inherit:
            - flag-o-matic
            - toolchain-funcs
          s: '${WORKDIR}/{{ .Values.pn }}-{{ .Values.version }}/src'
          iuse: +static-libs
          slot: '0/0.3'
          rdepend: |
            virtual/libelf
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
          bdepend: |
            virtual/pkgconfig
