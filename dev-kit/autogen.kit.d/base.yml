grub:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-boot

  packages:
    - grub:
        dir:
          url: https://ftp.gnu.org/gnu/grub/
          matcher: "grub-.*.tar.xz$"
        transform:
          - kind: string
            match: "grub-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
            url: https://ftp.gnu.org/gnu/grub//{{ .Values.pn }}-{{ .Values.version }}.tar.xz

          - name: "unifont-{{ .Values.unifont_version }}.pcf.gz"
            url: https://ftp.gnu.org/gnu/unifont/unifont-{{ .Values.unifont_version }}/unifont-{{ .Values.unifont_version }}.pcf.gz
            use: fonts

          - name: "dejavu-sans-ttf-{{ .Values.dejavu_version }}.zip"
            url: https://download.sourceforge.net/dejavu/dejavu-sans-ttf-{{ .Values.dejavu_version }}.zip
            use: themes
        vars:
          homepage: https://www.gnu.org/software/grub/
          desc: GNU GRUB boot loader
          unifont_version: 15.0.06
          dejavu_version: "2.37"
          extra_envs:
            - 'QA_EXECSTACK="usr/bin/grub-emu* usr/lib/grub/*"'
            - 'QA_PRESTRIPPED="usr/lib/grub/.*"'
            - 'QA_MULTILIB_PATHS="usr/lib/grub/.*"'
            - 'QA_WX_LOAD="usr/lib/grub/*"'
            - 'WANT_LIBTOOL=none'
            - |
              GRUB_ALL_PLATFORMS=( coreboot efi-32 efi-64 emu ieee1275 loongson
                multiboot qemu qemu-mips pc uboot xen xen-32 xen-pvh )
          python_compat: python3+
          license: GPL-3+ BSD MIT fonts? ( GPL-2-with-font-exception ) themes? ( CC-BY-SA-3.0 BitstreamVera )
          slot: 2
          s: '${WORKDIR}/${P%_*}'
          patches:
            - grub-gfxpayload.patch
            - grub-2.02_beta2-KERNEL_GLOBS.patch
            - grub-2.06-test-words.patch
            - grub-2.06-binutils-2.36.patch
            - grub-ktype-macaroni.patch
          iuse: |
            device-mapper doc efiemu +fonts mount nls sdl +themes truetype libzfs
            grub_platforms_coreboot grub_platforms_efi-32 grub_platforms_efi-64
            grub_platforms_emu grub_platforms_ieee1275 grub_platforms_loongson
            grub_platforms_multiboot grub_platforms_qemu grub_platforms_qemu-mips
            grub_platforms_pc grub_platforms_uboot grub_platforms_xen grub_platforms_xen-32
            grub_platforms_xen-pvh

          inherit:
            - bash-completion-r1
            - flag-o-matic
            - multibuild
            - optfeature
            - toolchain-funcs
            - autotools
          required_use: |
            grub_platforms_coreboot? ( fonts )
            grub_platforms_qemu? ( fonts )
            grub_platforms_ieee1275? ( fonts )
            grub_platforms_loongson? ( fonts )
          bdepend: |
            ${PYTHON_DEPS}
            sys-devel/flex
            sys-devel/bison
            sys-apps/help2man
            sys-apps/texinfo
            fonts? (
              media-libs/freetype:2
              virtual/pkgconfig
            )
            themes? (
              app-arch/unzip
              media-libs/freetype:2
              virtual/pkgconfig
            )
            truetype? ( virtual/pkgconfig )
          cdepend: |
            app-arch/xz-utils
            sys-libs/ncurses:0=
            grub_platforms_emu? (
              sdl? ( media-libs/libsdl2 )
            )
            device-mapper? ( >=sys-fs/lvm2-2.02.45 )
            libzfs? ( sys-fs/zfs:= )
            mount? ( sys-fs/fuse:3 )
            truetype? ( media-libs/freetype:2= )
            ppc? ( >=sys-apps/ibm-powerpc-utils-1.3.5 )
            ppc64? ( >=sys-apps/ibm-powerpc-utils-1.3.5 )
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}
            kernel_linux? (
              grub_platforms_efi-32? ( sys-boot/efibootmgr )
              grub_platforms_efi-64? ( sys-boot/efibootmgr )
            )
            nls? ( sys-devel/gettext )
          body: |
            pkg_setup() {
              :
            }
            src_prepare() {
              default
              export PYTHON=true

              eautoreconf

              # Avoid error due to extra_deps.lst missing from source tarball:
              #       make[3]: *** No rule to make target 'grub-core/extra_deps.lst', needed by 'syminfo.lst'.  Stop.
              echo "depends bli part_gpt" > grub-core/extra_deps.lst || die
            }

            grub_do() {
              multibuild_foreach_variant run_in_build_dir "$@"
            }

            grub_do_once() {
              multibuild_for_best_variant run_in_build_dir "$@"
            }

            grub_configure() {
              local platform

              case ${MULTIBUILD_VARIANT} in
                efi*) platform=efi ;;
                xen-pvh) platform=xen_pvh ;;
                xen*) platform=xen ;;
                guessed) ;;
                *) platform=${MULTIBUILD_VARIANT} ;;
              esac

              case ${MULTIBUILD_VARIANT} in
                *-32)
                  if [[ ${CTARGET:-${CHOST}} == x86_64* ]]; then
                    local CTARGET=i386
                  fi ;;
                *-64)
                  if [[ ${CTARGET:-${CHOST}} == i?86* ]]; then
                    local CTARGET=x86_64
                    local -x TARGET_CFLAGS="-Os -march=x86-64 ${TARGET_CFLAGS}"
                    local -x TARGET_CPPFLAGS="-march=x86-64 ${TARGET_CPPFLAGS}"
                  fi ;;
              esac

              local myeconfargs=(
                --disable-werror
                --program-prefix=
                --libdir="${EPREFIX}"/usr/lib
                $(use_enable device-mapper)
                $(use_enable mount grub-mount)
                $(use_enable nls)
                $(use_enable themes grub-themes)
                $(use_enable truetype grub-mkfont)
                $(use_enable libzfs)
                --enable-grub-emu-sdl=no
                $(use_enable sdl grub-emu-sdl2)
                ${platform:+--with-platform=}${platform}

                # Let configure detect this where supported
                $(usex efiemu '' '--disable-efiemu')
              )

              if use fonts; then
                ln -rs "${WORKDIR}/${UNIFONT}.pcf" unifont.pcf || die
              fi

              if use themes; then
                ln -rs "${WORKDIR}/${DEJAVU}/ttf/DejaVuSans.ttf" DejaVuSans.ttf || die
              fi

              local ECONF_SOURCE="${S}"
              econf "${myeconfargs[@]}"
            }

            src_configure() {
              # Bug 508758.
              replace-flags -O3 -O2

              # Workaround for bug 829165.
              filter-ldflags -pie

              # We don't want to leak flags onto boot code.
              export HOST_CCASFLAGS=${CCASFLAGS}
              export HOST_CFLAGS=${CFLAGS}
              export HOST_CPPFLAGS=${CPPFLAGS}
              export HOST_LDFLAGS=${LDFLAGS}
              unset CCASFLAGS CFLAGS CPPFLAGS LDFLAGS

              tc-ld-disable-gold #439082 #466536 #526348
              export TARGET_LDFLAGS="${TARGET_LDFLAGS} ${LDFLAGS}"
              unset LDFLAGS

              tc-export CC NM OBJCOPY RANLIB STRIP
              tc-export BUILD_CC BUILD_PKG_CONFIG

              # Force configure to use flex & bison; Gentoo bug 887211.
              export LEX=flex
              unset YACC

              MULTIBUILD_VARIANTS=()
              local p
              for p in "${GRUB_ALL_PLATFORMS[@]}"; do
                use "grub_platforms_${p}" && MULTIBUILD_VARIANTS+=( "${p}" )
              done
              [[ ${#MULTIBUILD_VARIANTS[@]} -eq 0 ]] && MULTIBUILD_VARIANTS=( guessed )
              grub_do grub_configure
            }

            src_compile() {
              # Sandbox bug 404013.
              use libzfs && { addpredict /etc/dfs; addpredict /dev/zfs; }

              grub_do emake
              use doc && grub_do_once emake -C docs html
            }

            src_install() {
              grub_do emake install DESTDIR="${D}" bashcompletiondir="$(get_bashcompdir)"
              use doc && grub_do_once emake -C docs install-html DESTDIR="${D}"

              einstalldocs

              insinto /etc/default
              newins "${FILESDIR}"/grub.default-4 grub

              # https://bugs.gentoo.org/231935
              dostrip -x /usr/lib/grub
            }

            pkg_postinst() {
              elog "For information on how to configure GRUB2 please refer to the guide:"
              elog "    https://wiki.gentoo.org/wiki/GRUB2_Quick_Start"

              if has_version 'sys-boot/grub:0'; then
                elog "A migration guide for GRUB Legacy users is available:"
                elog "    https://wiki.gentoo.org/wiki/GRUB2_Migration"
              fi

              if [[ -z ${REPLACING_VERSIONS} ]]; then
                elog
                optfeature "detecting other operating systems (grub-mkconfig)" sys-boot/os-prober
                optfeature "creating rescue media (grub-mkrescue)" dev-libs/libisoburn
                optfeature "enabling RAID device detection" sys-fs/mdadm
              fi

              if has_version sys-boot/os-prober; then
                ewarn "Due to security concerns, os-prober is disabled by default."
                ewarn "Set GRUB_DISABLE_OS_PROBER=false in /etc/default/grub to enable it."
              fi
            }




linear_packages:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-libs


  packages:

    - liblinear:
        vars:
          license: BSD
          desc: A Library for Large Linear Classification
          homepage: https://www.csie.ntu.edu.tw/~cjlin/liblinear/ https://github.com/cjlin1/liblinear
          iuse: blas
          rdepend: |
            blas? ( virtual/blas )
          depend: |
            ${RDEPEND}
            blas? ( virtual/pkgconfig )
          inherit:
            - toolchain-funcs
          body: |
            src_prepare() {
              default
              sed -i \
                -e '/^CFLAGS/d;/^CXXFLAGS/d' \
                blas/Makefile || die
              sed -i \
                -e 's|make|$(MAKE)|g' \
                -e '/$(LIBS)/s|$(CFLAGS)|& $(LDFLAGS)|g' \
                -e '/^CFLAGS/d;/^CXXFLAGS/d' \
                -e 's|$(SHARED_LIB_FLAG)|& $(LDFLAGS)|g' \
                Makefile || die
            }
            src_compile() {
              emake \
                CC="$(tc-getCC)" \
                CXX="$(tc-getCXX)" \
                CFLAGS="${CFLAGS} -fPIC" \
                CXXFLAGS="${CXXFLAGS} -fPIC" \
                AR="$(tc-getAR)" \
                RANLIB="$(tc-getRANLIB)" \
                lib all
            }
            src_install() {
              dolib.so {{ .Values.pn }}.so.*
              dosym {{ .Values.pn }}.so.* /usr/$(get_libdir)/{{ .Values.pn }}$(get_libname)
              newbin predict {{ .Values.pn }}-predict
              newbin train {{ .Values.pn }}-train
              doheader linear.h
              dodoc README
            }

        dir:
          #https://www.csie.ntu.edu.tw/~cjlin/liblinear/liblinear-2.48.tar.gz
          url: https://www.csie.ntu.edu.tw/~cjlin/liblinear/
          matcher: "liblinear-.*.tar.gz$"
        transform:
          - kind: string
            match: "liblinear-"
            replace: ""
          - kind: string
            match: ".tar.gz"
            replace: ""


dev_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    github:
      query: releases
  packages:

    - jq-bin:
        category: app-misc
        github:
          user: jqlang
          repo: jq
        transform:
          - kind: string
            match: "jq "
            replace: ""
        vars:
          iuse: amd64 arm arm64
          homepage: https://stedolan.github.io/jq/
          desc: A lightweight and flexible command-line JSON processor
          extra_envs:
            - QA_PREBUILT="/usr/bin/jq"
          rdepend: |
            !app-misc/jq
          depend: ${RDEPEND}
          s: ${WORKDIR}

          body: |
            src_prepare() {
              if use amd64; then
                cp "${DISTDIR}"/${P}-linux-amd64 jq || die
              elif use arm64; then
                cp "${DISTDIR}"/${P}-linux-arm64 jq || die
              else
                cp "${DISTDIR}"/${P}-linux-armhf jq || die
              fi
              eapply_user
            }
            src_install() {
              dobin "${WORKDIR}"/jq
            }
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-amd64'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-linux-amd64$'
            use: amd64

          # For ARM (add support for armv7 with HF
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-armhf'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-linux-armhf$'
            use: arm

          # For ARM (add support for armv7 with HF
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm64'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-linux-arm64$'
            use: arm64

    - etcher-bin:
        category: sys-boot
        github:
          user: balena-io
          repo: etcher
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
            matcher: 'balena-{{ .Values.pn | replace "-bin" "" }}_{{ .Values.version }}_amd64.deb$'
        vars:
          inherit:
            - desktop
            - eutils
            - electron
            - unpacker
            - pax-utils
            - xdg
          desc: Flash OS images to SD cards & USB drives, safely and easily.
          homepage: https://etcher.io/
          license: GPL-2
          cdepend: |
            media-libs/libpng
            x11-libs/gtk+
            x11-libs/cairo
            x11-libs/libXtst
            sys-apps/lsb-release
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}
            x11-libs/libnotify
            x11-libs/libXScrnSaver
            dev-libs/nss
          body: |
            src_unpack() {
              # etcher does not use a containing folder(deb archive)
              # manual intervention required
              install -d "${WORKDIR}/${P}"
              S="${WORKDIR}/${P}"
              cd "${S}" || die "cd into target directory ${S} failed"
              unpack_deb "${A}"
            }
            src_install() {
              local instdir="/opt/balenaEtcher"
              local balenabin="balena-{{ .Values.pn | replace "-bin" "" }}"
              insinto ${instdir}
              doins -r *
              dosym "${instdir}/${balenabin}" "/usr/bin/{{ .Values.pn | replace "-bin" "" }}" || die
              make_wrapper "{{ .Values.pn | replace "-bin" "" }}" "${instdir}/${balenabin}" || die
              # only contains changelog"
              rm -rf "${D}/usr/share/doc" || die
              # use own desktop file
              rm -fR "${D}/usr/share/applications" || die
              domenu "${FILESDIR}/{{ .Values.pn | replace "-bin" "" }}.desktop" || die
              # correct permissions of install components
              fperms a+x "${instdir}/usr/bin/${balenabin}" || die
              pax-mark m "${instdir}/usr/bin/${balenabin}" || die
            }
            pkg_postinst() {
              xdg_pkg_postinst
            }
            pkg_postrm() {
              xdg_pkg_postrm
            }

    - yq3-bin:
        category: app-misc
        github:
          user: mikefarah
          repo: yq
          num_pages: 15
        selector:
          - '<4.0'
        transform:
          - kind: regex
            match: " - .*$"
            replace: ""

        vars:
          iuse: amd64 arm arm64
          homepage: https://github.com/mikefarah/yq/
          desc: Portable command-line YAML, JSON, XML, CSV, TOML and properties processor
          extra_envs:
            - QA_PREBUILT="/usr/bin/yq"
          s: ${WORKDIR}

          body: |
            src_prepare() {
              if use amd64; then
                cp "${DISTDIR}"/{{ .Values.pn }}-{{ .Values.version }}-linux-amd64 yq || die
              elif use arm64; then
                cp "${DISTDIR}"/{{ .Values.pn }}-{{ .Values.version }}-linux-arm64 yq || die
              else
                cp "${DISTDIR}"/{{ .Values.pn }}-{{ .Values.version }}-linux-arm yq || die
              fi
              eapply_user
            }
            src_install() {
              dobin yq
            }
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-amd64'
            matcher: 'yq_linux_amd64$'
            use: amd64

          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm'
            matcher: 'yq_linux_arm$'
            use: arm

          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm64'
            matcher: 'yq_linux_arm64$'
            use: arm64

    - yq4-bin:
        category: app-misc
        github:
          user: mikefarah
          repo: yq
        selector:
          - '<5.0'
        transform:
          - kind: regex
            match: " - .*$"
            replace: ""
        vars:
          iuse: amd64 arm arm64
          homepage: https://github.com/mikefarah/yq/
          desc: Portable command-line YAML, JSON, XML, CSV, TOML and properties processor
          extra_envs:
            - QA_PREBUILT="/usr/bin/yq4"
          rdepend: |
            !app-misc/yq-go
          depend: ${RDEPEND}
          s: ${WORKDIR}
          body: |
            src_prepare() {
              default
              if use amd64; then
                mv {{ .Values.pn | replace "4-bin" "" }}_linux_amd64 yq4 || die
              elif use arm64; then
                mv {{ .Values.pn | replace "4-bin" "" }}_linux_arm64 yq4 || die
              else
                cp {{ .Values.pn | replace "4-bin" "" }}_linux_arm yq4 || die
              fi
              eapply_user
            }
            src_install() {
              dobin yq4
            }
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-amd64.tar.gz'
            matcher: 'yq_linux_amd64.tar.gz$'
            use: amd64

          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm.tar.gz'
            matcher: 'yq_linux_arm.tar.gz$'
            use: arm

          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm64.tar.gz'
            matcher: 'yq_linux_arm64.tar.gz$'
            use: arm64

