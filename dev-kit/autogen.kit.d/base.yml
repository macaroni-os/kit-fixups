gn:
  generator: builtin-noop
  defaults:
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}.tar.gz'
        url: 'https://gn.googlesource.com/gn/%2Barchive/{{ .Values.sha }}.tar.gz'
    files_dir: "{{ .Values.pn }}"
    category: dev-util
    template: ../../templates/simple.tmpl
    vars:
      versions:
        - '0.2341'
      #sha: 129ce6b9af1a93143acd8f8dea6fb8c6cb65abc9
      sha: d8c2f07d653520568da7cace755a87dad241b72d
      homepage: https://gn.googlesource.com/
      desc: GN is a meta-build system that generates build files for Ninja
      python_compat: python3+
      license: BSD
      bdepend: |
        ${PYTHON_DEPS}
        dev-util/ninja
      inherit:
        - ninja-utils
        - python-any-r1
        - toolchain-funcs
      body: |
        src_unpack() {
          mkdir "${S}"
          cd "${S}"
          unpack "${A}"
        }
        pkg_setup() {
          :
        }
        src_configure() {
          mkdir out/
          cp "${FILESDIR}"/last_commit_position.h out/
          sed -i \
            -e 's|PV|{{ .Values.version }}|g' \
            -e 's|SHA|macaroni-{{ substr 0 7 .Values.sha }}|g' \
            out/last_commit_position.h
          python_setup
          tc-export AR CC CXX
          unset CFLAGS
          set -- ${EPYTHON} build/gen.py --no-last-commit-position --no-strip --no-static-libstdc++ --allow-warnings
          echo "$@" >&2
          "$@" || die
        }
        src_compile() {
          eninja -C out gn
        }
        src_install() {
          dobin out/gn
          einstalldocs
          insinto /usr/share/vim/vimfiles
          doins -r misc/vim/{autoload,ftdetect,ftplugin,syntax}
        }

  packages:
    - gn:


man_pages:
  generator: builtin-dirlisting

  defaults:
    category: sys-apps
    files_dir: '{{ .Values.pn }}'
    template: ../../templates/simple.tmpl
    dir:
      url: https://www.kernel.org/pub/linux/docs/man-pages/
      matcher: '{{ .Values.pn }}-.*.tar.xz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      extra_envs:
        - |
          IUSE_L10N=" de es fr it ja nl pl pt-BR ro ru zh-CN"
      iuse: "${IUSE_L10N// / l10n_}"
      license: man-pages GPL-2+ BSD
      pdepend: |
        l10n_de? ( app-i18n/man-pages-l10n[l10n_de(-)] )
        l10n_es? ( app-i18n/man-pages-l10n[l10n_es(-)] )
        l10n_fr? ( app-i18n/man-pages-l10n[l10n_fr(-)] )
        l10n_it? ( app-i18n/man-pages-l10n[l10n_it(-)] )
        l10n_ja? ( app-i18n/man-pages-ja )
        l10n_nl? ( app-i18n/man-pages-l10n[l10n_nl(-)] )
        l10n_pl? ( app-i18n/man-pages-l10n[l10n_pl(-)] )
        l10n_pt-BR? ( app-i18n/man-pages-l10n[l10n_pt-BR(-)] )
        l10n_ro? ( app-i18n/man-pages-l10n[l10n_ro(-)] )
        l10n_ru? ( app-i18n/man-pages-ru )
        l10n_zh-CN? ( app-i18n/man-pages-zh_CN )
        sys-apps/man-pages-posix
      rdepend: |
        virtual/man
      body: |
        src_prepare() {
          default

          # installed by sys-libs/libxcrypt
          rm man/man3/crypt{,_r}.3 || die
        }
        src_compile() {
          emake -R
        }
        src_install() {
          emake -R install prefix="${EPREFIX}/usr" DESTDIR="${D}"
          dodoc README Changes*
        }

  packages:
    - man-pages:


mysql_connector_c:
  generator: builtin-github
  defaults:
    files_dir: '{{ .Values.pn }}'
    template: ../../templates/simple-github.tmpl
    category: dev-db
    github:
      user: mysql
      repo: mysql-server
      match: 'mysql-[0-9.]+'
      query: tags
      num_pages: 18
      exclude: 'mysql-server|labs'
    transform:
      - kind: string
        match: 'mysql-'
        replace: ''
    # In alternative we can use formulae.brew to retrieve version.
    #json:
    #  url: 'https://formulae.brew.sh/api/{{ .Values.jsonfile | default .Values.pn }}.json'
    #  version_filter: '$.versions.stable'
    #  src_uri_filter: '$.urls.stable.url'
    #  map_filter_vars:
    #    homepage: '$.homepage'
    vars:
      s: '${WORKDIR}/mysql-{{ .Values.version }}'
      desc: 'C client library for MariaDB/MySQL'
      license: GPL-2
      iuse: ldap static-libs
      inherit:
        - cmake-utils
        - flag-o-matic
      rdepend: |
        sys-libs/zlib:=
        ldap? ( dev-libs/cyrus-sasl:= )
        dev-libs/openssl:=
      depend: '${RDEPEND}'
      docs:
        - README
      body: |
        src_prepare() {
          sed -i -e 's/CLIENT_LIBS/CONFIG_CLIENT_LIBS/' "${S}/scripts/CMakeLists.txt" || die
          # All these are for the server only
          sed -i \
            -e '/MYSQL_CHECK_LIBEVENT/d' \
            -e '/MYSQL_CHECK_RAPIDJSON/d' \
            -e '/MYSQL_CHECK_ICU/d' \
            -e '/MYSQL_CHECK_RE2/d' \
            -e '/MYSQL_CHECK_LZ4/d' \
            -e '/MYSQL_CHECK_EDITLINE/d' \
            -e '/MYSQL_CHECK_CURL/d' \
            -e '/ADD_SUBDIRECTORY(man)/d' \
            -e '/ADD_SUBDIRECTORY(share)/d' \
            -e '/INCLUDE(cmake\/boost/d' \
            CMakeLists.txt || die
          # Skip building clients
          echo > client/CMakeLists.txt || die
          # Forcefully disable auth plugin
          if ! use ldap ; then
            sed -i -e '/MYSQL_CHECK_SASL/d' CMakeLists.txt || die
            echo > libmysql/authentication_ldap/CMakeLists.txt || die
          fi
          cmake-utils_src_prepare
        }
        src_configure() {
          local mycmakeargs=(
            -DINSTALL_LAYOUT=RPM
            -DINSTALL_LIBDIR=$(get_libdir)
            -DWITH_DEFAULT_COMPILER_OPTIONS=OFF
            -DWITH_DEFAULT_FEATURE_SET=OFF
            -DENABLED_LOCAL_INFILE=ON
            -DMYSQL_UNIX_ADDR="/run/mysqld/mysqld.sock"
            -DWITH_ZLIB=system
            -DWITH_SSL=system
            -DLIBMYSQL_OS_OUTPUT_NAME=mysqlclient
            -DSHARED_LIB_PATCH_VERSION="0"
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            -DWITHOUT_SERVER=ON
          )
          {{- if .Values.cxxflags }}
          append-cxxflags {{ .Values.cxxflags }}
          {{- end }}
          cmake-utils_src_configure
        }
        src_install() {
          cmake-utils_src_install
          if ! use static-libs ; then
            find "${ED}" -name "*.a" -delete || die
          fi
        }

  packages:
    - mysql-connector-c:
        selector:
          - '<8.1'
          - '>8.0'
        #vars:
        #  jsonfile: 'formula/mysql-client@8.0'

    - mysql-connector-c:
        selector:
          - '<8.5'
          - '>8.4'
        vars:
          cxxflags: '-std=gnu++20'

    - mysql-connector-c:
        selector:
          - '<9.8'
          - '>=9.7.0'
