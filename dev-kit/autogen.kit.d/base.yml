        dir:
          matcher: "lttng-tools-.*.tar.bz2$"
        transform:
          - kind: string
            match: 'lttng-tools-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        vars:
          desc: Linux Trace Toolkit - next generation
          iuse: +ust
          rdepend: |
            dev-libs/userspace-rcu:=
            dev-libs/popt
            dev-libs/libxml2
            ust? ( dev-util/lttng-ust:= )
          depend: '${RDEPEND}'
          body: |
            src_configure() {
              econf $(usex ust "" --without-lttng-ust) --disable-static --enable-tests=no
            }
            src_install() {
              default
              find "${ED}" -name '*.la' -delete || die
            }

    - lttng-modules:
        dir:
          matcher: "lttng-modules-.*.tar.bz2$"
        transform:
          - kind: string
            match: 'lttng-modules-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        vars:
          desc: LTTng Kernel Tracer Modules
          inherit:
            - linux-mod
          extra_envs:
            - 'BUILD_TARGETS="default"'
            - 'MODULE_NAMES="true"'
          body: |
            src_compile() {
              BUILD_FIXES="KERNELDIR=$KERNEL_DIR" linux-mod_src_compile
            }
            src_install() {
              for i in $(find "${S}" -name "*.ko" -print); do
                local val=${i##${S}/}
                local modules+="${val%%.ko}(misc:) "
              done
              MODULE_NAMES=${modules}
              linux-mod_src_install
              dodoc ChangeLog README.md
            }

    - lttng-ust:
        dir:
          matcher: "lttng-ust-.*.tar.bz2$"
        transform:
          - kind: string
            match: 'lttng-ust-'
            replace: ''
          - kind: string
