grub:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-boot

  packages:
    - grub:
        dir:
          url: https://ftp.gnu.org/gnu/grub/
          matcher: "grub-.*.tar.xz$"
        transform:
          - kind: string
            match: "grub-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
            url: https://ftp.gnu.org/gnu/grub//{{ .Values.pn }}-{{ .Values.version }}.tar.xz

          - name: "unifont-{{ .Values.unifont_version }}.pcf.gz"
            url: https://ftp.gnu.org/gnu/unifont/unifont-{{ .Values.unifont_version }}/unifont-{{ .Values.unifont_version }}.pcf.gz
            use: fonts

          - name: "dejavu-sans-ttf-{{ .Values.dejavu_version }}.zip"
            url: https://download.sourceforge.net/dejavu/dejavu-sans-ttf-{{ .Values.dejavu_version }}.zip
            use: themes
        vars:
          homepage: https://www.gnu.org/software/grub/
          desc: GNU GRUB boot loader
          unifont_version: 15.0.06
          dejavu_version: "2.37"
          extra_envs:
            - 'QA_EXECSTACK="usr/bin/grub-emu* usr/lib/grub/*"'
            - 'QA_PRESTRIPPED="usr/lib/grub/.*"'
            - 'QA_MULTILIB_PATHS="usr/lib/grub/.*"'
            - 'QA_WX_LOAD="usr/lib/grub/*"'
            - 'WANT_LIBTOOL=none'
            - |
              GRUB_ALL_PLATFORMS=( coreboot efi-32 efi-64 emu ieee1275 loongson
                multiboot qemu qemu-mips pc uboot xen xen-32 xen-pvh )
          python_compat: python3+
          license: GPL-3+ BSD MIT fonts? ( GPL-2-with-font-exception ) themes? ( CC-BY-SA-3.0 BitstreamVera )
          slot: 2
          s: '${WORKDIR}/${P%_*}'
          patches:
            - grub-gfxpayload.patch
            - grub-2.02_beta2-KERNEL_GLOBS.patch
            - grub-2.06-test-words.patch
            - grub-2.06-binutils-2.36.patch
            - grub-ktype-macaroni.patch
          iuse: |
            device-mapper doc efiemu +fonts mount nls sdl +themes truetype libzfs
            grub_platforms_coreboot grub_platforms_efi-32 grub_platforms_efi-64
            grub_platforms_emu grub_platforms_ieee1275 grub_platforms_loongson
            grub_platforms_multiboot grub_platforms_qemu grub_platforms_qemu-mips
            grub_platforms_pc grub_platforms_uboot grub_platforms_xen grub_platforms_xen-32
            grub_platforms_xen-pvh

          inherit:
            - bash-completion-r1
            - flag-o-matic
            - multibuild
            - optfeature
            - toolchain-funcs
            - autotools
          required_use: |
            grub_platforms_coreboot? ( fonts )
            grub_platforms_qemu? ( fonts )
            grub_platforms_ieee1275? ( fonts )
            grub_platforms_loongson? ( fonts )
          bdepend: |
            ${PYTHON_DEPS}
            sys-devel/flex
            sys-devel/bison
            sys-apps/help2man
            sys-apps/texinfo
            fonts? (
              media-libs/freetype:2
              virtual/pkgconfig
            )
            themes? (
              app-arch/unzip
              media-libs/freetype:2
              virtual/pkgconfig
            )
            truetype? ( virtual/pkgconfig )
          cdepend: |
            app-arch/xz-utils
            sys-libs/ncurses:0=
            grub_platforms_emu? (
              sdl? ( media-libs/libsdl2 )
            )
            device-mapper? ( >=sys-fs/lvm2-2.02.45 )
            libzfs? ( sys-fs/zfs:= )
            mount? ( sys-fs/fuse:3 )
            truetype? ( media-libs/freetype:2= )
            ppc? ( >=sys-apps/ibm-powerpc-utils-1.3.5 )
            ppc64? ( >=sys-apps/ibm-powerpc-utils-1.3.5 )
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}
            kernel_linux? (
              grub_platforms_efi-32? ( sys-boot/efibootmgr )
              grub_platforms_efi-64? ( sys-boot/efibootmgr )
            )
            nls? ( sys-devel/gettext )
          body: |
            pkg_setup() {
              :
            }
            src_prepare() {
              default
              export PYTHON=true

              eautoreconf

              # Avoid error due to extra_deps.lst missing from source tarball:
              #       make[3]: *** No rule to make target 'grub-core/extra_deps.lst', needed by 'syminfo.lst'.  Stop.
              echo "depends bli part_gpt" > grub-core/extra_deps.lst || die
            }

            grub_do() {
              multibuild_foreach_variant run_in_build_dir "$@"
            }

            grub_do_once() {
              multibuild_for_best_variant run_in_build_dir "$@"
            }

            grub_configure() {
              local platform

              case ${MULTIBUILD_VARIANT} in
                efi*) platform=efi ;;
                xen-pvh) platform=xen_pvh ;;
                xen*) platform=xen ;;
                guessed) ;;
                *) platform=${MULTIBUILD_VARIANT} ;;
              esac

              case ${MULTIBUILD_VARIANT} in
                *-32)
                  if [[ ${CTARGET:-${CHOST}} == x86_64* ]]; then
                    local CTARGET=i386
                  fi ;;
                *-64)
                  if [[ ${CTARGET:-${CHOST}} == i?86* ]]; then
                    local CTARGET=x86_64
                    local -x TARGET_CFLAGS="-Os -march=x86-64 ${TARGET_CFLAGS}"
                    local -x TARGET_CPPFLAGS="-march=x86-64 ${TARGET_CPPFLAGS}"
                  fi ;;
              esac

              local myeconfargs=(
                --disable-werror
                --program-prefix=
                --libdir="${EPREFIX}"/usr/lib
                $(use_enable device-mapper)
                $(use_enable mount grub-mount)
                $(use_enable nls)
                $(use_enable themes grub-themes)
                $(use_enable truetype grub-mkfont)
                $(use_enable libzfs)
                --enable-grub-emu-sdl=no
                $(use_enable sdl grub-emu-sdl2)
                ${platform:+--with-platform=}${platform}

                # Let configure detect this where supported
                $(usex efiemu '' '--disable-efiemu')
              )

              local UNIFONT="unifont-{{ .Values.unifont_version }}"
              local DEJAVU="dejavu-sans-ttf-{{ .Values.dejavu_version }}"

              if use fonts; then
                ln -rs "${WORKDIR}/${UNIFONT}.pcf" unifont.pcf || die
              fi

              if use themes; then
                ln -rs "${WORKDIR}/${DEJAVU}/ttf/DejaVuSans.ttf" DejaVuSans.ttf || die
              fi

              local ECONF_SOURCE="${S}"
              econf "${myeconfargs[@]}"
            }

            src_configure() {
              # Bug 508758.
              replace-flags -O3 -O2

              # Workaround for bug 829165.
              filter-ldflags -pie

              # We don't want to leak flags onto boot code.
              export HOST_CCASFLAGS=${CCASFLAGS}
              export HOST_CFLAGS=${CFLAGS}
              export HOST_CPPFLAGS=${CPPFLAGS}
              export HOST_LDFLAGS=${LDFLAGS}
              unset CCASFLAGS CFLAGS CPPFLAGS LDFLAGS

              tc-ld-disable-gold #439082 #466536 #526348
              export TARGET_LDFLAGS="${TARGET_LDFLAGS} ${LDFLAGS}"
              unset LDFLAGS

              tc-export CC NM OBJCOPY RANLIB STRIP
              tc-export BUILD_CC BUILD_PKG_CONFIG

              # Force configure to use flex & bison; Gentoo bug 887211.
              export LEX=flex
              unset YACC

              MULTIBUILD_VARIANTS=()
              local p
              for p in "${GRUB_ALL_PLATFORMS[@]}"; do
                use "grub_platforms_${p}" && MULTIBUILD_VARIANTS+=( "${p}" )
              done
              [[ ${#MULTIBUILD_VARIANTS[@]} -eq 0 ]] && MULTIBUILD_VARIANTS=( guessed )
              grub_do grub_configure
            }

            src_compile() {
              # Sandbox bug 404013.
              use libzfs && { addpredict /etc/dfs; addpredict /dev/zfs; }

              grub_do emake
              use doc && grub_do_once emake -C docs html
            }

            src_install() {
              grub_do emake install DESTDIR="${D}" bashcompletiondir="$(get_bashcompdir)"
              use doc && grub_do_once emake -C docs install-html DESTDIR="${D}"

              einstalldocs

              insinto /etc/default
              newins "${FILESDIR}"/grub.default-4 grub

              # https://bugs.gentoo.org/231935
              dostrip -x /usr/lib/grub
            }

            pkg_postinst() {
              elog "For information on how to configure GRUB2 please refer to the guide:"
              elog "    https://wiki.gentoo.org/wiki/GRUB2_Quick_Start"

              if has_version 'sys-boot/grub:0'; then
                elog "A migration guide for GRUB Legacy users is available:"
                elog "    https://wiki.gentoo.org/wiki/GRUB2_Migration"
              fi

              if [[ -z ${REPLACING_VERSIONS} ]]; then
                elog
                optfeature "detecting other operating systems (grub-mkconfig)" sys-boot/os-prober
                optfeature "creating rescue media (grub-mkrescue)" dev-libs/libisoburn
                optfeature "enabling RAID device detection" sys-fs/mdadm
              fi

              if has_version sys-boot/os-prober; then
                ewarn "Due to security concerns, os-prober is disabled by default."
                ewarn "Set GRUB_DISABLE_OS_PROBER=false in /etc/default/grub to enable it."
              fi
            }




linear_packages:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-libs


  packages:
    - nss:
        dir:
          url: https://ftp.mozilla.org/pub/security/nss/releases/
          matcher: 'NSS_.*'
        transform:
          - kind: string
            match: "NSS_"
            replace: ""
          - kind: string
            match: "_RTM"
            replace: ""
          - kind: string
            match: "_"
            replace: "."
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
            url: 'https://ftp.mozilla.org/pub/security/nss/releases/{{ .Values.original_version }}/src/{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
        vars:
          patches:
            - gyp-config.patch
          desc: Mozilla's Network Security Services library that implements PKI support
          homepage: https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSS
          inherit:
            - flag-o-matic
            - toolchain-funcs
          license: '|| ( MPL-2.0 GPL-2 LGPL-2.1 )'
          iuse: +utils
          rdepend: |
            app-admin/whip
            sys-apps/whip-catalog
            dev-libs/nspr
            dev-db/sqlite
            sys-libs/zlib
            virtual/pkgconfig
          depend: '${RDEPEND}'
          s: '${WORKDIR}/${P}/${PN}'
          extra_envs:
            - 'NSS_CHK_SIGN_LIBS="freebl3 nssdbm3 softokn3"'
          body: |
            src_prepare() {
              default

              sed -e "/print('-Werror')/d" -i -e "s|'-Werror',||g" \
                coreconf/werror.py
              sed -i -e 's|gtests$||g' manifest.mn

              pushd coreconf >/dev/null || die
              # hack nspr paths
              echo 'INCLUDES += -I$(DIST)/include/dbm' \
                >> headers.mk || die "failed to append include"

              # modify install path
              sed -e '/CORE_DEPTH/s:SOURCE_PREFIX.*$:SOURCE_PREFIX = $(CORE_DEPTH)/dist:' \
                -i source.mk || die

              # Respect LDFLAGS
              sed -i -e 's/\$(MKSHLIB) -o/\$(MKSHLIB) \$(LDFLAGS) -o/g' rules.mk
              popd >/dev/null || die

              # dirty hack
              sed -i -e "/CRYPTOLIB/s:\$(SOFTOKEN_LIB_DIR):../freebl/\$(OBJDIR):" \
                lib/ssl/config.mk || die
              sed -i -e "/CRYPTOLIB/s:\$(SOFTOKEN_LIB_DIR):../../lib/freebl/\$(OBJDIR):" \
                cmd/platlibs.mk || die

              strip-flags
            }
            src_compile() {
              # Take care of nspr settings #436216
              local myCPPFLAGS="${CPPFLAGS} $($(tc-getPKG_CONFIG) nspr --cflags)"
              unset NSPR_INCLUDE_DIR

              export NSS_ALLOW_SSLKEYLOGFILE=1
              export NSS_ENABLE_WERROR=0 #567158
              export BUILD_OPT=1
              export NSS_USE_SYSTEM_SQLITE=1
              export NSDISTMODE=copy
              export FREEBL_NO_DEPEND=1
              export FREEBL_LOWHASH=1
              export NSS_SEED_ONLY_DEV_URANDOM=1
              export USE_SYSTEM_ZLIB=1
              export ZLIB_LIBS=-lz
              export ASFLAGS=""
              # Fix build failure on arm64
              export NS_USE_GCC=1
              # Detect compiler type and set proper environment value
              if tc-is-gcc; then
                  export CC_IS_GCC=1
              elif tc-is-clang; then
                  export CC_IS_CLANG=1
              fi

              local d
              local ostest="x86_64"
              if use arm ; then
                ostest=$(tc-arch ${CHOST})
                export USE_N32=1
              else
                export USE_64=1
              fi

              # Build the host tools first.
              NSPR_LIB_DIR="${T}/fakedir" \
              emake -j1 -C coreconf
              makeargs+=( NSINSTALL="${PWD}/$(find -type f -name nsinstall)" )

              # Then build the target tools.
              for d in . lib/dbm ; do
                CPPFLAGS="${myCPPFLAGS}" \
                XCFLAGS="${CFLAGS} ${CPPFLAGS}" \
                NSPR_LIB_DIR="${T}/fakedir" \
                emake -j1 "${makeargs[@]}" -C ${d} OS_TEST="${ostest}"
              done
            }
            src_install() {
              local nss_vmajor=$(awk '/#define.*NSS_VMAJOR/ {print $3}' lib/nss/nss.h)
              local nss_vminor=$(awk '/#define.*NSS_VMINOR/ {print $3}' lib/nss/nss.h)
              local nss_vpatch=$(awk '/#define.*NSS_VPATCH/ {print $3}' lib/nss/nss.h)
              local nspr_version="$(pkg-config --modversion nspr)"

              pushd dist >/dev/null || die

              dodir /usr/$(get_libdir)
              cp -L */lib/*$(get_libname) "${ED}"/usr/$(get_libdir) || die "copying shared libs failed"
              local i
              for i in crmf freebl nssb nssckfw ; do
                cp -L */lib/lib${i}.a "${ED}"/usr/$(get_libdir) || die "copying libs failed"
              done

              # Install nss-config and pkgconfig file
              #
              # pkgconfig files
              dodir /usr/$(get_libdir)/pkgconfig
              local _pc; for _pc in nss.pc nss-util.pc nss-softokn.pc; do
                sed "${FILESDIR}"/$_pc.in \
                  -e "s,%libdir%,/usr/$(get_libdir),g" \
                  -e "s,%prefix%,/usr,g" \
                  -e "s,%exec_prefix%,/usr/bin,g" \
                  -e "s,%includedir%,/usr/include/nss,g" \
                  -e "s,%SOFTOKEN_VERSION%,${PV},g" \
                  -e "s,%NSPR_VERSION%,$nspr_version,g" \
                  -e "s,%NSS_VERSION%,${PV}r,g" \
                  -e "s,%NSSUTIL_VERSION%,${PV},g" \
                  > "${ED}"/usr/$(get_libdir)/pkgconfig/$_pc
              done
              dosym /usr/$(get_libdir)/pkgconfig/nss.pc /usr/$(get_libdir)/pkgconfig/mozilla-nss.pc

              # nss-config
              dodir /usr/bin
              sed "${FILESDIR}"/nss-config.in \
                -e "s,@libdir@,/usr/$(get_libdir),g" \
                -e "s,@prefix@,/usr/bin,g" \
                -e "s,@exec_prefix@,/usr/bin,g" \
                -e "s,@includedir@,/usr/include/nss,g" \
                -e "s,@MOD_MAJOR_VERSION@,${nss_vmajor},g" \
                -e "s,@MOD_MINOR_VERSION@,${nss_vminor},g" \
                -e "s,@MOD_PATCH_VERSION@,${nss_vpatch},g" \
                > "${ED}"/usr/bin/nss-config
              chmod 755 "${ED}"/usr/bin/nss-config

              # all the include files
              insinto /usr/include/nss
              doins public/nss/*.{h,api}
              insinto /usr/include/nss/private
              doins private/nss/{blapi,alghmac,cmac}.h

              popd >/dev/null || die

              local f nssutils
              # Always enabled because we need it for chk generation.
              nssutils=( shlibsign )

              if use utils; then
                nssutils+=(
                  addbuiltin
                  atob
                  baddbdir
                  btoa
                  certutil
                  cmsutil
                  conflict
                  crlutil
                  derdump
                  digest
                  makepqg
                  mangle
                  modutil
                  multinit
                  nonspr10
                  ocspclnt
                  oidcalc
                  p7content
                  p7env
                  p7sign
                  p7verify
                  pk11mode
                  pk12util
                  pp
                  rsaperf
                  selfserv
                  signtool
                  signver
                  ssltap
                  strsclnt
                  symkeyutil
                  tstclnt
                  vfychain
                  vfyserv
                )
                # install man-pages for utils (bug #516810)
                doman doc/nroff/*.1
              fi
              pushd dist/*/bin >/dev/null || die
              for f in ${nssutils[@]}; do
                dobin ${f}
              done
              popd >/dev/null || die

              # Prelink breaks the CHK files. We don't have any reliable way to run
              # shlibsign after prelink.
              dodir /etc/prelink.conf.d
              printf -- "-b ${EPREFIX}/usr/$(get_libdir)/lib%s.so\n" ${NSS_CHK_SIGN_LIBS} \
                > "${ED}"/etc/prelink.conf.d/nss.conf
            }
            pkg_postinst() {
              whip h nss.postinst
            }
            pkg_postrm() {
              whip h nss.postrm
            }


    - liblinear:
        vars:
          license: BSD
          desc: A Library for Large Linear Classification
          homepage: https://www.csie.ntu.edu.tw/~cjlin/liblinear/ https://github.com/cjlin1/liblinear
          iuse: blas
          rdepend: |
            blas? ( virtual/blas )
          depend: |
            ${RDEPEND}
            blas? ( virtual/pkgconfig )
          inherit:
            - toolchain-funcs
          body: |
            src_prepare() {
              default
              sed -i \
                -e '/^CFLAGS/d;/^CXXFLAGS/d' \
                blas/Makefile || die
              sed -i \
                -e 's|make|$(MAKE)|g' \
                -e '/$(LIBS)/s|$(CFLAGS)|& $(LDFLAGS)|g' \
                -e '/^CFLAGS/d;/^CXXFLAGS/d' \
                -e 's|$(SHARED_LIB_FLAG)|& $(LDFLAGS)|g' \
                Makefile || die
            }
            src_compile() {
              emake \
                CC="$(tc-getCC)" \
                CXX="$(tc-getCXX)" \
                CFLAGS="${CFLAGS} -fPIC" \
                CXXFLAGS="${CXXFLAGS} -fPIC" \
                AR="$(tc-getAR)" \
                RANLIB="$(tc-getRANLIB)" \
                lib all
            }
            src_install() {
              dolib.so {{ .Values.pn }}.so.*
              dosym {{ .Values.pn }}.so.* /usr/$(get_libdir)/{{ .Values.pn }}$(get_libname)
              newbin predict {{ .Values.pn }}-predict
              newbin train {{ .Values.pn }}-train
              doheader linear.h
              dodoc README
            }

        dir:
          #https://www.csie.ntu.edu.tw/~cjlin/liblinear/liblinear-2.48.tar.gz
          url: https://www.csie.ntu.edu.tw/~cjlin/liblinear/
          matcher: "liblinear-.*.tar.gz$"
        transform:
          - kind: string
            match: "liblinear-"
            replace: ""
          - kind: string
            match: ".tar.gz"
            replace: ""



dev_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-util
    github:
      query: releases

  extensions_defs:
    golang:
      opts:

    rust:
      opts:

  packages:

    - cbindgen:
        extensions:
          - rust
        github:
          user: mozilla
          num_pages: 3
        vars:
          inherit:
            - cargo
          extra_envs:
            - 'QA_FLAGS_IGNORED="/usr/bin/cbindgen"'
          body: |
            src_unpack() {
              cargo_src_unpack
              rm -rf ${S}
              mv ${WORKDIR}/{{ .Values.github_user}}-{{ .Values.github_repo }}-* ${S} || die
            }
            src_install() {
              cargo_src_install
              einstalldocs
            }

    - cmake:
        template: ../../templates/simple-github.tmpl
        github:
          user: Kitware
          repo: CMake
        selector:
          - '<4.0'
        vars:
          extra_envs:
            - 'CMAKE_MAKEFILE_GENERATOR="emake"'
            - 'CMAKE_REMOVE_MODULES_LIST=( none )'
            - 'SITEFILE="50${PN}-mark.el"'
          inherit:
            - bash-completion-r1
            - cmake
            - elisp-common
            - flag-o-matic
            - multiprocessing
            - toolchain-funcs
            - xdg-utils
          iuse: doc emacs ncurses qt
          rdepend: |
            >=app-arch/libarchive-3.3.3:=
            app-crypt/rhash
            >=dev-libs/expat-2.0.1
            >=dev-libs/jsoncpp-1.9.2-r2:0=
            >=dev-libs/libuv-1.10.0:=
            >=net-misc/curl-7.21.5[ssl]
            sys-libs/zlib
            virtual/pkgconfig
            emacs? ( >=app-editors/emacs-23.1:* )
            ncurses? ( sys-libs/ncurses:0= )
            qt? (
              || (
                dev-qt/qtbase:5[gui]
                dev-qt/qtbase:6[gui]
              )
            )
          depend: '${RDEPEND}'
          bdepend: |
            doc? (
              dev-python/requests
              dev-python/sphinx
            )
          patches:
            # Keep Gentoo patches for now. I will review the behaviour as second step.
            - cmake-3.27.0_rc1-0002-Set-some-proper-paths-to-make-cmake-find-our-tools.patch
            - cmake-3.31.6-Prefer-pkgconfig-in-FindBLAS.patch
            - cmake-3.27.0_rc1-0004-Ensure-that-the-correct-version-of-Qt-is-always-used.patch
            - cmake-3.27.0_rc1-0005-Respect-Gentoo-s-Python-eclasses.patch
            - cmake-3.30.3-cudahostld.patch
            - cmake-3.31.7-hdf5.patch
          body: |
            cmake_src_bootstrap() {
              # disable running of cmake in bootstrap command
              sed -i \
                -e '/"${cmake_bootstrap_dir}\/cmake"/s/^/#DONOTRUN /' \
                bootstrap || die "sed failed"
              # bootstrap script isn't exactly /bin/sh compatible
              tc-env_build ${CONFIG_SHELL:-sh} ./bootstrap \
                --prefix="${T}/cmakestrap/" \
                --parallel=$(makeopts_jobs "${MAKEOPTS}" "$(get_nproc)") \
                || die "Bootstrap failed"
            }
            src_prepare() {
              cmake_src_prepare
              # Add gcc libs to the default link paths
              sed -i \
                -e "s|@GENTOO_PORTAGE_GCCLIBDIR@|${EPREFIX}/usr/${CHOST}/lib/|g" \
                -e "$(usex prefix-guest "s|@GENTOO_HOST@||" "/@GENTOO_HOST@/d")" \
                -e "s|@GENTOO_PORTAGE_EPREFIX@|${EPREFIX}/|g" \
                Modules/Platform/{UnixPaths,Darwin}.cmake || die "sed failed"
              if ! has_version -b \>=${CATEGORY}/${PN}-3.13 || ! cmake --version &>/dev/null ; then
                CMAKE_BINARY="${S}/Bootstrap.cmk/cmake"
                cmake_src_bootstrap
              fi
            }
            src_configure() {
              # ODR warnings, bug #858335
              # https://gitlab.kitware.com/cmake/cmake/-/issues/20740
              filter-flags '-flto*' -fwhole-program-vtables '-fsanitize=cfi*' || die

              local mycmakeargs=(
              -DCMAKE_USE_SYSTEM_LIBRARIES=ON
              -DCMake_ENABLE_DEBUGGER=no
              -DCMAKE_DOC_DIR=/share/doc/${PF}
              -DCMAKE_MAN_DIR=/share/man
              -DCMAKE_DATA_DIR=/share/${PN}
              -DSPHINX_MAN=$(usex doc)
              -DSPHINX_HTML=$(usex doc)
              -DBUILD_CursesDialog="$(usex ncurses)"
              -DBUILD_TESTING=no
              )
              use qt && mycmakeargs+=( -DBUILD_QtDialog=ON )

              cmake_src_configure
            }
            src_install() {
              cmake_src_install

              if use emacs; then
                elisp-install ${PN} Auxiliary/cmake-mode.el Auxiliary/cmake-mode.elc
                elisp-site-file-install "${FILESDIR}/${SITEFILE}"
              fi

              insinto /usr/share/vim/vimfiles/syntax
              doins Auxiliary/vim/syntax/cmake.vim

              insinto /usr/share/vim/vimfiles/indent
              doins Auxiliary/vim/indent/cmake.vim

              insinto /usr/share/vim/vimfiles/ftdetect
              doins "${FILESDIR}/${PN}.vim"

              dobashcomp Auxiliary/bash-completion/{${PN},ctest,cpack}
            }

            pkg_postinst() {
              use emacs && elisp-site-regen

              if use qt; then
                xdg_icon_cache_update
                xdg_desktop_database_update
                xdg_mimeinfo_database_update
              fi
            }

            pkg_postrm() {
              use emacs && elisp-site-regen

              if use qt; then
                xdg_icon_cache_update
                xdg_desktop_database_update
                xdg_mimeinfo_database_update
              fi
            }


    - go-swagger:
        template: ../../templates/simple-github.tmpl
        extensions:
          - golang
        vars:
          inherit:
            - go-module
          bdepend: dev-lang/go
          body: |
            src_compile() {
              go build -x -v ./cmd/swagger
            }
            src_install() {
              dobin swagger
            }


    - jq-bin:
        category: app-misc
        github:
          user: jqlang
          repo: jq
        transform:
          - kind: string
            match: "jq "
            replace: ""
        vars:
          iuse: amd64 arm arm64
          homepage: https://stedolan.github.io/jq/
          desc: A lightweight and flexible command-line JSON processor
          extra_envs:
            - QA_PREBUILT="/usr/bin/jq"
          rdepend: |
            !app-misc/jq
          depend: ${RDEPEND}
          s: ${WORKDIR}

          body: |
            src_prepare() {
              if use amd64; then
                cp "${DISTDIR}"/${P}-linux-amd64 jq || die
              elif use arm64; then
                cp "${DISTDIR}"/${P}-linux-arm64 jq || die
              else
                cp "${DISTDIR}"/${P}-linux-armhf jq || die
              fi
              eapply_user
            }
            src_install() {
              dobin "${WORKDIR}"/jq
            }
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-amd64'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-linux-amd64$'
            use: amd64

          # For ARM (add support for armv7 with HF
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-armhf'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-linux-armhf$'
            use: arm

          # For ARM (add support for armv7 with HF
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm64'
            matcher: '{{ .Values.pn | replace "-bin" "" }}-linux-arm64$'
            use: arm64

    - etcher-bin:
        category: sys-boot
        github:
          user: balena-io
          repo: etcher
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.linux-amd64.tar.gz'
            matcher: 'balena-{{ .Values.pn | replace "-bin" "" }}_{{ .Values.version }}_amd64.deb$'
        vars:
          inherit:
            - desktop
            - eutils
            - electron
            - unpacker
            - pax-utils
            - xdg
          desc: Flash OS images to SD cards & USB drives, safely and easily.
          homepage: https://etcher.io/
          license: GPL-2
          cdepend: |
            media-libs/libpng
            x11-libs/gtk+
            x11-libs/cairo
            x11-libs/libXtst
            sys-apps/lsb-release
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}
            x11-libs/libnotify
            x11-libs/libXScrnSaver
            dev-libs/nss
          body: |
            src_unpack() {
              # etcher does not use a containing folder(deb archive)
              # manual intervention required
              install -d "${WORKDIR}/${P}"
              S="${WORKDIR}/${P}"
              cd "${S}" || die "cd into target directory ${S} failed"
              unpack_deb "${A}"
            }
            src_install() {
              local instdir="/opt/balenaEtcher"
              local balenabin="balena-{{ .Values.pn | replace "-bin" "" }}"
              insinto ${instdir}
              doins -r *
              dosym "${instdir}/${balenabin}" "/usr/bin/{{ .Values.pn | replace "-bin" "" }}" || die
              make_wrapper "{{ .Values.pn | replace "-bin" "" }}" "${instdir}/${balenabin}" || die
              # only contains changelog"
              rm -rf "${D}/usr/share/doc" || die
              # use own desktop file
              rm -fR "${D}/usr/share/applications" || die
              domenu "${FILESDIR}/{{ .Values.pn | replace "-bin" "" }}.desktop" || die
              # correct permissions of install components
              fperms a+x "${instdir}/usr/bin/${balenabin}" || die
              pax-mark m "${instdir}/usr/bin/${balenabin}" || die
            }
            pkg_postinst() {
              xdg_pkg_postinst
            }
            pkg_postrm() {
              xdg_pkg_postrm
            }

    - yq3-bin:
        category: app-misc
        github:
          user: mikefarah
          repo: yq
          num_pages: 15
        selector:
          - '<4.0'
        transform:
          - kind: regex
            match: " - .*$"
            replace: ""

        vars:
          iuse: amd64 arm arm64
          homepage: https://github.com/mikefarah/yq/
          desc: Portable command-line YAML, JSON, XML, CSV, TOML and properties processor
          extra_envs:
            - QA_PREBUILT="/usr/bin/yq"
          s: ${WORKDIR}

          body: |
            src_prepare() {
              if use amd64; then
                cp "${DISTDIR}"/{{ .Values.pn }}-{{ .Values.version }}-linux-amd64 yq || die
              elif use arm64; then
                cp "${DISTDIR}"/{{ .Values.pn }}-{{ .Values.version }}-linux-arm64 yq || die
              else
                cp "${DISTDIR}"/{{ .Values.pn }}-{{ .Values.version }}-linux-arm yq || die
              fi
              eapply_user
            }
            src_install() {
              dobin yq
            }
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-amd64'
            matcher: 'yq_linux_amd64$'
            use: amd64

          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm'
            matcher: 'yq_linux_arm$'
            use: arm

          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm64'
            matcher: 'yq_linux_arm64$'
            use: arm64

    - yq4-bin:
        category: app-misc
        github:
          user: mikefarah
          repo: yq
        selector:
          - '<5.0'
        transform:
          - kind: regex
            match: " - .*$"
            replace: ""
        vars:
          iuse: amd64 arm arm64
          homepage: https://github.com/mikefarah/yq/
          desc: Portable command-line YAML, JSON, XML, CSV, TOML and properties processor
          extra_envs:
            - QA_PREBUILT="/usr/bin/yq4"
          rdepend: |
            !app-misc/yq-go
          depend: ${RDEPEND}
          s: ${WORKDIR}
          body: |
            src_prepare() {
              default
              if use amd64; then
                mv {{ .Values.pn | replace "4-bin" "" }}_linux_amd64 yq4 || die
              elif use arm64; then
                mv {{ .Values.pn | replace "4-bin" "" }}_linux_arm64 yq4 || die
              else
                cp {{ .Values.pn | replace "4-bin" "" }}_linux_arm yq4 || die
              fi
              eapply_user
            }
            src_install() {
              dobin yq4
            }
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-amd64.tar.gz'
            matcher: 'yq_linux_amd64.tar.gz$'
            use: amd64

          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm.tar.gz'
            matcher: 'yq_linux_arm.tar.gz$'
            use: arm

          - name: '{{ .Values.pn }}-{{ .Values.version }}-linux-arm64.tar.gz'
            matcher: 'yq_linux_arm64.tar.gz$'
            use: arm64

    - ninja:
        template: ../../templates/simple-github.tmpl
        github:
          user: ninja-build
        exclude:
          # skip old release tags/format
          - '120715'
        vars:
          python_compat: python3+
          inherit:
            - bash-completion-r1
            - elisp-common
            - python-any-r1
            - toolchain-funcs
          iuse: doc emacs vim-syntax
          bdepend: |
            ${PYTHON_DEPS}
            dev-util/re2c
            doc? (
              app-text/asciidoc
              app-doc/doxygen
              dev-libs/libxslt
            )
          rdepend: |
            emacs? ( virtual/emacs )
            vim-syntax? (
              || (
                app-editors/vim
                app-editors/gvim
              )
            )
          body: |
            run_for_build() {
              if tc-is-cross-compiler; then
                local -x AR=$(tc-getBUILD_AR)
                local -x CXX=$(tc-getBUILD_CXX)
                local -x CFLAGS=
                local -x CXXFLAGS=${BUILD_CXXFLAGS}
                local -x LDFLAGS=${BUILD_LDFLAGS}
              fi
              echo "$@" >&2
              "$@"
            }
            src_compile() {
              tc-export AR CXX
              # configure.py uses CFLAGS instead of CXXFLAGS
              export CFLAGS=${CXXFLAGS}
              run_for_build ${EPYTHON} configure.py --bootstrap --verbose || die
              if tc-is-cross-compiler; then
                mv ninja ninja-build || die
                ${EPYTHON} configure.py || die
                ./ninja-build -v ninja || die
              else
                ln ninja ninja-build || die
              fi
              if use doc; then
                ./ninja-build -v doxygen manual || die
              fi
              if use emacs; then
                elisp-compile misc/ninja-mode.el || die
              fi
            }
            src_install() {
              dodoc README.md
              if use doc; then
                docinto html
                dodoc -r doc/doxygen/html/.
                dodoc doc/manual.html
              fi
              dobin ninja
              newbashcomp misc/bash-completion "${PN}"
              if use vim-syntax; then
                insinto /usr/share/vim/vimfiles/syntax/
                doins misc/ninja.vim
                echo 'au BufNewFile,BufRead *.ninja set ft=ninja' > "${T}/ninja.vim"
                insinto /usr/share/vim/vimfiles/ftdetect
                doins "${T}/ninja.vim"
              fi
              insinto /usr/share/zsh/site-functions
              newins misc/zsh-completion _ninja
              if use emacs; then
                cd misc || die
                elisp-install ninja ninja-mode.el* || die
              fi
            }
            pkg_postinst() {
              use emacs && elisp-site-regen
            }
            pkg_postrm() {
              use emacs && elisp-site-regen
            }


gnu_savannah_atoms:
  # Using GARR mirror more fast.
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-apps
    vars:
      license: LGPL-2.1
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"

  packages:
    - miscfiles:
        category: sys-apps
        dir:
          # master node seems slow: https://ftp.gnu.org/gnu/miscfiles/
          # we use GARR mirror
          url: http://gnuftp.mirror.garr.it/miscfiles/
          matcher: 'miscfiles-.*.tar.gz$'
        transform:
          - kind: string
            match: miscfiles-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''

        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
          - name: '{{ .Values.pn }}-UnicodeData-{{ .Values.unicode_extra_pv }}.txt.xz'
            # TODO: Drop dependency from gentoo tarball.
            url: 'https://distfiles.gentoo.org/distfiles/0b/UnicodeData-{{ .Values.unicode_extra_pv }}.txt.xz'

        vars:
          homepage: https://savannah.gnu.org/projects/miscfiles/
          desc: Miscellaneous files
          license: GPL-2 unicode
          unicode_extra_pv: 10.0.0
          iuse: minimal
          body: |
            src_prepare() {
              default
              mv "${WORKDIR}"/UnicodeData-${UNI_PV}.txt unicode || die
            }
            src_configure() {
              econf --datadir="${EPREFIX%/}"/usr/share/misc
            }

            src_install() {
              emake install DESTDIR="${D}"
              dodoc NEWS ORIGIN README dict-README
              # not sure if this is still needed ...
              dodir /usr/share/dict
              cd "${ED%/}"/usr/share/misc || die
              mv $(awk '$1=="dictfiles"{$1="";$2="";print}' "${S}"/Makefile) ../dict/ || die
              cd ../dict || die
              ln -s web2 words || die
              ln -s web2a extra.words || die
              if use minimal ; then
                pushd "${ED%/}"/usr/share/dict || die
                rm -f words extra.words || die
                gzip -9 * || die
                ln -s web2.gz words || die
                ln -s web2a.gz extra.words || die
                ln -s connectives{.gz,} || die
                ln -s propernames{.gz,} || die
                popd || die
                rm -r "${ED%/}"/usr/share/misc || die
              fi
            }
            pkg_postinst() {
              if [[ ${ROOT} == "/" ]] && type -P create-cracklib-dict >/dev/null ; then
                ebegin "Regenerating cracklib dictionary"
                create-cracklib-dict "${EPREFIX%/}"/usr/share/dict/* > /dev/null
                eend $?
              fi
              # pkg_postinst isn't supposed to fail
              return 0
            }



lttng:
  generator: builtin-dirlisting

  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-util
    dir:
      url: 'https://lttng.org/files/{{ .Values.pn }}/'
      exclude: '-rc|-latest'
    vars:
      homepage: https://lttng.org
      license: GPL-2

  packages:
    - lttng-tools:
        dir:
          matcher: "lttng-tools-.*.tar.bz2$"
        transform:
          - kind: string
            match: 'lttng-tools-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        vars:
          desc: Linux Trace Toolkit - next generation
          iuse: +ust
          rdepend: |
            dev-libs/userspace-rcu:=
            dev-libs/popt
            dev-libs/libxml2
            ust? ( dev-util/lttng-ust:= )
          depend: '${RDEPEND}'
          body: |
            src_configure() {
              econf $(usex ust "" --without-lttng-ust) --disable-static --enable-tests=no
            }
            src_install() {
              default
              find "${ED}" -name '*.la' -delete || die
            }

    - lttng-modules:
        dir:
          matcher: "lttng-modules-.*.tar.bz2$"
        transform:
          - kind: string
            match: 'lttng-modules-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        vars:
          desc: LTTng Kernel Tracer Modules
          inherit:
            - linux-mod
          extra_envs:
            - 'BUILD_TARGETS="default"'
            - 'MODULE_NAMES="true"'
          body: |
            src_compile() {
              BUILD_FIXES="KERNELDIR=$KERNEL_DIR" linux-mod_src_compile
            }
            src_install() {
              for i in $(find "${S}" -name "*.ko" -print); do
                local val=${i##${S}/}
                local modules+="${val%%.ko}(misc:) "
              done
              MODULE_NAMES=${modules}
              linux-mod_src_install
              dodoc ChangeLog README.md
            }

    - lttng-ust:
        dir:
          matcher: "lttng-ust-.*.tar.bz2$"
        transform:
          - kind: string
            match: 'lttng-ust-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        vars:
          desc: Linux Trace Toolkit - UST library
          iuse: examples numa python java jni
          rdepend: |
            dev-libs/userspace-rcu:=
            numa? ( sys-process/numactl )
          depend: '${RDEPEND}'
          inherit:
            - autotools
          body: |
            src_prepare() {
              default
              if ! use examples; then
                sed -i -e '/SUBDIRS/s:examples::' doc/Makefile.am || die
              fi
              eautoreconf
            }
            src_configure() {
              econf \
                $(use_enable numa) \
                $(use_enable python python-agent) \
                $(use_enable java java-agent-all) \
                $(use_enable jni jni-interface)
            }
            src_install() {
              default
              find "${ED}" -name '*.la' -delete || die
            }
