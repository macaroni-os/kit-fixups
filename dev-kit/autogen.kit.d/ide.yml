vscodium_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: app-editors
    github:
      query: releases
  packages:
    - vscodium-bin:
        github:
          user: VSCodium
          repo: vscodium
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-x64.tar.gz'
            matcher: 'VSCodium-linux-x64-.*.tar.gz$'
            use: amd64
          - name: '{{ .Values.pn }}-{{ .Values.version }}-arm64.tar.gz'
            matcher: 'VSCodium-linux-arm64-.*.tar.gz$'
            use: arm64
        vars:
          inherit:
            - desktop
            - eutils
            - pax-utils
            - xdg
          iuse: amd64 arm64 libsecret hunspell
          s: '${WORKDIR}'
          cdepend: |
            media-libs/libpng
            x11-libs/gtk+:3
            x11-libs/cairo
            x11-libs/libXtst
          rdepend: |
            ${CDEPEND}
            net-print/cups
            x11-libs/libnotify
            x11-libs/libXScrnSaver
            dev-libs/nss
            hunspell? ( app-text/hunspell )
            libsecret? ( app-crypt/libsecret[crypt] )
          depend: |
            ${CDEPEND}
          body: |
            src_install() {
              local instdir="/opt/{{ .Values.pn }}"
              local exe="codium"

              pax-mark m "${instdir}/${exe}"
              insinto "${instdir}"
              doins -r *
              dosym "${instdir}/${exe}" "/usr/bin/{{ .Values.pn }}"
              make_wrapper "{{ .Values.pn }}" "${instdir}/${exe}"
              domenu ${FILESDIR}/{{ .Values.pn }}.desktop
              newicon ${S}/resources/app/resources/linux/code.png {{ .Values.pn }}.png

              fperms +x "${instdir}/${MY_EXEC}"
              fperms 4755 "${instdir}/chrome-sandbox"
              fperms +x "${instdir}/libEGL.so"
              fperms +x "${instdir}/libGLESv2.so"
              fperms +x "${instdir}/libffmpeg.so"

              #fix Spawn EACESS bug #25848
              insinto "/usr/share/licenses/{{ .Values.pn }}"
              newins "${S}/resources/app/LICENSE.txt" "LICENSE.txt"
            }
            pkg_postinst() {
              xdg_icon_cache_update
              xdg_desktop_database_update
              elog "You may install some additional utils, so check them in:"
              elog "https://code.visualstudio.com/Docs/setup#_additional-tools"
            }
            pkg_postrm() {
              xdg_desktop_database_update
              xdg_icon_cache_update
            }


vscode:

  # NOTE: we use adelielinux fork because the sourceforge
  #       version seems unmaintained.
  generator: builtin-json
  defaults:
    template: ../../templates/simple.tmpl
    category: app-editors
    json:
      url: 'https://formulae.brew.sh/api/{{ .Values.jsonfile | default .Values.pn }}.json'
      version_filter: '$.version'
      #src_uri_filter: '$.urls.stable.url'
      map_filter_vars:
        desc: '$.desc'
        homepage: '$.homepage'
    assets:
      - name: '{{ .Values.pn }}-linux-x64-{{ .Values.version }}.tar.gz'
        url: 'https://update.code.visualstudio.com/{{ .Values.version }}/linux-x64/stable'
        use: amd64

      - name: '{{ .Values.pn }}-linux-arm64-{{ .Values.version }}.tar.gz'
        url: 'https://update.code.visualstudio.com/{{ .Values.version }}/linux-arm64/stable'
        use: arm64
    vars:
      jsonfile: cask/visual-studio-code
      license: |
        Apache-2.0
        BSD
        BSD-1
        BSD-2
        BSD-4
        CC-BY-4.0
        ISC
        LGPL-2.1+
        Microsoft
        MIT
        MPL-2.0
        openssl
        PYTHON
        TextMate-bundle
        Unlicense
        UoI-NCSA
        W3C
      iuse: amd64 arm64 zsh-completion
      extra_envs:
        - 'QA_PREBUILT="/opt/*"'
      inherit:
        - bash-completion-r1
        - desktop
        - eutils
        - pax-utils
        - xdg
      body: |
        src_unpack() {
          default
          mv "${WORKDIR}"/VSCode-linux-* "${S}" || die
        }
        src_install() {
          local instdir="/opt/{{ .Values.pn }}"
          local exe=code
          # Cleanup
          rm -r ${S}/resources/app/ThirdPartyNotices.txt || die
          # Disable update server
          sed -e "/updateUrl/d" -i ${S}/resources/app/product.json || die
          pax-mark m "${instdir}/${exe}"
          insinto "${instdir}"
          doins -r *
          dosym "${instdir}/${exec}" "/usr/bin/{{ .Values.pn }}"
          make_wrapper "{{ .Values.pn }}" "${instdir}/${exe}"
          domenu ${FILESDIR}/${PN}.desktop
          newicon ${S}/resources/app/resources/linux/code.png {{ .Values.pn }}.png
          dosym "${instdir}"/bin/"${exe}" "/usr/bin/code"
          fperms +x "${instdir}/${exe}"
          fperms +x "${instdir}/bin/${exe}"
          fperms 4711 "${instdir}/chrome-sandbox"
          fperms +x "${instdir}/resources/app/node_modules/@vscode/ripgrep/bin/rg
          if [ -e "${ED}"/"${instdir}"/chrome_crashpad_handler ]; then
            fperms 4755 "${instdir}"/chrome_crashpad_handler
          fi
          insinto "/usr/share/licenses/{{ .Values.pn }}"
          newins "resources/app/LICENSE.rtf" "LICENSE.rtf"
          newbashcomp resources/completions/bash/code code
          if use zsh-completion; then
            insinto /usr/share/zsh/site-functions
            doins "${S}"/resources/completions/zsh/_code
          fi
        }
        pkg_postinst() {
          xdg_desktop_database_update
        }
        pkg_postrm() {
          xdg_desktop_database_update
        }

  packages:
    - vscode-bin:

jetbrains_stuff:
  generator: builtin-json
  defaults:
    template: ../../templates/simple.tmpl
    category: dev-util
    json:
      # Define the URL with params directly
      url: 'https://data.services.jetbrains.com/products/releases'
      params:
        code: '{{ .Values.jid }}'
        latest: 'true'
        type: 'release'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}-amd64.tar.gz'
        url: 'https://download.jetbrains.com/{{ .Values.download_path }}/{{ .Values.tarball_prefix }}-{{ .Values.version }}.tar.gz'
        use: amd64

      - name: '{{ .Values.pn }}-{{ .Values.version }}-aarch64.tar.gz'
        url: 'https://download.jetbrains.com/{{ .Values.download_path }}/{{ .Values.tarball_prefix }}-{{ .Values.version }}-aarch64.tar.gz'
        use: arm64
    vars:
      inherit:
        - desktop
        - eutils
        - xdg
      iuse: +system-java +sysctl
      rdepend: |
        system-java? ( virtual/jre )
        dev-libs/libdbusmenu
        dev-python/pip
      extra_envs:
        - |
          QA_PREBUILT="opt/${PN}/bin/fsnotifier
            opt/${PN}/bin/fsnotifier64
            opt/${PN}/bin/fsnotifier-arm
            opt/${PN}/bin/libyjpagent-linux.so
            opt/${PN}/bin/libyjpagent-linux64.so"

      body: |
        post_src_unpack() {
          if [ ! -d "$S" ]; then
            einfo "Renaming source directory to predictable name..."
            mv $(ls "${WORKDIR}") "{{ .Values.srcdir }}-{{ .Values.version }}" || die
          fi
        }
        src_install() {
          patchelf --set-rpath '$ORIGIN' jbr/lib/jcef_helper jbr/lib/libjcef.so
          local dir="/opt/{{ .Values.pn }}"
          local dst="${D}${dir}"
          insinto "${dir}"
          mv "${S}"/* "${dst}"
          local bundled_script_name="${PN%-*}.sh" # bundled script is always lowercase, and doesn't have -ultimate, -professional suffix.
          make_wrapper "{{ .Values.pn }}" "${dir}/bin/$bundled_script_name" || die
          local svgfile="$(find ${dst}/bin -maxdepth 1 -iname '*.svg')"
          newicon $svgfile "{{ .Values.pn }}.svg" || die
          local pngfile="$(find ${dst}/bin -maxdepth 1 -iname '*.png')"
          newicon $pngfile "{{ .Values.pn }}.png" || die
          make_desktop_entry {{ .Values.pn }} "{{ .Values.fullname }}" {{ .Values.pn }} "Development;IDE;" || die
          if use system-java; then
            rm -rf "$dst{jbr,jre{64}}" || die "Failed to remove bundled Java"
          fi
          if use sysctl; then
            dodir /etc/sysctl.d
            echo "fs.inotify.max_user_watches = 524288" > "${D}/etc/sysctl.d/30-{{ .Values.pn }}-idea-inotify-watches.conf" || die
          fi
        }
        pkg_postinst() {
          xdg_pkg_postinst
          if use sysctl; then
            ( /etc/init.d/sysctl restart >/dev/null 2>&1 )
            einfo "An /etc/sysctl.d file was installed to optimally configure the IDE, with this"
            einfo "setting:"
          else
            einfo "JetBrains recommends adding the following to /etc/sysctl.conf:"
          fi
          einfo
          einfo "fs.inotify.max_user_watches = 524288"
          einfo
          einfo "See https://confluence.jetbrains.com/display/IDEADEV/Inotify+Watches+Limit for"
          einfo "more information."
          if use sysctl; then
            einfo "If this change is undesired, set -sysctl in /etc/portage/package.use."
          fi
        }


  packages:
    - goland:
        json:
          version_filter: "$['GO'][0].version"
        vars:
          download_path: go
          tarball_prefix: goland
          jid: GO
          fullname: GoLand
          desc: Golang IDE by JetBrains
          license: JetBrains
          homepage: https://www.jetbrains.com/go
          srcdir: GoLand

    - clion:
        json:
          version_filter: "$['CL'][0].version"
        vars:
          download_path: cpp
          tarball_prefix: CLion
          fullname: CLion
          description: Cross-platform IDE for C and C++
          license: JetBrains
          homepage: https://www.jetbrains.com/clion
          jid: CL
          srcdir: CLion

    - datagrip:
        json:
          version_filter: "$['DG'][0].version"
        vars:
          download_path: datagrip
          tarball_prefix: datagrip
          fullname: DataGrip
          description: Cross-Platform IDE for Databases & SQL
          license: JetBrains
          homepage: https://www.jetbrains.com/datagrip
          jid: DG
          srcdir: DataGrip

    - idea-community:
        json:
          version_filter: "$['IIC'][0].version"
        vars:
          download_path: idea
          tarball_prefix: ideaIC
          fullname: IntelliJ IDEA Community Edition
          description: a Java IDE by JetBrains (Community Edition)
          license: JetBrains
          homepage: https://www.jetbrains.com/idea
          jid: IIC
          srcdir: idea-IC

    - idea-ultimate:
        json:
          version_filter: "$['IIU'][0].version"
        vars:
          download_path: idea
          tarball_prefix: ideaIU
          fullname: IntelliJ IDEA Ultimate
          description: a Java IDE by JetBrains (Ultimate Edition)
          license: JetBrains
          homepage: https://www.jetbrains.com/idea
          jid: IIU
          srcdir: idea-IU

    - phpstorm:
        json:
          version_filter: "$['PS'][0].version"
        vars:
          download_path: webide
          tarball_prefix: PhpStorm
          fullname: PhpStorm
          description: a PHP IDE by JetBrains
          license: JetBrains
          homepage: https://www.jetbrains.com/phpstorm
          jid: PS
          srcdir: PhpStorm

    - pycharm-community:
        json:
          version_filter: "$['PCC'][0].version"
        vars:
          download_path: python
          tarball_prefix: pycharm-community
          fullname: PyCharm Community Edition
          description: Intelligent Python IDE with unique code assistance and analysis
          license: JetBrains
          homepage: https://www.jetbrains.com/python
          jid: PCC
          srcdir: pycharm

    - pycharm-professional:
        json:
          version_filter: "$['PCP'][0].version"
        vars:
          download_path: python
          tarball_prefix: pycharm
          fullname: PyCharm Professional
          description: Intelligent Python IDE with unique code assistance and analysis
          license: JetBrains
          homepage: https://www.jetbrains.com/python
          jid: PCP
          srcdir: pycharm

    - rubymine:
        json:
          version_filter: "$['RM'][0].version"
        vars:
          download_path: ruby
          tarball_prefix: RubyMine
          fullname: RubyMine
          description: The Most Intelligent Ruby and Rails IDE
          license: JetBrains
          homepage: https://www.jetbrains.com/ruby
          jid: RM
          srcdir: rubymine

    - webstorm:
        json:
          version_filter: "$['WS'][0].version"
        vars:
          download_path: webstorm
          tarball_prefix: WebStorm
          fullname: WebStorm
          description: The smartest JavaScript IDE
          license: JetBrains
          homepage: http://www.jetbrains.com/webstorm
          jid: WS
          srcdir: webstorm

    - jetbrains-toolbox:
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-amd64.tar.gz'
            url: 'https://download.jetbrains.com/{{ .Values.download_path }}/{{ .Values.tarball_prefix }}-{{ .Values.version }}.tar.gz'
            use: amd64

          - name: '{{ .Values.pn }}-{{ .Values.version }}-arm64.tar.gz'
            url: 'https://download.jetbrains.com/{{ .Values.download_path }}/{{ .Values.tarball_prefix }}-{{ .Values.version }}-arm64.tar.gz'
            use: arm64
        json:
          version_filter: "$['TBA'][0].build"
        vars:
          download_path: toolbox
          tarball_prefix: jetbrains-toolbox
          fullname: JetBrains Toolbox
          description: Manage all your JetBrains Projects and Tools
          license: JetBrains
          homepage: https://www.jetbrains.com/toolbox-app
          jid: TBA
          depend: sys-fs/fuse:0
          rdepend:
          extra_envs:
            - 'QA_PREBUILT="opt/jetbrains-toolbox/jetbrains-toolbox"'
          s: '${WORKDIR}/{{ .Values.pn }}-{{ .Values.version }}/bin'
          body: |
            src_install() {
              keepdir /opt/jetbrains-toolbox
              insinto /opt/jetbrains-toolbox
              doins -r .
              fperms +x /opt/{{ .Values.pn }}/{{ .Values.pn }}
              newicon toolbox-tray-color.png "{{ .Values.pn }}.png"
              make_wrapper "{{ .Values.pn }}" /opt/jetbrains-toolbox/jetbrains-toolbox
              mkdir -p "${ED}"/usr/share/applications
              insinto /usr/share/applications
              doins "${PN}.desktop"
            }
            pkg_postinst() {
              xdg_desktop_database_update
            }
            pkg_postrm() {
              xdg_desktop_database_update
            }


gitkraken:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-vcs
    dir:
      url: https://help.gitkraken.com/gitkraken-desktop/current/
      matcher: 'version-11*'
    transform:
      - kind: string
        match: '#version-'
        replace: ''
      - kind: string
        match: '-'
        replace: '.'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}-amd64.tar.gz'
        url: 'https://release.gitkraken.com/linux/GitKraken-v{{ .Values.version }}.tar.gz'
    vars:
      inherit:
        - eutils
        - pax-utils
        - xdg-utils
      desc: "Git GUI client"
      homepage: "https://www.gitkraken.com/"
      license: "Axosoft, LLC"
      rdepend: |
        x11-libs/libXScrnSaver
        gnome-base/libgnome-keyring
        dev-libs/nss
      depend: '${RDEPEND}'
      s: '${WORKDIR}/{{ .Values.pn }}'
      body: |
        src_install() {
          declare GITKRAKEN_HOME=/opt/${PN}
          # Install gitkraken in /opt
          dodir ${GITKRAKEN_HOME%/*}
          mv "${S}" "${ED}"${GITKRAKEN_HOME} || die
          insinto ${GITKRAKEN_HOME}
          doins "${FILESDIR}/gitkraken.png"
          # Create /usr/bin/gitkraken
          dodir /usr/bin/
          echo '#!/bin/sh' > "${ED}"/usr/bin/${PN}
          echo 'exec /opt/${PN}/${PN} "\$@"' >> "${ED}"/usr/bin/${PN}
          fperms 0755 /usr/bin/${PN}
          fperms 4755 /opt/gitkraken/chrome-sandbox
          insinto /usr/share/applications
          doins "${FILESDIR}/gitkraken.desktop"
        }
        pkg_postinst() {
          xdg_desktop_database_update
        }

  packages:
    - gitkraken:

