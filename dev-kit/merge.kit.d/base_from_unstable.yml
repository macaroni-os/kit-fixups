sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

- name: "dev-kit"
  url: "https://github.com/macaroni-os/dev-kit"
  branch: "mark-unstable"

target:
  name: dev-kit
  url: "https://github.com/macaroni-os/dev-kit"
  branch: mark-iii

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: app-arch/upx-bin

    - pkg: app-misc/jq-bin
    - pkg: app-misc/yq3-bin
    - pkg: app-misc/yq4-bin

    - pkg: dev-cpp/catch
    - pkg: dev-cpp/highway
    - pkg: dev-cpp/xsimd

    # Release 8.0.x
    - pkg: dev-db/mysql-connector-c
      conditions:
        - '<dev-db/mysql-connector-c-8.1'
        - '>dev-db/mysql-connector-c-8.0'

    # Release 8.4.x
    - pkg: dev-db/mysql-connector-c
      conditions:
        - '<dev-db/mysql-connector-c-8.5'
        - '>dev-db/mysql-connector-c-8.4'

    # Release 9.7.x
    - pkg: dev-db/mysql-connector-c
      conditions:
        - '<dev-db/mysql-connector-c-9.8'
        - '>=dev-db/mysql-connector-c-9.7.0'

    - pkg: dev-libs/appstream
    - pkg: dev-libs/ding-libs
    - pkg: dev-libs/dqlite
    - pkg: dev-libs/fribidi
    - pkg: dev-libs/libbpf
    - pkg: dev-libs/libevdev
    - pkg: dev-libs/liblinear
    - pkg: dev-libs/libxslt
    - pkg: dev-libs/libzip
    - pkg: dev-libs/mpc
    - pkg: dev-libs/mpfr
    - pkg: dev-libs/nss
    - pkg: dev-libs/quazip
    - pkg: dev-libs/rinutils
    - pkg: dev-libs/jansson
    - pkg: dev-libs/libmspack
    - pkg: dev-libs/xerces-c

    - pkg: dev-util/bindgen
    - pkg: dev-util/cargo-c
    - pkg: dev-util/cbindgen
    - pkg: dev-util/cmake
    - pkg: dev-util/cmocka
    - pkg: dev-util/go-swagger
    - pkg: dev-util/gn
    - pkg: dev-util/lttng-ust
    - pkg: dev-util/lttng-tools
    - pkg: dev-util/lttng-modules
    - pkg: dev-util/meson
    - pkg: dev-util/ninja
    - pkg: dev-util/pnpm-bin
    - pkg: dev-util/scc
    - pkg: dev-util/unifdef

    - pkg: dev-vcs/hub

    - pkg: sys-apps/osinfo-db
    - pkg: sys-apps/osinfo-db-tools
    - pkg: sys-apps/man-pages
    - pkg: sys-apps/miscfiles

    - pkg: sys-libs/talloc

    - pkg: sys-boot/etcher-bin
    - pkg: sys-boot/grub:2
