            	export ac_cv_prog_STRIP="$(type -P true ) faking strip"

            	econf "${myconf[@]}"
            }

            src_compile() {
            	# The following allows emake to be used
            	emake -j1 -C src auto/osdef.h objects

            	emake
            }

            # Call eselect vi update with --if-unset to respect user's choice
            eselect_vi_update() {
            	ebegin "Calling eselect vi update"
            	eselect vi update --if-unset
            	eend $?
            }

            src_install() {
            	dobin src/gvim
            	dosym gvim /usr/bin/gvimdiff
            	dosym gvim /usr/bin/evim
            	dosym gvim /usr/bin/eview
            	dosym gvim /usr/bin/gview
            	dosym gvim /usr/bin/rgvim
            	dosym gvim /usr/bin/rgview

            	emake -C src DESTDIR="${D}" DATADIR=/usr/share install-icons

            	dodir /usr/share/man/man1
            	echo ".so vim.1" > "${ED}"/usr/share/man/man1/gvim.1 || die "echo failed"
            	echo ".so vim.1" > "${ED}"/usr/share/man/man1/gview.1 || die "echo failed"
            	echo ".so vimdiff.1" > "${ED}"/usr/share/man/man1/gvimdiff.1 || die "echo failed"

            	insinto /etc/vim
            	newins "${FILESDIR}"/gvimrc-r1 gvimrc

            	# Bash completion script
            	newbashcomp "${FILESDIR}"/{{ .Values.pn }}-completion {{ .Values.pn }}
            	bashcomp_alias {{ .Values.pn }} gvimdiff
            	bashcomp_alias {{ .Values.pn }} evim
            	bashcomp_alias {{ .Values.pn }} eview
            	bashcomp_alias {{ .Values.pn }} gview
            	bashcomp_alias {{ .Values.pn }} rgvim
            	bashcomp_alias {{ .Values.pn }} rgview

            	# Don't install the vim desktop file, gvim ships its own
            	rm -v "${ED}"/usr/share/applications/vim.desktop || die "failed to remove vim.desktop"
            }

            pkg_postinst() {
            	# Update documentation tags (from vim-doc.eclass)
            	update_vim_helptags

            	# Update fdo mime stuff
            	xdg_desktop_database_update

            	# Update icon cache
            	xdg_icon_cache_update

            	# Call eselect vi update
            	eselect_vi_update
            }

            pkg_postrm() {
            	# Update documentation tags (from vim-doc.eclass)
            	update_vim_helptags

            	# Update fdo mime stuff
            	xdg_desktop_database_update

            	# Update icon cache
            	xdg_icon_cache_update

            	# Call eselect vi update
            	eselect_vi_update
            }
