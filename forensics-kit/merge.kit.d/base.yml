sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-i"

- name: forensics-kit
  url: "https://github.com/macaroni-os/forensics-kit"
  branch: "mark-iii"

target:
  name: forensics-kit
  url: "https://github.com/macaroni-os/forensics-kit"
  branch: mark-i

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

      - dir: ../../.github/workflows
        to: .github/workflows

      - file: ../../.goreleaser.yml
        to: .goreleaser.yml

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: app-forensics/gobuster
