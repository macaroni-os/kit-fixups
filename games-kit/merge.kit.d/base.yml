sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

- name: "dev-kit"
  url: "https://github.com/macaroni-os/dev-kit"
  branch: "mark-unstable"

- name: "games-kit"
  url: "https://github.com/macaroni-os/games-kit"
  branch: "mark-unstable"

target:
  name: games-kit
  url: "https://github.com/macaroni-os/games-kit"
  branch: mark-iii

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: dev-games/freecell-solver

    - pkg: games-board/crafty
    - pkg: games-board/gnuchess
    - pkg: games-board/stockfish

    - pkg: games-emulation/advancemame
    - pkg: games-emulation/advancescan

    - pkg: games-strategy/0ad
    - pkg: games-strategy/freeciv
    - pkg: games-strategy/openra
    - pkg: games-strategy/warzone2100
    - pkg: games-strategy/ufoai

    - pkg: games-rpg/bass
    - pkg: games-rpg/queen
