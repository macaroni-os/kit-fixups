gnome_apps:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
    rate_duration: "8s"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: gnome-extra
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pkgname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.{{ .Values.tarball_suffix }}$"
      exclude: 'rc|beta|alpha|9[0-9]'
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".{{ .Values.tarball_suffix }}"
        replace: ""
    vars:
      tarball_suffix: 'tar.xz'
      license: LGPL-2.1+
      homepage: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.pkgname | default .Values.pn }}'
      gitlab_user: GNOME

  extensions_defs:
    rust:
      opts:

  packages:

    - d-feet:
        category: dev-util
        vars:
          release: '0.3'
          python_compat: python3+
          desc: Feet is a powerful D-Bus debugger
          license: GPL-2+
          iuse: +X
          required_use: '${PYTHON_REQUIRED_USE}'
          cdepend: |
            ${PYTHON_DEPS}
            dev-libs/glib:2
            x11-libs/gtk+:3[introspection]
            dev-libs/gobject-introspection:=
          depend: '${CDEPEND}'
          rdepend: |
            ${CDEPEND}
            $(python_gen_cond_dep '
              dev-python/pygobject:3[${PYTHON_USEDEP}]
            ')
            sys-apps/dbus
            X? ( x11-libs/libwnck:3[introspection] )
          bdepend: |
            virtual/pkgconfig
            dev-util/itstool
          inherit:
            - gnome3
            - meson
            - python-single-r1
          body: |
            src_prepare() {
              sed -i -e "/desktop,/d" -e "/appdata,/d" data/meson.build
              gnome3_src_prepare
            }
            src_configure() {
              local emesonargs=(
                -Dtests=false
                -Dpython="${EPYTHON}"
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              python_optimize
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
            }

    - gsound:
        category: media-libs
        vars:
          release: '1.0'
          inherit:
            - meson
            - vala
          desc: Thin GObject wrapper around the libcanberra sound event library
          iuse: gtk-doc +introspection +vala
          required_use: |
            vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            media-libs/libcanberra
            introspection? ( dev-libs/gobject-introspection:= )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
            gtk-doc? (
              dev-util/gtk-doc
              app-text/docbook-xml-dtd:4.3
            )
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              use vala && vala_src_prepare
              default
            }
            src_configure() {
              local emesonargs=(
                $(meson_use gtk-doc gtk_doc)
                $(meson_use introspection)
                $(meson_use vala enable_vala)
              )
              meson_src_configure
            }

    - grilo:
        category: media-libs
        vars:
          release: '0.3'
          slot: '0.3/0'
          desc: A framework for easy media discovery and browsing
          inherit:
            - gnome3
            - meson
            - python-any-r1
            - vala
          python_compat: python3+
          iuse: gtk gtk-doc +introspection +network +playlist vala
          required_use: |
            vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            net-libs/libsoup:3
            network? ( dev-libs/libxml2:2 )
            playlist? ( dev-libs/totem-pl-parser:= )
            introspection? ( dev-libs/gobject-introspection:= )
            gtk? (
              net-libs/liboauth
              x11-libs/gtk+:3
            )
          depend: '${RDEPEND}'
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig
            gtk-doc? (
              dev-util/gtk-doc
              app-text/docbook-xml-dtd:4.3
            )
            ${PYTHON_DEPS}
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              sed -i -e "s:'GETTEXT_PACKAGE', meson.project_name():'GETTEXT_PACKAGE', 'grilo-${SLOT%/*}':" meson.build || die
              sed -i -e "s:meson.project_name():'grilo-${SLOT%/*}':" po/meson.build || die
              sed -i -e "s:'grilo':'grilo-${SLOT%/*}':" doc/grilo/meson.build || die
              # Drop explicit unversioned vapigen check
              sed -i -e "/find_program.*vapigen/d" meson.build || die
              # Don't build examples; they get embedded in gtk-doc, thus we don't install the sources with USE=examples either
              sed -i -e "/subdir('examples')/d" meson.build || die
              gnome3_src_prepare
              use vala && vala_src_prepare
            }
            src_configure() {
              local emesonargs=(
                $(meson_use network enable-grl-net)
                $(meson_use playlist enable-grl-pls)
                $(meson_use gtk-doc enable-gtk-doc)
                $(meson_use introspection enable-introspection)
                $(meson_use gtk enable-test-ui)
                $(meson_use vala enable-vala)
              )
              meson_src_configure
            }

    - libgee:
        category: dev-libs
        vars:
          release: '0.20'
          slot: '0.8/2'
          desc: GObject-based interfaces and classes for commonly used data structures
          iuse: +introspection
          inherit:
            - gnome3
            - vala
          rdepend: |
            dev-libs/glib:2
            introspection? ( dev-libs/gobject-introspection:= )
          depend: |
            ${RDEPEND}
            $(vala_depend)
          bdepend: |
            virtual/pkgconfig
          body: |
            src_prepare() {
              vala_src_prepare
              gnome3_src_prepare
            }
            src_configure() {
              gnome3_src_configure \
                $(use_enable introspection)
            }

    - libpeas:
        category: dev-libs
        vars:
          slot: '2'
          release: '2.2'
          python_compat: python3+
          inherit:
            - gnome3
            - meson
            - python-single-r1
            - flag-o-matic
            - vala
          desc: A GObject plugins library
          iuse: glade +gtk lua +python vala
          # it seems that mozjs library is not detected correctly
          # keep USE gjs hidden for now
          #
          #  gjs? (
          #    dev-libs/gjs
          #    dev-lang/spidermonkey
          #  )
          required_use: |
            python? ( ${PYTHON_REQUIRED_USE} )
          rdepend: |
            dev-libs/glib:2
            dev-libs/gobject-introspection:=
            gtk? ( x11-libs/gtk+:3[introspection] )
            lua? (
              dev-lua/lgi
              =dev-lang/lua-5.1*:0
            )
            python? (
              ${PYTHON_DEPS}
              $(python_gen_cond_dep '
                dev-python/pygobject:3[${PYTHON_USEDEP}]
              ')
            )
          depend: '${RDEPEND}'
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            pkg_setup() {
              use python && python-single-r1_pkg_setup
            }
            src_prepare() {
              sed -i "s@subdir('introspection')@generate_gir ? subdir('introspection') :@" tests/libpeas/meson.build
              gnome3_src_prepare
              use vala && vala_src_prepare
            }
            src_configure() {
              # Fix mozjs stuff
              #append-cflags -DXP_LINUX -D__linux__
              #append-cxxflags -DXP_LINUX -D__linux__

              local emesonargs=(
                -Dintrospection=true
                -Dgtk_doc=false
                -Dgjs=false
                $(meson_use lua lua51)
                #$(meson_use gjs)
                $(meson_use python python3)
                $(meson_use vala vapi)
              )
              meson_src_configure
            }

    - libpeas:
        category: dev-libs
        vars:
          release: '1.36'
          python_compat: python3+
          inherit:
            - gnome3
            - meson
            - python-single-r1
            - vala
          desc: A GObject plugins library
          iuse: glade +gtk lua +python vala
          required_use: |
            python? ( ${PYTHON_REQUIRED_USE} )
          rdepend: |
            dev-libs/glib:2
            dev-libs/gobject-introspection:=
            gtk? ( x11-libs/gtk+:3[introspection] )
            lua? (
              dev-lua/lgi
              =dev-lang/lua-5.1*:0
            )
            python? (
              ${PYTHON_DEPS}
              $(python_gen_cond_dep '
                dev-python/pygobject:3[${PYTHON_USEDEP}]
              ')
            )
          depend: '${RDEPEND}'
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            pkg_setup() {
              use python && python-single-r1_pkg_setup
            }
            src_prepare() {
              sed -i "s@subdir('introspection')@generate_gir ? subdir('introspection') :@" tests/libpeas/meson.build
              gnome3_src_prepare
              use vala && vala_src_prepare
            }
            src_configure() {
              local emesonargs=(
                -Dpython2=false
                -Dintrospection=true
                -Ddemos=false
                -Dgtk_doc=false
                $(meson_use lua lua51)
                $(meson_use python python3)
                $(meson_use vala vapi)
                $(meson_use gtk widgetry)
                $(meson_use glade glade_catalog)
              )
              meson_src_configure
            }

    - libgsf:
        vars:
          release: '1.14'
          extra_envs:
            - 'GNOME3_EAUTORECONF=yes'
          inherit:
            - gnome3
          desc: The GNOME Structured File Library
          homepage: https://developer.gnome.org/gsf/
          license: GPL-2 LGPL-2.1
          iuse: bzip2 gtk +introspection
          rdepend: |
            dev-libs/glib:2
            dev-libs/libxml2
            sys-libs/zlib
            bzip2? ( app-arch/bzip2 )
            gtk? (
              x11-libs/gdk-pixbuf:2
              media-gfx/imagemagick
            )
            introspection? ( dev-libs/gobject-introspection:= )
          depend: '${RDEPEND}'
          bdepend: |
            sys-devel/gettext
            dev-util/gtk-doc-am
            dev-util/intltool
            virtual/pkgconfig
          body: |
            src_configure() {
              gnome3_src_configure \
                --disable-static \
                $(use_with bzip2 bz2) \
                $(use_enable introspection) \
                $(use_with gtk gdk-pixbuf)
            }

    - brasero:
        category: app-cdr
        vars:
          release: '3.12'
          inherit:
            - gnome3
          desc: CD/DVD burning application for the GNOME desktop
          license: GPL-2+ CC-BY-SA-3.0
          slot: '0/3.1'
          iuse: +css +introspection +libburn mp3 nautilus playlist tracker
          depend: |
            dev-libs/glib:2
            x11-libs/gtk+:3[introspection]
            media-libs/gstreamer:1.0
            media-libs/gst-plugins-base:1.0
            dev-libs/libxml2:=
            x11-libs/libnotify:=
            media-libs/libcanberra
            x11-libs/libICE
            x11-libs/libSM
            introspection? ( dev-libs/gobject-introspection:= )
            libburn? (
              dev-libs/libburn:=
              dev-libs/libisofs:=
            )
            nautilus? ( gnome-base/nautilus )
            playlist? ( dev-libs/totem-pl-parser:= )
            tracker? ( app-misc/tinysparql:= )
          rdepend: |
            ${RDEPEND}
            media-libs/gst-plugins-good:1.0
            media-plugins/gst-plugins-meta:1.0[mp3?]
            x11-themes/hicolor-icon-theme
            !libburn? (
              app-cdr/cdrdao
              app-cdr/cdrtools
              app-cdr/dvd+rw-tools
            )
          bdepend: |
            dev-util/intltool
            dev-util/itstool
            dev-util/gtk-doc-am
            sys-devel/gettext
            virtual/pkgconfig
          pdepend: |
            gnome-base/gvfs
          body: |
            src_configure() {
              gnome3_src_configure \
                --disable-caches \
                $(use_enable !libburn cdrtools) \
                $(use_enable !libburn cdrkit) \
                $(use_enable !libburn cdrdao) \
                $(use_enable !libburn growisofs) \
                $(use_enable introspection) \
                $(use_enable libburn libburnia) \
                $(use_enable nautilus) \
                $(use_enable playlist) \
                $(use_enable tracker search)
            }

    - gnome-browser-connector:
        vars:
          release: '42'
          python_compat: python3+
          inherit:
            - meson
            - python-single-r1
            - xdg
          desc: OS-native connector counterpart for GNOME Shell browser extension
          license: GPL-3+
          required_use: '${PYTHON_REQUIRED_USE}'
          rdepend: |
            ${PYTHON_DEPS}
            $(python_gen_cond_dep 'dev-python/pygobject:3[${PYTHON_USEDEP}]')
            gnome-base/gnome-shell
            !gnome-extra/chrome-gnome-shell
          depend: '${RDEPEND}'
          patches:
            - gnome-browser-connector-42.1-python-path.patch
          body: |
            src_install() {
              meson_src_install
              # fix shebang (python_fix_shebang doesn't work correctly for this).
              sed -i -e '1s:#!.*:#!/usr/bin/python:g' "${D}"/usr/bin/${PN}
              sed -i -e '1s:#!.*:#!/usr/bin/python:g' "${D}"/usr/bin/${PN}-host
              python_optimize
              # Macaroni OS uses split-user rootfs
              insinto /usr/lib/mozilla/native-messaging-hosts
              for id in chrome_gnome_shell browser_connector; do
                doins "${ED}/usr/$(get_libdir)/mozilla/native-messaging-hosts/org.gnome.${id}.json"
              done
            }
            pkg_postinst() {
              xdg_pkg_postinst

              elog "Please note that this package provides OS-native connector only."
              elog "You can install browser extension using link provided at"
              elog "https://extensions.gnome.org website."
            }

