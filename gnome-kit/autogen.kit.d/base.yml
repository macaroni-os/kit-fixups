          desc: Library providing a virtual terminal emulator widget
          license: 'LGPL-3+ GPL-3+'
          slot: '2.91'
          # ICU version required 75 but meson option reports legacy option
          iuse: +crypt debug +glade gtk-doc icu +introspection elogind systemd +vala gtk4
          inherit:
            - flag-o-matic
            - meson
            - python-any-r1
