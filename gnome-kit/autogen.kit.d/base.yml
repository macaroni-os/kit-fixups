              local emesonargs=(
                -Dman=true
                -Dextract=true
                -Dfunctional_tests=false
                -Dtests_tap_protocol=false
                -Dminer_fs=true
                -Dwriteback=true
                -Dabiword=true
                -Dicon=true
                -Dmp3=true
                -Dps=true
