              media-libs/libglvnd[X]
              x11-libs/libX11
              x11-libs/libXcomposite
              x11-libs/libXcursor
              x11-libs/libXdamage
              x11-libs/libXext
              x11-libs/libXfixes
              x11-libs/libXi
              x11-misc/xkeyboard-config
              x11-libs/libXrandr
              x11-libs/libxcb:=
              x11-libs/libXinerama
              x11-libs/libXau
              x11-libs/startup-notification
              x11-libs/libICE
              x11-libs/libxkbfile
              x11-libs/libXtst
              x11-libs/libSM
            )
          depend: |
            ${RDEPEND}
            x11-base/xorg-proto
            sysprof? ( dev-util/sysprof )
          bdepend: |
