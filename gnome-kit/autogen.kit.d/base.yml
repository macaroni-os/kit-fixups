                -Ddoc_tests=false
                -Dtests=false
                -Dautobahn=disabled
                -Dinstalled_tests=false
                -Dpkcs11_tests=disabled
                -Dsysprof=disabled
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use gtk-doc; then
