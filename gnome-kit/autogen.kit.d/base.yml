cairo_stuff:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: dev-cpp
    dir:
      url: https://cairographics.org/releases/
      matcher: "{{ .Values.pn }}-1[.0-9]+.*.tar.xz$"
    vars:
      inherit:
        - meson
        - python-any-r1
      python_compat: python3+
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""

  packages:
    - cairomm:
        vars:
          desc: C++ bindings for the Cairo vector graphics library
          homepage: https://cairographics.org/cairomm/ https://gitlab.freedesktop.org/cairo/cairomm
          license: LGPL-2+
          slot: 1
          iuse: gtk-doc X
          rdepend: |
            dev-libs/libsigc++:3
            x11-libs/cairo
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
            gtk-doc? (
              ${PYTHON_DEPS}
              dev-cpp/mm-common
              app-text/doxygen[dot]
              dev-libs/libxslt
            )
          body: |
            pkg_setup() {
              use gtk-doc && python-any-r1_pkg_setup
            }
            src_configure() {
              local emesonargs=(
                -Dbuild-documentation=$(usex gtk-doc true false)
                -Dbuild-examples=false
                -Dbuild-tests=false
                -Dboost-shared=true
              )
              meson_src_configure
            }


virtual_pkgs:
  generator: builtin-noop
  template:
    engine: helm

  defaults:
    template: ../../templates/simple.tmpl
    category: virtual
  packages:
    # TODO: this package could be removed after the upgrade to GNOME 49
    - atk:
        category: dev-libs
        vars:
          desc: GTK+ & Gnome Accessibility Toolkit Metadata
          homepage: https://wiki.gnome.org/Accessibility
          iuse: +introspection
          versions:
            - "2.58.0"
          rdepend: |
            >=app-accessibility/at-spi2-core-2.58.0[introspection?]

    # TODO: this package could be removed after the upgrade to GNOME 49
    - at-spi2-atk:
        category: app-accessibility
        vars:
          desc: Gtk module for bridging AT-SPI to Atk Metadata
          homepage: https://wiki.gnome.org/Accessibility
          slot: 2
          versions:
            - "2.46.0"
          rdepend: |
            >=app-accessibility/at-spi2-core-{{ .Values.version }}

    - libgudev:
        vars:
          desc: Virtual for libgudev providers
          iuse: introspection
          rdepend: |
            >=dev-libs/libgudev-237[introspection?]
          versions:
            - "237"

    - notification-daemon:
        vars:
          desc: Virtual for notification daemon dbus service
          iuse: gnome kde
          versions:
            - "1"
          rdepend: |
            gnome? ( || (
                x11-misc/notification-daemon
                gnome-base/gnome-shell
              )
            )
            kde? ( kde-plasma/plasma-workspace )
            !gnome? ( !kde? ( || (
                  x11-misc/notification-daemon
                  xfce-extra/xfce4-notifyd
                  x11-wm/enlightenment[enlightenment_modules_notification]
                  x11-wm/enlightenment[e_modules_notification]
                  lxqt-base/lxqt-notificationd
                )
              )
            )


