            dev-libs/glib:2
            dev-db/sqlite
            dev-libs/libxml2
            brotli? ( app-arch/brotli )
            net-libs/libpsl
            sys-libs/zlib
            gssapi?  ( virtual/krb5 )
            introspection? ( dev-libs/gobject-introspection:= )
            samba? ( net-fs/samba )
          depend: '${CDEPEND}'
          rdepend: |
            ${CDEPEND}
            net-libs/glib-networking[ssl?]
          bdepend: |
            gtk-doc? (
