                $(meson_use systemd)
                $(meson_use elogind)
                $(meson_use colord)
                $(meson_use cups)
                $(meson_use networkmanager network_manager)
                $(meson_use smartcard)
                $(meson_use modemmanager wwan)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              # Don't auto-suspend by default on AC power
              insinto /usr/share/glib-2.0/schemas
              doins "${FILESDIR}"/org.gnome.settings-daemon.plugins.power.gschema.override
            }
            pkg_postinst() {
              udev_reload
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              udev_reload
              gnome3_pkg_postinst
            }

    - gnome-control-center:
        category: gnome-base
        vars:
          release: '48'
          inherit:
            - gnome3
            - meson
            - flag-o-matic
            - python-any-r1
            - xdg
          python_compat: python3+
          desc: GNOME's main interface to configure various aspects of the desktop
          homepage: https://apps.gnome.org/Settings
          license: GPL-2+ CC-BY-SA-2.5
          # TODO: move to SLOT 0 in the near future
          slot: 2
          iuse: |
            X +bluetooth +cups debug elogind +gnome-online-accounts +ibus input_devices_wacom
            kerberos +geolocation networkmanager systemd wayland
          required_use: |
            ^^ ( elogind systemd )
          rdepend: |
            gnome-online-accounts? (
              x11-libs/gtk+:3[X,wayland]
              net-libs/gnome-online-accounts:=
            )
            media-sound/pulseaudio[glib]
            x11-libs/gtk:4[X,wayland]
            x11-libs/libadwaita
            sys-apps/accountsservice
            x11-misc/colord:=
            x11-libs/gdk-pixbuf
            dev-libs/glib:2
            gnome-base/gnome-desktop:=
            >=gnome-base/gnome-settings-daemon-{{ .Values.release }}[colord,input_devices_wacom?]
            >=gnome-base/gsettings-desktop-schemas-{{ .Values.release }}
            dev-libs/libxml2:2=
            sys-power/upower:=
            dev-libs/libgudev
            x11-libs/libX11
            x11-libs/libXi
            media-libs/libepoxy
            app-crypt/gcr
            dev-libs/libpwquality
            sys-auth/polkit
            cups? (
              net-print/cups[dbus]
              net-fs/samba[client]
            )
            ibus? ( app-i18n/ibus )
            networkmanager? (
              net-libs/libnma[gtk4]
              net-misc/networkmanager[modemmanager]
              net-misc/modemmanager:=
            )
            bluetooth? ( net-wireless/gnome-bluetooth:= )
            input_devices_wacom? ( dev-libs/libwacom:= )
            kerberos? ( app-crypt/mit-krb5 )
            x11-libs/cairo[glib]
            x11-libs/colord-gtk:=
            media-libs/fontconfig
            gnome-base/libgtop:=
            sys-fs/udisks:2
            app-crypt/libsecret
            net-libs/gnutls:=
            media-libs/gsound
            x11-libs/pango
            media-libs/libcanberra[pulseaudio,sound(+)]
            systemd? ( sys-apps/systemd )
            elogind? (
              app-admin/openrc-settingsd
              sys-auth/elogind
            )
            x11-themes/adwaita-icon-theme
            gnome-extra/gnome-color-manager
            cups? (
              app-admin/system-config-printer
              net-print/cups-pk-helper
            )
            gnome-extra/tecla
            wayland? ( dev-libs/libinput )
            !wayland? (
              x11-drivers/xf86-input-libinput
              input_devices_wacom? ( x11-drivers/xf86-input-wacom )
            )
          depend: '${RDEPEND}'
          bdepend: |
            ${PYTHON_DEPS}
            dev-libs/libxslt
            app-text/docbook-xsl-stylesheets
            app-text/docbook-xml-dtd:4.2
            x11-base/xorg-proto
            dev-libs/libxml2:2
            dev-util/gdbus-codegen
            dev-util/blueprint-compiler
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            pkg_setup() {
              python-any-r1_pkg_setup
            }
            src_prepare() {
              default
              xdg_environment_reset
            }
            src_configure() {
              # Do not trust with LTO either
              append-flags -fno-strict-aliasing
              filter-lto
              local emesonargs=(
                $(meson_use ibus)
                -Ddeprecated-declarations=disabled
                -Ddocumentation=true # manpage
                -Dlocation-services=$(usex geolocation enabled disabled)
                -Dprivileged_group=wheel
                -Dsnap=false
                -Dtests=false
                -Dmalcontent=false # unpackaged
                -Ddistributor_logo=/usr/share/pixmaps/gnome-control-center-macaroni-logo.svg
                -Ddark_mode_distributor_logo=/usr/share/pixmaps/gnome-control-center-macaroni-logo-dark.svg
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              insinto /usr/share/pixmaps
              doins "${FILESDIR}"/gnome-control-center-macaroni-logo.svg
              doins "${FILESDIR}"/gnome-control-center-macaroni-logo-dark.svg
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
            }

