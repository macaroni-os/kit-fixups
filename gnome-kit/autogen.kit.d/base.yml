            )

          body: |
            src_prepare() {
              default
              # Force sysprof-capture-4 instead of checking sysprof-capture-3 first; either is
              # fine as far as deps are concerned, as it static links, but sysprof-capture-3
              # links to glib which would be done statically if there's glib[static-libs],
              # making the whole of gtk+ static link to glib instead of dynamic linking to glib.
              sed -i -e "s/'sysprof-capture-3'/'sysprof-capture-4'/g" meson.build || die
            }
            src_configure() {
              local emesonargs=(
                -Dquartz_backend=false
                $(meson_use broadway broadway_backend)
                $(meson_use cloudproviders)
                $(meson_use examples demos)
                $(meson_use examples)
                -Dgtk_doc=$(usex gtk-doc true false)
                -Dintrospection=$(usex introspection true false)
                $(meson_use sysprof profiler)
                $(meson_use wayland wayland_backend)
                $(meson_use X x11_backend)
                -Dcolord=$(usex colord yes no)
                -Dprint_backends=$(usex cups cups,file,lpr file,lpr)
                -Dxinerama=$(usex xinerama yes no)
                # Include backend immodules into gtk itself, to avoid problems like
                # https://gitlab.gnome.org/GNOME/gnome-shell/issues/109 from a
                # user overridden GTK_IM_MODULE envvar
                -Dbuiltin_immodules=backend
                -Dman=true
                -Dtests=false
                -Dtracker3=false
              )
              meson_src_configure
            }
            src_install_all() {
              meson_src_install
              insinto /etc/gtk-3.0
              doins "${FILESDIR}"/settings.ini
              # Skip README.win32.md that would get installed by default
              DOCS=( NEWS README.md )
              einstalldocs
            }
            pkg_preinst() {
              gnome3_pkg_preinst
              # Make immodules.cache belongs to gtk+ alone
              local cache="/usr/$(get_libdir)/gtk-3.0/3.0.0/immodules.cache"
              if [[ -e ${EROOT}${cache} ]]; then
                cp "${EROOT}${cache}" "${ED}${cache}" || die
              else
                touch "${ED}${cache}" || die
              fi
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
              if [[ -z ${REPLACED_BY_VERSION} ]]; then
                rm -f "${EROOT}/usr/$(get_libdir)/gtk-3.0/3.0.0/immodules.cache"
              fi
            }

    - gtk:
        category: x11-libs
        vars:
          release: '4.20'
          python_compat: python3+
          license: LGPL-2+
          inherit:
            - meson
            - gnome3
            - python-any-r1
            - toolchain-funcs
          desc: GTK is a multi-platform toolkit for creating graphical user interfaces
          homepage: https://www.gtk.org/ https://gitlab.gnome.org/GNOME/gtk/
          required_use: |
            || ( aqua wayland X )
            gtk-doc? ( introspection )
          iuse: |
            aqua broadway cloudproviders colord cups cups examples
            gstreamer gtk-doc +introspection sysprof vulkan wayland
            +X
          cdepend: |
            dev-libs/glib:2
            x11-libs/cairo[aqua?,glib,X?]
            x11-libs/pango[introspection?]
            dev-libs/fribidi
            media-libs/harfbuzz:=
            x11-libs/gdk-pixbuf:2[introspection?]
            media-libs/libpng:=
            media-libs/tiff:=
            media-libs/libjpeg-turbo:=
            gnome-base/librsvg:2
            media-libs/libepoxy[egl(+),X(+)?]
            media-libs/graphene[introspection?]
            app-text/iso-codes
            x11-misc/shared-mime-info
            cloudproviders? ( net-libs/libcloudproviders )
            colord? ( x11-misc/colord:= )
            cups? ( net-print/cups )
            examples? ( gnome-base/librsvg:2 )
            gstreamer? (
              media-libs/gstreamer
              media-libs/gst-plugins-bad
              || (
                media-libs/gst-plugins-base[gles2]
                media-libs/gst-plugins-base[opengl]
              )
            )
            introspection? ( dev-libs/gobject-introspection:= )
            vulkan? ( media-libs/vulkan-loader[wayland?,X?] )
            wayland? (
              dev-libs/wayland
              dev-libs/wayland-protocols
              media-libs/mesa[wayland]
              x11-libs/libxkbcommon
            )
            X? (
              media-libs/fontconfig
              media-libs/mesa[X(+)]
              x11-libs/libX11
              x11-libs/libXi
              x11-libs/libXext
              x11-libs/libXcursor
              x11-libs/libXfixes
              x11-libs/libXdamage
              x11-libs/libXinerama
            )
          depend: |
            ${CDEPEND}
            x11-libs/libdrm
            sys-kernel/linux-headers
            sysprof? ( dev-util/sysprof )
            X? ( x11-base/xorg-proto )
          rdepend: |
            ${CDEPEND}
            dev-util/gtk-update-icon-cache
          pdepend: |
            x11-themes/adwaita-icon-theme
          bdepend: |
            dev-libs/gobject-introspection-common
            introspection? (
              ${PYTHON_DEPS}
              $(python_gen_any_dep '
                dev-python/pygobject:3[${PYTHON_USEDEP}]
              ')
            )
            dev-python/docutils
            dev-util/gdbus-codegen
            sys-devel/gettext
            virtual/pkgconfig
            gtk-doc? ( dev-util/gi-docgen )
            vulkan? ( media-libs/shaderc )
            wayland? ( dev-util/wayland-scanner )
          slot: 4
          body: |
            pkg_setup() {
              use introspection && python-any-r1_pkg_setup
            }
            src_prepare() {
              default
              xdg_environment_reset
              # Nothing should use gtk4-update-icon-cache and an unversioned one
              # is shipped by dev-util/gtk-update-icon-cache
              sed -i \
                -e '/gtk4-update-icon-cache/d' \
                docs/reference/gtk/meson.build \
                tools/meson.build \
                || die
            }
            src_configure() {
              local emesonargs=(
                # GDK backends
                $(meson_use X x11-backend)
                $(meson_use wayland wayland-backend)
                $(meson_use broadway broadway-backend)
                -Dwin32-backend=false
                -Dandroid-backend=false
                $(meson_use aqua macos-backend)
                # Media backends
                $(meson_feature gstreamer media-gstreamer)
                # Print backends
                -Dprint-cpdb=disabled
                $(meson_feature cups print-cups)
                $(meson_feature vulkan)
                $(meson_feature cloudproviders)
                $(meson_feature sysprof)
                -Dtracker=disabled  # tracker3 is not packaged
                $(meson_feature colord)
                -Dandroid-runtime=disabled
                $(meson_feature introspection)
                $(meson_use gtk-doc documentation)
                -Dscreenshots=false
                -Dman-pages=true
                -Dprofile=default
                $(meson_use examples build-demos)
                $(meson_use examples build-examples)
                -Dbuild-testsuite=false
                -Dbuild-tests=false
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use gtk-doc; then
                mkdir -p "${ED}"/usr/share/gtk-doc/html/ || die
                mv "${ED}"/usr/share/doc/{gtk4,gsk4,gdk4{,-wayland,-x11}} "${ED}"/usr/share/gtk-doc/html/ || die
              fi
            }
            pkg_preinst() {
              gnome3_pkg_preinst
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
            }

