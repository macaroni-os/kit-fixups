    - totem-pl-parser:
        category: dev-libs
        vars:
          release: '3.26'
          inherit:
            - meson
            - flag-o-matic
          desc: Playlist parsing library
          homepage: https://developer.gnome.org/totem-pl-parser/stable/
          iuse: archive crypt gtk-doc +introspection +uchardet
          rdepend: |
            dev-libs/glib:2
            archive? ( app-arch/libarchive:= )
