            gtk-doc? ( dev-util/gi-docgen )
            vala? ( $(vala_depend) )
            virtual/pkgconfig
            dev-util/cargo-c
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            src_prepare() {
