    - gtk+:
        category: x11-libs
        tarball: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
        dir:
          matcher: "gtk%2B-.*.tar.xz$"
        transform:
          - kind: string
            match: "gtk%2B-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
            category: x11-libs
        vars:
          release: '2.24'
          slot: 2
          desc: Gimp ToolKit +
          homepage: https://www.gtk.org/
          iuse: cups examples +introspection vim-syntax xinerama
          inherit:
            - autotools
            - flag-o-matic
            - gnome3
          cdepend: |
            app-accessibility/at-spi2-core[introspection?]
            dev-libs/glib:2
            media-libs/fontconfig
            x11-libs/cairo
            x11-libs/gdk-pixbuf:2[introspection?]
            x11-libs/pango[introspection?]

            cups? ( net-print/cups:= )
            introspection? ( dev-libs/gobject-introspection:= )
            x11-libs/cairo[X]
            x11-libs/libXrender
            x11-libs/libX11
            x11-libs/libXi
            x11-libs/libXext
            x11-libs/libXrandr
            x11-libs/libXcursor
            x11-libs/libXfixes
            x11-libs/libXcomposite
            x11-libs/libXdamage
            xinerama? ( x11-libs/libXinerama )
          rdepend: |
            ${CDEPEND}
            dev-util/gtk-update-icon-cache
            x11-themes/gnome-themes-standard
          depend: |
            ${CDEPEND}
            app-text/docbook-xsl-stylesheets
            app-text/docbook-xml-dtd:4.1.2
            app-text/docbook-xml-dtd:4.3
            dev-libs/libxslt
            dev-libs/gobject-introspection-common
            dev-util/gtk-doc-am
            sys-devel/gettext
            virtual/pkgconfig
          pdepend: |
            gnome-base/librsvg
            x11-themes/adwaita-icon-theme
            x11-themes/gtk-engines-adwaita
            vim-syntax? ( app-vim/gtk-syntax )

          body: |
            strip_builddir() {
              local rule=$1
              shift
              local directory=$1
              shift
              sed -e "s/^\(${rule} =.*\)${directory}\(.*\)$/\1\2/" -i $@ \
                || die "Could not strip director ${directory} from build."
            }
            src_prepare() {
              # Various glib marshaller churn could break build against a different
              # glib version, force regeneration
              rm -v gdk/gdkmarshalers.{c,h} gtk/gtkmarshal.{c,h} gtk/gtkmarshalers.{c,h} \
                perf/marshalers.{c,h} gtk/gtkaliasdef.c gtk/gtkalias.h || die
              # Stop trying to build unmaintained docs, bug #349754, upstream bug #623150
              strip_builddir SUBDIRS tutorial docs/Makefile.{am,in}
              strip_builddir SUBDIRS faq docs/Makefile.{am,in}
              # -O3 and company cause random crashes in applications, bug #133469
              replace-flags -O3 -O2
              strip-flags
              # don't waste time building tests
              strip_builddir SRC_SUBDIRS tests Makefile.{am,in}
              strip_builddir SUBDIRS tests gdk/Makefile.{am,in} gtk/Makefile.{am,in}

              if ! use examples; then
                # don't waste time building demos
                strip_builddir SRC_SUBDIRS demos Makefile.{am,in}
              fi

              # Fix tests running when building out of sources, bug #510596, upstream bug #730319
              eapply "${FILESDIR}"/${PN}-2.24.24-out-of-source.patch

              # Rely on split gtk-update-icon-cache package, bug #528810
              eapply "${FILESDIR}"/${PN}-2.24.31-update-icon-cache.patch

              # Upstream gtk-2-24 branch up to 2018-09-08 state, bug #650536 safety
              eapply "${FILESDIR}"/patches-2.24

              # Fix compilation with cups 2.x
              eapply "${FILESDIR}"/${PN}-2.0-cups2.patch

              eautoreconf
              gnome3_src_prepare
            }
            src_configure() {
              ECONF_SOURCE=${S} \
              gnome3_src_configure \
                --with-gdktarget=x11 \
                --with-xinput \
                $(use_enable cups cups auto) \
                $(use_enable introspection) \
                $(use_enable xinerama) \
                --disable-papi \
                --enable-man \
                --with-xml-catalog="${EPREFIX}"/etc/xml/catalog \
                CUPS_CONFIG="${EPREFIX}/usr/bin/${CHOST}-cups-config"
              # work-around gtk-doc out-of-source brokedness
              local d
              for d in gdk gtk libgail-util; do
                ln -s "${S}"/docs/reference/${d}/html docs/reference/${d}/html || die
              done
            }
            src_install() {
              gnome3_src_install
              # see bug #133241
              # Also set more default variables in sync with gtk3 and other distributions
              echo 'gtk-fallback-icon-theme = "gnome"' > "${T}/gtkrc"
              echo 'gtk-theme-name = "Adwaita"' >> "${T}/gtkrc"
              echo 'gtk-icon-theme-name = "Adwaita"' >> "${T}/gtkrc"
              echo 'gtk-cursor-theme-name = "Adwaita"' >> "${T}/gtkrc"
              insinto /usr/share/gtk-2.0
              doins "${T}"/gtkrc
              einstalldocs
            }
            pkg_preinst() {
              gnome3_pkg_preinst
              # Make immodules.cache belongs to gtk+ alone
              local cache="usr/$(get_libdir)/gtk-2.0/2.10.0/immodules.cache"
              if [[ -e ${EROOT}${cache} ]]; then
                cp "${EROOT}"${cache} "${ED}"/${cache} || die
              else
                touch "${ED}"/${cache} || die
              fi
            }
            pkg_postinst() {
              gnome3_pkg_postinst
              gnome3_query_immodules_gtk2 \
                || ewarn "Update immodules cache had some problems (for ${ABI}) (this may be transient)"
              GTK2_CONFDIR="/etc/gtk-2.0/${CHOST}"
              if [ -e "${EROOT%/}/etc/gtk-2.0/gtk.immodules" ]; then
                elog "File /etc/gtk-2.0/gtk.immodules has been moved to \$CHOST"
                elog "aware location. Removing deprecated file."
                rm -f ${EROOT%/}/etc/gtk-2.0/gtk.immodules
              fi
              if [ -e "${EROOT%/}${GTK2_CONFDIR}/gtk.immodules" ]; then
                elog "File /etc/gtk-2.0/gtk.immodules has been moved to"
                elog "${EROOT%/}/usr/$(get_libdir)/gtk-2.0/2.10.0/immodules.cache"
                elog "Removing deprecated file."
                rm -f ${EROOT%/}${GTK2_CONFDIR}/gtk.immodules
              fi
              # pixbufs are now handled by x11-libs/gdk-pixbuf
              if [ -e "${EROOT%/}${GTK2_CONFDIR}/gdk-pixbuf.loaders" ]; then
                elog "File ${EROOT%/}${GTK2_CONFDIR}/gdk-pixbuf.loaders is now handled by x11-libs/gdk-pixbuf"
                elog "Removing deprecated file."
                rm -f ${EROOT%/}${GTK2_CONFDIR}/gdk-pixbuf.loaders
              fi
              # two checks needed since we dropped multilib conditional
              if [ -e "${EROOT%/}/etc/gtk-2.0/gdk-pixbuf.loaders" ]; then
                elog "File ${EROOT%/}/etc/gtk-2.0/gdk-pixbuf.loaders is now handled by x11-libs/gdk-pixbuf"
                elog "Removing deprecated file."
                rm -f ${EROOT%/}/etc/gtk-2.0/gdk-pixbuf.loaders
              fi
              if [ -e "${EROOT%/}"/usr/lib/gtk-2.0/2.[^1]* ]; then
                elog "You need to rebuild ebuilds that installed into" "${EROOT%/}"/usr/lib/gtk-2.0/2.[^1]*
                elog "to do that you can use qfile from portage-utils:"
                elog "emerge -va1 \$(qfile -qC ${EPREFIX}/usr/lib/gtk-2.0/2.[^1]*)"
              fi
            }
            pkg_postrm() {
              gnome3_pkg_postrm
              if [[ -z ${REPLACED_BY_VERSION} ]]; then
                rm -f "${EROOT}"usr/$(get_libdir)/gtk-2.0/2.10.0/immodules.cache
              fi
            }

    - gtk+:
        category: x11-libs
        vars:
          pkgname: gtk
          release: '3.24'
          slot: 3
          s: '${WORKDIR}/{{ .Values.pkgname }}-{{ .Values.version }}'
          desc: Gimp ToolKit +
          homepage: https://www.gtk.org/
          iuse: broadway cloudproviders colord cups examples gtk-doc +introspection sysprof vim-syntax wayland +X xinerama
          required_use: |
            || ( wayland X )
            xinerama? ( X )
            colord? ( cups )
          inherit:
            - gnome3
            - meson
            - toolchain-funcs
          patches:
            - gtk+-3.24.36-update-icon-cache.patch
          cdepend: |
            app-accessibility/at-spi2-core[introspection?]
            dev-libs/fribidi
            dev-libs/glib:2
            media-libs/fontconfig
            media-libs/harfbuzz:=
            media-libs/libepoxy[X(+)?,egl(+)]
            virtual/libintl
            x11-libs/cairo[glib,X?]
            x11-libs/gdk-pixbuf:2[introspection?]
            x11-libs/pango[introspection?]
            x11-misc/shared-mime-info
            cloudproviders? ( net-libs/libcloudproviders )
            colord? ( x11-misc/colord:0= )
            cups? ( net-print/cups )
            introspection? ( dev-libs/gobject-introspection:= )
            wayland? (
              dev-libs/wayland
              dev-libs/wayland-protocols
              media-libs/mesa[wayland]
              x11-libs/libxkbcommon
            )
            X? (
              media-libs/libglvnd[X(+)]
              x11-libs/libX11
              x11-libs/libXcomposite
              x11-libs/libXcursor
              x11-libs/libXdamage
              x11-libs/libXext
              x11-libs/libXfixes
              x11-libs/libXi
              x11-libs/libXrandr
              xinerama? ( x11-libs/libXinerama )
            )
          rdepend: |
            ${CDEPEND}
            dev-util/gtk-update-icon-cache
          depend: |
            ${CDEPEND}
            sysprof? ( dev-util/sysprof )
            X? ( x11-base/xorg-proto )
          pdepend: |
            gnome-base/librsvg
            x11-themes/adwaita-icon-theme
            vim-syntax? ( app-vim/gtk-syntax )
          bdepend: |
            app-text/docbook-xml-dtd:4.1.2
            app-text/docbook-xsl-stylesheets
            dev-libs/gobject-introspection-common
            dev-libs/libxslt
            >=dev-util/gdbus-codegen-2.48
            dev-util/glib-utils
            dev-util/gtk-doc-am
            wayland? ( dev-util/wayland-scanner )
            sys-devel/gettext
            virtual/pkgconfig
            x11-libs/gdk-pixbuf
            gtk-doc? (
              app-text/docbook-xml-dtd:4.3
              dev-util/gtk-doc
            )

          body: |
            src_prepare() {
              default
              # Force sysprof-capture-4 instead of checking sysprof-capture-3 first; either is
              # fine as far as deps are concerned, as it static links, but sysprof-capture-3
              # links to glib which would be done statically if there's glib[static-libs],
              # making the whole of gtk+ static link to glib instead of dynamic linking to glib.
              sed -i -e "s/'sysprof-capture-3'/'sysprof-capture-4'/g" meson.build || die
            }
            src_configure() {
              local emesonargs=(
                -Dquartz_backend=false
                $(meson_use broadway broadway_backend)
                $(meson_use cloudproviders)
                $(meson_use examples demos)
                $(meson_use examples)
                -Dgtk_doc=$(usex gtk-doc true false)
                -Dintrospection=$(usex introspection true false)
                $(meson_use sysprof profiler)
                $(meson_use wayland wayland_backend)
                $(meson_use X x11_backend)
                -Dcolord=$(usex colord yes no)
                -Dprint_backends=$(usex cups cups,file,lpr file,lpr)
                -Dxinerama=$(usex xinerama yes no)
                # Include backend immodules into gtk itself, to avoid problems like
                # https://gitlab.gnome.org/GNOME/gnome-shell/issues/109 from a
                # user overridden GTK_IM_MODULE envvar
                -Dbuiltin_immodules=backend
                -Dman=true
                -Dtests=false
                -Dtracker3=false
              )
              meson_src_configure
            }
            src_install_all() {
              meson_src_install
              insinto /etc/gtk-3.0
              doins "${FILESDIR}"/settings.ini
              # Skip README.win32.md that would get installed by default
              DOCS=( NEWS README.md )
              einstalldocs
            }
            pkg_preinst() {
              gnome3_pkg_preinst
              # Make immodules.cache belongs to gtk+ alone
              local cache="/usr/$(get_libdir)/gtk-3.0/3.0.0/immodules.cache"
              if [[ -e ${EROOT}${cache} ]]; then
                cp "${EROOT}${cache}" "${ED}${cache}" || die
              else
                touch "${ED}${cache}" || die
              fi
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
              if [[ -z ${REPLACED_BY_VERSION} ]]; then
                rm -f "${EROOT}/usr/$(get_libdir)/gtk-3.0/3.0.0/immodules.cache"
              fi
            }

