          bdepend: |
            ${PYTHON_DEPS}
            gtk-doc? (
              dev-util/gtk-doc
              app-text/docbook-xml-dtd:4.2
            )
            dev-libs/libxslt
            dev-util/itstool
            sys-devel/gettext
