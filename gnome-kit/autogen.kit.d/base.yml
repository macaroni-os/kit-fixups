virtual_pkgs:
  generator: builtin-noop
  generator_opts:
    rate_limiter: "1"
    rate_duration: "8s"
  template:
    engine: helm

  defaults:
    template: ../../templates/simple.tmpl
    category: virtual
  packages:

    - gnome-shell-extension-transparent-topbar:
        category: gnome-extra
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.zip'
            url: 'https://extensions.gnome.org/extension-data/transparent-top-barftpix.com.v{{ .Values.version }}.shell-extension.zip'
        vars:
          extra_envs:
            - 'EXTENSION_NAME=transparent-top-bar@ftpix.com'
          license: GPL-2
          homepage: https://github.com/lamarios/gnome-shell-extension-transparent-top-bar
          rdepend: |
            dev-libs/glib:2
            app-eselect/eselect-gnome-shell-extensions
            gnome-base/gnome-shell
          inherit:
            - gnome3-utils
          depend: '${RDEPEND}'
          versions:
            - '26'
          s: '${WORKDIR}/transparent-top-bar-{{ .Values.version }}'
          body: |
            src_unpack() {
              local myp="transparent-top-bar-{{ .Values.version }}"
              cd ${WORKDIR}
              mkdir ${myp}
              cd ${myp}
              unpack ${A}
            }
            src_install() {
              local extdir=/usr/share/gnome-shell/extensions/
              dodir ${extdir}/${EXTENSION_NAME}
              for i in * ; do
                cp -r ${S}/${i} ${D}/${extdir}/${EXTENSION_NAME}/
              done
            }
            pkg_preinst() {
              gnome3_schemas_savelist
            }
            pkg_postinst() {
              gnome3_schemas_update
              ebegin "Updating list of installed extensions"
              eselect gnome-shell-extensions update
              eend $?
            }
            pkg_postrm() {
              gnome3_schemas_update
            }

    # Gentoo maintained package in gnome gitlab.
    # Maybe we can install it directly from gtk?
    - gtk-update-icon-cache:
        category: dev-util
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
            url: 'https://gitlab.gnome.org/Community/gentoo/{{ .Values.pn }}/-/archive/{{ .Values.version }}/{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        vars:
          versions:
            - 3.24.42
          desc: GTK update icon cache
          inherit:
            - meson
          homepage: https://gitlab.gnome.org/Community/gentoo/gtk-update-icon-cache
          rdepend: |
            dev-libs/glib:2
            x11-libs/gdk-pixbuf:2
          depend: '${RDEPEND}'
          bdepend: |
            app-text/docbook-xml-dtd:4.3
            app-text/docbook-xsl-stylesheets
            dev-libs/libxslt
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_install() {
              meson_src_install
              dosym /usr/bin/gtk-update-icon-cache /usr/bin/gtk4-update-icon-cache
            }

    # TODO: this package could be removed after the upgrade to GNOME 49
    - atk:
        category: dev-libs
        vars:
          desc: GTK+ & Gnome Accessibility Toolkit Metadata
          homepage: https://wiki.gnome.org/Accessibility
          iuse: +introspection
          versions:
            - "2.58.0"
          rdepend: |
            >=app-accessibility/at-spi2-core-2.58.0[introspection?]

    # TODO: this package could be removed after the upgrade to GNOME 49
    - at-spi2-atk:
        category: app-accessibility
        vars:
          desc: Gtk module for bridging AT-SPI to Atk Metadata
          homepage: https://wiki.gnome.org/Accessibility
          slot: 2
          versions:
            - "2.46.0"
          pdepend: |
            >=app-accessibility/at-spi2-core-{{ .Values.version }}

    - libgudev:
        vars:
          desc: Virtual for libgudev providers
          iuse: introspection
          rdepend: |
            >=dev-libs/libgudev-238[introspection?]
          versions:
            - "238"

    - notification-daemon:
        vars:
          desc: Virtual for notification daemon dbus service
          iuse: gnome kde
          versions:
            - "1"
          rdepend: |
            gnome? ( || (
                x11-misc/notification-daemon
                gnome-base/gnome-shell
              )
            )
            kde? ( kde-plasma/plasma-workspace )
            !gnome? ( !kde? ( || (
                  x11-misc/notification-daemon
                  xfce-extra/xfce4-notifyd
                  x11-wm/enlightenment[enlightenment_modules_notification]
                  x11-wm/enlightenment[e_modules_notification]
                  lxqt-base/lxqt-notificationd
                )
              )
            )


formulae_brew_pkgs:
  # NOTE: we use adelielinux fork because the sourceforge
