              #echo "GNOME_SETTINGS_DAEMON_DISABLE_PLUGINS=usb-protection" >> ${envfile}
              insinto /etc/env.d/
              doins ${envfile}
            }
            pkg_postinst() {
              macaronictl etc-update
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              local envfile="90gnome-shell"
              rm /etc/env.d/${envfile} 2>&1 >/dev/null
              macaronictl etc-update
              gnome3_pkg_postrm
            }

