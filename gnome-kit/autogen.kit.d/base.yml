  defaults:
    category: net-libs
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    dir:
      url: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/tags'
      matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/tags/1[0-9.-]+.*"
      # Skip release candidate/beta versions
      exclude: 'rc|beta|alpha|dev'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/archive/{{ .Values.original_version }}/{{ .Values.gitlab_repo | default .Values.pn }}-{{ .Values.version }}.tar.bz2'
        #https://gitlab.gnome.org/GNOME/glycin/-/archive/2.0.7/glycin-2.0.7.tar.bz2?ref_type=tags

    vars:
      gitlab_user: GNOME
      s: '${WORKDIR}/{{ .Values.gitlab_repo | default .Values.pn }}-{{ .Values.version }}'

  packages:

    - endeavour:
        category: gnome-extra
        dir:
          matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/releases/[0-9.]+"
        vars:
          gitlab_user: World
          gitlab_repo: Endeavour
          desc: Personal task manager
          inherit:
            - gnome3
            - meson
          license: GPL-3+
          iuse: +introspection
          rdepend: |
            dev-libs/glib:2
            x11-libs/gtk:4[introspection?]
            x11-libs/libadwaita
            net-libs/gnome-online-accounts:=
            dev-libs/libpeas
            gnome-extra/evolution-data-server:=[gtk]
            introspection? ( dev-libs/gobject-introspection:= )
          depend: '${RDEPEND}'
          bdepend: |
            dev-libs/libxml2
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_configure() {
              local emesonargs=(
                $(meson_use introspection)
                -Dtracing=false
                -Dprofile=default
              )
              meson_src_configure
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
            }

    - libnma:
        vars:
          inherit:
            - gnome3
            - meson
            - vala
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
          license: GPL-2+ FDL-1.1+
          iuse: gcr +gtk4 +introspection +vala
          rdepend: |
            app-text/iso-codes
            net-misc/mobile-broadband-provider-info
            dev-libs/glib:2[dbus]
            dev-libs/gobject-introspection:=
            x11-libs/gtk+:3[introspection?]
            gtk4? (
              x11-libs/gtk:4[introspection?]
            )
            gcr? (
              app-crypt/gcr:=[gtk]
            )
            net-misc/networkmanager[vala?]
          depend: |
            ${RDEPEND}
            $(vala_depend)
          body: |
            src_prepare() {
              vala_src_prepare
              gnome3_src_prepare
            }
            src_configure() {
              # Fix sandbox issues not reproducible on
              # container :'(
              addpredict /proc/self/task
              local emesonargs=(
                $(meson_use gtk4 libnma_gtk4)
                $(meson_use gcr)
                $(meson_use introspection)
                $(meson_use vala vapi)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              rm "${D}/usr/share/glib-2.0/schemas/org.gnome.nm-applet.gschema.xml" || die
            }

libosinfo:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: sys-libs
    dir:
      url: https://releases.pagure.org/libosinfo/
      matcher: '{{ .Values.pn }}-.*.tar.xz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      patches:
        - libosinfo-1.12.0-libxml2-2.14.patch
      desc: GObject library for managing information about real and virtual OSes
      homepage: https://libosinfo.org/
      license: GPL-2+ LGPL-2.1+
      iuse: gtk-doc +introspection +vala
      required_use: vala? ( introspection )
      rdepend: |
        dev-libs/glib:2
        net-libs/libsoup:3
        dev-libs/libxml2:=
        dev-libs/libxslt
        sys-apps/hwdata
        sys-apps/osinfo-db
        introspection? ( dev-libs/gobject-introspection:= )
      depend: |
        ${RDEPEND}
        sys-apps/osinfo-db-tools
      bdepend: |
        dev-lang/perl
        gtk-doc? (
          dev-util/gtk-doc
          app-text/docbook-xml-dtd:4.3
        )
        sys-devel/gettext
        virtual/pkgconfig
        vala? ( $(vala_depend) )
      inherit:
        - meson
        - vala
        - xdg
      body: |
        src_prepare() {
          default
          use vala && vala_src_prepare
          xdg_environment_reset
        }
        src_configure() {
          local emesonargs=(
            $(meson_use gtk-doc enable-gtk-doc)
            $(meson_feature introspection enable-introspection)
            $(meson_feature vala enable-vala)
            -Denable-tests=false
            -Dlibsoup-abi=3.0
            -Dwith-pci-ids-path="${EPREFIX}"/usr/share/hwdata/pci.ids
            -Dwith-usb-ids-path="${EPREFIX}"/usr/share/hwdata/usb.ids
          )
          meson_src_configure
        }

  packages:
    - libosinfo:


gnome_robots:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
    rate_duration: "8s"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: gnome-extra
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pkgname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.{{ .Values.tarball_suffix }}$"
      exclude: 'rc|beta|alpha'
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".{{ .Values.tarball_suffix }}"
        replace: ""
    vars:
      tarball_suffix: 'tar.xz'
      license: LGPL-2.1+
      homepage: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.pkgname | default .Values.pn }}'
      gitlab_user: GNOME

  extensions_defs:
    rust:
      opts:
        crates_skipped: "gnome-robots"

  packages:

    - gnome-robots:
        extensions:
          - rust
        category: games-arcade
        vars:
          extra_envs:
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
          release: '41'
          inherit:
            - gnome3
            - meson
            - cargo
          desc: Avoid the robots and make them crash into each other
          homepage: https://wiki.gnome.org/Apps/Robots
          license: GPL-3+ CC-BY-SA-3.0
          rdepend: |
            dev-libs/libgee:=
            dev-libs/glib:2
            dev-libs/libgnome-games-support:1=
            media-libs/gsound
            x11-libs/gtk+:3
            gnome-base/librsvg
          depend: '${RDEPEND}'
          bdepend: |
            dev-libs/appstream-glib
            dev-util/itstool
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_prepare() {
              gnome3_src_prepare
            }
            src_configure() {
              cargo_src_configure
              meson_src_configure
              ln -s "${CARGO_HOME}" "${BUILD_DIR}/cargo-home" || die
            }
            src_install() {
              cargo_src_install
              meson_src_install
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
            }


gimp_sources:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
    rate_duration: "8s"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: https://download.gimp.org/{{ .Values.pkgname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.{{ .Values.tarball_suffix }}$"
      exclude: 'rc|beta|alpha'
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".{{ .Values.tarball_suffix }}"
        replace: ""
    vars:
      tarball_suffix: 'tar.xz'
      license: LGPL-2.1+
      homepage: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.pkgname | default .Values.pn }}'
      gitlab_user: GNOME

  extensions_defs:
    rust:
      opts:

  packages:

    - babl:
        vars:
          release: '0.1'
          extra_envs:
            - 'VALA_USE_DEPEND=vapigen'
          inherit:
            - gnome3
            - meson
            - vala
          desc: A dynamic, any to any, pixel format conversion library
          homepage: https://gegl.org/babl/
          license: LGPL-3
          iuse: |
            introspection lcms vala cpu_flags_x86_avx2 cpu_flags_x86_f16c
            cpu_flags_x86_mmx cpu_flags_x86_sse cpu_flags_x86_sse2
            cpu_flags_x86_sse4_1
          bdepend: |
            virtual/pkgconfig
            vala? ( $(vala_depend) )
          rdepend: |
            introspection? ( dev-libs/gobject-introspection:= )
            lcms? ( media-libs/lcms )
          depend: '${RDEPEND}'
          body: |
            src_prepare() {
              default
              gnome3_environment_reset
              use vala && vala_src_prepare
            }
            src_configure() {
              # Automagic rsvg support is just for website generation we do not call,
              #     so we don't need to fix it
              # w3m is used for dist target thus no issue for us that it is automagically
              #     detected
              local emesonargs=(
                -Dwith-docs=false
                $(meson_use introspection enable-gir)
                $(meson_feature lcms with-lcms)
                $(meson_use vala enable-vapi)
                $(meson_use cpu_flags_x86_avx2 enable-avx2)
                $(meson_use cpu_flags_x86_f16c enable-f16c)
                $(meson_use cpu_flags_x86_mmx enable-mmx)
                $(meson_use cpu_flags_x86_sse enable-sse)
                $(meson_use cpu_flags_x86_sse2 enable-sse2)
                $(meson_use cpu_flags_x86_sse4_1 enable-sse4_1)
              )
              meson_src_configure
            }

    - gegl:
        vars:
          release: '0.4'
          python_compat: python3+
          extra_envs:
            - 'VALA_USE_DEPEND=vapigen'
          inherit:
            - flag-o-matic
            - meson
            - python-any-r1
            - toolchain-funcs
            - vala
          desc: A graph based image processing framework
          homepage: https://gegl.org/
          license: '|| ( GPL-3+ LGPL-3 )'
          slot: '0.4'
          # TODO: sdl3?
          iuse: |
            cairo debug ffmpeg introspection jpeg2k lcms
            openexr openmp pdf raw sdl sdl2 svg tiff umfpack vala
            v4l webp
          required_use: |
            svg? ( cairo )
            vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            dev-libs/json-glib
            >=media-libs/babl-0.1.118[introspection?,lcms?,vala?]
            media-libs/libjpeg-turbo:=
            media-libs/libnsgif:=
            media-libs/libpng:=
            sys-libs/zlib
            x11-libs/gdk-pixbuf
            x11-libs/pango
            cairo? ( x11-libs/cairo )
            ffmpeg? ( media-video/ffmpeg:= )
            introspection? ( dev-libs/gobject-introspection:= )
            jpeg2k? ( media-libs/jasper:= )
            lcms? ( media-libs/lcms )
            openexr? ( media-libs/openexr:= )
            pdf? ( app-text/poppler[cairo] )
            raw? ( media-libs/libraw:= )
            sdl? ( media-libs/libsdl )
            sdl2? ( media-libs/libsdl2 )
            svg? ( gnome-base/librsvg )
            tiff? ( media-libs/tiff:= )
            umfpack? ( media-libs/umfpack )
            v4l? ( media-libs/libv4l )
            webp? ( media-libs/libwebp:= )
          depend: '${RDEPEND}'
          bdepend: |
            ${PYTHON_DEPS}
            dev-lang/perl
            sys-devel/gettext
            virtual/pkgconfig
            vala? ( $(vala_depend) )
          body: |
            pkg_setup() {
              python-any-r1_pkg_setup
            }
            src_prepare() {
              default
              # patch executables suffix
              sed -i -e "s/'gegl'/'gegl-0.4'/" bin/meson.build || die
              sed -i -e "s/'gegl-imgcmp'/'gegl-imgcmp-0.4'/" tools/meson.build || die
              sed -i -e "s/gegl-imgcmp/gegl-imgcmp-0.4/" tests/simple/test-exp-combine.py || die
              # skip UNEXPECTED PASSED 'matting-levin' test
              sed -i -e "s/composition_tests += 'matting-levin'//" \
                -e "s/composition_tests_fail += 'matting-levin'//" tests/compositions/meson.build || die
              use vala && vala_src_prepare
            }
            src_configure() {
              filter-lto
              local emesonargs=(
                -Ddocs=false  # website
                -Dgi-docgen=disabled
                -Dworkshop=false
                $(meson_use introspection)
                $(meson_feature vala vapigen)
                # Optional dependencies (as per upstream)
                -Dgdk-pixbuf=enabled
                -Dgexiv2=disabled
                # - Noop option. Its fully optional at runtime.
                -Dgraphviz=disabled
                $(meson_feature jpeg2k jasper)
                $(meson_feature lcms)
                # - Needs -Dworkshop=true
                -Dlensfun=disabled
                $(meson_feature ffmpeg libav)
                $(meson_feature raw libraw)
                $(meson_feature svg librsvg)
                # - Not in portage main tree
                -Dlibspiro=disabled
                $(meson_feature tiff libtiff)
                # - v4l support does not work with our media-libs/libv4l-0.8.9,
                #   upstream bug at https://bugzilla.gnome.org/show_bug.cgi?id=654675
                $(meson_feature v4l libv4l)
                $(meson_feature v4l libv4l2)
                -Dlua=disabled
                -Dmrg=disabled
                # - Unpackaged, needs -Dworkshop=true
                #   Implementation of the feature in gimp stalled
                #   https://gitlab.gnome.org/GNOME/gimp/-/issues/2912
                -Dmaxflow=disabled
                $(meson_feature openexr)
                $(meson_feature openmp)
                $(meson_feature cairo)
                -Dpango=enabled
                $(meson_feature cairo pangocairo)
                $(meson_feature pdf poppler)
                -Dpygobject=disabled
                $(meson_feature sdl sdl1)
                $(meson_feature sdl2 sdl2)
                $(meson_feature umfpack)
                $(meson_feature webp)
              )
              meson_src_configure
            }


gitlab_com_dirlisting:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
    rate_duration: "8s"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: net-libs
    dir:
      url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/archive/{{ .Values.original_version }}/{{ .Values.pn }}-{{ .Values.original_version }}.tar.bz2'
    vars:
      gitlab_user: accounts-sso
      homepage: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}'

  packages:

    - gnome-shell-extension-desktop-icons:
        assets:
          - name: '{{ .Values.pn }}-gtk4-{{ .Values.version }}.tar.bz2'
            url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/archive/{{ .Values.original_version }}/{{ .Values.gitlab_repo }}-{{ .Values.original_version }}.tar.bz2'
        category: gnome-extra
        dir:
          url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags'
          matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/tags/Gtk4-[0-9.-]+.*"
        transform:
          - kind: string
            match: 'Gtk4-'
            replace: ''
          - kind: string
            match: '-'
            replace: '.'
        vars:
          s: '${WORKDIR}/{{ .Values.gitlab_repo }}-{{ .Values.original_version }}'
          gitlab_user: smedius
          gitlab_repo: desktop-icons-ng
          inherit:
            - gnome3-utils
            - meson
            - xdg-utils
          desc: A GNOME Shell extension for providing desktop icons (GTK4 Fork)
          license: GPL-3
          rdepend: |
            dev-libs/glib:2
            x11-libs/gtk:4
            app-eselect/eselect-gnome-shell-extensions
            gnome-base/gnome-shell
            gnome-base/nautilus
          depend: '${RDEPEND}'
          body: |
            pkg_preinst() {
              gnome3_schemas_savelist
            }
            pkg_postinst() {
              gnome3_schemas_update
              ebegin "Updating list of installed extensions"
              eselect gnome-shell-extensions update
              eend $?
              xdg_icon_cache_update
            }
            pkg_postrm() {
              gnome3_schemas_update
              xdg_icon_cache_update
            }

    - libaccounts-glib:
        dir:
          matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags/VERSION_[0-9.]+"
        transform:
          - kind: string
            match: 'VERSION_'
            replace: ''
        vars:
          gitlab_repo: libaccounts-glib
          python_compat: python3+
          desc: Accounts SSO (Single Sign-On) management library for GLib applications
          inherit:
            - meson
            - python-single-r1
            - vala
          s: '${WORKDIR}/{{ .Values.pn }}-{{ .Values.original_version }}'
          license: LGPL-2.1
          required_use: '${PYTHON_REQUIRED_USE}'
          rdepend: |
            ${PYTHON_DEPS}
            dev-db/sqlite:3
            dev-libs/glib:2
            dev-libs/gobject-introspection:=
            dev-libs/libxml2:=
            dev-python/pygobject:3[${PYTHON_USEDEP}]
          depend: '${RDEPEND}'
          bdepend: |
            $(vala_depend)
            dev-util/gdbus-codegen
            virtual/pkgconfig
          body: |
            pkg_setup() {
              python-single-r1_pkg_setup
            }
            src_prepare() {
              default
              vala_src_prepare --ignore-use
              sed -e "/^subdir('docs')$/d" -i meson.build || die
              sed -e "/^subdir('tests')$/d" -i meson.build || die
              # /tmp isn't accessible from sandbox
              sed -i -e "s|/tmp/\(.*\)|${T}/\1|" tests/check_ag.c || die
              sed -i -e "s|/tmp|${T}|" tests/meson.build || die
            }

            src_configure() {
              local emesonargs=(
                -Dinstall-py-overrides=true
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              python_optimize
            }
