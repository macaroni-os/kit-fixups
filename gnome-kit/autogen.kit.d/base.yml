              dev-python/argcomplete
            )
          body: |
            src_configure() {
              use debug && EMESON_BUILDTYPE=debug
              local emesonargs=(
                -Dopengl=true
                -Degl=true
                -Dfonts=true
                $(meson_use wayland gles2)
                $(meson_use X glx)
                $(meson_use wayland)
              )
              if use wayland; then
                emesonargs+=(
                  $(meson_use xwayland)
                )
              else
                emesonargs+=(
                  -Dxwayland=false
                )
              fi
              if use elogind || use systemd; then
                emesonargs+=(
                  -Dlogind=true
                )
              fi
              emesonargs+=(
                $(meson_use wayland native_backend)
                $(meson_use screencast remote_desktop)
                $(meson_use gnome libgnome_desktop)
                $(meson_use udev)
                -Dudev_dir=$(get_udevdir)
                $(meson_use input_devices_wacom libwacom)
                -Dsound_player=true
                -Dstartup_notification=true
                $(meson_use introspection)
                $(meson_use gtk-doc docs)
                -Dcogl_tests=false
                -Dclutter_tests=false
                -Dmutter_tests=false
                -Dtests=disabled
                -Dkvm_tests=false
                -Dtty_tests=false
                $(meson_use sysprof profiler)
                -Dinstalled_tests=false
                $(meson_use X x11)
                $(meson_use bash-completion bash_completion)
              )
              if use wayland && use video_cards_nvidia; then
                emesonargs+=(
                  -Degl_device=true
                  -Dwayland_eglstream=true
                )
              else
                # It seems that -ldl is only
                # loaded with wayland_eglstream
                append-ldflags "-ldl"
                emesonargs+=(
                  -Degl_device=false
                  -Dwayland_eglstream=false
                )
              fi
              meson_src_configure
            }
            src_install() {
              meson_src_install
              # This file seems not generated. Maybe for systemd migration.
              # Add a workaround for now.
              insinto /usr/share/applications/
              doins "${FILESDIR}"/mutter.desktop
            }
            pkg_postinst() {
              use udev && udev_reload
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              use udev && udev_reload
              gnome3_pkg_postrm
            }

