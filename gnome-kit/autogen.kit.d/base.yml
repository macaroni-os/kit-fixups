            - toolchain-funcs
          desc: GTK is a multi-platform toolkit for creating graphical user interfaces
          homepage: https://www.gtk.org/ https://gitlab.gnome.org/GNOME/gtk/
          required_use: |
            || ( aqua wayland X )
            gtk-doc? ( introspection )
          iuse: |
            aqua broadway cloudproviders colord cups cups examples
            gstreamer gtk-doc +introspection sysprof vulkan wayland
            +X
          cdepend: |
            dev-libs/glib:2
            x11-libs/cairo[aqua?,glib,X?]
            x11-libs/pango[introspection?]
            dev-libs/fribidi
            media-libs/harfbuzz:=
            x11-libs/gdk-pixbuf:2[introspection?]
            media-libs/libpng:=
            media-libs/tiff:=
            media-libs/libjpeg-turbo:=
            gnome-base/librsvg:2
            media-libs/libepoxy[egl(+),X(+)?]
            media-libs/graphene[introspection?]
            app-text/iso-codes
            x11-misc/shared-mime-info
            cloudproviders? ( net-libs/libcloudproviders )
            colord? ( x11-misc/colord:= )
            cups? ( net-print/cups )
            examples? ( gnome-base/librsvg:2 )
            gstreamer? (
              media-libs/gstreamer
              media-libs/gst-plugins-bad
              || (
                media-libs/gst-plugins-base[gles2]
                media-libs/gst-plugins-base[opengl]
              )
            )
            introspection? ( dev-libs/gobject-introspection:= )
            vulkan? ( media-libs/vulkan-loader[wayland?,X?] )
            wayland? (
              dev-libs/wayland
              dev-libs/wayland-protocols
              media-libs/mesa[wayland]
              x11-libs/libxkbcommon
            )
            X? (
              media-libs/fontconfig
              media-libs/mesa[X(+)]
              x11-libs/libX11
              x11-libs/libXi
              x11-libs/libXext
              x11-libs/libXcursor
              x11-libs/libXfixes
              x11-libs/libXdamage
              x11-libs/libXinerama
            )
          depend: |
            ${CDEPEND}
            x11-libs/libdrm
            sys-kernel/linux-headers
            sysprof? ( dev-util/sysprof )
            X? ( x11-base/xorg-proto )
          rdepend: |
            ${CDEPEND}
            dev-util/gtk-update-icon-cache
          pdepend: |
            x11-themes/adwaita-icon-theme
          bdepend: |
            dev-libs/gobject-introspection-common
            introspection? (
              ${PYTHON_DEPS}
              $(python_gen_any_dep '
                dev-python/pygobject:3[${PYTHON_USEDEP}]
              ')
            )
            dev-python/docutils
            dev-util/gdbus-codegen
            sys-devel/gettext
            virtual/pkgconfig
            gtk-doc? ( dev-util/gi-docgen )
            vulkan? ( media-libs/shaderc )
            wayland? ( dev-util/wayland-scanner )
          slot: 4
          body: |
            pkg_setup() {
              use introspection && python-any-r1_pkg_setup
            }
            src_prepare() {
              default
              xdg_environment_reset
              # Nothing should use gtk4-update-icon-cache and an unversioned one
              # is shipped by dev-util/gtk-update-icon-cache
              sed -i \
                -e '/gtk4-update-icon-cache/d' \
                docs/reference/gtk/meson.build \
                tools/meson.build \
                || die
            }
            src_configure() {
              local emesonargs=(
                # GDK backends
                $(meson_use X x11-backend)
                $(meson_use wayland wayland-backend)
                $(meson_use broadway broadway-backend)
                -Dwin32-backend=false
                -Dandroid-backend=false
                $(meson_use aqua macos-backend)
                # Media backends
                $(meson_feature gstreamer media-gstreamer)
                # Print backends
