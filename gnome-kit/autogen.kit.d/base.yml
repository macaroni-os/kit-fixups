            virtual/pkgconfig
            dev-util/cargo-c
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            src_prepare() {
              gnome3_src_prepare
              use vala && vala_src_prepare
              default
            }
            src_configure() {
              local emesonargs=(
