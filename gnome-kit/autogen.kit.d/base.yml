media_libs:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pn }}/{{ .Values.release }}/

  packages:

    - gexiv2:
        dir:
          matcher: "gexiv2-.*.tar.xz$"
        transform:
          - kind: string
            match: "gexiv2-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        vars:
          release: 0.14
          python_compat: python3+
          desc: GObject-based wrapper around the Exiv2 library
          homepage: https://wiki.gnome.org/Projects/gexiv2
          license: LGPL-2.1
          iuse: gtk-doc +introspection python static-libs +vala
          inherit:
            - meson
            - python-r1
            - vala
            - xdg-utils
          rdepend: |
            ${PYTHON_DEPS}
            dev-libs/glib:2
            media-gfx/exiv2:0=
            introspection? ( dev-libs/gobject-introspection:= )
          depend: |
            ${RDEPEND}
            virtual/pkgconfig
            gtk-doc? ( dev-util/gtk-doc )
          required_use: |
            python? ( introspection ${PYTHON_REQUIRED_USE} )
            vala? ( introspection )
          body: |
            src_prepare() {
              xdg_environment_reset
              use vala && vala_src_prepare
              default
            }
            src_configure() {
              local emesonargs=(
                $(meson_use introspection)
                $(meson_use vala vapi)
                $(meson_use gtk-doc gtk_doc)
                # prevents installation of python modules (uses install_data from meson
                # which does not optimize the modules
                -Dpython3=false
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use python ; then
                python_moduleinto gi/overrides/
                python_foreach_impl python_domodule GExiv2.py
              fi
            }


net_misc_cat:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: net-misc
    dir:
      url: https://download.gnome.org/sources/{{ .Values.tname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.tname | default .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      s: '${WORKDIR}/{{ .Values.tname | default .Values.pn }}-{{ .Values.version }}'

  packages:
    - rygel:
        vars:
          release: "0.40"
          desc: Rygel is an open source UPnP/DLNA MediaServer
          homepage: https://wiki.gnome.org/Projects/Rygel
          license: LGPL-2.1+ CC-BY-SA-3.0 GPL-2
          inherit:
            - meson
            - systemd
            - vala
            - xdg
          iuse: X +introspection +sqlite tracker test transcode gtk-doc
          rdepend: |
            dev-libs/glib
            dev-libs/libgee:0.8
            dev-libs/libxml2:2
            media-libs/gupnp-dlna:2.0
            media-libs/gstreamer:1.0
            media-libs/gst-plugins-base:1.0
            media-libs/libmediaart:2.0
            media-plugins/gst-plugins-soup:1.0
            media-libs/gstreamer-editing-services:1.0
            net-libs/gssdp
            net-libs/gupnp
            net-libs/gupnp-av
            net-libs/libsoup:2.4
            sys-apps/util-linux
            x11-misc/shared-mime-info
            introspection? ( dev-libs/gobject-introspection:= )
            sqlite? (
              dev-db/sqlite
              dev-libs/libunistring:=
              x11-libs/gdk-pixbuf:2
            )
            tracker? ( app-misc/tracker:= )
            transcode? (
              media-libs/gst-plugins-bad:1.0
              media-plugins/gst-plugins-twolame:1.0
              media-plugins/gst-plugins-libav:1.0
            )
            X? ( x11-libs/gtk+:3 )
          depend: |
            ${RDEPEND}
            dev-util/gtk-doc-am
          bdepend: |
            $(vala_depend)
            app-text/docbook-xml-dtd:4.5
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_prepare() {
              vala_src_prepare
              default
            }
            src_configure() {
              local emesonargs=(
                $(meson_use gtk-doc api-docs)
                -Dsystemd-user-units-dir=$(systemd_get_userunitdir)
                -Dplugins=gst-launch$(use sqlite && echo ",lms,media-export")$(use tracker && echo ",tracker3")
                -Dengines=gstreamer
                -Dexamples=false
                $(meson_use test tests)
                $(meson_feature X gtk)
                $(meson_feature introspection)
              )
              meson_src_configure
            }


    - vala:
        category: dev-lang
        vars:
          inherit:
            - autotools
            - gnome3
          slot: "0.56"
          release: "0.56"
          desc: Compiler for the GObject type system
          homepage: https://wiki.gnome.org/Projects/Vala
          license: LGPL-2.1+
          rdepend: |
            dev-libs/glib
            >=dev-libs/vala-common-{{ .Values.version }}
            media-gfx/graphviz
            dev-libs/gobject-introspection:=
          depend: |
            ${RDEPEND}
            dev-libs/libxslt
            sys-devel/flex
          bdepend: |
            virtual/pkgconfig
            virtual/yacc
          body: |
            src_configure() {
                # weasyprint enables generation of PDF from HTML
                gnome3_src_configure \
                    --disable-unversioned \
                    VALAC=: \
                    WEASYPRINT=:
            }
            src_install() {
                default
                find "${D}" -name "*.la" -delete || die
            }

    - vala-common:
        category: dev-libs
        vars:
          release: "0.56"
          tname: vala
          desc: Build infrastructure for packages that use Vala
          homepage: https://wiki.gnome.org/Projects/Vala
          license: LGPL-2.1+
          body: |
            src_configure() { :; }
            src_compile() { :; }
            src_install() {
                insinto /usr/share/aclocal
                doins vala.m4 vapigen/vapigen.m4
                insinto /usr/share/vala
                doins vapigen/Makefile.vapigen
            }


mail_apps:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: mail-client
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pn }}/{{ .Values.release }}/

  packages:
    - geary:
        dir:
          matcher: "geary-.*.tar.xz$"
        transform:
          - kind: string
            match: "geary-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        vars:
          patches:
            - geary_30105fd4c210c8ba4e875ab003cd393064ded894.patch
          release: "3.36"
          desc: A lightweight, easy-to-use, feature-rich email client
          homepage: https://wiki.gnome.org/Apps/Geary
          license: LGPL-2.1
          inherit:
            - gnome3
            - vala
            - meson
          iuse: nls
          cdepend: |
            app-crypt/gcr:0=[gtk,introspection]
            app-crypt/libsecret
            app-text/iso-codes
            dev-db/sqlite:3
            dev-libs/glib:2[dbus]
            dev-libs/libgee:0.8=
            dev-libs/appstream-glib:0
            net-libs/gnome-online-accounts
            app-text/enchant
            dev-libs/folks:0
            dev-libs/json-glib
            dev-libs/libxml2:2
            dev-libs/gmime:3.0[vala]
            dev-libs/libpeas
            media-libs/libcanberra
            net-libs/webkit-gtk:4=[introspection]
            x11-libs/gtk+:3[introspection]
            x11-libs/libnotify
            sys-libs/libunwind
            net-mail/ytnef
            app-text/gspell[introspection,vala]
          rdepend: |
            ${CDEPEND}
            gnome-base/gsettings-desktop-schemas
            gnome-base/dconf
            nls? ( virtual/libintl )
          depend: |
            ${CDEPEND}
            app-text/gnome-doc-utils
            dev-util/desktop-file-utils
            nls? ( sys-devel/gettext )
            $(vala_depend)
            virtual/pkgconfig
          body: |
            src_prepare() {
              local i
              if use nls ; then
                if [[ -n "${LINGUAS+x}" ]] ; then
                  for i in $(cd po ; echo *.po) ; do
                    if ! has ${i%.po} ${LINGUAS} ; then
                      sed -i -e "/^${i%.po}$/d" po/LINGUAS || die
                    fi
                  done
                fi
              else
                sed -i -e 's#add_subdirectory(po)##' CMakeLists.txt || die
              fi
              gnome3_src_prepare
              vala_src_prepare
            }
            pkg_postinst() {
              gnome3_pkg_postinst
              gnome3_schemas_update
            }

glycin_gitlab:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  extensions_defs:
    rust:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    dir:
      url: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/tags'
      matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/releases/[0-9.]+"
      # Skip release candidate/beta versions
      exclude: 'rc|beta|alpha'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/archive/{{ .Values.original_version }}/{{ .Values.gitlab_repo | default .Values.pn }}-{{ .Values.version }}.tar.bz2'
        #https://gitlab.gnome.org/GNOME/glycin/-/archive/2.0.7/glycin-2.0.7.tar.bz2?ref_type=tags

    vars:
      gitlab_user: GNOME
      homepage: https://gitlab.gnome.org/GNOME/glycin/
      inherit:
        - cargo
        - meson
      s: '${WORKDIR}/{{ .Values.gitlab_repo | default .Values.pn }}-{{ .Values.version }}'
      license: |
        || ( LGPL-2.1+ MPL-2.0 )
        Apache-2.0 Apache-2.0-with-LLVM-exceptions BSD-2 BSD GPL-3+ IJG ISC
        LGPL-3+ MIT Unicode-3.0
        || ( LGPL-2.1+ MPL-2.0 )
      slot: 2
      # TODO: svg creates a dep cycle because
      #       because librsvg requires gtk-pixbuf that requires gyncin-loaders
      rdepend: |
        dev-libs/glib:2
        sys-libs/libseccomp
        heif? ( >=media-libs/libheif-1.17.0:= )
        jpegxl? ( media-libs/libjxl:= )
        svg? (
          gnome-base/librsvg:2
          x11-libs/cairo
        )
      depend: '${RDEPEND}'

  packages:

    # Require glibc 2.43
    - libglycin:
        category: media-libs
        extensions:
          - rust
        vars:
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
          gitlab_repo: glycin
          desc: Glycin C-Bindings for the library
          iuse: heif jpeg2k jpegxl svg debug
          inherit:
            - cargo
            - meson
            - vala
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            src_prepare() {
              use vala && vala_src_prepare
              default
              # Fix integration with py3.9
              sed -i -e 's|import tomllib|import tomli as tomllib|g' build-aux/crates-version.py || die
            }
            src_configure() {
              local formats=(
                $(usev heif glycin-heif)
                $(usev jpeg2k glycin-jpeg2000)
                $(usev jpegxl glycin-jxl)
                $(usev svg glycin-svg)
                glycin-image-rs
              )
              local formats_s=${formats[*]}
              local emesonargs=(
                -Dprofile=$(usex debug dev release)
                -Dglycin-loaders=false
                -Dloaders="${formats_s// /,}"
                -Dtests=false
                -Dlibglycin=true
                -Dlibglycin-gtk4=false
                -Dglycin-thumbnailer=false
              )
              meson_src_configure
              ln -s "${CARGO_HOME}" "${BUILD_DIR}/cargo-home" || die
            }

    - glycin-loaders:
        category: media-libs
        extensions:
          - rust
        vars:
          extra_envs:
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
          gitlab_repo: glycin
          desc: Loaders for glycin clients (glycin crate or libglycin)
          iuse: heif jpeg2k jpegxl svg debug
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            src_configure() {
              local formats=(
                $(usev heif glycin-heif)
                $(usev jpeg2k glycin-jpeg2000)
                $(usev jpegxl glycin-jxl)
                $(usev svg glycin-svg)
                glycin-image-rs
              )
              local formats_s=${formats[*]}
              local emesonargs=(
                -Dprofile=$(usex debug dev release)
                -Dglycin-loaders=true
                -Dloaders="${formats_s// /,}"
                -Dtests=false
                -Dlibglycin=false
                -Dlibglycin-gtk4=false
                -Dglycin-thumbnailer=false
              )
              meson_src_configure
              ln -s "${CARGO_HOME}" "${BUILD_DIR}/cargo-home" || die
            }

gnome_apps:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: gnome-extra
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      license: LGPL-2.1+

  extensions_defs:
    rust:
      opts:

  packages:

    - libcloudproviders:
        category: net-libs
        vars:
          release: 0.3
          inherit:
            - meson
            - vala
          license: LGPL-3
          iuse: gtk-doc +introspection vala
          required_use: vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            introspection? ( dev-libs/gobject-introspection )
          depend: '${RDEPEND}'
          bdepend: |
            dev-util/gdbus-codegen
            virtual/pkgconfig
            gtk-doc? ( dev-util/gtk-doc )
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              default
              use vala && vala_src_prepare
            }
            src_configure() {
              local emesonargs=(
                -Dinstalled-tests=false
                -Dintrospection=$(usex introspection true false)
                -Dvapigen=$(usex vala true false)
                -Denable-gtk-doc=$(usex gtk-doc true false)
              )
              meson_src_configure
            }

    - libsoup:
        category: net-libs
        vars:
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
          slot: 2.4
          release: '2.74'
          homepage: https://libsoup.gnome.org
          desc: HTTP client/server library for GNOME
          inherit:
            - meson
            - vala
            - xdg
          iuse: brotli gssapi gtk-doc +introspection samba ssl +vala
          required_use: vala? ( introspection )
          cdepend: |
            dev-libs/glib:2
            dev-db/sqlite
            dev-libs/libxml2
            brotli? ( app-arch/brotli )
            net-libs/libpsl
            sys-libs/zlib
            gssapi?  ( virtual/krb5 )
            introspection? ( dev-libs/gobject-introspection:= )
            samba? ( net-fs/samba )
          depend: '${CDEPEND}'
          rdepend: |
            ${CDEPEND}
            net-libs/glib-networking[ssl?]
          bdepend: |
            gtk-doc? (
              dev-util/gtk-doc
              app-text/docbook-xml-dtd:4.1.2
            )
            sys-devel/gettext
            virtual/pkgconfig
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              use vala && vala_src_prepare
              xdg_src_prepare
            }
            src_configure() {
              local emesonargs=(
                $(meson_feature gssapi)
                -Dkrb5_config="${CHOST}-krb5-config"
                $(meson_feature samba ntlm)
                $(meson_feature brotli)
                -Dntlm_auth="${EPREFIX}/usr/bin/ntlm_auth"
                -Dtls_check=false # disables check, we still rdep on glib-networking
                -Dgnome=false
                $(meson_feature introspection)
                $(meson_feature vala vapi)
                $(meson_use gtk-doc gtk_doc)
                -Dtests=false
                -Dinstalled_tests=false
                -Dsysprof=disabled
              )
              meson_src_configure
            }

    - libsoup:
        category: net-libs
        vars:
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
          slot: 3
          release: '3.6'
          homepage: https://libsoup.gnome.org
          desc: HTTP client/server library for GNOME
          inherit:
            - meson
            - vala
            - xdg
          iuse: brotli gssapi gtk-doc +introspection samba ssl +vala
          required_use: vala? ( introspection )
          cdepend: |
            dev-libs/glib:2
            net-libs/nghttp2:=
            dev-db/sqlite
            brotli? ( app-arch/brotli )
            net-libs/libpsl
            sys-libs/zlib
            gssapi?  ( virtual/krb5 )
            introspection? ( dev-libs/gobject-introspection:= )
            samba? ( net-fs/samba )
          depend: '${CDEPEND}'
          rdepend: |
            ${CDEPEND}
            net-libs/glib-networking[ssl?]
          bdepend: |
            gtk-doc? (
              dev-util/gtk-doc
              app-text/docbook-xml-dtd:4.1.2
            )
            sys-devel/gettext
            virtual/pkgconfig
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              use vala && vala_src_prepare
              xdg_src_prepare
              # https://gitlab.gnome.org/GNOME/libsoup/issues/159 - could work with libnss-myhostname
              sed -e '/hsts/d' -i tests/meson.build || die
            }
            src_configure() {
              local emesonargs=(
                # Avoid auto-magic, built-in feature of meson
                -Dauto_features=enabled
                $(meson_feature gssapi)
                $(meson_feature samba ntlm)
                $(meson_feature brotli)
                -Dntlm_auth="${EPREFIX}/usr/bin/ntlm_auth"
                -Dtls_check=false
                $(meson_feature introspection)
                $(meson_feature vala vapi)
                $(meson_feature gtk-doc docs)
                -Ddoc_tests=false
                -Dtests=false
                -Dautobahn=disabled
                -Dinstalled_tests=false
                -Dpkcs11_tests=disabled
                -Dsysprof=disabled
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use gtk-doc; then
                mkdir -p "${ED}"/usr/share/gtk-doc/html/ || die
                mv "${ED}"/usr/share/doc/libsoup-3.0 "${ED}"/usr/share/gtk-doc/html/ || die
              fi
            }


    - glib-networking:
        category: net-libs
        vars:
          inherit:
            - meson
            - xdg
            - gnome3
          desc: Network-related giomodules for glib
          homepage: https://gitlab.gnome.org/GNOME/glib-networking
          release: '2.80'
          iuse: +gnome +libproxy +ssl
          rdepend: |
            dev-libs/glib:2
            libproxy? ( net-libs/libproxy )
            net-libs/gnutls:=
            ssl? ( app-misc/ca-certificates )
            gnome? ( gnome-base/gsettings-desktop-schemas )
          depend: '${RDEPEND}'
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_configure() {
              local emesonargs=(
                -Dgnutls=enabled
                -Dopenssl=$(usex ssl enabled disabled)
                $(meson_feature libproxy)
                $(meson_feature gnome gnome_proxy)
                -Dinstalled_tests=false
                -Ddebug_logs=false
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
            }
            pkg_postinst() {
              gnome3_pkg_postinst
              gnome3_giomodule_cache_update || die "Update GIO modules cache failed (for ${ABI})"
            }
            pkg_postrm() {
              gnome3_pkg_postrm
              gnome3_giomodule_cache_update || die "Update GIO modules cache failed (for ${ABI})"
            }

    - gdk-pixbuf:
        category: x11-libs
        vars:
          inherit:
            - meson
            - xdg
            - gnome3
          slot: 2
          release: 2.44
          desc: Image loading library for GTK+
          homepage: https://gitlab.gnome.org/GNOME/gdk-pixbuf
          iuse: gtk-doc +introspection gif jpeg tiff glycin
          rdepend: |
            dev-libs/glib:2
            x11-misc/shared-mime-info
            media-libs/libpng:=
            jpeg? ( media-libs/libjpeg-turbo:= )
            tiff? ( media-libs/tiff:= )
            glycin? ( media-libs/libglycin:= )
            introspection? ( dev-libs/gobject-introspection:= )
          depend: |
            ${RDEPEND}
          bdepend: |
            gtk-doc? ( dev-util/gi-docgen )
            app-text/docbook-xsl-stylesheets
            app-text/docbook-xml-dtd:4.3
            dev-libs/libxslt
            dev-python/docutils
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_configure() {
              local emesonargs=(
                -Dpng=enabled
                -Dtests=false
                $(meson_feature gif)
                -Dothers=enabled
                $(meson_feature tiff)
                $(meson_feature glycin)
                $(meson_feature jpeg)
                -Dbuiltin_loaders=png,jpeg
                -Drelocatable=false
                -Dinstalled_tests=false
                -Dgio_sniffing=true
                -Ddocumentation=$(usex gtk-doc true false)
                -Dman=true
                $(meson_feature introspection)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
            }
            pkg_preinst() {
              xdg_pkg_preinst
              # Make sure loaders.cache belongs to gdk-pixbuf alone
              local cache="usr/$(get_libdir)/${PN}-2.0/2.10.0/loaders.cache"
              if [[ -e ${EROOT}/${cache} ]]; then
                cp "${EROOT}"/${cache} "${ED}"/${cache} || die
              else
                touch "${ED}"/${cache} || die
              fi
            }
            pkg_postinst() {
              xdg_pkg_postinst
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              xdg_pkg_postrm
              if [[ -z ${REPLACED_BY_VERSION} ]]; then
                rm -f "${EROOT}"/usr/lib*/${PN}-2.0/2.10.0/loaders.cache
              fi
            }

    - librsvg:
        category: gnome-base
        extensions:
          - rust
        vars:
          release: '2.61'
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
          inherit:
            - meson
            - eutils
            - gnome3
            - vala
            - ltprune
            - cargo
          desc: Scalable Vector Graphics (SVG) rendering library
          homepage: https://wiki.gnome.org/Projects/LibRsvg
          license: LGPL+2
          slot: 2
          iuse: gtk-doc +introspection +vala
          rdepend: |
            dev-libs/glib:2
            x11-libs/cairo
            x11-libs/pango
            dev-libs/libxml2:2
            dev-libs/libcroco
            x11-libs/gdk-pixbuf:2[introspection?]
            virtual/rust
            introspection? ( dev-libs/gobject-introspection:= )
          depend: |
            ${RDEPEND}
            dev-libs/gobject-introspection-common
            dev-libs/vala-common
            gtk-doc? ( dev-util/gi-docgen )
            vala? ( $(vala_depend) )
            virtual/pkgconfig
            dev-util/cargo-c
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            src_prepare() {
              gnome3_src_prepare
              use vala && vala_src_prepare
              default
            }
            src_configure() {
              local emesonargs=(
                -Dtests=false
                # TODO: check
                -Davif=disabled
                $(meson_feature introspection)
                -Dpixbuf=enabled
                -Dpixbuf-loader=enabled
                $(meson_feature gtk-doc docs)
                $(meson_feature vala)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
            }
            pkg_postinst() {
              # causes segfault if set, see bug 375615
              unset __GL_NO_DSO_FINALIZER
              gnome3_pkg_postrm
            }


    - gnome-weather:
        vars:
          patches:
