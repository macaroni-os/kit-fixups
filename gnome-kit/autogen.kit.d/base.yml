            media-libs/clutter-gst
            media-libs/cogl:=[introspection?]
            media-video/gnome-video-effects
            x11-libs/gdk-pixbuf:2[jpeg,introspection?]
            x11-libs/libX11
            x11-libs/libXtst
            media-libs/gstreamer:1.0[introspection?]
            media-libs/gst-plugins-base:1.0[introspection?,ogg,pango,theora,vorbis,X]
            introspection? ( dev-libs/gobject-introspection:= )
          rdepend: |
            ${CDEPEND}
            media-libs/gst-plugins-bad:1.0
            media-libs/gst-plugins-good:1.0
          depend: |
            ${CDEPEND}
            app-text/docbook-xml-dtd:4.3
            app-text/yelp-tools
            dev-libs/appstream-glib
            dev-libs/libxml2
            dev-libs/libxslt
            dev-util/gdbus-codegen
            dev-util/gtk-doc-am
            dev-util/itstool
            x11-base/xorg-proto
          bdepend: |
            $(vala_depend)
            virtual/pkgconfig
          body: |
            src_prepare() {
              vala_src_prepare
              gnome3_src_prepare
            }
            src_configure() {
              # work around sandbox violation
              for card in /dev/dri/card* ; do
                addpredict "${card}"
              done
              for render in /dev/dri/render* ; do
                addpredict "${render}"
              done
              for video in /dev/video* ; do
                addpredict "${video}"
              done
              addpredict /proc/self/task
              local emesonargs=(
                $(meson_use introspection)
                -Dtests=false
              )
              meson_src_configure
            }
            pkg_postinst() {
              gnome3_pkg_postinst
