github_libs:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: dev-libs
    github:
      query: tags
  packages:

    - gnome-shell-extension-dash-to-dock:
        category: gnome-extra
        github:
          user: micheleg
          repo: dash-to-dock
          match: '^extensions'
          num_pages: 4
        transform:
          - kind: regex
            match: 'extensions\.gnome\.org-v'
            replace: ''
        vars:
          rdepend: |
            dev-libs/glib:2
            app-eselect/eselect-gnome-shell-extensions
            gnome-base/gnome-shell
          depend: '${RDEPEND}'
          bdepend: |
            dev-util/intltool
            sys-devel/gettext
          inherit:
            - gnome3-utils
          body: |
            src_prepare() {
              default
              # Set correct version
              export VERSION="${PV}"
              # Don't install README and COPYING in unwanted locations
              sed -i -e 's/COPYING//g' -e 's/README.md//g' Makefile || die
            }
            pkg_preinst() {
              gnome3_schemas_savelist
            }
            pkg_postinst() {
              gnome3_schemas_update
              ebegin "Updating list of installed extensions"
              eselect gnome-shell-extensions update
              eend $?
            }
            pkg_postrm() {
              gnome3_schemas_update
            }

    - gnome-orchis-theme:
        category: x11-themes
        github:
          user: vinceliuice
          repo: Orchis-theme
          query: releases
        transform:
          - kind: string
            match: '-'
            replace: ''
        vars:
          inherit:
            - gnome3-utils
            - xdg
          iuse: compact solid black purple pink red orange yellow primary macos
          rdepend: |
            dev-libs/libxml2:2
            x11-libs/gtk+:3
            x11-themes/gtk-engines-murrine
          depend: |
            ${RDEPEND}
            dev-libs/glib:2
            dev-lang/sassc
            x11-libs/gdk-pixbuf:2
          body: |
            src_configure() {
              default
            }
            src_install() {
              local args=()
              if use compact ; then
                args+=(
                  --tweaks compact
                )
              else
                if use solid ; then
                  args+=(
                    --tweaks solid
                  )
                else
                  if use black ; then
                  args+=(
                    --tweaks black
                  )
                  else
                    if use primary ; then
                      args+=(
                        --tweaks primary
                      )
                    fi
                  fi
                fi
              fi
              einfo "Using args: ${args[@]}"
              ${S}/install.sh -d ${D}/usr/share/themes ${args[@]}
              for i in purple pink red orange yellow ; do
                if use $i ; then
                  ${S}/install.sh -d ${D}/usr/share/themes ${args[@]} --theme $i
                fi
              done
              if use macos ; then
                ${S}/install.sh -d ${D}/usr/share/themes --tweaks macos -n Orchis-Macos
              fi
            }
            pkg_postinst() {
              xdg_pkg_postinst
              gnome3_gconf_install
              gnome3_gdk_pixbuf_update
            }
            pkg_postrm() {
              xdg_pkg_postrm
            }

    - libical:
        github:
          query: releases
        template: ../../templates/simple.tmpl
        transform:
          - kind: string
            match: 'Libical '
            replace: ''
          - kind: string
            match: 'v'
            replace: ''
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}.tar.gz'
            matcher: '{{ .Values.pn }}-.*.tar.gz'
        vars:
          slot: '0/3'
          iuse: berkdb doc examples +introspection static-libs +vala
          required_use: |
            vala? ( introspection )
          extra_envs:
            - 'VALA_USE_DEPEND=vapigen'
          inherit:
            - cmake-utils
            - vala
          rdepend: |
            dev-libs/icu:=
            berkdb? ( sys-libs/db:= )
            introspection? (
              dev-libs/libxml2
              dev-libs/glib:2
              dev-libs/gobject-introspection:=
            )
            sys-libs/timezone-data
          depend: '${RDEPEND}'
          bdepend: |
            dev-lang/perl
            virtual/pkgconfig
            doc? ( app-doc/doxygen )
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              cmake-utils_src_prepare
              use examples || cmake_comment_add_subdirectory examples
              use vala && vala_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                $(cmake-utils_use_find_package berkdb BDB)
                -DICAL_BUILD_DOCS=$(usex doc)
                -DICAL_GLIB=$(usex introspection)
                -DGOBJECT_INTROSPECTION=$(usex introspection)
                -DSHARED_ONLY=$(usex !static-libs)
                -DLIBICAL_BUILD_TESTING=OFF
                -DICAL_GLIB_VAPI=$(usex vala)
              )
              if use vala; then
                mycmakeargs+=(
                  -DVALAC="${VALAC}"
                  -DVAPIGEN="${VAPIGEN}"
                )
              fi
              cmake-utils_src_configure
            }
            src_compile() {
              cmake-utils_src_compile
              use doc && cmake-utils_src_compile docs
            }
            src_install() {
              use doc && HTML_DOCS=( "${BUILD_DIR}"/apidocs/html/. )
              cmake-utils_src_install
              if use examples; then
                rm examples/CMakeLists.txt || die
                dodoc -r examples
              fi
            }

    - libgusb:
        github:
          user: hughsie
          query: releases
        template: ../../templates/simple.tmpl
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}.tar.xz'
            matcher: '{{ .Values.pn }}-.*.tar.xz'
        vars:
          iuse: +introspection +vala
          required_use: |
            vala? ( introspection )
          extra_envs:
            - 'VALA_USE_DEPEND=vapigen'
          inherit:
            - meson
            - vala
          rdepend: |
            dev-libs/glib:2
            virtual/libusb:1[udev]
            dev-libs/json-glib[introspection?]
            introspection? ( dev-libs/gobject-introspection:= )
            sys-apps/hwdata
          depend: '${RDEPEND}'
          bdepend: |
            vala? ( $(vala_depend) )
            virtual/pkgconfig
          body: |
            src_prepare() {
              default
              use vala && vala_src_prepare
            }
            src_configure() {
              local emesonargs=(
                -Ddefault_library=shared
                -Dtests=false
                -Dumockdev=disabled
                -Ddocs=false
                $(meson_use vala vapi)
                $(meson_use introspection)
                -Dusb_ids="${EPREFIX}"/usr/share/hwdata/usb.ids
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
            }

    - libpsl:
        template: ../../templates/simple.tmpl
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}.tar.gz'
            matcher: '{{ .Values.pn }}-.*.tar.gz'
        transform:
          - kind: string
            match: 'Release '
            replace: ''
          - kind: string
            match: 'V'
            replace: ''
          - kind: string
            match: 'v'
            replace: ''
          - kind: string
            match: 'libpsl-'
            replace: ''
        github:
          user: rockdaboot
          query: releases
          num_pages: 4
        category: net-libs
        vars:
          iuse: icu +idn static-libs
          inherit:
            - meson
            - python-single-r1
          python_compat: python3+
          rdepend: |
            icu? ( !idn? ( dev-libs/icu:= ) )
            idn? (
              dev-libs/libunistring:=
              net-dns/libidn2:=
            )
          depend: '${RDEPEND}'
          bdepend: |
            ${PYTHON_DEPS}
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            pkg_pretend() {
              if use icu && use idn ; then
                ewarn "\"icu\" and \"idn\" USE flags are enabled. Using \"idn\"."
              fi
            }
            src_configure() {
              local emesonargs=(
                -Dtests=false
              )
              # Prefer idn even if icu is in USE as well
              if use idn ; then
                emesonargs+=(
                  -Druntime=libidn2
                  -Dbuiltin=true
                )
              elif use icu ; then
                emesonargs+=(
                  -Druntime=libicu
                  -Dbuiltin=true
                )
              else
                emesonargs+=(
                  -Druntime=no
                )
              fi
              if use static-libs ; then
                emesonargs+=(
                  -Ddefault_library=both
                )
              fi
              meson_src_configure
            }

    - pegtl:
        github:
          user: taocpp
          repo: PEGTL
        transform:
          - kind: string
            match: 'pegtl-'
            replace: ''
        vars:
          inherit:
            - cmake
          body: |
            src_prepare() {
              # Disable Werror
              sed -i -e 's|-Werror||g' Makefile || die
              sed -i -e 's|-Werror||g' src/example/pegtl/CMakeLists.txt || die
              sed -i -e 's|-Werror||g' src/test/pegtl/CMakeLists.txt || die
              cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                -DPEGTL_INSTALL_CMAKE_DIR="$(get_libdir)/cmake/{{ .Values.pn }}"
                -DPEGTL_INSTALL_DOC_DIR="share/doc/{{ .Values.pn }}-{{ .Values.version }}"
              )
              cmake_src_configure
            }

    - usbguard:
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
        github:
          user: USBGuard
          query: releases
        category: sys-apps
        vars:
          inherit:
            - autotools
            - bash-completion-r1
            - tmpfiles
          iuse: dbus ldap policykit static-libs systemd
          # umockdev
          cdepend: |
            dev-libs/pegtl
            dev-libs/libsodium:=
            dev-libs/protobuf:=
            sys-cluster/libqb:=
            sys-libs/libcap-ng
            sys-libs/libseccomp
            sys-process/audit
            dbus? (
              dev-libs/glib:2
              sys-apps/dbus
              sys-auth/polkit[introspection]
            )
            ldap? ( net-nds/openldap:= )
            systemd? ( sys-apps/systemd )
          rdepend: |
            ${CDEPEND}
            virtual/udev
          depend: |
            ${CDEPEND}
            app-text/asciidoc
            dbus? (
              dev-libs/libxml2
              dev-libs/libxslt
              dev-util/gdbus-codegen
            )
          body: |
            src_prepare() {
              default
              eautoreconf
            }
            src_configure() {
              local myargs=(
                --with-bash-completion-dir=$(get_bashcompdir)
                --localstatedir=/var
                --disable-umockdev
                --disable-catch
                $(use_with dbus)
                $(use_with dbus polkit)
                $(use_with ldap)
                $(use_enable static-libs static)
                $(use_enable systemd)
              )
              econf "${myargs[@]}"
            }
            src_install() {
              default
              keepdir /etc/usbguard/IPCAccessControl.d  # bug 808801
              keepdir /etc/usbguard/rules.d  # bug 933878
              chmod 0600 "${ED}"/etc/usbguard/IPCAccessControl.d/.keep* || die  # bug 808801
              chmod 0600 "${ED}"/etc/usbguard/rules.d/.keep* || die  # bug 933878
              if ! use systemd ; then
                newinitd "${FILESDIR}"/usbguard.openrc usbguard
                use dbus && newinitd "${FILESDIR}"/usbguard-dbus.openrc usbguard-dbus
              fi
              find "${D}" -name '*.la' -delete || die  # bug 850655
              rmdir -p "${D}"/var/log/usbguard  # see pkg_postinst; bug 960270
            }
            pkg_postinst() {
              tmpfiles_process usbguard.conf
              ewarn
              ewarn 'BEFORE STARTING USBGUARD please be sure to create/generate'
              ewarn '                         a rules file at /etc/usbguard/rules.conf'
              ewarn '                         so that you do not'
              ewarn '                                            GET LOCKED OUT'
              ewarn "                         of this system (\"$(hostname)\")."
              ewarn
              ewarn 'This command may be of help:'
              ewarn '  sudo sh -c "usbguard generate-policy > /etc/usbguard/rules.conf"'
              ewarn
            }

    - libiptcdata:
        template: ../../templates/simple.tmpl
        category: media-libs
        github:
          user: ianw
          query: releases
        transform:
          - kind: string
            match: 'Release '
            replace: ''
          - kind: regex
            match: ' -.*$'
            replace: ''
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
            matcher: '{{ .Values.pn }}-.*.tar.gz$'
        vars:
          iuse: doc examples python
          extra_envs:
            - 'DISTUTILS_EXT=1'
            - 'DISTUTILS_OPTIONAL=1'
            - 'DISTUTILS_USE_PEP517=setuptools'
          python_compat: python3+
          inherit:
            - autotools
            - distutils-r1
            - flag-o-matic
          rdepend: |
            python? ( ${PYTHON_DEPS} )
          bdepend: |
            dev-util/gtk-doc-am
            virtual/pkgconfig
            doc? ( dev-util/gtk-doc )
            sys-devel/gettext
            python? (
              ${PYTHON_DEPS}
            )
          required_use: python? ( ${PYTHON_REQUIRED_USE} )
          body: |
            src_prepare() {
              default
              eautoreconf
              if use python; then
                cd python || die
                ln -s "../${PN}" . || die
                distutils-r1_src_prepare
              fi
            }
            src_configure () {
              local myeconfargs=(
                $(use_enable python)
                $(use_enable doc gtk-doc)
              )
              econf "${myeconfargs[@]}"
              if use python; then
                # Workaround about include/linking issue
                # with libiptcdata
                append-cflags "-I."
                append-ldflags "-L./{{ .Values.pn }}/.libs"
                cd python || die
                distutils-r1_src_configure
              fi
            }
            src_compile() {
              default
              if use python; then
                cd python || die
                distutils-r1_src_compile
              fi
            }
            src_install () {
              default
              find "${D}" -name '*.la' -delete || die "failed to remove *.la files"
              if use python; then
                cd python || die
                distutils-r1_src_install
              fi
              if use examples; then
                dodoc python/README
                dodoc -r python/examples
              fi
            }

    - system-config-printer:
        template: ../../templates/simple.tmpl
        github:
          user: OpenPrinting
          query: releases
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            matcher: '{{ .Values.pn }}-.*.tar.xz$'
        category: app-admin
        vars:
          desc: Graphical user interface for CUPS administration
          python_compat: python3+
          extra_envs:
            - 'DISTUTILS_USE_PEP517=setuptools'
            - 'DISTUTILS_SINGLE_IMPL=1'
          inherit:
            - distutils-r1
            - systemd
            - udev
            - xdg
          iuse: gnome-keyring policykit
          patches:
            - system-config-printer-1.5.18-fix-debugprint-exception.patch
          cdepend: |
            dev-libs/glib:2
            net-print/cups[dbus]
            virtual/libusb:1
            virtual/udev
            x11-libs/gtk+:3[introspection]
            x11-libs/libnotify[introspection]
            x11-libs/pango[introspection]
          depend: '${CDEPEND}'
          bdepend: |
            app-text/xmlto
          rdepend: |
            ${CDEPEND}
            $(python_gen_cond_dep '
              dev-python/dbus-python[${PYTHON_USEDEP}]
              dev-python/pycairo[${PYTHON_USEDEP}]
              dev-python/pycups[${PYTHON_USEDEP}]
              dev-python/pygobject:3[${PYTHON_USEDEP}]
              dev-python/requests[${PYTHON_USEDEP}]
              dev-python/urllib3[${PYTHON_USEDEP}]
            ')
            gnome-keyring? ( app-crypt/libsecret[introspection] )
            policykit? ( net-print/cups-pk-helper )
          body: |
            src_configure() {
              local myeconfargs=(
                --with-xmlto
                --enable-nls
                --with-desktop-vendor=MacaroniOS
                --with-udev-rules
                --with-systemdsystemunitdir="$(systemd_get_systemunitdir)"
              )
              econf "${myeconfargs[@]}"
            }
            src_compile() {
              emake PYTHON=:
              distutils-r1_src_compile
            }
            src_install() {
              emake DESTDIR="${D}" PYTHON=: install
              python_fix_shebang "${ED}"
              distutils-r1_src_install
            }
            pkg_postinst() {
              udev_reload
            }
            pkg_postrm() {
              udev_reload
            }

    - xdg-desktop-portal-gtk:
        template: ../../templates/simple.tmpl
        github:
          user: flatpak
          query: releases
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            matcher: '{{ .Values.pn }}-.*.tar.xz$'
        category: sys-apps
        vars:
          inherit:
            - meson
            - systemd
          iuse: wayland X
          rdepend: |
            dev-libs/glib:2
            gnome-base/gsettings-desktop-schemas
            media-libs/fontconfig
            sys-apps/dbus
            sys-apps/xdg-desktop-portal
            x11-libs/cairo[X?]
            x11-libs/gdk-pixbuf
            x11-libs/gtk+:3[wayland?,X?]
          depend: '${RDEPEND}'
          bdepend: |
            dev-util/gdbus-codegen
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_configure() {
              # All backends that are disabled are instead provided by
              # xdg-desktop-portal-gnome to keep this package free of GNOME dependencies.
              # The appchooser and settings backends are enabled for non-GNOME GTK
              # applications.
              local emesonargs=(
                -Dsystemd-user-unit-dir="$(systemd_get_userunitdir)"
                -Dappchooser=enabled
                -Dsettings=enabled
                -Dlockdown=disabled
                -Dwallpaper=disabled
              )
              meson_src_configure
            }

    - appstream-glib:
        github:
          user: hughsie
        transform:
          - kind: string
            match: 'appstream_glib_'
            replace: ''
          - kind: string
            match: '_'
            replace: '.'
        vars:
          inherit:
            - bash-completion-r1
            - gnome3
            - meson
          iuse: gtk-doc fonts +introspection
          rdepend: |
            dev-libs/glib:2
            sys-apps/util-linux
            app-arch/libarchive:=
            net-misc/curl
            dev-libs/json-glib
            x11-libs/gdk-pixbuf:2[introspection?]
            fonts? (
              x11-libs/gtk+:3
              media-libs/freetype:2
            )
            media-libs/fontconfig
            dev-libs/libyaml
            x11-libs/pango
            introspection? ( dev-libs/gobject-introspection:= )
          depend: |
            ${RDEPEND}
            app-text/docbook-xml-dtd:4.3
            dev-libs/libxslt

          bdepend: |
            dev-util/gperf
            gtk-doc? (
              dev-util/gdk-doc
              dev-util/gtk-doc-am
            )
            sys-devel/gettext
          body: |
            src_configure() {
              local emesonargs=(
                -Ddep11=true
                -Dbuilder=true
                -Drpm=false
                -Dalpm=false
                -Dman=true
                $(meson_use fonts)
                $(meson_use gtk-doc)
                $(meson_use introspection)
              )
              meson_src_configure
            }

colord:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
    rate_duration: "8s"
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: x11-misc
    dir:
      url: https://www.freedesktop.org/software/colord/releases/
      matcher: "{{ .Values.pn }}-1..*.tar.xz$"
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      homepage: https://www.freedesktop.org/software/colord/
  packages:

    - colord-gtk:
        dir:
          matcher: "{{ .Values.pn }}-.*.tar.xz$"
        category: x11-libs
        vars:
          inherit:
            - meson
            - vala
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
          desc: GTK support library for colord
          license: LGPL-3+
          iuse: doc +introspection vala
          required_use: vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            x11-misc/colord:=[introspection?,vala?]
            x11-libs/gtk+:3[introspection?]
            x11-libs/gtk:4[introspection?]
          depend: '${RDEPEND}'
          bdepend: |
            dev-libs/libxslt
            sys-devel/gettext
            virtual/pkgconfig
            doc? (
              app-text/docbook-xml-dtd:4.1.2
              dev-util/gtk-doc
            )
            app-text/docbook-xsl-ns-stylesheets
            introspection? ( dev-libs/gobject-introspection:= )
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              use vala && vala_src_prepare
              default
            }
            src_configure() {
              local -a emesonargs=(
                -Dgtk4=true
                -Dgtk3=true
                -Dgtk2=false
                -Dtests=false
                -Dman=true
                $(meson_use introspection)
                $(meson_use vala vapi)
                $(meson_use doc docs)
              )
              meson_src_configure
            }

    - colord:
        vars:
          # keep 0/2 to quiet portage
          slot: 0/2
          desc: System service to accurately color manage input and output devices
          license: GPL-2+
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
          inherit:
            - bash-completion-r1
            - meson
            - udev
            - tmpfiles
            - vala
            - user
          # TODO: check if add support to argyllcms. Atm, not available on tree.
          iuse: gtk-doc examples extra-print-profiles +introspection scanner systemd vala
          required_use: |
            vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            media-libs/lcms:=
            dev-db/sqlite:3=
            dev-libs/libgusb[introspection?]
            dev-libs/libgudev:=
            virtual/libudev:=
            virtual/udev
            systemd? (
              sys-apps/systemd:=
            )
            scanner? (
              media-gfx/sane-backends
              sys-apps/dbus
            )
            sys-auth/polkit
            introspection? ( dev-libs/gobject-introspection:= )
          depend: |
            ${RDEPEND}
            dev-libs/libxslt
            dev-util/gtk-doc-am
            dev-util/intltool
            sys-devel/gettext
            virtual/pkgconfig
            vala? ( $(vala_depend) )
          body: |
            pkg_setup() {
              enewgroup colord
              enewuser colord -1 -1 /var/lib/colord colord
              use vala && vala_src_prepare
            }
            src_prepare() {
              default
              sed -i -e "/find_program('vapigen')/d" meson.build || die
            }
            src_configure() {
              local emesonargs=(
                -Ddaemon=true
                -Dbash_completion=false
                -Dudev_rules=true
                $(meson_use systemd)
                -Dlibcolordcompat=true
                $(meson_use scanner sane)
                $(meson_use introspection)
                $(meson_use vala vapi)
                $(meson_use extra-print-profiles print_profiles)
                -Dtests=false
                -Dinstalled_tests=false
                -Ddaemon_user=colord
                -Dman=true
                $(meson_use gtk-doc docs)
                --localstatedir="${EPREFIX}"/var
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              newbashcomp data/colormgr colormgr
              einstalldocs
              # Ensure config and profile directories exist and /var/lib/colord/*
              # is writable by colord user
              keepdir /var/lib/color{,d}/icc
              fowners colord:colord /var/lib/colord{,/icc}
              if use examples; then
                docinto examples
                dodoc examples/*.c
              fi
            }
            pkg_postinst() {
              udev_reload
              tmpfiles_process colord.conf
            }
            pkg_postrm() {
              udev_reload
            }


