media_libs:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pn }}/{{ .Values.release }}/

  packages:

    - gexiv2:
        dir:
          matcher: "gexiv2-.*.tar.xz$"
        transform:
          - kind: string
            match: "gexiv2-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        vars:
          release: 0.14
          python_compat: python3+
          desc: GObject-based wrapper around the Exiv2 library
          homepage: https://wiki.gnome.org/Projects/gexiv2
          license: LGPL-2.1
          iuse: gtk-doc +introspection python static-libs +vala
          inherit:
            - meson
            - python-r1
            - vala
            - xdg-utils
          rdepend: |
            ${PYTHON_DEPS}
            dev-libs/glib:2
            media-gfx/exiv2:0=
            introspection? ( dev-libs/gobject-introspection:= )
          depend: |
            ${RDEPEND}
            virtual/pkgconfig
            gtk-doc? ( dev-util/gtk-doc )
          required_use: |
            python? ( introspection ${PYTHON_REQUIRED_USE} )
            vala? ( introspection )
          body: |
            src_prepare() {
              xdg_environment_reset
              use vala && vala_src_prepare
              default
            }
            src_configure() {
              local emesonargs=(
                $(meson_use introspection)
                $(meson_use vala vapi)
                $(meson_use gtk-doc gtk_doc)
                # prevents installation of python modules (uses install_data from meson
                # which does not optimize the modules
                -Dpython3=false
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use python ; then
                python_moduleinto gi/overrides/
                python_foreach_impl python_domodule GExiv2.py
              fi
            }


net_misc_cat:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: net-misc
    dir:
      url: https://download.gnome.org/sources/{{ .Values.tname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.tname | default .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      s: '${WORKDIR}/{{ .Values.tname | default .Values.pn }}-{{ .Values.version }}'

  packages:
    - rygel:
        vars:
          release: "0.40"
          desc: Rygel is an open source UPnP/DLNA MediaServer
          homepage: https://wiki.gnome.org/Projects/Rygel
          license: LGPL-2.1+ CC-BY-SA-3.0 GPL-2
          inherit:
            - meson
            - systemd
            - vala
            - xdg
          iuse: X +introspection +sqlite tracker test transcode gtk-doc
          rdepend: |
            dev-libs/glib
            dev-libs/libgee:0.8
            dev-libs/libxml2:2
            media-libs/gupnp-dlna:2.0
            media-libs/gstreamer:1.0
            media-libs/gst-plugins-base:1.0
            media-libs/libmediaart:2.0
            media-plugins/gst-plugins-soup:1.0
            media-libs/gstreamer-editing-services:1.0
            net-libs/gssdp
            net-libs/gupnp
            net-libs/gupnp-av
            net-libs/libsoup:2.4
            sys-apps/util-linux
            x11-misc/shared-mime-info
            introspection? ( dev-libs/gobject-introspection:= )
            sqlite? (
              dev-db/sqlite
              dev-libs/libunistring:=
              x11-libs/gdk-pixbuf:2
            )
            tracker? ( app-misc/tracker:= )
            transcode? (
              media-libs/gst-plugins-bad:1.0
              media-plugins/gst-plugins-twolame:1.0
              media-plugins/gst-plugins-libav:1.0
            )
            X? ( x11-libs/gtk+:3 )
          depend: |
            ${RDEPEND}
            dev-util/gtk-doc-am
          bdepend: |
            $(vala_depend)
            app-text/docbook-xml-dtd:4.5
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_prepare() {
              vala_src_prepare
              default
            }
            src_configure() {
              local emesonargs=(
                $(meson_use gtk-doc api-docs)
                -Dsystemd-user-units-dir=$(systemd_get_userunitdir)
                -Dplugins=gst-launch$(use sqlite && echo ",lms,media-export")$(use tracker && echo ",tracker3")
                -Dengines=gstreamer
                -Dexamples=false
                $(meson_use test tests)
                $(meson_feature X gtk)
                $(meson_feature introspection)
              )
              meson_src_configure
            }


    - vala:
        category: dev-lang
        vars:
          inherit:
            - autotools
            - gnome3
          slot: "0.56"
          release: "0.56"
          desc: Compiler for the GObject type system
          homepage: https://wiki.gnome.org/Projects/Vala
          license: LGPL-2.1+
          rdepend: |
            dev-libs/glib
            >=dev-libs/vala-common-{{ .Values.version }}
            media-gfx/graphviz
            dev-libs/gobject-introspection:=
          depend: |
            ${RDEPEND}
            dev-libs/libxslt
            sys-devel/flex
          bdepend: |
            virtual/pkgconfig
            virtual/yacc
          body: |
            src_configure() {
                # weasyprint enables generation of PDF from HTML
                gnome3_src_configure \
                    --disable-unversioned \
                    VALAC=: \
                    WEASYPRINT=:
            }
            src_install() {
                default
                find "${D}" -name "*.la" -delete || die
            }

    - vala-common:
        category: dev-libs
        vars:
          release: "0.56"
          tname: vala
          desc: Build infrastructure for packages that use Vala
          homepage: https://wiki.gnome.org/Projects/Vala
          license: LGPL-2.1+
          body: |
            src_configure() { :; }
            src_compile() { :; }
            src_install() {
                insinto /usr/share/aclocal
                doins vala.m4 vapigen/vapigen.m4
                insinto /usr/share/vala
                doins vapigen/Makefile.vapigen
            }


mail_apps:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: mail-client
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pn }}/{{ .Values.release }}/

  packages:
    - geary:
        dir:
          matcher: "geary-.*.tar.xz$"
        transform:
          - kind: string
            match: "geary-"
            replace: ""
          - kind: string
            match: ".tar.xz"
            replace: ""
        vars:
          patches:
            - geary_30105fd4c210c8ba4e875ab003cd393064ded894.patch
          release: "3.36"
          desc: A lightweight, easy-to-use, feature-rich email client
          homepage: https://wiki.gnome.org/Apps/Geary
          license: LGPL-2.1
          inherit:
            - gnome3
            - vala
            - meson
          iuse: nls
          cdepend: |
            app-crypt/gcr:0=[gtk,introspection]
            app-crypt/libsecret
            app-text/iso-codes
            dev-db/sqlite:3
            dev-libs/glib:2[dbus]
            dev-libs/libgee:0.8=
            dev-libs/appstream-glib:0
            net-libs/gnome-online-accounts
            app-text/enchant
            dev-libs/folks:0
            dev-libs/json-glib
            dev-libs/libxml2:2
            dev-libs/gmime:3.0[vala]
            dev-libs/libpeas
            media-libs/libcanberra
            net-libs/webkit-gtk:4=[introspection]
            x11-libs/gtk+:3[introspection]
            x11-libs/libnotify
            sys-libs/libunwind
            net-mail/ytnef
            app-text/gspell[introspection,vala]
          rdepend: |
            ${CDEPEND}
            gnome-base/gsettings-desktop-schemas
            gnome-base/dconf
            nls? ( virtual/libintl )
          depend: |
            ${CDEPEND}
            app-text/gnome-doc-utils
            dev-util/desktop-file-utils
            nls? ( sys-devel/gettext )
            $(vala_depend)
            virtual/pkgconfig
          body: |
            src_prepare() {
              local i
              if use nls ; then
                if [[ -n "${LINGUAS+x}" ]] ; then
                  for i in $(cd po ; echo *.po) ; do
                    if ! has ${i%.po} ${LINGUAS} ; then
                      sed -i -e "/^${i%.po}$/d" po/LINGUAS || die
                    fi
                  done
                fi
              else
                sed -i -e 's#add_subdirectory(po)##' CMakeLists.txt || die
              fi
              gnome3_src_prepare
              vala_src_prepare
            }
            pkg_postinst() {
              gnome3_pkg_postinst
              gnome3_schemas_update
            }

glycin_gitlab:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  extensions_defs:
    rust:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    dir:
      url: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/tags'
      matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/releases/[0-9.]+"
      # Skip release candidate/beta versions
      exclude: 'rc|beta|alpha'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.gnome.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo | default .Values.pn }}/-/archive/{{ .Values.original_version }}/{{ .Values.gitlab_repo | default .Values.pn }}-{{ .Values.version }}.tar.bz2'
        #https://gitlab.gnome.org/GNOME/glycin/-/archive/2.0.7/glycin-2.0.7.tar.bz2?ref_type=tags

    vars:
      gitlab_user: GNOME
      homepage: https://gitlab.gnome.org/GNOME/glycin/
      inherit:
        - cargo
        - meson
      s: '${WORKDIR}/{{ .Values.gitlab_repo | default .Values.pn }}-{{ .Values.version }}'
      license: |
        || ( LGPL-2.1+ MPL-2.0 )
        Apache-2.0 Apache-2.0-with-LLVM-exceptions BSD-2 BSD GPL-3+ IJG ISC
        LGPL-3+ MIT Unicode-3.0
        || ( LGPL-2.1+ MPL-2.0 )
      slot: 2
      # TODO: svg creates a dep cycle because
      #       because librsvg requires gtk-pixbuf that requires gyncin-loaders
      rdepend: |
        dev-libs/glib:2
        sys-libs/libseccomp
        heif? ( >=media-libs/libheif-1.17.0:= )
        jpegxl? ( media-libs/libjxl:= )
        svg? (
          gnome-base/librsvg:2
          x11-libs/cairo
        )
      depend: '${RDEPEND}'

  packages:

    # Require glibc 2.43
    - libglycin:
        category: media-libs
        extensions:
          - rust
        vars:
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
          gitlab_repo: glycin
          desc: Glycin C-Bindings for the library
          iuse: heif jpeg2k jpegxl svg debug
          inherit:
            - cargo
            - meson
            - vala
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            src_prepare() {
              use vala && vala_src_prepare
              default
              # Fix integration with py3.9
              sed -i -e 's|import tomllib|import tomli as tomllib|g' build-aux/crates-version.py || die
            }
            src_configure() {
              local formats=(
                $(usev heif glycin-heif)
                $(usev jpeg2k glycin-jpeg2000)
                $(usev jpegxl glycin-jxl)
                $(usev svg glycin-svg)
                glycin-image-rs
              )
              local formats_s=${formats[*]}
              local emesonargs=(
                -Dprofile=$(usex debug dev release)
                -Dglycin-loaders=false
                -Dloaders="${formats_s// /,}"
                -Dtests=false
                -Dlibglycin=true
                -Dlibglycin-gtk4=false
                -Dglycin-thumbnailer=false
              )
              meson_src_configure
              ln -s "${CARGO_HOME}" "${BUILD_DIR}/cargo-home" || die
            }

    - glycin-loaders:
        category: media-libs
        extensions:
          - rust
        vars:
          extra_envs:
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
          gitlab_repo: glycin
          desc: Loaders for glycin clients (glycin crate or libglycin)
          iuse: heif jpeg2k jpegxl svg debug
          body: |
            src_unpack() {
              cargo_src_unpack
            }
            src_configure() {
              local formats=(
                $(usev heif glycin-heif)
                $(usev jpeg2k glycin-jpeg2000)
                $(usev jpegxl glycin-jxl)
                $(usev svg glycin-svg)
                glycin-image-rs
              )
              local formats_s=${formats[*]}
              local emesonargs=(
                -Dprofile=$(usex debug dev release)
                -Dglycin-loaders=true
                -Dloaders="${formats_s// /,}"
                -Dtests=false
                -Dlibglycin=false
                -Dlibglycin-gtk4=false
                -Dglycin-thumbnailer=false
              )
              meson_src_configure
              ln -s "${CARGO_HOME}" "${BUILD_DIR}/cargo-home" || die
            }


gnome_release_pkgs:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  extensions_defs:
    rust:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: gnome-extra
    dir:
      url: https://download.gnome.org/sources/{{ .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.pkgname | default .Values.pn }}-.*.tar.xz"
      exclude: "beta|rc"
    transform:
      - kind: string
        match: "{{ .Values.pkgname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""

    vars:
      license: LGPL-2.1+
      release: 49

  packages:

    - gnome-backgrounds:
        category: x11-themes
        vars:
          license: CC-BY-SA-2.0 CC-BY-SA-3.0 CC-BY-2.0 CC-BY-4.0
          desc: A set of backgrounds packaged with the GNOME desktop
          homepage: https://gitlab.gnome.org/GNOME/gnome-backgrounds
          inherit:
            - meson
          rdepend: |
            media-libs/libjxl[gdk-pixbuf]
            gnome-base/librsvg
            x11-libs/gdk-pixbuf[jpeg]
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig

    - adwaita-icon-theme-legacy:
        category: x11-themes
        vars:
          desc: Adwaita Icon Theme legacy
          homepage: https://gitlab.gnome.org/GNOME/adwaita-icon-theme-legacy
          release: 46
          license: LGPL-3 CC-BY-SA-3.0
          inherit:
            - meson
            - xdg
          rdepend: |
            x11-themes/hicolor-icon-theme
            gnome-base/librsvg:2
          depend: '${RDEPEND}'
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig
            dev-util/gtk-update-icon-cache
          body: |
            src_install() {
              meson_src_install
              # https://gitlab.gnome.org/GNOME/adwaita-icon-theme-legacy/-/issues/3
              mv "${ED}"/usr/share/licenses/adwaita-icon-theme \
                "${ED}"/usr/share/licenses/adwaita-icon-theme-legacy || die
            }

    - adwaita-icon-theme:
        category: x11-themes
        vars:
          desc: GNOME default icon theme
          homepage: https://gitlab.gnome.org/GNOME/adwaita-icon-theme
          license: '|| ( LGPL-3 CC-BY-SA-3.0 )'
          inherit:
            - meson
            - xdg
          rdepend: |
            x11-themes/hicolor-icon-theme
            gnome-base/librsvg:2
            x11-themes/adwaita-icon-theme-legacy
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig
            dev-util/gtk-update-icon-cache
          body: |
            src_install() {
              meson_src_install
              dosym ../../../../usr/share/icons/Adwaita/cursors /usr/share/cursors/xorg-x11/Adwaita
            }
            pkg_preinst() {
              # Needed until bug #834600 is solved
              if [[ -d "${EROOT}"/usr/share/cursors/xorg-x11/Adwaita ]] ; then
                rm -r "${EROOT}"/usr/share/cursors/xorg-x11/Adwaita || die
              fi
              xdg_pkg_preinst
            }

    - sysprof:
        category: dev-util
        vars:
          desc: System-wide Linux Profiler
          homepage: https://www.sysprof.com/
          iuse: gtk systemd
          inherit:
            - meson
            - systemd
            - gnome3
          license: GPL-3+ GPL-2+
          rdepend: |
            dev-libs/glib:2
            gtk? (
              x11-libs/gtk:4
              x11-libs/libadwaita
              x11-libs/cairo
              x11-libs/pango
            )
            systemd? ( sys-apps/systemd )
            dev-libs/json-glib
            dev-libs/libdex
            x11-libs/libpanel
            sys-libs/libunwind:=
            sys-auth/polkit
            dev-libs/elfutils
          depend: '${RDEPEND}'
          bdepend: |
            dev-lbis/appstream-glib
            dev-util/gdbus-codegen
            sys-devel/gettext
            sys-kernel/linux-headers
            virtual/pkgconfig
          body: |
            src_prepare() {
              default
              gnome3_environment_reset
            }
            src_configure() {
              local emesonargs=(
                $(meson_use gtk)
                -Dlibsysprof=true
                -Dinstall-static=false
                -Dsysprofd=bundled
                -Dsystemdunitdir=$(systemd_get_systemunitdir)
                # -Ddebugdir
                -Dhelp=true
                -Dtools=true
                -Dtests=false
                -Dexamples=false
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
            }
            pkg_preinst() {
              gnome3_pkg_preinst
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
            }


