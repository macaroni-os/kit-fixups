sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

target:
  name: gnome-kit
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: dev-lang/vala:0.56

    - pkg: dev-libs/vala-common

    - pkg: gnome-base/librsvg

    - pkg: gnome-extra/gnome-weather

    - pkg: mail-client/geary

    - pkg: media-libs/gexiv2
    - pkg: media-libs/glycin-loaders
    #- pkg: media-libs/libglycin

    - pkg: net-libs/glib-networking

    - pkg: net-misc/rygel

    - pkg: x11-libs/gdk-pixbuf
