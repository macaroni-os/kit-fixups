sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

target:
  name: gnome-kit
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-editors/gedit

    - pkg: app-accessibility/at-spi2-atk:2
    - pkg: app-accessibility/at-spi2-core:2

    - pkg: app-admin/system-config-printer

    - pkg: app-arch/file-roller
