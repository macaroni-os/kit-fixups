sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

target:
  name: gnome-kit
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-accessibility/at-spi2-atk:2
    - pkg: app-accessibility/at-spi2-core:2

    - pkg: dev-cpp/atkmm:0
    - pkg: dev-cpp/atkmm:2.36
    - pkg: dev-cpp/cairomm:1
    - pkg: dev-cpp/glibmm:2
    - pkg: dev-cpp/glibmm:2.68
    - pkg: dev-cpp/gtkmm:2.4
    - pkg: dev-cpp/gtkmm:3.0
    - pkg: dev-cpp/gtkmm:4.0
    - pkg: dev-cpp/pangomm:1.4
    - pkg: dev-cpp/pangomm:2.48
    - pkg: dev-cpp/mm-common

    - pkg: dev-lang/vala:0.56

    - pkg: dev-libs/appstream-glib
    - pkg: dev-libs/atk
    - pkg: dev-libs/gdl
    - pkg: dev-libs/json-glib
    - pkg: dev-libs/libdex
    - pkg: dev-libs/librevenge
    - pkg: dev-libs/vala-common

    - pkg: dev-util/sysprof

    - pkg: gnome-base/librsvg

    - pkg: gnome-extra/gnome-weather

    - pkg: mail-client/geary

    - pkg: media-libs/gexiv2
    - pkg: media-libs/glycin-loaders
    #- pkg: media-libs/libglycin

    - pkg: net-libs/glib-networking
    - pkg: net-libs/gssdp:1.6
    - pkg: net-libs/gupnp:1.6
    - pkg: net-libs/libsoup:2.4
    - pkg: net-libs/libsoup:3
    - pkg: net-libs/libcloudproviders

    - pkg: net-misc/rygel

    - pkg: x11-libs/gdk-pixbuf
    - pkg: x11-libs/gtk:4
    - pkg: x11-libs/gtk+:3
    - pkg: x11-libs/gtk+:2
    - pkg: x11-libs/libadwaita
    - pkg: x11-libs/libpanel

    - pkg: x11-misc/colord
    - pkg: x11-misc/xdg-user-dirs
    - pkg: x11-misc/xdg-user-dirs-gtk

    - pkg: x11-themes/adwaita-icon-theme
    - pkg: x11-themes/adwaita-icon-theme-legacy
    - pkg: x11-themes/gnome-backgrounds

    - pkg: virtual/libgudev
    - pkg: virtual/notification-daemon
