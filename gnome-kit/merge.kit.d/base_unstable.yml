    - pkg: x11-libs/gtk+:2
      conditions:
        - '<x11-libs/gtk+-3.0:2'
        - '>=x11-libs/gtk+-2.0:2'
    - pkg: x11-libs/gtksourceview:3.0
    - pkg: x11-libs/gtksourceview:4
    - pkg: x11-libs/gtksourceview:5
    - pkg: x11-libs/libadwaita
