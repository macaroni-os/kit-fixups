    - pkg: gnome-extra/evolution-ews
    - pkg: gnome-extra/gnome-boxes
    - pkg: gnome-extra/gnome-browser-connector
    - pkg: gnome-extra/gnome-calculator
    - pkg: gnome-extra/gnome-calendar
    - pkg: gnome-extra/gnome-characters
    - pkg: gnome-extra/gnome-clocks
    - pkg: gnome-extra/gnome-contacts
    - pkg: gnome-extra/gnome-color-manager
    - pkg: gnome-extra/gnome-power-manager
    - pkg: gnome-extra/gnome-shell-extensions
    - pkg: gnome-extra/gnome-shell-extension-dash-to-dock
    - pkg: gnome-extra/gnome-shell-extension-desktop-icons
    - pkg: gnome-extra/gnome-shell-extension-transparent-topbar
    - pkg: gnome-extra/gnome-system-monitor
    - pkg: gnome-extra/gnome-software
    - pkg: gnome-extra/gnome-tweaks
    - pkg: gnome-extra/gnome-weather
    - pkg: gnome-extra/gucharmap:2.90
    - pkg: gnome-extra/yelp
    - pkg: gnome-extra/mousetweaks
