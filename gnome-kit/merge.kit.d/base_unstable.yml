        - '<gnome-base/gnome-session-49'
    - pkg: gnome-base/gnome-settings-daemon
    - pkg: gnome-base/gnome-shell
    - pkg: gnome-base/gsettings-desktop-schemas
    - pkg: gnome-base/gvfs
    - pkg: gnome-base/nautilus

    - pkg: gnome-extra/endeavour
