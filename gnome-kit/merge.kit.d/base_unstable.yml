sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

- name: "gnome-kit"
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: "mark-unstable"

target:
  name: gnome-kit
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: mark-iii

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-cdr/brasero

    - pkg: app-editors/gedit

    - pkg: app-accessibility/at-spi2-atk:2
    - pkg: app-accessibility/at-spi2-core:2

    - pkg: app-admin/system-config-printer

    - pkg: app-arch/file-roller
    - pkg: app-arch/gnome-autoar

    - pkg: app-crypt/seahorse

    - pkg: app-dicts/gnome-dictionary

    - pkg: app-misc/bijiben
    - pkg: app-misc/localsearch
    - pkg: app-misc/geoclue
    - pkg: app-misc/gnote
    - pkg: app-misc/tinysparql

    - pkg: dev-cpp/atkmm:0
      conditions:
        - '<dev-cpp/atkmm-2.33:0'
    - pkg: dev-cpp/atkmm:2.36
      conditions:
        - '<dev-cpp/atkmm-2.37:2.36'
    - pkg: dev-cpp/cairomm:0
      conditions:
        - '<dev-cpp/cairomm-1.15.0:0'
    - pkg: dev-cpp/cairomm:1
      conditions:
        - '>=dev-cpp/cairomm-1.15.0:1'
    - pkg: dev-cpp/glibmm:2
      conditions:
        - '<dev-cpp/glibmm-2.68:2'
    - pkg: dev-cpp/glibmm:2.68
      conditions:
        - '<dev-cpp/glibmm-2.87:2.68'
    - pkg: dev-cpp/gtkmm:2.4
      conditions:
        - '<dev-cpp/gtkmm-3.0:2.4'
    - pkg: dev-cpp/gtkmm:3.0
      conditions:
        - '<dev-cpp/gtkmm-4.0:3.0'
    - pkg: dev-cpp/gtkmm:4.0
      conditions:
        - '<dev-cpp/gtkmm-5.0:4.0'
    - pkg: dev-cpp/pangomm:1.4
      conditions:
        - '<dev-cpp/pangomm-2.0:1.4'
    - pkg: dev-cpp/pangomm:2.48
      conditions:
        - '<dev-cpp/pangomm-3.0:2.48'
    - pkg: dev-cpp/mm-common

    - pkg: dev-lang/vala:0.56

    - pkg: dev-libs/appstream-glib
    - pkg: dev-libs/atk
    - pkg: dev-libs/folks
    - pkg: dev-libs/gdl
    - pkg: dev-libs/gjs
    - pkg: dev-libs/json-glib
    - pkg: dev-libs/libdazzle
    - pkg: dev-libs/libdex
    - pkg: dev-libs/libgdata
    - pkg: dev-libs/libgedit-amtk
    - pkg: dev-libs/libgedit-gtksourceview
    - pkg: dev-libs/libgedit-gfls
    - pkg: dev-libs/libgedit-tepl
    - pkg: dev-libs/libgee
    - pkg: dev-libs/libgit2-glib
    - pkg: dev-libs/libgweather
    - pkg: dev-libs/libgnome-games-support:1
      conditions:
        - '<dev-libs/libgnome-games-support-2.0:1'
    - pkg: dev-libs/libgnome-games-support:2
      conditions:
        - '>=dev-libs/libgnome-games-support-2.0:2'
    - pkg: dev-libs/libgudev
    - pkg: dev-libs/libgusb
    - pkg: dev-libs/libhandy
    - pkg: dev-libs/libical
    - pkg: dev-libs/libmanette
    - pkg: dev-libs/libpeas:0
