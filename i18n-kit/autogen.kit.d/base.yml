net_misc_github:
  generator: builtin-github
  defaults:
    category: app-i18n
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases

  extensions_defs:
    golang:
      opts:

  packages:
    - ibus:
        vars:
          python_compat: python3+
          inherit:
            - autotools
            - bash-completion-r1
            - gnome3
            - python-r1
            - toolchain-funcs
            - vala
          iuse: |
            X appindicator +emoji gtk2 +gtk3 +gtk4 +gui +introspection
            libnotify nls +python +unicode +vala wayland
          required_use: |
            appindicator? ( gtk3 )
            python? (
              ${PYTHON_REQUIRED_USE}
              introspection
            )
            vala? ( introspection )
            X? ( gtk3 )
            gtk3? ( wayland? ( introspection ) )
          rdepend: |
            app-text/iso-codes
            dev-libs/glib:2
            gnome-base/dconf
            gnome-base/librsvg:2
            sys-apps/dbus[X?]
            X? (
              x11-libs/libX11
              x11-libs/libXfixes
            )
            appindicator? ( dev-libs/libdbusmenu[gtk3?] )
            gtk2? ( x11-libs/gtk+:2 )
            gtk3? ( x11-libs/gtk+:3 )
            gtk4? ( x11-libs/gtk:4 )
            gui? (
              x11-libs/libX11
              x11-libs/libXi
            )
            introspection? ( dev-libs/gobject-introspection )
            libnotify? ( x11-libs/libnotify )
            nls? ( virtual/libintl )
            python? (
              ${PYTHON_DEPS}
              dev-python/pygobject:3[${PYTHON_USEDEP}]
              gui? (
                x11-libs/gtk+:3[introspection]
              )
            )
            wayland? (
              dev-libs/wayland
              x11-libs/libxkbcommon
            )
          depend: '${RDEPEND}'
          bdepend: |
            $(vala_depend)
            dev-libs/glib:2
            virtual/pkgconfig
            x11-misc/xkeyboard-config
            emoji? (
              app-i18n/unicode-cldr
              app-i18n/unicode-emoji
            )
            nls? ( sys-devel/gettext )
            unicode? ( app-i18n/unicode-data )
          pdepend: |
            app-i18n/ibus-ime-backends
          body: |
            src_prepare() {
                vala_src_prepare --ignore-use
                if ! has_version 'x11-libs/gtk+:3[wayland]'; then
                    touch ui/gtk3/panelbinding.vala \
                        ui/gtk3/panel.vala \
                        ui/gtk3/emojierapp.vala || die
                fi
                if ! use emoji; then
                    touch \
                        tools/main.vala \
                        ui/gtk3/panel.vala || die
                fi
                if ! use appindicator; then
                    touch ui/gtk3/panel.vala || die
                fi

                # for multiple Python implementations
                sed -i "s/^\(PYGOBJECT_DIR =\).*/\1/" bindings/Makefile.am || die
                # fix for parallel install
                sed -i "/^if ENABLE_PYTHON2/,/^endif/d" bindings/pygobject/Makefile.am || die
                # require user interaction
                sed -i "/^TESTS_C += ibus-\(compose\|keypress\)/d" src/tests/Makefile.am || die
                sed -i "/^bash_completion/d" tools/Makefile.am || die
                default
                eautoreconf
                xdg_environment_reset
            }
            src_configure() {
                local unicodedir="${EPREFIX}"/usr/share/unicode
                local python_conf=()
                if use python; then
                    python_setup
                    python_conf+=(
                        $(use_enable gui setup)
                        --with-python=${EPYTHON}
                    )
                else
                    python_conf+=( --disable-setup )
                fi
                local myconf=(
                    $(use_enable X xim)
                    $(use_enable appindicator)
                    $(use_enable emoji emoji-dict)
                    $(use_with emoji unicode-emoji-dir "${unicodedir}"/emoji)
                    $(use_with emoji emoji-annotation-dir "${unicodedir}"/cldr/common/annotations)
                    $(use_enable gtk2)
                    $(use_enable gtk3)
                    $(use_enable gtk4)
                    $(use_enable gui ui)
                    $(use_enable introspection)
                    $(use_enable libnotify)
                    $(use_enable nls)
                    --disable-systemd-services
                    --disable-tests
                    $(use_enable unicode unicode-dict)
                    $(use_with unicode ucd-dir "${EPREFIX}/usr/share/unicode-data")
                    $(use_enable vala)
                    $(use_enable wayland)
                    "${python_conf[@]}"
                )
                econf "${myconf[@]}"
            }
            src_install() {
                default
                # Remove la files
                find "${ED}" -name '*.la' -delete || die
                # Remove stray python files generated by the build system
                find "${ED}" -name '*.pyc' -exec rm -f {} \; || die
                find "${ED}" -name '*.pyo' -exec rm -f {} \; || die
                if use python; then
                    python_install() {
                        emake -C bindings/pygobject \
                            pyoverridesdir="$(${EPYTHON} -c 'import gi; print(gi._overridesdir)')" \
                            DESTDIR="${D}" \
                            install

                        python_optimize
                    }
                    python_foreach_impl python_install
                fi
                keepdir /usr/share/ibus/engine
                newbashcomp tools/${PN}.bash ${PN}
                insinto /etc/X11/xinit/xinput.d
                newins xinput-${PN} ${PN}.conf
            }
            pkg_postinst() {
                gnome3_pkg_postinst
                dconf update
            }
            pkg_postrm() {
                gnome3_pkg_postrm
            }

unicode:
  generator: builtin-dirlisting
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: app-i18n
    dir:
      url: 'https://www.unicode.org/Public/{{ .Values.dir_suffix | default "" }}'
      matcher: '^[0-9.]+'
    vars:
      license: unicode
      depend: |
        app-arch/unzip
      s: '${WORKDIR}'

  packages:

    - unicode-cldr:
        selector:
          # TODO: migrate to github with different tarballs.
          - '<49'
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.zip'
            url: https://unicode.org/Public/{{ .Values.dir_suffix }}{{ .Values.version }}/cldr-common-{{ .Values.version }}.zip
        vars:
          dir_suffix: 'cldr/'
          desc: Unicode Common Locale Data Repository
          homepage: https://cldr.unicode.org/
          body: |
            src_install() {
                insinto /usr/share/${PN/-//}
                doins -r common
            }

    - unicode-data:
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-UCD.zip'
            url: https://unicode.org/Public/{{ .Values.version }}/ucd/UCD.zip

          - name: '{{ .Values.pn }}-{{ .Values.version }}-Unihan.zip'
            url: https://unicode.org/Public/{{ .Values.version }}/ucd/Unihan.zip
        vars:
          desc: Unicode data from unicode.org
          homepage: https://unicode.org/ucd/
          body: |
            src_unpack() {
                # Unihan.zip needs to be installed as a zip for reverse deps
                unpack ${P}-UCD.zip
            }
            src_install() {
                insinto /usr/share/${PN}
                doins -r "${S}"/*
                newins "${DISTDIR}"/${P}-Unihan.zip Unihan.zip
            }


