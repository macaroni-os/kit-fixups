  template:
    engine: helm

  defaults:
    template: ../../templates/simple.tmpl
    category: virtual
    vars:
      desc: Virtual for Java Runtime Environment (JRE)

  packages:
    - jre:
        revision: 2
        vars:
          slot: "1.8"
          versions:
            - "1.8.0"
          rdepend: |
            || (
              virtual/jdk:1.8
              dev-java/openjdk-jre-bin:8[gentoo-vm(+)]
