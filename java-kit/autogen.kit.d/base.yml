dev_java_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-java

  packages:
    - ant-bin:
        dir:
          url: https://dlcdn.apache.org/ant/binaries/
          matcher: "apache-ant-.*.tar.xz$"
          exclude: "alpha"
        transform:
          - kind: string
            match: 'apache-ant-'
            replace: ''
          - kind: string
            match: '-bin.tar.xz'
            replace: ''
        selector:
          - '<1.11'
        vars:
          desc: Project Management and Comprehension Tool for Java
          homepage: https://ant.apache.org/
          slot: 1.10
          inherit:
            - java-pkg-2
          license: Apache-2.0
          extra_envs:
            - 'ANT="${PN}-${SLOT}"'
            - 'ANT_SHARE="/usr/share/${ANT}"'
          s: '${WORKDIR}/apache-{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}'
          # depend-java-query used on java-pkg-2 eclass resolves only virtual/jdk with slot.
          depend: |
            || (
              virtual/jdk:11
              virtual/jdk:17
              virtual/jdk:21
            )
            app-eselect/eselect-java
            dev-java/java-config
          rdepend: |
            || (
              virtual/jre:11
              virtual/jre:17
              virtual/jre:21
            )
          body: |
            src_install() {
              dodir "${ANT_SHARE}"

              cp -Rp bin etc lib manual "${ED}/${ANT_SHARE}" || die "failed to copy"

              java-pkg_regjar "${ED}/${ANT_SHARE}"/etc/*.jar
              java-pkg_regjar "${ED}/${ANT_SHARE}"/lib/*.jar

              dodoc NOTICE README WHATSNEW INSTALL CONTRIBUTORS KEYS LICENSE

              dodir /usr/bin
              dosym "${ANT_SHARE}/bin/ant" /usr/bin/ant-${SLOT}
              dosym /usr/bin/ant-${SLOT} /usr/bin/ant
            }


