dev_java_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-java

  packages:
    - ant-bin:
        dir:
          url: https://dlcdn.apache.org/ant/binaries/
          matcher: "apache-ant-.*.tar.xz$"
          exclude: "alpha"
        transform:
          - kind: string
            match: 'apache-ant-'
            replace: ''
          - kind: string
            match: '-bin.tar.xz'
            replace: ''
        selector:
          - '<1.11'
        vars:
          desc: Project Management and Comprehension Tool for Java
          homepage: https://ant.apache.org/
          slot: "1.10"
          inherit:
            - java-pkg-2
          license: Apache-2.0
          extra_envs:
            - 'ANT="${PN}-${SLOT}"'
            - 'ANT_SHARE="/usr/share/${ANT}"'
          s: '${WORKDIR}/apache-{{ .Values.pn | replace "-bin" "" }}-{{ .Values.version }}'
          # depend-java-query used on java-pkg-2 eclass resolves only virtual/jdk with slot.
          depend: |
            || (
              virtual/jdk:11
              virtual/jdk:17
              virtual/jdk:21
            )
            app-eselect/eselect-java
            dev-java/java-config
          rdepend: |
            || (
              virtual/jre:11
              virtual/jre:17
              virtual/jre:21
            )
          body: |
            src_install() {
              dodir "${ANT_SHARE}"

              cp -Rp bin etc lib manual "${ED}/${ANT_SHARE}" || die "failed to copy"

              java-pkg_regjar "${ED}/${ANT_SHARE}"/etc/*.jar
              java-pkg_regjar "${ED}/${ANT_SHARE}"/lib/*.jar

              dodoc NOTICE README WHATSNEW INSTALL CONTRIBUTORS KEYS LICENSE

              dodir /usr/bin
              dosym "${ANT_SHARE}/bin/ant" /usr/bin/ant-${SLOT}
              dosym /usr/bin/ant-${SLOT} /usr/bin/ant
            }

openjdk_bin:
  generator: builtin-github
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-java
    github:
      user: adoptium
      match: '^jdk-[0-9]'
      # The per-major repos carry hundreds of -ea-beta tags, so the GA
      # update tags are not on the first tags page.
      ignore_tags: true
    transform:
      - kind: string
        match: 'jdk-'
        replace: ''
      - kind: string
        match: '+'
        replace: '_p'
    vars:
      inherit:
        - java-vm-2
      license: GPL-2-with-classpath-exception
      restrict: preserve-libs splitdebug
      extra_envs:
        - 'QA_PREBUILT="*"'
      homepage: https://adoptium.net
      desc: Prebuilt Java JDK binaries provided by Eclipse Temurin
      # riscv64/arm are not gated: Temurin publishes no glibc linux build
      # for arm and the riscv64 builds lag the release tags (probed 2026-11-22).
      iuse: alsa cups headless-awt selinux source
      rdepend: |
        >=sys-apps/baselayout-java-0.1.0-r1
        media-libs/fontconfig:1.0
        media-libs/freetype:2
        media-libs/harfbuzz
        sys-libs/glibc
        sys-libs/zlib
        alsa? ( media-libs/alsa-lib )
        cups? ( net-print/cups )
        selinux? ( sec-policy/selinux-java )
        !headless-awt? (
          x11-libs/libX11
          x11-libs/libXext
          x11-libs/libXi
          x11-libs/libXrender
          x11-libs/libXtst
        )
      s: '${WORKDIR}/jdk-{{ .Values.pv | replace "_p" "+" }}'
      body: |
        src_install() {
          local dest="/opt/${P}"
          local ddest="${ED}/${dest#/}"

          # media-libs provides both libraries; upstream bundles libfreetype
          # only on x86_64. Both are dlopened by libfontmanager.so.
          rm -vf lib/libfreetype.so || die
          rm -vf lib/libharfbuzz.so || die

          if ! use alsa ; then
            rm -v lib/libjsound.* || die
          fi

          if use headless-awt ; then
            rm -v lib/lib*{[jx]awt,splashscreen}* || die
          fi

          if ! use source ; then
            rm -v lib/src.zip || die
          fi

          rm -v lib/security/cacerts || die
          dosym ../../../../etc/ssl/certs/java/cacerts "${dest}"/lib/security/cacerts

          dodir "${dest}"
          cp -pPR * "${ddest}" || die

          dosym "${P}" "/opt/${PN}-${SLOT}"

          java-vm_install-env "${FILESDIR}"/${PN}.env.sh
          java-vm_set-pax-markings "${ddest}"
          java-vm_revdep-mask
          java-vm_sandbox-predict /dev/random /proc/self/coredump_filter
        }

        pkg_postinst() {
          java-vm-2_pkg_postinst
        }

  packages:
    # Java 21 LTS
    - openjdk-bin:
        github:
          repo: temurin21-binaries
        selector:
          - '>=21'
          - '<22'
        assets:
          - name: '{{ .Values.p }}-amd64.tar.gz'
            matcher: '^OpenJDK21U-jdk_x64_linux_hotspot_.*\.tar\.gz$'
            use: amd64
          - name: '{{ .Values.p }}-arm64.tar.gz'
            matcher: '^OpenJDK21U-jdk_aarch64_linux_hotspot_.*\.tar\.gz$'
            use: arm64
          - name: '{{ .Values.p }}-ppc64.tar.gz'
            matcher: '^OpenJDK21U-jdk_ppc64le_linux_hotspot_.*\.tar\.gz$'
            use: ppc64
          - name: '{{ .Values.p }}-riscv64.tar.gz'
            matcher: '^OpenJDK21U-jdk_riscv64_linux_hotspot_.*\.tar\.gz$'
            use: riscv64
        vars:
          # The 21 line keeps riscv64: Temurin ships a riscv64 glibc build for
          # every 21 tag (21.0.13.1+2 included) and the legacy 21 ebuilds carry it.
          iuse: alsa cups headless-awt riscv64 selinux source
          slot: "21"

    # Java 25 LTS
    - openjdk-bin:
        github:
          repo: temurin25-binaries
        selector:
          - '>=25'
          - '<26'
        assets:
          - name: '{{ .Values.p }}-amd64.tar.gz'
            matcher: '^OpenJDK25U-jdk_x64_linux_hotspot_.*\.tar\.gz$'
            use: amd64
          - name: '{{ .Values.p }}-arm64.tar.gz'
            matcher: '^OpenJDK25U-jdk_aarch64_linux_hotspot_.*\.tar\.gz$'
            use: arm64
          - name: '{{ .Values.p }}-ppc64.tar.gz'
            matcher: '^OpenJDK25U-jdk_ppc64le_linux_hotspot_.*\.tar\.gz$'
            use: ppc64
        vars:
          slot: "25"

    # Java 27: 27.0.1.1+4 has no linux-glibc aarch64 asset, so 27.0.1.0.2+1
    # is the newest tag serving amd64/arm64/ppc64 (probed 2026-11-22).
    - openjdk-bin:
        github:
          repo: temurin27-binaries
        exclude:
          - '^27\.0\.1\.1'
        selector:
          - '>=27'
          - '<28'
        assets:
          - name: '{{ .Values.p }}-amd64.tar.gz'
            matcher: '^OpenJDK27U-jdk_x64_linux_hotspot_.*\.tar\.gz$'
            use: amd64
          - name: '{{ .Values.p }}-arm64.tar.gz'
            matcher: '^OpenJDK27U-jdk_aarch64_linux_hotspot_.*\.tar\.gz$'
            use: arm64
          - name: '{{ .Values.p }}-ppc64.tar.gz'
            matcher: '^OpenJDK27U-jdk_ppc64le_linux_hotspot_.*\.tar\.gz$'
            use: ppc64
        vars:
          slot: "27"

