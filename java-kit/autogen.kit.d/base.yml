virtual_jdk:
  generator: builtin-noop
  template:
    engine: helm

  defaults:
    template: ../../templates/simple.tmpl
    category: virtual
    vars:
      desc: Virtual for Java Development Kit (JDK)
      iuse: headless-awt

  packages:
    - jdk:
        revision: 5
        vars:
          slot: "1.8"
          versions:
            - "1.8.0"
          rdepend: |
            || (
              dev-java/icedtea-bin:8[headless-awt=]
              dev-java/openjdk-bin:8[gentoo-vm(+),headless-awt=]
              dev-java/icedtea:8[headless-awt=]
              dev-java/openjdk:8[gentoo-vm(+),headless-awt=]
            )

    - jdk:
        revision: 2
        vars:
          slot: "11"
          versions:
            - "11"
          rdepend: |
            || (
              dev-java/openjdk-bin:11[gentoo-vm(+),headless-awt=]
              dev-java/openjdk:11[gentoo-vm(+),headless-awt=]
            )

    - jdk:
        revision: 1
        vars:
          slot: "17"
          versions:
            - "17"
          rdepend: |
            || (
              dev-java/oracle-jdk-bin:${SLOT}[gentoo-vm(+),headless-awt=]
              dev-java/openjdk-bin:${SLOT}[gentoo-vm(+),headless-awt=]
              dev-java/openjdk:${SLOT}[gentoo-vm(+),headless-awt=]
            )

    - jdk:
        vars:
          slot: "21"
          versions:
            - "21"
          rdepend: |
            || (
              dev-java/oracle-jdk-bin:${SLOT}[gentoo-vm(+),headless-awt=]
              dev-java/openjdk-bin:${SLOT}[gentoo-vm(+),headless-awt=]
              dev-java/openjdk:${SLOT}[gentoo-vm(+),headless-awt=]
            )

    - jdk:
        vars:
          slot: "25"
          versions:
            - "25"
          rdepend: |
            || (
              dev-java/oracle-jdk-bin:${SLOT}[gentoo-vm(+),headless-awt=]
              dev-java/openjdk-bin:${SLOT}[gentoo-vm(+),headless-awt=]
              dev-java/openjdk:${SLOT}[gentoo-vm(+),headless-awt=]
            )

    - jdk:
        vars:
          slot: "27"
          versions:
            - "27"
          rdepend: |
            || (
              dev-java/oracle-jdk-bin:${SLOT}[gentoo-vm(+),headless-awt=]
              dev-java/openjdk-bin:${SLOT}[gentoo-vm(+),headless-awt=]
              dev-java/openjdk:${SLOT}[gentoo-vm(+),headless-awt=]
            )

virtual_jre:
