stable_kde_stuff:
  generator: builtin-dirlisting

  defaults:
    vars:
      qt_slot: '6'
      # For fresh releases
      #download_prefixurl: https://download.kde.org/stable/
      # For old releases
      download_prefixurl: https://download.kde.org/Attic/

    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    dir:
      url: '{{ .Values.download_prefixurl }}/{{ .Values.path | default .Values.pn }}/'
      matcher: "[0-9.]+/$"
      exclude: '[0-9]{5}'
    assets:
      - name: '{{ .Values.pkgname | default .Values.pn }}-{{ .Values.version }}.tar.xz'
        url: '{{ .Values.download_prefixurl }}/{{ .Values.path | default .Values.pn }}/{{ .Values.version }}/{{ .Values.pkgname | default .Values.pn }}-{{ .Values.version }}.tar.xz'

  packages:

    - kio-fuse:
        category: kde-misc
        assets:
          - name: '{{ .Values.pkgname | default .Values.pn }}-{{ .Values.version }}.tar.xz'
            url: 'https://download.kde.org/stable/{{ .Values.path | default .Values.pn }}/{{ .Values.pkgname | default .Values.pn }}-{{ .Values.version }}.tar.xz'
        dir:
          matcher: '{{ .Values.pn }}-[0-9.]+.tar.xz'
          exclude: ''
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          inherit:
            - cmake
          slot: '5'
          desc: FUSE interface for KIO
          homepage: https://github.com/KDE/kio-fuse
          license: GPL-3+
          rdepend: |
            dev-qt/qtbase:{{ .Values.qt_slot }}[gui]
            kde-frameworks/kcoreaddons:6
            kde-frameworks/ki18n:6
            kde-frameworks/kio:6
          depend: '${RDEPEND}'
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_WITH_QT6=ON
              )
              cmake_src_configure
            }

    - kirigami-addons:
        assets:
          - name: '{{ .Values.pkgname | default .Values.pn }}-{{ .Values.version }}.tar.xz'
            url: 'https://download.kde.org/stable/{{ .Values.path | default .Values.pn }}/{{ .Values.pkgname | default .Values.pn }}-{{ .Values.version }}.tar.xz'

        dir:
          matcher: '{{ .Values.pn }}-1[0-9.]+.tar.xz'
          exclude: ''
        transform:
          - kind: string
            match: '{{ .Values.pn }}-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        category: dev-libs
        vars:
          slot: '6'
          desc: Visual end user components for Kirigami-based applications
          homepage: https://invent.kde.org/libraries/kirigami-addons
          license: '|| ( GPL-2 GPL-3 LGPL-3 ) LGPL-2.1+'
          inherit:
            - cmake
          cdepend: |
            dev-qt/qtbase:{{ .Values.qt_slot }}[gui]
            dev-qt/qtdeclarative:{{ .Values.qt_slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kglobalaccel:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
          rdepend: |
            ${CDEPEND}
            dev-qt/qtmultimedia:6[qml]
            kde-frameworks/qqc2-desktop-style:{{ .Values.slot }}
            kde-plasma/libplasma:{{ .Values.slot }}
          depend: |
            ${CDEPEND}

    - phonon-vlc:
        category: media-libs
        vars:
          s: '${WORKDIR}/phonon-backend-vlc-{{ .Values.version }}'
          pkgname: 'phonon-backend-vlc'
          path: 'phonon/phonon-backend-vlc/'
          homepage: https://community.kde.org/Phonon
          desc: VLC backend for the Phonon multimedia library
          license: LGPL-2.1+ || ( LGPL-2.1 LGPL-3 )
          inherit:
            - cmake
            - flag-o-matic
          iuse: debug
          rdepend: |
            dev-qt/qtbase:{{ .Values.qt_slot }}[gui]
            >=media-libs/phonon-4.12.0
            media-video/vlc:=[dbus,ogg,vorbis(+)]
          depend: '${RDEPEND}'
          bdepend: |
            dev-libs/libpcre2:*
            dev-qt/qttools:6[linguist]
            >=kde-frameworks/extra-cmake-modules-5.115.0:*
            virtual/pkgconfig
          body: |
            src_configure() {
              use debug || append-cppflags -DQT_NO_DEBUG

              local mycmakeargs=(
                -DQT_MAJOR_VERSION=6
                -DPHONON_BUILD_QT5=OFF
                -DPHONON_BUILD_QT6=ON
                -DKDE_INSTALL_USE_QT_SYS_PATHS=ON
                -DKDE_INSTALL_DOCBUNDLEDIR="${EPREFIX}/usr/share/help"
              )
              cmake_src_configure
            }

    - phonon:
        category: media-libs
        vars:
          license: '|| ( LGPL-2.1 LGPL-3 ) !pulseaudio? ( || ( GPL-2 GPL-3 ) )'
          homepage: https://community.kde.org/Phonon
          inherit:
            - cmake
            - desktop
            - flag-o-matic
          iuse: debug designer pulseaudio +vlc
          bdepend: |
            dev-libs/libpcre2:*
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
            >=kde-frameworks/extra-cmake-modules-5.115.0:*
            virtual/pkgconfig
          rdepend: |
            dev-qt/qt5compat:{{ .Values.qt_slot }}
            dev-qt/qtbase:{{ .Values.qt_slot }}[gui]
            designer? ( dev-qt/qttools:{{ .Values.qt_slot }}[designer] )
            pulseaudio? (
              dev-libs/glib:2
              media-sound/pulseaudio[glib]
            )
            !media-libs/phonon-gstreamer
            || (
              kde-frameworks/breeze-icons:6
              kde-frameworks/oxygen-icons:*
            )
          depend: '${RDEPEND}'
          pdepend: |
            vlc? ( >=media-libs/phonon-vlc-0.12.0 )
          desc: KDE multimedia abstraction library
          body: |
            src_configure() {
              use debug || append-cppflags -DQT_NO_DEBUG

              local mycmakeargs=(
                -DQT_MAJOR_VERSION=6
                -DPHONON_BUILD_QT5=OFF
                -DPHONON_BUILD_QT6=ON
                -DPHONON_BUILD_SETTINGS=ON
                -DKDE_INSTALL_USE_QT_SYS_PATHS=ON
                -DKDE_INSTALL_DOCBUNDLEDIR="${EPREFIX}/usr/share/help"
                -DPHONON_BUILD_DESIGNER_PLUGIN=$(usex designer)
                -DCMAKE_DISABLE_FIND_PACKAGE_GLIB2=$(usex !pulseaudio)
                -DCMAKE_DISABLE_FIND_PACKAGE_PulseAudio=$(usex !pulseaudio)
              )

              # Use make instead of ninja to avoid multiple outputs issue
              export CMAKE_MAKEFILE_GENERATOR=emake
              cmake_src_configure
            }

            src_install() {
              cmake_src_install
              make_desktop_entry "${PN}settings" \
                "Phonon Audio and Video" preferences-desktop-sound
            }


    - qca:
        category: app-crypt
        vars:
          desc: Qt Cryptographic Architecture (QCA)
          homepage: https://userbase.kde.org/QCA
          license: LGPL-2.1
          slot: '2'
          inherit:
            - kde6
            - cmake-utils
            - qmake-utils
          iuse: botan debug doc examples gcrypt gpg logger nss pkcs11 +qt6 sasl softstore +ssl
          rdepend: |
            qt6? (
              dev-qt/qt5compat:{{ .Values.qt_slot }}
              dev-qt/qtbase:{{ .Values.qt_slot }}
            )
            !qt6? (
              dev-qt/qtcore:5
              dev-qt/qtconcurrent:5
            )
            botan? ( dev-libs/botan:3= )
            gcrypt? ( dev-libs/libgcrypt:= )
            gpg? ( app-crypt/gnupg )
            nss? ( dev-libs/nss )
            pkcs11? (
            >=dev-libs/openssl-1.1
            dev-libs/pkcs11-helper
            )
            sasl? ( dev-libs/cyrus-sasl:2 )
            ssl? ( >=dev-libs/openssl-1.1:= )
          depend: |
            ${RDEPEND}
          bdepend: |
            virtual/pkgconfig
            doc? (
              app-doc/doxygen[dot]
              virtual/latex-base
            )
          body: |
            qca_plugin_use() {
              echo -DWITH_${2:-$1}_PLUGIN=$(usex "$1")
            }
            src_configure() {
              # Use emake instead of Ninja to avoid depslog issues
              export CMAKE_MAKEFILE_GENERATOR="emake"

              local mycmakeargs=(
                -DBUILD_WITH_QT6=$(usex qt6)
                $(qca_plugin_use botan)
                $(qca_plugin_use gcrypt)
                $(qca_plugin_use gpg gnupg)
                $(qca_plugin_use logger)
                $(qca_plugin_use nss)
                $(qca_plugin_use pkcs11)
                $(qca_plugin_use sasl cyrus-sasl)
                $(qca_plugin_use softstore)
                $(qca_plugin_use ssl ossl)
                -DBUILD_TESTS=OFF
              )

              if use qt6; then
                mycmakeargs+=(
                  -DQCA_FEATURE_INSTALL_DIR="${EPREFIX}/usr/lib64/qt6/mkspecs/features"
                  -DQCA_PLUGINS_INSTALL_DIR="${EPREFIX}/usr/lib64/qt6/plugins"
                )
              else
                mycmakeargs+=(
                  -DQCA_FEATURE_INSTALL_DIR="${EPREFIX}/usr/lib64/qt5/mkspecs/features"
                  -DQCA_PLUGINS_INSTALL_DIR="${EPREFIX}/usr/lib64/qt5/plugins"
                )
              fi

              cmake-utils_src_configure
            }
            src_compile() {
              cmake-utils_src_compile
              use doc && cmake_src_make doc
            }
            src_install() {
              cmake-utils_src_install

              if use doc; then
              pushd "${BUILD_DIR}" > /dev/null || die
              dodoc -r apidocs/html
              popd > /dev/null || die
              fi

              if use examples; then
              dodoc -r "${S}"/examples
              fi
            }

    - kdiagram:
        category: dev-libs
        vars:
          homepage: https://invent.kde.org/graphics/kdiagram
          desc: Powerful libraries (KChart, KGantt) for creating business diagrams
          license: GPL-2
          slot: 6
          inherit:
            - kde6
          iuse: examples test
          required_use: test? ( examples )
          rdepend: |
            dev-qt/qtbase:{{ .Values.qt_slot }}[gui]
            dev-qt/qtsvg:{{ .Values.qt_slot }}
            dev-qt/qttools:{{ .Values.qt_slot }}
          depend: '${RDEPEND}'

    - ktextaddons:
        category: dev-libs
        dir:
          url: 'https://download.kde.org/stable/{{ .Values.path | default .Values.pn }}/'
          matcher: "ktextaddons-1.[0-9.]+.tar.xz$"
          exclude: '[0-9]{5}'
        transform:
          - kind: string
            match: 'ktextaddons-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            url: 'https://download.kde.org/stable/ktextaddons/{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
        vars:
          homepage: https://invent.kde.org/libraries/ktextaddons
          desc: Various text handling addons
          license: GPL-2
          slot: 6
          inherit:
            - kde6
          iuse: speech
          restrict: test
          rdepend: |
            >=dev-libs/qtkeychain-0.15[qt6]
            dev-qt/qtbase:{{ .Values.qt_slot }}[gui,sql]
            dev-qt/qtmultimedia:{{ .Values.qt_slot }}
            kde-frameworks/karchive:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kitemviews:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/ktextwidgets:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/sonnet:{{ .Values.slot }}
            kde-frameworks/syntax-highlighting:{{ .Values.slot }}
            speech? ( dev-qt/qtspeech:{{ .Values.qt_slot }} )
            !{{ .Values.category }}/{{ .Values.pn }}:5
          depend: '${DEPEND}'
          body: |
            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package speech Qt6TextToSpeech)
                    -DSPEAK_TO_TEXT_VOSK_PLUGIN=OFF
                    -DOPTION_ADD_AUTOGENERATETEXT=OFF
                )
                kde6_src_configure
            }

    - krita:
        category: media-gfx
        dir:
          matcher: '^[0-9][0-9.]*/$'
        vars:
          download_prefixurl: https://download.kde.org/stable/
          desc: Free digital painting application. Digital Painting, Creative Freedom!
          homepage: https://apps.kde.org/krita/ https://krita.org/en/
          license: GPL-3
          python_compat: python3+
          inherit:
            - kde6
            - python-single-r1
          iuse: color-management debug fftw gif +gsl heif jpeg2k jpegxl media +mypaint-brush-engine openexr pdf +raw wayland webp
          required_use: '${PYTHON_REQUIRED_USE}'
          rdepend: |
            ${PYTHON_DEPS}
            dev-cpp/eigen:3
            >=dev-cpp/xsimd-13.0.0
            dev-libs/boost:=
            dev-libs/libunibreak:=
            >=dev-libs/quazip-1.3:0=[qt6(+)]
            $(python_gen_cond_dep '
              dev-python/PyQt6[${PYTHON_USEDEP}]
              dev-python/sip:=[${PYTHON_USEDEP}]
            ')
            dev-qt/qt5compat:{{ .Values.qt_slot }}
            dev-qt/qtbase:{{ .Values.qt_slot }}=[gui,sql,wayland?,X]
            dev-qt/qtdeclarative:{{ .Values.qt_slot }}
            dev-qt/qtsvg:{{ .Values.qt_slot }}
            kde-frameworks/kcolorscheme:6
            kde-frameworks/kcompletion:6
            kde-frameworks/kconfig:6
            kde-frameworks/kcoreaddons:6
            kde-frameworks/kcrash:6
            kde-frameworks/kguiaddons:6
            kde-frameworks/ki18n:6
            kde-frameworks/kiconthemes:6
            kde-frameworks/kitemviews:6
            kde-frameworks/kwidgetsaddons:6
            kde-frameworks/kxmlgui:6
            media-gfx/exiv2:=
            media-libs/fontconfig
            media-libs/freetype
            media-libs/harfbuzz:=
            media-libs/lcms
            media-libs/libjpeg-turbo:=
            media-libs/libpng:=
            media-libs/tiff:=
            sys-libs/zlib
            virtual/opengl
            x11-libs/libX11
            x11-libs/libXi
            color-management? ( >=media-libs/opencolorio-2.0.0 )
            fftw? ( sci-libs/fftw:3.0= )
            gif? ( media-libs/giflib )
            gsl? ( sci-libs/gsl:= )
            heif? ( >=media-libs/libheif-1.11:=[x265] )
            jpeg2k? ( >=media-libs/openjpeg-2.3.0:= )
            jpegxl? ( >=media-libs/libjxl-0.7.0:= )
            media? (
              media-libs/mlt:=
              media-libs/libsdl2
            )
            mypaint-brush-engine? ( >=media-libs/libmypaint-1.4.0:= )
            openexr? ( media-libs/openexr:= )
            pdf? ( app-text/poppler[qt6(-)] )
            raw? ( kde-apps/libkdcraw:6 )
            webp? ( >=media-libs/libwebp-1.2.0:= )
            !{{ .Values.category }}/{{ .Values.pn }}:5
          depend: |
            ${RDEPEND}
            dev-libs/immer
            dev-libs/lager
            dev-libs/zug
          bdepend: |
            dev-lang/perl
            sys-devel/gettext
          body: |
            pkg_setup() {
              python-single-r1_pkg_setup
              kde6_pkg_setup
            }

            src_prepare() {
              # only used for the macOS/Windows
              rm -r packaging || die

              kde6_src_prepare
            }

            src_configure() {
              addpredict /dev/dri

              local mycmakeargs=(
                -DBUILD_WITH_QT6=ON
                -DALLOW_UNSTABLE=QT6
                -DBUILD_TESTING=OFF
                -DENABLE_UPDATERS=OFF
                -DKRITA_ENABLE_PCH=OFF
                -DCMAKE_DISABLE_FIND_PACKAGE_KSeExpr=ON

                $(cmake_use_find_package color-management OpenColorIO)
                $(cmake_use_find_package fftw FFTW3)
                $(cmake_use_find_package gif GIF)
                $(cmake_use_find_package gsl GSL)
                $(cmake_use_find_package heif HEIF)
                $(cmake_use_find_package jpeg2k OpenJPEG)
                $(cmake_use_find_package jpegxl JPEGXL)
                $(cmake_use_find_package media Mlt7)
                $(cmake_use_find_package mypaint-brush-engine LibMyPaint)
                $(cmake_use_find_package openexr OpenEXR)
                $(cmake_use_find_package pdf Poppler)
                $(cmake_use_find_package raw KDcrawQt6)
                $(cmake_use_find_package wayland Qt6WaylandClient)
                $(cmake_use_find_package webp WebP)
              )

              kde6_src_configure
            }

            src_install() {
              python_optimize "${ED}/usr/$(get_libdir)/krita-python-libs"

              kde6_src_install
            }

krita_deps:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: dev-libs
    github:
      user: arximboldi
      query: tags

  packages:

    - immer:
        vars:
          homepage: https://sinusoid.es/immer/ https://github.com/arximboldi/immer
          inherit:
            - cmake
          body: |
            src_configure() {
              local mycmakeargs=(
                -Dimmer_BUILD_TESTS=OFF
                -Dimmer_BUILD_EXAMPLES=OFF
                -Dimmer_BUILD_DOCS=OFF
                -Dimmer_BUILD_EXTRAS=OFF
              )
              cmake_src_configure
            }

    - lager:
        vars:
          homepage: https://sinusoid.es/lager/ https://github.com/arximboldi/lager
          inherit:
            - cmake
          body: |
            src_configure() {
              local mycmakeargs=(
                -Dlager_BUILD_TESTS=OFF
                -Dlager_BUILD_FAILURE_TESTS=OFF
                -Dlager_BUILD_EXAMPLES=OFF
                -Dlager_BUILD_DEBUGGER_EXAMPLES=OFF
                -Dlager_BUILD_DOCS=OFF
              )
              cmake_src_configure
            }

    - zug:
        vars:
          homepage: https://sinusoid.es/zug/ https://github.com/arximboldi/zug
          inherit:
            - cmake
          body: |
            src_configure() {
              local mycmakeargs=(
                -Dzug_BUILD_TESTS=OFF
                -Dzug_BUILD_EXAMPLES=OFF
                -Dzug_BUILD_DOCS=OFF
              )
              cmake_src_configure
            }

plasma_wayland_protocols:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-libs
    dir:
      url: 'https://download.kde.org/stable/plasma-wayland-protocols/'
      matcher: "plasma-wayland-protocols-[0-9.]+\\.tar\\.xz$"
    transform:
      - kind: string
        match: 'plasma-wayland-protocols-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
        url: 'https://download.kde.org/stable/plasma-wayland-protocols/{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
    vars:
      qt_slot: 6
      license: LGPL-2.1
      homepage: https://invent.kde.org/libraries/plasma-wayland-protocols
      inherit:
        - cmake
      bdepend: |
        dev-libs/libpcre2:*
        dev-qt/qtbase:{{ .Values.qt_slot }}
        >=kde-frameworks/extra-cmake-modules-6.0:*

  packages:
    - plasma-wayland-protocols:
        vars:
          desc: Plasma Specific Protocols for Wayland
          body: |
            src_configure() {
              local mycmakeargs=(
                -DQT_MAJOR_VERSION=6
                -DKDE_INSTALL_USE_QT_SYS_PATHS=ON
                -DKDE_INSTALL_DOCBUNDLEDIR="${EPREFIX}/usr/share/help"
                -DBUILD_TESTING=OFF
              )

              cmake_src_configure
            }

qcoro:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: dev-libs
    github:
      user: danvratil
      query: tags
    vars:
      qt_slot: '6'

  packages:
    - qcoro:
        vars:
            license: MIT
            homepage: https://qcoro.dvratil.cz/ https://github.com/danvratil/qcoro
            inherit:
                - cmake
            iuse: dbus examples +network qml websockets
            rdepend: |
                dev-qt/qtbase:{{ .Values.qt_slot }}
                qml? (
                  dev-qt/qtbase:{{ .Values.qt_slot }}[gui]
                  dev-qt/qtdeclarative:{{ .Values.qt_slot }}
                )
                websockets? ( dev-qt/qtwebsockets:{{ .Values.qt_slot }} )
            depend: |
                ${RDEPEND}
                examples? ( dev-qt/qtbase:{{ .Values.qt_slot }} )
            desc: C++ Coroutine Library for Qt5
            body: |
                post_src_unpack() {
                    if [ ! -d "${S}" ]; then
                    mv qcoro* "${S}" || die
                    fi
                }

                src_configure() {
                    local mycmakeargs=(
                    -DUSE_QT_VERSION=6
                    -DQCORO_BUILD_EXAMPLES=$(usex examples)
                    -DQCORO_WITH_QTDBUS=$(usex dbus)
                    -DQCORO_WITH_QTNETWORK=$(usex network)
                    -DQCORO_WITH_QML=$(usex qml)
                    -DQCORO_WITH_QTQUICK=$(usex qml)
                    -DBUILD_TESTING=false
                    -DQCORO_WITH_QTWEBSOCKETS=$(usex websockets)
                    )
                    cmake_src_configure
                }

                src_install() {
                    if use examples; then
                    docinto examples
                    dodoc -r examples/*
                    fi
                    cmake_src_install
                }

