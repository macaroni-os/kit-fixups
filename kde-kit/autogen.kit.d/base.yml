      matcher: "pulseaudio-qt-[0-9.]+\\.tar\\.xz$"
    transform:
      - kind: string
        match: 'pulseaudio-qt-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
        url: 'https://download.kde.org/stable/{{ .Values.pn }}/{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
    vars:
      license: LGPL-2.1
      qt_slot: '6'
      slot: '6'
      homepage: https://invent.kde.org/libraries/pulseaudio-qt
      inherit:
        - cmake
      iuse: doc
      rdepend: |
        >=dev-qt/qtbase-6.6.2:{{ .Values.qt_slot }}[gui]
        media-sound/pulseaudio[glib]
      depend: '${RDEPEND}'
      bdepend: |
        virtual/pkgconfig
        doc? (
          >=dev-qt/qttools-6.6.2:{{ .Values.qt_slot }}[assistant]
          >=kde-frameworks/kdoctools-6.3.0:6
        )

  packages:
    - pulseaudio-qt:
        vars:
          desc: Qt bindings for pulseaudio
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_WITH_QT6=ON
                -DQT_MAJOR_VERSION=6
                -DBUILD_QCH=$(usex doc)
                -DBUILD_TESTING=OFF
              )
              cmake_src_configure
            }

polkit_qt:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: sys-auth
    dir:
      url: 'https://download.kde.org/stable/polkit-qt-1/'
      matcher: "polkit-qt-1-[0-9.]+\\.tar\\.xz$"
    transform:
      - kind: string
        match: 'polkit-qt-1-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    assets:
      - name: 'polkit-qt-1-{{ .Values.version }}.tar.xz'
        url: 'https://download.kde.org/stable/polkit-qt-1/polkit-qt-1-{{ .Values.version }}.tar.xz'
    vars:
      license: LGPL-2
      qt_slot: '6'
      homepage: https://api.kde.org/kdesupport-api/polkit-qt-1-apidocs/
      inherit:
        - cmake
      iuse: qt5 +qt6
      required_use: '|| ( qt5 qt6 )'
      rdepend: |
        dev-libs/glib:2
        >=sys-auth/polkit-0.103
        qt5? (
          dev-qt/qtcore:5
          dev-qt/qtdbus:5
          dev-qt/qtgui:5
          dev-qt/qtwidgets:5
        )
        qt6? ( dev-qt/qtbase:{{ .Values.qt_slot }}[gui] )
      depend: '${RDEPEND}'
      bdepend: 'virtual/pkgconfig'

  packages:
    - polkit-qt:
        vars:
          desc: Qt wrapper around polkit-1 client libraries
          body: |
            KMNAME="polkit-qt-1"
            S="${WORKDIR}/${KMNAME}-${PV}"
            DOCS=( AUTHORS README README.porting TODO )

            src_configure() {
              local mycmakeargs=(
                -DBUILD_EXAMPLES=OFF
                -DQT_MAJOR_VERSION=$(usex qt6 6 5)
              )
              cmake_src_configure
            }

# Create a seed package to manage conflicts
