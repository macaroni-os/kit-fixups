            kde-frameworks/ktextwidgets:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}[X]
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            kde-frameworks/threadweaver:{{ .Values.slot }}
            kde-plasma/plasma-activities:{{ .Values.slot }}
            media-libs/freetype
            sys-libs/zlib
            crypt? ( kde-frameworks/kwallet:{{ .Values.slot }} )
            djvu? ( app-text/djvu )
            epub? ( app-text/ebook-tools )
            markdown? ( >=app-text/discount-2.2.7-r1:= )
            mobi? ( kde-apps/kdegraphics-mobipocket:{{ .Values.slot }} )
            pdf? ( >=app-text/poppler-24.10.0[nss,qt6] )
            phonon? ( >=media-libs/phonon-4.12.0[qt6(+)] )
            postscript? ( app-text/libspectre )
            share? ( kde-frameworks/purpose:{{ .Values.slot }} )
            speech? ( dev-qt/qtspeech:{{ .Values.slot }} )
            tiff? ( media-libs/tiff:= )
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DFORCE_NOT_REQUIRED_DEPENDENCIES="KF6DocTools;KF6Wallet;DjVuLibre;EPub;Discount;QMobipocket6;Poppler;LibSpectre;KF6Purpose;Qt6TextToSpeech;TIFF;KExiv2Qt6;"
                    -DOKULAR_UI=$(usex qml "both" "desktop")
                    $(cmake_use_find_package crypt KF6Wallet)
                    $(cmake_use_find_package djvu DjVuLibre)
                    $(cmake_use_find_package epub EPub)
                    $(cmake_use_find_package markdown Discount)
                    $(cmake_use_find_package mobi QMobipocket6)
                    $(cmake_use_find_package pdf Poppler)
                    $(cmake_use_find_package phonon Phonon4Qt6)
