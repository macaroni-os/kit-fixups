    - analitza:
        vars:
          iuse: "eigen"
          desc: "KDE library for mathematical features"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[-gles2-only,gui]
            dev-qt/qtdeclarative:{{ .Values.slot }}
            dev-qt/qtsvg:{{ .Values.slot }}
            eigen? ( dev-cpp/eigen:3 )
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          body: |
            src_prepare() {
                sed -i \
                    -e "/add_subdirectory(examples)/ s/^/#DONT/" \
                    analitzaplot/CMakeLists.txt || die
            }

            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package eigen Eigen3)
                )

                kde6_src_configure
            }
    - ark:
        vars:
          inherit: kde6 optfeature xdg
          iuse: "test zip"
          desc: "File archiver by KDE"
          homepage: "https://apps.kde.org/ark/"
          rdepend: |
            >=app-arch/libarchive-3.5.3:=[bzip2,lzma]
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kcompletion:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kfilemetadata:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kjobwidgets:{{ .Values.slot }}
            kde-frameworks/kparts:{{ .Values.slot }}
            kde-frameworks/kpty:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            sys-libs/zlib
            zip? ( >=dev-libs/libzip-1.6.0:= )
          depend: |
            ${RDEPEND}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            dev-qt/qtbase:{{ .Values.slot }}
            test? ( >=dev-libs/libzip-1.6.0:= )
          bdepend: |
            sys-devel/gettext
            elibc_glibc? ( test? ( amd64? ( app-arch/rar ) x86? ( app-arch/rar ) ) )
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package zip LibZip)
                )

                kde6_src_configure
            }

            src_test() {
                local myctestargs=(
                    # bug 822177: kerfuffle-addtoarchivetest: may segfault or hang indefinitely
                    # bug 827840: plugins-clirartest: continuously broken with translations installed
                    -E "(kerfuffle-addtoarchivetest|plugins-clirartest)"
                )

                kde6_src_test
            }

            pkg_postinst() {
                if [[ -z "${REPLACING_VERSIONS}" ]]; then
                    optfeature "rar archive creation/extraction" "app-arch/rar"
                    optfeature "rar archive extraction only" "app-arch/unar" "app-arch/unrar"
                    optfeature "7-Zip archive support" ">=app-arch/7zip-24.09[symlink(+)]" "app-arch/p7zip"
                    optfeature "lrz archive support" "app-arch/lrzip"
                    optfeature "Markdown support in text previews" "kde-misc/markdownpart:${SLOT}"
                fi
                xdg_pkg_postinst
            }

