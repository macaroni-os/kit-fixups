            epub? ( app-text/ebook-tools )
            markdown? ( >=app-text/discount-2.2.7-r1:= )
            mobi? ( kde-apps/kdegraphics-mobipocket:{{ .Values.slot }} )
            pdf? ( >=app-text/poppler-24.10.0[nss,qt6] )
