kde-apps:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: kde-apps
    vars:
        slot: 6
        qt_slot: 6
        homepage: https://invent.kde.org/
        inherit:
          - cmake
        depend: '${RDEPEND}'
        # For fresh releases
        #download_prefixurl: https://download.kde.org/stable/
        # For old releases
        download_prefixurl: https://download.kde.org/Attic/

    assets:
       - name: "{{ .Values.pn }}-{{ .Values.version}}.tar.xz"
         url: '{{ .Values.download_prefixurl }}/release-service/{{ .Values.version }}/src/{{ .Values.pn }}-{{ .Values.version}}.tar.xz'
    dir:
        url: "{{ .Values.download_prefixurl }}/release-service/"
        matcher: "^25.*"
    selector:
      # Temporary to move ahead in mark-iii
      - '<25.12.3'

  packages:

    - partitionmanager:
        vars:
          inherit:
            - kde6
            - xdg
          homepage: https://apps.kde.org/partitionmanager/
          desc: Utility for management of disks, partitions and file systems
          license: GPL-3
          depend: '${RDEPEND}'
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kjobwidgets:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            sys-libs/kpmcore:{{ .Values.slot }}
            sys-auth/polkit-qt
          body: |
            src_prepare() {
              kde6_src_prepare
            }

    - kpmcore:
        category: sys-libs
        vars:
          inherit:
            - kde6
          desc: Library for managing partitions
          homepage: https://apps.kde.org/partitionmanager/
          license: GPL-3
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            sys-apps/util-linux
            sys-auth/polkit-qt
          bdepend: |
            virtual/pkgconfig

    - akonadi:
        vars:
          inherit:
            - xdg
            - kde6
          iuse: "tools +webengine xml"
          desc: "Storage service for PIM data and libraries for PIM apps"
          homepage: https://community.kde.org/KDE_PIM/akonadi
          rdepend: |
            virtual/kde-seed[gui,sql,declarative]
            kde-apps/akonadi-config
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kitemmodels:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            webengine? (
                kde-apps/kaccounts-integration:{{ .Values.slot }}
                >=net-libs/accounts-qt-1.17
            )
            xml? ( dev-libs/libxml2:= )
            app-arch/xz-utils
            dev-libs/libxslt
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_TOOLS=$(usex tools)
                $(cmake_use_find_package webengine AccountsQt6)
                $(cmake_use_find_package webengine KAccounts6)
                $(cmake_use_find_package xml LibXml2)
              )
              cmake_src_configure
            }

