kde-frameworks:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: kde-frameworks
    vars:
      # From kde6.eclass
      license: GPL-2

      slot: 6
      qt_slot: 6
      homepage: https://invent.kde.org/frameworks/
      downloadurl_prefix: https://download.kde.org/stable/frameworks
      inherit:
        - cmake
      rdepend: |
        virtual/kde-seed
      depend: '${RDEPEND}'
    selector:
        - '<7'
        - '<6.23'
    transform:
        - kind: regex
          match: '^([0-9]+\.[0-9]+)$'
          replace: '$1.0'
    assets:
       - name: "{{ .Values.pn }}-{{ .Values.version}}.tar.xz"
         url: '{{ .Values.downloadurl_prefix }}/{{ .Values.original_version }}/{{ .Values.pn }}-{{ .Values.version}}.tar.xz'
    dir:
        url: "{{ .Values.downloadurl_prefix }}/"
        matcher: "^6.*"

  packages:
    - attica:
        vars:
          desc: "Framework providing access to Open Collaboration Services"

    - baloo:
        vars:
          desc: "Framework for searching and managing metadata"
          rdepend: |
            virtual/kde-seed[declarative]
            >=dev-db/lmdb-0.9.17
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kfilemetadata:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kidletime:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/solid:{{ .Values.slot }}

    - bluez-qt:
        vars:
          desc: "Qt wrapper for Bluez 5 DBus API"
          rdepend: |
            virtual/kde-seed[declarative]

    - breeze-icons:
        vars:
          python_compat: python3+
          inherit:
            - cmake
            - python-any-r1
            - xdg
          desc: "Breeze SVG icon theme"
          rdepend: |
            virtual/kde-seed[gui]
          bdepend: |
            ${PYTHON_DEPS}
            $(python_gen_any_dep 'dev-python/lxml[${PYTHON_USEDEP}]')
            kde-frameworks/extra-cmake-modules:*
          body: |
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                -DPython_EXECUTABLE="${PYTHON}"
                -DBINARY_ICONS_RESOURCE=ON # TODO: remove when kexi was ported away
                -DSKIP_INSTALL_ICONS=OFF
              )
              cmake_src_configure
            }
            src_install() {
              cmake_src_install
              find "${ED}"/usr/share/icons/ -type d -empty -delete || die
              find "${ED}"/usr/share/icons/ -xtype l -delete || die
            }

    - extra-cmake-modules:
        vars:
          python_compat: python3+
          inherit:
            - cmake
            - python-any-r1
          desc: "Extra modules and scripts for CMake"
          slot: 0
          iuse: doc
          rdepend: |
            app-arch/libarchive[bzip2]
            !kde-frameworks/extra-cmake-modules:5
          bdepend: |
            doc? (
                ${PYTHON_DEPS}
                $(python_gen_any_dep 'dev-python/sphinx[${PYTHON_USEDEP}]')
                dev-qt/qttools:{{ .Values.qt_slot }}[assistant]
            )
          body: |
            pkg_setup() {
                use doc && python-any-r1_pkg_setup
            }
            src_prepare() {
                cmake_src_prepare
            }
            src_configure() {
                local mycmakeargs=(
                    -DDOC_INSTALL_DIR=/usr/share/doc/"${PF}"
                    -DBUILD_QTHELP_DOCS=$(usex doc)
                    -DBUILD_HTML_DOCS=$(usex doc)
                    -DBUILD_MAN_DOCS=$(usex doc)
                    -DBUILD_TESTING=OFF
                )
                cmake_src_configure
            }

    - frameworkintegration:
        vars:
          desc: "Framework for integrating Qt applications with KDE Plasma workspaces"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/knewstuff:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kpackage:{{ .Values.slot }}
          body: |
            src_configure() {
              local mycmakeargs=(
                  -DCMAKE_DISABLE_FIND_PACKAGE_AppStreamQt=ON
                  -DCMAKE_DISABLE_FIND_PACKAGE_packagekitqt6=ON
              )
              cmake_src_configure
            }

    - kapidox:
        vars:
          python_compat: python3+
          extra_envs:
            - 'DISTUTILS_SINGLE_IMPL=1'
            - 'DISTUTILS_USE_PEP517=setuptools'
          inherit:
            - distutils-r1
          desc: "Framework for building KDE API documentation in a standard format and style"
          rdepend: |
            virtual/kde-seed
            app-doc/doxygen
            $(python_gen_cond_dep '
                dev-python/jinja[${PYTHON_USEDEP}]
                dev-python/pyyaml[${PYTHON_USEDEP}]
            ')
            media-gfx/graphviz[python,${PYTHON_SINGLE_USEDEP}]

    - karchive:
        vars:
          desc: "Framework for reading, creation, and manipulation of various archive formats"
          iuse: "crypt +zstd"
          rdepend: |
            virtual/kde-seed
            app-arch/bzip2
            app-arch/xz-utils
            sys-libs/zlib
            crypt? ( dev-libs/openssl:= )
            zstd? ( app-arch/zstd:= )
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
            zstd? ( virtual/pkgconfig )
          body: |
            src_prepare() {
              cmake_src_prepare
              # TODO: try to get a build switch upstreamed
              if ! use zstd; then
                sed -e "s/^pkg_check_modules.*LibZstd/#&/" -i CMakeLists.txt || die
              fi
            }
            src_configure() {
              local mycmakeargs=(
                -DWITH_OPENSSL=$(usex crypt)
                -DWITH_LIBZSTD=$(usex zstd)
              )
              cmake_src_configure
            }

    - kauth:
        vars:
          desc: "Framework to let applications perform actions as a privileged user"
          iuse: "+policykit wayland"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kcoreaddons:{{ .Values.qt_slot }}
            policykit? (
                kde-frameworks/kwindowsystem:{{ .Values.slot }}[wayland?]
                >=sys-auth/polkit-qt-0.175.0[qt6(+)]
            )
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
          pdepend: |
            policykit? ( kde-plasma/polkit-kde-agent:* )
          body: |
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                $(cmake_use_find_package policykit PolkitQt6-1)
              )
              cmake_src_configure
            }

    - kbookmarks:
        vars:
          desc: "Framework for managing bookmarks stored in XBEL format"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]

    - kcalendarcore:
        vars:
          desc: "Library for interfacing with calendars"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            >=dev-libs/libical-3.0.5:=

    - kcmutils:
        vars:
          desc: "Framework to work with KDE System Settings modules"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kitemviews:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}

    - kcodecs:
        vars:
          desc: "Framework for manipulating strings using various encodings"
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]

    - kcolorscheme:
        vars:
          desc: "Framework for downloading and sharing additional application data"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}

    - kcompletion:
        vars:
          desc: "Framework for common completion tasks such as filename or URL completion"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]

    - kconfig:
        vars:
          desc: "Framework for reading and writing configuration"
          iuse: dbus qml
          rdepend: |
            virtual/kde-seed[gui]
            dbus? ( sys-apps/dbus )
            qml? ( dev-qt/qtdeclarative:{{ .Values.qt_slot }} )
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
          body: |
            src_configure() {
              local mycmakeargs=(
                -DUSE_DBUS=$(usex dbus)
                -DKCONFIG_USE_QML=$(usex qml)
              )
              cmake_src_configure
            }

    - kconfigwidgets:
        vars:
          desc: "Framework providing an assortment of configuration-related widgets"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}

    - kcontacts:
        vars:
          desc: "Address book API based on KDE Frameworks"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}

    - kcoreaddons:
        vars:
          inherit:
            - cmake
            - xdg
          desc: "Framework for solving common problems such as caching, randomisation, and more"
          iuse: "dbus"
          rdepend: |
            virtual/kde-seed[declarative]
            dev-qt/qttranslations:{{ .Values.qt_slot }}
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
            virtual/libudev:=
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
          body: |
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                  -DKCOREADDONS_USE_QML=ON
                  -DENABLE_INOTIFY=ON
                  -DUSE_DBUS=$(usex dbus)
                  -DBUILD_PYTHON_BINDINGS=OFF
                  -DCMAKE_DISABLE_FIND_PACKAGE_{Python3,PySide6,Shiboken6}=ON
              )
              cmake_src_configure
            }

    - kcrash:
        vars:
          desc: "Framework for intercepting and handling application crashes"
          iuse: "X"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            X? ( x11-libs/libX11 )
          depend: |
            ${RDEPEND}
            X? ( x11-base/xorg-proto )
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
          body: |
            src_configure() {
              local mycmakeargs=(
                -DWITH_X11=$(usex X)
              )
              cmake_src_configure
            }

    - kdav:
        vars:
          desc: "DAV protocol implemention with KJobs"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}

    - kdbusaddons:
        vars:
          desc: "Framework for registering services and applications per freedesktop standards"
          iuse: "X"
          rdepend: |
            virtual/kde-seed[gui,X?]
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
          body: |
            src_configure() {
              local mycmakeargs=(
                -DWITH_X11=$(usex X)
              )
              cmake_src_configure
            }

    - kdeclarative:
        vars:
          desc: "Framework providing integration of QML and KDE work spaces"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kglobalaccel:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}

    - kded:
        vars:
          desc: "Central daemon of KDE workspaces"
          iuse: "+man"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kconfig:{{ .Values.slot }}[dbus]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
          bdepend: |
            man? ( kde-frameworks/kdoctools:{{ .Values.slot }} )
          body: |
            src_configure() {
              local mycmakeargs=(
                $(cmake_use_find_package man KF6DocTools)
              )
              cmake_src_configure
            }

    - kdesu:
        vars:
          desc: "Framework to handle super user actions"
          iuse: "X"
          rdepend: |
            virtual/kde-seed
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kpty:{{ .Values.slot }}
            X? ( x11-libs/libX11 )
          depend: |
            ${RDEPEND}
            X? ( x11-base/xorg-proto )
          body: |
            src_configure() {
              local mycmakeargs=(
                $(cmake_use_find_package X X11)
              )
              cmake_src_configure
            }

    - kdnssd:
        vars:
          desc: "Framework for network service discovery using Zeroconf"
          iuse: "zeroconf"
          rdepend: |
            virtual/kde-seed
            zeroconf? (
                net-dns/avahi[mdnsresponder-compat]
            )
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
          body: |
            src_configure() {
              local mycmakeargs=(
                $(cmake_use_find_package zeroconf Avahi)
              )
              use zeroconf || mycmakeargs+=( -DCMAKE_DISABLE_FIND_PACKAGE_DNSSD=ON )
              cmake_src_configure
            }

    - kdoctools:
        vars:
          desc: "Tools to generate documentation in various formats from DocBook files"
          iuse: "nls"
          rdepend: |
            app-text/docbook-xml-dtd:4.5
            app-text/docbook-xsl-stylesheets
            app-text/sgml-common
            dev-libs/libxml2:2=
            dev-libs/libxslt
            kde-frameworks/karchive:{{ .Values.slot }}
          bdepend: |
            dev-lang/perl
            dev-perl/URI
            nls? ( kde-frameworks/ki18n:{{ .Values.slot }} )
          body: |
            src_configure() {
              local mycmakeargs=(
                  $(cmake_use_find_package nls KF6I18n)
              )
              cmake_src_configure
            }

    - kglobalaccel:
        vars:
          desc: "Framework to handle global shortcuts"
          iuse: "X"
          rdepend: |
            virtual/kde-seed[gui,X?]
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]
          body: |
            src_configure() {
              local mycmakeargs=(
                -DWITH_X11=$(usex X)
              )
              cmake_src_configure
            }

    - kguiaddons:
        vars:
          inherit:
            - cmake
          desc: "Framework providing assorted high-level user interface components"
          iuse: "dbus wayland X"
          rdepend: |
            virtual/kde-seed[gui,declarative,wayland?,X?]
            X? (
              x11-libs/libX11
              x11-libs/libxcb
            )
          depend: |
            ${RDEPEND}
            wayland? (
                dev-libs/wayland
                >=dev-libs/plasma-wayland-protocols-1.15.0
                >=dev-libs/wayland-protocols-1.39
            )
            X? (
              x11-base/xorg-proto
            )
          bdepend: |
            wayland? (
              dev-util/wayland-scanner
            )
          body: |
            src_configure() {
              local mycmakeargs=(
                  -DBUILD_GEO_SCHEME_HANDLER=ON
                  -DUSE_DBUS=$(usex dbus)
                  -DWITH_WAYLAND=$(usex wayland)
                  -DWITH_X11=$(usex X)
                  -DBUILD_PYTHON_BINDINGS=OFF
                  -DCMAKE_DISABLE_FIND_PACKAGE_{Python3,PySide6,Shiboken6}=ON
              )
              cmake_src_configure
            }

    - kholidays:
        vars:
          desc: "Library to determine holidays and other special events for a geographical region"
          rdepend: |
            virtual/kde-seed[declarative]
          bdepend: |
            dev-qt/qttools:{{ .Values.qt_slot }}[linguist]

    - ki18n:
        vars:
          python_compat: python3+
          inherit:
            - cmake
            - python-single-r1
          desc: "Framework based on Gettext for internationalizing user interface text"
          required_use: "${PYTHON_REQUIRED_USE}"
          rdepend: |
            virtual/kde-seed[declarative]
            app-text/iso-codes
          bdepend: |
            ${PYTHON_DEPS}
            sys-devel/gettext
            virtual/libintl
          body: |
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                -DPython3_EXECUTABLE="${PYTHON}"
                -DBUILD_WITH_QML=TRUE
              )
              cmake_src_configure
            }

    - kiconthemes:
        vars:
          desc: "Framework for icon theming and configuration"
          rdepend: |
            virtual/kde-seed[gui,declarative,svg]
            kde-frameworks/breeze-icons:{{ .Values.slot }}
            kde-frameworks/karchive:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}

    - kidletime:
        vars:
          desc: "Framework for detection and notification of device idle time"
          iuse: wayland X xscreensaver
          required_use: "xscreensaver? ( X )"
          rdepend: |
            virtual/kde-seed[gui,wayland?,X?]
            X? (
                x11-libs/libX11
                x11-libs/libxcb
                x11-libs/libXext
            )
            xscreensaver? (
                x11-libs/libXScrnSaver
            )
          depend: |
            ${RDEPEND}
            wayland? (
              >=dev-libs/plasma-wayland-protocols-1.11.1
              >=dev-libs/wayland-protocols-1.27:0
            )
          body: |
            src_prepare() {
              cmake_src_prepare
              if ! use xscreensaver; then
                sed -i -e "s/\${X11_Xscreensaver_FOUND}/0/" CMakeLists.txt || die
              fi
            }
            src_configure() {
              local mycmakeargs=(
                -DWITH_WAYLAND=$(usex wayland)
                -DWITH_X11=$(usex X)
              )
              cmake_src_configure
            }

    - kfilemetadata:
        vars:
          python_compat: python3+
          desc: "Library for extracting file metadata"
          iuse: "epub exif ffmpeg mobi pdf taglib"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/karchive:{{ .Values.slot }}
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            epub? ( app-text/ebook-tools )
            exif? ( media-gfx/exiv2:= )
            ffmpeg? ( media-video/ffmpeg:= )
            mobi? ( kde-apps/kdegraphics-mobipocket:{{ .Values.slot }} )
            pdf? ( app-text/poppler[qt6(-)] )
            taglib? ( media-libs/taglib:= )
          depend: |
            ${RDEPEND}
            sys-apps/attr
          body: |
            src_configure() {
              local mycmakeargs=(
                -DENABLE_MOBIPOCKET_TEXT_EXTRACTION=OFF
                $(cmake_use_find_package epub EPub)
                $(cmake_use_find_package exif LibExiv2)
                $(cmake_use_find_package ffmpeg FFmpeg)
                $(cmake_use_find_package mobi QMobipocket6)
                $(cmake_use_find_package pdf Poppler)
                $(cmake_use_find_package taglib Taglib)
              )
              cmake_src_configure
            }

    - kimageformats:
        vars:
          desc: "Framework providing additional format plugins for Qt's image I/O system"
          iuse: "avif eps heif jpeg2k jpegxl openexr raw"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/karchive:{{ .Values.slot }}
            avif? ( >=media-libs/libavif-0.8.2:= )
            eps? ( dev-qt/qtbase:{{ .Values.qt_slot }} )
            heif? ( >=media-libs/libheif-1.19.7:= )
            jpeg2k? ( media-libs/openjpeg:= )
            jpegxl? ( >=media-libs/libjxl-0.9.4:= )
            openexr? ( >=media-libs/openexr-3:= )
            raw? ( media-libs/libraw:= )
          body: |
            src_configure() {
                local mycmakeargs=(
                    -DKIMAGEFORMATS_JXR=OFF # TODO: check if ready upstream
                    $(cmake_use_find_package avif libavif)
                    $(cmake_use_find_package eps Qt6PrintSupport)
                    -DKIMAGEFORMATS_HEIF=$(usex heif)
                    -DKIMAGEFORMATS_JP2=$(usex jpeg2k)
                    -DKIMAGEFORMATS_JXL=$(usex jpegxl)
                    $(cmake_use_find_package openexr OpenEXR)
                    $(cmake_use_find_package raw LibRaw)
                )
                cmake_src_configure
            }

    - kio:
        vars:
          inherit:
            - cmake
          desc: "Framework providing transparent file and data management"
          iuse: "acl handbook +kwallet wayland X"
          rdepend: |
            virtual/kde-seed[declarative,gui,libproxy,wayland?,X?]
            sys-power/switcheroo-control
            kde-frameworks/kauth:{{ .Values.qt_slot }}
            kde-frameworks/kbookmarks:{{ .Values.slot }}
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kcompletion:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kitemviews:{{ .Values.slot }}
