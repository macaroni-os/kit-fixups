kde-frameworks:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: kde-frameworks
    vars:
        slot: 6
        homepage: https://invent.kde.org/frameworks/
        inherit: kde6
    selector:
        - '<7'
    transform:
        - kind: regex
          match: '^([0-9]+\.[0-9]+)$'
          replace: '$1.0'
    assets:
       - name: "{{ .Values.pn }}-{{ .Values.version}}.tar.xz"
         url: https://download.kde.org/stable/frameworks/{{ .Values.original_version }}/{{ .Values.pn }}-{{ .Values.version}}.tar.xz
    dir:
        url: "https://download.kde.org/stable/frameworks/"
        matcher: "^6.*"

  packages:
    - attica:
        vars:
          desc: "Framework providing access to Open Collaboration Services"
          rdepend: |
             dev-qt/qtbase:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          body: |
            CMAKE_SKIP_TESTS=(
                # requires network access, bug #661230
                providertest
            )
    - baloo:
        vars:
          desc: "Framework for searching and managing metadata"
          rdepend: |
            !{{ .Values.category }}/{{ .Values.pn }}:5[-kf6compat(-)]
          depend: |
            ${RDEPEND}
                >=dev-db/lmdb-0.9.17
                dev-qt/qtbase:{{ .Values.slot }}[gui]
                dev-qt/qtdeclarative:{{ .Values.slot }}
                kde-frameworks/kconfig:{{ .Values.slot }}
                kde-frameworks/kcoreaddons:{{ .Values.slot }}
                kde-frameworks/kcrash:{{ .Values.slot }}
                kde-frameworks/kdbusaddons:{{ .Values.slot }}
                kde-frameworks/kfilemetadata:{{ .Values.slot }}
                kde-frameworks/ki18n:{{ .Values.slot }}
                kde-frameworks/kidletime:{{ .Values.slot }}
                kde-frameworks/kio:{{ .Values.slot }}
                kde-frameworks/solid:{{ .Values.slot }}
    - bluez-qt:
        vars:
          desc: "Qt wrapper for Bluez 5 DBus API"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}
            dev-qt/qtdeclarative:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          body: |
            src_test() {
                # parallel tests fail, bug 609248
                kde6_src_test -j1
            }
    - breeze-icons:
        vars:
          python_compat: python3+
          inherit: cmake kde6 python-any-r1 xdg
          desc: "Breeze SVG icon theme"
          rdepend: |
            !kde-frameworks/{{ .Values.pn }}:5
            !kde-frameworks/{{ .Values.pn }}-rcc:5
            !kde-frameworks/{{ .Values.pn }}-rcc:{{ .Values.slot }}
          bdepend: |
            ${PYTHON_DEPS}
            $(python_gen_any_dep 'dev-python/lxml[${PYTHON_USEDEP}]')
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/extra-cmake-modules:*
            test? ( app-misc/fdupes )
          body: |
            python_check_deps() {
                python_has_version "dev-python/lxml[${PYTHON_USEDEP}]"
            }

            src_prepare() {
                cmake_src_prepare
            }
            src_configure() {
                local mycmakeargs=(
                    -DPython_EXECUTABLE="${PYTHON}"
                    -DBINARY_ICONS_RESOURCE=ON # TODO: remove when kexi was ported away
                    -DSKIP_INSTALL_ICONS=OFF
                )
                cmake_src_configure
            }

            src_install() {
                cmake_src_install
                # bug 770988
                find "${ED}"/usr/share/icons/ -type d -empty -delete || die
                find "${ED}"/usr/share/icons/ -xtype l -delete || die
            }
    - extra-cmake-modules:
        vars:
          python_compat: python3+
          inherit: cmake kde6 python-any-r1
          desc: "Extra modules and scripts for CMake"
          slot: 0
          rdepend: |
            app-arch/libarchive[bzip2]
          depend: |
            test? (
                dev-qt/qtbase:{{ .Values.slot }}[gui]
                dev-qt/qtdeclarative:{{ .Values.slot }}
            )
          bdepend: |
            doc? (
                ${PYTHON_DEPS}
                $(python_gen_any_dep 'dev-python/sphinx[${PYTHON_USEDEP}]')
                dev-qt/qttools:{{ .Values.slot }}[assistant]
            )
            test? (
                dev-qt/qtbase:{{ .Values.slot }}
                dev-qt/qttools:{{ .Values.slot }}[linguist]
            )
          body: |
            python_check_deps() {
                python_has_version "dev-python/sphinx[${PYTHON_USEDEP}]"
            }

            pkg_setup() {
                use doc && python-any-r1_pkg_setup
            }

            src_prepare() {
                cmake_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DDOC_INSTALL_DIR=/usr/share/doc/"${PF}"
                    -DBUILD_QTHELP_DOCS=$(usex doc)
                    -DBUILD_HTML_DOCS=$(usex doc)
                    -DBUILD_MAN_DOCS=$(usex doc)
                    -DBUILD_TESTING=$(usex test)
                )
                if use test; then
                    mycmakeargs+=( -DQT_MAJOR_VERSION=6 ) # bug 938316
                fi

                cmake_src_configure
            }

            src_test() {
                local CMAKE_SKIP_TESTS=(
                    # passes, but then breaks src_install
                    ECMToolchainAndroidTest
                    # broken, bug #627806
                    ECMPoQmToolsTest
                    # can not possibly succeed in releases, bug #764953
                    KDEFetchTranslations
                )
                # possible race condition with multiple jobs, bug #701854
                cmake_src_test -j1
            }
    - frameworkintegration:
        vars:
          desc: "Framework for integrating Qt applications with KDE Plasma workspaces"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/knewstuff:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
            kde-frameworks/kpackage:{{ .Values.slot }}
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DCMAKE_DISABLE_FIND_PACKAGE_AppStreamQt=ON
                    -DCMAKE_DISABLE_FIND_PACKAGE_packagekitqt6=ON
                )

                kde6_src_configure
            }
    - kapidox:
        vars:
          python_compat: python3+
          inherit: kde6 distutils-r1
          desc: "Framework for building KDE API documentation in a standard format and style"
          rdepend: |
            app-text/doxygen
            $(python_gen_cond_dep '
                dev-python/jinja2[${PYTHON_USEDEP}]
                dev-python/pyyaml[${PYTHON_USEDEP}]
            ')
            media-gfx/graphviz[python,${PYTHON_SINGLE_USEDEP}]
    - karchive:
        vars:
          desc: "Framework for reading, creation, and manipulation of various archive formats"
          iuse: "crypt +zstd"
          rdepend: |
            app-arch/bzip2
            app-arch/xz-utils
            sys-libs/zlib
            crypt? ( dev-libs/openssl:= )
            zstd? ( app-arch/zstd:= )
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
            zstd? ( virtual/pkgconfig )
          body: |
            src_prepare() {
                kde6_src_prepare

                # TODO: try to get a build switch upstreamed
                if ! use zstd; then
                    sed -e "s/^pkg_check_modules.*LibZstd/#&/" -i CMakeLists.txt || die
                fi
            }

            src_configure() {
                local mycmakeargs=(
                    -DWITH_OPENSSL=$(usex crypt)
                    -DWITH_LIBZSTD=$(usex zstd)
                )
                kde6_src_configure
            }
    - kauth:
        vars:
          desc: "Framework to let applications perform actions as a privileged user"
          iuse: "+policykit"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            policykit? (
                dev-qt/qtbase:{{ .Values.slot }}
                kde-frameworks/kwindowsystem:{{ .Values.slot }}[wayland]
                >=sys-auth/polkit-qt-0.175.0[qt6(+)]
            )
          depend: |
            ${RDEPEND}
            test? ( dev-qt/qtbase:{{ .Values.slot }} )
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          pdepend: |
            policykit? ( kde-plasma/polkit-kde-agent:* )
          body: |
            CMAKE_SKIP_TESTS=(
                # fails, bug 654842
                KAuthHelperTest
                # needs DBus, bug 938505
                KAuthFdTest
            )

            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package policykit PolkitQt6-1)
                )

                kde6_src_configure
            }
    - kbookmarks:
        vars:
          desc: "Framework for managing bookmarks stored in XBEL format"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
    - kcalendarcore:
        vars:
          desc: "Library for interfacing with calendars"
          rdepend: |
            >=dev-libs/libical-3.0.5:=
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            dev-qt/qtdeclarative:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
    - kcmutils:
        vars:
          desc: "Framework to work with KDE System Settings modules"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            dev-qt/qtdeclarative:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kitemviews:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
    - kcodecs:
        vars:
          desc: "Framework for manipulating strings using various encodings"
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          body: |
            CMAKE_SKIP_TESTS=(
                # bug 938317
                rfc2047test
                kemailaddresstest
            )
    - kcolorscheme:
        vars:
          desc: "Framework for downloading and sharing additional application data"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            dev-qt/qtdeclarative:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
    - kcompletion:
        vars:
          desc: "Framework for common completion tasks such as filename or URL completion"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
    - kconfig:
        vars:
          desc: "Framework for reading and writing configuration"
          iuse: "dbus qml"
          required_use: "test? ( qml )"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            qml? ( dev-qt/qtdeclarative:{{ .Values.slot }} )
          depend: |
            ${RDEPEND}
            test? ( dev-qt/qtbase:{{ .Values.slot }} )
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DUSE_DBUS=$(usex dbus)
                    -DKCONFIG_USE_QML=$(usex qml)
                )
                kde6_src_configure
            }
    - kconfigwidgets:
        vars:
          desc: "Framework providing an assortment of configuration-related widgets"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
            test? ( kde-frameworks/kconfig:{{ .Values.slot }}[dbus] )
          body: |
            CMAKE_SKIP_TESTS=(
                # bugs: 864250
                kstandardactiontest
                # bug 926497
                klanguagenametest
            )
    - kcontacts:
        vars:
          desc: "Address book API based on KDE Frameworks"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            dev-qt/qtdeclarative:{{ .Values.slot }}
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          body: |
            CMAKE_SKIP_TESTS=(
                # bug #566648 (access to /dev/dri/card0 denied)
                kcontacts-picturetest
                # bugs #712798, 838502, 953969 (again some Qt translations loading related err...)
                kcontacts-{address{,format},phonenumber}test
            )
    - kcoreaddons:
        vars:
          inherit: kde6 xdg
          desc: "Framework for solving common problems such as caching, randomisation, and more"
          iuse: "dbus"
          rdepend: |
            dev-qt/qttranslations:{{ .Values.slot }}
            dev-qt/qtbase:{{ .Values.slot }}
            dev-qt/qtdeclarative:{{ .Values.slot }}
            dev-qt/qttools:{{ .Values.slot }}[linguist]
            virtual/libudev:=
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DKCOREADDONS_USE_QML=ON
                    -DENABLE_INOTIFY=ON
                    -DUSE_DBUS=$(usex dbus)
                    -DBUILD_PYTHON_BINDINGS=OFF
                    -DCMAKE_DISABLE_FIND_PACKAGE_{Python3,PySide6,Shiboken6}=ON
                )
                kde6_src_configure
            }

            src_test() {
                local CMAKE_SKIP_TESTS=(
                    # bug 632398
                    kautosavefiletest
                    # bug 647414
                    kdirwatch_qfswatch_unittest
                    kdirwatch_stat_unittest
                    # bugs 665682
                    kformattest
                    # bug 770781
                    kaboutdatatest
                    klistopenfilesjobtest_unix
                )
                # bug 619656
                kde6_src_test -j1
            }
    - kcrash:
        vars:
          desc: "Framework for intercepting and handling application crashes"
          iuse: "X"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            X? ( x11-libs/libX11 )
          depend: |
            ${RDEPEND}
            X? ( x11-base/xorg-proto )
            test? ( dev-qt/qtbase:{{ .Values.slot }} )
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DWITH_X11=$(usex X)
                )
                kde6_src_configure
            }
    - kdav:
        vars:
          desc: "DAV protocol implemention with KJobs"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          body: |
            CMAKE_SKIP_TESTS=(
                # bug 616808: requires D-Bus
                kdav-davitemfetchjob
                # bug 653602: mimetypes unsupported
                kdav-davitemslistjob
                # bug 765061
                kdav-davcollectionsmultifetchjobtest
            )
    - kdbusaddons:
        vars:
          desc: "Framework for registering services and applications per freedesktop standards"
          iuse: "X"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}
            X? ( dev-qt/qtbase:{{ .Values.slot }}=[gui,X] )
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DWITH_X11=$(usex X)
                )

                kde6_src_configure
            }
    - kdeclarative:
        vars:
          desc: "Framework providing integration of QML and KDE work spaces"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            dev-qt/qtdeclarative:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kglobalaccel:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
    - kded:
        vars:
          desc: "Central daemon of KDE workspaces"
          iuse: "+man"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            kde-frameworks/kconfig:{{ .Values.slot }}[dbus]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          bdepend: |
            man? ( kde-frameworks/kdoctools:{{ .Values.slot }} )
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package man KF6DocTools)
                )

                kde6_src_configure
            }
    - kdesu:
        vars:
          desc: "Framework to handle super user actions"
          iuse: "X"
          rdepend: |
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kpty:{{ .Values.slot }}
            X? ( x11-libs/libX11 )
          depend: |
            ${RDEPEND}
            X? ( x11-base/xorg-proto )
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package X X11)
                )

                kde6_src_configure
            }
    - kdnssd:
        vars:
          desc: "Framework for network service discovery using Zeroconf"
          iuse: "zeroconf"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}
            zeroconf? (
                dev-qt/qtbase:{{ .Values.slot }}
                net-dns/avahi[mdnsresponder-compat]
            )
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package zeroconf Avahi)
                )
                use zeroconf || mycmakeargs+=( -DCMAKE_DISABLE_FIND_PACKAGE_DNSSD=ON )

                kde6_src_configure
            }
    - kdoctools:
        vars:
          desc: "Tools to generate documentation in various formats from DocBook files"
          iuse: "nls"
          rdepend: |
            app-text/docbook-xml-dtd:4.5
            app-text/docbook-xsl-stylesheets
            app-text/sgml-common
            dev-libs/libxml2:2=
            dev-libs/libxslt
            kde-frameworks/karchive:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-lang/perl
            dev-perl/URI
            nls? ( kde-frameworks/ki18n:{{ .Values.slot }} )
          body: |
            CMAKE_SKIP_TESTS=(
                # bug 665622
                kdoctools_install
            )

            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package nls KF6I18n)
                )

                kde6_src_configure
            }
    - kglobalaccel:
        vars:
          desc: "Framework to handle global shortcuts"
          iuse: "X"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            X? ( dev-qt/qtbase:{{ .Values.slot }}=[X] )
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DWITH_X11=$(usex X)
                )
                kde6_src_configure
            }
    - kguiaddons:
        vars:
          inherit: kde6 xdg
          desc: "Framework providing assorted high-level user interface components"
          iuse: "dbus wayland X"
          rdepend: |
            !<kde-frameworks/kguiaddons-5.116.0-r2:5[-kf6compat(-)]
            wayland? ( || ( >=dev-qt/qtbase-6.10:{{ .Values.slot }}[wayland] <dev-qt/qtwayland-6.10:{{ .Values.slot }} ) )
          depend: |
            ${RDEPEND}
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            dev-qt/qtdeclarative:{{ .Values.slot }}
            wayland? (
                dev-libs/wayland
                dev-qt/qtbase:{{ .Values.slot }}=[wayland]
                >=dev-libs/plasma-wayland-protocols-1.15.0
                >=dev-libs/wayland-protocols-1.39
            )
            X? (
                dev-qt/qtbase:{{ .Values.slot }}[X]
                x11-libs/libX11
                x11-base/xorg-proto
                x11-libs/libxcb
            )
          bdepend: |
            wayland? (
                dev-qt/qtbase:{{ .Values.slot }}[wayland]
                dev-util/wayland-scanner
                || ( >=dev-qt/qtbase-6.10:{{ .Values.slot }}[wayland] <dev-qt/qtwayland-6.10:{{ .Values.slot }} )
            )
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DBUILD_GEO_SCHEME_HANDLER=ON
                    -DUSE_DBUS=$(usex dbus)
                    -DWITH_WAYLAND=$(usex wayland)
                    -DWITH_X11=$(usex X)
                    -DBUILD_PYTHON_BINDINGS=OFF
                    -DCMAKE_DISABLE_FIND_PACKAGE_{Python3,PySide6,Shiboken6}=ON
                )
                kde6_src_configure
            }
    - kholidays:
        vars:
          desc: "Library to determine holidays and other special events for a geographical region"
          rdepend: |
            dev-qt/qtdeclarative:{{ .Values.slot }}
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
