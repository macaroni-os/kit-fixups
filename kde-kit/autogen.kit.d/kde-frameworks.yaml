    - sonnet:
        vars:
          desc: "Framework for providing spell-checking through abstraction of popular backends"
          iuse: "aspell +hunspell qml"
          rdepend: |
            dev-qt/qtbase:{{ .Values.slot }}[gui]
            aspell? ( app-text/aspell )
            hunspell? ( app-text/hunspell:= )
            qml? ( dev-qt/qtdeclarative:{{ .Values.slot }} )
          depend: |
            ${RDEPEND}
          bdepend: |
            dev-qt/qttools:{{ .Values.slot }}[linguist]
          body: |
            CMAKE_SKIP_TESTS=(
                # bug 779994
                sonnet-test_autodetect
                # bug 680032
                sonnet-test_settings
                sonnet-test_highlighter
            )

            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    $(cmake_use_find_package aspell ASPELL)
                    $(cmake_use_find_package hunspell HUNSPELL)
                    -DSONNET_USE_QML=$(usex qml)
                )
                if ! use aspell && ! use hunspell; then
                    mycmakeargs+=( -DSONNET_NO_BACKENDS=ON )
                fi

                kde6_src_configure
            }
