        vars:
          inherit: kde6 xdg
          desc: "Plasma applet and services for creating encrypted vaults"
          homepage_extra: " https://cukic.co/2017/02/03/vaults-encryption-in-plasma/"
          license: "LGPL-3"
          iuse: "networkmanager"
          rdepend: |
            || (
                >=app-crypt/gocryptfs-1.8
                >=sys-fs/cryfs-0.9.9
                >=sys-fs/encfs-1.9.2
            )
          depend: |
            ${RDEPEND}
            dev-qt/qtbase:{{ .Values.qt_slot }}[gui]
            dev-qt/qtdeclarative:{{ .Values.qt_slot }}
            kde-frameworks/kcodecs:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kitemmodels:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-plasma/libksysguard:{{ .Values.slot }}
            kde-plasma/libplasma:{{ .Values.slot }}
            kde-plasma/plasma-activities:{{ .Values.slot }}
            networkmanager? ( kde-frameworks/networkmanager-qt:{{ .Values.slot }} )
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                # ODR violations (bug #909446, kde#471836)
                filter-lto

                local mycmakeargs=(
                    $(cmake_use_find_package networkmanager KF6NetworkManagerQt)
                )

                kde6_src_configure
            }

            pkg_postinst() {
                xdg_pkg_postinst

                local has_deprecated_backend
                dropping_backend() {
                    if has_version ${2}; then
                        elog "${CATEGORY}/${PN} will drop support for ${1} in the future."
                        elog "Migrate away from any ${2} vaults before that happens."
                        elog
                        has_deprecated_backend=1
                    fi
                }

                dropping_backend CryFS sys-fs/cryfs
                dropping_backend EncFS sys-fs/encfs

                if [[ has_deprecated_backend ]]; then
                    elog "The only supported backend going forward will be app-crypt/gocryptfs."
                    elog
                    elog "See also:"
                    elog "https://invent.kde.org/plasma/plasma-vault/-/merge_requests/57"
                    elog "https://invent.kde.org/plasma/plasma-vault/-/merge_requests/62"
                fi
            }
