kde-plasma:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: kde-plasma
    vars:
      slot: 6
      qt_slot: '6'
      homepage: https://invent.kde.org/plasma/
      inherit:
        - cmake
      depend: '${RDEPEND}'
    selector:
      - '<7'
    assets:
       - name: "{{ .Values.pn }}-{{ .Values.version}}.tar.xz"
         url: https://download.kde.org/stable/plasma/{{ .Values.version }}/{{ .Values.pn }}-{{ .Values.version}}.tar.xz
    dir:
        url: "https://download.kde.org/stable/plasma/"
        matcher: "^6.*"

  packages:
    - aurorae:
        vars:
          desc: "Themeable window decoration for KWin"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            dev-qt/qttools:{{ .Values.qt_slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/ksvg:{{ .Values.slot }}
            kde-frameworks/kcmutils:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/knewstuff:{{ .Values.slot }}
            kde-frameworks/kpackage:{{ .Values.slot }}
            kde-plasma/kdecoration:{{ .Values.slot }}

    - bluedevil:
        vars:
          inherit:
            - cmake
            - xdg
          desc: "Bluetooth stack for KDE Plasma"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            kde-frameworks/bluez-qt:{{ .Values.slot }}
            kde-frameworks/kcmutils:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kjobwidgets:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/ksvg:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}[X]
            kde-plasma/libplasma:{{ .Values.slot }}
          body: |
            src_prepare() {
              cmake_src_prepare
            }

    - breeze:
        vars:
          qt5min: 5.15.12
          kf5min: 5.115.0
          inherit:
            - cmake
            - xdg
          iuse: qt5
          desc: "Breeze visual style for the Plasma desktop"
          rdepend: |
            virtual/kde-seed[gui,declarative,svg]
            kde-frameworks/frameworkintegration:{{ .Values.slot }}
            kde-frameworks/kcmutils:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}[X]
            kde-frameworks/knewstuff:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            kde-plasma/kdecoration:{{ .Values.slot }}
            qt5? (
                >=dev-qt/qtdbus-{{ .Values.qt5min }}:5
                >=dev-qt/qtdeclarative-{{ .Values.qt5min }}:5
                >=dev-qt/qtgui-{{ .Values.qt5min }}:5
                >=dev-qt/qtwidgets-{{ .Values.qt5min }}:5
                >=dev-qt/qtx11extras-{{ .Values.qt5min }}:5
                >=kde-frameworks/frameworkintegration-{{ .Values.kf5min }}:5
                >=kde-frameworks/kcmutils-{{ .Values.kf5min }}:5
                >=kde-frameworks/kconfig-{{ .Values.kf5min }}:5
                >=kde-frameworks/kconfigwidgets-{{ .Values.kf5min }}:5
                >=kde-frameworks/kcoreaddons-{{ .Values.kf5min }}:5
                >=kde-frameworks/kguiaddons-{{ .Values.kf5min }}:5
                >=kde-frameworks/ki18n-{{ .Values.kf5min }}:5
                >=kde-frameworks/kiconthemes-{{ .Values.kf5min }}:5
                >=kde-frameworks/kirigami-{{ .Values.kf5min }}:5
                >=kde-frameworks/kwidgetsaddons-{{ .Values.kf5min }}:5
                >=kde-frameworks/kwindowsystem-{{ .Values.kf5min }}:5
            )
          depend: |
            ${RDEPEND}
            x11-base/xorg-proto
          bdepend: |
            qt5? ( >=kde-frameworks/kcmutils-{{ .Values.kf5min }}:5 )
          pdepend: |
            kde-frameworks/breeze-icons:*
          body: |
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                -DBUILD_QT6=ON
                -DBUILD_QT5=$(usex qt5)
              )
              cmake_src_configure
            }

    - breeze-grub:
        vars:
          desc: "Breeze theme for GRUB"
          body: |
            src_prepare() { default; }
            src_configure() { :; }
            src_compile() { :; }
            src_install() {
              insinto /usr/share/grub/themes
              doins -r breeze
            }

    - breeze-gtk:
        vars:
          python_compat: python3+
          inherit:
            - cmake
            - python-any-r1
          desc: "Official GTK+ port of Plasma's Breeze widget style"
          bdepend: |
            ${PYTHON_DEPS}
            dev-lang/sassc
            $(python_gen_any_dep 'dev-python/pycairo[${PYTHON_USEDEP}]')
            kde-plasma/breeze:{{ .Values.slot }}

    - breeze-plymouth:
        vars:
          desc: "Breeze theme for Plymouth"
          rdepend: |
            sys-boot/plymouth
          body: |
            src_configure() {
              local mycmakeargs=(
                -DDISTRO_NAME="MacaroniOS Linux"
                -DDISTRO_VERSION=
              )
              cmake_src_configure
            }

    - discover:
        vars:
          inherit:
            - cmake
            - xdg
          iuse: "+firmware flatpak telemetry webengine"
          desc: "KDE Plasma resources management GUI"
          rdepend: |
            >=dev-libs/appstream-1.0.4:=[qt]
            virtual/kde-seed[gui,declarative]
            dev-libs/qcoro
            dev-libs/kirigami-addons:{{ .Values.slot }}
            kde-frameworks/attica:{{ .Values.slot }}
            kde-frameworks/kauth:{{ .Values.slot }}
            kde-frameworks/kcmutils:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kidletime:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/kitemmodels:{{ .Values.slot }}
            kde-frameworks/knewstuff:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/kstatusnotifieritem:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            kde-frameworks/purpose:{{ .Values.slot }}
            firmware? ( >=sys-apps/fwupd-1.9.4 )
            flatpak? ( sys-apps/flatpak )
            telemetry? ( kde-frameworks/kuserfeedback:{{ .Values.slot }} )
            webengine? ( dev-qt/qtwebview:{{ .Values.qt_slot }} )
          body: |
            src_prepare() {
              cmake_src_prepare
              # we don't do anything with this
              sed -e "s/^pkg_check_modules.*Markdown/#&/" \
                  -e "s/^pkg_check_modules.*RpmOstree/#&/" \
                  -e "s/^pkg_check_modules.*Ostree/#&/" \
                  -i CMakeLists.txt || die
            }
            src_configure() {
              local mycmakeargs=(
                -DCMAKE_DISABLE_FIND_PACKAGE_packagekitqt6=ON
                -DWITH_KCM=OFF
                -DBUILD_DummyBackend=OFF
                -DBUILD_FlatpakBackend=$(usex flatpak)
                -DBUILD_FwupdBackend=$(usex firmware)
                -DBUILD_RpmOstreeBackend=OFF
                -DBUILD_SnapBackend=OFF
                -DBUILD_SteamOSBackend=OFF
                $(cmake_use_find_package telemetry KF6UserFeedback)
                $(cmake_use_find_package webengine Qt6WebView)
              )
              cmake_src_configure
            }

    - drkonqi:
        vars:
          python_compat: python3+
          inherit:
            - cmake
            - python-single-r1
            - xdg
          desc: "Plasma crash handler, gives the user feedback if a program crashed"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            dev-libs/elfutils[utils]
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/kitemmodels:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kidletime:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kjobwidgets:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kstatusnotifieritem:{{ .Values.slot }}
            kde-frameworks/kwallet:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}
            kde-frameworks/syntax-highlighting:{{ .Values.slot }}
            sys-apps/systemd:=
            >=sys-auth/polkit-qt-0.175.0[qt6(+)]
            $(python_gen_cond_dep '
                dev-python/psutil[${PYTHON_USEDEP}]
                dev-python/pygdbmi[${PYTHON_USEDEP}]
            ')
            || (
                sys-devel/gdb
                dev-util/lldb
            )
          bdepend: |
            ${PYTHON_DEPS}
          body: |
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                -DWITH_PYTHON_VENDORING=OFF
              )
              cmake_src_configure
            }

    - flatpak-kcm:
        vars:
          inherit:
            - cmake
            - xdg
          desc: "Flatpak Permissions Management KCM"
          rdepend: |
            virtual/kde-seed[gui,svg,declarative]
            dev-qt/qtdeclarative:{{ .Values.qt_slot }}[widgets]
            dev-libs/glib:2
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/kcmutils:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kdeclarative:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kitemmodels:{{ .Values.slot }}
            sys-apps/flatpak
          body: |
            src_prepare() {
              cmake_src_prepare
            }

    - kactivitymanagerd:
        vars:
          desc: "System service to manage user's activities, track the usage patterns etc."
          rdepend: |
            virtual/kde-seed[gui,sql]
            dev-qt/qtbase:{{ .Values.qt_slot }}[sqlite]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kglobalaccel:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}[X]
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            dev-libs/boost

    - kde-cli-tools:
        vars:
          iuse: kdesu X
          desc: "Tools based on KDE Frameworks 6 to better interact with the system"
          rdepend: |
            virtual/kde-seed[gui,svg,X?]
            kdesu? ( >=${CATEGORY}/kdesu-gui-${PV} )
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kparts:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
          bdepend: |
            kde-frameworks/kcmutils:{{ .Values.slot }}
          body: |
            src_prepare() {
              cmake_src_prepare
              cmake_comment_add_subdirectory keditfiletype # split package
            }
            src_configure() {
              local mycmakeargs=(
                -DCMAKE_DISABLE_FIND_PACKAGE_KF6Su=ON
                -DWITH_X11=$(usex X)
              )
              cmake_src_configure
            }

    - kde-gtk-config:
        vars:
          desc: "GTK+ theme configuration for KDE Plasma desktop"
          rdepend: |
            dev-libs/glib:2
            virtual/kde-seed[gui,declarative,svg]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kdeclarative:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/knewstuff:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}
            x11-libs/gtk+:3[X]
          bdepend: |
            kde-frameworks/kcmutils:{{ .Values.slot }}
            virtual/pkgconfig

    - kdecoration:
        vars:
          desc: "Plugin based library to create window decorations"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/ki18n:{{ .Values.slot }}

    - kdeplasma-addons:
        vars:
          iuse: share webengine
          desc: "Extra Plasma applets and engines"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            dev-qt/qt5compat:{{ .Values.qt_slot }}[qml]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kholidays:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/knewstuff:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/kpackage:{{ .Values.slot }}
            kde-frameworks/krunner:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kunitconversion:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/kquickcharts:{{ .Values.slot }}
            kde-plasma/libplasma:{{ .Values.slot }}
            kde-plasma/plasma-workspace:{{ .Values.slot }}
            kde-plasma/plasma5support:{{ .Values.slot }}
            share? ( kde-frameworks/purpose:{{ .Values.slot }} )
            webengine? ( dev-qt/qtwebengine:{{ .Values.qt_slot }} )
          body: |
            src_configure() {
              local mycmakeargs=(
                $(cmake_use_find_package share KF6Purpose)
                $(cmake_use_find_package webengine Qt6WebEngine)
              )
              cmake_src_configure
            }

    - kgamma:
        vars:
          desc: "Monitor calibration tool for KDE"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kdoctools:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            x11-libs/libX11
            x11-libs/libXxf86vm
          bdepend: |
            kde-frameworks/kcmutils:{{ .Values.slot }}

    - kglobalacceld:
        vars:
          inherit: kde6 xdg
          desc: "Daemon providing Global Keyboard Shortcut (Accelerator) functionality"
          rdepend: |
            virtual/kde-seed[gui]
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kglobalaccel:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}

    - libplasma:
        vars:
          iuse: gles2-only wayland
          desc: "Plasma library and runtime components based upon KF6 and Qt6"
          rdepend: |
            virtual/kde-seed[gui,X,svg,declarative,gles-only2?,wayland?]
            kde-frameworks/karchive:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}[qml]
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kglobalaccel:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/kpackage:{{ .Values.slot }}
            kde-frameworks/ksvg:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}[X]
            kde-plasma/plasma-activities:{{ .Values.slot }}
            media-libs/libglvnd
            x11-libs/libX11
            x11-libs/libxcb
            !gles2-only? ( media-libs/libglvnd[X] )
          body: |
            src_configure() {
              local mycmakeargs=(
                $(cmake_use_find_package !gles2-only OpenGL)
              )
              cmake_src_configure
            }

    - spectacle:
        vars:
          inherit:
            - cmake
          iuse: share wayland
          desc: "Screenshot capture utility"
          rdepend: |
            virtual/kde-seed[gui,svg,multimedia,declarative,wayland?,X]
            dev-qt/qtimageformats:{{ .Values.qt_slot }}
            dev-qt/qtmultimedia:{{ .Values.qt_slot }}[qml]
            kde-frameworks/kimageformats:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kglobalaccel:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kstatusnotifieritem:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}[X]
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            kde-frameworks/prison:{{ .Values.slot }}
            kde-plasma/kpipewire:{{ .Values.slot }}
            kde-plasma/layer-shell-qt:{{ .Values.slot }}
            media-libs/opencv:=
            x11-libs/libxcb
            x11-libs/libXrandr
            x11-libs/xcb-util
            x11-libs/xcb-util-cursor
            x11-libs/xcb-util-image
            share? ( kde-frameworks/purpose:{{ .Values.slot }} )
          body: |
            src_configure() {
              local mycmakeargs=(
                $(cmake_use_find_package share KF6Purpose)
              )
              cmake_src_configure
            }

    - systemsettings:
        vars:
          desc: "Control Center to configure KDE Plasma desktop"
          rdepend: |
            virtual/kde-seed[gui,declarative]
            kde-frameworks/kauth:{{ .Values.slot }}
            kde-frameworks/kcmutils:{{ .Values.slot }}
            kde-frameworks/kcolorscheme:{{ .Values.slot }}
            kde-frameworks/kcompletion:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kguiaddons:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kiconthemes:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/kitemmodels:{{ .Values.slot }}
            kde-frameworks/kitemviews:{{ .Values.slot }}
            kde-frameworks/kjobwidgets:{{ .Values.slot }}
            kde-frameworks/krunner:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
            kde-frameworks/kwidgetsaddons:{{ .Values.slot }}
            kde-frameworks/kwindowsystem:{{ .Values.slot }}
            kde-frameworks/kxmlgui:{{ .Values.slot }}
            kde-plasma/plasma-activities:{{ .Values.slot }}

    - powerdevil:
        vars:
          inherit:
            - cmake
            - fcaps
            - xdg
          iuse: wayland brightness-control
          desc: "Power management for KDE Plasma Shell"
          rdepend: |
            virtual/kde-seed[gui,declarative,wayland?]
            dev-libs/qcoro[dbus]
            || (
                sys-power/power-profiles-daemon
                sys-power/tlp
            )
            >=sys-power/upower-0.9.23
            kde-frameworks/kauth:{{ .Values.slot }}[policykit]
            kde-frameworks/kcmutils:{{ .Values.slot }}
            kde-frameworks/kconfig:{{ .Values.slot }}
            kde-frameworks/kconfigwidgets:{{ .Values.slot }}
            kde-frameworks/kcoreaddons:{{ .Values.slot }}
            kde-frameworks/kcrash:{{ .Values.slot }}
            kde-frameworks/kdbusaddons:{{ .Values.slot }}
            kde-frameworks/kglobalaccel:{{ .Values.slot }}
            kde-frameworks/ki18n:{{ .Values.slot }}
            kde-frameworks/kidletime:{{ .Values.slot }}
            kde-frameworks/kio:{{ .Values.slot }}
            kde-frameworks/kirigami:{{ .Values.slot }}
            kde-frameworks/kitemmodels:{{ .Values.slot }}
            kde-frameworks/knotifications:{{ .Values.slot }}
            kde-frameworks/krunner:{{ .Values.slot }}
            kde-frameworks/kservice:{{ .Values.slot }}
