snapshot_pkgs:
  generator: builtin-noop
  template:
    engine: helm

  defaults:
    template: ../../templates/simple.tmpl
    category: kde-plasma
  packages:
    - drkonqi-legacy:
        assets:
          - name: 'drkonqi-8fd0ba78c76fbabae22ec81f4d9c4f8204d0df94.zip'
            url: 'https://invent.kde.org/plasma/drkonqi/-/archive/8fd0ba78c76fbabae22ec81f4d9c4f8204d0df94/drkonqi-8fd0ba78c76fbabae22ec81f4d9c4f8204d0df94.zip'
        vars:
          versions:
            - 6.3.80_p20250417
          python_compat: python3+
          desc: Plasma crash handler, gives the user feedback if a program crashed
          inherit:
            - kde6
            - python-single-r1
            - xdg
          slot: 6
          s: "${WORKDIR}/${PN}-8fd0ba78c76fbabae22ec81f4d9c4f8204d0df94"
          rdepend: |
            !kde-plasma/drkonqi
            dev-libs/elfutils[utils]
            >=kde-frameworks/kirigami-${KFMIN}:6
            >=kde-frameworks/kitemmodels-${KFMIN}:6
            $(python_gen_cond_dep '
                dev-python/psutil[${PYTHON_USEDEP}]
                dev-python/pygdbmi[${PYTHON_USEDEP}]
            ')
            || (
                sys-devel/gdb
                dev-util/lldb
            )
          depend: |
            ${RDEPEND}
            ${PYTHON_DEPS}
            >=dev-qt/qtbase-${QTMIN}:{{ .Values.qt_slot }}[gui]
            >=dev-qt/qtdeclarative-${QTMIN}:{{ .Values.qt_slot }}
            >=kde-frameworks/kconfig-${KFMIN}:{{ .Values.slot }}
            >=kde-frameworks/kcoreaddons-${KFMIN}:{{ .Values.slot }}
            >=kde-frameworks/kcrash-${KFMIN}:{{ .Values.slot }}
            >=kde-frameworks/ki18n-${KFMIN}:6
            >=kde-frameworks/kidletime-${KFMIN}:6
            >=kde-frameworks/kio-${KFMIN}:6
            >=kde-frameworks/kjobwidgets-${KFMIN}:6
            >=kde-frameworks/knotifications-${KFMIN}:6
            >=kde-frameworks/kservice-${KFMIN}:6
            >=kde-frameworks/kstatusnotifieritem-${KFMIN}:6
            >=kde-frameworks/kwallet-${KFMIN}:6
            >=kde-frameworks/kwidgetsaddons-${KFMIN}:6
            >=kde-frameworks/kwindowsystem-${KFMIN}:6
            >=kde-frameworks/syntax-highlighting-${KFMIN}:6
            >=sys-auth/polkit-qt-0.175.0[qt6(+)]
          body: |
            src_prepare() {
                kde6_src_prepare
            }

            src_configure() {
                local mycmakeargs=(
                    -DWITH_PYTHON_VENDORING=OFF
                    -DWITH_SYSTEMD=OFF # non-systemd snapshot before it was made required
                    -DBUILD_TESTING=OFF # Disable tests to avoid chai Python module requirement
                )
                kde6_src_configure

                if [[ -f "${BUILD_DIR}/build.ninja" ]]; then
                    sed -i '/^build.*autogen\/timestamp.*mocs_compilation\.cpp/,/^$/{ /deps = gcc/d; /depfile =/d; }' \
                        "${BUILD_DIR}/build.ninja" || die "Failed to patch build.ninja"
                fi
            }

            src_test() {
                local myctestargs=(
                    -E "(connectiontest)"
                )
                kde6_src_test
            }
