            networkmanager? ( kde-frameworks/networkmanager-qt:{{ .Values.slot }} )
            semantic-desktop? ( kde-frameworks/baloo:{{ .Values.slot }} )
            systemd? ( sys-apps/systemd:= )
            telemetry? ( kde-frameworks/kuserfeedback:{{ .Values.slot }} )
            wallpaper-metadata? ( kde-apps/libkexiv2:6 )
            X? (
                dev-qt/qtbase:{{ .Values.qt_slot }}[X]
                kde-plasma/kscreenlocker:{{ .Values.slot }}
                x11-libs/libICE
                x11-libs/libSM
