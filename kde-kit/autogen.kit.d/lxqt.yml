lxqt_github:
  generator: builtin-github
  defaults:
    category: lxqt-base
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    vars:
      homepage: https://lxqt-project.org
    github:
      query: releases
      user: lxqt

  packages:
    - lxqt-build-tools:
        category: dev-util
        vars:
          inherit:
            - cmake
          license: BSD
          rdepend: |
            dev-libs/glib:2
            dev-qt/qtbase:6
          depend: ${RDEPEND}

    - libdbusmenu-lxqt:
        category: dev-libs
        vars:
          inherit:
            - cmake
          license: LGPL-2
          rdepend: |
            dev-qt/qtbase:6
          depend: ${RDEPEND}

    - libqtxdg:
        category: dev-libs
        vars:
          inherit:
            - cmake
          license: LGPL-2.1+
          rdepend: |
            dev-libs/glib:2
            dev-qt/qtbase:6[gui]
            dev-qt/qtsvg:6
            x11-misc/xdg-utils
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            virtual/pkgconfig

    - lxqt-menu-data:
        vars:
          inherit:
            - cmake
          license: LGPL-2.1
          rdepend:
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]

    - liblxqt:
        vars:
          inherit:
            - cmake
          license: LGPL-2.1+ BSD
          iuse: +backlight
          rdepend: |
            dev-libs/libqtxdg
            dev-qt/qtbase:6[gui]
            kde-frameworks/kwindowsystem:6[X]
            x11-libs/libX11
            x11-libs/libXScrnSaver
            backlight? ( >=sys-auth/polkit-qt-0.200.0[qt6] )
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]
          body: |
            src_configure() {
                    local mycmakeargs=(
                            -DBUILD_BACKLIGHT_LINUX_BACKEND=$(usex backlight)
                    )
                    cmake_src_configure
            }

    - libsysstat:
        vars:
          inherit:
            - cmake
          license: GPL-2+ LGPL-2.1+
          rdepend: |
            dev-qt/qtbase:6
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools

    - qtxdg-tools:
        category: app-misc
        vars:
          inherit:
            - cmake
          license: LGPL-2.1
          rdepend: |
            dev-libs/libqtxdg
            dev-qt/qtbase:6
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools

    - libfm-qt:
        category: x11-libs
        vars:
          inherit:
            - cmake
          license: BSD GPL-2+ LGPL-2.1+
          rdepend: |
            dev-libs/glib:2
            dev-qt/qtbase:6[gui,X]
            lxde-base/menu-cache
            lxqt-base/lxqt-menu-data
            media-libs/libexif
            x11-libs/libxcb
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]
            virtual/pkgconfig

    - lxqt-globalkeys:
        vars:
          inherit:
            - cmake
          license: LGPL-2.1 LGPL-2.1+
          rdepend: |
            dev-qt/qtbase:6[gui]
            lxqt-base/liblxqt
            x11-libs/libX11
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]

    - lxqt-qtplugin:
        vars:
          inherit:
            - cmake
          license: LGPL-2.1+
          rdepend: |
            dev-libs/libdbusmenu-lxqt
            dev-libs/libqtxdg
            dev-qt/qtbase:6[gui]
            x11-libs/libfm-qt
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]

    - lxqt-session:
        vars:
          inherit:
            - cmake
          license: LGPL-2.1 LGPL-2.1+
          iuse: +udev
          rdepend: |
            app-misc/qtxdg-tools
            dev-libs/libqtxdg
            dev-qt/qtbase:6[gui]
            kde-frameworks/kwindowsystem:6[X]
            kde-plasma/layer-shell-qt:6
            lxqt-base/liblxqt
            sys-process/procps
            x11-libs/libX11
            x11-misc/xdg-user-dirs
            udev? ( virtual/libudev )
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]
          body: |
            src_configure() {
                local mycmakeargs=(
                    -DWITH_LIBUDEV=$(usex udev)
                )
                cmake_src_configure
            }
            src_install() {
              cmake_src_install
              doman lxqt-config-session/man/*.1 lxqt-session/man/*.1
              doenvd "${FILESDIR}"/91lxqt-config-dir
            }

    - qtermwidget:
        category: x11-libs
        vars:
          inherit:
            - cmake
          license: BSD GPL-2 LGPL-2+
          rdepend: |
            dev-qt/qtbase:6[gui]
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]

    - lxqt-panel:
        vars:
          inherit:
            - cmake
          license: LGPL-2.1 LGPL-2.1+
          iuse: +alsa colorpicker cpuload +desktopswitch +directorymenu dom +kbindicator +mainmenu +mount networkmonitor pulseaudio +quicklaunch lm_sensors +showdesktop +spacer +statusnotifier sysstat +taskbar tray +volume +worldclock
          required_use: |
            || ( desktopswitch mainmenu showdesktop taskbar )
            volume? ( || ( alsa pulseaudio ) )
          rdepend: |
            dev-libs/libqtxdg
            dev-libs/wayland
            dev-qt/qtbase:6[gui]
            dev-qt/qtsvg:6
            dev-qt/qtwayland:6
            kde-frameworks/kwindowsystem:6[X]
            kde-plasma/layer-shell-qt:6
            lxqt-base/liblxqt
            lxqt-base/lxqt-globalkeys
            lxqt-base/lxqt-menu-data
            x11-libs/libX11
            cpuload? ( sys-libs/libstatgrab )
            kbindicator? ( x11-libs/libxkbcommon )
            lm_sensors? ( sys-apps/lm_sensors )
            mount? ( kde-frameworks/solid:6 )
            networkmonitor? ( sys-libs/libstatgrab )
            statusnotifier? (
                dev-libs/libdbusmenu-lxqt
                dev-qt/qtbase:6
            )
            sysstat? ( lxqt-base/libsysstat )
            tray? (
                x11-libs/libxcb:=
                x11-libs/libXcomposite
                x11-libs/libXdamage
                x11-libs/libXrender
                x11-libs/libXtst
                x11-libs/xcb-util
                x11-libs/xcb-util-image
            )
            volume? (
                alsa? ( media-libs/alsa-lib )
                pulseaudio? (
                    media-sound/pulseaudio
                    media-sound/pavucontrol-qt
                )
            )
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]
            virtual/pkgconfig
          body: |
            src_configure() {
                local mycmakeargs=(
                    -DCOLORPICKER_PLUGIN=$(usex colorpicker)
                    -DCPULOAD_PLUGIN=$(usex cpuload)
                    -DDESKTOPSWITCH_PLUGIN=$(usex desktopswitch)
                    -DDIRECTORYMENU_PLUGIN=$(usex directorymenu)
                    -DDOM_PLUGIN=$(usex dom)
                    -DKBINDICATOR_PLUGIN=$(usex kbindicator)
                    -DMAINMENU_PLUGIN=$(usex mainmenu)
                    -DMOUNT_PLUGIN=$(usex mount)
                    -DNETWORKMONITOR_PLUGIN=$(usex networkmonitor)
                    -DQUICKLAUNCH_PLUGIN=$(usex quicklaunch)
                    -DSENSORS_PLUGIN=$(usex lm_sensors)
                    -DSHOWDESKTOP_PLUGIN=$(usex showdesktop)
                    -DSPACER_PLUGIN=$(usex spacer)
                    -DSTATUSNOTIFIER_PLUGIN=$(usex statusnotifier)
                    -DSYSSTAT_PLUGIN=$(usex sysstat)
                    -DTASKBAR_PLUGIN=$(usex taskbar)
                    -DTRAY_PLUGIN=$(usex tray)
                    -DVOLUME_PLUGIN=$(usex volume)
                    -DWORLDCLOCK_PLUGIN=$(usex worldclock)
                )
                if use volume; then
                    mycmakeargs+=(
                        -DVOLUME_USE_ALSA=$(usex alsa)
                        -DVOLUME_USE_PULSEAUDIO=$(usex pulseaudio)
                    )
                fi
                cmake_src_configure
            }
            src_install() {
                cmake_src_install
                doman panel/man/*.1
            }

    - pcmanfm-qt:
        category: x11-misc
        vars:
          inherit:
            - cmake
            - xdg
          license: GPL-2 GPL-2+ LGPL-2.1+
          rdepend: |
            dev-libs/glib:2
            dev-qt/qtbase:6[gui]
            kde-plasma/layer-shell-qt:6
            lxqt-base/lxqt-menu-data
            sys-apps/util-linux
            virtual/freedesktop-icon-theme
            x11-libs/libfm-qt
            x11-libs/libxcb
            x11-misc/xdg-utils
          depend: |
            ${RDEPEND}
            dev-util/lxqt-build-tools
            dev-qt/qttools:6[linguist]
          body: |
            src_prepare() {
              cmake_src_prepare
            }
            pkg_postinst() {
                xdg_desktop_database_update
                xdg_icon_cache_update
            }

    - qterminal:
