sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"
- name: "kde-kit"
  url: "https://github.com/macaroni-os/kde-kit"
  branch: "mark-unstable"

target:
  name: kde-kit
  url: "https://github.com/macaroni-os/kde-kit"
  branch: mark-iii

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 2

  atoms:

    - pkg: kde-plasma/aurorae:6
    - pkg: kde-plasma/bluedevil:6
    - pkg: kde-plasma/breeze:6
    - pkg: kde-plasma/breeze-grub:6
