sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

- name: "kde-kit"
  url: "https://github.com/macaroni-os/kde-kit"
  branch: "mark-unstable"

target:
  name: kde-kit
  url: "https://github.com/macaroni-os/kde-kit"
  branch: mark-iii

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-admin/calamares

    - pkg: dev-libs/grantlee
    - pkg: dev-libs/kdiagram:5
    - pkg: dev-libs/kirigami-addons:5
    - pkg: dev-libs/kpeoplevcard:5
    - pkg: dev-libs/ktextaddons:5
    - pkg: dev-libs/kuserfeedback:5


    - pkg: kde-misc/markdownpart
    - pkg: kde-misc/kdeconnect
    - pkg: kde-misc/kdirstat:5
    - pkg: kde-misc/kio-gdrive
    - pkg: kde-misc/krename
    - pkg: kde-misc/openofficeorg-thumbnail
    - pkg: kde-misc/latte-dock
    - pkg: kde-misc/plasma-redshift-control
    - pkg: kde-misc/skanlite

    - pkg: media-libs/libqaccessibilityclient:5
    - pkg: media-libs/phonon-gstreamer
    - pkg: media-libs/kimageannotator

    - pkg: media-gfx/krita:5
    - pkg: media-gfx/lximage-qt

    - pkg: dev-util/lxqt-build-tools
    - pkg: net-irc/konversation
    - pkg: net-libs/kdsoap
    - pkg: net-libs/kdsoap-ws-discovery-client
    - pkg: net-libs/libktorrent
    - pkg: net-p2p/ktorrent

    - pkg: sys-libs/kpmcore

    - pkg: x11-libs/qtermwidget

    - pkg: x11-misc/pcmanfm-qt
    - pkg: x11-misc/qps
    - pkg: x11-misc/screengrab

    - pkg: x11-terms/qterminal

