sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

- name: "security-kit"
  url: "https://github.com/macaroni-os/security-kit"
  branch: "mark-testing"

- name: "kde-kit"
  url: "https://github.com/macaroni-os/kde-kit"
  branch: "mark-testing"

- name: "desktop-kit"
  url: "https://github.com/macaroni-os/desktop-kit"
  branch: "mark-testing"

target:
  name: kde-kit
  url: "https://github.com/macaroni-os/kde-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-misc/qtxdg-tools


    - pkg: lxde-base/menu-cache
    - pkg: lxqt-base/lxqt-meta

    - pkg: x11-libs/libfm
    - pkg: x11-libs/libfm-extra

