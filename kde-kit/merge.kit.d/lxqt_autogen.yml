sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: kde-kit
  url: "https://github.com/macaroni-os/kde-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-arch/lxqt-archiver

    - pkg: app-misc/qtxdg-tools

    - pkg: dev-libs/libdbusmenu-lxqt
    - pkg: dev-libs/libqtxdg

    - pkg: dev-util/lxqt-build-tools

    - pkg: gui-libs/xdg-desktop-portal-lxqt

    - pkg: lxqt-base/liblxqt
    - pkg: lxqt-base/libsysstat
    - pkg: lxqt-base/lxqt-about
    - pkg: lxqt-base/lxqt-admin
    - pkg: lxqt-base/lxqt-config
    - pkg: lxqt-base/lxqt-globalkeys
    - pkg: lxqt-base/lxqt-menu-data
    - pkg: lxqt-base/lxqt-notificationd
    - pkg: lxqt-base/lxqt-openssh-askpass
    - pkg: lxqt-base/lxqt-panel
    - pkg: lxqt-base/lxqt-policykit
    - pkg: lxqt-base/lxqt-powermanagement
    - pkg: lxqt-base/lxqt-qtplugin
    - pkg: lxqt-base/lxqt-runner
    - pkg: lxqt-base/lxqt-session
    - pkg: lxqt-base/lxqt-sudo
    - pkg: lxqt-base/lxqt-wayland-session

    - pkg: media-gfx/lximage-qt

    - pkg: x11-libs/libfm-qt
    - pkg: x11-libs/qtermwidget

    - pkg: x11-misc/obconf-qt
    - pkg: x11-misc/pcmanfm-qt
    - pkg: x11-misc/qps
    - pkg: x11-misc/screengrab

    - pkg: x11-terms/qterminal

    - pkg: x11-themes/lxqt-themes
