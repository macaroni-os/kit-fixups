debian_sources:
  generator: custom
  generator_opts:
    script: sys-kernel/debian-sources/generator.py
    enable_set_version: 'false'

  defaults:
    files_dir: sys-kernel/debian-sources/files
    template: templates/debian-sources.tmpl
    category: sys-kernel
    selector4slot: true
    vars:
      # NOTE: update this file when zfs-kmod changes
      openzfs_meta_url: https://raw.githubusercontent.com/openzfs/zfs/zfs-2.3-release/META
      desc: 'Debian Sources (and optional binary kernel)'
      homepage: 'https://packages.debian.org/unstable/kernel/'
      #additional_artifacts:
        #rtw89-driver: 'https://build.funtoo.org/distfiles/debian-sources/debian-sources-6.3.7_p1-rtw89-driver.tar.gz'
      common_patches:
        - ikconfig.patch
        - mcelog.patch
      license: GPL-2
      iuse: |
        acpi-ec binary btrfs custom-cflags dracut ec2 +logo luks lvm mdadm savedconfig sshd sign-modules zfs
      rdepend: |
        sys-apps/gawk
        dracut? (
          sys-apps/whip-catalog
          sys-kernel/dracut
          virtual/dracut-mark
        )
      depend: |
        virtual/libelf
        btrfs? ( sys-fs/btrfs-progs )
        zfs? ( sys-fs/zfs )
        luks? ( sys-fs/cryptsetup )
        lvm? ( sys-fs/lvm2 )
        mdadm? ( sys-fs/mdadm )
      required_use: |
        binary? (
          ^^ ( dracut )
          btrfs? ( dracut )
          mdadm? ( dracut )
          luks? ( dracut )
          lvm? ( dracut )
          sshd? ( dracut )
        )
        sshd? ( binary )

  packages:
    - debian-sources:
        revision: 999
        selector:
          - '>6.13'
        vars:
          level: unstable
          branch: sid
          # Set the slot here in order to
          # generate correctly the reposcan object
          # used on merge phase.
          slot: sid
          track_openzfs: False
          patches:
            - 6.16+/more-ISA-levels-and-uarches-for-kernel-6.16+.patch
          config_extract: 6.6
    - debian-sources:
        selector:
          - '>6.13'
        revision: 400
        vars:
          level: testing
          branch: forky
          slot: forky
          track_openzfs: True
          patches:
            - 6.16+/more-ISA-levels-and-uarches-for-kernel-6.16+.patch
          config_extract: 6.6
    - debian-sources:
        revision: 200
        selector:
          - '<6.13'
        vars:
          level: stable
          branch: trixie
          slot: trixie
          track_openzfs: True
          patches:
            - 6.1.79+/more-ISA-levels-and-uarches-for-kernel-6.1.79+.patch
          config_extract: 6.6
    - debian-sources:
        revision: 100
        selector:
          - '<6.2'
        vars:
          level: oldstable
          branch: bookworm
          slot: bookworm
          track_openzfs: True
          patches:
            - 6.1.79+/more-ISA-levels-and-uarches-for-kernel-6.1.79+.patch
          config_extract: 6.1

debian_headers:
  generator: custom
  generator_opts:
    script: sys-kernel/debian-sources/generator.py
    enable_set_version: 'false'
  defaults:
    category: sys-kernel
    files_dir: vanilla-headers
    template: ../../templates/simple.tmpl
    vars:
      depend: |
        >=sys-kernel/linux-headers-6.12
      bdepend: |
        app-arch/xz-utils
        dev-lang/perl
        net-misc/rsync
        !!sys-kernel/vanilla-headers
      branch: trixie
      desc: Linux kernel header files with Debian patches
      patches:
        - 00_all_0002-x86-do-not-build-relocs-tool-when-installing-headers.patch
      homepage: https://kernel.org https://debian.org/kernel
      inherit:
        - eutils
        - toolchain-funcs
      level: stable
      license: GPL-2
      openzfs_meta_url: https://raw.githubusercontent.com/openzfs/zfs/zfs-2.3-release/META
      slot: 0
      s: '${WORKDIR}/linux-${PV%%_p*}'
      track_openzfs: False
      body: |
        get_patch_list() {
          [[ -z "${1}" ]] && die "No patch series file specified"
          local patch_series="${1}"
          while read line ; do
            if [[ "${line:0:1}" != "#" ]] ; then
              echo "${line}"
            fi
          done < "${patch_series}"
        }
        pkg_setup() {
          # will interfere with Makefile if set
          unset ARCH; unset LDFLAGS
        }
        src_prepare() {
          default
          # apply debian patchset
          for debpatch in $( get_patch_list "${WORKDIR}/debian/patches/series" ); do
            eapply -p1 "${WORKDIR}/debian/patches/${debpatch}" || die "could not apply patch!"
          done
          # drop unused errno.h include
          sed -e '/^#include <errno.h>/d' -i ${S}/scripts/unifdef.c
        }
        src_compile() {
          :
        }
        src_install() {
          # fix permissions in source tree
          cd "${WORKDIR}"
          chown -R 0:0 * >& /dev/null
          chmod -R a+r-w+X,u+w *
          cd "${OLDPWD}"
          [[ -L /usr/include/linux ]] && { rm /usr/include/linux || die; }
          [[ -L /usr/include/asm ]] && { rm /usr/include/asm || die; }
          emake O="${D}" ARCH="$(tc-arch-kernel)" headers_install \
            || die "could not install headers to image"
          # prune non-headers from tree
          rm "${D}"/{arch,include,scripts} -r
          find "${D}" '(' -name '.install' -o -name '*.cmd' ')' -delete
        }
  packages:
    - debian-headers:
        selector:
          - '>6.12'
          - '<6.13'

# TODO: move to separate file, as it's not specifically debian-sources--related
dracut_config:
  generator: builtin-noop
  template:
    engine: helm
  defaults:
    template: ../../templates/simple.tmpl
    category: virtual
    ignore_artefacts: true
  packages:
    - dracut-mark:
        files_dir: virtual/dracut-mark
        vars:
          versions:
            - "1"
          desc: A virtual package that installs a Dracut config for MARK
          s: "${WORKDIR}"
          body: |
            src_install() {
              insinto /etc/dracut.conf.d/
              newins ${FILESDIR}/dracut-mark.conf 99-macaroni.conf
            }
