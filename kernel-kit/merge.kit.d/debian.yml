sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: kernel-kit
  url: "https://github.com/macaroni-os/kernel-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: sys-kernel/debian-headers
    - pkg: sys-kernel/debian-sources:bookworm
    - pkg: sys-kernel/debian-sources:forky
    - pkg: sys-kernel/debian-sources:trixie
    - pkg: sys-kernel/debian-sources:sid

    - pkg: sys-kernel/vanilla-sources:5.10
    - pkg: sys-kernel/vanilla-sources:5.15
    - pkg: sys-kernel/vanilla-sources:6.1
    - pkg: sys-kernel/vanilla-sources:6.6
    - pkg: sys-kernel/vanilla-sources:6.12
    - pkg: sys-kernel/vanilla-sources:6.18
    - pkg: sys-kernel/vanilla-sources:7.1
    - pkg: sys-kernel/vanilla-sources:7.2

    - pkg: virtual/dracut-mark
