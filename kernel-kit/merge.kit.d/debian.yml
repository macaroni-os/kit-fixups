sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-31"

- name: "kernel-kit"
  url: "https://github.com/macaroni-os/kernel-kit"
  branch: "mark-unstable"

target:
  name: kernel-kit
  url: "https://github.com/macaroni-os/kernel-kit"
  branch: mark-31

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: sys-kernel/debian-sources:bookworm
    - pkg: sys-kernel/debian-sources:trixie
    - pkg: sys-kernel/debian-sources:sid

    - pkg: virtual/dracut-mark
