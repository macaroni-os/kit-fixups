sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: kernel-kit
  url: "https://github.com/macaroni-os/kernel-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: sys-fs/zfs-kmod
      conditions:
        - '<sys-fs/zfs-kmod-2.5'
        - '>=sys-fs/zfs-kmod-2.4.0'

    - pkg: sys-fs/zfs-kmod
      conditions:
        - '<sys-fs/zfs-kmod-2.4'
        - '>=sys-fs/zfs-kmod-2.3.0'

