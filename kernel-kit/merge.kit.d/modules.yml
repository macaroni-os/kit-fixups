sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

- name: "kernel-kit"
  url: "https://github.com/macaroni-os/kernel-kit"
  branch: "mark-unstable"

target:
  name: kernel-kit
  url: "https://github.com/macaroni-os/kernel-kit"
  branch: mark-xl

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: sys-fs/zfs-kmod
