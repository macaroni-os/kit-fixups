golang:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    template: ../../templates/simple.tmpl

    dir:
      url: https://go.dev/dl
      matcher: "go1.*src.tar.gz$"
    transform:
      - kind: string
        match: go
        replace: ""
      - kind: string
        match: ".src.tar.gz"
        replace: ""
    vars:
      homepage: "https://golang.org"
      desc: "A concurrent garbage collected and typesafe programming language"
      extra_envs:
        - 'RESTRICT="strip"'
        # the *.syso files have writable/executable stacks
        - "QA_EXECSTACK='*.syso'"
        # Do not complain about CFLAGS, etc, since Go doesn't use them.
        - "QA_FLAGS_IGNORED='.*'"
        # The tools in /usr/lib/go should not cause the multilib-strict check to fail.
        - 'QA_MULTILIB_PATHS="usr/lib/go/pkg/tool/.*/.*"'
        # This package triggers "unrecognized elf file(s)" notices on riscv.
        # https://bugs.gentoo.org/794046
        - "QA_PREBUILT='.*'"
        - 'export CBUILD=${CBUILD:-${CHOST}}'
        - 'export CTARGET=${CTARGET:-${CHOST}}'
      inherit:
        - toolchain-funcs
      license: BSD
      iuse: amd64 arm64 armv6
      patches:
        - go-never-download-newer-toolchains.patch
      docs:
        - CONTRIBUTING.md
        - PATENTS
        - README.md
        - SECURITY.md
      s: '${WORKDIR}/go'
      body: |
        src_unpack() {
            for i in amd64 arm64 armv6 ; do
                if use $i ; then
                    if [ $i = "armv6" ] ; then
                        i=${i}l
                    fi
                    unpack go{{ .Values.version }}-bootstrap.linux-${i}.tar.gz || die
                    mv ${WORKDIR}/go ${WORKDIR}/go-bootstrap
                    break
                fi
            done
            unpack go{{ .Values.version }}.src.tar.gz || die
        }

        src_compile() {
          if has_version -b dev-lang/go; then
            export GOROOT_BOOTSTRAP="${BROOT}/usr/lib/go"
          else
            # Using bootstrap tarball.
            export GOROOT_BOOTSTRAP="${WORKDIR}/go-bootstrap"
          fi

          CARCH=${CHOST%%-*}

          case "$CARCH" in
            aarch64) export GOARCH="arm64" ;;
            armel)   export GOARCH="arm" GOARM=5 ;;
            armhf)   export GOARCH="arm" GOARM=6 ;;
            armv7)   export GOARCH="arm" GOARM=7 ;;
            s390x)   export GOARCH="s390x" ;;
            x86)     export GOARCH="386" ;;
            x86_64)  export GOARCH="amd64" ;;
            ppc64)   export GOARCH="ppc64" ;;
            ppc64le) export GOARCH="ppc64le" ;;
            riscv64) export GOARCH="riscv64" ;;
            loongarch64) export GOARCH="loong64" ;;
            *)       export GOARCH="unsupported";;
          esac

          case "$CARCH" in
          x86_64|s390x|aarch64) export GO_LDFLAGS=-buildmode=pie ;;
          esac

          export GOROOT_FINAL="${EPREFIX}"/usr/lib/go
          export GOROOT="${PWD}"
          export GOBIN="${GOROOT}/bin"
          export GOCACHE="${T}/go-build"
          export CC=$(tc-getBUILD_CC)
          export GOOS="linux"
          export CC_FOR_TARGET=$(tc-getCC)
          export CXX_FOR_TARGET=$(tc-getCXX)
          use armv6 && export GOARM=6

          cd src
          bash -x ./make.bash || die "build failed"
        }

        src_install() {
          dodir /usr/lib/go
          cp -R api bin doc lib pkg misc src test "${ED}"/usr/lib/go
          einstalldocs

          if [ -f go.env ]; then
            insinto /usr/lib/go
            doins go.env
          fi

          # testdata directories are not needed on the installed system
          rm -fr $(find "${ED}"/usr/lib/go -iname testdata -type d -print)
          local bin_path=bin
          local f x
          for x in ${bin_path}/*; do
            f=${x##*/}
            dosym ../lib/go/${bin_path}/${f} /usr/bin/${f}
          done
        }


    assets:
      - name: "go{{ .Values.version }}.src.tar.gz"

      - name: "go{{ .Values.version }}-bootstrap.linux-amd64.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-amd64.tar.gz"
        use: amd64
      - name: "go{{ .Values.version }}-bootstrap.linux-arm64.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-arm64.tar.gz"
        use: arm64
      - name: "go{{ .Values.version }}-bootstrap.linux-armv6l.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-armv6l.tar.gz"
        use: armv6

  packages:
    # go1.22
    - go:
        selector:
          - '<1.23.0'
          - '>=1.22.0'

    # go1.23
    - go:
        selector:
          - '<1.24.0'
          - '>=1.23.0'
    # go1.24
    - go:
        selector:
          - '<1.25.0'
          - '>=1.24.0'
    # go1.25
    - go:
        selector:
          - '<1.26.0'
          - '>=1.25.0'
    # go1.26
    - go:
        selector:
          - '<1.27.0'
          - '>=1.26.0'

nodejs:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: net-libs
    github:
      query: tags
      user: nodejs
      repo: node
      num_pages: 5
    vars:
      desc: Node.js JavaScript runtime
      license: Apache-1.1 Apache-2.0 BSD BSD-2 MIT
      inherit:
        - python-any-r1
      python_compat: python3+
      bdepend: |
        ${PYTHON_DEPS}
      body: |
        src_configure() {
          configure_options=(
            # By default, prefix is /usr/local, which is outside of PATH,
            # set it to /usr instead:
            --prefix="${EPREFIX}"/usr
          )
          # NOTE: `econf` default flags appear to trip up the configure process,
          #       directly call the ./configure script instead.
          ./configure "${configure_options[@]}"
        }


  packages:
    # Release 24
    - nodejs:
        selector:
          - '<25.0.0'
          - '>=24.0.0'

    # Release 22
    - nodejs:
        selector:
          - '<23.0.0'
          - '>=22.0.0'

    # Release 20
    - nodejs:
        selector:
          - '<21.0.0'
          - '>=20.0.0'


zig:
  generator: builtin-json
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    vars:
      homepage: https://ziglang.org/
      desc: General-purpose programming language for robust, optimal, and reusable software
      license: MIT
      baseurl: https://ziglang.org/download

    json:
      url: '{{ .Values.baseurl }}/index.json'
      version_filter: '$'

  packages:
    - zig:
        json:
          src_uri_filter: "$['{{ .Values.version }}'].src.tarball"
        vars:
          inherit:
            - cmake
          extra_envs:
            - 'BUILD_DIR="${S}/build"'
            - CMAKE_BUILD_TYPE=Release
          iuse: +clang
          llvm_targets:
            - AArch64
            - AMDGPU
            - ARM
            - AVR
            - BPF
            - Hexagon
            - Lanai
            - Mips
            - MSP430
            - NVPTX
            - PowerPC
            - RISCV
            - SystemZ
            - Sparc
            - SPIRV
            - VE
            - WebAssembly
            - X86
            - XCore
            - LoongArch
          # We need to force the valid targets else zig wants all standards targets.
          #sed -e "s|set(ZIG_LLVM_REQUIRED_TARGETS .*|set(ZIG_LLVM_REQUIRED_TARGETS \"${LLVM_TARGETS// /;}\")|g" -i \
          #  cmake/Findllvm.cmake
          body: |
            src_configure() {
              local llvm_version=$(clang --version  | grep version  | cut -d' ' -f 4 | cut -d'.' -f1)
              if use clang; then
                local -x CC=${CHOST}-clang
                local -x CXX=${CHOST}-clang++
              fi
              einfo "Using LLVM Targets: ${LLVM_TARGETS// /;}"
              local mycmakeargs=(
                -DZIG_SHARED_LLVM=ON
                -DCMAKE_INSTALL_PREFIX=/usr
                -DCMAKE_PREFIX_PATH=/usr
                -DCMAKE_VERBOSE_MAKEFILE=ON
                -DZIG_VERSION="${PV}"
                -DCLANG_INCLUDE_DIRS=/usr/lib/llvm/${llvm_version}/include
              )
              cmake_src_configure
            }

    - zig:
        category: virtual
        template: ../../templates/simple.tmpl
        ignore_artefacts: true
        vars:
          desc: Virtual for Zig language compiler
          rdepend: |
            || ( ~dev-lang/zig-bin-{{ .Values.version }} ~dev-lang/zig-{{ .Values.version }} )

    - zig-bin:
        template: ../../templates/simple.tmpl
        assets:
          - name: "{{ .Values.pn }}-x86_64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-x86_64-linux-{{ .Values.version }}.tar.xz'
            use: amd64
          - name: "{{ .Values.pn }}-arm-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-arm-linux-{{ .Values.version }}.tar.xz'
            use: arm
          - name: "{{ .Values.pn }}-aarch64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-aarch64-linux-{{ .Values.version }}.tar.xz'
            use: arm64
          - name: "{{ .Values.pn }}-riscv64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-riscv64-linux-{{ .Values.version }}.tar.xz'
            use: riscv64

        vars:
          iuse: doc amd64 arm arm64 riscv64
          depend: app-arch/tar
          desc: General-purpose programming language for robust, optimal, and reusable software (upstream build)
          rdepend: |
            !dev-lang/zig
          body: |
            src_unpack() {
              default
              mv "${WORKDIR}/"* "${S}"
            }
            src_install() {
              use doc || rm -rf "${S}"/doc
              dodir /opt
              mv "${S}" "${ED}"/opt/ || die
              dodir /usr/bin
              dosym "${ED}"/opt/${P}/zig /usr/bin/zig
              fperms 0755 /usr/bin/zig
            }


swig:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    template: ../../templates/simple.tmpl

    dir:
      url: https://sourceforge.net/projects/swig/files/swig/
      matcher: "swig-4"
      exclude: "beta|timeline"
    transform:
      - kind: string
        match: swig-
        replace: ""
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
        url: "https://download.sourceforge.net/{{ .Values.pn }}/{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
    vars:
      desc: Simplified Wrapper and Interface Generator
      license: GPL-3+ BSD BSD-2
      homepage: http://www.swig.org/
      iuse: ccache pcre
      rdepend: |
        pcre? ( dev-libs/libpcre )
        ccache? ( sys-libs/zlib )
      depend: '${RDEPEND}'
      docs:
        - ANNOUNCE
        - CHANGES
        - CHANGES.current
        - README
        - TODO
      body: |
        src_configure() {
          econf \
            $(use_enable ccache) \
            $(use_with pcre)
        }

  packages:
    - swig:

typescript:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-node
    github:
      query: releases
      user: microsoft
      repo: TypeScript
    vars:
      inherit:
        - npmv1
      rdepend: '${DEPEND}'
      extra_envs:
        - 'NPM_NO_DEPS=1'
      s: '${WORKDIR}/package'
    transform:
      - kind: string
        match: 'TypeScript '
        replace: ''
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tgz'

  packages:
    - typescript:

rust:
  # See https://static.rust-lang.org/dist/channel-rust-stable.toml for
  # components.
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-lang
    github:
      repo: rust
      user: rust-lang
    transform:
      - kind: string
        match: 'Rust '
        replace: ''

  packages:

    # Rust 1.93.x
    - rust:
        selector:
          - '<1.95.0'
          - '>=1.94.0'
        category: virtual
        ignore_artefacts: true
        vars:
          desc: Virtual for Rust language compiler
          rdepend: |
            || (
              ~dev-lang/rust-bin-{{ .Values.version }}
              ~dev-lang/rust-{{ .Values.version }}
            )
          depend: '${RDEPEND}'

    - rust-bin:
        selector:
          - '<1.95.0'
          - '>=1.94.0'

        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}-x86_64-unknown-linux-gnu.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-x86_64-unknown-linux-gnu.tar.xz'
            use: amd64
          - name: '{{ .Values.pn }}-{{ .Values.version }}-arm-unknown-linux-gnueabi.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-arm-unknown-linux-gnueabi.tar.xz'
            use: arm
          - name: '{{ .Values.pn }}-{{ .Values.version }}-arm-unknown-linux-gnueabihf.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-arm-unknown-linux-gnueabihf.tar.xz'
            use: arm
          - name: '{{ .Values.pn }}-{{ .Values.version }}-armv7-unknown-linux-gnueabihf.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-armv7-unknown-linux-gnueabihf.tar.xz'
            use: arm
          - name: '{{ .Values.pn }}-{{ .Values.version }}-aarch64-unknown-linux-gnu.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-aarch64-unknown-linux-gnu.tar.xz'
            use: arm64
          - name: '{{ .Values.pn }}-{{ .Values.version }}-riscv64gc-unknown-linux-gnu.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-riscv64gc-unknown-linux-gnu.tar.xz'
            use: riscv64
          - name: '{{ .Values.pn }}-{{ .Values.version }}-wasm32-unknown-unknown.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-std-{{ .Values.version }}-wasm32-unknown-unknown.tar.xz'
            use: wasm
          - name: '{{ .Values.pn }}-{{ .Values.version }}-wasm32-wasip1.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-std-{{ .Values.version }}-wasm32-wasip1.tar.xz'
            use: wasm-wasip1
          - name: '{{ .Values.pn }}-{{ .Values.version }}-wasm32-wasip1-threads.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-std-{{ .Values.version }}-wasm32-wasip1-threads.tar.xz'
            use: wasm-wasip1-threads
          - name: '{{ .Values.pn }}-{{ .Values.version }}-wasm32-wasip2.tar.xz'
            url: 'https://static.rust-lang.org/dist/rust-std-{{ .Values.version }}-wasm32-wasip2.tar.xz'
            use: wasm-wasip2

        vars:
          license: '|| ( MIT Apache-2.0 ) BSD-1 BSD-2 BSD-4 UoI-NCSA'
          slot: 'stable'
          inherit:
            - bash-completion-r1
            - toolchain-funcs
          iuse: |
            clippy doc rustfmt rust-analyzer
            amd64 arm arm64 riscv64
            {{- range $c := .Values.components }}
            {{ $c.use }}
            {{- end }}
          restrict: strip
          rdepend: |
            app-eselect/eselect-rust
          components:
            - use: rust-src
              name: rust-src

            - use: wasm
              name: rust-std
              chost: wasm32-unknown-unknown

            - use: wasm-wasip1
              name: rust-std
              chost: wasm32-wasip1

            - use: wasm-wasip1-threads
              name: rust-std
              chost: wasm32-wasip1-threads

            - use: wasm-wasip2
              name: rust-std
              chost: wasm32-wasip2

          depend: '${RDEPEND}'
          extra_envs:
            - 'QA_EXECSTACK="opt/${P}/lib/rustlib/*/lib*.rlib:lib.rmeta"'
            - |
              QA_PREBUILT="
              opt/${P}/bin/.*
              opt/${P}/lib/.*.so
              opt/${P}/libexec/.*
              opt/${P}/lib/rustlib/.*/bin/.*
              opt/${P}/lib/rustlib/.*/lib/.*
              "
          body: |
            rust_abi() {
              local CTARGET=${1:-${CHOST}}
              case ${CTARGET%%*-} in
                x86_64*) echo x86_64-unknown-linux-gnu;;
                armv6j*s*) echo arm-unknown-linux-gnueabi;;
                armv6j*h*) echo arm-unknown-linux-gnueabihf;;
                armv7a*h*) echo armv7-unknown-linux-gnueabihf;;
                aarch64*) echo aarch64-unknown-linux-gnu;;
                riscv64*) echo riscv64gc-unknown-linux-gnu;;
              esac
            }
            src_unpack() {
              default
              mv "${WORKDIR}/rust-{{ .Values.version }}-$(rust_abi)" "${S}" || die
              {{- range $c := .Values.components }}
              if use {{ $c.use }} ; then
                {{- if eq $c.use "rust-src" }}
                mv "${WORKDIR}/{{ $c.name }}-{{ $.Values.version }}/{{ $c.name }}" "${S}"/rust-src
                {{- else }}
                mv "${WORKDIR}/{{ $c.name }}-{{ $.Values.version }}-{{ $c.chost }}/{{ $c.name }}-{{ $c.chost }}" "${S}"/{{ $c.name }}-{{ $c.chost }}
                {{- end }}
              fi
              {{- end }}
            }
            src_prepare() {
              default
              {{- range $c := .Values.components }}
              if use {{ $c.use }} ; then
                {{- if eq $c.use "rust-src" }}
                echo "{{ $c.name }}" >> components
                {{- else }}
                echo "{{ $c.name }}-{{ $c.chost }}" >> components
                {{- end }}
              fi
              {{- end }}
            }
            src_install() {
              pushd "${S}" >/dev/null || die
              local std="$(grep -m 1 'std' ./components)"
              local components=( "rustc" "cargo" "${std}" )
              use doc && components+=( "rust-docs" )
              use clippy && components+=( "clippy-preview" )
              use rustfmt && components+=( "rustfmt-preview" )
              use rust-src && components="${components},rust-src"
              {{- range $c := .Values.components }}
              if use {{ $c.use }} ; then
                {{- if eq $c.use "rust-src" }}
                components+=( "rust-src" )
                {{- else }}
                components+=( "{{ $c.name }}-{{ $c.chost }}" )
                {{- end }}
              fi
              {{- end }}

              if use rust-analyzer; then
                local analysis="$(grep 'analysis' ./components || die "analysis not found in components")"
                components+=( "rust-analyzer-preview" "${analysis}" )
              fi
              ./install.sh \
                --components="$(IFS=,; echo "${components[*]}")" \
                --disable-verify \
                --prefix="${ED}/opt/${P}" \
                --mandir="${ED}/opt/${P}/man" \
                --disable-ldconfig \
                || die

              local symlinks=(
                cargo
                rustc
                rustdoc
                rust-gdb
                rust-gdbgui
                rust-lldb
              )

              use clippy && symlinks+=( clippy-driver cargo-clippy )
              use rustfmt && symlinks+=( rustfmt cargo-fmt )

              einfo "installing eselect-rust symlinks and paths"
              local i
              for i in "${symlinks[@]}"; do
                # we need realpath on /usr/bin/* symlink return version-appended binary path.
                # so /usr/bin/rustc should point to /opt/rust-bin-<ver>/bin/rustc-<ver>
                local ver_i="${i}-bin-${PV}"
                ln -v "${ED}/opt/${P}/bin/${i}" "${ED}/opt/${P}/bin/${ver_i}" || die
                dosym "../../opt/${P}/bin/${ver_i}" "/usr/bin/${ver_i}"
              done
              # symlinks to switch components to active rust in eselect
              dosym "../../../opt/${P}/lib" "/usr/lib/rust/lib-bin-${PV}"
              dosym "../../../opt/${P}/man" "/usr/lib/rust/man-bin-${PV}"
              dosym "../../opt/${P}/lib/rustlib" "/usr/lib/rustlib-bin-${PV}"
              dosym "../../../opt/${P}/share/doc/rust" "/usr/share/doc/${P}"

              newenvd "${FILESDIR}"/50rust-bin.envd "50${P}"

              cp "${FILESDIR}"/provider-rust-bin "${T}/provider-${P}"

              if use clippy ; then
                echo /usr/bin/clippy-driver >> "${T}/provider-${P}"
                echo /usr/bin/cargo-clippy >> "${T}/provider-${P}"
              fi
              if use rustfmt; then
                echo /usr/bin/rustfmt >> "${T}/provider-${P}"
                echo /usr/bin/cargo-fmt >> "${T}/provider-${P}"
              fi

              insinto /etc/env.d/rust
              doins "${T}/provider-${P}"
              popd >/dev/null || die

              rm -f "${ED}/opt/${P}/lib/rustlib/"*/bin/rust-llvm-dwp || die
            }
            pkg_postinst() {
              eselect rust update || die
              elog "Rust installs a helper script for calling GDB now,"
              elog "for your convenience it is installed under /usr/bin/rust-gdb-bin-${PV}."
              if has_version app-editors/emacs; then
                elog "install app-emacs/rust-mode to get emacs support for rust."
              fi
              if has_version app-editors/gvim || has_version app-editors/vim; then
                elog "install app-vim/rust-vim to get vim support for rust."
              fi
            }
            pkg_postrm() {
              eselect rust cleanup || die
            }


deno:
  generator: builtin-github
  extensions_defs:
    rust:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: net-libs
    github:
      user: denoland
    extensions:
      - rust
    vars:
      restrict: 'network-sandbox'
      bdepend: |
        sys-devel/llvm
        sys-devel/clang
        sys-devel/lld
        dev-util/gn
        virtual/rust
      inherit:
        - cargo
      body: |
        post_src_unpack() {
          rm -rf "${S}" || true
          mv {{ .Values.github_user }}-{{ .Values.github_repo }}-* "${S}"
        }
        src_configure() {
          export MAKEOPTS="-j1"
          cargo_gen_config
        }
        src_compile() {
          export CARGO_BUILD_JOBS=1
          export CARGO_INCREMENTAL=0
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          export NINJAFLAGS="-j1"
        
          cargo build --release || die "cargo build failed"
        }
        src_install() {
          # Install the binary directly, cargo install doesn't work on workspaces
          dobin target/release/deno
        }

  packages:
    - deno:
