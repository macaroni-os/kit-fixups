golang:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    template: ../../templates/simple.tmpl

    dir:
      url: https://go.dev/dl
      matcher: "go1.*src.tar.gz$"
    transform:
      - kind: string
        match: go
        replace: ""
      - kind: string
        match: ".src.tar.gz"
        replace: ""
    vars:
      homepage: "https://golang.org"
      desc: "A concurrent garbage collected and typesafe programming language"
      extra_envs:
        - 'RESTRICT="strip"'
        # the *.syso files have writable/executable stacks
        - "QA_EXECSTACK='*.syso'"
        # Do not complain about CFLAGS, etc, since Go doesn't use them.
        - "QA_FLAGS_IGNORED='.*'"
        # The tools in /usr/lib/go should not cause the multilib-strict check to fail.
        - 'QA_MULTILIB_PATHS="usr/lib/go/pkg/tool/.*/.*"'
        # This package triggers "unrecognized elf file(s)" notices on riscv.
        # https://bugs.gentoo.org/794046
        - "QA_PREBUILT='.*'"
        - 'export CBUILD=${CBUILD:-${CHOST}}'
        - 'export CTARGET=${CTARGET:-${CHOST}}'
      inherit:
        - toolchain-funcs
      license: BSD
      iuse: amd64 arm64 armv6
      patches:
        - go-never-download-newer-toolchains.patch
      docs:
        - CONTRIBUTING.md
        - PATENTS
        - README.md
        - SECURITY.md
      s: '${WORKDIR}/go'
      body: |
        src_unpack() {
            for i in amd64 arm64 armv6 ; do
                if use $i ; then
                    if [ $i = "armv6" ] ; then
                        i=${i}l
                    fi
                    unpack go{{ .Values.version }}-bootstrap.linux-${i}.tar.gz || die
                    mv ${WORKDIR}/go ${WORKDIR}/go-bootstrap
                    break
                fi
            done
            unpack go{{ .Values.version }}.src.tar.gz || die
        }

        src_compile() {
          if has_version -b dev-lang/go; then
            export GOROOT_BOOTSTRAP="${BROOT}/usr/lib/go"
          else
            # Using bootstrap tarball.
            export GOROOT_BOOTSTRAP="${WORKDIR}/go-bootstrap"
          fi

          CARCH=${CHOST%%-*}

          case "$CARCH" in
            aarch64) export GOARCH="arm64" ;;
            armel)   export GOARCH="arm" GOARM=5 ;;
            armhf)   export GOARCH="arm" GOARM=6 ;;
            armv7*)   export GOARCH="arm" GOARM=7 ;;
            s390x)   export GOARCH="s390x" ;;
            x86)     export GOARCH="386" ;;
            x86_64)  export GOARCH="amd64" ;;
            ppc64)   export GOARCH="ppc64" ;;
            ppc64le) export GOARCH="ppc64le" ;;
            riscv64) export GOARCH="riscv64" ;;
            loongarch64) export GOARCH="loong64" ;;
            *)       export GOARCH="unsupported";;
          esac

          case "$CARCH" in
          x86_64|s390x|aarch64) export GO_LDFLAGS=-buildmode=pie ;;
          esac

          export GOROOT_FINAL="${EPREFIX}"/usr/lib/go
          export GOROOT="${PWD}"
          export GOBIN="${GOROOT}/bin"
          export GOCACHE="${T}/go-build"
          export CC=$(tc-getBUILD_CC)
          export GOOS="linux"
          export CC_FOR_TARGET=$(tc-getCC)
          export CXX_FOR_TARGET=$(tc-getCXX)
          use armv6 && export GOARM=6

          cd src
          bash -x ./make.bash || die "build failed"
        }

        src_install() {
          dodir /usr/lib/go
          cp -R api bin doc lib pkg misc src test "${ED}"/usr/lib/go
          einstalldocs

          if [ -f go.env ]; then
            insinto /usr/lib/go
            doins go.env
          fi

          # testdata directories are not needed on the installed system
          rm -fr $(find "${ED}"/usr/lib/go -iname testdata -type d -print)
          local bin_path=bin
          local f x
          for x in ${bin_path}/*; do
            f=${x##*/}
            dosym ../lib/go/${bin_path}/${f} /usr/bin/${f}
          done
        }


    assets:
      - name: "go{{ .Values.version }}.src.tar.gz"

      - name: "go{{ .Values.version }}-bootstrap.linux-amd64.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-amd64.tar.gz"
        use: amd64
      - name: "go{{ .Values.version }}-bootstrap.linux-arm64.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-arm64.tar.gz"
        use: arm64
      - name: "go{{ .Values.version }}-bootstrap.linux-armv6l.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-armv6l.tar.gz"
        use: armv6

  packages:
    # go1.22
    - go:
        selector:
          - '<1.23.0'
          - '>=1.22.0'

    # go1.23
    - go:
        selector:
          - '<1.24.0'
          - '>=1.23.0'
    # go1.24
    - go:
        selector:
          - '<1.25.0'
          - '>=1.24.0'
    # go1.25
    - go:
        selector:
          - '<1.26.0'
          - '>=1.25.0'
    # go1.26
    - go:
        selector:
          - '<1.27.0'
          - '>=1.26.0'
    # go1.27
    - go:
        selector:
          - '<1.28.0'
          - '>=1.27.0'

nodejs:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: net-libs
    github:
      query: tags
      user: nodejs
      repo: node
      num_pages: 5
    vars:
      desc: Node.js JavaScript runtime
      license: Apache-1.1 Apache-2.0 BSD BSD-2 MIT
      inherit:
        - python-any-r1
      python_compat: python3+
      bdepend: |
        ${PYTHON_DEPS}
      body: |
        src_configure() {
          configure_options=(
            # By default, prefix is /usr/local, which is outside of PATH,
            # set it to /usr instead:
            --prefix="${EPREFIX}"/usr
          )
          # NOTE: `econf` default flags appear to trip up the configure process,
          #       directly call the ./configure script instead.
          ./configure "${configure_options[@]}"
        }


  packages:

    # Release 26
    - nodejs:
        selector:
          - '<27.0.0'
          - '>=26.0.0'

    # Release 24
    - nodejs:
        selector:
          - '<25.0.0'
          - '>=24.0.0'

    # Release 22
    - nodejs:
        selector:
          - '<23.0.0'
          - '>=22.0.0'

    # Release 20
    - nodejs:
        selector:
          - '<21.0.0'
          - '>=20.0.0'


zig:
  generator: builtin-json
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    vars:
      homepage: https://ziglang.org/
      desc: General-purpose programming language for robust, optimal, and reusable software
      license: MIT
      baseurl: https://ziglang.org/download

    json:
      url: '{{ .Values.baseurl }}/index.json'
      version_filter: '$'

  packages:
    - zig:
        json:
          src_uri_filter: "$['{{ .Values.version }}'].src.tarball"
        vars:
          inherit:
            - cmake
          extra_envs:
            - 'BUILD_DIR="${S}/build"'
            - CMAKE_BUILD_TYPE=Release
          iuse: +clang
          llvm_targets:
            - AArch64
            - AMDGPU
            - ARM
            - AVR
            - BPF
            - Hexagon
            - Lanai
            - Mips
            - MSP430
            - NVPTX
            - PowerPC
            - RISCV
            - SystemZ
            - Sparc
            - SPIRV
            - VE
            - WebAssembly
            - X86
            - XCore
            - LoongArch
          # We need to force the valid targets else zig wants all standards targets.
          #sed -e "s|set(ZIG_LLVM_REQUIRED_TARGETS .*|set(ZIG_LLVM_REQUIRED_TARGETS \"${LLVM_TARGETS// /;}\")|g" -i \
          #  cmake/Findllvm.cmake
          body: |
            src_configure() {
              local llvm_version=$(clang --version  | grep version  | cut -d' ' -f 4 | cut -d'.' -f1)
              if use clang; then
                local -x CC=${CHOST}-clang
                local -x CXX=${CHOST}-clang++
              fi
              einfo "Using LLVM Targets: ${LLVM_TARGETS// /;}"
              local mycmakeargs=(
                -DZIG_SHARED_LLVM=ON
                -DCMAKE_INSTALL_PREFIX=/usr
                -DCMAKE_PREFIX_PATH=/usr
                -DCMAKE_VERBOSE_MAKEFILE=ON
                -DZIG_VERSION="${PV}"
                -DCLANG_INCLUDE_DIRS=/usr/lib/llvm/${llvm_version}/include
              )
              cmake_src_configure
            }

    - zig:
        category: virtual
        template: ../../templates/simple.tmpl
        ignore_artefacts: true
        selector:
          # v0.16.0 requires LLVM 21.x
          - '<0.16.0'
        vars:
          desc: Virtual for Zig language compiler
          rdepend: |
            || ( ~dev-lang/zig-bin-{{ .Values.version }} ~dev-lang/zig-{{ .Values.version }} )

    - zig-bin:
        template: ../../templates/simple.tmpl
        assets:
          - name: "{{ .Values.pn }}-x86_64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-x86_64-linux-{{ .Values.version }}.tar.xz'
            use: amd64
          - name: "{{ .Values.pn }}-arm-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-arm-linux-{{ .Values.version }}.tar.xz'
            use: arm
          - name: "{{ .Values.pn }}-aarch64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-aarch64-linux-{{ .Values.version }}.tar.xz'
            use: arm64
          - name: "{{ .Values.pn }}-riscv64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-riscv64-linux-{{ .Values.version }}.tar.xz'
            use: riscv64

        vars:
          iuse: doc amd64 arm arm64 riscv64
          depend: app-arch/tar
          desc: General-purpose programming language for robust, optimal, and reusable software (upstream build)
          rdepend: |
            !dev-lang/zig
          body: |
            src_unpack() {
              default
              mv "${WORKDIR}/"* "${S}"
            }
            src_install() {
              use doc || rm -rf "${S}"/doc
              dodir /opt
              mv "${S}" "${ED}"/opt/ || die
              dodir /usr/bin
              dosym "${ED}"/opt/${P}/zig /usr/bin/zig
              fperms 0755 /usr/bin/zig
            }


swig:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    template: ../../templates/simple.tmpl

    dir:
      url: https://sourceforge.net/projects/swig/files/swig/
      matcher: "swig-4"
      exclude: "beta|timeline"
    transform:
      - kind: string
        match: swig-
        replace: ""
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.pv }}.tar.gz"
        url: "https://download.sourceforge.net/{{ .Values.pn }}/{{ .Values.pn }}-{{ .Values.pv }}.tar.gz"
    vars:
      desc: Simplified Wrapper and Interface Generator
      license: GPL-3+ BSD BSD-2
      homepage: http://www.swig.org/
      iuse: ccache pcre
      rdepend: |
        pcre? ( dev-libs/libpcre )
        ccache? ( sys-libs/zlib )
      depend: '${RDEPEND}'
      docs:
        - ANNOUNCE
        - CHANGES
        - CHANGES.current
        - README
        - TODO
      body: |
        src_configure() {
          econf \
            $(use_enable ccache) \
            $(use_with pcre)
        }

  packages:
    - swig:

typescript:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-node
    github:
      query: releases
      user: microsoft
      repo: TypeScript
    vars:
      inherit:
        - npmv1
      rdepend: '${DEPEND}'
      extra_envs:
        - 'NPM_NO_DEPS=1'
      s: '${WORKDIR}/package'
    transform:
      - kind: string
        match: 'TypeScript '
        replace: ''
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tgz'

  packages:
    - typescript:


virtual_rust:
  # See https://static.rust-lang.org/dist/channel-rust-stable.toml for
  # components.
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: virtual
    ignore_artefacts: true
    github:
      repo: rust
      user: rust-lang
    transform:
      - kind: string
        match: 'Rust '
        replace: ''
    vars:
      license: '|| ( MIT Apache-2.0 ) BSD-1 BSD-2 BSD-4 UoI-NCSA'
      desc: Virtual for Rust language compiler
      rdepend: |
        || (
          ~dev-lang/rust-bin-{{ .Values.version }}
          ~dev-lang/rust-{{ .Values.version }}
        )
      depend: '${RDEPEND}'

  packages:

    # Rust 1.94.x
    - rust:
        selector:
          - '<1.95.0'
          - '>=1.94.0'
        vars:

    # Rust 1.96.x
    - rust:
        selector:
          - '<1.97.0'
          - '>=1.96.0'

    # Rust 1.98.x
    - rust:
        selector:
          - '<1.99.0'
          - '>=1.98.0'

rust:
  # See https://static.rust-lang.org/dist/channel-rust-stable.toml for
  # components.
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-lang
    github:
      repo: rust
      user: rust-lang
    transform:
      - kind: string
        match: 'Rust '
        replace: ''
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}-x86_64-unknown-linux-gnu.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-x86_64-unknown-linux-gnu.tar.xz'
        use: amd64
      - name: '{{ .Values.pn }}-{{ .Values.version }}-arm-unknown-linux-gnueabi.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-arm-unknown-linux-gnueabi.tar.xz'
        use: arm
      - name: '{{ .Values.pn }}-{{ .Values.version }}-arm-unknown-linux-gnueabihf.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-arm-unknown-linux-gnueabihf.tar.xz'
        use: arm
      - name: '{{ .Values.pn }}-{{ .Values.version }}-armv7-unknown-linux-gnueabihf.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-armv7-unknown-linux-gnueabihf.tar.xz'
        use: arm
      - name: '{{ .Values.pn }}-{{ .Values.version }}-aarch64-unknown-linux-gnu.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-aarch64-unknown-linux-gnu.tar.xz'
        use: arm64
      - name: '{{ .Values.pn }}-{{ .Values.version }}-riscv64gc-unknown-linux-gnu.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-{{ .Values.version }}-riscv64gc-unknown-linux-gnu.tar.xz'
        use: riscv64
      - name: '{{ .Values.pn }}-{{ .Values.version }}-wasm32-unknown-unknown.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-std-{{ .Values.version }}-wasm32-unknown-unknown.tar.xz'
        use: wasm
      - name: '{{ .Values.pn }}-{{ .Values.version }}-wasm32-wasip1.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-std-{{ .Values.version }}-wasm32-wasip1.tar.xz'
        use: wasm-wasip1
      - name: '{{ .Values.pn }}-{{ .Values.version }}-wasm32-wasip1-threads.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-std-{{ .Values.version }}-wasm32-wasip1-threads.tar.xz'
        use: wasm-wasip1-threads
      - name: '{{ .Values.pn }}-{{ .Values.version }}-wasm32-wasip2.tar.xz'
        url: 'https://static.rust-lang.org/dist/rust-std-{{ .Values.version }}-wasm32-wasip2.tar.xz'
        use: wasm-wasip2


    vars:
      license: '|| ( MIT Apache-2.0 ) BSD-1 BSD-2 BSD-4 UoI-NCSA'
      components:
        - use: rust-src
          name: rust-src

        - use: wasm
          name: rust-std
          chost: wasm32-unknown-unknown

        - use: wasm-wasip1
          name: rust-std
          chost: wasm32-wasip1

        - use: wasm-wasip1-threads
          name: rust-std
          chost: wasm32-wasip1-threads

        - use: wasm-wasip2
          name: rust-std
          chost: wasm32-wasip2
      slot: 'stable'
      inherit:
        - bash-completion-r1
        - toolchain-funcs
      iuse: |
        clippy doc rustfmt rust-analyzer
        amd64 arm arm64 riscv64
        {{- range $c := .Values.components }}
        {{ $c.use }}
        {{- end }}
      restrict: strip
      rdepend: |
        app-eselect/eselect-rust
      depend: '${RDEPEND}'
      extra_envs:
        - 'QA_EXECSTACK="opt/${P}/lib/rustlib/*/lib*.rlib:lib.rmeta"'
        - |
          QA_PREBUILT="
          opt/${P}/bin/.*
          opt/${P}/lib/.*.so
          opt/${P}/libexec/.*
          opt/${P}/lib/rustlib/.*/bin/.*
          opt/${P}/lib/rustlib/.*/lib/.*
          "
      body: |
        rust_abi() {
          local CTARGET=${1:-${CHOST}}
          case ${CTARGET%%*-} in
            x86_64*) echo x86_64-unknown-linux-gnu;;
            armv6j*s*) echo arm-unknown-linux-gnueabi;;
            armv6j*h*) echo arm-unknown-linux-gnueabihf;;
            armv7a*h*) echo armv7-unknown-linux-gnueabihf;;
            aarch64*) echo aarch64-unknown-linux-gnu;;
            riscv64*) echo riscv64gc-unknown-linux-gnu;;
          esac
        }
        src_unpack() {
          default
          mv "${WORKDIR}/rust-{{ .Values.version }}-$(rust_abi)" "${S}" || die
          {{- range $c := .Values.components }}
          if use {{ $c.use }} ; then
            {{- if eq $c.use "rust-src" }}
            mv "${WORKDIR}/{{ $c.name }}-{{ $.Values.version }}/{{ $c.name }}" "${S}"/rust-src
            {{- else }}
            mv "${WORKDIR}/{{ $c.name }}-{{ $.Values.version }}-{{ $c.chost }}/{{ $c.name }}-{{ $c.chost }}" "${S}"/{{ $c.name }}-{{ $c.chost }}
            {{- end }}
          fi
          {{- end }}
        }
        src_prepare() {
          default
          {{- range $c := .Values.components }}
          if use {{ $c.use }} ; then
            {{- if eq $c.use "rust-src" }}
            echo "{{ $c.name }}" >> components
            {{- else }}
            echo "{{ $c.name }}-{{ $c.chost }}" >> components
            {{- end }}
          fi
          {{- end }}
        }
        src_install() {
          pushd "${S}" >/dev/null || die
          local std="$(grep -m 1 'std' ./components)"
          local components=( "rustc" "cargo" "${std}" )
          use doc && components+=( "rust-docs" )
          use clippy && components+=( "clippy-preview" )
          use rustfmt && components+=( "rustfmt-preview" )
          use rust-src && components="${components},rust-src"
          {{- range $c := .Values.components }}
          if use {{ $c.use }} ; then
            {{- if eq $c.use "rust-src" }}
            components+=( "rust-src" )
            {{- else }}
            components+=( "{{ $c.name }}-{{ $c.chost }}" )
            {{- end }}
          fi
          {{- end }}

          if use rust-analyzer; then
            local analysis="$(grep 'analysis' ./components || die "analysis not found in components")"
            components+=( "rust-analyzer-preview" "${analysis}" )
          fi
          ./install.sh \
            --components="$(IFS=,; echo "${components[*]}")" \
            --disable-verify \
            --prefix="${ED}/opt/${P}" \
            --mandir="${ED}/opt/${P}/man" \
            --disable-ldconfig \
            || die

          local symlinks=(
            cargo
            rustc
            rustdoc
            rust-gdb
            rust-gdbgui
            rust-lldb
          )

          use clippy && symlinks+=( clippy-driver cargo-clippy )
          use rustfmt && symlinks+=( rustfmt cargo-fmt )

          einfo "installing eselect-rust symlinks and paths"
          local i
          for i in "${symlinks[@]}"; do
            # we need realpath on /usr/bin/* symlink return version-appended binary path.
            # so /usr/bin/rustc should point to /opt/rust-bin-<ver>/bin/rustc-<ver>
            local ver_i="${i}-bin-${PV}"
            ln -v "${ED}/opt/${P}/bin/${i}" "${ED}/opt/${P}/bin/${ver_i}" || die
            dosym "../../opt/${P}/bin/${ver_i}" "/usr/bin/${ver_i}"
          done
          # symlinks to switch components to active rust in eselect
          dosym "../../../opt/${P}/lib" "/usr/lib/rust/lib-bin-${PV}"
          dosym "../../../opt/${P}/man" "/usr/lib/rust/man-bin-${PV}"
          dosym "../../opt/${P}/lib/rustlib" "/usr/lib/rustlib-bin-${PV}"
          dosym "../../../opt/${P}/share/doc/rust" "/usr/share/doc/${P}"

          newenvd "${FILESDIR}"/50rust-bin.envd "50${P}"

          cp "${FILESDIR}"/provider-rust-bin "${T}/provider-${P}"

          if use clippy ; then
            echo /usr/bin/clippy-driver >> "${T}/provider-${P}"
            echo /usr/bin/cargo-clippy >> "${T}/provider-${P}"
          fi
          if use rustfmt; then
            echo /usr/bin/rustfmt >> "${T}/provider-${P}"
            echo /usr/bin/cargo-fmt >> "${T}/provider-${P}"
          fi

          insinto /etc/env.d/rust
          doins "${T}/provider-${P}"
          popd >/dev/null || die

          rm -f "${ED}/opt/${P}/lib/rustlib/"*/bin/rust-llvm-dwp || die
        }
        pkg_postinst() {
          eselect rust update || die
          elog "Rust installs a helper script for calling GDB now,"
          elog "for your convenience it is installed under /usr/bin/rust-gdb-bin-${PV}."
          if has_version app-editors/emacs; then
            elog "install app-emacs/rust-mode to get emacs support for rust."
          fi
          if has_version app-editors/gvim || has_version app-editors/vim; then
            elog "install app-vim/rust-vim to get vim support for rust."
          fi
        }
        pkg_postrm() {
          eselect rust cleanup || die
        }


  packages:


    # Rust 1.94.x
    - rust-bin:
        selector:
          - '<1.95.0'
          - '>=1.94.0'


    # Rust 1.96.x
    - rust-bin:
        selector:
          - '<1.97.0'
          - '>=1.96.0'

    # Rust 1.98.x
    - rust-bin:
        selector:
          - '<1.99.0'
          - '>=1.98.0'


deno:
  generator: builtin-github
  extensions_defs:
    rust:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: net-libs
    github:
      user: denoland
    extensions:
      - rust
    vars:
      restrict: 'network-sandbox'
      bdepend: |
        sys-devel/llvm
        sys-devel/clang
        sys-devel/lld
        dev-util/gn
        virtual/rust
      inherit:
        - cargo
      body: |
        post_src_unpack() {
          rm -rf "${S}" || true
          mv {{ .Values.github_user }}-{{ .Values.github_repo }}-* "${S}"
        }
        src_configure() {
          export MAKEOPTS="-j1"
          cargo_gen_config
        }
        src_compile() {
          export CARGO_BUILD_JOBS=1
          export CARGO_INCREMENTAL=0
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          export NINJAFLAGS="-j1"
          cargo build --release || die "cargo build failed"
        }
        src_install() {
          # Install the binary directly, cargo install doesn't work on workspaces
          dobin target/release/deno
        }

  packages:
    - deno:

erlang:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-lang
    github:
      user: erlang
      repo: otp
      exclude:
        - 'rc'
    transform:
      - kind: string
        match: 'OTP '
        replace: ''

    assets:
      - name: '{{ .Values.pn }}-{{ .Values.pv }}.tar.gz'
        matcher: 'otp_src_.*.tar.gz$'
      - name: '{{ .Values.pn }}-{{ .Values.version }}-doc-man.tar.gz'
        matcher: 'otp_doc_man_.*.tar.gz$'

    vars:
      s: '${WORKDIR}/otp_src_{{ .Values.version }}'
      license: 'Apache-2.0'
      iuse: java +kpoll odbc sctp ssl systemd tk wxwidgets
      wxgtk_slot: "3.2-gtk3"
      cdepend: |
        sys-libs/ncurses:0
        sys-libs/zlib
        java? (
          virtual/jdk:*
        )
        odbc? (
          dev-db/unixODBC
        )
        sctp? (
          net-misc/lksctp-tools
        )
        ssl? (
          dev-libs/openssl:=
        )
        wxwidgets? (
          dev-libs/glib
          x11-libs/wxGTK:{{ .Values.wxgtk_slot }}[X,opengl]
        )
        systemd? (
          sys-apps/systemd
        )
      rdepend: '${CDEPEND}'
      depend: |
        ${CDEPEND}
        dev-lang/perl
      inherit:
        - autotools
        - flag-o-matic
        - java-pkg-opt-2
        - systemd
        - user
        - toolchain-funcs
        - wxwidgets
      body: |
        src_prepare() {
          default
          tc-export AR CPP CXX LD
          append-flags -fno-strict-aliasing

          ./otp_build autoconf || die
        }
        src_configure() {
          use wxwidgets && setup-wxwidgets

          local myconf=(
            --disable-builtin-zlib
            --with-ssl-zlib=no

            $(use_enable kpoll kernel-poll)
            $(use_with java javac)
            $(use_with odbc)
            $(use_enable sctp)
            $(use_with ssl ssl "/usr")
            $(use_enable ssl dynamic-ssl-lib)
            $(usex wxwidgets "--with-wx-config=${WX_CONFIG}" "--with-wxdir=/dev/null")
          )
          econf "${myconf[@]}"
        }
        src_compile() {
          emake
        }
        extract_version() {
          local path="$1"
          local var_name="$2"
          sed -n -e "/^${var_name} = \(.*\)$/s::\1:p" "${S}/${path}/vsn.mk" || die "extract_version() failed"
        }
        src_install() {
          local erl_libdir_rel="$(get_libdir)/erlang"
          local erl_libdir="/usr/${erl_libdir_rel}"
          local erl_interface_ver="$(extract_version lib/erl_interface EI_VSN)"
          local erl_erts_ver="$(extract_version erts VSN)"
          local my_manpath="/usr/share/${PN}/man"

          [[ -z "${erl_erts_ver}" ]] && die "Couldn't determine erts version"
          [[ -z "${erl_interface_ver}" ]] && die "Couldn't determine interface version"

          emake INSTALL_PREFIX="${D}" install

          local DOCS=("README.md")
          einstalldocs

          dosym "../${erl_libdir_rel}/bin/erl" /usr/bin/erl
          dosym "../${erl_libdir_rel}/bin/erlc" /usr/bin/erlc
          dosym "../${erl_libdir_rel}/bin/escript" /usr/bin/escript
          dosym "../${erl_libdir_rel}/lib/erl_interface-${erl_interface_ver}/bin/erl_call" /usr/bin/erl_call
          dosym "../${erl_libdir_rel}/erts-${erl_erts_ver}/bin/beam.smp" /usr/bin/beam.smp

          ## Clean up the no longer needed files
          rm "${ED}/${erl_libdir}/Install" || die

          insinto "${my_manpath}"
          doins -r "${WORKDIR}"/man/*
          newenvd "${FILESDIR}/90erlang.envd" "90erlang"

          if use systemd ; then
            systemd_newunit "${FILESDIR}"/epmd.service-r1 epmd.service
          else
            newinitd "${FILESDIR}"/epmd.init-r2 epmd
          fi
          newconfd "${FILESDIR}"/epmd.confd-r2 epmd
        }
        pkg_preinst() {
          enewgroup epmd 335
          enewuser epmd 335 -1 /dev/null epmd
        }

  packages:
    - erlang:
        selector:
          - '<29'

julia_bin:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-lang
    github:
      user: JuliaLang
      repo: julia
      num_pages: 4
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}-x86_64.tar.gz'
        use: amd64
        url: '{{- $mpv := join "." ( slice ( splitList "." .Values.pv ) 0 2 ) }}{{ .Values.base_srcuri }}/linux/x64/{{ $mpv }}/julia-{{ .Values.pv }}-linux-x86_64.tar.gz'

      - name: '{{ .Values.pn }}-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}-arm64.tar.gz'
        use: arm64
        url: '{{- $mpv := join "." ( slice ( splitList "." .Values.pv ) 0 2 ) }}{{ .Values.base_srcuri }}/linux/aarch64/{{ $mpv }}/julia-{{ .Values.pv }}-linux-aarch64.tar.gz'

    vars:
      s: '${WORKDIR}/{{ .Values.pn | replace "-bin" "" }}-{{ .Values.pv }}'
      base_srcuri: 'https://julialang-s3.julialang.org/bin'
      iuse: amd64 arm64
      restrict: strip
      extra_envs:
        - 'QA_PREBUILT="*"'
      body: |
        {{- $pn_original := .Values.pn | replace "-bin" "" }}
        {{- $p_original := printf "%s-%s" $pn_original .Values.pv }}
        {{- $v := .Values.pv }}
        src_install() {
          insinto "/usr/$(get_libdir)/{{ $p_original }}/"
          exeinto "/usr/$(get_libdir)/{{ $p_original }}/bin"

          doins -r ./etc
          doins -r ./include
          doins -r ./lib
          doins -r ./share

          doexe bin/julia
          dosym "../$(get_libdir)/{{ $p_original }}/bin/{{ $pn_original }}" \
            "/usr/bin/{{ $pn_original }}{{ join "." ( slice ( splitList "." $v ) 0 2 ) }}"

          {
            echo "PATH=\"/usr/$(get_libdir)/{{ $p_original }}/bin\""
          } > "${T}"/99{{ $pn_original }}
          doenvd "${T}"/99{{ $pn_original }}
        }


  packages:

    # release v12
    - julia-bin:
        selector:
          - '<1.13'
          - '>1.12.0'

    # release v10
    - julia-bin:
        selector:
          - '<1.11'
          - '>=1.10.0'

yasm:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    template: ../../templates/simple.tmpl

    dir:
      url: https://www.tortall.net/projects/yasm/releases/
      matcher: "yasm-1.*.tar.gz$"
    transform:
      - kind: string
        match: "yasm-"
        replace: ""
      - kind: string
        match: ".tar.gz"
        replace: ""
    vars:
      homepage: https://yasm.tortall.net/
      desc: "A modifiable assembler for the x86 instruction set"
      license: "BSD-2 BSD || ( Artistic GPL-2 LGPL-2 )"
      inherit:
        - toolchain-funcs
        - flag-o-matic
      iuse: nls
      bdepend: |
        nls? ( sys-devel/gettext )
      depend: |
        nls? ( virtual/libintl )
      rdepend: "${DEPEND}"
      body: |
        src_prepare() {
            default
            # C23 (default since gcc-15) makes 'true'/'false' reserved keywords,
            # while libyasm/bitvect.h still uses them as enumeration constants.
            # Pin the C standard until upstream (inactive since 1.3.0/2014) or a
            # FreeBSD-yasm-style rename patch lands. macaroni-os/mark-issues#830
            append-flags -std=gnu17
        }

        src_configure() {
            local myconf=(
                CC_FOR_BUILD="$(tc-getBUILD_CC)"
                CCLD_FOR_BUILD="$(tc-getBUILD_CC)"
                --disable-warnerror
                --disable-python
                --disable-python-bindings
                $(use_enable nls)
            )

            econf "${myconf[@]}"
        }

        src_test() {
            # https://bugs.gentoo.org/718870
            emake -j1 check
        }

  packages:
    - yasm:
        revision: 2

# Bun JavaScript runtime, shipped as the prebuilt ELF from the upstream
# GitHub release assets (glibc builds only). Same packaging scheme as
# dev-util/pnpm-bin (macaroni-os/kit-fixups#475). macaroni-os/mark-issues#841
bun_bin:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-lang
    github:
      user: oven-sh
      repo: bun
    # Release title is "Bun v1.4.4" (tag bun-v1.4.4); strip the prefix
    # from either form so PV is clean.
    transform:
      - kind: regex
        match: '(?i)^bun[- ]?v'
        replace: ''
    # glibc linux assets only; skip the -musl / -android / -profile
    # (and non-linux) variants, same as #475 skipped musl.
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}-amd64-linux.zip'
        matcher: '^bun-linux-x64\.zip$'
        use: amd64
      - name: '{{ .Values.pn }}-{{ .Values.version }}-arm64-linux.zip'
        matcher: '^bun-linux-aarch64\.zip$'
        use: arm64
    vars:
      homepage: https://bun.sh
      desc: Incredibly fast JavaScript runtime, bundler, test runner and package manager (upstream binary)
      license: MIT
      iuse: amd64 arm64
      restrict: strip
      # Assets are .zip archives; mark-devkit does not auto-add unpack
      # dependencies for zip SRC_URIs, so declare unzip explicitly.
      bdepend: |
        app-arch/unzip
      extra_envs:
        - 'QA_PREBUILT="*"'
      body: |
        post_src_unpack() {
          # The glibc zip unpacks into a single bun-linux-<arch>/ dir that
          # holds just the ELF binary. Point S at it when the unpacker
          # single-directory heuristic did not do it for us.
          if [ ! -d "${S}" ] ; then
            mv "${WORKDIR}"/bun-linux-* "${S}" || die
          fi
        }
        src_configure() { :; }
        src_compile() { :; }
        src_install() {
          newbin "${S}"/bun bun
        }
  packages:
    - bun-bin:


php:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: dev-lang

    github:
      user: php
      repo: php-src
      query: tags
      # php-src publishes stable tags as php-X.Y.Z (plus RC/beta/
      # alpha and unrelated housekeeping tags); a few pages cover the
      # full span of the maintained slots.
      num_pages: 12

    # Pre-release exclusion for every slot track. Kept at atom level
    # only: mark-devkit 0.35.4 parses exclude: on the AutogenAtom
    # (pkg/specs AutogenAtom.Excludes), not under github:
    # (review #4372632414).
    exclude:
      - '(?i)rc|beta|alpha'

    transform:
      # Only a leading "v" is stripped automatically; php tags
      # carry a "php-" prefix.
      - kind: regex
        match: '^php-'
        replace: ''

    vars:
      desc: "The PHP language runtime engine"
      homepage: https://www.php.net/
      license: |-
        PHP-3.01
          BSD
          Zend-2.0
          bcmath? ( LGPL-2.1+ )
          fpm? ( BSD-2 )
          gd? ( gd )
          unicode? ( BSD-2 LGPL-2.1 )
      iuse: embed +cli cgi fpm apache2 phpdbg threads acl apparmor argon2 bcmath berkdb bzip2 calendar cdb cjk coverage +ctype curl debug enchant exif ffi +fileinfo +filter firebird +flatfile ftp gd gdbm gmp +iconv imap inifile intl iodbc ipv6 kerberos ldap ldap-sasl libedit lmdb mhash mssql mysql mysqli nls oci8-instant-client odbc +opcache pcntl pdo +phar +posix postgres qdbm readline selinux +session sharedmem +simplexml snmp soap sockets sodium spell sqlite ssl sysvipc tidy +tokenizer truetype unicode webp +xml xmlreader xmlwriter xpm xslt zip zlib -zts
      required_use: |-
        || ( cli cgi fpm apache2 embed phpdbg )
        cli? ( ^^ ( readline libedit ) )
        !cli? ( ?? ( readline libedit ) )
        truetype? ( gd zlib )
        webp? ( gd zlib )
        cjk? ( gd zlib )
        exif? ( gd zlib )
        xpm? ( gd zlib )
        gd? ( zlib )
        simplexml? ( xml )
        soap? ( xml )
        xmlreader? ( xml )
        xmlwriter? ( xml )
        xslt? ( xml )
        ldap-sasl? ( ldap )
        qdbm? ( !gdbm )
        mysql? ( || ( mysqli pdo ) )
        firebird? ( pdo )
        mssql? ( pdo )
      inherit:
        - flag-o-matic
        - autotools
      # WANT_AUTOMAKE + the SAPI list as plain render-time variables.
      # The major version is inlined directly at each usage site in the
      # body: template below via {{ $php_mv }} (review #4372641010),
      # so no PHP_MV variable is emitted into the ebuilds at all.
      extra_envs:
        - 'WANT_AUTOMAKE="none"'
        - 'SAPIS="embed cli cgi fpm apache2 phpdbg"'
      # config.m4 fixes reach the ebuild through the eclass PATCHES array
      # (patches: renders PATCHES=( ... )); the two files only apply to the
      # 8.2/8.3 line sources, so the list is set per track below
      # (core-kit/toolchain.yml "per-version patches" pattern).
      patches: []
      # the oci8/pdo_oci extensions compile against the SDK headers;
      # -basic only carries the runtime libraries (macaroni-os/mark-issues#844)
      bdepend: |-
        virtual/pkgconfig
        oci8-instant-client? ( dev-db/oracle-instantclient-sdk )
      # Commons dependencies via the spec CDEPEND key (renders
      # CDEPEND="..." and is pulled in by RDEPEND/DEPEND below).
      cdepend: |-
        >=app-eselect/eselect-php-0.9.1[apache2?,fpm?]
        >=dev-libs/libpcre2-10.30[unicode]
        fpm? ( acl? ( sys-apps/acl ) )
        apache2? ( www-servers/apache[apache2_modules_unixd(+),threads=] )
        argon2? ( app-crypt/argon2:= )
        apparmor? ( sys-libs/libapparmor )
        berkdb? ( sys-libs/db:5.3 )
        bzip2? ( app-arch/bzip2:0= )
        cdb? ( || ( dev-db/cdb dev-db/tinycdb ) )
        coverage? ( dev-util/lcov )
        curl? ( >=net-misc/curl-7.10.5 )
        enchant? ( app-text/enchant:2= )
        ffi? ( >=dev-libs/libffi-3.0.11 )
        firebird? ( dev-db/firebird )
        gd? ( >=virtual/jpeg-0-r3:0 media-libs/libpng:0= )
        gdbm? ( >=sys-libs/gdbm-1.8.0:0= )
        gmp? ( dev-libs/gmp:0= )
        iconv? ( virtual/libiconv )
        imap? ( net-libs/c-client[kerberos=,ssl=] )
        intl? ( dev-libs/icu:= )
        kerberos? ( virtual/krb5 )
        ldap? ( >=net-nds/openldap-1.2.11 )
        ldap-sasl? ( dev-libs/cyrus-sasl )
        libedit? ( dev-libs/libedit )
        lmdb? ( dev-db/lmdb:= )
        mssql? ( dev-db/freetds[mssql] )
        nls? ( sys-devel/gettext )
        oci8-instant-client? ( dev-db/oracle-instantclient-basic )
        odbc? ( iodbc? ( dev-db/libiodbc ) !iodbc? ( >=dev-db/unixODBC-1.8.13 ) )
        postgres? ( dev-db/postgresql:* )
        qdbm? ( dev-db/qdbm )
        readline? ( sys-libs/readline:0= )
        snmp? ( >=net-analyzer/net-snmp-5.2 )
        sodium? ( dev-libs/libsodium:= )
        spell? ( >=app-text/aspell-0.50 )
        sqlite? ( >=dev-db/sqlite-3.7.6.3 )
        ssl? ( dev-libs/openssl:= )
        tidy? ( || ( app-text/tidy-html5 app-text/htmltidy ) )
        truetype? ( =media-libs/freetype-2* )
        unicode? ( dev-libs/oniguruma:= )
        webp? ( media-libs/libwebp:0= )
        xml? ( >=dev-libs/libxml2-2.7.6 )
        xpm? ( x11-libs/libXpm )
        xslt? ( dev-libs/libxslt )
        zip? ( >=dev-libs/libzip-1.2.0:= )
        zlib? ( >=sys-libs/zlib-1.2.0.4:0= )
      rdepend: |-
        ${CDEPEND}
        virtual/mta
        fpm? (
          selinux? ( sec-policy/selinux-phpfpm )
        )
      depend: |-
        ${CDEPEND}
        app-arch/xz-utils
        >=sys-devel/bison-3.0.1
      # body: phases/helper functions of the tree ebuild; the shared
      # template normalizes the 2-space indentation to tabs at render
      # time (same mechanism as the qemu/glslang specs).
      body: |-
        {{ $php_mv := first ( splitList "." .Values.pv ) }}

        php_install_ini() {
          local phpsapi="${1}"

          # work out where we are installing the ini file
          php_set_ini_dir "${phpsapi}"

          # Always install the production INI file, bug 611214.
          local phpinisrc="php.ini-production-${phpsapi}"
          cp php.ini-production "${phpinisrc}" || die

          # default to /tmp for save_path, bug #282768
          sed -e 's|^;session.save_path .*$|session.save_path = "'"${EPREFIX}"'/tmp"|g' -i "${phpinisrc}" || die

          # Set the extension dir
          sed -e "s|^extension_dir .*$|extension_dir = ${extension_dir}|g" \
            -i "${phpinisrc}" || die

          # Set the include path to point to where we want to find PEAR packages
          sed -e 's|^;include_path = ".:/php/includes".*|include_path = ".:'"${EPREFIX}"'/usr/share/php'{{ $php_mv }}':'"${EPREFIX}"'/usr/share/php"|' -i "${phpinisrc}" || die

          insinto "${PHP_INI_DIR#${EPREFIX}}"
          newins "${phpinisrc}" php.ini

          elog "Installing php.ini for ${phpsapi} into ${PHP_INI_DIR#${EPREFIX}}"
          elog

          dodir "${PHP_EXT_INI_DIR#${EPREFIX}}"
          dodir "${PHP_EXT_INI_DIR_ACTIVE#${EPREFIX}}"

          if use opcache; then
            elog "Adding opcache to $PHP_EXT_INI_DIR"
            echo "zend_extension=${PHP_DESTDIR}/$(get_libdir)/opcache.so" >> \
                "${D}/${PHP_EXT_INI_DIR}"/opcache.ini
            dosym "../ext/opcache.ini" \
                "${PHP_EXT_INI_DIR_ACTIVE#${EPREFIX}}/opcache.ini"
          fi

          # SAPI-specific handling
          if [[ "${sapi}" == "fpm" ]] ; then
            einfo "Installing FPM config files php-fpm.conf and www.conf"
            insinto "${PHP_INI_DIR#${EPREFIX}}"
            doins sapi/fpm/php-fpm.conf
            insinto "${PHP_INI_DIR#${EPREFIX}}/fpm.d"
            doins sapi/fpm/www.conf
          fi

          dodoc php.ini-{development,production}
        }

        php_set_ini_dir() {
          PHP_INI_DIR="${EPREFIX}/etc/php/${1}-php${SLOT}"
          PHP_EXT_INI_DIR="${PHP_INI_DIR}/ext"
          PHP_EXT_INI_DIR_ACTIVE="${PHP_INI_DIR}/ext-active"
        }

        src_prepare() {
          # default applies the PATCHES array (the config.m4 fixes the
          # spec passes via the patches: key, set per slot track) and
          # any user patches.
          default

          # In php-7.x, the FPM pool configuration files have been split off
          # of the main config. By default the pool config files go in
          # e.g. /etc/php-fpm.d, which isn't slotted. So here we move the
          # include directory to a subdirectory "fpm.d" of $PHP_INI_DIR. Later
          # we'll install the pool configuration file "www.conf" there.
          php_set_ini_dir fpm
          sed -i "s~^include=.*$~include=${PHP_INI_DIR}/fpm.d/*.conf~" \
            sapi/fpm/php-fpm.conf.in \
            || die 'failed to move the include directory in php-fpm.conf'

          # Emulate buildconf to support cross-compilation
          # rm -fr aclocal.m4 autom4te.cache config.cache \
          #   configure main/php_config.h.in || die
          eautoconf --force
          eautoheader
        }

        src_configure() {
          addpredict /usr/share/snmp/mibs/.index #nowarn
          addpredict /var/lib/net-snmp/mib_indexes #nowarn

          PHP_DESTDIR="${EPREFIX}/usr/$(get_libdir)/php${SLOT}"

          # The php-fpm config file wants localstatedir to be ${EPREFIX}/var
          # and not the Mark default ${EPREFIX}/var/lib. See bug 572002.
          local our_conf=(
            --prefix="${PHP_DESTDIR}"
            --mandir="${PHP_DESTDIR}/man"
            --infodir="${PHP_DESTDIR}/info"
            --libdir="${PHP_DESTDIR}/lib"
            --with-libdir="$(get_libdir)"
            --localstatedir="${EPREFIX}/var"
            --without-pear
            --enable-re2c-cgoto
            --enable-rtld-now
          )

          our_conf+=(
            $(use_with argon2 password-argon2 "${EPREFIX}/usr")
            $(use_enable bcmath)
            $(use_with bzip2 bz2 "${EPREFIX}/usr")
            $(use_enable calendar)
            $(use_enable coverage gcov)
            $(use_enable ctype)
            $(use_with curl)
            $(use_enable xml dom)
            $(use_with enchant)
            $(use_enable exif)
            $(use_with ffi)
            $(use_enable fileinfo)
            $(use_enable filter)
            $(use_enable ftp)
            $(use_with nls gettext "${EPREFIX}/usr")
            $(use_with gmp gmp "${EPREFIX}/usr")
            $(use_with mhash mhash "${EPREFIX}/usr")
            $(use_with iconv iconv \
              $(use elibc_glibc || use elibc_musl || use elibc_FreeBSD || echo "${EPREFIX}/usr"))
            $(use_enable intl)
            $(use_enable ipv6)
            $(use_with kerberos)
            $(use_with xml libxml)
            $(use_enable unicode mbstring)
            $(use_with ssl openssl)
            $(use_enable pcntl)
            $(use_enable phar)
            $(use_enable pdo)
            $(use_enable opcache)
            $(use_with postgres pgsql "${EPREFIX}/usr")
            $(use_enable posix)
            $(use_with spell pspell "${EPREFIX}/usr")
            $(use_enable simplexml)
            $(use_enable sharedmem shmop)
            $(use_with snmp snmp "${EPREFIX}/usr")
            $(use_enable soap)
            $(use_enable sockets)
            $(use_with sodium)
            $(use_with sqlite sqlite3)
            $(use_enable sysvipc sysvmsg)
            $(use_enable sysvipc sysvsem)
            $(use_enable sysvipc sysvshm)
            $(use_with tidy tidy "${EPREFIX}/usr")
            $(use_enable tokenizer)
            $(use_enable xml)
            $(use_enable xmlreader)
            $(use_enable xmlwriter)
            $(use_with xslt xsl)
            $(use_with zip)
            $(use_with zlib zlib "${EPREFIX}/usr")
            $(use_enable debug)
            $(use_enable zts)
          )

          # DBA support
          if use cdb || use berkdb || use flatfile || use gdbm || use inifile \
            || use qdbm || use lmdb ; then
            our_conf+=( "--enable-dba" )
          fi

          # DBA drivers support
          our_conf+=(
            $(use_with cdb)
            $(use_with berkdb db4 "${EPREFIX}/usr")
            $(use_enable flatfile)
            $(use_with gdbm gdbm "${EPREFIX}/usr")
            $(use_enable inifile)
            $(use_with qdbm qdbm "${EPREFIX}/usr")
            $(use_with lmdb lmdb "${EPREFIX}/usr")
          )

          # Support for the GD graphics library
          our_conf+=(
            $(use_with truetype freetype)
            $(use_enable cjk gd-jis-conv)
            $(use_with gd jpeg)
            $(use_with xpm)
            $(use_with webp)
          )
          # enable gd last, so configure can pick up the previous settings
          our_conf+=( $(use_enable gd) )

          # IMAP support
          if use imap ; then
            our_conf+=(
              $(use_with imap imap "${EPREFIX}/usr")
              $(use_with ssl imap-ssl "${EPREFIX}/usr")
            )
          fi

          # LDAP support
          if use ldap ; then
            our_conf+=(
              $(use_with ldap ldap "${EPREFIX}/usr")
              $(use_with ldap-sasl)
            )
          fi

          # MySQL support
          local mysqllib="mysqlnd"
          local mysqlilib="mysqlnd"

          our_conf+=( $(use_with mysqli mysqli "${mysqlilib}") )

          local mysqlsock="${EPREFIX}/var/run/mysqld/mysqld.sock"
          if use mysql || use mysqli ; then
            our_conf+=( $(use_with mysql mysql-sock "${mysqlsock}") )
          fi

          # ODBC support
          if use odbc && use iodbc ; then
            our_conf+=(
              --without-unixODBC
              --with-iodbc
              $(use_with pdo pdo-odbc "iODBC,${EPREFIX}/usr")
            )
          elif use odbc ; then
            our_conf+=(
              --with-unixODBC="${EPREFIX}/usr"
              --without-iodbc
              $(use_with pdo pdo-odbc "unixODBC,${EPREFIX}/usr")
            )
          else
            our_conf+=(
              --without-unixODBC
              --without-iodbc
              --without-pdo-odbc
            )
          fi

          # Oracle support
          our_conf+=( $(use_with oci8-instant-client oci8) )

          # PDO support
          if use pdo ; then
            our_conf+=(
              $(use_with mssql pdo-dblib "${EPREFIX}/usr")
              $(use_with mysql pdo-mysql "${mysqllib}")
              $(use_with postgres pdo-pgsql)
              $(use_with sqlite pdo-sqlite)
              $(use_with firebird pdo-firebird "${EPREFIX}/usr")
              $(use_with oci8-instant-client pdo-oci)
            )
          fi

          # readline/libedit support
          our_conf+=(
            $(use_with readline readline "${EPREFIX}/usr")
            $(use_with libedit)
          )

          # Session support
          our_conf+=( $(use_enable session) )

          # Use pic for shared modules such as apache2's mod_php
          our_conf+=( --with-pic )

          # we use the system copy of pcre
          # --with-external-pcre affects ext/pcre
          # Many arches don't support pcre-jit
          our_conf+=(
            --with-external-pcre
            --without-pcre-jit
          )

          # Catch CFLAGS problems
          # Fixes bug #14067.
          # Changed order to run it in reverse for bug #32022 and #12021.
          replace-cpu-flags "k6*" "i586"

          # Cache the ./configure test results between SAPIs.
          our_conf+=( --cache-file="${T}/config.cache" )

          # Support user-passed configuration parameters
          our_conf+=( ${EXTRA_ECONF:-} )

          # Support the Apache2 extras, they must be set globally for all
          # SAPIs to work correctly, especially for external PHP extensions

          mkdir -p "${WORKDIR}/sapis-build" || die
          for one_sapi in $SAPIS ; do
            use "${one_sapi}" || continue
            php_set_ini_dir "${one_sapi}"

            # The BUILD_DIR variable is used to determine where to output
            # the files that autotools creates. This was all originally
            # based on the autotools-utils eclass.
            BUILD_DIR="${WORKDIR}/sapis-build/${one_sapi}"
            cp -a "${S}" "${BUILD_DIR}" || die
            cd "${BUILD_DIR}" || die

            local sapi_conf=(
              --with-config-file-path="${PHP_INI_DIR}"
              --with-config-file-scan-dir="${PHP_EXT_INI_DIR_ACTIVE}"
            )

            for sapi in $SAPIS ; do
              case "$sapi" in
                cli|cgi|embed|fpm|phpdbg)
                  if [[ "${one_sapi}" == "${sapi}" ]] ; then
                    sapi_conf+=( "--enable-${sapi}" )
                    if [[ "fpm" == "${sapi}" ]] ; then
                      sapi_conf+=(
                        $(use_with acl fpm-acl)
                      )
                    fi
                  else
                    sapi_conf+=( "--disable-${sapi}" )
                  fi
                  ;;
                fpm)
                  if use apparmor ; then
                    sapi_conf+=( --with-fpm-apparmor )
                  fi
                  ;;

                apache2)
                  if [[ "${one_sapi}" == "${sapi}" ]] ; then
                    sapi_conf+=( --with-apxs2="${EPREFIX}/usr/bin/apxs" )
                  else
                    sapi_conf+=( --without-apxs2 )
                  fi
                  ;;
              esac
            done

            # Construct the $myeconfargs array by concatenating $our_conf
            # (the common args) and $sapi_conf (the SAPI-specific args).
            local myeconfargs=( "${our_conf[@]}" )
            myeconfargs+=( "${sapi_conf[@]}" )

            pushd "${BUILD_DIR}" > /dev/null || die
            econf "${myeconfargs[@]}"
            popd > /dev/null || die
          done
        }

        src_compile() {
          # snmp seems to run during src_compile, too (bug #324739)
          addpredict /usr/share/snmp/mibs/.index #nowarn
          addpredict /var/lib/net-snmp/mib_indexes #nowarn

          for sapi in ${SAPIS} ; do
            if use "${sapi}"; then
              cd "${WORKDIR}/sapis-build/$sapi" || \
                die "Failed to change dir to ${WORKDIR}/sapis-build/$1"
              emake
            fi
          done
        }

        src_install() {
          # see bug #324739 for what happens when we don't have that
          addpredict /usr/share/snmp/mibs/.index #nowarn

          # grab the first SAPI that got built and install common files from there
          local first_sapi=""
          for sapi in $SAPIS ; do
            if use $sapi ; then
              first_sapi=$sapi
              break
            fi
          done

          # Makefile forgets to create this before trying to write to it...
          dodir "${PHP_DESTDIR#${EPREFIX}}/bin"

          # Install php environment (without any sapis)
          cd "${WORKDIR}/sapis-build/$first_sapi" || die
          emake INSTALL_ROOT="${D}" \
            install-build install-headers install-programs

          local extension_dir="$("${ED}/${PHP_DESTDIR#${EPREFIX}}/bin/php-config" --extension-dir)"

          # Create the directory where we'll put version-specific php scripts
          keepdir "/usr/share/php{{ $php_mv }}"

          local sapi="", file=""
          local sapi_list=""

          for sapi in ${SAPIS}; do
            if use "${sapi}" ; then
              einfo "Installing SAPI: ${sapi}"
              cd "${WORKDIR}/sapis-build/${sapi}" || die

              if [[ "${sapi}" == "apache2" ]] ; then
                # We're specifically not using emake install-sapi as libtool
                # may cause unnecessary relink failures (see bug #351266)
                insinto "${PHP_DESTDIR#${EPREFIX}}/apache2/"
                newins ".libs/libphp$(get_libname)" \
                      "libphp{{ $php_mv }}$(get_libname)"
                keepdir "/usr/$(get_libdir)/apache2/modules"
              else
                # needed each time, php_install_ini would reset it
                local dest="${PHP_DESTDIR#${EPREFIX}}"
                into "${dest}"
                case "$sapi" in
                  cli)
                    source="sapi/cli/php"
                    # Install the "phar" archive utility.
                    if use phar ; then
                      emake INSTALL_ROOT="${D}" install-pharcmd
                      dosym "..${dest#/usr}/bin/phar" "/usr/bin/phar${SLOT}"
                    fi
                    ;;
                  cgi)
                    source="sapi/cgi/php-cgi"
                    ;;
                  fpm)
                    source="sapi/fpm/php-fpm"
                    ;;
                  embed)
                    source="libs/libphp$(get_libname)"
                    ;;
                  phpdbg)
                    source="sapi/phpdbg/phpdbg"
                    ;;
                  *)
                    die "unhandled sapi in src_install"
                    ;;
                esac

                if [[ "${source}" == *"$(get_libname)" ]]; then
                  dolib.so "${source}"
                else
                  dobin "${source}"
                  local name="$(basename ${source})"
                  dosym "..${dest#/usr}/bin/${name}" "/usr/bin/${name}${SLOT}"
                fi
              fi

              php_install_ini "${sapi}"

              # construct correct SAPI string for php-config
              # thanks to ferringb for the bash voodoo
              if [[ "${sapi}" == "apache2" ]]; then
                sapi_list="${sapi_list:+${sapi_list} }apache2handler"
              else
                sapi_list="${sapi_list:+${sapi_list} }${sapi}"
              fi
            fi
          done

          # Installing opcache module
          if use opcache ; then
            into "${PHP_DESTDIR#${EPREFIX}}"
            dolib.so "modules/opcache$(get_libname)"
          fi

          # Install env.d files
          newenvd "${FILESDIR}/20php5-envd" "20php${SLOT}"
          sed -e "s|/lib/|/$(get_libdir)/|g" -i "${ED}/etc/env.d/20php${SLOT}" || die
          sed -e "s|php5|php${SLOT}|g" -i "${ED}/etc/env.d/20php${SLOT}" || die

          # set php-config variable correctly (bug #278439)
          sed -e "s:^\(php_sapis=\)\".*\"$:\1\"${sapi_list}\":" -i \
            "${ED}/usr/$(get_libdir)/php${SLOT}/bin/php-config" || die
        }

        pkg_postinst() {
          # Output some general info to the user
          if use apache2 ; then
            elog
            elog "To enable PHP in apache, you will need to add \"-D PHP\" to"
            elog "your apache2 command. OpenRC users can append that string to"
            elog "APACHE2_OPTS in /etc/conf.d/apache2."
            elog
            elog "The apache module configuration file 70_mod_php.conf is"
            elog "provided (and maintained) by eselect-php."
            elog
          fi

          # Create the symlinks for php
          for m in ${SAPIS}; do
            [[ ${m} == 'embed' ]] && continue;
            if use $m ; then
              local ci=$(eselect php show $m)
              if [[ -z $ci ]]; then
                eselect php set $m php${SLOT} || die
                einfo "Switched ${m} to use php:${SLOT}"
                einfo
              elif [[ $ci != "php${SLOT}" ]] ; then
                elog "To switch $m to use php:${SLOT}, run"
                elog "    eselect php set $m php${SLOT}"
                elog
              fi
            fi
          done

          # Remove dead symlinks for SAPIs that were just disabled. For
          # example, if the user has the cgi SAPI enabled, then he has an
          # eselect-php symlink for it. If he later reinstalls PHP with
          # USE="-cgi", that symlink will break. This call to eselect is
          # supposed to remove that dead link per bug 572436.
          eselect php cleanup || die

          if ! has "php${SLOT/./-}" ${PHP_TARGETS}; then
              elog "To build extensions for this version of PHP, you will need to"
              elog "add php${SLOT/./-} to your PHP_TARGETS USE_EXPAND variable."
              elog
          fi

          einfo
          einfo "Mark guarantees the delivery of PHP packages following their publishing cycle."
          einfo "Details on current versions can be obtained at"
          einfo
          einfo "https://www.php.net/supported-versions.php"
          einfo

        }

        pkg_postrm() {
          # This serves two purposes. First, if we have just removed the last
          # installed version of PHP, then this will remove any dead symlinks
          # belonging to eselect-php. Second, if a user upgrades slots from
          # (say) 5.6 to 7.0 and depcleans the old slot, then this will update
          # his existing symlinks to point to the new 7.0 installation. The
          # latter is bug 432962.
          #
          # Note: the eselect-php package may not be installed at this point,
          # so we can't die() if this command fails.
          eselect php cleanup
        }

  packages:
    # Three parallel tracks (mesa/nvidia-drivers precedent): keep the
    # latest stable of each maintained slot, never a pre-release.
    # The RC/beta/alpha exclusion is inherited from defaults: above.
    # PHP 8.2
    - php:
        vars:
          slot: '8.2'
          # both config.m4 fixes apply cleanly on the 8.2 line (patch
          # --dry-run verified against the 8.2.35 tarball)
          patches:
            - apache.patch
            - php-iodbc-header-location.patch
        selector:
          - '>=8.2.0'
          - '<8.3.0'
    # PHP 8.3
    - php:
        vars:
          slot: '8.3'
          # dry-run verified against the 8.3.36 tarball
          patches:
            - apache.patch
            - php-iodbc-header-location.patch
        selector:
          - '>=8.3.0'
          - '<8.4.0'
    # PHP 8.4
    - php:
        vars:
          slot: '8.4'
          # Upstream rewrote sapi/apache2handler and ext/pdo_odbc
          # config.m4 on the 8.4 line (AS_IF/AS_VAR_IF form); both
          # legacy fixes fail to apply there (patch --dry-run verified
          # against the 8.4.27 tarball), so this track ships without
          # them pending a refresh.
          patches: []
        selector:
          - '>=8.4.0'
          - '<8.5.0'
