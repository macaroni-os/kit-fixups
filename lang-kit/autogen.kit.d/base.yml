golang:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    template: ../../templates/simple.tmpl

    dir:
      url: https://go.dev/dl
      matcher: "go1.*src.tar.gz$"
    transform:
      - kind: string
        match: go
        replace: ""
      - kind: string
        match: ".src.tar.gz"
        replace: ""
    vars:
      homepage: "https://golang.org"
      desc: "A concurrent garbage collected and typesafe programming language"
      extra_envs:
        - 'RESTRICT="strip"'
        # the *.syso files have writable/executable stacks
        - "QA_EXECSTACK='*.syso'"
        # Do not complain about CFLAGS, etc, since Go doesn't use them.
        - "QA_FLAGS_IGNORED='.*'"
        # The tools in /usr/lib/go should not cause the multilib-strict check to fail.
        - 'QA_MULTILIB_PATHS="usr/lib/go/pkg/tool/.*/.*"'
        # This package triggers "unrecognized elf file(s)" notices on riscv.
        # https://bugs.gentoo.org/794046
        - "QA_PREBUILT='.*'"
        - 'export CBUILD=${CBUILD:-${CHOST}}'
        - 'export CTARGET=${CTARGET:-${CHOST}}'
      inherit:
        - toolchain-funcs
      license: BSD
      iuse: amd64 arm64 armv6
      patches:
        - go-never-download-newer-toolchains.patch
      docs:
        - CONTRIBUTING.md
        - PATENTS
        - README.md
        - SECURITY.md
      s: '${WORKDIR}/go'
      body: |
        src_unpack() {
            for i in amd64 arm64 armv6 ; do
                if use $i ; then
                    if [ $i = "armv6" ] ; then
                        i=${i}l
                    fi
                    unpack go{{ .Values.version }}-bootstrap.linux-${i}.tar.gz || die
                    mv ${WORKDIR}/go ${WORKDIR}/go-bootstrap
                    break
                fi
            done
            unpack go{{ .Values.version }}.src.tar.gz || die
        }

        src_compile() {
          if has_version -b dev-lang/go; then
            export GOROOT_BOOTSTRAP="${BROOT}/usr/lib/go"
          else
            # Using bootstrap tarball.
            export GOROOT_BOOTSTRAP="${WORKDIR}/go-bootstrap"
          fi

          CARCH=${CHOST%%-*}

          case "$CARCH" in
            aarch64) export GOARCH="arm64" ;;
            armel)   export GOARCH="arm" GOARM=5 ;;
            armhf)   export GOARCH="arm" GOARM=6 ;;
            armv7)   export GOARCH="arm" GOARM=7 ;;
            s390x)   export GOARCH="s390x" ;;
            x86)     export GOARCH="386" ;;
            x86_64)  export GOARCH="amd64" ;;
            ppc64)   export GOARCH="ppc64" ;;
            ppc64le) export GOARCH="ppc64le" ;;
            riscv64) export GOARCH="riscv64" ;;
            loongarch64) export GOARCH="loong64" ;;
            *)       export GOARCH="unsupported";;
          esac

          case "$CARCH" in
          x86_64|s390x|aarch64) export GO_LDFLAGS=-buildmode=pie ;;
          esac

          export GOROOT_FINAL="${EPREFIX}"/usr/lib/go
          export GOROOT="${PWD}"
          export GOBIN="${GOROOT}/bin"
          export GOCACHE="${T}/go-build"
          export CC=$(tc-getBUILD_CC)
          export GOOS="linux"
          export CC_FOR_TARGET=$(tc-getCC)
          export CXX_FOR_TARGET=$(tc-getCXX)
          use armv6 && export GOARM=6

          cd src
          bash -x ./make.bash || die "build failed"
        }

        src_install() {
          dodir /usr/lib/go
          cp -R api bin doc lib pkg misc src test "${ED}"/usr/lib/go
          einstalldocs

          if [ -f go.env ]; then
            insinto /usr/lib/go
            doins go.env
          fi

          # testdata directories are not needed on the installed system
          rm -fr $(find "${ED}"/usr/lib/go -iname testdata -type d -print)
          local bin_path=bin
          local f x
          for x in ${bin_path}/*; do
            f=${x##*/}
            dosym ../lib/go/${bin_path}/${f} /usr/bin/${f}
          done
        }


    assets:
      - name: "go{{ .Values.version }}.src.tar.gz"

      - name: "go{{ .Values.version }}-bootstrap.linux-amd64.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-amd64.tar.gz"
        use: amd64
      - name: "go{{ .Values.version }}-bootstrap.linux-arm64.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-arm64.tar.gz"
        use: arm64
      - name: "go{{ .Values.version }}-bootstrap.linux-armv6l.tar.gz"
        url: "https://go.dev/dl/go{{ .Values.version }}.linux-armv6l.tar.gz"
        use: armv6

  packages:
    # go1.22
    - go:
        selector:
          - '<1.23.0'
          - '>=1.22.0'

    # go1.23
    - go:
        selector:
          - '<1.24.0'
          - '>=1.23.0'
    # go1.24
    - go:
        selector:
          - '<1.25.0'
          - '>=1.24.0'
    # go1.25
    - go:
        selector:
          - '<1.26.0'
          - '>=1.25.0'
    # go1.26
    - go:
        selector:
          - '<1.27.0'
          - '>=1.26.0'

nodejs:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: net-libs
    github:
      query: tags
      user: nodejs
      repo: node
      num_pages: 5
    vars:
      license: Apache-1.1 Apache-2.0 BSD BSD-2 MIT
      inherit:
        - python-any-r1
      python_compat: python3+
      bdepend: |
        ${PYTHON_DEPS}
      body: |
        src_configure() {
          configure_options=(
            # By default, prefix is /usr/local, which is outside of PATH,
            # set it to /usr instead:
            --prefix="${EPREFIX}"/usr
          )
          # NOTE: `econf` default flags appear to trip up the configure process,
          #       directly call the ./configure script instead.
          ./configure "${configure_options[@]}"
        }


  packages:
    # Release 24
    - nodejs:
        selector:
          - '<25.0.0'
          - '>=24.0.0'

    # Release 22
    - nodejs:
        selector:
          - '<23.0.0'
          - '>=22.0.0'

    # Release 20
    - nodejs:
        selector:
          - '<21.0.0'
          - '>=20.0.0'


zig:
  generator: builtin-json
  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    vars:
      homepage: https://ziglang.org/
      desc: General-purpose programming language for robust, optimal, and reusable software
      license: MIT
      baseurl: https://ziglang.org/download

    json:
      url: '{{ .Values.baseurl }}/index.json'
      version_filter: '$'

  packages:
    - zig:
        json:
          src_uri_filter: "$['{{ .Values.version }}'].src.tarball"
        vars:
          inherit:
            - cmake
          extra_envs:
            - 'BUILD_DIR="${S}/build"'
            - CMAKE_BUILD_TYPE=Release
          iuse: +clang
          llvm_targets:
            - AArch64
            - AMDGPU
            - ARM
            - AVR
            - BPF
            - Hexagon
            - Lanai
            - Mips
            - MSP430
            - NVPTX
            - PowerPC
            - RISCV
            - SystemZ
            - Sparc
            - SPIRV
            - VE
            - WebAssembly
            - X86
            - XCore
            - LoongArch
          # We need to force the valid targets else zig wants all standards targets.
          #sed -e "s|set(ZIG_LLVM_REQUIRED_TARGETS .*|set(ZIG_LLVM_REQUIRED_TARGETS \"${LLVM_TARGETS// /;}\")|g" -i \
          #  cmake/Findllvm.cmake
          body: |
            src_configure() {
              local llvm_version=$(clang --version  | grep version  | cut -d' ' -f 4 | cut -d'.' -f1)
              if use clang; then
                local -x CC=${CHOST}-clang
                local -x CXX=${CHOST}-clang++
              fi
              einfo "Using LLVM Targets: ${LLVM_TARGETS// /;}"
              local mycmakeargs=(
                -DZIG_SHARED_LLVM=ON
                -DCMAKE_INSTALL_PREFIX=/usr
                -DCMAKE_PREFIX_PATH=/usr
                -DCMAKE_VERBOSE_MAKEFILE=ON
                -DZIG_VERSION="${PV}"
                -DCLANG_INCLUDE_DIRS=/usr/lib/llvm/${llvm_version}/include
              )
              cmake_src_configure
            }

    - zig:
        category: virtual
        template: ../../templates/simple.tmpl
        ignore_artefacts: true
        vars:
          desc: Virtual for Zig language compiler
          rdepend: |
            || ( ~dev-lang/zig-bin-{{ .Values.version }} ~dev-lang/zig-{{ .Values.version }} )

    - zig-bin:
        template: ../../templates/simple.tmpl
        assets:
          - name: "{{ .Values.pn }}-x86_64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-x86_64-linux-{{ .Values.version }}.tar.xz'
            use: amd64
          - name: "{{ .Values.pn }}-arm-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-arm-linux-{{ .Values.version }}.tar.xz'
            use: arm
          - name: "{{ .Values.pn }}-aarch64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-aarch64-linux-{{ .Values.version }}.tar.xz'
            use: arm64
          - name: "{{ .Values.pn }}-riscv64-linux-{{ .Values.version }}.tar.xz"
            url: '{{ .Values.baseurl }}/{{ .Values.version }}/zig-riscv64-linux-{{ .Values.version }}.tar.xz'
            use: riscv64

        vars:
          iuse: doc amd64 arm arm64 riscv64
          depend: app-arch/tar
          desc: General-purpose programming language for robust, optimal, and reusable software (upstream build)
          rdepend: |
            !dev-lang/zig
          body: |
            src_unpack() {
              default
              mv "${WORKDIR}/"* "${S}"
            }
            src_install() {
              use doc || rm -rf "${S}"/doc
              dodir /opt
              mv "${S}" "${ED}"/opt/ || die
              dodir /usr/bin
              dosym "${ED}"/opt/${P}/zig /usr/bin/zig
              fperms 0755 /usr/bin/zig
            }


swig:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: dev-lang
    template: ../../templates/simple.tmpl

    dir:
      url: https://sourceforge.net/projects/swig/files/swig/
      matcher: "swig-4"
      exclude: "beta|timeline"
    transform:
      - kind: string
        match: swig-
        replace: ""
    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
        url: "https://download.sourceforge.net/{{ .Values.pn }}/{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
    vars:
      desc: Simplified Wrapper and Interface Generator
      license: GPL-3+ BSD BSD-2
      homepage: http://www.swig.org/
      iuse: ccache pcre
      rdepend: |
        pcre? ( dev-libs/libpcre )
        ccache? ( sys-libs/zlib )
      depend: '${RDEPEND}'
      docs:
        - ANNOUNCE
        - CHANGES
        - CHANGES.current
        - README
        - TODO
      body: |
        src_configure() {
          econf \
            $(use_enable ccache) \
            $(use_with pcre)
        }

  packages:
    - swig:

typescript:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-node
    github:
      query: releases
      user: microsoft
      repo: TypeScript
    vars:
      inherit:
        - npmv1
      rdepend: '${DEPEND}'
      extra_envs:
        - 'NPM_NO_DEPS=1'
      s: '${WORKDIR}/package'
    transform:
      - kind: string
        match: 'TypeScript '
        replace: ''
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tgz'

  packages:
    - typescript:
