sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: lang-kit
  url: "https://github.com/macaroni-os/lang-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: dev-node/typescript

    # Golang
    - pkg: dev-lang/go
      conditions:
        - '>=dev-lang/go-1.22.0'
        - '<dev-lang/go-1.23.0'

    - pkg: dev-lang/go
      conditions:
        - '>=dev-lang/go-1.23.0'
        - '<dev-lang/go-1.24.0'

    - pkg: dev-lang/go
      conditions:
        - '>=dev-lang/go-1.24.0'
        - '<dev-lang/go-1.25.0'

    - pkg: dev-lang/go
      conditions:
        - '>=dev-lang/go-1.25.0'
        - '<dev-lang/go-1.26.0'

    - pkg: dev-lang/go
      conditions:
        - '>=dev-lang/go-1.26.0'
        - '<dev-lang/go-1.27.0'

    # Rust
    - pkg: dev-lang/rust-bin
    - pkg: virtual/rust

    - pkg: net-libs/deno

    # Nodejs
    - pkg: net-libs/nodejs
      conditions:
        - '>=net-libs/nodejs-14.0.0'
        - '<net-libs/nodejs-15.0.0'

    - pkg: net-libs/nodejs
      conditions:
        - '>=net-libs/nodejs-20.0.0'
        - '<net-libs/nodejs-21.0.0'

    - pkg: net-libs/nodejs
      conditions:
        - '>=net-libs/nodejs-22.0.0'
        - '<net-libs/nodejs-23.0.0'

    - pkg: net-libs/nodejs
      conditions:
        - '>=net-libs/nodejs-24.0.0'
        - '<net-libs/nodejs-25.0.0'

    # Zig
    - pkg: dev-lang/zig
    - pkg: dev-lang/zig
      conditions:
        - '<dev-lang/zig-0.16.0'

    - pkg: dev-lang/zig-bin
    - pkg: virtual/zig

    # Swig
    - pkg: dev-lang/swig
