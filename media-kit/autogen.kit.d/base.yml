        virtual/pkgconfig
        cpu_flags_x86_mmx? (
          || (
            dev-lang/nasm
            dev-lang/yasm
          )
        )
        cuda? ( sys-devel/clang[llvm_targets_NVPTX] )
        doc? ( sys-apps/texinfo )

      required_use: |
        cuda? ( video_cards_nvidia )
        libv4l? ( v4l )
        fftools_cws2fws? ( zlib )
