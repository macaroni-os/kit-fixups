inkscape:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-gfx
    dir:
      url: https://inkscape.org/release/all/source/archive
      matcher: 'inkscape-.*.tar.xz$'
      exclude: "beta|rc"
    transform:
      - kind: string
        match: "inkscape-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      homepage: https://inkscape.org/ https://gitlab.com/inkscape/inkscape/
      desc: SVG based generic vector-drawing program
      python_compat: python3+
      inherit:
        - cmake
        - flag-o-matic
        - xdg
        - toolchain-funcs
        - python-single-r1
      license: GPL-2 LGPL-2.1
      iuse: |
        cdr dia exif graphicsmagick imagemagick inkjar jemalloc jpeg nls
        openmp postscript readline spell svg2 visio wpg X
      required_use: '${PYTHON_REQUIRED_USE}'
      bdepend: |
        dev-util/glib-utils
        dev-util/intltool
        sys-devel/gettext
        virtual/pkgconfig
      cdepend: |
        ${PYTHON_DEPS}
        app-text/poppler[cairo]
        dev-cpp/cairomm:0
        dev-cpp/glibmm
        dev-cpp/gtkmm:3.0
        dev-cpp/pangomm
        dev-libs/boehm-gc
        dev-libs/boost:=[stacktrace]
        dev-libs/double-conversion:=
        dev-libs/glib
        dev-libs/libsigc++:2
        dev-libs/libxml2
        dev-libs/libxslt
        dev-libs/gdl:3
        dev-libs/popt
        media-gfx/potrace
        media-libs/fontconfig
        media-libs/freetype:2
        media-libs/lcms:2
        media-libs/libpng:0=
        net-libs/libsoup:2.4
        sci-libs/gsl:=
        x11-libs/pango
        x11-libs/gtk+:3[X?]
        X? ( x11-libs/libX11 )
        $(python_gen_cond_dep '
          dev-python/appdirs[${PYTHON_USEDEP}]
          dev-python/cachecontrol[${PYTHON_USEDEP}]
          dev-python/cssselect[${PYTHON_USEDEP}]
          dev-python/filelock[${PYTHON_USEDEP}]
          dev-python/lxml[${PYTHON_USEDEP}]
          dev-python/pygobject[${PYTHON_USEDEP}]
          media-gfx/scour[${PYTHON_USEDEP}]
        ')
        cdr? (
          app-text/libwpg:0.3
          dev-libs/librevenge
          media-libs/libcdr
        )
        exif? ( media-libs/libexif )
        imagemagick? (
          !graphicsmagick? ( media-gfx/imagemagick:=[cxx] )
          graphicsmagick? ( media-gfx/graphicsmagick:=[cxx] )
        )
        jemalloc? ( dev-libs/jemalloc )
        jpeg? ( media-libs/libjpeg-turbo:= )
        readline? ( sys-libs/readline:= )
        spell? ( app-text/gspell )
        visio? (
          app-text/libwpg
          dev-libs/librevenge
          media-libs/libvisio
        )
        wpg? (
          app-text/libwpg
          dev-libs/librevenge
        )
      rdepend: |
        ${CDEPEND}
        $(python_gen_cond_dep '
          dev-python/numpy[${PYTHON_USEDEP}]
        ')
        dia? ( app-office/dia )
        postscript? ( app-text/ghostscript-gpl )
      depend: '${CDEPEND}'

      body: |
        pkg_pretend() {
          use openmp && tc-check-openmp
        }
        pkg_setup() {
          use openmp && tc-check-openmp
          python-single-r1_pkg_setup
        }

        src_unpack() {
          default
          [[ -d "${S}" ]] || mv -v "${WORKDIR}/${P}_202"?-??-* "${S}" || die
        }

        src_prepare() {
          cmake_src_prepare
          sed -i "/install.*COPYING/d" CMakeScripts/ConfigCPack.cmake || die
        }
        src_configure() {
          # aliasing unsafe wrt #310393
          append-flags -fno-strict-aliasing
          local mycmakeargs=(
            # -DWITH_LPETOOL   # Compile with LPE Tool and experimental LPEs enabled
            -DWITH_NLS=ON
            -DENABLE_POPPLER=ON
            -DENABLE_POPPLER_CAIRO=ON
            -DWITH_PROFILING=OFF
            -DWITH_INTERNAL_2GEOM=ON
            -DBUILD_TESTING=OFF
            -DWITH_LIBCDR=$(usex cdr)
            -DWITH_IMAGE_MAGICK=$(usex imagemagick $(usex !graphicsmagick)) # requires ImageMagick 6, only IM must be enabled
            -DWITH_GRAPHICS_MAGICK=$(usex graphicsmagick $(usex imagemagick)) # both must be enabled to use GraphicsMagick
            -DWITH_GNU_READLINE=$(usex readline)
            -DWITH_GSPELL=$(usex spell)
            -DWITH_JEMALLOC=$(usex jemalloc)
            -DENABLE_LCMS=ON
            -DWITH_OPENMP=$(usex openmp)
            -DBUILD_SHARED_LIBS=ON
            -DWITH_SVG2=$(usex svg2)
            -DWITH_LIBVISIO=$(usex visio)
            -DWITH_LIBWPG=$(usex wpg)
            -DWITH_X11=$(usex X)
            -DWITH_NLS=$(usex nls)
          )
          cmake_src_configure
        }
        src_install() {
          cmake_src_install
          find "${ED}" -type f -name "*.la" -delete || die
          find "${ED}"/usr/share/man -type f -maxdepth 3 -name '*.bz2' -exec bzip2 -d {} \; || die
          find "${ED}"/usr/share/man -type f -maxdepth 3 -name '*.gz' -exec gzip -d {} \; || die
          local extdir="${ED}"/usr/share/${PN}/extensions
          if [[ -e "${extdir}" ]] && [[ -n $(find "${extdir}" -mindepth 1) ]]; then
            python_optimize "${ED}"/usr/share/${PN}/extensions
          fi
          # Empty directory causes sandbox issues, see Gentoo bug #761915
          rm -r "${ED}/usr/share/inkscape/fonts" || die "Failed to remove fonts directory."
        }

  packages:
    - inkscape:


blender:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-gfx
    dir:
      url: https://download.blender.org/release/Blender{{ .Values.release }}/
      matcher: 'blender-.*-linux-x64.tar.xz$'
    transform:
      - kind: string
        match: "blender-"
        replace: ""
      - kind: string
        match: "-linux-x64.tar.xz"
        replace: ""
    vars:
      desc: 3D Creation/Animation/Publishing System
      homepage: http://www.blender.org/
      license: '|| ( GPL-2 BL )'
      restrict: bindist strip
      inherit:
        - desktop
        - xdg
      depend: sys-libs/ncurses[tinfo]
      extra_envs:
        - 'QA_PREBUILT="*"'
      s: "${WORKDIR}/blender-${PV}-linux-x64"
      body: |
        src_prepare() {
          default
          sed -e "s|Name=Blender|Name=Blender-bin ${PV}|" \
            -e "s|Exec=blender|Exec=blender-bin|" \
            -e "s|Icon=blender|Icon=blender-bin|" \
            -i ${S}/blender.desktop || die
          mv ${S}/blender.desktop ${S}/blender-bin.desktop
        }
        src_install() {
          dodir /opt/blender
          cp -pPR ${S}/* ${D}/opt/blender || die "Failed to copy files"
          fperms +x /opt/blender/blender
          domenu ${S}/blender-bin.desktop
          newicon -s scalable ${S}/blender.svg blender-bin.svg
          dosym ../blender/blender /opt/bin/${PN}
        }


  packages:
    - blender-bin:
        vars:
          release: 4.3
        selector:
          - '<4.4'

    - blender-bin:
        vars:
          release: 4.4
        selector:
          - '<4.5'
          - '>=4.4.0'

    - blender-bin:
        vars:
          release: 4.5
        selector:
          - '<4.6'
          - '>=4.5.0'

dav1d:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: https://download.videolan.org/pub/videolan/{{ .Values.pn }}/
      matcher: '[1.5.]+'

  packages:
    - dav1d:
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            url: 'https://download.videolan.org/pub/videolan/{{ .Values.pn }}/{{ .Values.version }}/{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
        vars:
          license: BSD-2
          desc: dav1d is an AV1 Decoder :)
          homepage: https://code.videolan.org/videolan/dav1d
          iuse: +8bit +10bit +asm xxhash
          rdepend: |
            xxhash? (
              dev-libs/xxhash
            )
          depend: '${RDEPEND}'
          bdepend: |
            asm? (
                dev-lang/nasm
            )
          inherit:
            - meson
            - ninja-utils
          docs:
            - README.md
            - doc/PATENTS
            - THANKS.md
          body: |
            src_configure() {
              local -a bits=()
              use 8bit  && bits+=( 8 )
              use 10bit && bits+=( 16 )

              local emesonargs=(
                -Dbitdepths=$(IFS=,; echo "${bits[*]}")
                -Denable_tests=false
                -Denable_asm=$(usex asm true false)
                $(meson_feature xxhash xxhash_muxer)
              )
              meson_src_configure
            }


