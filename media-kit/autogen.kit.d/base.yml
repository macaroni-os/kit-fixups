        - bluray:libbluray
        - gme:libgme
        - gsm:libgsm
        - libaribb24
        - mmal
        - modplug:libmodplug
        - opus:libopus
        - libilbc
        - librtmp
        - ssh:libssh
        - speex:libspeex
        - srt:libsrt
        - svg:librsvg
        - video_cards_nvidia:ffnvcodec
        - vorbis:libvorbis
        - vpx:libvpx
        - zvbi:libzvbi
        # libavfilter options
        - appkit
        - bs2b:libbs2b
        - chromaprint
        - cuda:cuda-llvm
        - flite:libflite
        - frei0r
        - fribidi:libfribidi
        - fontconfig
        - ladspa
        - libass
        - libtesseract
        - lv2
        - truetype:libfreetype
        - vidstab:libvidstab
        - rubberband:librubberband
        - zeromq:libzmq
        - zimg:libzimg
        # libswresample options
