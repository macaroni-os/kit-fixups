        - toolchain-funcs
      license: BSD freetts public-domain regexp-UofT BSD-2
      iuse: alsa oss pulseaudio voices
      patches:
        - flite-1.4-audio-interface.patch
        - flite-2.2-backport-pr30.patch
        - flite-2.2-make-4.4.patch
        - flite-2.2-backport-pr66.patch
        - flite-2.2-remove-const-cast.patch
        - flite-2.2-no-native-ar.patch
      rdepend: |
        pulseaudio? (
          media-sound/pulseaudio
        )
        !pulseaudio? (
          alsa? (
            media-libs/alsa-lib
          )
        )
      depend: '${RDEPEND}'
      body: |
        get_audio() {
          if use pulseaudio; then
            echo pulseaudio
          elif use alsa; then
            echo alsa
          elif use oss; then
            echo oss
          else
            echo none
          fi
        }
        src_unpack() {
          for file in ${A}; do
            case "${file}" in
              *.flitevox)
                cp -av "${DISTDIR}/${file}" "${WORKDIR}/${file/*-/}" || die "Unable to copy ${file}"
                ;;
              *)
                unpack "${file}"
                ;;
            esac
          done
        }
        src_prepare() {
          default
          sed -i main/Makefile \
            -e '/-rpath/s|$(LIBDIR)|$(INSTALLLIBDIR)|g' \
            || die
          mv configure.{in,ac} || die
          eautoreconf
        }
        src_configure() {
          local myconf=(
            --enable-shared
            --with-audio=$(get_audio)
          )
          econf "${myconf[@]}"
        }
        src_compile() {
          emake -j1 CC="$(tc-getCC)" CFLAGS="${CFLAGS}"
        }
        src_install() {
          default
          dodoc ACKNOWLEDGEMENTS README.md
          rm -rf "${D}"/usr/lib*/*.a
          if use voices; then
            insinto /usr/share/flite
            doins "${WORKDIR}"/*.flitevox
          fi
        }

    github:
      user: festvox
      query: tags

  packages:

    - flite:

