          dev-qt/qtbase:6[gui]
        )
        quirc? ( media-libs/quirc:= )
        tbb? ( dev-cpp/tbb:= )
        v4l? ( media-libs/libv4l )
        vaapi? ( x11-libs/libva )
        webp? ( media-libs/libwebp:= )
        vulkan? ( media-libs/vulkan-loader )
        wayland? (
          x11-libs/libxkbcommon
          dev-libs/wayland
          dev-libs/wayland-protocols
        )
        contribhdf? ( sci-libs/hdf5:= )
        contribfreetype? (
          media-libs/freetype:2
          media-libs/harfbuzz:=
        )
        contribovis? ( dev-games/ogre:= )

      depend: |
        ${CDEPEND}
        eigen? ( dev-cpp/eigen )
      rdepend: |
        ${CDEPEND}
      bdepend: |
        dev-util/patchelf
        virtual/pkgconfig
        doc? (
          app-text/doxygen[dot]
          python? (
            dev-python/beatifulsoup4[${PYTHON_USEDEP}]
          )
        )
      bundle_3rdparty:
        - ffmpeg
        - 'include/{opencl,vulkan}'
        - libjasper
        - libjpeg
        - libjpeg-turbo
        - libpng
        - libspng
        - libtiff
        - libwebp
        - openexr
        - openjpeg
        - protobuf
        - quirc
        - tbb
        - zlib
        - zlib-ng
      body: |
        {{- $v := .Values.version }}
        {{- $vc := join "." ( slice ( splitList "." $v ) 0 2 ) }}
        {{- $vr := join "" ( slice ( splitList "." $vc ) 0 2 ) }}
        CPU_FEATURES_MAP=(
          {{- range $f := .Values.arm_cpu_features }}
          cpu_flags_arm_{{ $f }}
          {{- end }}
          {{- range $f := .Values.x86_cpu_features }}
          cpu_flags_x86_{{ $f }}
          {{- end }}
        )
        pkg_pretend() {
          use openmp && tc-check-openmp
        }
        pkg_setup() {
          use openmp && tc-check-openmp
        }
        src_unpack() {
          local file
          default
          # remove bundle stuff
          local files_3rdparty=(
          {{- range $b := .Values.bundle_3rdparty }}
            {{ $b }}
          {{- end }}
          )
          for file in "${files_3rdparty[@]}"; do
            rm -r "${S}/3rdparty/${file}" || die "Removing 3rd party components (${file}) failed"
            sed -e "\_add\_subdirectory(.*3rdparty/${file})_d" \
              -i "${S}/CMakeLists.txt" "${S}/cmake"/*cmake || die
          done
        }
        src_prepare() {
          cmake_src_prepare
          sed \
            -e '/find_package(OpenMP/s/)/ COMPONENTS C CXX)/g' \
            -i \
              cmake/OpenCVFindFrameworks.cmake \
            || die
          if use contrib; then
            pushd "${WORKDIR}/{{ .Values.pn }}_contrib-${PV}" >/dev/null || die
            popd >/dev/null || die

            ! use contribcvv && { rm -R "${WORKDIR}/{{ .Values.pn }}_contrib-${PV}/modules/cvv" || die; }
            ! use contribfreetype && { rm -R "${WORKDIR}/{{ .Values.pn }}_contrib-${PV}/modules/freetype" || die; }
            ! use contribhdf && { rm -R "${WORKDIR}/{{ .Values.pn }}_contrib-${PV}/modules/hdf" || die; }
            ! use contribovis && { rm -R "${WORKDIR}/{{ .Values.pn }}_contrib-${PV}/modules/ovis" || die; }
            ! use contribsfm && { rm -R "${WORKDIR}/{{ .Values.pn }}_contrib-${PV}/modules/sfm" || die; }
            ! use contribxfeatures2d && { rm -R "${WORKDIR}/{{ .Values.pn }}_contrib-${PV}/modules/xfeatures2d" || die; }
          fi
        }
        src_configure() {
          filter-lto
          append-cppflags "$(usex debug '-DDEBUG' '-DNDEBUG')"

          local mycmakeargs=(
            -DMIN_VER_CMAKE=3.26
            -DCMAKE_POLICY_DEFAULT_CMP0148="OLD" # FindPythonInterp
            # for protobuf
            -DCMAKE_CXX_STANDARD=17

          # Optional 3rd party components
          # ===================================================
            -DOPENCV_ENABLE_NONFREE="$(usex non-free)"
            -DWITH_QUIRC="$(usex quirc)"
            -DWITH_FLATBUFFERS="no"
            -DWITH_1394="$(usex ieee1394)"
            # -DWITH_AVFOUNDATION="no" # IOS
            -DWITH_VTK="no"
            -DWITH_EIGEN="$(usex eigen)"
            -DWITH_VFW="no" # Video windows support
            -DWITH_FFMPEG="$(usex ffmpeg)"
            -DWITH_GSTREAMER="$(usex gstreamer)"
            -DWITH_GTK="$(usex gtk3)"
            -DWITH_GTK_2_X="no" # only want gtk3 nowadays
            -DWITH_IMGCODEC_GIF="$(usex gif)"
            -DWITH_IPP="no"
            -DWITH_JULIA="no"
            -DWITH_JASPER="$(usex jpeg2k "$(usex jasper)")"
            -DWITH_JPEG="$(usex jpeg)"
            -DWITH_OPENJPEG="$(usex jpeg2k "$(usex !jasper)")"
            -DWITH_WEBP="$(usex webp)"
            -DWITH_OPENEXR="$(usex openexr)"
            -DWITH_OPENVX="no"
            -DWITH_OPENNI="no"
            -DWITH_OPENNI2="no"
            -DWITH_PNG="$(usex png)"
            -DWITH_SPNG="no"
            -DWITH_GDCM="no"
            -DWITH_PVAPI="no"
            -DWITH_GIGEAPI="no"
            -DWITH_ARAVIS="no"
            -DWITH_WIN32UI="no" # Windows only
            -DWITH_TBB="$(usex tbb)"
            -DWITH_OPENMP="$(usex openmp)"
            -DWITH_PTHREADS_PF="yes"
            -DWITH_TIFF="$(usex tiff)"
            -DWITH_UNICAP="no"               # Not packaged
            -DWITH_V4L="$(usex v4l)"
            -DWITH_LIBV4L="$(usex v4l)"
            -DWITH_MSMF="no"
            -DWITH_XIMEA="no"        # Windows only
            -DWITH_XINE="no"
            -DWITH_CLP="no"
            -DWITH_OPENCL="$(usex opencl)"
            -DWITH_OPENCL_SVM="no" # "$(usex opencl)"
            -DWITH_DIRECTX="no"
            -DWITH_INTELPERC="no"
            -DWITH_IPP_A="no"
            -DWITH_MATLAB="no"
            -DWITH_VA="$(usex vaapi)"
            -DWITH_VA_INTEL="$(usex vaapi "$(usex video_cards_intel)")"
            -DWITH_GDAL="no"
            -DWITH_GPHOTO2="$(usex gphoto2)"
            -DWITH_LAPACK="$(usex lapack)"
            -DWITH_ITT="no" # 3dparty libs itt_notify

            -DWITH_AVIF="$(usex avif)"
            -DWITH_FREETYPE="$(usex truetype)"
            -DWITH_VULKAN="$(usex vulkan)"
            -DWITH_WAYLAND="$(usex wayland)"
          # ===================================================
          # CUDA build components: nvidia-cuda-toolkit
          # ===================================================
            -DWITH_CUDA="no"
            -DWITH_CUBLAS="no"
            -DWITH_CUFFT="no"
            -DWITH_CUDNN="no"
            -DWITH_NVCUVID="no"
            -DWITH_NVCUVENC="no"
            -DCUDA_NPP_LIBRARY_ROOT_DIR=""
          # ===================================================
          # OpenCV build components
          # ===================================================
            -DBUILD_SHARED_LIBS="yes"
            -DBUILD_JAVA="no"
            -DBUILD_ANDROID_EXAMPLES="no"
            -DBUILD_opencv_apps="$(usex opencvapps)"
            -DBUILD_DOCS="$(usex doc)" # Doesn't install anyways.
            -DBUILD_EXAMPLES="$(usex examples)"
            -DBUILD_TESTS="no"
            -DBUILD_PERF_TESTS="no"

            # -DBUILD_WITH_STATIC_CRT="no"
            -DBUILD_WITH_DYNAMIC_IPP="no"
            -DBUILD_FAT_JAVA_LIB="no"
            # -DBUILD_ANDROID_SERVICE="no"
            -DBUILD_CUDA_STUBS="no"
            -DOPENCV_EXTRA_MODULES_PATH="$(usex contrib "${WORKDIR}/${PN}_contrib-${PV}/modules" "")"
          # ===================================================
          # OpenCV installation options
          # ===================================================
            -DINSTALL_CREATE_DISTRIB="no"
            -DINSTALL_BIN_EXAMPLES="$(usex examples)"
            -DINSTALL_C_EXAMPLES="$(usex examples)"
            -DINSTALL_TESTS="no"
            # -DINSTALL_ANDROID_EXAMPLES="no"
            -DINSTALL_TO_MANGLED_PATHS="no"
            -DOPENCV_GENERATE_PKGCONFIG="yes"
            # opencv uses both ${CMAKE_INSTALL_LIBDIR} and ${LIB_SUFFIX}
            # to set its destination libdir
            -DLIB_SUFFIX=
          # ===================================================
          # OpenCV build options
          # ===================================================
            -DENABLE_CCACHE="no"
            # bug 733796, but PCH is a risky game in CMake anyway
            -DBUILD_USE_SYMLINKS="yes"
            -DENABLE_PRECOMPILED_HEADERS="no"
            -DENABLE_SOLUTION_FOLDERS="no"
            -DENABLE_PROFILING="no"
            -DENABLE_COVERAGE="no"
            -DOPENCV_DOWNLOAD_TRIES_LIST="0"
            -DHAVE_opencv_java="no"
            -DBUILD_WITH_DEBUG_INFO="$(usex debug)"
            -DOPENCV_ENABLE_MEMORY_SANITIZER="$(usex debug)"
            -DCV_TRACE="$(usex debug)"
            -DENABLE_NOISY_WARNINGS="$(usex debug)"
            -DOPENCV_WARNINGS_ARE_ERRORS="no"
            -DENABLE_IMPL_COLLECTION="no"
            -DENABLE_INSTRUMENTATION="no"
            -DGENERATE_ABI_DESCRIPTOR="no"
          # ===================================================
          # things we want to be hard off or not yet figured out
          # ===================================================
            -DBUILD_PACKAGE="no"
          # ===================================================
          # Not building protobuf but update files bug #631418
          # ===================================================
            -DWITH_PROTOBUF="yes"
            -DBUILD_PROTOBUF="no"
            -DPROTOBUF_UPDATE_FILES="yes"
            -DProtobuf_MODULE_COMPATIBLE="yes"
          # ===================================================
          # things we want to be hard enabled not worth useflag
          # ===================================================
            -DOPENCV_DOC_INSTALL_PATH="share/doc/${PF}"
            -DOPENCV_SAMPLES_BIN_INSTALL_PATH="libexec/{{ .Values.pn }}/bin/samples"

            -DBUILD_IPP_IW="no"
            -DBUILD_ITT="no"

          # ===================================================
          # configure modules to be build
          # ===================================================
            -DBUILD_opencv_dnn="no"
            -DBUILD_opencv_gapi="$(usex ffmpeg yes "$(usex gstreamer)")"
            -DBUILD_opencv_features2d="$(usex features2d)"
            -DBUILD_opencv_java_bindings_generator="no"
            -DBUILD_opencv_wechat_qrcode="no"
            -DBUILD_opencv_julia="no"
            -DBUILD_opencv_js="no"
            -DBUILD_opencv_js_bindings_generator="no"
            -DBUILD_opencv_objc_bindings_generator="no"
            -DBUILD_opencv_python2="no"
            -DBUILD_opencv_ts="no"
            -DBUILD_opencv_video="$(usex ffmpeg yes "$(usex gstreamer)")"
            -DBUILD_opencv_videoio="$(usex ffmpeg yes "$(usex gstreamer)")"

            -DBUILD_opencv_cudalegacy="no"

            # -DBUILD_opencv_world="yes"

            -DOPENCV_PLUGIN_VERSION=".{{ $vr }}"
            -DOPENCV_PLUGIN_ARCH=".${ARCH}"

            -DDNN_PLUGIN_LIST="all"
            -DHIGHGUI_ENABLE_PLUGINS="no"

            -DOPENCV_SKIP_SAMPLES_SYCL="yes"
          )

          local VIDEOIO_PLUGIN_LIST=()
          if use ffmpeg; then
            VIDEOIO_PLUGIN_LIST+=("ffmpeg")
          fi
          if use gstreamer; then
            VIDEOIO_PLUGIN_LIST+=("gstreamer")
          fi

          mycmakeargs+=(
            -DVIDEOIO_PLUGIN_LIST="$(IFS=';'; echo "${VIDEOIO_PLUGIN_LIST[*]}")"
          )
          if use qt6; then
            mycmakeargs+=(
              -DWITH_QT="$(usex qt6)"
              -DCMAKE_DISABLE_FIND_PACKAGE_Qt5="yes"
            )
          else
            mycmakeargs+=(
              -DWITH_QT="no"
              -DCMAKE_DISABLE_FIND_PACKAGE_Qt5="yes"
              -DCMAKE_DISABLE_FIND_PACKAGE_Qt6="yes"
            )
          fi
          local CPU_BASELINE=""
          for i in "${CPU_FEATURES_MAP[@]}" ; do
            if [[ ${ABI} != x86 || ${i%:*} != "cpu_flags_x86_avx2" ]]; then
              local value
              # These are merged into one flag internally
              if [[ ${ABI} == amd64 ]]; then
                case "${i%:*}" in
                  cpu_flags_x86_avx512er|cpu_flags_x86_avx512pf)
                    value="AVX512_KNL_EXTRA"
                    ;;
                  cpu_flags_x86_avx512_4fmaps|cpu_flags_x86_avx512_4vnniw)
                    value="AVX512_KNM_EXTRA"
                    ;;
                  *)
                    value="${i#*:}"
                    ;;
                esac
              else
                value=${i#*:}
              fi
              use "${i%:*}" && CPU_BASELINE="${CPU_BASELINE}${value};"
            fi
          done
          unset CPU_FEATURES_MAP
          mycmakeargs+=(
            -DCPU_BASELINE="${CPU_BASELINE}"
          )

          if use contrib; then
            mycmakeargs+=(
              -DBUILD_opencv_cvv="$(usex contribcvv)"

              -DBUILD_opencv_freetype="$(usex contribfreetype)"
              -DBUILD_opencv_hdf="$(usex contribhdf)"
              -DBUILD_opencv_ovis="$(usex contribovis)"
              -DBUILD_opencv_sfm="$(usex contribsfm)"
              -DBUILD_opencv_xfeatures2d="no"
              -DWITH_TESSERACT="no"
            )
          fi

          tc-export CC CXX

          if use ffmpeg; then
            mycmakeargs+=(
              -DOPENCV_GAPI_GSTREAMER="no"
              -DOPENCV_FFMPEG_DISABLE_MEDIASDK="yes"
            )
          fi
          if use lapack; then
            mycmakeargs+=(
              -DSKIP_OPENBLAS_PACKAGE="yes"
              -DOPENCV_LAPACK_DISABLE_MKL="yes"
            )
          fi

          if use gtk3 || use qt6 || use wayland; then
            if use opengl; then
              mycmakeargs+=(
                -DWITH_OPENGL="yes"
                -DOpenGL_GL_PREFERENCE="GLVND"
              )
            else
              mycmakeargs+=(
                -DWITH_OPENGL="no"
              )
            fi
          fi

          if use opencl; then
            mycmakeargs+=( -DOPENCL_INCLUDE_DIR="${ESYSROOT}/usr/include" )
            if has_version sci-libs/clfft; then
              mycmakeargs+=( -DWITH_OPENCLAMDFFT="yes" )
            else
              mycmakeargs+=( -DWITH_OPENCLAMDFFT="no" )
            fi
            if has_version sci-libs/clblas; then
              mycmakeargs+=( -DWITH_OPENCLAMDBLAS="yes" )
            else
              mycmakeargs+=( -DWITH_OPENCLAMDBLAS="no" )
            fi
          else
            mycmakeargs+=(
              -DWITH_OPENCLAMDFFT="no"
              -DWITH_OPENCLAMDBLAS="no"
            )
          fi

          if use vulkan; then
            mycmakeargs+=( -DVULKAN_INCLUDE_DIRS="/usr/include" )
          fi

          if use python; then
            python_setup
            mycmakeargs+=(
              -DBUILD_opencv_python3="yes"
              -DBUILD_opencv_python_bindings_generator="yes"
              -DBUILD_opencv_python_tests="no"
              -DPYTHON_DEFAULT_EXECUTABLE="${EPYTHON}"
              -DPYTHON_EXECUTABLE="${EPYTHON}"
              -DINSTALL_PYTHON_EXAMPLES="$(usex examples)"
            )

          else
            mycmakeargs+=(
              -DOPENCV_PYTHON_SKIP_DETECTION="yes"
              -DPYTHON_EXECUTABLE="no"
              -DINSTALL_PYTHON_EXAMPLES="no"
              -DBUILD_opencv_python3="no"
              -DBUILD_opencv_python_bindings_generator="no"
              -DBUILD_opencv_python_tests="no"
            )
          fi

          cmake_src_configure
        }
        src_compile() {
          cmake_src_compile
        }
        src_install() {
          cmake_src_install
          for plugin in "${ED}/usr/$(get_libdir)/libopencv_"*".{{ $vr }}.${ARCH}"* ; do
            patchelf --set-soname "$(basename "${plugin}" ".$(get_libname)")" "${plugin}"
          done
        }

  packages:
    - opencv:
        selector:
          - '<5.0'

obs_studio:
  generator: builtin-github

  extensions_defs:
    git-submodules:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: media-video
    github:
      user: obsproject
      repo: obs-studio
      query: releases

  packages:

    - obs-studio:
        extensions:
          - git-submodules
        transform:
          - kind: string
            match: 'OBS Studio '
            replace: ''
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
            url: 'https://api.github.com/repos/{{ .Values.github_user }}/{{ .Values.github_repo }}/tarball/{{ .Values.version }}'
          - name: '{{ .Values.pn }}-cef-binary-{{ .Values.cef_version }}-x86-64_v6.tar.xz'
            url: 'https://cdn-fastly.obsproject.com/downloads/cef_binary_{{ .Values.cef_version }}_linux_x86_64_v6.tar.xz'
            use: browser
        vars:
          cef_version: '6533'
          desc: Software for Recording and Streaming Live Video Content
          homepage: https://obsproject.com
          license: Boost-1.0 GPL-2+ MIT Unlicense
          python_compat: python3+
          extra_envs:
            - 'CMAKE_REMOVE_MODULES_LIST=( FindFreetype )'
            - 'LUA_COMPAT=( luajit )'
            - |
              QA_PREBUILT="
              usr/lib*/obs-plugins/chrome-sandbox
              usr/lib*/obs-plugins/libcef.so
              usr/lib*/obs-plugins/libEGL.so
              usr/lib*/obs-plugins/libGLESv2.so
              usr/lib*/obs-plugins/libvk_swiftshader.so
              usr/lib*/obs-plugins/libvulkan.so.1
              "
          inherit:
            - cmake
            - lua-single
            - optfeature
            - python-single-r1
            - xdg
          iuse: |
            +alsa browser decklink fdk jack lua nvenc pipewire pulseaudio
            python qsv speex +ssl truetype v4l vlc wayland webrtc websocket
          required_use: |
            browser? ( || ( alsa pulseaudio ) )
            lua? ( ${LUA_REQUIRED_USE} )
            python? ( ${PYTHON_REQUIRED_USE} )
          bdepend: |
            lua? ( dev-lang/swig )
            python? ( dev-lang/swig )
          rdepend: |
            dev-libs/glib:2
            dev-libs/jansson:=
            dev-libs/simde
            dev-libs/uthash
            media-libs/libglvnd
            x11-libs/libva
            media-libs/x264:=
            net-misc/curl
            sys-apps/dbus
            sys-apps/pciutils
            sys-apps/util-linux
            sys-libs/zlib:=
            >=media-video/ffmpeg-6.1:=[opus,x264]
            dev-cpp/nlohmann_json
            net-libs/mbedtls:=
            x11-libs/libdrm
            x11-libs/libX11
            x11-libs/libXcomposite
            x11-libs/libXfixes
            x11-libs/libxcb:=
            alsa? ( media-libs/alsa-lib )
            browser? (
                || (
                    >=app-accessibility/at-spi2-core-2.46.0:2
                    ( app-accessibility/at-spi2-atk dev-libs/atk )
                )
                dev-libs/expat
                dev-libs/glib
                dev-libs/nspr
                dev-libs/nss
                dev-libs/wayland
                media-libs/alsa-lib
                media-libs/fontconfig
                media-libs/mesa[gbm(+)]
                net-print/cups
                x11-libs/cairo
                x11-libs/libdrm
                x11-libs/libXcursor
                x11-libs/libXdamage
                x11-libs/libXext
                x11-libs/libXi
                x11-libs/libxkbcommon
                x11-libs/libXrandr
                x11-libs/libXrender
                x11-libs/libXScrnSaver
                x11-libs/libxshmfence
                x11-libs/libXtst
                x11-libs/pango
            )
            fdk? ( media-libs/fdk-aac:= )
            jack? ( virtual/jack )
            lua? ( ${LUA_DEPS} )
            nvenc? ( media-libs/nv-codec-headers )
            pipewire? ( media-video/pipewire:= )
            pulseaudio? ( media-sound/pulseaudio )
            python? ( ${PYTHON_DEPS} )
            qsv? (
                media-libs/libvpl
                x11-libs/libva
            )
            >=dev-qt/qtbase-6.8:6[xml(+)]
            >=dev-qt/qtsvg-6.8:6
            x11-libs/libxkbcommon
            speex? ( media-libs/speexdsp )
            truetype? (
                media-libs/fontconfig
                media-libs/freetype
            )
            v4l? (
                media-libs/libv4l
                virtual/udev
            )
            vlc? ( media-video/vlc:= )
            wayland? (
                dev-libs/wayland
                x11-libs/libxkbcommon
            )
            webrtc? ( net-libs/libdatachannel )
            websocket? (
                dev-cpp/asio
                >=dev-cpp/websocketpp-0.8.2
                dev-libs/qrcodegencpp
            )
          depend: '${RDEPEND}'
          body: |
            post_src_unpack() {
              local d main_dir bundle_dir
              for d in "${WORKDIR}"/obsproject-obs-studio-*; do
                if [[ -f ${d}/CMakeLists.txt ]]; then
                  main_dir=${d}
                else
                  bundle_dir=${d}
                fi
              done

              [[ -n ${main_dir} ]] || die "could not locate main obs-studio source directory"

              if [[ -n ${bundle_dir} && ${bundle_dir} != "${main_dir}" ]]; then
                cp -r "${bundle_dir}"/plugins/. "${main_dir}"/plugins/ || die
              fi

              mv "${main_dir}" "${S}" || die
            }

            pkg_setup() {
              use lua && lua-single_pkg_setup
              use python && python-single-r1_pkg_setup
            }

            src_prepare() {
              default
              cmake_src_prepare
            }

            src_configure() {
              local libdir=$(get_libdir)
              local mycmakeargs=(
                -DENABLE_ALSA=$(usex alsa)
                -DENABLE_AJA=OFF
                -DENABLE_BROWSER=$(usex browser)
                -DENABLE_DECKLINK=$(usex decklink)
                -DENABLE_FREETYPE=$(usex truetype)
                -DENABLE_JACK=$(usex jack)
                -DENABLE_LIBFDK=$(usex fdk)
                -DENABLE_NEW_MPEGTS_OUTPUT=OFF # Requires librist and libsrt.
                -DENABLE_NVENC=$(usex nvenc)
                -DENABLE_PIPEWIRE=$(usex pipewire)
                -DENABLE_PULSEAUDIO=$(usex pulseaudio)
                -DENABLE_QSV11=$(usex qsv)
                -DENABLE_RNNOISE=ON
                -DENABLE_SPEEXDSP=$(usex speex)
                -DENABLE_V4L2=$(usex v4l)
                -DENABLE_VLC=$(usex vlc)
                -DENABLE_VST=ON
                -DENABLE_WAYLAND=$(usex wayland)
                -DENABLE_WEBRTC=$(usex webrtc)
                -DENABLE_WEBSOCKET=$(usex websocket)
                -DOBS_VERSION_OVERRIDE=${PV}
              )

              if use browser; then
                mycmakeargs+=( -DCEF_ROOT_DIR="${WORKDIR}/cef_binary_{{ .Values.cef_version }}_linux_x86_64" )
              fi

              if use lua || use python; then
                mycmakeargs+=(
                  -DENABLE_SCRIPTING_LUA=$(usex lua)
                  -DENABLE_SCRIPTING_PYTHON=$(usex python)
                  -DENABLE_SCRIPTING=ON
                )
              else
                mycmakeargs+=( -DENABLE_SCRIPTING=OFF )
              fi

              if use browser && use ssl; then
                mycmakeargs+=( -DENABLE_WHATSNEW=ON )
              else
                mycmakeargs+=( -DENABLE_WHATSNEW=OFF )
              fi

              cmake_src_configure
            }

            pkg_postinst() {
              xdg_pkg_postinst

              if ! use alsa && ! use pulseaudio; then
                elog
                elog "For the audio capture features to be available,"
                elog "at least one of the 'alsa' or 'pulseaudio' USE-flags needs to"
                elog "be enabled."
                elog
              fi

              if use v4l && has_version media-video/v4l2loopback; then
                elog
                elog "Depending on system configuration, the v4l2loopback kernel module"
                elog "may need to be loaded manually, and needs to be re-built after"
                elog "kernel changes."
                elog
              fi

              optfeature "VA-API hardware encoding" media-video/ffmpeg[vaapi]
              optfeature "virtual camera support" media-video/v4l2loopback
            }


obs_studio_deps:
  generator: builtin-github

  extensions_defs:
    git-submodules:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: media-libs
    github:
      query: releases

  packages:

    - simde:
        category: dev-libs
        github:
          user: simd-everywhere
          repo: simde
        vars:
          desc: Header-only library providing implementations of SIMD instruction sets
          homepage: https://simd-everywhere.github.io/blog/
          license: MIT
          inherit:
            - meson
          body: |
            src_configure() {
              unset {C,CPP,CXX,LD}FLAGS

              local emesonargs=(
                -Dtests=false
              )

              meson_src_configure
            }

    - uthash:
        category: dev-libs
        github:
          user: troydhanson
          repo: uthash
          query: tags
          match: '^v[0-9.]+$'
        vars:
          desc: An easy-to-use hash implementation for C programmers
          homepage: https://troydhanson.github.io/uthash/index.html
          license: BSD-1
          inherit:
            - toolchain-funcs
          body: |
            src_configure() {
              tc-export CC
            }

            src_install() {
              doheader src/*.h
              dodoc doc/*.txt
            }

    - qrcodegencpp:
        category: dev-libs
        github:
          user: EasyCoding
          repo: qrcodegen-cmake
          query: tags
          match: '^v[0-9.]+-cmake[0-9]+$'
        transform:
          - kind: regex
            match: '-cmake'
            replace: '_p'
        assets:
          - name: 'QR-Code-generator-{{ index (splitList "-cmake" .Values.original_version) 0 }}.tar.gz'
            url: 'https://github.com/nayuki/QR-Code-generator/archive/refs/tags/v{{ index (splitList "-cmake" .Values.original_version) 0 }}.tar.gz'
          - name: 'qrcodegen-cmake-v{{ .Values.original_version }}.tar.gz'
            url: 'https://github.com/{{ .Values.github_user }}/{{ .Values.github_repo }}/archive/refs/tags/v{{ .Values.original_version }}.tar.gz'
        vars:
          desc: High-quality QR Code generator library for C and C++
          homepage: https://www.nayuki.io/page/qr-code-generator-library
          license: MIT
          inherit:
            - cmake
          s: '${WORKDIR}/QR-Code-generator-{{ index (splitList "-cmake" .Values.original_version) 0 }}'
          body: |
            post_src_unpack() {
              cp -r "${WORKDIR}"/qrcodegen-cmake-*/cmake "${S}"/ || die
              cp "${WORKDIR}"/qrcodegen-cmake-*/CMakeLists.txt "${S}"/ || die
            }

            src_configure() {
              local mycmakeargs=(
                -DBUILD_SHARED_LIBS=ON
                -DQRCODEGEN_BUILD_EXAMPLES=OFF
                -DQRCODEGEN_BUILD_TESTS=OFF
              )

              cmake_src_configure
            }

    - libdatachannel:
        category: net-libs
        extensions:
          - git-submodules
        github:
          user: paullouisageneau
          repo: libdatachannel
        transform:
          - kind: string
            match: 'Version '
            replace: ''
        vars:
          desc: C/C++ WebRTC network library featuring Data Channels, Media Transport, and WebSockets
          homepage: https://github.com/paullouisageneau/libdatachannel
          license: MPL-2.0 BSD MIT
          inherit:
            - cmake
          iuse: gnutls +media +websocket
          rdepend: |
            gnutls? (
                dev-libs/nettle:=
                net-libs/gnutls:=
            )
            !gnutls? ( dev-libs/openssl:= )
          depend: '${RDEPEND}'
          body: |
            post_src_unpack() {
              local d main_dir bundle_dir
              for d in "${WORKDIR}"/paullouisageneau-libdatachannel-*; do
                if [[ -f ${d}/CMakeLists.txt ]]; then
                  main_dir=${d}
                else
                  bundle_dir=${d}
                fi
              done

              [[ -n ${main_dir} ]] || die "could not locate main libdatachannel source directory"

              if [[ -n ${bundle_dir} && ${bundle_dir} != "${main_dir}" ]]; then
                cp -r "${bundle_dir}"/deps/. "${main_dir}"/deps/ || die
              fi

              mv "${main_dir}" "${S}" || die
            }

            src_configure() {
              local mycmakeargs=(
                -DBUILD_SHARED_LIBS=ON
                -DBUILD_SHARED_DEPS_LIBS=OFF
                -DNO_EXAMPLES=ON
                -DNO_MEDIA=$(usex media OFF ON)
                -DNO_TESTS=ON
                -DNO_WEBSOCKET=$(usex websocket OFF ON)
                -DPREFER_SYSTEM_LIB=OFF
                -DRTC_UPDATE_VERSION_HEADER=OFF
                -DUSE_GNUTLS=$(usex gnutls)
                -DUSE_MBEDTLS=OFF
                -DUSE_NICE=OFF
                -DWARNINGS_AS_ERRORS=OFF
              )

              cmake_src_configure
            }

    - nv-codec-headers:
        github:
          user: FFmpeg
          repo: nv-codec-headers
        transform:
          - kind: string
            match: 'Version '
            replace: ''
        vars:
          desc: FFmpeg version of headers required to interface with NVIDIA codec APIs
          homepage: https://github.com/FFmpeg/nv-codec-headers
          license: MIT
          inherit:
            - multilib
          body: |
            src_compile() {
              emake PREFIX="${EPREFIX}/usr" LIBDIR="$(get_libdir)"
            }

            src_install() {
              emake \
                PREFIX="${EPREFIX}/usr" \
                LIBDIR="$(get_libdir)" \
                DESTDIR="${D}" \
                install

              einstalldocs
            }

    - libvpl:
        github:
          user: intel
          repo: libvpl
          per_page: 100
          num_pages: 2
        selector:
          - '<3.0'
        vars:
          desc: Intel Video Processing Library dispatcher and API headers
          homepage: https://github.com/intel/libvpl
          license: MIT
          inherit:
            - cmake
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_SHARED_LIBS=ON
                -DBUILD_EXAMPLES=OFF
                -DINSTALL_EXAMPLES=OFF
                -DBUILD_EXPERIMENTAL=ON
                -DBUILD_TESTS=OFF
                -DENABLE_LIBDIR_IN_RUNTIME_SEARCH=OFF
                -DINSTALL_DEV=ON
                -DINSTALL_LIB=ON
                -DCMAKE_INSTALL_SYSCONFDIR="${EPREFIX}/etc"
              )

              cmake_src_configure
            }


raptor:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
    rate_duration: "5s"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: https://download.librdf.org/source/
      matcher: '{{ .Values.tarball_prefix | default .Values.pn }}-.*.{{ .Values.tarball_suffix }}$'
    transform:
      - kind: string
        match: "{{ .Values.tarball_prefix | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".{{ .Values.tarball_suffix }}"
        replace: ""
    vars:
      license: Apache-2.0 GPL-2 LGPL-2.1
      slot: 2
      iuse: +curl debug json static-libs
      homepage: https://librdf.org/raptor/
      desc: The RDF Parser Toolkit
      tarball_suffix: 'tar.gz'
      tarball_prefix: 'raptor2'
      rdepend: |
        dev-libs/libxml2
        dev-libs/libxslt
        curl? ( net-misc/curl )
        json? ( dev-libs/yajl )
        !media-libs/raptor:0
      depend: '${RDEPEND}'
      bdepend: |
        sys-devel/bison
        sys-devel/flex
        virtual/pkgconfig
      s: '${WORKDIR}/{{ .Values.pn }}2-{{ .Values.version }}'
      docs:
        - AUTHORS
        - ChangeLog
        - NEWS
        - NOTICE
        - README
      inherit:
        - autotools
        - toolchain-funcs
      body: |
        src_prepare() {
          default
          eautoreconf
          elibtoolize # Keep this for ~*-fbsd
          # Fix compatibility with libxml2 - macaroni-os/mark-issues#420
          sed -e '/ret->checked/d'  -i src/raptor_libxml.c || die
        }
        src_configure() {
          tc-export PKG_CONFIG
          local myeconfargs=(
            --with-html-dir="${EPREFIX}"/usr/share/gtk-doc/html
            $(usex curl --with-www=curl --with-www=xml)
            $(use_enable debug)
            $(use_with json yajl)
            $(use_enable static-libs static)
          )
          econf "${myeconfargs[@]}"
        }
        src_install() {
          default
          find "${ED}" -name '*.la' -delete || die
        }

  packages:
    - raptor:
