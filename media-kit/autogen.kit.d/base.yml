video_gh:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-video

  packages:

    - mpv:
        github:
          user: mpv-player
          query: releases
        selector:
          # 0.40 requires ffmpeg 6.1 not available in the tree
          - '<0.36'
        vars:
          desc: Command line media player
          homepage: "https://mpv.io/ https://github.com/mpv-player/mpv"
          python_compat: python3+
          extra_envs:
            - 'LUA_COMPAT=( lua5-1 luajit )'
            - "PYTHON_REQ_USE='threads(+)'"
          inherit:
            - meson
            - bash-completion-r1
            - flag-o-matic
            - lua-single
            - pax-utils
            - python-single-r1
            - xdg-utils
          license: LGPL-2.1+ GPL-2+ BSD ISC
          iuse: |
            +alsa aqua archive bluray cdda +cli coreaudio cplugins cuda debug doc +drm
            dvb dvd +egl gamepad gbm +iconv jack javascript jpeg lcms libass libcaca libmpv
            +lua luajit openal +opengl pipewire pulseaudio rubberband sdl sixel
            sndio selinux tools +uchardet vaapi vdpau vulkan wayland +X +xv zlib zimg
          required_use: |
            ${PYTHON_REQUIRED_USE}
            || ( cli libmpv )
            aqua? ( opengl )
            cuda? ( opengl )
            egl? ( || ( gbm X wayland ) )
            gamepad? ( sdl )
            gbm? ( drm egl opengl )
            lcms? ( opengl )
            luajit? ( lua )
            opengl? ( || ( aqua egl X !cli ) )
            tools? ( cli )
            uchardet? ( iconv )
            vaapi? ( || ( gbm X wayland ) )
            vdpau? ( X )
            vulkan? ( || ( X wayland ) )
            wayland? ( egl )
            X? ( egl? ( opengl ) )
            xv? ( X )
          cdepend: |
            !!app-shells/mpv-bash-completion
            media-libs/libplacebo:=[vulkan?]
            >=media-video/ffmpeg-4.0:0=[encode,threads,vaapi?,vdpau?]
            alsa? ( media-libs/alsa-lib )
            archive? ( app-arch/libarchive:= )
            bluray? ( media-libs/libbluray:= )
            cdda? (
                dev-libs/libcdio-paranoia
                dev-libs/libcdio:=
            )
            drm? ( x11-libs/libdrm )
            dvd? ( media-libs/libdvdnav )
            egl? (
              media-libs/libglvnd
              media-libs/libplacebo[opengl]
              media-libs/mesa[egl,gbm(-)?,wayland(-)?]
            )
            gamepad? ( media-libs/libsdl2 )
            iconv? (
              virtual/libiconv
              uchardet? ( app-i18n/uchardet )
            )
            jack? ( virtual/jack )
            javascript? ( dev-lang/mujs )
            jpeg? ( virtual/jpeg:0 )
            lcms? ( media-libs/lcms:2 )
            libass? (
              media-libs/libass:=[fontconfig,harfbuzz(+)]
              virtual/ttf-fonts
            )
            libcaca? ( media-libs/libcaca )
            lua? (
              !luajit? ( <dev-lang/lua-5.3:= )
              luajit? ( dev-lang/luajit:2 )
            )
            openal? ( media-libs/openal )
            pipewire? ( media-video/pipewire )
            pulseaudio? ( media-sound/pulseaudio )
            rubberband? ( media-libs/rubberband )
            sdl? ( media-libs/libsdl2[sound,threads,video] )
            vaapi? ( x11-libs/libva:=[drm?,X?,wayland?] )
            vdpau? ( x11-libs/libvdpau )
            vulkan? (
              media-libs/libplacebo:=[vulkan]
              media-libs/shaderc
            )
            wayland? (
              dev-libs/wayland
              x11-libs/libxkbcommon
              vulkan? ( media-libs/vulkan-loader[wayland] )
            )
            X? (
              x11-libs/libX11
              x11-libs/libXScrnSaver
              x11-libs/libXext
              x11-libs/libXinerama
              x11-libs/libXrandr
              x11-libs/libXpresent
              opengl? (
                x11-libs/libXdamage
                virtual/opengl
              )
              xv? ( x11-libs/libXv )
            )
            zlib? ( sys-libs/zlib )
            zimg? ( media-libs/zimg )

          depend: |
            ${CDEPEND}
            ${PYTHON_DEPS}
            X? ( x11-base/xorg-proto )
            dvb? ( sys-kernel/linux-headers )
            cuda? ( media-libs/nv-codec-headers )
            vulkan? ( dev-util/vulkan-headers )
            wayland? ( dev-libs/wayland-protocols )

          bdepend: |
            ${PYTHON_DEPS}
            dev-util/meson
            virtual/pkgconfig
            cli? ( dev-python/docutils )
            wayland? ( dev-util/wayland-scanner )
          rdepend: |
            ${CDEPEND}
            cuda? ( x11-drivers/nvidia-drivers[X] )
            tools? ( ${PYTHON_DEPS} )

          body: |
            post_src_unpack() {
              mv "${WORKDIR}"/mpv-* "${S}" || die
            }
            pkg_setup() {
              use lua && lua-single_pkg_setup
              python-single-r1_pkg_setup
            }

            src_configure() {
              if use !debug; then
                append-cppflags -DNDEBUG # treated specially
              fi

              local emesonargs=(
                $(meson_use cli cplayer)
                $(meson_use libmpv)
                -Dtests=false
                $(meson_feature doc html-build)
                $(meson_feature doc manpage-build)
                -Dpdf-build=disabled

                -Dbuild-date=false

                # misc options
                $(meson_feature archive libarchive)
                $(meson_feature bluray libbluray)
                $(meson_feature cdda)
                -Dcplugins=enabled
                $(meson_feature dvb dvbin)
                $(meson_feature dvd dvdnav)
                $(meson_feature gamepad sdl2-gamepad)
                $(meson_feature iconv)
                $(meson_feature javascript)
                -Dlibavdevice=enabled
                $(meson_feature lcms lcms2)
                # force using lua for pkg-config and lua5.1
                #-Dlua=$(usex lua "${ELUA}" disabled)
                -Dlua=$(usex lua "lua" disabled)
                $(meson_feature rubberband)
                -Dsdl2=$(use gamepad || use sdl && echo enabled || echo disabled) #857156
                $(meson_feature uchardet)
                -Dvapoursynth=disabled # only available in overlays
                $(meson_feature zimg)
                $(meson_feature zlib)

                # audio output
                $(meson_feature alsa)
                $(meson_feature coreaudio)
                $(meson_feature jack)
                $(meson_feature openal)
                $(meson_feature pipewire)
                $(meson_feature pulseaudio pulse)
                $(meson_feature sdl sdl2-audio)
                $(meson_feature sndio)

                # video output
                $(meson_feature X x11)
                $(meson_feature aqua cocoa)
                $(meson_feature drm)
                $(meson_feature jpeg)
                $(meson_feature libcaca caca)
                $(meson_feature sdl sdl2-video)
                $(meson_feature sixel)
                $(meson_feature wayland)
                $(meson_feature xv)

                -Dgl=$(use aqua || use egl || use libmpv &&
                  echo enabled || echo disabled)
                $(meson_feature egl)
                $(meson_feature libmpv plain-gl)

                $(meson_feature vulkan)

                # hardware decoding
                $(meson_feature cuda cuda-hwaccel)
                $(meson_feature vaapi)
                $(meson_feature vdpau)
              )

              meson_src_configure
            }

            src_install() {
              meson_src_install

              if use lua; then
                insinto /usr/share/${PN}
                doins -r TOOLS/lua

                if use cli && use lua_single_target_luajit; then
                  pax-mark -m "${ED}"/usr/bin/${PN}
                fi
              fi

              if use tools; then
                dobin TOOLS/{mpv_identify.sh,umpv}
                newbin TOOLS/idet.sh mpv_idet.sh
                python_fix_shebang "${ED}"/usr/bin/umpv
              fi

              if use doc; then
                dodir /usr/share/doc/${PF}/html
                #mv "${ED}"/usr/share/doc/{mpv,${PF}/html}/mpv.html || die
                mv "${ED}"/usr/share/doc/{mpv,${PF}/examples} || die
              fi

              local GLOBIGNORE=*/*build*:*/*policy*
              dodoc RELEASE_NOTES DOCS/*.{md,rst}
            }
            pkg_postinst() {
              xdg_pkg_postinst
            }
            pkg_postrm() {
              xdg_pkg_postrm
            }


sound_gh:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: media-sound

  packages:

    - mpd:
        github:
          user: MusicPlayerDaemon
          repo: MPD
          query: tags
        vars:
          desc: The Music Player Daemon (mpd)
          homepage: "https://www.musicpd.org https://github.com/MusicPlayerDaemon/MPD"
          python_compat: python3+
          extra_envs:
            - 'OUTPUT_PLUGINS="alsa ao fifo jack network openal oss pipe pulseaudio sndio recorder"'
            - 'DECODER_PLUGINS="audiofile faad ffmpeg flac fluidsynth mad mikmod modplug mpg123 musepack opus flac sid vorbis wavpack wildmidi"'
            - 'ENCODER_PLUGINS="audiofile flac lame twolame vorbis"'
          inherit:
            - flag-o-matic
            - meson
            - xdg-utils
            - user
          license: GPL-2
          iuse: |
            +alsa ao +audiofile bzip2 cdio chromaprint +cue +curl doc +dbus
            +eventfd expat faad +ffmpeg +fifo flac fluidsynth gme +icu +id3tag +inotify
            +ipv6 jack lame libmpdclient libsamplerate libsoxr +mad mikmod mms
            modplug mpg123 musepack +network nfs openal opus oss pipe pulseaudio qobuz
            recorder samba selinux sid signalfd sndfile sndio sqlite systemd
            twolame udisks vorbis wavpack webdav wildmidi upnp
            zeroconf zip zlib

          required_use: |
            || ( ${OUTPUT_PLUGINS} )
            || ( ${DECODER_PLUGINS} )
            network? ( || ( ${ENCODER_PLUGINS} ) )
            recorder? ( || ( ${ENCODER_PLUGINS} ) )
            upnp? ( expat )
            webdav? ( curl expat )

          bdepend: |
            dev-util/meson
            virtual/pkgconfig

          rdepend: |
            sys-libs/liburing:=
            alsa? (
              media-libs/alsa-lib
              media-sound/alsa-utils
            )
            ao? ( media-libs/libao:=[alsa?,pulseaudio?] )
            audiofile? ( media-libs/audiofile:= )
            cdio? (
              dev-libs/libcdio:=
              dev-libs/libcdio-paranoia
            )
            chromaprint? ( media-libs/chromaprint )
            curl? ( net-misc/curl )
            dbus? ( sys-apps/dbus )
            doc? ( dev-python/sphinx )
            expat? ( dev-libs/expat )
            faad? ( media-libs/faad2 )
            ffmpeg? ( media-video/ffmpeg:= )
            flac? ( media-libs/flac:= )
            fluidsynth? ( media-sound/fluidsynth )
            gme? ( >=media-libs/game-music-emu-0.6.0_pre20120802 )
            icu? (  dev-libs/icu:= )
            id3tag? ( media-libs/libid3tag:= )
            jack? ( virtual/jack )
            lame? ( network? ( media-sound/lame ) )
            libmpdclient? ( media-libs/libmpdclient )
            libsamplerate? ( media-libs/libsamplerate )
            libsoxr? ( media-libs/soxr )
            mad? ( media-libs/libmad )
            mikmod? ( media-libs/libmikmod )
            mms? ( media-libs/libmms )
            modplug? ( media-libs/libmodplug )
            mpg123? ( media-sound/mpg123 )
            musepack? ( media-sound/musepack-tools )
            network? ( media-libs/libshout )
            nfs? ( net-fs/libnfs )
            openal? ( media-libs/openal )
            opus? ( media-libs/opus )
            pulseaudio? ( media-sound/pulseaudio )
            qobuz? ( dev-libs/libgcrypt:0 )
            samba? ( net-fs/samba )
            selinux? ( sec-policy/selinux-mpd )
            sid? (
              media-libs/libsidplayfp
            )
            sndfile? ( media-libs/libsndfile )
            sndio? ( media-sound/sndio )
            sqlite? ( dev-db/sqlite:3 )
            twolame? ( media-sound/twolame )
            udisks? ( sys-fs/udisks:2 )
            upnp? ( net-libs/libupnp:0 )
            vorbis? ( media-libs/libvorbis )
            wavpack? ( media-sound/wavpack )
            wildmidi? ( media-sound/wildmidi )
            zeroconf? ( net-dns/avahi[dbus] )
            zip? ( dev-libs/zziplib:= )
            zlib? ( sys-libs/zlib:= )

          depend: |
            ${RDEPEND}
            dev-libs/boost:=
            dev-libs/libfmt

          body: |
            pkg_setup() {
              elog "If you will be starting mpd via /etc/init.d/mpd, please make
              sure that MPD's pid_file is _set_."
              enewuser mpd -1 -1 -1 audio
            }
            src_prepare() {
              sed -i \
                -e 's:^#filesystem_charset.*$:filesystem_charset "UTF-8":' \
                -e 's:^#user.*$:user "mpd":' \
                -e 's:^#bind_to_address.*any.*$:bind_to_address "localhost":' \
                -e 's:^#bind_to_address.*$:bind_to_address "/var/lib/mpd/socket":' \
                -e 's:^#music_directory.*$:music_directory "/var/lib/mpd/music":' \
                -e 's:^#playlist_directory.*$:playlist_directory "/var/lib/mpd/playlists":' \
                -e 's:^#db_file.*$:db_file "/var/lib/mpd/database":' \
                -e 's:^#log_file.*$:log_file "/var/lib/mpd/log":' \
                -e 's:^#pid_file.*$:pid_file "/var/lib/mpd/pid":' \
                -e 's:^#state_file.*$:state_file "/var/lib/mpd/state":' \
                doc/mpdconf.example || die
              default
            }
            src_configure() {
              local emesonargs=(
                -Dbzip2=$(usex bzip2 enabled disabled)
                -Dcdio_paranoia=$(usex cdio enabled disabled)
                -Dchromaprint=$(usex chromaprint enabled disabled)
                -Dcue=$(usex cue true false)
                -Dcurl=$(usex curl enabled disabled)
                -Ddbus=$(usex dbus enabled disabled)
                -Deventfd=$(usex eventfd true false)
                -Dexpat=$(usex expat enabled disabled)
                -Dicu=$(usex icu enabled disabled)
                -Did3tag=$(usex id3tag enabled disabled)
                -Dinotify=$(usex inotify true false)
                -Dipv6=$(usex ipv6 enabled disabled)
                -Diso9660=$(usex cdio enabled disabled)
                -Dlibmpdclient=$(usex libmpdclient enabled disabled)
                -Dlibsamplerate=$(usex libsamplerate enabled disabled)
                -Dmms=$(usex mms enabled disabled)
                -Dnfs=$(usex nfs enabled disabled)
                -Dsignalfd=$(usex signalfd true false)
                -Dsmbclient=$(usex samba enabled disabled)
                -Dsoxr=$(usex libsoxr enabled disabled)
                -Dsqlite=$(usex sqlite enabled disabled)
                -Dtest=false
                -Dudisks=$(usex udisks enabled disabled)
                -Dupnp=$(usex upnp auto disabled)
                -Dwebdav=$(usex webdav enabled disabled)
                -Dzeroconf=$(usex zeroconf avahi disabled)
                -Dzlib=$(usex zlib enabled disabled)
                -Dzzip=$(usex zip enabled disabled)
                -Dsystemd=disabled
                )
              emesonargs+=(
                -Dalsa=$(usex alsa enabled disabled)
                -Dao=$(usex ao enabled disabled)
                -Dfifo=$(usex fifo true false)
                -Djack=$(usex jack enabled disabled)
                -Dopenal=$(usex openal enabled disabled)
                -Doss=$(usex oss enabled disabled)
                -Dpipe=$(usex pipe true false)
                -Dpulse=$(usex pulseaudio enabled disabled)
                -Drecorder=$(usex recorder true false)
                -Dsndio=$(usex sndio enabled disabled)
              )

              if use samba || use upnp; then
                emesonargs+=( -Dneighbor=true )
              fi

              append-lfs-flags
              append-ldflags "-L/usr/$(get_libdir)/sidplay/builders"

              if use network; then
                emesonargs+=(
                  -Dshine=disabled
                  -Dshout=enabled
                  -Dvorbisenc=$(usex vorbis enabled disabled)
                  -Dhttpd=true
                  -Dlame=$(usex lame enabled disabled)
                  -Dtwolame=$(usex twolame enabled disabled)
                  -Dwave_encoder=$(usex audiofile true false)
                )
              fi

              emesonargs+=(
                -Dadplug=disabled
                -Daudiofile=$(usex audiofile enabled disabled)
                -Dfaad=$(usex faad enabled disabled)
                -Dffmpeg=$(usex ffmpeg enabled disabled)
                -Dflac=$(usex flac enabled disabled)
                -Dfluidsynth=$(usex fluidsynth enabled disabled)
                -Dgme=$(usex gme enabled disabled)
                -Dmad=$(usex mad enabled disabled)
                -Dmikmod=$(usex mikmod enabled disabled)
                -Dmodplug=$(usex modplug enabled disabled)
                -Dmpcdec=$(usex musepack enabled disabled)
                -Dmpg123=$(usex mpg123 enabled disabled)
                -Dopus=$(usex opus enabled disabled)
                -Dsidplay=$(usex sid enabled disabled)
                -Dsndfile=$(usex sndfile enabled disabled)
                -Dvorbis=$(usex vorbis enabled disabled)
                -Dwavpack=$(usex wavpack enabled disabled)
                -Dwildmidi=$(usex wildmidi enabled disabled)
              )

              emesonargs+=(
                -Dqobuz=$(usex qobuz enabled disabled)
              )

              emesonargs+=(
                --libdir="/usr/$(get_libdir)"
                -Ddocumentation=$(usex doc enabled disabled)
                -Dsolaris_output=disabled
                -Ddatabase=true
                -Ddsd=true
                -Dio_uring=enabled
                -Dtcp=true
                -Dsystemd_system_unit_dir=""
                -Dsystemd_user_unit_dir=""
                )

              if use icu; then
                emesonargs+=( -Diconv=enabled )
              else
                emesonargs+=( -Diconv=disabled )
              fi

              meson_src_configure
            }
            src_install() {
              meson_src_install
              insinto /etc
              newins doc/mpdconf.example mpd.conf
              insinto /etc/logrotate.d
              newins "${FILESDIR}"/${PN}.logrotate ${PN}
              newinitd "${FILESDIR}"/${PN}.initd ${PN}
              keepdir /var/lib/mpd
              keepdir /var/lib/mpd/music
              keepdir /var/lib/mpd/playlists

              fowners mpd:audio -R /var/lib/mpd
              rm -r "${ED}"/usr/share/doc/mpd || die
            }
            pkg_postinst() {
              xdg_icon_cache_update
            }
            pkg_postrm() {
              xdg_icon_cache_update
            }


libs_gh:
  generator: builtin-noop

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs

  packages:

    - libplacebo:
        #github:
        #  user: haasn
        #  query: releases
        selector:
          - "=5.264.1"
        # We need a review of mark-devkit in order to support github with children assets
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
            url: https://api.github.com/repos/{{ .Values.github_user }}/{{ .Values.pn }}/tarball/v{{ .Values.version }}
          - name: "{{ .Values.pn }}-{{ .Values.version }}-glad-{{ .Values.glad_hash }}.tar.gz"
            url: https://github.com/Dav1dde/glad/archive/{{ .Values.glad_hash }}.tar.gz
        vars:
          versions:
            - "5.264.1"
          github_user: haasn
          glad_hash: 525eddb7e04bc4008b691fb38a6d31bf3cad684c
          desc: Reusable library for GPU-accelerated image processing primitives
          homepage: https://code.videolan.org/videolan/libplacebo
          python_compat: python3+
          extra_envs:
            - 'PYTHON_REQ_USE="xml"'
          inherit:
            - meson
            - python-any-r1
          license: LGPL-2.1+
          iuse: glslang lcms +opengl +shaderc +vulkan
          rdepend: |
            glslang? ( dev-util/glslang )
            lcms? ( media-libs/lcms:2 )
            opengl? ( media-libs/libepoxy )
            shaderc? ( media-libs/shaderc )
            vulkan? (
              dev-util/vulkan-headers
              media-libs/vulkan-loader
            )
          depend: ${RDEPEND}
          bdepend: |
            virtual/pkgconfig
            vulkan? (
              ${PYTHON_DEPS}
              $(python_gen_any_dep 'dev-python/mako[${PYTHON_USEDEP}]')
            )
          body: |
            post_src_unpack() {
              mv {{ .Values.github_user }}-{{ .Values.pn }}-* ${S}
              if use opengl ; then
                rmdir "${S}"/3rdparty/glad || die
                mv glad-{{ .Values.glad_hash }} "${S}"/3rdparty/glad || die
              fi
              sed -i "s:\(#include <vulkan/vulkan.h>\):\1\n#include <vulkan/vulkan_metal.h>:" "${S}"/src/include/${PN}/vulkan.h || die
            }
            python_check_deps() {
              has_version -b "dev-python/mako[${PYTHON_USEDEP}]"
            }
            pkg_setup() {
              use vulkan && python-any-r1_pkg_setup
            }
            src_configure() {
              local emesonargs=(
                $(meson_feature glslang)
                $(meson_feature lcms)
                $(meson_feature opengl)
                $(meson_feature shaderc)
                $(meson_feature vulkan)
                -Dtests=false
                # hard-code path from dev-util/vulkan-headers
                -Dvulkan-registry=/usr/share/vulkan/registry/vk.xml
              )
              meson_src_configure
            }


sdl_tff_autogen:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: media-libs
    github:
      query: releases
      user: libsdl-org
      repo: SDL_ttf
    vars:
      desc: Support for TrueType fonts in SDL applications.
      homepage: https://www.libsdl.org/projects/SDL_ttf/
      inherit:
        - cmake
      license: ZLIB
      iuse: +harfbuzz static-libs X
      depend: ${RDEPEND}
      rdepend: |
        media-libs/libsdl{{ .Values.sdl_version }}
        media-libs/freetype[harfbuzz?]
        virtual/opengl
        harfbuzz? ( media-libs/harfbuzz )
      body: |
        src_configure() {
          local mycmakeargs=(
            -DSDL{{ .Values.sdl_version }}TTF_VENDORED=OFF
            -DSDL{{ .Values.sdl_version }}TTF_HARFBUZZ=$(usex harfbuzz)
          )
          cmake_src_configure
        }

  packages:

    - sdl2-ttf:
        vars:
          sdl_version: "2"
        selector:
          - '<3.0'

    - sdl3-ttf:
        vars:
          sdl_version: "3"
        selector:
          - '>=3.0'


sdl_image_autogen:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: media-libs
    github:
      query: releases
      user: libsdl-org
      repo: SDL_image
    vars:
      inherit:
        - cmake
      desc: Image decoding for many popular formats for SDL.
      homepage: https://www.libsdl.org/projects/SDL_image/
      license: ZLIB
      iuse: gif jpeg png static-libs tiff webp
      depend: ${RDEPEND}
      rdepend: |
        media-libs/libsdl{{ .Values.sdl_version }}
        sys-libs/zlib
        png? ( media-libs/libpng )
        jpeg? ( virtual/jpeg )
        tiff? ( media-libs/tiff )
        webp? ( media-libs/libwebp )

  packages:

    - sdl2-image:
        vars:
          sdl_version: "2"
          body: |
            src_configure() {
              local mycmakeargs=(
                -DSDL2IMAGE_AVIF=OFF
                -DSDL2IMAGE_BMP=ON
                -DSDL2IMAGE_GIF=$(usex gif)
                -DSDL2IMAGE_JPG=$(usex jpeg)
                -DSDL2IMAGE_JXL=OFF
                -DSDL2IMAGE_LBM=ON
                -DSDL2IMAGE_PCX=ON
                -DSDL2IMAGE_PNG=$(usex png)
                -DSDL2IMAGE_PNM=ON
                -DSDL2IMAGE_QOI=ON
                -DSDL2IMAGE_SVG=ON
                -DSDL2IMAGE_TGA=ON
                -DSDL2IMAGE_TIF=$(usex tiff)
                -DSDL2IMAGE_WEBP=$(usex webp)
                -DSDL2IMAGE_XCF=ON
                -DSDL2IMAGE_XPM=ON
