    - libmediaart:
        category: media-libs
        vars:
          python_compat: python3+
          release: "1.9"
          desc: Manages, extracts and handles media art caches
          homepage: https://gitlab.gnome.org/GNOME/libmediaart
          license: LGPL-2.1+
          slot: 2.0
          iuse: gtk-doc +introspection -qt5 vala
          required_use: |
            vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            !qt5? ( x11-libs/gdk-pixbuf:2 )
            introspection? ( dev-libs/gobject-introspection:= )
            qt5? ( dev-qt/qtgui:5 )
          depend: ${RDEPEND}
          bdepend: |
            dev-libs/gobject-introspection-common
            virtual/pkgconfig
            gtk-doc? ( dev-util/gtk-doc )
            vala? ( $(vala_depend) )
          inherit:
            - gnome3
            - meson
            - vala
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
          body: |
            src_prepare() {
              use vala && vala_src_prepare
              default
            }
            src_configure() {
              local image_library
              if use qt5 ; then
                image_library=qt5
              else
                image_library=gdk-pixbuf
              fi
              local emesonargs=(
                -Dimage_library=${image_library}
                -Dtests=false
                $(meson_use introspection)
                $(meson_use vala vapi)
                $(meson_use gtk-doc gtk_doc)
              )
              meson_src_configure
            }


graphviz_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-gfx
    dir:
      url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags'
      matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/releases/[0-9.]+"
      # https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/14.0.2/graphviz-14.0.2.tar.xz
      # Skip release candidate/beta versions
      #exclude: '90[0-9]$'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/archive/{{ .Values.original_version }}/{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
    vars:
  packages:
    - graphviz:
        vars:
          gitlab_user: graphviz
          gitlab_repo: graphviz
          python_compat: python3+
          inherit:
            - autotools
            - flag-o-matic
            - java-pkg-opt-2
            - python-single-r1
            - qmake-utils
          iuse: +cairo devil doc examples gdk-pixbuf gtk gts guile java lasi nls pdf perl postscript python qt5 qt6 ruby static-libs svg tcl X
          rdepend: |
            >=dev-libs/expat-2
            >=dev-libs/glib-2.11.1:2
            dev-libs/libltdl:0
            >=media-libs/fontconfig-2.3.95
            >=media-libs/freetype-2.1.10
            >=media-libs/gd-2.0.34:=[fontconfig,jpeg,png,truetype,zlib]
            >=media-libs/libpng-1.2:0=
            sys-libs/zlib
            virtual/jpeg:0
            virtual/libiconv
            cairo? (
                x11-libs/cairo
                >=x11-libs/pango-1.12
            )
            devil? ( media-libs/devil[png,jpeg] )
            gtk? ( x11-libs/gtk+:2 )
            gts? ( sci-libs/gts )
            lasi? ( media-libs/lasi )
            pdf? ( app-text/poppler )
            perl? ( dev-lang/perl:= )
            postscript? ( app-text/ghostscript-gpl )
            python? ( ${PYTHON_DEPS} )
            qt5? (
                dev-qt/qtcore:5
                dev-qt/qtgui:5
                dev-qt/qtprintsupport:5
                dev-qt/qtwidgets:5
            )
            ruby? ( dev-lang/ruby:* )
            tcl? ( >=dev-lang/tcl-8.3:0= )
            X? (
                x11-libs/libX11
                x11-libs/libXaw
                x11-libs/libXmu
                x11-libs/libXpm
                x11-libs/libXt
            )
          depend: |
            ${RDEPEND}
            sys-devel/flex
            sys-devel/libtool
            virtual/pkgconfig
            guile? ( dev-lang/swig dev-scheme/guile )
            java? ( dev-lang/swig >=virtual/jdk-1.5 )
            nls? ( >=sys-devel/gettext-0.14.5 )
            perl? ( dev-lang/swig )
            python? ( dev-lang/swig )
            ruby? ( dev-lang/swig )
            tcl? ( dev-lang/swig )

          body: |
            pkg_setup() {
              use guile && guile-single_pkg_setup
              use python && python-single-r1_pkg_setup
            }
            src_prepare() {
              ./autogen.sh
              default
              eautoreconf
            }
            src_configure() {
              # Force detect of the qmake binary
              # without using qtchooser
              # Note if both qt5 and qt6 are enabled
              # qt6 wins
              if use qt5 ; then
                export PATH=$PATH:/usr/lib64/qt5/bin/
              fi
              if use qt6 ; then
                export PATH=$PATH:/usr/lib64/qt6/bin/
              fi

              local myconf=(
                # Speeds up the libltdl configure
                --cache-file="${S}"/config.cache
                --enable-ltdl
                $(use_with cairo pangocairo)
                $(use_with devil)
                $(use_enable gdk-pixbuf)
                $(use_with gtk)
                $(use_with gts)
                $(use_with lasi)
                $(use_with pdf poppler)
                $(use_with postscript ghostscript)
                $(use_enable static-libs static)
                $(use_with X x)
                $(use_with X xaw)
                $(use_with X lefty)
                --with-digcola
                --with-fontconfig
                --with-freetype2
                --with-ipsepcola
                --with-libgd
                --with-sfdp
                --without-ming
                --without-rsvg
                # new/experimental features, to be tested, disable for now
                --with-cgraph
                --without-glitz
                --without-ipsepcola
                --without-smyrna
                --without-visio
                # Bindings:
                $(use_enable guile)
                $(use_enable java)
                $(use_enable perl)
                $(use_enable python python3)
                $(use_enable ruby)
                $(use_with svg rsvg)
                $(use_enable tcl)
                --disable-go
                --disable-io
                --disable-lua
                --disable-ocaml
                --disable-php
                --disable-python
                --disable-r
                --disable-sharp
                # libtool file collision, bug #276609
                --without-included-ltdl
                --disable-ltdl-install
              )

              if use qt6 || use qt5 ; then
                myconf+=(
                  --with-qt
                )
              fi
              econf "${myconf[@]}"
            }
            src_install() {
              default
              find "${ED}" -name '*.la' -delete || die
              use guile && guile_unstrip_ccache
              use python && python_optimize \
                  "${D}"$(python_get_sitedir) \
                  "${ED}"/usr/$(get_libdir)/graphviz/python3
            }
            pkg_postinst() {
              # We need to register all plugins before they become usable
              dot -c || die
            }
            pkg_postrm() {
              # Remove cruft, bug #547344
              rm -rf "${EROOT}"/usr/$(get_libdir)/graphviz/config{,6} || die
            }

tiff:
  generator: builtin-dirlisting
  template:
    engine: helm
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: https://download.osgeo.org/libtiff/
      matcher: 'tiff-.*.tar.xz$'
      exclude: "beta|rc"
    transform:
      - kind: string
        match: "tiff-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      desc: Tag Image File Format (TIFF) library
      homepage: http://libtiff.maptools.org
      license: libtiff
      iuse: +cxx jbig jpeg lzma static-libs webp zlib zstd
      inherit:
        - autotools
        - libtool
      rdepend: |
        jbig? ( media-libs/jbigkit:= )
        jpeg? ( virtual/jpeg )
        lzma? ( app-arch/xz-utils )
        webp? ( media-libs/libwebp:= )
        zlib? ( sys-libs/zlib )
        zstd? ( app-arch/zstd:= )
      depend: '${RDEPEND}'
      body: |
        src_prepare() {
          default
          eautoreconf
        }
        src_configure() {
          local myeconfargs=(
            --without-x
            --with-docdir="${EPREFIX}"/usr/share/doc/${PF}
            $(use_enable cxx)
            $(use_enable jbig)
            $(use_enable jpeg)
            $(use_enable lzma)
            $(use_enable static-libs static)
            $(use_enable webp)
            $(use_enable zlib)
            $(use_enable zstd)
          )
          ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
        }
        src_install() {
          default
          find "${ED}" -type f -name '*.la' -delete || die
        }
  packages:
    - tiff:


gstreamer_stuff:
  generator: builtin-dirlisting
  generator_opts:
    rate_limiter: "1"
    rate_duration: "5s"
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: 'https://gstreamer.freedesktop.org/src/{{ .Values.pkgpath | default .Values.pn }}'
      matcher: '{{ .Values.pkgname | default .Values.pn }}-.*.tar.xz$'
      exclude: "90"
    transform:
      - kind: string
        match: '{{ .Values.pkgname | default .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      license: LGPL-2+
      slot: '1.0'
      homepage: https://gstreamer.freedesktop.org/
      bdepend: |
        virtual/perl-JSON-PP
        virtual/pkgconfig
        sys-apps/sed
    selector:
      # Stable release 1.26
      - '<1.27'

  packages:

    - gst-plugins-vaapi:
        category: media-plugins
        vars:
          desc: Hardware accelerated video decoding through VA-API plugin for GStreamer
          homepage: https://gitlab.freedesktop.org/gstreamer/gstreamer-vaapi
          s: '${WORKDIR}/{{ .Values.pkgname }}-{{ .Values.version }}'
          pkgpath: gstreamer-vaapi/
          pkgname: gstreamer-vaapi
          license: LGPL-2.1+
          iuse: +drm +egl gles2 +opengl wayland +X
          required_use: |
            || ( drm gles2 opengl wayland X )
            gles2? ( egl )
            opengl? ( || ( egl X ) )
          rdepend: |
            dev-libs/glib:2
            >=media-libs/gst-plugins-base-{{ .Values.version }}:{{ .Values.slot }}[egl?,gles2?,opengl?,wayland?,X?]
            media-libs/mesa[gles2?,egl(+)?,X?]
            x11-libs/libva:=[drm?,wayland?,X?]
            drm? (
              virtual/libudev:=
              x11-libs/libdrm
            )
            wayland? ( dev-libs/wayland )
            X? (
              x11-libs/libX11
              x11-libs/libXrandr
              x11-libs/libXrender
            )
          depend: |
            ${RDEPEND}
            dev-util/gtk-doc-am
          inherit:
            - meson
          body: |
            src_configure() {
              local emesonargs=(
                -Dpackage-origin="https://macaronios.org"
                $(meson_feature drm)
                $(meson_feature X x11)
                $(meson_feature wayland)
                $(meson_feature wayland egl)
              )
              if use opengl || use gles2; then
                  emesonargs+=( -Dglx=enabled )
              else
                  emesonargs+=( -Dglx=disabled )
              fi
              # Workaround EGL/eglplatform.h being built with X11 present
              use X || export CFLAGS="${CFLAGS} -DEGL_NO_X11"
              meson_src_configure
            }

    - gst-plugins-libav:
        category: media-plugins
        vars:
          desc: FFmpeg based gstreamer plugin
          homepage: https://gstreamer.freedesktop.org/modules/gst-libav.html
          s: '${WORKDIR}/{{ .Values.pkgname }}-{{ .Values.version }}'
          pkgpath: gst-libav/
          pkgname: gst-libav
          rdepend: |
            dev-libs/glib:2
            >=media-libs/gstreamer-{{ .Values.version }}:1.0
            media-libs/gst-plugins-base:1.0
            media-video/ffmpeg:=
          depend: '${RDEPEND}'
          inherit:
            - meson
          body: |
            src_configure() {
              local emesonargs=(
                -Dpackage-name="GStreamer libav plug-ins (MacaroniOS Linux)"
                -Dpackage-origin="https://macaronios.org"
              )
              meson_src_configure
            }

    - gst-plugins-meta:
        category: media-plugins
        # meta package
        ignore_artefacts: true
        vars:
          desc: Meta ebuild to pull in gst plugins for apps
          pkgname: gstreamer
          pkgpath: gstreamer/
          # tocheck:
          # aac
          iuse: |
            aac a52 alsa cdda dts dv dvb dvd ffmpeg flac http lame
            libass libvisual mp3 modplug mpeg ogg opus oss pulseaudio
            taglib theora v4l vaapi vcd vorbis vpx wavpack X x264
          rdepend: |
            >=media-libs/gstreamer-{{ .Values.version }}:{{ .Values.slot }}
            >=media-libs/gst-plugins-base-{{ .Values.version }}:{{ .Values.slot }}
            >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}
            a52? (
              >=media-libs/gst-plugins-ugly-{{ .Values.version }}:{{ .Values.slot }}[a52dec]
            )
            aac? (
              >=media-libs/gst-plugins-bad-{{ .Values.version }}:{{ .Values.slot }}[aac]
            )
            cdda? ( || (
                >=media-libs/gst-plugins-ugly-{{ .Values.version }}:{{ .Values.slot }}[cdio]
                >=media-libs/gst-plugins-base-{{ .Values.version }}:{{ .Values.slot }}[cdda]
              )
            )
            dts? (
              >=media-libs/gst-plugins-bad-{{ .Values.version }}:{{ .Values.slot }}[dts]
            )
            dvb? (
              >=media-libs/gst-plugins-bad-{{ .Values.version }}:{{ .Values.slot }}[dvb]
            )
            dvd? (
              >=media-libs/gst-plugins-ugly-{{ .Values.version }}:{{ .Values.slot }}[a52dec,dvdread,mpeg2dec]
              >=media-libs/gst-plugins-bad-{{ .Values.version }}:{{ .Values.slot }}[dvd]
            )
            ffmpeg? (
              >=media-plugins/gst-plugins-libav-{{ .Values.version }}:{{ .Values.slot }}
            )
            flac? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[flac]
            )
            http? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[soup]
            )
            lame? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[lame]
            )
            libass? (
              >=media-libs/gst-plugins-bad-{{ .Values.version }}:{{ .Values.slot }}[libass]
            )
            mp3? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[mp3]
            )
            opus? (
              >=media-libs/gst-plugins-bad-{{ .Values.version }}:{{ .Values.slot }}[opus]
            )
            mpeg? (
              >=media-libs/gst-plugins-ugly-{{ .Values.version }}:{{ .Values.slot }}[mpeg2dec]
            )
            pulseaudio? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[pulseaudio]
            )
            modplug? (
              >=media-libs/gst-plugins-bad-{{ .Values.version }}:{{ .Values.slot }}[modplug]
            )
            taglib? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[taglib]
            )
            v4l? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[v4l]
            )
            vaapi? (
              >=media-plugins/gst-plugins-vaapi-{{ .Values.version }}:{{ .Values.slot }}
            )
            vcd? (
              >=media-libs/gst-plugins-ugly-{{ .Values.version }}:{{ .Values.slot }}[mpeg2dec]
              >=media-libs/gst-plugins-bad-{{ .Values.version }}:{{ .Values.slot }}[mplex]
            )
            vpx? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[vpx]
            )
            wavpack? (
              >=media-libs/gst-plugins-good-{{ .Values.version }}:{{ .Values.slot }}[wavpack]
            )
            x264? (
              >=media-libs/gst-plugins-ugly-{{ .Values.version }}:{{ .Values.slot }}[x264]
            )

    - gst-plugins-ugly:
        vars:
          inherit:
          - meson
          desc: Ugly plugins for GStreamer
          iuse: +x264 cdio dvdread a52dec mpeg2dec sidplay +orc +gpl
          rdepend: |
            >=media-libs/gst-plugins-base-{{ .Values.version }}:{{ .Values.slot }}
            orc? ( dev-lang/orc )
            x264? ( media-libs/x264:= )
            dvdread? ( media-libs/libdvdread:= )
            a52dec? ( media-libs/a52dec:= )
            cdio? ( dev-libs/libcdio:= )
            mpeg2dec? ( media-libs/libmpeg2:= )
            sidplay? ( media-libs/libsidplay:= )
          depend: '${RDEPEND}'
          gst_plugins:
            - a52dec
            - cdio
            - dvdread
            - mpeg2dec
            - x264
            - sidplay
          body: |
            src_configure() {
              local emesonargs=(
                {{- range $plugin := .Values.gst_plugins }}
                -D{{ $plugin }}=enabled
                {{- end }}
                $(meson_feature x264)
                $(meson_feature gpl)
                $(meson_feature dvdread)
                $(meson_feature a52dec)
                $(meson_feature cdio)
                $(meson_feature mpeg2dec)
                $(meson_feature sidplay)
                -Dpackage-name="GStreamer ugly plug-ins (MacaroniOS Linux)"
                -Dpackage-origin="https://macaronios.org"
              )
              meson_src_configure
            }

    - gst-plugins-good:
        vars:
          inherit:
            - meson
          desc: Good plugins for GStreamer
          iuse: +orc flac +soup lame +mp3 +pulseaudio taglib v4l udev vpx wavpack
          rdepend: |
            >=media-libs/gst-plugins-base-{{ .Values.version }}:{{ .Values.slot }}
            app-arch/bzip2
            sys-libs/zlib
            orc? ( dev-lang/orc )
            flac? (
              media-libs/flac:=
            )
            soup? (
              net-libs/libsoup:3
            )
            lame? (
              media-sound/lame
            )
            mp3? (
              media-sound/mpg123
            )
            pulseaudio? (
              media-sound/pulseaudio
            )
            taglib? (
              media-libs/taglib:=
            )
            v4l? (
              media-libs/libv4l
              udev? ( dev-libs/libgudev:= )
            )
            vpx? (
              media-libs/libvpx:=
            )
            wavpack? (
              media-sound/wavpack
            )
          depend: '${RDEPEND}'
          gst_plugins:
            - bz2
            - flac
            - cairo
            - jpeg
            - lame
            - mpg123
            - oss
            - pulse
            - png
            - soup
            - taglib
            - v4l2
            - vpx
            - wavpack
          body: |
            src_configure() {
              local emesonargs=(
                {{- range $plugin := .Values.gst_plugins }}
                -D{{ $plugin }}=enabled
                {{- end }}
                $(meson_feature flac)
                $(meson_feature soup)
                $(meson_feature lame)
                $(meson_feature mp3 mpg123)
                $(meson_feature pulseaudio pulse)
                $(meson_feature taglib)
                $(meson_feature v4l v4l2)
                $(meson_feature vpx)
                $(meson_feature wavpack)
                -Dpackage-name="GStreamer good plug-ins (MacaroniOS Linux)"
                -Dpackage-origin="https://macaronios.org"
              )
              if use v4l ; then
                emesonargs+=(
                  -Dv4l2-gudev=$(usex udev enabled disabled)
                )
              fi
              meson_src_configure
            }

    - gst-plugins-bad:
        vars:
          inherit:
            - meson
          desc: Less plugins for GStreamer
          iuse: |
            X bzip2 +egl gles2 +introspection +opengl +orc opus udev vaapi
            vnc wayland aac dts dvb dvd mpeg2enc libass modplug mplex x265
          rdepend: |
            >=media-libs/gstreamer-{{ .Values.version }}:{{ .Values.slot }}[introspection?]
            introspection? ( dev-libs/gobject-introspection )
            bzip2? ( app-arch/bzip2 )
            vnc? ( X? ( x11-libs/libX11 ) )
            wayland? (
              dev-libs/wayland
              x11-libs/libdrm
              dev-libs/wayland-protocols
            )
            orc? ( dev-lang/orc )
            vaapi? (
              x11-libs/libva
              udev? ( dev-libs/libgudev )
            )
            aac? (
              media-libs/faad2
            )
            dts? (
              media-libs/libdca
              orc? ( dev-lang/orc )
            )
            dvd? (
              media-libs/libdvdnav
              media-libs/libdvdread
            )
            mpeg2enc? (
              media-video/mjpegtools
            )
            libass? (
              media-libs/libass:=
            )
            opus? (
              media-libs/opus:=
            )
            modplug? (
              media-libs/libmodplug
            )
            mplex? (
              media-video/mjpegtools
            )
            x265? (
              media-libs/x265
            )
          depend: |
            ${RDEPEND}
            dev-util/gtk-doc-am
          # TODO: there are a lot of others plugins to verify: flite, mpeg2
          gst_plugins:
            - assrender
            - dts
            - dvb
            - faad
            - faac
            - bz2
            - hls
            - ipcpipeline
            - assrender
            - x265
            - librfb
            - modplug
            - mpeg2enc
            - mplex
            - opus
            - resindvd
            - shm
            - va
            - wayland
          body: |
            src_prepare() {
              default
              addpredict /dev # Prevent sandbox violations bug #570624
            }
            src_configure() {
              local emesonargs=(
                {{- range $plugin := .Values.gst_plugins }}
                -D{{ $plugin }}=enabled
                {{- end }}
                -Dtests=disabled
                -Dhls=disabled
                $(meson_feature vnc librfb)
                $(meson_feature vaapi va)
                -Dudev=$(usex udev $(usex vaapi enabled disabled) disabled)
                $(meson_feature vnc librfb)
                -Dx11=$(usex X $(usex vnc enabled disabled) disabled)
                $(meson_feature wayland)
                $(meson_feature aac faad)
                $(meson_feature aac faac)
                $(meson_feature dvd resindvd)
                $(meson_feature mpeg2enc)
                $(meson_feature libass assrender)
                $(meson_feature opus)
                $(meson_feature mplex)
                $(meson_feature dts)
                $(meson_feature x265)
                $(meson_feature modplug)
                -Dpackage-name="GStreamer bad plug-ins (MacaroniOS Linux)"
                -Dpackage-origin="https://macaronios.org"
              )
              if use opengl || use gles2 ; then
                emesonargs+=( -Dgl=enabled )
              else
                emesonargs+=( -Dgl=disabled )
              fi
              if use aac || use dts || use dvd || use mpeg2enc || use mplex || use faad ; then
                emesonargs+=( -Dgpl=enabled )
              else
                emesonargs+=( -Dgpl=disabled )
              fi
              meson_src_configure
            }

    - gst-plugins-base:
        vars:
          inherit:
            - flag-o-matic
            - meson
          desc: Basepack of plugins for gstreamer
          license: GPL-2+ LGPL-2+
          iuse: |
            alsa +egl gbm gles2 +introspection +ogg +opus +opengl
            +orc +pango theora +vorbis wayland +X cdda
          required_use: |
            theora? ( ogg )
            vorbis? ( ogg )
            opengl? (
              || ( egl X ) || ( gbm wayland X )
              wayland? ( egl )
              gbm? ( egl )
            )
          rdepend: |
            media-libs/gstreamer:{{ .Values.slot }}[introspection?]
            app-text/iso-codes
            dev-libs/glib:2
            sys-libs/zlib
            alsa? ( media-libs/alsa-lib )
            introspection? ( dev-libs/gobject-introspection:= )
            ogg? ( media-libs/libogg )
            orc? ( dev-lang/orc )
            pango? ( x11-libs/pango )
            theora? ( media-libs/libtheora )
            vorbis? ( media-libs/libvorbis )
            opus? ( media-libs/opus )
            X? (
              x11-libs/libX11
              x11-libs/libXext
              x11-libs/libXv
            )
            gles2? (
              media-libs/mesa[egl(+)?,gbm(+)?,gles2?,wayland?]
              egl? (
                x11-libs/libdrm
              )
              gbm? (
                dev-libs/libgudev
                x11-libs/libdrm
              )
              wayland? (
                dev-libs/wayland
                dev-libs/wayland-protocols
              )
              media-libs/graphene
              media-libs/libpng:0
              virtual/jpeg
            )
            opengl? (
              media-libs/mesa[egl(+)?,gbm(+)?,gles2?,wayland?]
              egl? (
                x11-libs/libdrm
              )
              gbm? (
                dev-libs/libgudev
                x11-libs/libdrm
              )
              wayland? (
                dev-libs/wayland
                dev-libs/wayland-protocols
              )
              media-libs/graphene
              media-libs/libpng:0
              virtual/jpeg
            )
            cdda? (
              media-sound/cdparanoia
            )
          depend: |
            ${RDEPEND}
            dev-util/gtk-doc-am
            X? ( x11-base/xorg-proto )
          gst_plugins:
            - alsa
            - gl
            - ogg
            - opus
            - pango
            - theora
            - vorbis
            - x11
            - xshm
            - xvideo
          body: |
            src_configure() {
              filter-flags -mno-sse -mno-sse2 -mno-sse4.1 #610340
              local emesonargs=(
                -Dtests=disabled
                -Dtools=enabled
                -Ddrm=enabled
                -Dpackage-name="GStreamer base plug-ins (MacaroniOS Linux)"
                -Dpackage-origin="https://macaronios.org"
                {{- range $plugin := .Values.gst_plugins }}
                -D{{ $plugin }}=enabled
                {{- end }}
                $(meson_feature alsa)
                $(meson_feature ogg)
                $(meson_feature opus)
                $(meson_feature pango)
                $(meson_feature theora)
                $(meson_feature vorbis)
                $(meson_feature X x11)
                $(meson_feature X xshm)
                $(meson_feature X xvideo)
              )
              if use opengl || use gles2 || use cdda ; then
                # because meson doesn't like extraneous commas
                local gl_api=( $(use opengl && echo opengl) $(use gles2 && echo gles2) )
                local gl_platform=( $(use X && use opengl && echo glx) $(use egl && echo egl) )
                local gl_winsys=(
                  $(use X && echo x11)
                  $(use wayland && echo wayland)
                  $(use egl && echo egl)
                  $(use gbm && echo gbm)
                )
                emesonargs+=(
                  -Dgl=enabled
                  -Dgl-graphene=enabled
                  -Dgl_api=$(IFS=, ; echo "${gl_api[*]}")
                  -Dgl_platform=$(IFS=, ; echo "${gl_platform[*]}")
                  -Dgl_winsys=$(IFS=, ; echo "${gl_winsys[*]}")
                )
              else
                emesonargs+=(
                  -Dgl=disabled
                  -Dgl_api=
                  -Dgl_platform=
                  -Dgl_winsys=
                )
              fi
              # Workaround EGL/eglplatform.h being built with X11 present
              use X || export CFLAGS="${CFLAGS} -DEGL_NO_X11"
              meson_src_configure
            }


    - gstreamer-editing-services:
        vars:
          pkgname: gst-editing-services
          inherit:
            - meson
            - python-r1
            - bash-completion-r1
          python_compat: python3+
          desc: SDK for making video editors and more
          homepage: http://wiki.pitivi.org/wiki/GES
          iuse: '+introspection bash-completion'
          required_use: '${PYTHON_REQUIRED_USE}'
          rdepend: |
            ${PYTHON_DEPS}
            dev-libs/glib:2
            dev-libs/libxml2:2=
            >=media-libs/gstreamer-{{ .Values.version }}:1.0[introspection?]
            >=media-libs/gst-plugins-base-{{ .Values.version }}:1.0[introspection?]
            >=media-libs/gst-plugins-bad-{{ .Values.version }}:1.0[introspection?]
            introspection? ( dev-libs/gobject-introspection:= )
            bash-completion? ( app-shells/bash-completion )
          depend: '${RDEPEND}'
          s: '${WORKDIR}/{{ .Values.pkgname }}-{{ .Values.version }}'
          body: |
            src_configure() {
              python_setup
              local emesonargs=(
                -Ddoc=disabled # hotdoc not packaged
                -Dtests=disabled
                -Dxptv=disabled
                -Dpython=enabled
                -Dvalidate=disabled
                -Dexamples=disabled
                $(meson_feature bash-completion)
                $(meson_feature introspection)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              python_moduleinto gi.overrides
              python_foreach_impl python_domodule bindings/python/gi/overrides/GES.py
            }

    - gstreamer:
        vars:
          inherit:
            - meson
          desc: Open source multimedia framework
          iuse: +caps +introspection ptp unwind
          rdepend: |
            dev-libs/glib:2
            caps? ( sys-libs/libcap )
            introspection? ( dev-libs/gobject-introspection:= )
            unwind? (
              sys-libs/libunwind
              dev-libs/elfutils
            )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/rust
            virtual/yacc
            sys-devel/flex
            dev-util/gtk-doc-am
          docs:
            - ChangeLog
            - NEWS
            - MAINTAINERS
            - README.md
            - RELEASE
          body: |
            src_configure() {
              local emesonargs=(
                -Dbenchmarks=disabled
                -Dexamples=disabled
                -Dcheck=enabled
                -Dtests=disabled
                -Dpackage-name="GStreamer (MacaroniOS Linux)"
                -Dpackage-origin="https://macaronios.org"
                $(meson_feature introspection)
                $(meson_feature unwind libunwind)
                $(meson_feature unwind libdw)
              )

              if use caps ; then
                emesonargs+=( -Dptp-helper-permissions=capabilities )
              else
                emesonargs+=(
                  -Dptp-helper-permissions=setuid-root
                  -Dptp-helper-setuid-user=nobody
                  -Dptp-helper-setuid-group=nobody
                )
              fi
              meson_src_configure
            }
            src_install() {
              meson_src_install
              find "${ED}" -name '*.la' -delete || die
            }


gstreamer_rs:
  generator: builtin-dirlisting
  markdevkit_min_version: 0.28.4

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-plugins
    dir:
      url: 'https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags'
      matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags/0.[0-9.]+"
      exclude: 'alpha|gstreamer-'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/archive/{{ .Values.original_version }}/{{ .Values.pn }}-{{ .Values.original_version }}.tar.bz2'

    transform:
      - kind: string
        match: '/gstreamer/gst-plugins-rs/-/tags/'
        replace: ''
    vars:
      gitlab_user: gstreamer
      gitlab_repo: gst-plugins-rs
  extensions_defs:
    rust:
      opts:
        # flavors seems a create without tag and/or not needed
        # for our use case.
        crates_skipped: "flavors"
        creates_git_depth: 100

  packages:

    - gst-plugins-rs:
        selector:
          # 0.15.0 requires gstreamer 1.28
          - '<0.15.0'
        extensions:
          - rust
        inherit:
          - cargo
        vars:
          extra_envs:
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
          desc: GStreamer plugins written in Rust
          inherit:
            - cargo
            - meson
          homepage: https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs
          slot: '1.0'
          rdepend: |
            dev-libs/glib
            x11-libs/gtk:4
            media-libs/gstreamer:1.0
            media-libs/gst-plugins-base:1.0
            media-libs/freetype
            dav1d? (
              media-libs/dav1d
            )
          depend: '${RDEPEND}'
          iuse: +dav1d
          body: |
            src_prepare() {
              default
              rm -rf tutorial
              sed -i -e '/"tutorial"/d' Cargo.toml
            }
            src_configure() {
              MAKEOPTS="-j3"
              cargo_src_configure
              local emesonargs=(
                -Dflavors=disabled
                -Dtests=disabled
                -Dexamples=disabled
                -Ddoc=disabled
                -Dskia=disabled
                #-Danalytics=disabled
              )
              meson_src_configure
              ln -s "${CARGO_HOME}" "${BUILD_DIR}/cargo-home" || die
            }

formulae_brew_pkgs:
  # NOTE: we use adelielinux fork because the sourceforge
  #       version seems unmaintained.
  generator: builtin-json
  generator_opts:
    rate_limiter: "1"
    rate_duration: "5s"
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    json:
      url: 'https://formulae.brew.sh/api/formula/{{ .Values.jsonfile | default .Values.pn }}.json'
      version_filter: '$.versions.stable'
      src_uri_filter: '$.urls.stable.url'
      map_filter_vars:
        desc: '$.desc'
        license: '$.license'
        homepage: '$.homepage'

  packages:

    - gsm:
        category: media-sound
        vars:
          jsonfile: libgsm
          inherit:
            - autotools
          patches:
            - gsm-1.0.23-makefile.patch
          docs:
            - ChangeLog
            - MACHINES
            - MANIFEST
            - README
          body: |
            post_src_unpack() {
              mv gsm-* "${S}"
            }
            src_compile() {
              local myemakeargs=(
                CC="$(tc-getCC)"
                LD="$(tc-getCC)"
                AR="$(tc-getAR)"
                RANLIB="$(tc-getRANLIB)"
              )
              emake -j1 CCFLAGS="${CFLAGS} -c -DNeedFunctionPrototypes=1 -fPIC" "${myemakeargs[@]}"
            }
            src_install() {
              default
              dodir /usr/bin /usr/$(get_libdir) /usr/include/gsm /usr/share/man/man{1,3}
              local myemakeargs=(
                CC="$(tc-getCC)"
                LD="$(tc-getCC)"
                AR="$(tc-getAR)"
                RANLIB="$(tc-getRANLIB)"
                INSTALL_ROOT="${ED}"/usr
                GSM_INSTALL_LIB="${ED}"/usr/$(get_libdir)
                GSM_INSTALL_INC="${ED}"/usr/include/gsm
                GSM_INSTALL_MAN="${ED}"/usr/share/man/man3
                TOAST_INSTALL_MAN="${ED}"/usr/share/man/man1
              )
              emake -j1 "${myemakeargs[@]}" install
              dosym ../gsm/gsm.h /usr/include/libgsm/gsm.h
            }

    - svt-av1:
        vars:
          inherit:
            - cmake
          s: '${WORKDIR}/SVT-AV1-v{{ .Values.version }}'
          bdepend: |
            dev-lang/yasm
          body: |
            src_prepare() {
              # Unused project that triggers the cmake eclasses minimum required cmake check
              rm -rf gstreamer-plugin || die
              cmake_src_prepare
              # Lets not install tests
              sed -e '/install(/d' -i test/CMakeLists.txt || die
            }
            src_configure() {
              local mycmakeargs=(
                -DBUILD_TESTING=OFF
                -DCMAKE_OUTPUT_DIRECTORY="${BUILD_DIR}"
              )
              cmake_src_configure
            }

    - libvisio:
        vars:
          iuse: doc tools
          rdepend: |
            dev-libs/icu:=
            dev-libs/librevenge
            dev-libs/libxml2:=
          depend: |
            ${RDEPEND}
            dev-libs/boost
            dev-util/gperf
            sys-devel/libtool
          bdepend: |
            virtual/pkgconfig
            doc? ( app-doc/doxygen )
          body: |
            src_configure() {
              local myeconfargs=(
                $(use_with doc docs)
                $(use_enable tools)
                --disable-tests
              )
              econf "${myeconfargs[@]}"
            }
            src_install() {
              default
              find "${ED}" -name '*.la' -delete || die
            }

    - lcms:
        vars:
          s: '${WORKDIR}/lcms2-{{ .Values.version }}'
          jsonfile: little-cms2
          slot: 2
          inherit:
            - meson
          iuse: doc jpeg static-libs tiff
          rdepend: |
            jpeg? ( media-libs/libjpeg-turbo:= )
            tiff? ( media-libs/tiff:= )
          depend: '${RDEPEND}'
          body: |
            src_configure() {
              local emesonargs=(
                -Ddefault_library=$(usex static-libs both shared)
                -Dthreaded=true
                -Dfastfloat=true
                -Dutils=true
                -Dtests=disabled
                $(meson_feature jpeg)
                $(meson_feature tiff)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              use doc && dodoc doc/*.pdf
            }

    - libmpeg2:
        vars:
          inherit:
            - autotools
            - eutils
            - libtool
            - ltprune
          iuse: sdl static-libs X
          rdepend: |
            sdl? ( media-libs/libsdl )
            X? (
              x11-libs/libXv
              x11-libs/libICE
              x11-libs/libSM
              x11-libs/libXt
            )
          depend: |
            ${RDEPEND}
            X? ( x11-base/xorg-proto )
          docs:
            - AUTHORS
            - ChangeLog
            - NEWS
            - README
            - TODO
          body: |
            src_configure() {
              ECONF_SOURCE="${S}" \
              econf \
                $(use_enable static-libs static) \
                --enable-shared \
                $(use_enable sdl) \
                $(use_with X x)
            }
            src_compile() {
              emake OPT_CFLAGS="${CFLAGS}" \
                MPEG2DEC_CFLAGS="${CFLAGS}" \
                LIBMPEG2_CFLAGS=""
            }
            src_install() {
              default
              prune_libtool_files --all
              einstalldocs
            }

    - a52dec:
        vars:
          inherit:
            - autotools
            - flag-o-matic
          iuse: djbfft
          rdepend: |
            djbfft? ( sci-libs/djbfft )
          depend: '${RDEPEND}'
          body: |
            src_prepare() {
              default
              sed -i -e '/^CFLAGS = @CFLAGS@ @LIBA52_CFLAGS@/d' liba52/Makefile.am || die
              sed -i -e '/^LIBA52_CFLAGS="$LIBA52_CFLAGS -prefer-non-pic"/d' liba52/configure.incl || die
              sed -i -e '/^CFLAGS = @A52DEC_CFLAGS@/d' src/Makefile.am || die
              eautoreconf
              filter-flags -fprefetch-loop-arrays
            }
            src_configure() {
              ECONF_SOURCE="${S}" econf \
                --disable-static \
                --enable-shared \
                $(use_enable djbfft) \
                --disable-oss
            }
            src_compile() {
              emake CFLAGS="${CFLAGS}"
            }
            src_install() {
              default
              einstalldocs
              dodoc HISTORY doc/liba52.txt
              find "${ED}" -name '*.la' -type f -delete || die
            }


media_libs_gh:
  generator: builtin-github

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: media-libs
    github:
      query: releases
  packages:

    - musicbrainz:
        template: ../../templates/simple.tmpl
        revision: 2
        github:
          user: metabrainz
          repo: libmusicbrainz
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.original_version }}-{{ substr 0 7 .Values.sha }}.tar.gz'
            matcher: '{{ .Values.github_repo }}-.*.tar.gz'
        vars:
          inherit:
            - cmake
          iuse: examples
          s: '${WORKDIR}/{{ .Values.github_repo }}-{{ .Values.original_version }}'
          rdepend: |
            dev-libs/libxml2:=
            net-libs/neon
          depend: '${RDEPEND}'
          slot: '5/1'
          patches:
            - musicbrainz-5.1.0-no-wildcards.patch
            - musicbrainz-5.1.0-libxml2-2.12.patch
            - musicbrainz-5.1.0-libxml2-2.12-compat.patch
          body: |
            src_install() {
              cmake_src_install
              if use examples; then
                docinto examples
                dodoc examples/*.{c,cc,txt}
                docompress -x /usr/share/doc/{{ .Values.pn }}-{{ .Values.original_version }}/examples
              fi
            }

    - libwmf:
        github:
          user: caolanm
          query: tags
        vars:
          inherit:
            - autotools
            - gnome3
          iuse: debug doc expat X
          patches:
            - libwmf-0.2.8.4-build.patch
            - libwmf-0.2.8.4-libpng-1.5.patch
            - libwmf-0.2.8.4-pngfix.patch
          rdepend: |
            app-text/ghostscript-gpl
            media-fonts/urw-fonts
            media-libs/freetype:=
            media-libs/libpng:=
            media-libs/libjpeg-turbo
            sys-libs/zlib
            x11-libs/gdk-pixbuf:2
            expat? ( dev-libs/expat )
            !expat? ( dev-libs/libxml2:= )
            X? (
              x11-libs/libX11
              x11-libs/libXt
              x11-libs/libXpm
            )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
          extra_envs:
            - 'GHOSTSCRIPT_VERSION="9.53.3"'
          body: |
            src_prepare() {
              default
              eautoreconf
            }
            src_configure() {
              local myeconfargs=(
                --disable-gd
                --disable-static
                $(use_enable debug)
                $(use_with expat)
                $(use_with !expat libxml2)
                $(use_with X x)
                --with-docdir=/usr/share/doc/{{ .Values.pn }}-{{ .Values.version }}/
                --with-fontdir=/usr/share/fonts/urw-fonts
                --with-freetype
                --with-gsfontdir=/usr/share/fonts/urw-fonts
                --with-gsfontmap=/usr/share/ghostscript/${GHOSTSCRIPT_VERSION}/Resource/Init/Fontmap
                --with-jpeg
                --with-layers
                --with-png
                --with-sys-gd
                --with-zlib
              )
              econf "${myeconfargs[@]}"
            }
            src_install() {
              MAKEOPTS=-j1
              default
            }
            pkg_postinst() {
              gnome3_pkg_postinst
            }
            pkg_postrm() {
              gnome3_pkg_postrm
            }

    - pipewire:
        # TODO: check if add init.d script
        category: media-video
        github:
          user: PipeWire
          query: tags
        vars:
          desc: Multimedia processing graphs
          homepage: http://pipewire.org/
          python_compat: python3+
          inherit:
            - meson
            - python-any-r1
            - udev
          iuse: |
            bluetooth doc echo-cancel extra elogind flatpak gstreamer jack-client jack-sdk lv2
            modemmanager pipewire-alsa ssl systemd v4l X zeroconf examples
          required_use: |
            jack-sdk? ( !jack-client )
            ?? ( elogind systemd )
          rdepend: |
            media-libs/alsa-lib
            sys-apps/dbus
            sys-libs/readline:=
            sys-libs/ncurses:=
            virtual/libintl
            virtual/libudev
            bluetooth? (
              media-libs/fdk-aac
              media-libs/libldac
              media-libs/libfreeaptx
              media-libs/opus
              media-libs/sbc
              net-wireless/bluez:=
              virtual/libusb:1
            )
            echo-cancel? ( media-libs/webrtc-audio-processing )
            extra? (
              media-libs/libsndfile
            )
            gstreamer? (
              dev-libs/glib:2
              media-libs/gstreamer:1.0
              media-libs/gst-plugins-base:1.0
            )
            jack-client? ( media-sound/jack2[dbus] )
            jack-sdk? (
              !media-sound/jack-audio-connection-kit
              !media-sound/jack2
            )
            lv2? ( media-libs/lilv )
            pipewire-alsa? (
              media-libs/alsa-lib
            )
            ssl? ( dev-libs/openssl:= )
            systemd? ( sys-apps/systemd )
            v4l? ( media-libs/libv4l )
            X? (
              media-libs/libcanberra
              x11-libs/libX11
              x11-libs/libXfixes
            )
            zeroconf? ( net-dns/avahi )
          depend: |
            ${RDEPEND}
            sys-kernel/linux-headers
          bdepend: |
            virtual/pkgconfig
            ${PYTHON_DEPS}
            $(python_gen_any_dep 'dev-python/docutils[${PYTHON_USEDEP}]')
            doc? (
              app-doc/doxygen
              media-gfx/graphviz
            )
          body: |
            src_configure() {
              local emesonargs=(
                -Ddocdir=/usr/share/doc/${PF}
                $(meson_feature zeroconf avahi)
                $(meson_feature doc docs)
                $(meson_feature examples) # TODO: Figure out if this is still important now that media-session gone
                $(meson_feature doc man)
                $(meson_feature gstreamer)
                $(meson_feature gstreamer gstreamer-device-provider)
                $(meson_feature systemd systemd-system-service)
                $(meson_feature systemd systemd-user-service)
                $(meson_feature pipewire-alsa) # Allows integrating ALSA apps into PW graph
                -Dspa-plugins=enabled
                -Dalsa=enabled
                -Dtests=disabled
                -Dinstalled_tests=disabled
                -Daudiomixer=enabled # Matches upstream
                -Daudioconvert=enabled # Matches upstream
                $(meson_feature bluetooth bluez5)
                $(meson_feature bluetooth bluez5-backend-hsp-native)
                $(meson_feature bluetooth bluez5-backend-hfp-native)
                $(meson_feature modemmanager bluez5-backend-native-mm)
                $(meson_feature bluetooth bluez5-backend-ofono)
                $(meson_feature bluetooth bluez5-backend-hsphfpd)
                $(meson_feature bluetooth bluez5-codec-aac)
                $(meson_feature bluetooth bluez5-codec-aptx)
                $(meson_feature bluetooth bluez5-codec-ldac)
                $(meson_feature bluetooth opus)
                $(meson_feature bluetooth bluez5-codec-opus)
                $(meson_feature bluetooth libusb)
                $(meson_feature echo-cancel echo-cancel-webrtc)
                -Dcontrol=enabled # Matches upstream
                -Daudiotestsrc=enabled # Matches upstream
                -Dffmpeg=disabled # Disabled by upstream and no major developments to spa/plugins/ffmpeg/ since May 2020
                $(meson_feature flatpak)
                -Dpipewire-jack=enabled # Allows integrating JACK apps into PW graph
                $(meson_feature jack-client jack) # Allows PW to act as a JACK client
                $(meson_use jack-sdk jack-devel)
                $(usex jack-sdk "-Dlibjack-path=/usr/$(get_libdir)" '')
                -Dsupport=enabled # Miscellaneous/common plugins, such as null sink
                -Devl=disabled # Matches upstream
                -Dtest=disabled # fakesink and fakesource plugins
                $(meson_feature lv2)
                $(meson_feature v4l v4l2)
                -Dlibcamera=disabled # libcamera is not in Portage tree
                $(meson_feature ssl raop)
                -Dvideoconvert=enabled # Matches upstream
                -Dvideotestsrc=enabled # Matches upstream
                -Dvolume=enabled # Matches upstream
                -Dvulkan=disabled # Uses pre-compiled Vulkan compute shader to provide a CGI video source (dev thing; disabled by upstream)
                $(meson_feature extra pw-cat)
                -Dudev=enabled
                -Dudevrulesdir="$(get_udevdir)/rules.d"
                -Dsdl2=disabled # Controls SDL2 dependent code (currently only examples when -Dinstalled_tests=enabled which we never install)
                $(meson_feature extra sndfile) # Enables libsndfile dependent code (currently only pw-cat)
                -Dsession-managers="[]" # All available session managers are now their own projects, so there's nothing to build

                # Just for bell sounds in X11 right now.
                $(meson_feature X x11)
                $(meson_feature X x11-xfixes)
                $(meson_feature X libcanberra)
              )

              if use elogind ; then
                emesonargs+=(
                  -Dlibsystemd=disabled
                  -Dlogind=enabled
                  -Dlogind-provider=libelogind
                )
              fi
              if use systemd ; then
                emesonargs+=(
                  -Dlibsystemd=enabled
                  -Dlogind=enabled
                  -Dlogind-provider=libsystemd
                )
              fi
              meson_src_configure
            }

    - wireplumber:
        category: media-video
        github:
          query: tags
          user: PipeWire
        vars:
          inherit:
            - lua-single
            - meson
            - systemd
            - user
          extra_envs:
            - 'LUA_COMPAT=( lua5-{1,3} )'
          iuse: elogind systemd
          required_use: |
            ${LUA_REQUIRED_USE}
            ?? ( elogind systemd )
          rdepend: |
            ${LUA_DEPS}
            dev-libs/glib:2
            media-video/pipewire:=
            virtual/libintl
            elogind? ( sys-auth/elogind )
            systemd? ( sys-apps/systemd )
          depend: '${RDEPEND}'
          bdepend: |
            dev-util/gdbus-codegen
            sys-devel/gettext
            virtual/pkgconfig
          docs:
            - NEWS.rst
            - README.rst
          body: |
            pkg_setup() {
              lua-single_pkg_setup
              enewgroup pipewire
              enewuser pipewire -1 -1 /var/run/pipewire "pipewire,audio"
            }
            src_configure() {
              local emesonargs=(
                -Ddaemon=true
                -Dtools=true
                -Dmodules=true
                -Ddoc=disabled
                -Dintrospection=disabled # Only used for Sphinx doc generation
                -Dsystem-lua=true # We always unbundle everything we can
                -Dsystem-lua-version=$(ver_cut 1-2 $(lua_get_version))
                $(meson_feature elogind)
                $(meson_feature systemd)
                $(meson_use systemd systemd-system-service)
                $(meson_use systemd systemd-user-service)
                -Dsystemd-system-unit-dir=$(systemd_get_systemunitdir)
                -Dsystemd-user-unit-dir=$(systemd_get_userunitdir)
                -Dtests=false
                -Ddbus-tests=false
              )
              meson_src_configure
            }

    - libraw:
        github:
          query: tags
          user: LibRaw
          repo: LibRaw
        vars:
          inherit:
            - flag-o-matic
            - libtool
            - autotools
            - toolchain-funcs
          iuse: examples hardened jpeg +lcms openmp zlib
          rdepend: |
            jpeg? ( media-libs/libjpeg-turbo:= )
            lcms? ( media-libs/lcms )
            zlib? ( sys-libs/zlib )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
          docs:
            - Changelog.txt
            - README.md
          body: |
            src_prepare() {
              default
              elibtoolize
              eautoreconf
              if tc-is-clang && use openmp ; then
                append-libs omp
              fi
            }
            src_configure() {
              # added in 0.21.3 if selected calloc() will be used to prevent uninitialized heap data leak
              use hardened && append-cppflags "-DLIBRAW_CALLOC_RAWSTORE"
              local myeconfargs=(
                --disable-jasper
                $(use_enable examples)
                $(use_enable jpeg)
                $(use_enable lcms)
                $(use_enable openmp)
                $(use_enable zlib)
              )
              econf "${myeconfargs[@]}"
            }
            src_install() {
              default
              einstalldocs
              # package installs .pc files
              find "${D}" -name '*.la' -name '*.a' -delete || die
            }

    - libjxl:
        github:
          query: tags
        vars:
          iuse: +gdk-pixbuf gif jpeg openexr +png
          inherit:
            - cmake
            - gnome3
          rdepend: |
            app-arch/brotli:=
            dev-cpp/highway
            media-libs/lcms:2
            gdk-pixbuf? (
              dev-libs/glib:2
              x11-libs/gdk-pixbuf:2
            )
            gif? ( media-libs/giflib:= )
            jpeg? ( media-libs/libjpeg-turbo:= )
            openexr? ( media-libs/openexr:= )
            png? ( media-libs/libpng:= )
            x11-misc/shared-mime-info
          depend: '${RDEPEND}'
          body: |
            src_prepare() {
              cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                -DJPEGXL_ENABLE_BENCHMARK=OFF
                -DJPEGXL_ENABLE_COVERAGE=OFF
                -DJPEGXL_ENABLE_FUZZERS=OFF
                -DJPEGXL_ENABLE_SJPEG=OFF
                -DJPEGXL_WARNINGS_AS_ERRORS=OFF
                -DCMAKE_DISABLE_FIND_PACKAGE_GIF=$(usex !gif)
                -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=$(usex !jpeg)
                -DCMAKE_DISABLE_FIND_PACKAGE_PNG=$(usex !png)
                -DJPEGXL_ENABLE_SKCMS=OFF
                -DJPEGXL_ENABLE_VIEWERS=OFF
                -DJPEGXL_FORCE_SYSTEM_BROTLI=ON
                -DJPEGXL_FORCE_SYSTEM_GTEST=ON
                -DJPEGXL_FORCE_SYSTEM_HWY=ON
                -DJPEGXL_FORCE_SYSTEM_LCMS2=ON
                -DJPEGXL_ENABLE_DOXYGEN=OFF
                -DJPEGXL_ENABLE_MANPAGES=OFF
                -DJPEGXL_ENABLE_JNI=OFF
                -DJPEGXL_ENABLE_JPEGLI=OFF
                -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=OFF
                -DJPEGXL_ENABLE_TCMALLOC=OFF
                -DJPEGXL_ENABLE_EXAMPLES=OFF
                -DJPEGXL_ENABLE_TOOLS=ON
                -DJPEGXL_ENABLE_OPENEXR=$(usex openexr)
                -DJPEGXL_ENABLE_PLUGINS=ON
                -DJPEGXL_ENABLE_PLUGIN_GDKPIXBUF=$(usex gdk-pixbuf)
                -DJPEGXL_ENABLE_PLUGIN_GIMP210=OFF
                -DJPEGXL_ENABLE_PLUGIN_MIME=OFF
                -DBUILD_TESTING=OFF
              )
              cmake_src_configure
            }
            src_install() {
              cmake_src_install
              find "${ED}" -name '*.a' -delete || die
            }
            pkg_postinst() {
              use gdk-pixbuf && gnome3_pkg_postinst
            }
            pkg_postrm() {
              use gdk-pixbuf && gnome3_pkg_postrm
            }

    - shaderc:
        template: ../../templates/simple-noindent-github.tmpl
        github:
          user: google
          query: tags
        vars:
          inherit:
            - cmake
            - python-any-r1
          python_compat: python3+
          rdepend: |
            dev-util/glslang
            dev-util/spirv-tools
          depend: |
            ${RDEPEND}
            ${PYTHON_DEPS}
            dev-util/spirv-headers
          body: |
            src_prepare() {
            # Disable third party dependencies
            sed -i -e '/add_subdirectory(third_party)/d' CMakeLists.txt
            # Fix glslc test generation depending on third-party SPIRV-tool
            sed -i -e "s|\$<TARGET_FILE:spirv-dis>|spirv-dis|" \
              glslc/test/CMakeLists.txt || die
            # Disable git versioning
            sed -i -e '/build-version/d' glslc/CMakeLists.txt || die
            # Manually create build-version.inc as we disabled git versioning
            cat <<- EOF > glslc/src/build-version.inc || die
              "${P}\n"
              "$(best_version dev-util/spirv-tools)\n"
              "$(best_version dev-util/glslang)\n"
            EOF
            cmake_src_prepare
            }
            src_configure() {
              local mycmakeargs=(
                -DSHADERC_SKIP_TESTS="true"
                -DSHADERC_ENABLE_WERROR_COMPILE="false"
                -DSHADERC_ENABLE_EXAMPLES=OFF
                -Dglslang_SOURCE_DIR=/usr/include/glslang
              )
              cmake_src_configure
            }


    - graphene:
        github:
          user: ebassi
        transform:
          - kind: string
            match: 'Graphene '
            replace: ''
          - kind: regex
            match: ' \(.*$'
            replace: ''
        vars:
          inherit:
            - xdg-utils
            - meson
            - python-any-r1
          iuse: cpu_flags_arm_neon cpu_flags_x86_sse2 doc +introspection
          rdepend: |
            dev-libs/glib:2
            introspection? ( dev-libs/gobject-introspection:= )
          depend: '${RDEPEND}'
          python_compat: python3+
          bdepend: |
            ${PYTHON_DEPS}
            doc? (
              dev-util/gtk-doc
              app-text/docbook-xml-dtd:4.3
            )
            virtual/pkgconfig
          body: |
            src_prepare() {
              xdg_environment_reset
              default
            }
            src_configure() {
              local emesonargs=(
                -Dgtk_doc=$(usex doc true false)
                -Dgobject_types=true
                -Dgcc_vector=true
                -Dtests=false
                $(meson_use cpu_flags_x86_sse2 sse2)
                $(meson_use cpu_flags_arm_neon arm_neon)
                $(meson_feature introspection)
                -Dinstalled_tests=false
              )
              meson_src_configure
            }

    - openimageio:
        github:
          user: AcademySoftwareFoundation
          repo: OpenImageIO
        vars:
          python_compat: python3+
          desc: A library for reading and writing images
          homepage: "https://openimageio.org/ https://github.com/AcademySoftwareFoundation/OpenImageIO"
          license: Apache-2.0 BSD
          slot: '0/$(ver_cut 1-2)'
          restrict: test
          extra_envs:
            - 'X86_CPU_FEATURES=( aes:aes sse2:sse2 sse3:sse3 ssse3:ssse3 sse4_1:sse4.1 sse4_2:sse4.2 avx:avx avx2:avx2 avx512f:avx512f f16c:f16c )'
            - 'CPU_FEATURES=( ${X86_CPU_FEATURES[@]/#/cpu_flags_x86_} )'
          inherit:
            - cmake
            - font
            - python-single-r1
            - flag-o-matic
          iuse: 'dicom ffmpeg gif jpeg2k jpegxl opencv openvdb python qt6 raw +truetype ${CPU_FEATURES[@]%:*}'
          required_use: 'python? ( ${PYTHON_REQUIRED_USE} )'
          rdepend: |
            >=dev-cpp/robin-map-1.2.0
            >=dev-libs/imath-3.1:=
            >=dev-libs/libfmt-7:=
            >=dev-libs/pugixml-1.8:=
            >=media-libs/libheif-1.11:=
            >=media-libs/libjpeg-turbo-2.1:=
            >=media-libs/libpng-1.6:0=
            >=media-libs/libwebp-1.1:=
            >=media-libs/opencolorio-2.3:=
            >=media-libs/openexr-3.1:=
            >=media-libs/tiff-4.0:0=
            sys-libs/zlib:=
            dicom? ( >=sci-libs/dcmtk-3.6.1:0= )
            ffmpeg? ( >=media-video/ffmpeg-4.0:= )
            gif? ( >=media-libs/giflib-5.0:0= )
            jpeg2k? (
              >=media-libs/openjpeg-2.0:2=
              >=media-libs/openjph-0.21.2:0=
            )
            jpegxl? ( >=media-libs/libjxl-0.10.1:= )
            opencv? ( >=media-libs/opencv-4.0:= )
            openvdb? (
              >=dev-cpp/tbb-2017:=
              >=media-gfx/openvdb-9.0:=
            )
            python? (
              ${PYTHON_DEPS}
              $(python_gen_cond_dep '
                dev-python/numpy[${PYTHON_USEDEP}]
                >=dev-python/pybind11-2.7[${PYTHON_USEDEP}]
              ')
            )
            qt6? (
              dev-qt/qtbase:6[gui]
              virtual/opengl
            )
            raw? ( >=media-libs/libraw-0.20:= )
            truetype? ( >=media-libs/freetype-2.10:2= )
          depend: '${RDEPEND}'
          docs:
            - CHANGES.md
            - CREDITS.md
            - README.md
          body: |
            pkg_setup() {
              use python && python-single-r1_pkg_setup
            }
            src_configure() {
              # Build with SIMD support
              local cpufeature
              local mysimd=()
              for cpufeature in "${CPU_FEATURES[@]}"; do
                use "${cpufeature%:*}" && mysimd+=("${cpufeature#*:}")
              done

              append-ldflags -pthread

              # If no CPU SIMDs were used, completely disable them
              [[ -z ${mysimd} ]] && mysimd=("0")

              local mycmakeargs=(
                -DVERBOSE=ON
                -DCMAKE_CXX_STANDARD=17
                -DOIIO_BUILD_TESTS=OFF
                -DOIIO_BUILD_TOOLS=ON
                -DBUILD_DOCS=OFF
                -DINSTALL_DOCS=OFF
                -DINSTALL_FONTS=$(usex truetype)
                -DSTOP_ON_WARNING=OFF
                -DUSE_CCACHE=OFF
                -DUSE_EXTERNAL_PUGIXML=ON
                -DUSE_SIMD=$(local IFS=','; echo "${mysimd[*]}")
                -DENABLE_DCMTK=$(usex dicom)
                -DENABLE_FFmpeg=$(usex ffmpeg)
                -DENABLE_Freetype=$(usex truetype)
                -DENABLE_GIF=$(usex gif)
                -DENABLE_LibRaw=$(usex raw)
                -DENABLE_OpenCV=$(usex opencv)
                -DENABLE_OpenJPEG=$(usex jpeg2k)
                -DENABLE_OpenVDB=$(usex openvdb)
                -DENABLE_TBB=$(usex openvdb)
                -DUSE_JXL=$(usex jpegxl)
                -DUSE_NUKE=OFF
                -DUSE_OPENJPH=$(usex jpeg2k)
                -DUSE_PTEX=OFF
                -DUSE_PYTHON=$(usex python)
                -DUSE_QT=$(usex qt6)
                -DUSE_R3DSDK=OFF
                -DDISABLE_libuhdr=ON
              )

              if use python; then
                mycmakeargs+=(
                  -DPYTHON_VERSION="${EPYTHON#python}"
                  -DPYTHON_SITE_DIR="$(python_get_sitedir)"
                  -DPython3_EXECUTABLE="${PYTHON}"
                )
              fi

              cmake_src_configure
            }
            src_install() {
              # for font install
              cmake_src_install
            }

    - openjph:
        github:
          user: aous72
          repo: OpenJPH
        vars:
          license: BSD-2
          slot: '0/$(ver_cut 1-2)'
          restrict: test
          iuse: +tiff
          inherit:
            - cmake
          rdepend: |
            tiff? ( media-libs/tiff:0= )
          depend: '${RDEPEND}'
          docs:
            - README.md
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_SHARED_LIBS=ON
                -DOJPH_BUILD_EXECUTABLES=ON
                -DOJPH_ENABLE_TIFF_SUPPORT=$(usex tiff)
                -DOJPH_BUILD_TESTS=OFF
                -DOJPH_BUILD_FUZZER=OFF
                -DOJPH_BUILD_STREAM_EXPAND=OFF
              )
              cmake_src_configure
            }


exempi:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: https://libopenraw.freedesktop.org/exempi/
      matcher: '{{ .Values.pn }}-.*.tar.xz$'

    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      inherit:
        - autotools
        - flag-o-matic
      desc: Port of the Adobe XMP SDK to work on UNIX
      homepage: https://libopenraw.freedesktop.org/wiki/Exempi
      license: BSD
      iuse: examples
      rdepend: |
        dev-libs/expat:=
        sys-libs/zlib
      depend: '${RDEPEND}'
      bdepend: |
        sys-devel/autoconf-archive
        sys-devel/gettext
      body: |
        src_prepare() {
          default
          # Needed for autoconf 2.71
          config_rpath_update .
          eautoreconf
        }
        src_configure() {
          # ODR & SA violations
          filter-lto
          append-flags -fno-strict-aliasing
          econf \
            --enable-static \
            --disable-unittest \
            VALGRIND=""
        }
        src_install() {
          default
          if use examples; then
            emake -C samples/source distclean
            rm samples/{,source,testfiles}/Makefile* || die
            docinto examples
            dodoc -r samples/.
          fi
          # --disable-static breaks tests
          rm -rf "${ED}/usr/$(get_libdir)/libexempi.a" || die
          find "${ED}" -name '*.la' -delete || die
        }

  packages:

    - exempi:

ffmpeg:
  markdevkit_min_version: 0.28.2
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-video
    dir:
      url: https://ffmpeg.org/releases/
      matcher: '{{ .Values.pn }}-.*.tar.xz$'

    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      desc: Complete solution to record/convert/stream audio and video. Includes libavcodec.
      homepage: https://ffmpeg.org/
      inherit:
        - eutils
        - flag-o-matic
        - autotools
        - toolchain-funcs
      flag_map:
        - +bzip2:bzlib
        - cpudetection:runtime-cpudetect
