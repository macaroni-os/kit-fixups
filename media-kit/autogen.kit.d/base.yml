        - lzma
        - +network
        - opencl
        - openssl
        - samba:libsmbclient
        - sdl:ffplay
        - sdl:sdl2
        - vaapi
        - vdpau
        - vulkan
        - X:xlib
        - X:libxcb
        - X:libxcb-shm
        - X:libxcb-xfixes
        - +zlib
        # libavdevice options
        - cdio:libcdio
        - iec61883:libiec61883
        - ieee1394:libdc1394
        - libcaca
        - openal
        - opengl
        # indevs
