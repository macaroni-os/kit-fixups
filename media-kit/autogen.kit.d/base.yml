                $(use_enable projectm)
                $(use_enable pulseaudio pulse)
                $(use_enable qt5 qt)
                $(use_enable rdp freerdp)
                $(use_enable run-as-root)
                $(use_enable samba smbclient)
                $(use_enable sdl-image)
                $(use_enable sftp)
                $(use_enable shout)
                $(use_enable sid)
                $(use_enable skins skins2)
                $(use_enable soxr)
                $(use_enable speex)
                $(use_enable srt)
                $(use_enable ssl gnutls)
                $(use_enable svg)
                $(use_enable svg svgdec)
                $(use_enable taglib)
                $(use_enable theora)
                $(use_enable tremor)
                $(use_enable twolame)
                $(use_enable udev)
                $(use_enable upnp)
                $(use_enable v4l v4l2)
                $(use_enable vaapi libva)
                $(use_enable vdpau)
                $(use_enable vnc)
                $(use_enable vorbis)
                $(use_enable vpx)
                $(use_enable wayland)
                $(use_with X x)
                $(use_enable X xcb)
                $(use_enable X xvideo)
                $(use_enable x264)
                $(use_enable x264 x26410b)
                $(use_enable x265)
                $(use_enable xml libxml2)
                $(use_enable zeroconf avahi)
                $(use_enable zvbi)
                $(use_enable !zvbi telx)
                --with-kde-solid="${EPREFIX}"/usr/share/solid/actions
                --disable-asdcp
                --disable-coverage
                --disable-cprof
                --disable-crystalhd
                --disable-decklink
                --disable-gles2
                --disable-goom
                --disable-kai
                --disable-kva
                --disable-libplacebo
                --disable-maintainer-mode
                --disable-merge-ffmpeg
                --disable-mfx
                --disable-mmal
                --disable-opencv
                --disable-opensles
                --disable-oss
                --disable-rpi-omxil
                --disable-schroedinger
                --disable-shine
                --disable-sndio
                --disable-spatialaudio
                --disable-vsxu
                --disable-wasapi
                --disable-wma-fixed
            )
            # ^ We don't have these disabled libraries in the Portage tree yet.

            # Compatibility fix for Samba 4.
            use samba && append-cppflags "-I/usr/include/samba-4.0"

            append-cxxflags -std=c++11

            # FIXME: Needs libresid-builder from libsidplay:2 which is in another directory...
            append-ldflags "-L/usr/$(get_libdir)/sidplay/builders/"

            if use riscv; then
                append-libs -latomic
            fi

            if use truetype || use bidi; then
                myeconfargs+=( --enable-freetype )
            else
                myeconfargs+=( --disable-freetype )
            fi

            if use truetype || use projectm; then
                local dejavu="${EPREFIX}/usr/share/fonts/dejavu/"
                myeconfargs+=(
                    --with-default-font=${dejavu}/DejaVuSans.ttf
                    --with-default-font-family=Sans
                    --with-default-monospace-font=${dejavu}/DejaVuSansMono.ttf
                    --with-default-monospace-font-family=Monospace
                )
            fi

            econf "${myeconfargs[@]}"

            # _FORTIFY_SOURCE is set to 2 in config.h, which is also the default value on Gentoo.
            # Other values may break the build (bug 523144), so definition should not be removed.
            # To prevent redefinition warnings, we undefine _FORTIFY_SOURCE at the start of config.h
            sed -i '1i#undef _FORTIFY_SOURCE' config.h || die
        }
        src_install() {
            default
            find "${D}" -name '*.la' -delete || die
        }
        pkg_postinst() {
            if [[ -z ${ROOT} ]] && [[ -x "/usr/$(get_libdir)/vlc/vlc-cache-gen" ]] ; then
                einfo "Running /usr/$(get_libdir)/vlc/vlc-cache-gen on /usr/$(get_libdir)/vlc/plugins/"
                "/usr/$(get_libdir)/vlc/vlc-cache-gen" "/usr/$(get_libdir)/vlc/plugins/"
            else
                ewarn "We cannot run vlc-cache-gen (most likely ROOT!=/)"
                ewarn "Please run /usr/$(get_libdir)/vlc/vlc-cache-gen manually"
                ewarn "If you do not do it, vlc will take a long time to load."
            fi
            xdg_pkg_postinst
        }
        pkg_postrm() {
            if [[ -e /usr/$(get_libdir)/vlc/plugins/plugins.dat ]]; then
                rm /usr/$(get_libdir)/vlc/plugins/plugins.dat || die "Failed to rm plugins.dat"
            fi
            xdg_pkg_postrm
        }

  packages:
    - vlc:


vlc_pkgs:
  generator: builtin-dirlisting
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: 'https://download.videolan.org/pub/videolan/{{ .Values.pn }}/'
      matcher: '1.[0-9.]+'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
        url: 'https://download.videolan.org/pub/videolan/{{ .Values.pn }}/{{ .Values.version }}/{{ .Values.pn }}-{{ .Values.version }}.tar.xz'

    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''

  packages:

    - libudfread:
        category: dev-libs
        dir:
          matcher: '1.[0-9.]+.tar.xz$'
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
            url: 'https://download.videolan.org/pub/videolan/{{ .Values.pn }}/{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
        vars:
          inherit:
            - meson
          iuse: static-libs
          desc: Library for reading UDF from raw devices and image files
          homepage: https://code.videolan.org/videolan/libudfread/
          license: LGPL-2.1+
          body: |
            src_configure() {
              local emesonargs=(
                $(meson_use static-libs embed_udfread)
              )
              meson_src_configure
            }

    - libbluray:
        vars:
          inherit:
            - meson
            - java-pkg-opt-2
          desc: Blu-ray playback libraries
          homepage: https://www.videolan.org/developers/libbluray.html
          license: LGPL-2.1
          iuse: aacs bdplus cli +fontconfig java +truetype utils +xml
          rdepend: |
            dev-libs/libudfread
            aacs? ( media-libs/libaccs )
            bdplus? ( media-libs/libbdplus )
            fontconfig? ( media-libs/fontconfig )
            java? ( virtual/jre )
            truetype? ( media-libs/freetype:2 )
            xml? ( dev-libs/libxml2 )
          depend: |
            ${RDEPEND}
          bdepend: |
            virtual/pkgconfig
            java? (
              dev-java/ant-bin
              virtual/jdk
            )
          body: |
            src_configure() {
              use java || unset JDK_HOME
              local emesonargs=(
                $(meson_use utils enable_examples)
                $(meson_use cli enable_tools)
                -Denable_devtools=false
                $(meson_feature java bdj_jar)
                $(meson_feature truetype freetype)
                $(meson_feature xml libxml2)
                $(meson_feature fontconfig)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              use utils &&
                find .libs/ -type f -executable ! -name "${PN}.*" \
                   $(use java || echo '! -name bdj_test') -exec dobin {} +
              use java && java-pkg_regjar "${ED}"/usr/share/${PN}/lib/*.jar
              einstalldocs
              find "${ED}" -name '*.la' -delete || die
            }


