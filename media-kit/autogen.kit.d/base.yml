      encoder_flag_map:
        - amrenc:libvo-amrwbenc
        - mp3:libmp3lame
        - kvazaar:libkvazaar
        - libaom
        - openh264:libopenh264
        - rav1e:librav1e
        - snappy:libsnappy
        - theora:libtheora
        - twolame:libtwolame
        - wavpack:libwavpack
        - webp:libwebp
        - x264:libx264
        - x265:libx265
        - xvid:libxvid
      arm_cpu_features:
        - cpu_flags_arm_thumb:armv5te
        - cpu_flags_arm_v6:armv6
        - cpu_flags_arm_thumb2:armv6t2
        - cpu_flags_arm_neon:neon
        - cpu_flags_arm_vfp:vfp
        - cpu_flags_arm_vfpv3:vfpv3
