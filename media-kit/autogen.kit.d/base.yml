        {{- range $p := .Values.arm_cpu_required_use }}
        {{ $p }}
        {{- end }}
        {{- range $p := .Values.x86_cpu_required_use }}
        {{ $p }}
        {{- end }}

      iuse: |
        alsa chromium doc +encode oss pic static-libs v4l
        +bzip2 cpudetection debug gcrypt +gnutls gmp +gpl
        hardcoded-tables +iconv libxml2 lzma +network opencl
        openssl samba sdl vaapi vdpau vulkan X
        +zlib cdio iec61883 ieee1394 libcaca openal libv4l
        pulseaudio libdrm jack amr codec2 +dav1d fdk jpeg2k
        bluray gme gsm libaribb24 mmal modplug opus libilbc
        librtmp ssh speex srt svg video_cards_nvidia vorbis
        vpx zvbi appkit bs2b chromaprint cuda flite frei0r
        fribidi fontconfig ladspa libass libtesseract lv2
        truetype vidstab rubberband zeromq zimg libsoxr
        +threads amrenc mp3 kvazaar libaom openh264 rav1e
        snappy theora twolame wavpack webp x264 x265 xvid
        opengl
        {{- range $p := .Values.fftools }}
        fftools_{{ $p }}
        {{- end }}
        {{- range $p := .Values.arm_cpu_features }}
        {{- $flag := ( slice ( splitList ":" $p ) 0 1 ) }}
        {{ ( index $flag 0 ) }}
        {{- end }}
        {{- range $p := .Values.x86_cpu_features_raw }}
        cpu_flags_x86_{{ ( index ( slice ( splitList ":" $p ) 0 1 ) 0 ) }}
        {{- end }}

      body: |
        FFTOOLS=(
          {{- range $t := .Values.fftools }}
          {{ $t }}
          {{- end }}
        )
        src_prepare() {
          export revision=git-N-{{ .Values.version }}
          default
        }
        src_configure() {
          local myconf=(
            --enable-avfilter
            --disable-stripping
            --disable-optimizations
            --disable-libcelt
            --prefix="/usr"
            --libdir="/usr/$(get_libdir)"
            --shlibdir="/usr/$(get_libdir)"
            --docdir="/usr/share/doc/{{ .Values.pn }}-{{ .Values.version }}/html"
            --mandir="/usr/share/man"
            --enable-shared
            --cc="$(tc-getCC)"
            --cxx="$(tc-getCXX)"
            --ar="$(tc-getAR)"
            --nm="$(tc-getNM)"
            --ranlib="$(tc-getRANLIB)"
            --pkg-config="$(tc-getPKG_CONFIG)"
            --optflags="${CFLAGS}"
            --target-os=linux
            $(use_enable static-libs static)
          )

          if use openssl && use gpl ; then
            myconf+=( --enable-nonfree )
          fi
          use samba && myconf+=( --enable-version3 )

          # Encoders
          if use encode ; then
            if use amrenc ; then
              myconf+=( --enable-version3 )
            fi
          else
            myconf+=( --disable-encoders )
          fi

          # Indevs
          use v4l || myconf+=( --disable-indev=v4l2 --disable-outdev=v4l2 )
          for i in alsa oss jack ; do
            use ${i} || myconf+=( --disable-indev=${i} )
          done

          # Outdevs
          for i in alsa oss ; do
            use ${i} || myconf+=( --disable-outdev=${i} )
          done

          # Decoders
          use amr && myconf+=( --enable-version3 )
          use gmp && myconf+=( --enable-version3 )
          use libaribb24 && myconf+=( --enable-version3 )
          use fdk && use gpl && myconf+=( --enable-nonfree )

          {{- range $p := .Values.flag_map }}
          {{- $p := $p | replace "+" "" }}
          {{- if contains ":" $p }}
          {{- $use := ( index ( slice ( splitList ":" $p ) 0 1 ) 0 ) }}
          {{- $flag := ( index ( slice ( splitList ":" $p ) 1 2 ) 0 ) }}
          if use {{ $use }} ; then
            myconf+=( --enable-{{ $flag }} )
          else
            myconf+=( --disable-{{ $flag }} )
          fi
          {{- else }}
          if use {{ $p }} ; then
            myconf+=( --enable-{{ $p }} )
          else
            myconf+=( --disable-{{ $p }} )
          fi
          {{- end }}
          {{- end }}

          if use pic ; then
            myconf+=( --enable-pic )
            [[ ${ABI} == x86 ]] && myconf+=( --disable-asm )
          fi

          if use openssl ; then
            myconf+=( --disable-gnutls )
          fi

          # CPU features
          {{- range $cpu := .Values.arm_cpu_features }}
          {{- if contains ":" $cpu }}
          {{- $use := ( index ( slice ( splitList ":" $cpu ) 0 1 ) 0 )}}
          {{- $flag := ( index ( slice ( splitList ":" $cpu ) 1 2 ) 0 )}}
          if ! use {{ $use }} ; then
            myconf+=( --disable-{{ $flag }} )
          fi
          {{- else }}
          if ! use {{ $cpu }} ; then
            myconf+=( --disable-{{ $cpu }} )
          fi
          {{- end }}
          {{- end }}

          # LTO support
          is-flagq "-flto*" && myconf+=( "--enable-lto" )

          einfo "Configure flags\n${myconf[*]}"
          "${S}"/configure "${myconf[@]}" || die "configure failed"
        }
        src_compile() {
          emake V=1
          {{- range $t := .Values.fftools }}
          if use fftools_{{ $t }} ; then
            emake V=1 tools/{{ $t }}$(get_exeext)
          fi
          {{- end }}
          if use chromium ; then
            emake V=1 libffmpeg
          fi
        }
        src_install() {
          emake V=1 DESTDIR="${D}" install install-doc

          {{- range $t := .Values.fftools }}
          if use fftools_{{ $t }} ; then
            dobin tools/{{ $t }}$(get_exeext)
          fi
          {{- end }}

          if use chromium ; then
            emake V=1 DESTDIR="${D}" install-libffmpeg
            QA_FLAGS_IGNORED+=" usr/$(get_libdir)/chromium/.*"
          fi
        }


  packages:

    - ffmpeg:

libcdr:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: media-libs
    dir:
      url: 'https://dev-www.libreoffice.org/src/{{ .Values.pn }}/'
      matcher: '{{ .Values.pn }}-.*.tar.xz$'

    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      desc: Library parsing the Corel cdr documents
      homepage: https://wiki.documentfoundation.org/DLP/Libraries/libcdr
      license: MPL-2.0
      iuse: doc
      rdepend: |
        dev-libs/icu:=
        dev-libs/librevenge
        media-libs/lcms
        sys-libs/zlib
      depend: |
        ${RDEPEND}
        dev-libs/boost
      bdepend: |
        sys-devel/libtool
        virtual/pkgconfig
        doc? ( app-doc/doxygen )
      inherit:
        - autotools
      body: |
        src_prepare() {
            default
            elibtoolize
        }
        src_configure() {
            local myeconfargs=(
                $(use_with doc docs)
                --disable-tests
            )
            econf "${myeconfargs[@]}"
        }
        src_install() {
            default
            find "${D}" -name '*.la' -delete || die
        }

  packages:
    - libcdr:


