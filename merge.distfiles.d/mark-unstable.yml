fallback_mirrors:
  - alias: macaroni-cdn-hash
    uri:
      - https://distfiles.macaronios.org/distfiles
      - https://distfiles-flat.macaronios.org/
    layout:
      modes:
        - type: "content-hash"
          hash: "SHA512"
          hash_mode: "8:8:8"

  - alias: macaroni-cdn-flat
    uri:
      - https://distfiles-flat.macaronios.org/distfiles

  - alias: macaroni-cdn-mark-xl
    uri:
      - https://distfiles.macaronios.org/mark-xl/distfiles
    layout:
      modes:
        - type: "flat"

