  packages:
    - thunderbird-bin:
        vars:
          bdepend: |
            !mail-client/thunderbird-esr-bin
          desc: Thunderbird Mail Client
        dir:
          exclude: 'esr|b[0-9]+'

    - thunderbird-esr-bin:
        vars:
          bdepend: |
            !mail-client/thunderbird-bin
          desc: Thunderbird Mail Client (ESR)
        dir:
          matcher: 'esr'
        transform:
          - kind: string
            match: "esr"
            replace: ""
