    vars:
      license: Apache-2.0
      homepage: 'https://github.com/OpenPrinting/{{ .Values.pn }}'
    transform:
      - kind: string
        match: '{{ .Values.pkgname | default .Values.pn }} '
        replace: ''

  packages:
    - libcupsfilters:
        vars:
          desc: library for developing printing features, split out of cups-filters
          inherit:
            - libtool
          iuse: dbus exif jpeg +poppler +postscript png tiff
          rdepend: |
            >=app-text/qpdf-8.3.0:=
            media-libs/fontconfig
            media-libs/lcms:2
            >=net-print/cups-2
            !<net-print/cups-filters-2.0.0
            exif? ( media-libs/libexif )
            dbus? ( sys-apps/dbus )
            jpeg? ( media-libs/libjpeg-turbo:= )
            postscript? ( app-text/ghostscript-gpl[cups] )
            poppler? ( >=app-text/poppler-0.32:=[cxx] )
            png? ( media-libs/libpng:= )
            tiff? ( media-libs/tiff:= )
          depend: '${RDEPEND}'
          bdepend: |
            >=sys-devel/gettext-0.18.3
            virtual/pkgconfig
          body: |
            src_prepare() {
              default

              # respect --as-needed
              elibtoolize
            }

            src_configure() {
              local myeconfargs=(
                --enable-imagefilters
                --localstatedir="${EPREFIX}"/var
                --with-cups-rundir="${EPREFIX}"/run/cups
                --disable-mutool
                $(use_enable exif)
                $(use_enable dbus)
                $(use_enable poppler)
                $(use_enable postscript ghostscript)
                $(use_with jpeg)
                $(use_with png)
                $(use_with tiff)
              )

              econf "${myeconfargs[@]}"
            }

            src_install() {
              default
              find "${ED}" -name '*.la' -delete || die
            }

    - libppd:
        vars:
          inherit:
            - libtool
          desc: Legacy library for PPD files, split out of cups-filters
          iuse: +postscript +poppler
          required_use: '|| ( postscript poppler )'
          rdepend: |
            >=net-print/cups-2
            net-print/libcupsfilters
            !<net-print/cups-filters-2.0.0
            sys-libs/zlib
            postscript? ( >=app-text/ghostscript-gpl-9.09[cups] )
            poppler? ( >=app-text/poppler-0.32[utils] )
          depend: '${RDEPEND}'
          bdepend: |
            >=sys-devel/gettext-0.18.3
            virtual/pkgconfig
          body: |
            src_prepare() {
              default
              elibtoolize
            }

            src_configure() {
              local myeconfargs=(
                --localstatedir="${EPREFIX}"/var
                --with-cups-rundir="${EPREFIX}"/run/cups
                # This does build time checks for (preferred) tool interfaces.
                $(use_enable postscript ghostscript)
                $(use_enable poppler pdftops)
                # These fallbacks are just probed for the path. Always enable them.
                --with-mutool-path="${EPREFIX}"/usr/bin/mutool
                --with-pdftocairo-path="${EPREFIX}"/usr/bin/pdftocairo
                # unpackaged
                --disable-acroread
              )

              econf "${myeconfargs[@]}"
            }

            src_install() {
              default
              find "${ED}" -name '*.la' -delete || die
            }

    - cups-filters:
        github:
          num_pages: 7
        vars:
          desc: OpenPrinting CUPS filters
          inherit:
            - flag-o-matic
          iuse: +foomatic
          rdepend: |
            net-print/libcupsfilters
            net-print/libppd
            >=net-print/cups-1.7.3
          depend: |
            ${RDEPEND}
            >=sys-devel/gettext-0.18.3
            virtual/pkgconfig
          body: |
            src_configure() {
              local myeconfargs=(
                --enable-driverless
                --enable-ghostscript
                --enable-imagefilters
                --enable-nls
                --enable-poppler
                --enable-universal-cups-filter
                --disable-individual-cups-filters
                --disable-mutool
                --disable-pstops
                --disable-rastertopwg
                --disable-static
                --disable-werror
                --localstatedir="${EPREFIX}"/var
                $(use_enable foomatic)
              )

              econf "${myeconfargs[@]}"
            }

    - cups-browsed:
        vars:
          desc: Daemon to browse the network for remote CUPS queues and IPP printers
          inherit:
            - systemd
          iuse: zeroconf systemd
          rdepend: |
            dev-libs/glib:2
            >=net-print/cups-2
            >=net-print/cups-filters-2.0.0
            zeroconf? ( net-dns/avahi[dbus] )
          depend: |
            ${RDEPEND}
            dev-util/gdbus-codegen
            >=sys-devel/gettext-0.18.3
            virtual/pkgconfig
          body: |
            src_configure() {
              local myeconfargs=(
                --enable-frequent-netif-update
                --enable-nls
                --disable-auto-setup-driverless-only
                --disable-auto-setup-local-only
                --disable-saving-created-queues
                --disable-static
                --disable-werror
                --localstatedir="${EPREFIX}"/var
                --with-cups-rundir="${EPREFIX}"/run/cups
                $(use_enable zeroconf avahi)
              )

              econf "${myeconfargs[@]}"
            }
            src_install() {
              default
              cp "${FILESDIR}"/cups-browsed.init.d "${T}"/cups-browsed || die

              if ! use zeroconf ; then
                  sed -i -e 's:need cupsd avahi-daemon:need cupsd:g' "${T}"/cups-browsed || die
                  sed -i -e 's:cups\.service avahi-daemon\.service:cups.service:g' "${S}"/daemon/cups-browsed.service || die
              fi

              if use systemd ; then
                systemd_dounit "${S}"/daemon/cups-browsed.service
              else
                doinitd "${T}"/cups-browsed
              fi
            }

    - cups:
        assets:
          - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
            url: 'https://github.com/OpenPrinting/{{ .Values.pn }}/releases/download/v{{ .Values.version }}/{{ .Values.pn }}-{{ .Values.version }}-source.tar.gz'
        transform:
          - kind: string
            match: 'v'
            replace: ''
        vars:
          desc: CUPS - Common Unix Printing System
          inherit:
            - autotools
            - pam
            - user
            - xdg
          iuse: acl dbus debug kerberos openssl pam static-libs usb X xinetd zeroconf
          rdepend: |
            app-text/libpaper
            sys-libs/zlib
            acl? (
                kernel_linux? (
                    sys-apps/acl
                    sys-apps/attr
                )
            )
            dbus? ( sys-apps/dbus )
            kerberos? ( virtual/krb5 )
            !openssl? ( net-libs/gnutls:0= )
            openssl? ( dev-libs/openssl )
            pam? ( virtual/pam )
            usb? ( virtual/libusb:1 )
            X? ( x11-misc/xdg-utils )
            xinetd? ( sys-apps/xinetd )
            zeroconf? ( net-dns/avahi )
          depend: |
            ${RDEPEND}
            virtual/pkgconfig
          pdepend: |
            net-print/cups-filters
          patches:
                - cups-nostrip.patch
          body: |
            pkg_setup() {
                enewgroup lp
                enewuser lp -1 -1 -1 lp
                enewgroup lpadmin 106
            }

            src_prepare() {
                default

                # Remove ".SILENT" rule for verbose output (bug 524338).
                sed 's#^.SILENT:##g' -i "${S}"/Makedefs.in || die "sed failed"

                AT_M4DIR=config-scripts eaclocal
                eautoconf
            }

            src_configure() {
                export DSOFLAGS="${LDFLAGS}"

                einfo LINGUAS=\"${LINGUAS}\"

                # explicitly specify compiler wrt bug 524340
                #
                # need to override KRB5CONFIG for proper flags
                # https://github.com/apple/cups/issues/4423
                local myeconfargs=(
                    CC="$(tc-getCC)"
                    CXX="$(tc-getCXX)"
                    KRB5CONFIG="${EPREFIX}"/usr/bin/${CHOST}-krb5-config
                    --libdir="${EPREFIX}"/usr/$(get_libdir)
                    --localstatedir="${EPREFIX}"/var
                    --with-exe-file-perm=755
                    --with-rundir="${EPREFIX}"/run/cups
                    --with-cups-user=lp
                    --with-cups-group=lp
                    --with-dnssd=$(usex zeroconf avahi no)
                    --with-docdir="${EPREFIX}"/usr/share/cups/html
                    --with-languages="${LINGUAS}"
                    --with-pkgconfpath="${EPREFIX}"/usr/$(get_libdir)/pkgconfig
                    --with-system-groups=lpadmin
                    --with-tls=$(usex openssl openssl gnutls)
                    --with-xinetd="${EPREFIX}"/etc/xinetd.d
                    $(use_enable acl)
                    $(use_enable dbus)
                    $(use_enable debug)
                    $(use_enable debug debug-guards)
                    $(use_enable debug debug-printfs)
                    $(use_enable kerberos gssapi)
                    $(use_enable pam)
                    $(use_enable static-libs static)
                    $(use_enable usb libusb)
                    --enable-libpaper
                )

                if tc-is-static-only; then
                    myeconfargs+=(
                        --disable-shared
                    )
                fi

                econf "${myeconfargs[@]}"

                # install in /usr/libexec always, instead of using /usr/lib/cups, as that
                # makes more sense when facing multilib support.
                sed -i -e "s:SERVERBIN.*:SERVERBIN = \"\$\(BUILDROOT\)${EPREFIX}/usr/libexec/cups\":" Makedefs || die
                sed -i -e "s:#define CUPS_SERVERBIN.*:#define CUPS_SERVERBIN \"${EPREFIX}/usr/libexec/cups\":" config.h || die
                sed -i -e "s:cups_serverbin=.*:cups_serverbin=\"${EPREFIX}/usr/libexec/cups\":" cups-config || die

                # additional path corrections needed for prefix, see bug 597728
                sed \
                    -e "s:ICONDIR.*:ICONDIR = ${EPREFIX}/usr/share/icons:" \
                    -e "s:INITDIR.*:INITDIR = ${EPREFIX}/etc:" \
                    -e "s:DBUSDIR.*:DBUSDIR = ${EPREFIX}/etc/dbus-1:" \
                    -e "s:MENUDIR.*:MENUDIR = ${EPREFIX}/usr/share/applications:" \
                    -i Makedefs || die
            }

            src_install() {
                emake BUILDROOT="${D}" install

                dodoc {CHANGES,CREDITS,README}.md

                # move the default config file to docs
                dodoc "${ED}"/etc/cups/cupsd.conf.default
                rm -f "${ED}"/etc/cups/cupsd.conf.default

                # clean out cups init scripts
                rm -rf "${ED}"/etc/{init.d/cups,rc*,pam.d/cups}

                # install our init script
                local neededservices
                use zeroconf && neededservices+=" avahi-daemon"
                use dbus && neededservices+=" dbus"
                [[ -n ${neededservices} ]] && neededservices="need${neededservices}"
                cp "${FILESDIR}"/cupsd.init.d "${T}"/cupsd || die
                sed -i \
                    -e "s/@neededservices@/${neededservices}/" \
                    "${T}"/cupsd || die
                doinitd "${T}"/cupsd

                # install our pam script
                pamd_mimic_system cups auth account

                if use xinetd ; then
                    # correct path
                    sed -i \
                        -e "s:server = .*:server = /usr/libexec/cups/daemon/cups-lpd:" \
                        "${ED}"/etc/xinetd.d/cups-lpd || die
                    # it is safer to disable this by default, bug #137130
                    grep -w 'disable' "${ED}"/etc/xinetd.d/cups-lpd || \
                        { sed -i -e "s:}:\tdisable = yes\n}:" "${ED}"/etc/xinetd.d/cups-lpd || die ; }
                    # write permission for file owner (root), bug #296221
                    fperms u+w /etc/xinetd.d/cups-lpd || die "fperms failed"
                else
                    # always configure with --with-xinetd= and clean up later,
                    # bug #525604
                    rm -rf "${ED}"/etc/xinetd.d
                fi

                keepdir /usr/libexec/cups/driver /usr/share/cups/{model,profiles} \
                    /var/log/cups /var/spool/cups/tmp

                keepdir /etc/cups/{interfaces,ppd,ssl}

                if ! use X ; then
                    rm -r "${ED}"/usr/share/applications || die
                fi

                # create /etc/cups/client.conf, bug #196967 and #266678
                echo "ServerName ${EPREFIX}/run/cups/cups.sock" >> "${ED}"/etc/cups/client.conf

                # the following file is now provided by cups-filters:
                rm -r "${ED}"/usr/share/cups/banners || die

                # the following are created by the init script
                rm -r "${ED}"/var/cache/cups || die
                rm -r "${ED}"/run || die
            }

            pkg_preinst() {
                xdg_pkg_preinst
            }

            pkg_postinst() {
                # Update desktop file database and gtk icon cache (bug 370059)
                xdg_pkg_postinst

                local v

                for v in ${REPLACING_VERSIONS}; do
                    if ! ver_test ${v} -ge 2.2.2-r2 ; then
                        echo
                        ewarn "The cupsd init script switched to using pidfiles. Shutting down"
                        ewarn "cupsd will fail the next time. To fix this, please run once as root"
                        ewarn "   killall cupsd ; /etc/init.d/cupsd zap ; /etc/init.d/cupsd start"
                        echo
                        break
                    fi
                done

                for v in ${REPLACING_VERSIONS}; do
                    echo
                    elog "For information about installing a printer and general cups setup"
                    elog "take a look at: https://wiki.gentoo.org/wiki/Printing"
                    echo
                    break
                done
            }

            pkg_postrm() {
                # Update desktop file database and gtk icon cache (bug 370059)
                xdg_pkg_postrm
            }

gitlab_various:
  generator: builtin-dirlisting
  defaults:
    category: net-libs
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    dir:
      url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/archive/{{ .Values.original_version }}/{{ .Values.pn }}-{{ .Values.original_version }}.tar.bz2'
    vars:
      gitlab_user: accounts-sso
      homepage: 'https://gitlab.com/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}'

  packages:
    - accounts-qt:
        dir:
          matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags/VERSION_[0-9.]+"
        transform:
          - kind: string
            match: 'VERSION_'
            replace: ''
        vars:
          gitlab_repo: libaccounts-qt
          desc: 'Qt6 bindings for libaccounts-glib'
          homepage: https://gitlab.com/accounts-sso/libaccounts-qt
          inherit:
            - qmake-utils
          iuse: doc
          s: '${WORKDIR}/{{ .Values.gitlab_repo }}-{{ .Values.original_version }}'
          keywords: '*'
          license: LGPL-2.1
          slot: 0
          rdepend: |
            >=net-libs/libaccounts-glib-1.23
            dev-libs/glib:2
            dev-qt/qtbase:6
          bdepend: |
            doc? (
                app-doc/doxygen[dot]
                dev-qt/qttools:6[assistant]
            )
          patches:
                - accounts-qt-1.16-libdir.patch
          body: |
            _get_qt6_qmake() {
                echo "${EPREFIX}/usr/$(get_libdir)/qt6/bin/qmake"
            }
            src_prepare() {
                default

                sed -e "s|share/doc/\$\${PROJECT_NAME}|share/doc/${PF}|" \
                    -i doc/doc.pri || die
                sed -e "/QHG_LOCATION/s|qhelpgenerator|${EPREFIX}/usr/$(get_libdir)/qt6/libexec/&|" \
                    -i doc/doxy.conf || die
                if ! use doc; then
                    sed -e "/include( doc\/doc.pri )/d" -i ${PN}.pro || die
                fi
                sed -e '/^SUBDIRS/s/tests//' \
                    -i accounts-qt.pro || die "couldn't disable tests"
            }
            src_configure() {
                $(_get_qt6_qmake) \
                    -makefile \
                    QMAKE_AR="$(tc-getAR) cqs" \
                    QMAKE_CC="$(tc-getCC)" \
                    QMAKE_LINK_C="$(tc-getCC)" \
                    QMAKE_LINK_C_SHLIB="$(tc-getCC)" \
                    QMAKE_CXX="$(tc-getCXX)" \
                    QMAKE_LINK="$(tc-getCXX)" \
                    QMAKE_LINK_SHLIB="$(tc-getCXX)" \
                    QMAKE_OBJCOPY="$(tc-getOBJCOPY)" \
                    QMAKE_RANLIB= \
                    QMAKE_STRIP= \
                    QMAKE_CFLAGS="${CFLAGS}" \
                    QMAKE_CFLAGS_RELEASE= \
                    QMAKE_CFLAGS_DEBUG= \
                    QMAKE_CXXFLAGS="${CXXFLAGS}" \
                    QMAKE_CXXFLAGS_RELEASE= \
                    QMAKE_CXXFLAGS_DEBUG= \
                    QMAKE_LFLAGS="${LDFLAGS}" \
                    QMAKE_LFLAGS_RELEASE= \
                    QMAKE_LFLAGS_DEBUG= \
                    PREFIX="${EPREFIX}"/usr \
                    LIBDIR=$(get_libdir) \
                    || die "qmake failed"
            }
            src_install() {
                emake INSTALL_ROOT="${D}" install
            }

    - signond:
        dir:
          matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags/VERSION_[0-9.]+"
        transform:
          - kind: string
            match: 'VERSION_'
            replace: ''
        vars:
          gitlab_repo: signond
          desc: 'SignOn Daemon (Qt)'
          homepage: https://gitlab.com/accounts-sso/signond
          inherit:
            - qmake-utils
          s: '${WORKDIR}/{{ .Values.gitlab_repo }}-{{ .Values.original_version }}'
          keywords: '*'
          license: LGPL-2.1
          slot: 0
          rdepend: |
            dev-qt/qtbase:6[gui,sql]
            net-libs/libproxy
          body: |
            src_prepare() {
                default

                # Qt6
                sed -i 's/^class QStringList;/#include <QStringList>/' \
                    lib/plugins/SignOn/authpluginif.h || die

                sed -i 's/Q_EXTERN_C/extern "C"/' \
                    lib/plugins/SignOn/authpluginif.h || die

                sed -i 's/QString::SkipEmptyParts/Qt::SkipEmptyParts/g' \
                    src/signond/signonidentityinfo.cpp || die

                sed -i '/m_plugin->mechanisms()\.toSet()\./{N;s/m_plugin->mechanisms()\.toSet()\.\n.*intersect(wantedMechanisms\.toSet())\.toList()/QSet<QString>(m_plugin->mechanisms().begin(), m_plugin->mechanisms().end()).intersect(QSet<QString>(wantedMechanisms.begin(), wantedMechanisms.end())).values()/}' \
                    src/signond/signonsessioncore.cpp || die
                # Add QSet include if missing
                grep -q '#include <QSet>' src/signond/signonsessioncore.cpp || \
                    sed -i '1i #include <QSet>' src/signond/signonsessioncore.cpp || die

                sed -i 's/uiRequest\.unite(params)/uiRequest.insert(params)/' \
                    src/signond/signonidentity.cpp || die
                sed -i 's/return map\.unite(map2)/map.insert(map2);\n    return map/' \
                    src/signond/signonsessioncoretools.cpp || die

                sed -i 's/m_process->pid()/m_process->processId()/g' \
                    src/signond/pluginproxy.cpp || die

                sed -i 's/SUBDIRS   = lib src server tests/SUBDIRS   = lib src server/' \
                    signon.pro || die

                sed -i \
                    -e 's/LIBSIGNON = libsignon-qt5/LIBSIGNON = libsignon-qt6/' \
                    -e 's/CMAKE_BASENAME = SignOnQt5/CMAKE_BASENAME = SignOnQt6/' \
                    common-project-config.pri || die

                sed -i 's/signon-qt5/signon-qt6/g' \
                    lib/SignOn/libsignon-qt.pri || die

                mv lib/SignOn/SignOnQt5Config.cmake.in lib/SignOn/SignOnQt6Config.cmake.in || die
                mv lib/SignOn/SignOnQt5ConfigVersion.cmake.in lib/SignOn/SignOnQt6ConfigVersion.cmake.in || die

                mv lib/SignOn/libsignon-qt5.pc.in lib/SignOn/libsignon-qt6.pc.in || die
                sed -i \
                    -e 's/libsignon-qt5/libsignon-qt6/g' \
                    -e 's/Qt5 bindings/Qt6 bindings/' \
                    -e 's/Requires: Qt5Core/Requires: Qt6Core/' \
                    lib/SignOn/libsignon-qt6.pc.in || die

                sed -i 's/libsignon-qt5\.pc/libsignon-qt6.pc/g' \
                    lib/SignOn/libsignon-qt.pri || die
            }
            _get_qt6_qmake() {
                echo "${EPREFIX}/usr/$(get_libdir)/qt6/bin/qmake"
            }
            src_configure() {
                $(_get_qt6_qmake) \
                    -makefile \
                    QMAKE_AR="$(tc-getAR) cqs" \
                    QMAKE_CC="$(tc-getCC)" \
                    QMAKE_LINK_C="$(tc-getCC)" \
                    QMAKE_LINK_C_SHLIB="$(tc-getCC)" \
                    QMAKE_CXX="$(tc-getCXX)" \
                    QMAKE_LINK="$(tc-getCXX)" \
                    QMAKE_LINK_SHLIB="$(tc-getCXX)" \
                    QMAKE_OBJCOPY="$(tc-getOBJCOPY)" \
                    QMAKE_RANLIB= \
                    QMAKE_STRIP= \
                    QMAKE_CFLAGS="${CFLAGS}" \
                    QMAKE_CFLAGS_RELEASE= \
                    QMAKE_CFLAGS_DEBUG= \
                    QMAKE_CXXFLAGS="${CXXFLAGS}" \
                    QMAKE_CXXFLAGS_RELEASE= \
                    QMAKE_CXXFLAGS_DEBUG= \
                    QMAKE_LFLAGS="${LDFLAGS}" \
                    QMAKE_LFLAGS_RELEASE= \
                    QMAKE_LFLAGS_DEBUG= \
                    PREFIX="${EPREFIX}"/usr \
                    LIBDIR=$(get_libdir) \
                    || die "qmake failed"
            }
            src_install() {
                emake INSTALL_ROOT="${D}" install
            }
