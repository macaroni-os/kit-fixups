          "

      depend: |
        app-arch/unzip
        app-arch/zip
      # x11-libs/gtk+:2 check if is needed
      rdepend: |
        dev-libs/atk
        sys-apps/dbus
        dev-libs/dbus-glib
        dev-libs/glib
