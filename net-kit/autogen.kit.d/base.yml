net_vpn_github:
  generator: builtin-github
  defaults:
    category: net-vpn
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: tags

  packages:

    - openvpn:
        github:
          user: OpenVPN
          query: releases
        vars:
          desc: Robust and highly flexible tunneling application compatible with many OSes
          homepage: https://openvpn.net/
          license: GPL-2
          iuse: |
            down-root examples inotify iproute2 +openssl +lz4 +lzo mbedtls pam
            pkcs11 +plugins selinux static userland_BSD
          inherit:
            - autotools
            - flag-o-matic
            - user
            - tmpfiles
          required_use: |
            static? ( !plugins !pkcs11 )
            pkcs11? ( !mbedtls )
            !plugins? ( !pam !down-root )
            inotify? ( plugins )
          cdepend: |
            kernel_linux? (
              iproute2? ( sys-apps/iproute2[-minimal] )
            )
            lz4? ( app-arch/lz4 )
            lzo? ( dev-libs/lzo )
            mbedtls? ( net-libs/mbedtls:= )
            openssl? ( dev-libs/openssl )
            pam? ( sys-libs/pam )
            pkcs11? ( dev-libs/pkcs11-helper )
            dev-python/docutils
            dev-libs/libnl:3=
          depend: |
            ${CDEPEND}
            dev-python/docutils
          rdepend: |
            selinux? ( sec-policy/selinux-openvpn )
          body: |
            src_prepare() {
              default
              eautoreconf
            }
            src_configure() {
                local -a myeconfargs
                if ! use mbedtls; then
                    myeconfargs+=(
                        $(use_enable pkcs11)
                    )
                fi
                myeconfargs+=(
                    $(use_enable inotify async-push)
                    --with-crypto-library=$(usex mbedtls mbedtls openssl)
                    $(use_enable lz4)
                    $(use_enable lzo)
                    $(use_enable plugins)
                    $(use_enable iproute2)
                    $(use_enable pam plugin-auth-pam)
                    $(use_enable down-root plugin-down-root)
                )
                TMPFILES_DIR="/usr/lib/tmpfiles.d" \
                    IPROUTE=$(usex iproute2 '/bin/ip' '') \
                    econf "${myeconfargs[@]}"
            }
            src_install() {
              default
              find "${ED}/usr" -name '*.la' -delete || die

              # install documentation
              dodoc AUTHORS ChangeLog PORTS README

              # Install some helper scripts
              keepdir /etc/openvpn
              exeinto /etc/openvpn
              doexe "${FILESDIR}/up.sh"
              doexe "${FILESDIR}/down.sh"

              # Install the init script and config file
              newinitd "${FILESDIR}/${PN}-2.1.init" openvpn
              newconfd "${FILESDIR}/${PN}-2.1.conf" openvpn

              # install examples, controlled by the respective useflag
              if use examples ; then
                # dodoc does not supportly support directory traversal, #15193
                docinto examples
                dodoc -r sample contrib
              fi

              doman doc/openvpn.8
            }
            pkg_postinst() {
              # Add openvpn user so openvpn servers can drop privs
              # Clients should run as root so they can change ip addresses,
              # dns information and other such things.
              enewgroup openvpn
              enewuser openvpn "" "" "" openvpn
              tmpfiles_process openvpn.conf

              elog "The openvpn init script expects to find the configuration file"
              elog "openvpn.conf in /etc/openvpn along with any extra files it may need."
              elog ""
              elog "To create more VPNs, simply create a new .conf file for it and"
              elog "then create a symlink to the openvpn init script from a link called"
              elog "openvpn.newconfname - like so"
              elog "   cd /etc/openvpn"
              elog "   ${EDITOR##*/} foo.conf"
              elog "   cd /etc/init.d"
              elog "   ln -s openvpn openvpn.foo"
              elog ""
              elog "You can then treat openvpn.foo as any other service, so you can"
              elog "stop one vpn and start another if you need to."

              if grep -Eq "^[ \t]*(up|down)[ \t].*" "${ROOT}/etc/openvpn"/*.conf 2>/dev/null ; then
                ewarn ""
                ewarn "WARNING: If you use the remote keyword then you are deemed to be"
                ewarn "a client by our init script and as such we force up,down scripts."
                ewarn "These scripts call /etc/openvpn/\$SVCNAME-{up,down}.sh where you"
                ewarn "can move your scripts to."
              fi

              if use plugins ; then
                einfo ""
                einfo "plugins have been installed into /usr/$(get_libdir)/${PN}/plugins"
              fi
            }


    - wireguard-tools:
        github:
          user: WireGuard
        vars:
          desc: Required tools for WireGuard, such as wg(8) and wg-quick(8)
          homepage: https://www.wireguard.com/
          license: GPL-2
          inherit:
            - bash-completion-r1
            - systemd
            - toolchain-funcs
          bdepend: virtual/pkgconfig
          iuse: systemd
          body: |
            src_compile() {
              emake RUNSTATEDIR="${EPREFIX}/run" \
                -C src CC="$(tc-getCC)" LD="$(tc-getLD)"
            }
            src_install() {
              local emakeargs=(
                WITH_BASHCOMPLETION=yes
                WITH_WGQUICK=yes
                DESTDIR="${D}"
                BASHCOMPDIR="$(get_bashcompdir)"
                SYSTEMDUNITDIR="$(systemd_get_systemunitdir)"
                PREFIX="${EPREFIX}/usr"
              )

              if use systemd ; then
                emakeargs+=(
                  WITH_SYSTEMDUNITS=yes
                )
              else
                emakeargs+=(
                  WITH_SYSTEMDUNITS=no
                )
              fi

              dodoc README.md
              dodoc -r contrib
              emake "${emakeargs[@]}" -C src install

              if ! use systemd ; then
                newinitd "${FILESDIR}"/wg-quick.initd wg-quick
              fi
            }



net_misc_github:
  generator: builtin-github
  defaults:
    category: net-misc
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases

  extensions_defs:
    golang:
      opts:

  packages:
    - coredns:
        extensions:
          - golang
        category: net-dns
        vars:
          inherit:
            - go-module
          bdepend: |
            dev-lang/go
          body: |
            src_compile() {
              export GITCOMMIT={{ .Values.sha }}
              unset LDFLAGS
              echo "$(go env GOVERSION | sed 's/go//g')" > .go-version
              emake
            }
            src_install() {
              dobin ${PN}
              insinto /etc/"${PN}"
              doins "${FILESDIR}"/Corefile
              dodoc README.md
              doman man/*
              newinitd "${FILESDIR}"/"${PN}".initd ${PN}
              newconfd "${FILESDIR}"/"${PN}".confd ${PN}
              keepdir /var/log/"${PN}"
            }

    - rclone:
        extensions:
          - golang
        github:
          user: rclone
        transform:
          - kind: string
            match: 'rclone v'
            replace: ''
        vars:
          inherit:
            - bash-completion-r1
            - go-module
          desc: A program to sync files to and from various cloud storage providers
          homepage: https://rclone.org/
          license: Apache-2.0 BSD BSD-2 ISC MIT
          iuse: +mount
          bdepend: |
            dev-lang/go
          rdepend: |
            sys-fs/fuse:3
          body: |
            src_compile() {
              go build -mod=mod . || die "compile failed"
            }
            src_install() {
              dobin ${PN}
              doman ${PN}.1
              dodoc README.md
              ./rclone genautocomplete bash ${PN}.bash || die
              newbashcomp ${PN}.bash ${PN}
              ./rclone genautocomplete zsh ${PN}.zsh || die
              insinto /usr/share/zsh/site-functions
              newins ${PN}.zsh _${PN}
              use mount && insinto /usr/bin && \
                doins ${FILESDIR}/rclonefs && \
                fperms +x /usr/bin/rclonefs
            }


net_libs_github:
  generator: builtin-github
  defaults:
    category: net-libs
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: tags

  packages:

    - libproxy:
        github:
          match: '^[0-9.]+'
        vars:
          inherit:
            - meson
            - vala
          iuse: duktape gnome gtk-doc +introspection vala
          required_use: |
            gtk-doc? ( introspection )
            vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            gnome? ( gnome-base/gsettings-desktop-schemas )
            duktape? (
              dev-lang/duktape:=
              net-misc/curl
            )
            introspection? ( dev-libs/gobject-introspection:= )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
            gtk-doc? ( dev-util/gi-docgen )
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              default
              use vala && vala_src_prepare
            }
            src_configure() {
              local emesonargs=(
                  -Dtests=false
                  -Dconfig-env=true
                  -Dconfig-windows=false
                  -Dconfig-sysconfig=true
                  -Dconfig-osx=false
                  -Dconfig-kde=true
                  -Dconfig-xdp=true
                  $(meson_use gtk-doc docs)
                  $(meson_use vala vapi)
                  $(meson_use duktape pacrunner-duktape)
                  $(meson_use gnome config-gnome)
                  $(meson_use duktape curl)
                  $(meson_use introspection)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              einstalldocs
              if use gtk-doc; then
                mkdir -p "${ED}"/usr/share/gtk-doc/html/ || die
                mv "${ED}"/usr/share/doc/${PN}-1.0 "${ED}"/usr/share/gtk-doc/html/ || die
              fi
            }


    - ngtcp2:
        github:
          query: releases
        transform:
          - kind: string
            match: 'ngtcp2 v'
            replace: ''
        vars:
          inherit:
            - autotools
          iuse: +gnutls openssl +ssl
          required_use: |
            ssl? ( || ( gnutls openssl ) )
          rdepend: |
            ssl? (
              gnutls? ( net-libs/gnutls:= )
              openssl? ( dev-libs/openssl:= )
            )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
          body: |
            src_prepare() {
              default
              eautoreconf
            }
            src_configure() {
              local myeconfargs=(
                --disable-werror
                --enable-lib-only
                $(use_with openssl)
                $(use_with gnutls)
                --without-boringssl
                --without-picotls
                --without-wolfssl
                --without-libev
                --without-libnghttp3
                --without-jemalloc
              )
              ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
            }
            src_install() {
              default
              einstalldocs
              find "${ED}"/usr -type f -name '*.la' -delete || die
            }

    - enet:
        github:
          user: lsalzman
        selector:
          - '<1.4'
        vars:
          slot: "1.3"
          inherit:
            - autotools
            - ltprune
          iuse: static-libs
          body: |
            src_prepare() {
              default
              eautoreconf --force
            }
            src_configure() {
              econf $(use_enable static-libs static)
            }
            src_install() {
              default
              prune_libtool_files
            }

    - libqmi:
        github:
          user: linux-mobile-broadband
        exclude:
          - '-dev|-rc'
        vars:
          desc: "Qualcomm MSM (Mobile Station Modem) Interface (QMI) modem protocol library"
          homepage: https://www.freedesktop.org/wiki/Software/libqmi/ https://gitlab.freedesktop.org/mobile-broadband/libqmi
          license: LGPL-2
          iuse: gtk-doc +mbim +qrtr
          inherit:
            - meson
          cdepend: |
            dev-libs/glib
            dev-libs/libgudev
            mbim? ( net-libs/libmbim )
            qrtr? ( net-libs/libqrtr-glib )
          depend: |
            ${CDEPEND}
          rdepend: |
            ${CDEPEND}
          bdepend: |
            app-shells/bash-completion
            virtual/pkgconfig
            gtk-doc? ( dev-util/gtk-doc )
          body: |
            src_configure() {
              local emesonargs=(
                $(meson_use qrtr)
                $(meson_use mbim mbim_qmux)
                $(meson_use gtk-doc gtk_doc)
                $(meson_use qrtr)
              )
              meson_src_configure
            }

flatpak:
  generator: builtin-github
  defaults:
    category: sys-apps
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases

  packages:

    - libportal:
        category: dev-libs
        github:
          user: flatpak
        vars:
          inherit:
            - meson
            - vala
          iuse: gtk gtk-doc +introspection qt5 qt6 +vala wayland X
          required_use: |
            gtk-doc? ( introspection )
            vala? ( introspection )
          rdepend: |
            dev-libs/glib:2
            introspection? ( dev-libs/gobject-introspection:= )
            gtk? (
              x11-libs/gtk+:3[introspection?,wayland?,X?]
              x11-libs/gtk:4[introspection?,wayland?,X?]
            )
            qt5? ( dev-qt/qtcore:5 )
            qt6? ( dev-qt/qtbase:6[gui] )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
            gtk-doc? ( dev-util/gi-docgen )
            vala? ( $(vala_depend) )
          body: |
            src_prepare() {
              default
              vala_src_prepare
              # Fix qt6 compilation
              sed -i \
              -e 's|^#include <private/qgenericunixservices_p.h>|#include <private/qdesktopunixservices_p.h>|g' \
              -e 's|QGenericUnixServices|QDesktopUnixServices|g' \
              libportal/portal-qt6.cpp
            }
            src_configure() {
              local emesonargs=(
                $(meson_feature gtk backend-gtk3)
                $(meson_feature gtk backend-gtk4)
                $(meson_feature qt5 backend-qt5)
                $(meson_feature qt6 backend-qt6)
                $(meson_use introspection)
                $(meson_use vala vapi)
                $(meson_use gtk-doc docs)
                -Dtests=false
                -Dportal-tests=false
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use gtk-doc; then
                mkdir -p "${ED}"/usr/share/gtk-doc/html/ || die
                mv "${ED}"/usr/share/doc/${PN}-1 "${ED}"/usr/share/gtk-doc/html/ || die
              fi
            }

    - flatpak:
        github:
          user: flatpak
        vars:
          python_compat: "python3+"
          desc: Linux application sandboxing and distribution framework
          homepage: https://flatpak.org/
          license: LGPL-2.1
          iuse: introspection policykit seccomp X gnome kde
          inherit:
            - meson
            - python-any-r1
            - user
          rdepend: |
            sys-fs/libostree
            net-libs/libsoup
            gnome-base/dconf
            dev-libs/appstream
            dev-libs/appstream-glib
            x11-libs/gdk-pixbuf:2
            dev-libs/glib
            dev-libs/libxml2
            sys-apps/dbus
            dev-libs/json-glib
            x11-apps/xauth
            app-arch/libarchive
            app-crypt/gpgme
            sys-fs/fuse
            >=sys-apps/bubblewrap-0.10.0
            dev-util/xdg-dbus-proxy
            policykit? ( sys-auth/polkit )
            seccomp? ( sys-libs/libseccomp )
          depend: ${RDEPEND}
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig
            dev-util/gdbus-codegen
            sys-devel/bison
            introspection? ( dev-libs/gobject-introspection )
            $(python_gen_any_dep '
              dev-python/pyparsing[${PYTHON_USEDEP}]
            ')
            net-misc/socat
          pdepend: |
            gnome? (
              sys-apps/xdg-desktop-portal
              sys-apps/xdg-desktop-portal-gtk
            )
            kde? (
              sys-apps/xdg-desktop-portal
              sys-apps/xdg-desktop-portal-kde
            )
          body: |
            pkg_setup() {
              enewgroup flatpak
              enewuser flatpak -1 -1 /dev/null flatpak
              python-any-r1_pkg_setup
            }
            src_configure() {
              local emesonargs=(
                --localstatedir="${EPREFIX}"/var
                -Ddbus_config_dir=/usr/share/dbus-1/system.d
                -Dsystem_bubblewrap=bwrap
                -Dsystem_dbus_proxy=xdg-dbus-proxy
                -Dtmpfilesdir=/usr/lib/tmpfiles.d
                # Disable doc generation
                -Dgtkdoc=disabled
                -Ddocbook_docs=disabled
                # Disable systemd support
                -Dsystemd=disabled
                $(meson_use gnome gdm_env_file)
                $(meson_use policykit tests)
                $(meson_feature policykit system_helper)
                $(meson_feature introspection gir)
                $(meson_feature X xauth)
                $(meson_feature seccomp seccomp)
              )

              meson_src_configure
            }


alpine:
  generator: builtin-noop

  defaults:
    category: mail-client
    files_dir: "{{ .Values.pn }}"

  packages:
    - alpine:
        template: ../../templates/simple.tmpl
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
            url: "https://alpineapp.email/alpine/patches/alpine-{{ .Values.version }}/alpine-{{ .Values.version }}.tar.xz"
        transform:
          - kind: string
            match: 'alpine-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          homepage: https://alpineapp.email/alpine/index.html
          desc: An easy to use text-based based mail and news client
          license: Apache-2.0
          iuse: ipv6 kerberos ldap passfile nls smime ssl
          inherit:
            - autotools
            - toolchain-funcs
          rdepend: |
            app-misc/mime-types
            sys-libs/ncurses
            kerberos? ( app-crypt/mit-krb5 )
            ldap? ( net-nds/openldap )
            ssl? ( dev-libs/openssl )
          depend: ${RDEPEND}
          body: |
            src_configure() {
              myconf=(
                --without-tcl
                --with-pthread
                --with-system-pinerc="${EPREFIX}"/etc/pine.conf
                --with-system-fixed-pinerc="${EPREFIX}"/etc/pine.conf.fixed
                $(use_with ldap)
                $(use_with ssl)
                $(use_with passfile passfile .pinepwd)
                $(use_with kerberos krb5)
                $(use_enable nls)
                $(use_with ipv6)
                $(use_with smime)
              )

              if has_version "app-text/hunspell"; then
                myconf+=( --with-interactive-spellcheck=/usr/bin/hunspell )
              elif has_version "app-text/aspell"; then
                myconf+=( --with-interactive-spellcheck=/usr/bin/aspell )
              fi

              if use ssl; then
                myconf+=(
                  --with-ssl-include-dir="${EPREFIX}"/usr/include/openssl
                  --with-ssl-lib-dir="${EPREFIX}"/usr/$(get_libdir)
                  --with-ssl-certs-dir="${EPREFIX}"/etc/ssl/certs
                )
              fi


              # Gentoo Bug 935343; see imap/docs/bugs.txt
              if use ipv6; then
                sed -i "s/IP=4/IP=6/" imap/Makefile || die
              fi

              # dial down warnings about unused results
              append-flags -Wno-unused-result

              econf "${myconf[@]}"
            }

          versions:
            - "2.26"

minio:
  generator: builtin-github
  defaults:
    category: net-fs
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    github:
      user: minio
      query: releases
      match: RELEASE
    extensions:
      - golang
    transform:
      - kind: string
        match: 'RELEASE.'
        replace: ''
      - kind: regex
        match: 'T.*'
        replace: ''
      - kind: string
        match: '-'
        replace: '.'
    vars:
      extra_envs:
        - EGO_SKIP_TIDY=1
        - MY_PV="$(ver_cut 1-3)T$(ver_cut 4-7)Z"
        - MY_PV=${MY_PV//./-}
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:

    - minio-client:
        github:
          repo: mc
        vars:
          inherit:
            - go-module
          desc: Fast tool to manage MinIO clusters
          homepage: https://min.io/ https://github.com/minio/mc
          license: AGPL-3.0
          body: |
            src_unpack() {
              go-module_src_unpack
              mv ${WORKDIR}/{{ .Values.github_user}}-{{ .Values.github_repo}}-* ${S} || die
            }
            src_compile() {
              unset XDG_CACHE_HOME
              MINIO_RELEASE="${MY_PV}"
              local minio_ldflags=(
                "-X \"github.com/minio/mc/cmd.Version=${MY_PV}\""
                "-X github.com/minio/mc/cmd.CommitID={{ .Values.sha }}"
                "-X github.com/minio/mc/cmd.ReleaseTag=\"${PV}\""
              )
              CGO_ENABLED=0 go build -ldflags "${minio_ldflags[*]}" -o mc || die
            }
            src_install() {
              dobin mc
            }

    - minio:
        vars:
          extra_envs:
            - EGO_SKIP_TIDY=1
            - EGO_OVERRIDE_GOMOD=0
            - MY_PV="$(ver_cut 1-3)T$(ver_cut 4-7)Z"
            - MY_PV=${MY_PV//./-}
          desc: An Amazon S3 compatible object storage server
          homepage: https://min.io/ https://github.com/minio/minio
          iuse: systemd
          license: Apache-2.0 BSD BSD-2 MIT MPL-2.0
          inherit:
            - go-module
            - user
            - systemd
          body: |
            pkg_setup() {
              enewgroup ${PN}
              enewuser ${PN} -1 -1 /var/lib/${PN} ${PN}
            }
            src_unpack() {
              go-module_src_unpack
              mv ${WORKDIR}/minio-minio-* ${S} || die
            }
            src_compile() {
              unset XDG_CACHE_HOME
              export MINIO_RELEASE="${MY_PV}"
              local minio_ldflags=(
                      "-X github.com/minio/minio/cmd.Version=${MINIO_RELEASE}"
                      "-X github.com/minio/minio/cmd.CopyrightYear=$(date -u '+%Y')"
                      "-X github.com/minio/minio/cmd.ReleaseTag=\"${PV}\""
                      "-X github.com/minio/minio/cmd.CommitID={{ .Value.sha }}"
                      "-X github.com/minio/minio/cmd.ShortCommitID={{ substr 0 7 .Values.sha }}"
              )
              CGO_ENABLED=0 \
                go build --ldflags "${minio_ldflags[*]}" -o ${PN} || die
            }
            src_install() {
              dobin ${PN}
              insinto /etc/"${PN}"
              dodoc -r README.md CONTRIBUTING.md docs
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/minio.service
              else
                newinitd "${FILESDIR}"/minio.initd minio
              fi
              newconfd "${FILESDIR}"/"${PN}".confd ${PN}
              keepdir /var/{lib,log}/"${PN}"
              fowners minio:minio /
            }

forgejo:
  generator: builtin-dirlisting
  defaults:
    category: www-apps
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    extensions:
      - golang

    dir:
      url: https://forgejo.org/releases/
      matcher: 'tag/v14.*'
    transform:
      - kind: string
        match: 'v'
        replace: ''

    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.gz'
        url: 'https://codeberg.org/forgejo/forgejo/archive/v{{ .Values.version }}.tar.gz'

  extensions_defs:
    golang:
      opts:

  packages:

    - forgejo:
        vars:
          desc: A painless self-hosted Git service
          homepage: https://forgejo.org/
          iuse: systemd
          inherit:
            - fcaps
            - go-module
            - tmpfiles
            - systemd
            - flag-o-matic
            - user
          docs:
            - custom/conf/app.example.ini
            - CONTRIBUTING.md
            - README.md
          extra_envs:
            - 'EGO_BUNDLE_POSTFIX="mark-go-bundle"'
            #- 'EGO_SKIP_TIDY=1'
            - FILECAPS=( -m 711 cap_net_bind_service+ep usr/bin/forgejo )
          cdepend: sys-libs/pam
          rdepend: |
            ${CDEPEND}
            dev-vcs/git
          depend: ${CDEPEND}
          bdepend: |
            dev-lang/go
            net-libs/nodejs
          restrict: 'network-sandbox'
          s: '${WORKDIR}/${PN}'
          body: |
            pkg_setup() {
              enewgroup git
              enewuser git -1 /bin/bash /var/lib/forgejo git
            }
            src_prepare() {
              sed -i -e "s#^MODE = console#MODE = file#" custom/conf/app.example.ini || die
              go-module_src_prepare
            }
            src_configure() {
              # bug 832756 - PIE build issues
              filter-flags -fPIE
              filter-ldflags -fPIE -pie
            }
            src_compile() {
              local gitea_tags
              local -a gitea_settings makeenv
              # PAM tags die for this error:
              # transaction.go:409:55: could not determine what C.RTLD_NEXT refers to
              gitea_tags="bindata sqlite sqlite_unlock_notify"
              gitea_settings=(
                "-X forgejo.org/modules/setting.CustomConf=/etc/forgejo/app.ini"
                "-X forgejo.org/modules/setting.CustomPath=/var/lib/forgejo/custom"
                "-X forgejo.org/modules/setting.AppWorkPath=/var/lib/forgejo"
              )
              export FORGEJO_VERSION="${PV}"
              makeenv=(
                LDFLAGS="-extldflags \"${LDFLAGS}\" ${gitea_settings[*]}"
                TAGS="${gitea_tags}"
              )
              # Use variable STORED_VERSION_FILE (the "${S}/VERSION" file) to set version,
              # and prevent executing git command when it's not a live version.
              makeenv+=( GITHUB_REF_NAME="" )
              # We need frontend for assets
              env "${makeenv[@]}" emake -j1 frontend
              env "${makeenv[@]}" emake -j1 backend
            }
            src_install() {
              newbin gitea forgejo
              einstalldocs
              newconfd "${FILESDIR}/forgejo.confd" forgejo
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/forgejo.service forgejo.service
              else
                newinitd "${FILESDIR}/forgejo.initd" forgejo
              fi
              newtmpfiles - forgejo.conf <<-EOF
                d /run/forgejo 0755 git git
              EOF
              insinto /etc/forgejo
              newins custom/conf/app.example.ini app.ini
              fowners root:git /etc/forgejo/{,app.ini}
              fperms g+w,o-rwx /etc/forgejo/{,app.ini}
              diropts -m0750 -o git -g git
              keepdir /var/lib/forgejo /var/lib/forgejo/custom /var/lib/forgejo/data
              keepdir /var/log/forgejo
            }
            pkg_postinst() {
              fcaps_pkg_postinst
              tmpfiles_process forgejo.conf
            }

git_servers:
  generator: builtin-github
  defaults:
    category: www-apps
    template: ../../templates/simple-github.tmpl
    files_dir: "{{ .Values.pn }}"
    github:
      query: releases
    extensions:
      - golang

  extensions_defs:
    golang:
      opts:

  packages:

    - gogs:
        vars:
          iuse: pam cert mysql postgres +sqlite ssh systemd
          extra_envs:
            - 'EGO_SKIP_TIDY=1'
          inherit:
            - go-module
            - systemd

          bdepend: dev-lang/go
          cdepend: |
            pam? (
              sys-libs/pam
            )
          depend: '${CDEPEND}'
          rdepend: |
            ${CDEPEND}
            dev-vcs/git
            ssh? ( net-misc/openssh )
            mysql? (
              || (
                dev-db/mariadb
                dev-db/mysql-community
              )
            )
            postgres? ( dev-db/postgresql )
            sqlite? ( dev-db/sqlite )
          docs:
            - CHANGELOG.md
            - README.md
            - SECURITY.md
          body: |
            src_compile() {
              local tags=()
              local custom_flags=()

              if use pam ; then
                tags+=( pam )
              fi
              if use cert ; then
                tags+=( cert )
              fi

              if [ "${#tags[@]}" != "0" ] ; then
                custom_flags=(-tags "${tags[@]}" )
              fi

              local withcgo="0"
              if use sqlite ; then
                # Sqlite requires CGO
                withcgo="1"
              fi
              CGO_ENABLED=${withcgo} go build ${custom_ldflags[*]} \
                -o ${PN} -v -x . || die
            }
            src_install() {
              dobin {{ .Values.pn }}
              einstalldocs
              newconfd "${FILESDIR}/{{ .Values.pn }}.confd" {{ .Values.pn }}
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/gogs.service gogs.service
              else
                newinitd "${FILESDIR}/gogs.initd" gogs
              fi
              insinto /usr/share/gogs/
              newins conf/app.ini app.example.ini
              insinto /usr/share/gogs/auth.d
              for i in conf/auth.d/*.example ; do
                doins ${i}
              done
              diropts -m0750 -o git -g git
              keepdir /var/lib/gogs /var/lib/gogs/custom/https /var/log/gogs /etc/gogs
            }


    - gitea:
        github:
          user: go-gitea
        tarball: gitea-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}.tar.gz
        vars:
          desc: A painless self-hosted Git service
          homepage: https://gitea.com https://github.com/go-gitea/gitea
          iuse: systemd
          inherit:
            - fcaps
            - go-module
            - tmpfiles
            - systemd
            - flag-o-matic
            - user
          docs:
            - custom/conf/app.example.ini
            - CHANGELOG.md
            - CONTRIBUTING.md
            - README.md
          extra_envs:
            - FILECAPS=( -m 711 cap_net_bind_service+ep usr/bin/gitea )
          cdepend: sys-libs/pam
          rdepend: |
            ${CDEPEND}
            dev-vcs/git
          depend: |
            ${CDEPEND}
            dev-util/pnpm-bin

          # Atm we haven't node_modules from bundle.
          restrict: 'network-sandbox'
          bdepend: dev-lang/go
          body: |
            pkg_setup() {
              enewgroup git
              enewuser git -1 /bin/bash /var/lib/gitea git
            }
            src_prepare() {
              sed -i -e "s#^MODE = console#MODE = file#" custom/conf/app.example.ini || die
              go-module_src_prepare
            }
            src_configure() {
              # bug 832756 - PIE build issues
              filter-flags -fPIE
              filter-ldflags -fPIE -pie
            }
            src_compile() {
              local gitea_tags
              local -a gitea_settings makeenv
              gitea_tags="bindata pam sqlite sqlite_unlock_notify"
              gitea_settings=(
                "-X code.gitea.io/gitea/modules/setting.CustomConf=/etc/gitea/app.ini"
                "-X code.gitea.io/gitea/modules/setting.CustomPath=/var/lib/gitea/custom"
                "-X code.gitea.io/gitea/modules/setting.AppWorkPath=/var/lib/gitea"
              )
              export GITEA_VERSION="${PV}"
              makeenv=(
                LDFLAGS="-extldflags \"${LDFLAGS}\" ${gitea_settings[*]}"
                TAGS="${gitea_tags}"
              )
              # Use variable STORED_VERSION_FILE (the "${S}/VERSION" file) to set version,
              # and prevent executing git command when it's not a live version.
              makeenv+=( GITHUB_REF_NAME="" )
              env "${makeenv[@]}" emake -j1 frontend
              env "${makeenv[@]}" emake backend
            }
            src_install() {
              dobin gitea
              einstalldocs
              newconfd "${FILESDIR}/gitea.confd-r1" gitea
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/gitea.service-r4 gitea.service
              else
                newinitd "${FILESDIR}/gitea.initd-r3" gitea
              fi
              newtmpfiles - gitea.conf <<-EOF
                d /run/gitea 0755 git git
              EOF
              insinto /etc/gitea
              newins custom/conf/app.example.ini app.ini
              fowners root:git /etc/gitea/{,app.ini}
              fperms g+w,o-rwx /etc/gitea/{,app.ini}
              diropts -m0750 -o git -g git
              keepdir /var/lib/gitea /var/lib/gitea/custom /var/lib/gitea/data
              keepdir /var/log/gitea
            }
            pkg_postinst() {
              fcaps_pkg_postinst
              tmpfiles_process gitea.conf
            }

