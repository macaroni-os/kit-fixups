alpine:
  generator: builtin-noop
  template:
    engine: helm

  defaults:
    category: mail-client
    files_dir: "{{ .Values.pn }}"

  packages:
    - alpine:
        template: ../../templates/simple.tmpl
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
            url: "https://alpineapp.email/alpine/patches/alpine-{{ .Values.version }}/alpine-{{ .Values.version }}.tar.xz"
        transform:
          - kind: string
            match: 'alpine-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          homepage: https://alpineapp.email/alpine/index.html
          desc: An easy to use text-based based mail and news client
          license: Apache-2.0
          iuse: ipv6 kerberos ldap passfile nls smime ssl
          inherit:
            - autotools
            - toolchain-funcs
          rdepend: |
            app-misc/mime-types
            sys-libs/ncurses
            kerberos? ( app-crypt/mit-krb5 )
            ldap? ( net-nds/openldap )
            ssl? ( dev-libs/openssl )
          depend: ${RDEPEND}
          body: |
            src_configure() {
              myconf=(
                --without-tcl
                --with-pthread
                --with-system-pinerc="${EPREFIX}"/etc/pine.conf
                --with-system-fixed-pinerc="${EPREFIX}"/etc/pine.conf.fixed
                $(use_with ldap)
                $(use_with ssl)
                $(use_with passfile passfile .pinepwd)
                $(use_with kerberos krb5)
                $(use_enable nls)
                $(use_with ipv6)
                $(use_with smime)
              )

              if has_version "app-text/hunspell"; then
                myconf+=( --with-interactive-spellcheck=/usr/bin/hunspell )
              elif has_version "app-text/aspell"; then
                myconf+=( --with-interactive-spellcheck=/usr/bin/aspell )
              fi

              if use ssl; then
                myconf+=(
                  --with-ssl-include-dir="${EPREFIX}"/usr/include/openssl
                  --with-ssl-lib-dir="${EPREFIX}"/usr/$(get_libdir)
                  --with-ssl-certs-dir="${EPREFIX}"/etc/ssl/certs
                )
              fi


              # Gentoo Bug 935343; see imap/docs/bugs.txt
              if use ipv6; then
                sed -i "s/IP=4/IP=6/" imap/Makefile || die
              fi

              # dial down warnings about unused results
              append-flags -Wno-unused-result

              econf "${myconf[@]}"
            }

          versions:
            - "2.26"

minio:
  generator: builtin-github
  defaults:
    category: net-fs
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    github:
      user: minio
      query: releases
      match: RELEASE
    extensions:
      - golang
    transform:
      - kind: string
        match: 'RELEASE.'
        replace: ''
      - kind: regex
        match: 'T.*'
        replace: ''
      - kind: string
        match: '-'
        replace: '.'
    vars:
      extra_envs:
        - EGO_SKIP_TIDY=1
        - MY_PV="$(ver_cut 1-3)T$(ver_cut 4-7)Z"
        - MY_PV=${MY_PV//./-}
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:

    - minio-client:
        github:
          repo: mc
        vars:
          inherit:
            - go-module
          desc: Fast tool to manage MinIO clusters
          homepage: https://min.io/ https://github.com/minio/mc
          license: AGPL-3.0
          body: |
            src_prepare() {
              default
              sed -i -e "s/time.Now().UTC().Format(time.RFC3339)/\"${MY_PV}\"/"\
                -e "s/-s //"\
                -e "/time/d"\
                -e "s/+ commitID()/+ \"{{ .Values.sha }}\"/"\
                buildscripts/gen-ldflags.go || die
            }
            src_unpack() {
              go-module_src_unpack
              mv ${WORKDIR}/{{ .Values.github_user}}-{{ .Values.github_repo}}-* ${S} || die
            }
            src_compile() {
              unset XDG_CACHE_HOME
              MINIO_RELEASE="${MY_PV}"
              go run buildscripts/gen-ldflags.go
              CGO_ENABLED=0 \
                go build --ldflags "$(go run buildscripts/gen-ldflags.go)" -o mc || die
            }
            src_install() {
              dobin mc
            }

    - minio:
        vars:

          desc: An Amazon S3 compatible object storage server
          homepage: https://min.io/ https://github.com/minio/minio
          iuse: systemd
          license: Apache-2.0 BSD BSD-2 MIT MPL-2.0
          inherit:
            - go-module
            - user
            - systemd
          body: |
            pkg_setup() {
              enewgroup ${PN}
              enewuser ${PN} -1 -1 /var/lib/${PN} ${PN}
            }
            src_prepare() {
              default
              sed -i -e "s/time.Now().UTC().Format(time.RFC3339)/\"${MY_PV}\"/"\
                -e "s/-s //"\
                -e "/time/d"\
                -e "s/+ commitID()/+ \"{{ .Values.sha }}\"/"\
                buildscripts/gen-ldflags.go || die
            }
            src_unpack() {
              go-module_src_unpack
              mv ${WORKDIR}/minio-minio-* ${S} || die
            }
            src_compile() {
              unset XDG_CACHE_HOME
              MINIO_RELEASE="${MY_PV}"
              go run buildscripts/gen-ldflags.go
              CGO_ENABLED=0 \
                go build --ldflags "$(go run buildscripts/gen-ldflags.go)" -o ${PN} || die
            }
            src_install() {
              dobin ${PN}
              insinto /etc/"${PN}"
              dodoc -r README.md CONTRIBUTING.md docs
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/minio.service
              else
                newinitd "${FILESDIR}"/minio.initd minio
              fi
              newconfd "${FILESDIR}"/"${PN}".confd ${PN}
              keepdir /var/{lib,log}/"${PN}"
              fowners minio:minio /
            }

gitea:
  generator: builtin-github
  defaults:
    category: www-apps
    template: ../../templates/simple-github.tmpl
    files_dir: "{{ .Values.pn }}"
    github:
      query: releases
    extensions:
      - golang

  extensions_defs:
    golang:
      opts:

  packages:
    - gogs:
        vars:
          iuse: pam cert mysql postgres +sqlite ssh systemd
          extra_envs:
            - 'EGO_SKIP_TIDY=1'
          inherit:
            - go-module
            - systemd

          bdepend: dev-lang/go
          cdepend: |
            pam? (
              sys-libs/pam
            )
          depend: '${CDEPEND}'
          rdepend: |
            ${CDEPEND}
            dev-vcs/git
            ssh? ( net-misc/openssh )
            mysql? (
              || (
                dev-db/mariadb
                dev-db/mysql-community
              )
            )
            postgres? ( dev-db/postgresql )
            sqlite? ( dev-db/sqlite )
          docs:
            - CHANGELOG.md
            - README.md
            - SECURITY.md
          body: |
            src_compile() {
              local tags=()
              local custom_flags=()

              if use pam ; then
                tags+=( pam )
              fi
              if use cert ; then
                tags+=( cert )
              fi

              if [ "${#tags[@]}" != "0" ] ; then
                custom_flags=(-tags "${tags[@]}" )
              fi

              local withcgo="0"
              if use sqlite ; then
                # Sqlite requires CGO
                withcgo="1"
              fi
              CGO_ENABLED=${withcgo} go build ${custom_ldflags[*]} \
                -o ${PN} -v -x . || die
            }
            src_install() {
              dobin {{ .Values.pn }}
              einstalldocs
              newconfd "${FILESDIR}/{{ .Values.pn }}.confd" {{ .Values.pn }}
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/gogs.service gogs.service
              else
                newinitd "${FILESDIR}/gogs.initd" gogs
              fi
              insinto /usr/share/gogs/
              newins conf/app.ini app.example.ini
              insinto /usr/share/gogs/auth.d
              for i in conf/auth.d/*.example ; do
                doins ${i}
              done
              diropts -m0750 -o git -g git
              keepdir /var/lib/gogs /var/lib/gogs/custom/https /var/log/gogs /etc/gogs
            }


    - gitea:
        github:
          user: go-gitea
        tarball: gitea-{{ .Values.version }}-{{ substr 0 7 .Values.sha }}.tar.gz
        vars:
          desc: A painless self-hosted Git service
          homepage: https://gitea.com https://github.com/go-gitea/gitea
          iuse: systemd
          inherit:
            - fcaps
            - go-module
            - tmpfiles
            - systemd
            - flag-o-matic
            - user
          docs:
            - custom/conf/app.example.ini
            - CHANGELOG.md
            - CONTRIBUTING.md
            - README.md
          extra_envs:
            - FILECAPS=( -m 711 cap_net_bind_service+ep usr/bin/gitea )
          cdepend: sys-libs/pam
          rdepend: |
            ${CDEPEND}
            dev-vcs/git
          depend: ${CDEPEND}
          bdepend: dev-lang/go
          body: |
            pkg_setup() {
              enewgroup git
              enewuser git -1 /bin/bash /var/lib/gitea git
            }
            src_prepare() {
              default
              sed -i -e "s#^MODE = console#MODE = file#" custom/conf/app.example.ini || die
            }
            src_configure() {
              # bug 832756 - PIE build issues
              filter-flags -fPIE
              filter-ldflags -fPIE -pie
            }
            src_compile() {
              local gitea_tags
              local -a gitea_settings makeenv
              gitea_tags="bindata,pam,sqlite,sqlite_unlock_notify"
              gitea_settings=(
                "-X code.gitea.io/gitea/modules/setting.CustomConf=/etc/gitea/app.ini"
                "-X code.gitea.io/gitea/modules/setting.CustomPath=/var/lib/gitea/custom"
                "-X code.gitea.io/gitea/modules/setting.AppWorkPath=/var/lib/gitea"
              )
              makeenv=(
                LDFLAGS="-extldflags \"${LDFLAGS}\" ${gitea_settings[*]}"
                TAGS="${gitea_tags}"
              )
              # Use variable STORED_VERSION_FILE (the "${S}/VERSION" file) to set version,
              # and prevent executing git command when it's not a live version.
              makeenv+=( GITHUB_REF_NAME="" )
              env "${makeenv[@]}" emake backend
            }
            src_install() {
              dobin gitea
              einstalldocs
              newconfd "${FILESDIR}/gitea.confd-r1" gitea
              if use systemd ; then
                systemd_newunit "${FILESDIR}"/gitea.service-r4 gitea.service
              else
                newinitd "${FILESDIR}/gitea.initd-r3" gitea
              fi
              newtmpfiles - gitea.conf <<-EOF
                d /run/gitea 0755 git git
              EOF
              insinto /etc/gitea
              newins custom/conf/app.example.ini app.ini
              fowners root:git /etc/gitea/{,app.ini}
              fperms g+w,o-rwx /etc/gitea/{,app.ini}
              diropts -m0750 -o git -g git
              keepdir /var/lib/gitea /var/lib/gitea/custom /var/lib/gitea/data
              keepdir /var/log/gitea
            }
            pkg_postinst() {
              fcaps_pkg_postinst
              tmpfiles_process gitea.conf
            }

thunderbird:
