net_vpn_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: net-vpn

  packages:
    - strongswan:
        template: templates/strongswan.tmpl
        dir:
          url: https://download.strongswan.org/
          matcher: "strongswan-.*.tar.bz2$"
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.bz2"
        transform:
          - kind: string
            match: 'strongswan-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        vars:
          desc: IPsec-based VPN solution, supporting IKEv1/IKEv2 and MOBIKE
          homepage: https://www.strongswan.org/

    - tor:
        dir:
          url: https://dist.torproject.org/
          exclude: "-alpha|-rc"
          matcher: "tor-.*.tar.gz$"
        transform:
          - kind: string
            match: 'tor-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        vars:
          inherit:
            - flag-o-matic
            - readme.gentoo-r1
            - user
          rdepend: |
            dev-libs/libevent[ssl]
            sys-libs/zlib
            caps? ( sys-libs/libcap )
            dev-libs/openssl
            lzma? ( app-arch/xz-utils )
            seccomp? ( sys-libs/libseccomp )
            zstd? ( app-arch/zstd )

          depend: |
            ${RDEPEND}
            app-text/asciidoc
          docs:
            - README.md
            - ChangeLog
            - ReleaseNotes
            - doc/HACKING
          iuse: caps lzma seccomp selinux tor-hardening zstd
          homepage: https://torproject.org
          desc: Anonymizing overlay network for TCP
          license: BSD GPL-2
          body: |
            pkg_setup() {
              enewgroup tor
              enewuser tor -1 -1 /var/lib/tor tor
            }
            src_configure() {
              export ac_cv_lib_cap_cap_init=$(usex caps)
              econf \
                --localstatedir="${EPREFIX}/var" \
                --enable-system-torrc \
                --enable-asciidoc \
                --disable-android \
                --disable-libfuzzer \
                --disable-module-dirauth \
                --enable-pic \
                --disable-rust \
                --disable-restart-debugging \
                --disable-zstd-advanced-apis  \
                --disable-unittests \
                --disable-coverage \
                --disable-libscrypt \
                $(use_enable lzma) \
                $(use_enable seccomp) \
                $(use_enable tor-hardening gcc-hardening) \
                $(use_enable tor-hardening linker-hardening) \
                $(use_enable zstd)
            }
            src_install() {
              default
              readme.gentoo_create_doc

              newconfd "${FILESDIR}"/tor.confd tor
              newinitd "${FILESDIR}"/tor.initd-r8 tor

              keepdir /var/lib/tor

              fperms 750 /var/lib/tor
              fowners tor:tor /var/lib/tor

              insinto /etc/tor/
              newins "${FILESDIR}"/torrc-r1 torrc
            }

net_dns_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: net-dns

  packages:
    - unbound:
        template: templates/unbound.tmpl
        dir:
          url: https://nlnetlabs.nl/downloads/unbound/
          matcher: "unbound-1..*.tar.gz$"
          exclude: "rc"
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
        transform:
          - kind: string
            match: 'unbound-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''


bind_dirlisting:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: net-dns
    vars:
      python_compat: python3+
      tar_prefix: "bind"
    dir:
      url: https://downloads.isc.org/isc/bind9/
      matcher: '9.*'
      exclude: 'rc|W|P|ESV|a|b'
    assets:
      - name: "{{ .Values.tar_prefix }}-{{ .Values.version }}.tar.xz"
        prefix: "{{ .Values.version }}/"

  packages:
    # Current stable release 9.20.x
    - bind:
        selector:
          - '<9.21.0'
    - bind-tools:
        vars:
          s: '${WORKDIR}/bind-{{ .Values.version }}'
        selector:
          - '<9.21.0'

    # Development release 9.21.x
    - bind:
        selector:
          - '>9.21.0'
          - '<9.22.0'
    - bind-tools:
        selector:
          - '>9.21.0'
          - '<9.22.0'
        vars:
          s: '${WORKDIR}/bind-{{ .Values.version }}'

netfilters_dir:
  generator: builtin-dirlisting
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    dir:
      url: 'https://www.netfilter.org/pub/{{ .Values.pn }}/'
    category: net-libs

  packages:

    - arptables:
        category: net-firewall
        transform:
          - kind: regex
            match: 'arptables-|arptables-v'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
          - kind: string
            match: '-'
            replace: '_p'
        dir:
          matcher: 'arptables-.*.tar.gz$'
        vars:
          license: GPL-2+
          inherit:
            - autotools
            - toolchain-funcs
          desc: Set up, maintain, and inspect the tables of ARP rules in the Linux kernel
          homepage: https://ebtables.netfilter.org
          body: |
            src_compile() {
              # -O0 does not work and at least -O2 is required, bug #240752
              emake CC="$(tc-getCC)" COPT_FLAGS="-O2 ${CFLAGS//-O0/-O2}"
              sed -e 's:__EXEC_PATH__:/sbin:g' \
                -i arptables-save arptables-restore || die "sed failed"
            }
            src_install() {
              emake \
                PREFIX="${ED}"/ \
                LIBDIR="${ED}/$(get_libdir)" \
                SYSCONFIGDIR="${ED}"/etc \
                MANDIR="${ED}"/usr/share/man \
                install
              newman arptables-legacy.8 arptables.8
            }


    - ebtables:
        category: net-firewall
        transform:
          - kind: regex
            match: 'ebtables-|ebtables-v'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
          - kind: string
            match: '-'
            replace: '_p'
        dir:
          matcher: 'ebtables-.*.tar.gz$'
        vars:
          license: GPL-2
          iuse: +perl static
          rdepend: |
            perl? ( dev-lang/perl )
            net-misc/ethertypes
          depend: '${RDEPEND}'
          inherit:
            - autotools
            - toolchain-funcs
            - flag-o-matic
          desc: Controls Ethernet frame filtering on a Linux bridge, MAC NAT and brouting
          homepage: http://ebtables.sourceforge.net/
          docs:
            - ChangeLog
            - THANKS
          body: |
            src_configure() {
              econf \
                --bindir="/bin" \
                --sbindir="/sbin" \
                --libdir="/$(get_libdir)/{{ .Values.pn }}" \
                $(use_enable static)
            }
            src_install() {
              if ! use static; then
                emake DESTDIR="${D}" install
                if ! use perl; then
                  rm "${ED}"/sbin/ebtables-save || die
                fi
                rm "${ED%/}"/etc/ethertypes || die
              else
                into /
                newsbin static ebtables
              fi
              keepdir /var/lib/ebtables/
              newinitd "${FILESDIR}"/ebtables.initd-r1 ebtables
              newconfd "${FILESDIR}"/ebtables.confd-r1 ebtables
              einstalldocs
            }


    - libmnl:
        transform:
          - kind: string
            match: 'libmnl-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        dir:
          matcher: 'libmnl-.*.tar.bz2$'
        vars:
          inherit:
            - ltprune
            - eutils
          homepage: https://netfilter.org/projects/libmnl/
          desc: Minimalistic netlink library
          iuse: examples static-libs
          license: LGPL-2.1
          body: |
            src_configure() {
              econf $(use_enable static-libs static)
            }
            src_install() {
              default
              gen_usr_ldscript -a mnl
              prune_libtool_files
              if use examples; then
                find examples/ -name 'Makefile*' -delete
                dodoc -r examples/
                docompress -x /usr/share/doc/${PF}/examples
              fi
            }

    - libnftnl:
        transform:
          - kind: string
            match: 'libnftnl-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        dir:
          matcher: 'libnftnl-.*.tar.xz$'
        vars:
          inherit:
            - autotools
            - toolchain-funcs
          homepage: https://netfilter.org/projects/libnftnl/
          desc: Netlink API to the in-kernel nf_tables subsystem
          iuse: examples static-libs
          license: GPL-2
          rdepend: |
            >=net-libs/libmnl-1.0.4
          bdepend: virtual/pkgconfig
          depend: '${RDEPEND}'
          body: |
            src_configure() {
              local myeconfargs=(
                $(use_enable static-libs static)
              )
              econf "${myeconfargs[@]}"
            }
            src_install() {
              default
              gen_usr_ldscript -a nftnl
              find "${ED}" -type f -name '*.la' -delete || die
              if use examples; then
                find examples/ -name 'Makefile*' -delete || die "Could not rm examples"
                dodoc -r examples
                docompress -x /usr/share/doc/${PF}/examples
              fi
            }

    - ipset:
        category: net-firewall
        transform:
          - kind: string
            match: 'ipset-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        dir:
          matcher: 'ipset-.*.tar.bz2$'
          # Ignore old versions
          exclude: '2005[0-9]+.tar.bz2$|2004[0-9]+.tar.bz2$'
        vars:
          homepage: https://netfilter.org/projects/ipset/ http://ipset.netfilter.org/
          desc: IPset tool for iptables, successor to ippool
          license: GPL-2
          rdepend: |
            net-firewall/iptables
            net-libs/libmnl
          depend: ${RDEPEND}
          docs:
            - ChangeLog
            - INSTALL
            - README
            - UPGRADE
          inherit:
            - linux-info
            - ltprune
          extra_envs:
            - |
              # configurable from outside, e.g. /etc/portage/make.conf
              IP_NF_SET_MAX=${IP_NF_SET_MAX:-256}
          body: |
            src_configure() {
              econf \
                --without-kmod
                --with-maxsets=${IP_NF_SET_MAX} \
                --libdir="${EPREFIX}/$(get_libdir)" \
                --with-ksource="${KV_DIR}" \
                --with-kbuild="${KV_OUT_DIR}"
            }
            src_compile() {
              einfo "Building userspace"
              emake
            }
            src_install() {
              einfo "Installing userspace"
              default
              prune_libtool_files
              newinitd "${FILESDIR}"/ipset.initd-r4 ${PN}
              newconfd "${FILESDIR}"/ipset.confd ${PN}
              keepdir /var/lib/ipset
              if [[ ${build_modules} -eq 1 ]]; then
                einfo "Installing kernel modules"
                linux-mod_src_install
              fi
            }


    - nftables:
        category: net-firewall
        transform:
          - kind: string
            match: 'nftables-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        dir:
          matcher: 'nftables-.*.tar.xz$'
        vars:
          homepage: https://netfilter.org/projects/nftables/
          desc: Modern Linux kernel packet classification framework
          iuse: debug +cli doc +gmp json +modern_kernel python xtables
          inherit:
            - autotools
          rdepend: |
            net-libs/libmnl
            gmp? ( dev-libs/gmp:0= )
            json? ( dev-libs/jansson )
            cli? ( dev-libs/libedit:0= )
            >=net-libs/libnftnl-1.2.9
          depend: |
            ${RDEPEND}
            app-text/docbook2X
            doc? ( app-text/dblatex )
            sys-devel/bison
            sys-devel/flex
            virtual/pkgconfig
          body: |
            src_prepare() {
              default
              eautoreconf
            }
            src_configure() {
              local myeconfargs=(
                --sbindir="${EPREFIX}"/sbin
                $(use_enable python)
                $(use_enable debug)
                $(use_enable doc man-doc)
                $(use_with !gmp mini_gmp)
                $(use_with json)
                $(use_with xtables)
                $(if use !cli; then use_with cli; fi)
              )
              econf "${myeconfargs[@]}"
            }
            src_install() {
              default
              local mksuffix=""
              use modern_kernel && mksuffix="-mk"
              exeinto /usr/libexec/${PN}
              newexe "${FILESDIR}"/libexec/${PN}${mksuffix}.sh ${PN}.sh
              newconfd "${FILESDIR}"/${PN}${mksuffix}.confd ${PN}
              newinitd "${FILESDIR}"/${PN}${mksuffix}.init ${PN}
              keepdir /var/lib/nftables
              docinto /usr/share/doc/${PF}/skels
              dodoc -r "${D}"/etc/nftables/*
              rm -R "${D}"/etc/nftables
            }
            pkg_postinst() {
              local save_file
              save_file="${EROOT%/}/var/lib/nftables/rules-save"
              # In order for the nftables-restore systemd service to start
              # the save_file must exist.
              if [[ ! -f ${save_file} ]]; then
                touch ${save_file}
              fi
              elog "If you are creating firewall rules before the next system restart "
              elog "the nftables-restore service must be manually started in order to "
              elog "save those rules on shutdown."
            }



