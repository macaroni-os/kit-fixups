net_vpn_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: net-vpn

  packages:
    - strongswan:
        template: templates/strongswan.tmpl
        dir:
          url: https://download.strongswan.org/
          matcher: "strongswan-.*.tar.bz2$"
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.bz2"
        transform:
          - kind: string
            match: 'strongswan-'
            replace: ''
          - kind: string
            match: '.tar.bz2'
            replace: ''
        vars:
          desc: IPsec-based VPN solution, supporting IKEv1/IKEv2 and MOBIKE
          homepage: https://www.strongswan.org/

    - tor:
        dir:
          url: https://dist.torproject.org/
          exclude: "-alpha|-rc"
          matcher: "tor-.*.tar.gz$"
        transform:
          - kind: string
            match: 'tor-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''
        vars:
          inherit:
            - flag-o-matic
            - readme.gentoo-r1
            - user
          rdepend: |
            dev-libs/libevent[ssl]
            sys-libs/zlib
            caps? ( sys-libs/libcap )
            dev-libs/openssl
            lzma? ( app-arch/xz-utils )
            seccomp? ( sys-libs/libseccomp )
            zstd? ( app-arch/zstd )

          depend: |
            ${RDEPEND}
            app-text/asciidoc
          docs:
            - README.md
            - ChangeLog
            - ReleaseNotes
            - doc/HACKING
          iuse: caps lzma seccomp selinux tor-hardening zstd
          homepage: https://torproject.org
          desc: Anonymizing overlay network for TCP
          license: BSD GPL-2
          body: |
            pkg_setup() {
              enewgroup tor
              enewuser tor -1 -1 /var/lib/tor tor
            }
            src_configure() {
              export ac_cv_lib_cap_cap_init=$(usex caps)
              econf \
                --localstatedir="${EPREFIX}/var" \
                --enable-system-torrc \
                --enable-asciidoc \
                --disable-android \
                --disable-libfuzzer \
                --disable-module-dirauth \
                --enable-pic \
                --disable-rust \
                --disable-restart-debugging \
                --disable-zstd-advanced-apis  \
                --disable-unittests \
                --disable-coverage \
                --disable-libscrypt \
                $(use_enable lzma) \
                $(use_enable seccomp) \
                $(use_enable tor-hardening gcc-hardening) \
                $(use_enable tor-hardening linker-hardening) \
                $(use_enable zstd)
            }
            src_install() {
              default
              readme.gentoo_create_doc

              newconfd "${FILESDIR}"/tor.confd tor
              newinitd "${FILESDIR}"/tor.initd-r8 tor

              keepdir /var/lib/tor

              fperms 750 /var/lib/tor
              fowners tor:tor /var/lib/tor

              insinto /etc/tor/
              newins "${FILESDIR}"/torrc-r1 torrc
            }

net_dns_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: net-dns

  packages:
    - unbound:
        template: templates/unbound.tmpl
        dir:
          url: https://nlnetlabs.nl/downloads/unbound/
          matcher: "unbound-1..*.tar.gz$"
          exclude: "rc"
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
        transform:
          - kind: string
            match: 'unbound-'
            replace: ''
          - kind: string
            match: '.tar.gz'
            replace: ''


bind_dirlisting:
  generator: builtin-dirlisting

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: net-dns
    vars:
      python_compat: python3+
      tar_prefix: "bind"
    dir:
      url: https://downloads.isc.org/isc/bind9/
      matcher: '9.*'
      exclude: 'rc|W|P|ESV|a|b'
    assets:
      - name: "{{ .Values.tar_prefix }}-{{ .Values.version }}.tar.xz"
        prefix: "{{ .Values.version }}/"

  packages:
    - bind:
    - bind-tools:
        vars:
          s: '${WORKDIR}/bind-{{ .Values.version }}'


net_wireless_noop:
  generator: builtin-noop
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    category: net-wireless

  packages:
    - wpa_supplicant:
        vars:
          versions:
            - "2.11"
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
            prefix: https://w1.fi/releases/


net_vpn_github:
  generator: builtin-github
  defaults:
    category: net-vpn
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: tags

  packages:
    - wireguard-tools:
        github:
          user: WireGuard
        vars:
          desc: Required tools for WireGuard, such as wg(8) and wg-quick(8)
          homepage: https://www.wireguard.com/
          license: GPL-2
          inherit:
            - bash-completion-r1
            - systemd
            - toolchain-funcs
          bdepend: virtual/pkgconfig
          iuse: systemd
          body: |
            src_compile() {
              emake RUNSTATEDIR="${EPREFIX}/run" \
                -C src CC="$(tc-getCC)" LD="$(tc-getLD)"
            }
            src_install() {
              local emakeargs=(
                WITH_BASHCOMPLETION=yes
                WITH_WGQUICK=yes
                DESTDIR="${D}"
                BASHCOMPDIR="$(get_bashcompdir)"
                SYSTEMDUNITDIR="$(systemd_get_systemunitdir)"
                PREFIX="${EPREFIX}/usr"
              )

              if use systemd ; then
                emakeargs+=(
                  WITH_SYSTEMDUNITS=yes
                )
              else
                emakeargs+=(
                  WITH_SYSTEMDUNITS=no
                )
              fi

              dodoc README.md
              dodoc -r contrib
              emake "${emakeargs[@]}" -C src install

              if ! use systemd ; then
                newinitd "${FILESDIR}"/wg-quick.initd wg-quick
              fi
            }


net_libs_github:
  generator: builtin-github
  defaults:
    category: net-libs
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: tags

  packages:
    - libqmi:
        github:
          user: linux-mobile-broadband
        exclude:
          - '-dev|-rc'
        vars:
          desc: "Qualcomm MSM (Mobile Station Modem) Interface (QMI) modem protocol library"
          homepage: https://www.freedesktop.org/wiki/Software/libqmi/ https://gitlab.freedesktop.org/mobile-broadband/libqmi
          license: LGPL-2
          iuse: gtk-doc +mbim +qrtr
          inherit:
            - meson
          cdepend: |
            dev-libs/glib
            dev-libs/libgudev
            mbim? ( net-libs/libmbim )
            qrtr? ( net-libs/libqrtr-glib )
          depend: |
            ${CDEPEND}
          rdepend: |
            ${CDEPEND}
          bdepend: |
            app-shells/bash-completion
            virtual/pkgconfig
            gtk-doc? ( dev-util/gtk-doc )
          body: |
            src_configure() {
              local emesonargs=(
                $(meson_use qrtr)
                $(meson_use mbim mbim_qmux)
                $(meson_use gtk-doc gtk_doc)
                $(meson_use qrtr)
              )
              meson_src_configure
            }


flatpak:
  generator: builtin-github
  defaults:
    category: sys-apps
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases

  packages:
    - flatpak:
        github:
          user: flatpak
        vars:
          python_compat: "python3+"
          desc: Linux application sandboxing and distribution framework
          homepage: https://flatpak.org/
          license: LGPL-2.1
          iuse: introspection policykit seccomp X gnome kde
          inherit:
            - meson
            - python-any-r1
            - user
          rdepend: |
            sys-fs/libostree
            net-libs/libsoup
            gnome-base/dconf
            dev-libs/appstream
            dev-libs/appstream-glib
            x11-libs/gdk-pixbuf:2
            dev-libs/glib
            dev-libs/libxml2
            sys-apps/dbus
            dev-libs/json-glib
            x11-apps/xauth
            app-arch/libarchive
            app-crypt/gpgme
            sys-fs/fuse
            >=sys-apps/bubblewrap-0.10.0
            dev-util/xdg-dbus-proxy
            policykit? ( sys-auth/polkit )
            seccomp? ( sys-libs/libseccomp )
          depend: ${RDEPEND}
          bdepend: |
            sys-devel/gettext
            virtual/pkgconfig
            dev-util/gdbus-codegen
            sys-devel/bison
            introspection? ( dev-libs/gobject-introspection )
            $(python_gen_any_dep '
              dev-python/pyparsing[${PYTHON_USEDEP}]
            ')
          pdepend: |
            gnome? (
              sys-apps/xdg-desktop-portal
              sys-apps/xdg-desktop-portal-gtk
            )
            kde? (
              sys-apps/xdg-desktop-portal
              sys-apps/xdg-desktop-portal-kde
            )
          body: |
            pkg_setup() {
              enewgroup flatpak
              enewuser flatpak -1 -1 /dev/null flatpak
              python-any-r1_pkg_setup
            }
            src_configure() {
              local emesonargs=(
                --localstatedir="${EPREFIX}"/var
                -Ddbus_config_dir=/usr/share/dbus-1/system.d
                -Dsystem_bubblewrap=bwrap
                -Dsystem_dbus_proxy=xdg-dbus-proxy
                -Dtmpfilesdir=/usr/lib/tmpfiles.d
                # Disable doc generation
                -Dgtkdoc=disabled
                -Ddocbook_docs=disabled
                # Disable systemd support
                -Dsystemd=disabled
                $(meson_use gnome gdm_env_file)
                $(meson_use policykit tests)
                $(meson_feature policykit system_helper)
                $(meson_feature introspection gir)
                $(meson_feature X xauth)
                $(meson_feature seccomp seccomp)
              )

              meson_src_configure
            }


alpine:
  generator: builtin-noop
  template:
    engine: helm

  defaults:
    category: mail-client
    files_dir: "{{ .Values.pn }}"

  packages:
    - alpine:
        template: ../../templates/simple.tmpl
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
            url: "https://alpineapp.email/alpine/patches/alpine-{{ .Values.version }}/alpine-{{ .Values.version }}.tar.xz"
        transform:
          - kind: string
            match: 'alpine-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          homepage: https://alpineapp.email/alpine/index.html
          desc: An easy to use text-based based mail and news client
          license: Apache-2.0
          iuse: ipv6 kerberos ldap passfile nls smime ssl
          inherit:
            - autotools
            - toolchain-funcs
          rdepend: |
            app-misc/mime-types
            sys-libs/ncurses
            kerberos? ( app-crypt/mit-krb5 )
            ldap? ( net-nds/openldap )
            ssl? ( dev-libs/openssl )
          depend: ${RDEPEND}
          body: |
            src_configure() {
              myconf=(
                --without-tcl
                --with-pthread
                --with-system-pinerc="${EPREFIX}"/etc/pine.conf
                --with-system-fixed-pinerc="${EPREFIX}"/etc/pine.conf.fixed
                $(use_with ldap)
                $(use_with ssl)
                $(use_with passfile passfile .pinepwd)
                $(use_with kerberos krb5)
                $(use_enable nls)
                $(use_with ipv6)
                $(use_with smime)
              )

              if has_version "app-text/hunspell"; then
                myconf+=( --with-interactive-spellcheck=/usr/bin/hunspell )
              elif has_version "app-text/aspell"; then
                myconf+=( --with-interactive-spellcheck=/usr/bin/aspell )
              fi

              if use ssl; then
                myconf+=(
                  --with-ssl-include-dir="${EPREFIX}"/usr/include/openssl
                  --with-ssl-lib-dir="${EPREFIX}"/usr/$(get_libdir)
                  --with-ssl-certs-dir="${EPREFIX}"/etc/ssl/certs
                )
              fi


              # Gentoo Bug 935343; see imap/docs/bugs.txt
              if use ipv6; then
                sed -i "s/IP=4/IP=6/" imap/Makefile || die
              fi

              # dial down warnings about unused results
              append-flags -Wno-unused-result

              econf "${myconf[@]}"
            }

          versions:
            - "2.26"

minio:
  generator: builtin-github
  defaults:
    category: net-fs
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    github:
      user: minio
      query: releases
      match: RELEASE
    extensions:
      - golang
    transform:
      - kind: string
        match: 'RELEASE.'
        replace: ''
      - kind: regex
        match: 'T.*'
        replace: ''
      - kind: string
        match: '-'
        replace: '.'
    vars:
      extra_envs:
        - EGO_SKIP_TIDY=1
        - MY_PV="$(ver_cut 1-3)T$(ver_cut 4-7)Z"
        - MY_PV=${MY_PV//./-}
      bdepend: dev-lang/go

  extensions_defs:
    golang:
      opts:

  packages:

    - minio-client:
        github:
          repo: mc
        vars:
          inherit:
            - go-module
          desc: Fast tool to manage MinIO clusters
          homepage: https://min.io/ https://github.com/minio/mc
          license: AGPL-3.0
          body: |
            src_prepare() {
              default
              sed -i -e "s/time.Now().UTC().Format(time.RFC3339)/\"${MY_PV}\"/"\
                -e "s/-s //"\
                -e "/time/d"\
                -e "s/+ commitID()/+ \"${EGIT_COMMIT}\"/"\
                buildscripts/gen-ldflags.go || die
            }
            src_unpack() {
              go-module_src_unpack
              mv ${WORKDIR}/{{ .Values.github_user}}-{{ .Values.github_repo}}-* ${S} || die
            }
            src_compile() {
              unset XDG_CACHE_HOME
              MINIO_RELEASE="${MY_PV}"
              go run buildscripts/gen-ldflags.go
              CGO_ENABLED=0 \
                go build --ldflags "$(go run buildscripts/gen-ldflags.go)" -o mc || die
            }
            src_install() {
              dobin mc
            }

    - minio:
        vars:

          desc: An Amazon S3 compatible object storage server
          homepage: https://min.io/ https://github.com/minio/minio
          iuse: systemd
          license: Apache-2.0 BSD BSD-2 MIT MPL-2.0
          inherit:
            - go-module
            - user
            - systemd
          body: |
            pkg_setup() {
              enewgroup ${PN}
              enewuser ${PN} -1 -1 /var/lib/${PN} ${PN}
            }
            src_prepare() {
              default
              sed -i -e "s/time.Now().UTC().Format(time.RFC3339)/\"${MY_PV}\"/"\
                -e "s/-s //"\
                -e "/time/d"\
                -e "s/+ commitID()/+ \"${EGIT_COMMIT}\"/"\
                buildscripts/gen-ldflags.go || die
            }
            src_unpack() {
              go-module_src_unpack
              mv ${WORKDIR}/minio-minio-* ${S} || die
            }
            src_compile() {
              unset XDG_CACHE_HOME
              MINIO_RELEASE="${MY_PV}"
              go run buildscripts/gen-ldflags.go
              CGO_ENABLED=0 \
                go build --ldflags "$(go run buildscripts/gen-ldflags.go)" -o ${PN} || die
            }
            src_install() {
              dobin ${PN}
              insinto /etc/"${PN}"
              dodoc -r README.md CONTRIBUTING.md docs
              if use systemd ; then
                systemd_dounit "${FILESDIR}"/minio.service
              else
                newinitd "${FILESDIR}"/minio.initd minio
              fi
              newconfd "${FILESDIR}"/"${PN}".confd ${PN}
              keepdir /var/{lib,log}/"${PN}"
              fowners minio:minio /
            }
