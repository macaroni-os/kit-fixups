      # XPI
      - name: '{{ .Values.pn }}-{{ .Values.version }}-af.xpi'
        url: 'https://archive.mozilla.org/pub/thunderbird/releases/{{ .Values.original_version }}/linux-x86_64/xpi/af.xpi'
