netmisc_github:
  generator: builtin-github
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: net-misc
    github:
      query: releases

  packages:

    - wsdd:
        github:
          user: christgau
        vars:
          python_compat: python3+
          iuse: samba systemd
          inherit:
            - python-any-r1
            - systemd
            - user
          rdepend: |
            ${PYTHON_DEPS}
            samba? ( net-fs/samba )
          body: |
            pkg_setup() {
              enewgroup wsdd
              enewuser wsdd -1 -1 -1 wsdd
              python-any-r1_pkg_setup
            }
            src_install() {
              python_newscript src/wsdd.py wsdd

              doconfd etc/openrc/conf.d/wsdd

              if use systemd ; then
                # install systemd unit file with dependency on samba service if use flag is set
                if use samba; then
                  sed -i -e 's/;Wants=smb.service/Wants=samba.service/' etc/systemd/wsdd.service
                fi
                systemd_dounit etc/systemd/wsdd.service
              else
                # remove dependency on samba from init.d script if samba is not in use flags
                if ! use samba ; then
                  sed -i -e '/need samba/d' etc/openrc/init.d/wsdd
                fi
                sed -i -e "s/daemon:daemon/${PN}:${PN}/" etc/openrc/init.d/wsdd

                doinitd etc/openrc/init.d/wsdd
              fi

              dodoc README.md
              doman man/wsdd.8
            }

    - freerdp:
        github:
          user: FreeRDP
          repo: FreeRDP
        vars:
          homepage: http://www.freerdp.com
          desc: FreeRDP is a free remote desktop protocol library and clients
          license: Apache-2.0
          extra_envs:
            - 'CMAKE_BUILD_TYPE=Release'
          inherit:
            - cmake
          iuse: |
            alsa cpu_flags_arm_neon cups debug doc +ffmpeg fuse gstreamer jpeg kerberos
            openh264 pulseaudio sdl server smartcard usb wayland X xinerama xv
          rdepend: |
            dev-libs/openssl:0=
            dev-libs/pkcs11-helper
            sys-libs/zlib:0
            alsa? ( media-libs/alsa-lib )
            cups? ( net-print/cups )
            usb? (
              virtual/libudev:0=
              sys-apps/util-linux:0=
              dev-libs/dbus-glib:0=
              virtual/libusb:1=
            )
            X? (
              x11-libs/libXcursor
              x11-libs/libXext
              x11-libs/libXi
              x11-libs/libXrender
              xinerama? ( x11-libs/libXinerama )
              xv? ( x11-libs/libXv )
            )
            ffmpeg? ( media-video/ffmpeg:0= )
            !ffmpeg? (
              x11-libs/cairo:0=
            )
            fuse? ( sys-fs/fuse:3 )
            gstreamer? (
              media-libs/gstreamer:1.0
              media-libs/gst-plugins-base:1.0
              x11-libs/libXrandr
            )
            jpeg? ( virtual/jpeg:0 )
            kerberos? ( virtual/krb5 )
            openh264? ( media-libs/openh264:0= )
            pulseaudio? ( media-sound/pulseaudio )
            sdl? (
              media-libs/libsdl2
              media-libs/sdl2-ttf
              media-libs/sdl3-ttf
            )
            server? (
              X? (
                x11-libs/libXcursor
                x11-libs/libXdamage
                x11-libs/libXext
                x11-libs/libXfixes
                x11-libs/libXrandr
                x11-libs/libXtst
                xinerama? ( x11-libs/libXinerama )
              )
            )
            smartcard? (
              sys-apps/pcsc-lite
              dev-libs/cJSON
            )
            wayland? (
              dev-libs/wayland
              x11-libs/libxkbcommon
            )
            X? (
              x11-libs/libX11
              x11-libs/libxkbfile
            )
          depend: ${RDEPEND}
          bdepend: |
            virtual/pkgconfig
            X? ( doc? (
              app-text/docbook-xml-dtd:4.1.2
              app-text/xmlto
            ) )
          body: |
            src_configure() {
              local mycmakeargs=(
                -DBUILD_TESTING=OFF
                -DCHANNEL_URBDRC=$(usex usb ON OFF)
                -DWITH_ALSA=$(usex alsa ON OFF)
                -DWITH_CCACHE=OFF
                -DWITH_CLIENT_SDL=$(usex sdl ON OFF)
                -DWITH_CUPS=$(usex cups ON OFF)
                -DWITH_DEBUG_ALL=$(usex debug ON OFF)
                -DWITH_MANPAGES=$(usex doc ON OFF)
                -DWITH_FFMPEG=$(usex ffmpeg ON OFF)
                -DWITH_SWSCALE=$(usex ffmpeg ON OFF)
                -DWITH_CAIRO=$(usex ffmpeg OFF ON)
                -DWITH_DSP_FFMPEG=$(usex ffmpeg ON OFF)
                -DWITH_GSTREAMER_1_0=$(usex gstreamer ON OFF)
                -DWITH_JPEG=$(usex jpeg ON OFF)
                -DWITH_KRB5=$(usex kerberos ON OFF)
                -DWITH_FUSE=$(usex fuse ON OFF)
                -DWITH_NEON=$(usex cpu_flags_arm_neon ON OFF)
                -DWITH_OPENH264=$(usex openh264 ON OFF)
                -DWITH_PULSE=$(usex pulseaudio ON OFF)
                -DWITH_SERVER=$(usex server ON OFF)
                -DWITH_PCSC=$(usex smartcard ON OFF)
                -DWITH_LIBSYSTEMD=OFF
                -DWITH_X11=$(usex X ON OFF)
                -DWITH_XINERAMA=$(usex xinerama ON OFF)
                -DWITH_XV=$(usex xv ON OFF)
                -DWITH_WAYLAND=$(usex wayland ON OFF)
              )
              cmake_src_configure
            }

spice-gtk:
  generator: builtin-dirlisting
  defaults:
    category: net-misc
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    dir:
      url: https://www.spice-space.org/download/gtk/
      matcher: '{{ .Values.pn }}-.*.tar.xz$'
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
  packages:
    - spice-gtk:
        revision: 1
        vars:
          python_compat: python3+
          extra_envs:
            - 'VALA_USE_DEPEND="vapigen"'
          inherit:
            - desktop
            - meson
            - python-any-r1
            - vala
            - xdg
          desc: Set of GObject and Gtk objects for connecting to Spice servers and a client GUI
          homepage: https://www.spice-space.org https://cgit.freedesktop.org/spice/spice-gtk/
          #s: '${WORKDIR}/{{ .Values.pn }}-v{{ regexReplaceAll "-r.*" .Values.version "" }}'
          # vala is needed for gnome-boxes
          iuse: |
            +gtk3 +introspection lz4 mjpeg policykit sasl smartcard
            usbredir wayland webdav vala
          rdepend: |
            dev-libs/glib:2
            dev-libs/json-glib:0=
            media-libs/gst-plugins-base:1.0
            media-libs/gst-plugins-good:1.0
            media-libs/gstreamer:1.0[introspection?]
            media-libs/opus
            media-libs/libjpeg-turbo:=
            sys-libs/zlib
            x11-libs/cairo
            x11-libs/pixman
            x11-libs/libX11
            gtk3? ( x11-libs/gtk+:3[introspection?] )
            introspection? ( dev-libs/gobject-introspection )
            dev-libs/openssl:=
            lz4? ( app-arch/lz4 )
            sasl? ( dev-libs/cyrus-sasl )
            smartcard? ( app-emulation/qemu[smartcard] )
            usbredir? (
              sys-apps/hwids
              sys-apps/usbredir
              virtual/acl
              virtual/libusb:1
              policykit? (
                sys-auth/polkit
              )
            )
            webdav? (
              net-libs/phodav:=
              net-libs/libsoup:=
            )
          depend: |
            ${RDEPEND}
            amd64? ( x11-libs/libva:= )
            arm64? ( x11-libs/libva:= )
            x86? ( x11-libs/libva:= )
          bdepend: |
            vala? ( $(vala_depend) )
            dev-perl/Text-CSV
            sys-devel/gettext
            virtual/pkgconfig
            $(python_gen_any_dep '
              dev-python/six[${PYTHON_USEDEP}]
              dev-python/pyparsing[${PYTHON_USEDEP}]
            ')
          body: |
            src_prepare() {
              default
              use vala && vala_src_prepare
            }
            src_configure() {
              local emesonargs=(
                $(meson_feature gtk3 gtk)
                $(meson_feature introspection)
                $(meson_use mjpeg builtin-mjpeg)
                $(meson_feature policykit polkit)
                $(meson_feature lz4)
                $(meson_feature sasl)
                $(meson_feature smartcard)
                $(meson_feature usbredir)
                $(meson_feature webdav)
                $(meson_feature vala vapi)
                $(meson_feature wayland wayland-protocols)
              )
              if use elibc_musl; then
                emesonargs+=(
                  -Dcoroutine=gthread
                )
              fi
              if use usbredir; then
                emesonargs+=(
                  -Dusb-acl-helper-dir=/usr/libexec
                  -Dusb-ids-path="${EPREFIX}"/usr/share/misc/usb.ids
                )
              fi
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use usbredir && use policykit; then
                # bug #775554 (and bug #851657)
                fowners root:root /usr/libexec/spice-client-glib-usb-acl-helper
                fperms 4755 /usr/libexec/spice-client-glib-usb-acl-helper
              fi
              make_desktop_entry spicy Spicy "utilities-terminal" "Network;RemoteAccess;"
            }
            pkg_postinst() {
              xdg_pkg_postinst
            }


ntp:
  generator: builtin-dirlisting
  defaults:
    category: net-misc
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    vars:
      inherit:
        - autotools
        - toolchain-funcs
        - flag-o-matic
        - systemd
        - user
      desc: Network Time Protocol suite/programs
      homepage: http://www.ntp.org/
      release: 4.2.8
      license: HPND BSD ISC
      iuse: caps debug ipv6 ntp-cron parse-clocks readline samba systemd snmp ssl +threads vim-syntax zeroconf
      cdepend: |
        readline? ( sys-libs/readline:= )
        dev-libs/libevent:=[threads?]
        caps? ( sys-libs/libcap )
        zeroconf? ( net-dns/avahi[mdnsresponder-compat] )
        snmp? ( net-analyzer/net-snmp )
        ssl? ( dev-libs/openssl:= )
        parse-clocks? ( net-misc/pps-tools )
      depend: |
        ${CDEPEND}
        virtual/pkgconfig
      rdepend: |
        ${CDEPEND}
        vim-syntax? ( app-vim/ntp-syntax )
      s: '${WORKDIR}/{{ .Values.p | replace "_p" "p" }}'
      patches:
        - ntp-4.2.8_p18-ipc-caps.patch
        - ntp-4.2.8-sntp-test-pthreads.patch
        - ntp-4.2.8_p14-add_cap_ipc_lock.patch
        - ntp-4.2.8_p15-configure-clang16.patch
        - ntp-4.2.8_p18-c99.patch
        - ntp-4.2.8_p18-r2-bind-fail-NULL-dereference.patch
        - ntp-4.2.8-configure.patch

      body: |
        pkg_setup() {
          enewgroup ntp 123
          enewuser ntp 123 -1 /dev/null ntp
        }

        src_prepare() {
          default
          # Make sure every build uses the same install layout.
          find sntp/loc/ -type f '!' -name legacy -delete || die

          eautoreconf

          # Disable pointless checks.
          touch .checkChangeLog .gcc-warning FRC.html html/.datecheck
        }

        src_configure() {
          filter-lto

          append-cppflags -D_GNU_SOURCE
          append-cflags -fno-strict-overflow
          append-lfs-flags

          # avoid libmd5/libelf
          export ac_cv_search_MD5Init=no ac_cv_header_md5_h=no
          export ac_cv_lib_elf_nlist=no
          export ac_cv_header_dns_sd_h=$(usex zeroconf)
          export ac_cv_lib_dns_sd_DNSServiceRegister=${ac_cv_header_dns_sd_h}
          export PATH_RUBY=/bin/false
          # Increase the default memlimit from 32MiB to 128MiB.  #533232
          local myeconfargs=(
            --with-lineeditlibs=readline,edit,editline
            --with-yielding-select
            --disable-local-libevent
            --docdir='$(datarootdir)'/doc/${PF}
            --htmldir='$(docdir)/html'
            --with-memlock=256
            --with-hardenfile=/dev/null
            $(use_enable caps linuxcaps)
            $(use_enable parse-clocks)
            $(use_enable ipv6)
            $(use_enable debug debugging)
            $(use_with readline lineeditlibs readline)
            $(use_enable samba ntp-signd)
            $(use_with snmp ntpsnmpd)
            $(use_with ssl crypto)
            $(use_enable threads thread-support)
          )
          econf "${myeconfargs[@]}"
        }

        src_install() {
          default
          # move ntpd/ntpdate to sbin #66671
          dodir /usr/sbin
          mv "${ED}"/usr/bin/{ntpd,ntpdate} "${ED}"/usr/sbin/ || die "move to sbin"

          dodoc INSTALL WHERE-TO-START

          insinto /etc
          doins "${FILESDIR}"/ntp.conf

          use ipv6 || sed -i '/^restrict .*::1/d' "${ED}"/etc/ntp.conf

          newconfd "${FILESDIR}"/ntpd.confd ntpd
          newconfd "${FILESDIR}"/ntp-client.confd ntp-client
          newconfd "${FILESDIR}"/sntp.confd sntp
          if ! use caps ; then
            sed -i "s|-u ntp:ntp||" "${ED}"/etc/conf.d/ntpd || die
          fi

          keepdir /var/lib/ntp
          use prefix || fowners ntp:ntp /var/lib/ntp

          if use ntp-cron ; then
              exeinto /etc/cron.daily
              newexe "${FILESDIR}"/net-client.sh net-client.sh
          fi

          if use systemd ; then
            newtmpfiles "${FILESDIR}"/ntp.tmpfiles ntp.conf
            systemd_newunit "${FILESDIR}"/ntpd.service ntpd.service
            if use caps ; then
              sed -i '/ExecStart/ s|$| -u ntp:ntp|' \
                "${D}$(systemd_get_systemunitdir)"/ntpd.service \
                || die
            fi
            systemd_enable_ntpunit 60-ntpd ntpd.service

            systemd_newunit "${FILESDIR}"/ntpdate.service ntpdate.service
            systemd_install_serviced "${FILESDIR}"/ntpdate.service.conf
            systemd_newunit "${FILESDIR}"/sntp.service sntp.service
            systemd_install_serviced "${FILESDIR}"/sntp.service.conf

          else
            newinitd "${FILESDIR}"/ntpd.rc-r1 ntpd
            newinitd "${FILESDIR}"/sntp.rc sntp
            newinitd "${FILESDIR}"/ntp-client.rc ntp-client
            sed -i "s:/usr/bin:/usr/sbin:" "${ED}"/etc/init.d/ntpd || die
          fi


        }

        pkg_postinst() {
          if grep -qs '^[^#].*notrust' "${EROOT}"/etc/ntp.conf ; then
            eerror "The notrust option was found in your /etc/ntp.conf!"
            ewarn "If your ntpd starts sending out weird responses,"
            ewarn "then make sure you have keys properly setup."
          fi
        }


    dir:
      url: https://downloads.nwtime.org/ntp/{{ .Values.release }}/
      matcher: '{{ .Values.pn }}-{{ .Values.release }}p1.*.tar.gz$'

    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.gz'
        replace: ''
      - kind: string
        match: '{{ .Values.release }}p'
        replace: '{{ .Values.release }}_p'
  packages:

    - ntp:



openvswitch:
  generator: builtin-github
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: net-misc
    github:
      user: openvswitch
      repo: ovs
      query: tags

    vars:
      python_compat: "python3+"
      inherit:
        - autotools
        - python-single-r1
        - systemd
        - tmpfiles
      desc: Production quality, multilayer virtual switch
      homepage: https://www.openvswitch.org
      license: Apache-2.0 GPL-2
      iuse: debug monitor +ssl systemd unwind
      required_use: "${PYTHON_REQUIRED_USE}"
      cdepend: |
        ssl? ( dev-libs/openssl:0= )
        unwind? ( sys-libs/libunwind:= )
      rdepend: |
        ${CDEPEND}
        ${PYTHON_DEPS}
        dev-python/ovs[${PYTHON_USEDEP}]
        dev-python/twisted[conch,${PYTHON_USEDEP}]
        dev-python/zope-interface[${PYTHON_USEDEP}]
        net-dns/unbound
        sys-libs/libcap-ng
        debug? ( dev-lang/perl )
      depend: |
        ${RDEPEND}
        sys-apps/util-linux[caps]
      bdepend: |
        virtual/pkgconfig
      body: |
        pkg_setup() {
          python-single-r1_pkg_setup
        }
        src_prepare() {
          default
          eautoreconf
        }
        src_configure() {
          # flake8 is primarily a style guide tool: running it as part of the
          # build only breaks it (Gentoo bug 607280).
          export ovs_cv_flake8="no"
          # Skip the man-page diagram; it would need graphviz (Gentoo bug 856286).
          export ovs_cv_dot="no"
          export PYTHON3="${PYTHON}"
          export ac_cv_lib_unwind_unw_backtrace=$(usex unwind)

          local myeconfargs=(
            --with-rundir=/run/openvswitch
            --with-logdir=/var/log/openvswitch
            --with-pkidir=/etc/ssl/openvswitch
            --with-dbdir=/var/lib/openvswitch
            --enable-libcapng
            $(use_enable ssl)
            $(use_enable !debug ndebug)
          )
          econf "${myeconfargs[@]}"
        }
        src_install() {
          default

          local script
          if use monitor ; then
            # The set of shipped Python helpers changes across OVS releases
            # (4.0 dropped ovs-parse-backtrace/l3ping/test/vlan-test and
            # bugtool/ovs-bugtool): install whichever utilities/ovs-* helper
            # carries a Python shebang in this release.
            for script in utilities/ovs-* ; do
              [[ -f "${script}" ]] || continue
              [[ "$(head -n 1 "${script}")" == *python* ]] || continue
              python_doscript "${script}"
            done
            rm -r "${ED}"/usr/share/openvswitch/python || die
          fi

          keepdir /var/{lib,log}/openvswitch
          keepdir /etc/openvswitch
          keepdir /etc/ssl/openvswitch
          fperms 0750 /etc/ssl/openvswitch

          rm -rf "${ED}"/var/run || die

          # The systemd units keep EnvironmentFile=-/etc/conf.d/<service>, so
          # the same knobs work for both init systems.
          newconfd "${FILESDIR}/ovsdb-server.confd" ovsdb-server
          newconfd "${FILESDIR}/ovs-vswitchd.confd" ovs-vswitchd

          if use systemd ; then
            systemd_newunit "${FILESDIR}/ovsdb-server.service" ovsdb-server.service
            systemd_newunit "${FILESDIR}/ovs-vswitchd.service" ovs-vswitchd.service
            systemd_newunit rhel/usr_lib_systemd_system_ovs-delete-transient-ports.service ovs-delete-transient-ports.service
            newtmpfiles "${FILESDIR}/openvswitch.tmpfiles" openvswitch.conf
          else
            newinitd "${FILESDIR}/ovsdb-server.initd" ovsdb-server
            newinitd "${FILESDIR}/ovs-vswitchd.initd" ovs-vswitchd
          fi

          insinto /etc/logrotate.d
          newins rhel/etc_logrotate.d_openvswitch openvswitch
        }
        pkg_postinst() {
          if use systemd ; then
            tmpfiles_process openvswitch.conf
          fi

          elog "Use the following command to create an initial database for ovsdb-server:"
          elog "   emerge --config =${CATEGORY}/${PF}"
          elog "(will create a database in /var/lib/openvswitch/conf.db)"
          elog "or to convert the database to the current schema after upgrading."
        }
        pkg_config() {
          local db="${EROOT}/var/lib/openvswitch/conf.db"
          if [[ -e "${db}" ]] ; then
            einfo "Database '${db}' already exists, doing schema migration..."
            einfo "(if the migration fails, make sure that ovsdb-server is not running)"
            ovsdb-tool convert "${db}" \
              "${EROOT}/usr/share/openvswitch/vswitch.ovsschema" || die "converting database failed"
          else
            einfo "Creating new database '${db}'..."
            ovsdb-tool create "${db}" \
              "${EROOT}/usr/share/openvswitch/vswitch.ovsschema" || die "creating database failed"
          fi
        }
  packages:
    - openvswitch:
        exclude:
          - 'rc'
          - 'beta'


ovn:
  generator: builtin-github
  template:
    engine: helm

  extensions_defs:
    git-submodules:
      opts:

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: net-misc
    github:
      user: ovn-org
      repo: ovn
      query: tags

    vars:
      python_compat: "python3+"
      inherit:
        - autotools
        - python-single-r1
        - systemd
      desc: Open Virtual Network
      homepage: https://www.ovn.org/
      license: Apache-2.0 GPL-2
      iuse: +dns +ssl systemd
      required_use: "${PYTHON_REQUIRED_USE}"
      rdepend: |
        ${PYTHON_DEPS}
        dev-libs/openssl:=
        net-misc/openvswitch
        sys-libs/libcap-ng
        dns? ( net-dns/unbound )
      depend: |
        ${RDEPEND}
      bdepend: |
        virtual/pkgconfig
      body: |
        src_unpack() {
          default

          # The gitsubmodules bundle is always unpacked under pkg_basedir.
          # For an annotated tag the default source tarball unpacks under the
          # tag-object sha instead, so two roots can be present: move the
          # bundle's ovs/ aside and keep the source tree.  With a lightweight
          # tag both share one root and the ovs/ tree is already merged.
          local bundle="${WORKDIR}/{{ .Values.pkg_basedir }}"
          local roots=( "${WORKDIR}"/ovn-org-ovn-* )

          if [[ ${#roots[@]} -eq 1 ]] ; then
            mv "${roots[0]}" "${S}" || die
          else
            mv "${bundle}/ovs" "${WORKDIR}/ovs" || die
            rm -rf "${bundle}" || die
            mv "${WORKDIR}"/ovn-org-ovn-* "${S}" || die
            rm -rf "${S}/ovs"
            mv "${WORKDIR}/ovs" "${S}/ovs" || die
          fi
        }
        src_prepare() {
          default

          pushd "${S}/ovs" >/dev/null || die
          ./boot.sh || die
          popd >/dev/null || die
          ./boot.sh || die
        }
        src_configure() {
          pushd "${S}/ovs" >/dev/null || die
          econf \
            --with-pkidir=/etc/ssl/openvswitch \
            --enable-libcapng \
            --enable-ssl \
            PYTHON3="${PYTHON}" || die
          popd >/dev/null || die

          # OVN_CHECK_UNBOUND autodetects libunbound; pin it to the USE flag
          # so USE=-dns really builds without the dependency.
          export ac_cv_lib_unbound_ub_ctx_create=$(usex dns)

          local myeconfargs=(
            --with-ovs-source="${S}/ovs"
            --with-ovs-build="${S}/ovs"
            --with-rundir=/run/ovn
            --with-dbdir=/var/lib/ovn
            --with-logdir=/var/log/ovn
            --with-pkidir=/etc/ssl/ovn
            --enable-libcapng
            $(use_enable ssl)
          )
          econf "${myeconfargs[@]}" PYTHON3="${PYTHON}"
        }
        src_compile() {
          pushd "${S}/ovs" >/dev/null || die
          emake
          popd >/dev/null || die
          emake
        }
        src_install() {
          default

          # Upstream installs the man-page helper as ovn_detrace.py.
          mv "${ED}/usr/bin/ovn_detrace.py" "${ED}/usr/bin/ovn-detrace" || die

          keepdir /var/{lib,log}/ovn
          keepdir /etc/ssl/ovn
          fperms 0750 /etc/ssl/ovn

          insinto /etc/logrotate.d
          newins rhel/etc_logrotate.d_ovn ovn

          # ovn-central starts the northbound and southbound OVSDB servers
          # plus ovn-northd (the Ubuntu/geaaru overlay layout LXD/Incus
          # expects); ovn-controller is the per-host daemon.  The extra
          # vtep/IC units are shipped too, as in the overlay.
          newconfd "${FILESDIR}/ovn-central.confd" ovn-central
          newconfd "${FILESDIR}/ovn-north.confd" ovn-north
          newconfd "${FILESDIR}/ovn-south.confd" ovn-south
          newconfd "${FILESDIR}/ovn-controller.confd" ovn-controller
          newconfd "${FILESDIR}/ovn-controller-vtep.confd" ovn-controller-vtep
          newconfd "${FILESDIR}/ovn-ic.confd" ovn-ic
          newconfd "${FILESDIR}/ovn-ic-ovsdb.confd" ovn-ic-ovsdb

          if use systemd ; then
            systemd_dounit "${FILESDIR}/ovn-central.service"
            systemd_dounit "${FILESDIR}/ovn-north.service"
            systemd_dounit "${FILESDIR}/ovn-south.service"
            systemd_dounit "${FILESDIR}/ovn-controller.service"
            systemd_dounit "${FILESDIR}/ovn-controller-vtep.service"
            systemd_dounit "${FILESDIR}/ovn-ic.service"
            systemd_dounit "${FILESDIR}/ovn-ic-ovsdb.service"
          else
            newinitd "${FILESDIR}/ovn-central.initd" ovn-central
            newinitd "${FILESDIR}/ovn-north.initd" ovn-north
            newinitd "${FILESDIR}/ovn-south.initd" ovn-south
            newinitd "${FILESDIR}/ovn-controller.initd" ovn-controller
            newinitd "${FILESDIR}/ovn-controller-vtep.initd" ovn-controller-vtep
            newinitd "${FILESDIR}/ovn-ic.initd" ovn-ic
            newinitd "${FILESDIR}/ovn-ic-ovsdb.initd" ovn-ic-ovsdb
          fi
        }
  packages:
    # LTS 26.03
    - ovn:
        selector:
          - '>=26.03.0'
          - '<26.09.0'
        exclude:
          - 'rc'
          - 'beta'
        extensions:
          - git-submodules

    # LTS 26.09
    - ovn:
        selector:
          - '>=26.09.0'
          - '<26.10.0'
        exclude:
          - 'rc'
          - 'beta'
        extensions:
          - git-submodules
