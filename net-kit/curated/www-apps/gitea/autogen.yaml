gitea:
  generator: github-1
  packages:
    - gitea:
        # pinned until we have >=dev-lang/go-1.23.7
        version: 1.23.4
        github:
          user: go-gitea
          repo: gitea
          query: releases
          tarball: gitea-src-{version}.tar.gz
        extensions:
          - golang
