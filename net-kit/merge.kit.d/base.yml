    - pkg: net-analyzer/traceroute

    - pkg: net-dialup/lrzsz
    - pkg: net-dialup/ppp
    - pkg: net-dialup/ppp-scripts
    - pkg: net-dialup/minicom

    - pkg: net-dns/avahi
    - pkg: net-dns/bind
    - pkg: net-dns/bind-tools
