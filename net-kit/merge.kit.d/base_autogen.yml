sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: net-kit
  url: "https://github.com/macaroni-os/net-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: mail-client/alpine
    - pkg: mail-client/thunderbird-bin
    - pkg: mail-client/thunderbird-esr-bin

    # stable release 9.20
    - pkg: net-dns/bind
      conditions:
        - '<net-dns/bind-9.21.0'
    - pkg: net-dns/bind-tools
      conditions:
        - '<net-dns/bind-tools-9.21.0'
    # development release 9.21
    - pkg: net-dns/bind
      conditions:
        - '>=net-dns/bind-9.21.0'
        - '<net-dns/bind-9.22.0'
    - pkg: net-dns/bind-tools
      conditions:
        - '>=net-dns/bind-tools-9.21.0'
        - '<net-dns/bind-tools-9.22.0'

    - pkg: net-dns/coredns
    - pkg: net-dns/unbound

    - pkg: net-firewall/arptables
    - pkg: net-firewall/ebtables
    - pkg: net-firewall/nftables
    - pkg: net-firewall/ipset

    - pkg: net-fs/minio
    - pkg: net-fs/minio-client

    - pkg: net-libs/libmnl
    - pkg: net-libs/libnftnl
    - pkg: net-libs/libqmi

    - pkg: net-misc/freerdp
    - pkg: net-misc/rclone

    - pkg: net-vpn/openvpn
    - pkg: net-vpn/strongswan
    - pkg: net-vpn/wireguard-tools
    - pkg: net-vpn/tor

    - pkg: net-wireless/wpa_supplicant

    - pkg: www-apps/forgejo
    - pkg: www-apps/gitea
    - pkg: www-apps/gogs

    - pkg: sys-apps/flatpak
