sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-xl"

- name: "net-kit"
  url: "https://github.com/macaroni-os/net-kit"
  branch: "mark-unstable"

target:
  name: net-kit
  url: "https://github.com/macaroni-os/net-kit"
  branch: mark-xl

  atoms_defaults:
    max_versions: 3

  atoms:
    # stable release 9.20
    - pkg: net-dns/bind
      conditions:
        - '<net-dns/bind-9.21.0'
    - pkg: net-dns/bind-tools
      conditions:
        - '<net-dns/bind-tools-9.21.0'
    # development release 9.21
    - pkg: net-dns/bind
      conditions:
        - '>=net-dns/bind-9.21.0'
        - '<net-dns/bind-9.22.0'
    - pkg: net-dns/bind-tools
      conditions:
        - '>=net-dns/bind-tools-9.21.0'
        - '<net-dns/bind-tools-9.22.0'
    - pkg: net-dns/unbound

    - pkg: net-print/cups
    - pkg: net-print/cups-filters
    - pkg: net-print/libppd
    - pkg: net-print/libcupsfilters

    - pkg: net-vpn/strongswan
    - pkg: net-vpn/tor

    - pkg: net-wireless/wpa_supplicant
