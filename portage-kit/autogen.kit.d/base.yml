mark-portage:
  generator: builtin-github
  defaults:
    category: sys-apps
    files_dir: "mark-portage"
    template: ../../templates/simple-github.tmpl
    github:
      user: macaroni-os
      repo: mark-portage
      query: tags

  packages:

    - portage:
        vars:
          python_compat: python3+
          extra_envs:
            - 'DISTUTILS_USE_SETUPTOOLS=no'
            - "PYTHON_REQ_USE='bzip2(+),threads(+)'"
          inherit:
            - distutils-r1
            - tmpfiles
          iuse: build +ipc +native-extensions xattr
          depend: |
            !build? ( $(python_gen_impl_dep 'ssl(+)') )
            app-arch/tar
            dev-lang/python-exec:2
            sys-apps/sed
            sys-devel/patch
          rdepend: |
            app-arch/zstd
            app-arch/tar
            dev-lang/python-exec:2
            sys-apps/findutils
            !build? (
              sys-apps/sed
              app-shells/bash:0[readline]
              app-admin/eselect
            )
            sys-apps/sandbox
            sys-apps/util-linux
            app-misc/pax-utils
            xattr? ( sys-apps/install-xattr )
          # Check if we need this:
          # userland_GNU? ( sys-apps/coreutils )
          pdepend: |
            !build? (
              net-misc/rsync
            )
            app-admin/ego

          body: |
            python_prepare_all() {
              distutils-r1_python_prepare_all
              sed -e "s:^VERSION = \"HEAD\"$:VERSION = \"${PV}\":" -i lib/portage/__init__.py || die
              if use native-extensions; then
                printf "[build_ext]\nportage-ext-modules=true\n" >> \
                  setup.cfg || die
              fi
              if ! use ipc ; then
                einfo "Disabling ipc..."
                sed -e "s:_enable_ipc_daemon = True:_enable_ipc_daemon = False:" \
                  die "failed to patch AbstractEbuildProcess.py"
              fi
              if use xattr ; then
                einfo "Adding FEATURES=xattr to make.globals ..."
                echo -e '\nFEATURES="${FEATURES} xattr"' >> cnf/make.globals \
                  || die "failed to append to make.globals"
              fi

              sed -e '/^sync-rsync-verify-metamanifest/s|yes|no|' \
                -e '/^sync-webrsync-verify-signature/s|yes|no|' \
                -i cnf/repos.conf || die "sed failed"
            }

            python_install() {
              # Install sbin scripts to bindir for python-exec linking
              # they will be relocated in pkg_preinst()
              distutils-r1_python_install \
                --system-prefix="/usr" \
                --bindir="$(python_get_scriptdir)" \
                --docdir="/usr/share/doc/${PF}" \
                --htmldir="/usr/share/doc/${PF}/html" \
                --portage-bindir="/usr/lib/portage/${EPYTHON}" \
                --sbindir="$(python_get_scriptdir)" \
                --sysconfdir="/etc" \
                "${@}"
            }

            python_install_all() {
              distutils-r1_python_install_all
              local targets=()
              dotmpfiles "${FILESDIR}"/portage-ccache.conf
              # Due to distutils/python-exec limitations
              # these must be installed to /usr/bin.
              local sbin_relocations='archive-conf dispatch-conf emaint env-update etc-update fixpackages regenworld'
              einfo "Moving admin scripts to the correct directory"
              dodir /usr/sbin
              for target in ${sbin_relocations}; do
                einfo "Moving /usr/bin/${target} to /usr/sbin/${target}"
                mv "${ED}/usr/bin/${target}" "${ED}/usr/sbin/${target}" || die "sbin scripts move failed!"
              done
            }

            pkg_preinst() {
              python_setup
              local sitedir=$(python_get_sitedir)
              [[ -d ${D}${sitedir} ]] || die "${D}${sitedir}: No such directory"
              env -u DISTDIR \
                -u PORTAGE_OVERRIDE_EPREFIX \
                -u PORTAGE_REPOSITORIES \
                -u PORTDIR \
                -u PORTDIR_OVERLAY \
                PYTHONPATH="${D}${sitedir}${PYTHONPATH:+:${PYTHONPATH}}" \
                "${PYTHON}" -m portage._compat_upgrade.default_locations || die
              env -u BINPKG_COMPRESS \
                PYTHONPATH="${D}${sitedir}${PYTHONPATH:+:${PYTHONPATH}}" \
                "${PYTHON}" -m portage._compat_upgrade.binpkg_compression || die
              # elog dir must exist to avoid logrotate error for bug #415911.
              # This code runs in preinst in order to bypass the mapping of
              # portage:portage to root:root which happens after src_install.
              keepdir /var/log/portage/elog
              # This is allowed to fail if the user/group are invalid for prefix users.
              if chown portage:portage "${ED}"/var/log/portage{,/elog} 2>/dev/null ; then
                chmod g+s,ug+rwx "${ED}"/var/log/portage{,/elog}
              fi
            }

            pkg_postinst() {
              echo
              einfo "Fixing permissions on /var/tmp/portage to address CVE-2019-20384."
              einfo "Now, only root, the portage user, and members of the portage group"
              einfo "are permitted to access /var/tmp/portage."
              echo
              chmod o-rwx $ROOT/var/tmp/portage
            }
