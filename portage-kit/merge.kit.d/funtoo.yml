sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-i"

- name: "portage-kit"
  url: "https://github.com/macaroni-os/portage-kit"
  branch: "mark-iii"

target:
  name: portage-kit
  url: "https://github.com/macaroni-os/portage-kit"
  branch: mark-i

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

      - dir: ../../.github/workflows
        to: .github/workflows

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: app-admin/ego
    - pkg: sys-apps/corenetwork
    - pkg: sys-apps/metatools
    - pkg: sys-apps/ramdisk
    - pkg: sys-apps/fchroot

