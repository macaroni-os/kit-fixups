sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-31"

- name: "python-kit"
  url: "https://github.com/macaroni-os/python-kit"
  branch: "mark-unstable"

target:
  name: python-kit
  url: "https://github.com/macaroni-os/python-kit"
  branch: mark-31

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

      - dir: ../../.github/workflows
        to: .github/workflows

      - file: ../../.goreleaser.yml
        to: .goreleaser.yml

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: dev-lang/python:3.9

    - pkg: dev-lang/python-exec:2
