hatchling_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: hatchling

  packages:
    - expandvars:
        pydeps_ignore:
          - "extra == 'tests'"
        python_compat: "python3+"
        vars:
          license: MIT

    - platformdirs:
        vars:
          desc: A small Python package for determining appropriate platform-specific dirs
        pydeps:
          py:all:build:
            - hatch-vcs

    - urllib3:
        vars:
          iuse: brotli http2 zstd
        pydeps:
          py:all:build:
            - hatch-vcs
          py:all:both:
            - PySocks >= 1.5.8
            - PySocks < 2.0
          use:zstd:both:
            - zstandard
          use:http2:both:
            - h2 < 5
            - h2 > 4
          use:brotli:both:
            - brotlipy

flit_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: flit
    python_compat: "python3+"

  packages:


    - importlib_metadata:
        selector:
          # keep same version for now
          # fix issue macaroni-os/mark-issues#350
          - '<=6.7.0'
        pypi_name: importlib_metadata
        pydeps:
          py:all:runtime:
            - zipp
            - typing-extensions >= 3.6.4
        vars:
          desc: Read metadata from Python packages
          homepage: https://importlib-metadata.readthedocs.io/
          license: Apache-2.0
          body: |
            src_configure() {
              # write a custom pyproject.toml to ease setuptools bootstrap
              cat > pyproject.toml <<-EOF || die
              [build-system]
              requires = ["flit_core >=3.2,<4"]
              build-backend = "flit_core.buildapi"

              [project]
              name = "importlib_metadata"
              version = "${PV}"
              description = "Read metadata from Python packages"
              EOF
            }

    - jinja:
        pypi_name: jinja2
        pydeps:
          py:all:build:
            - markupsafe
          py:all:
            - markupsafe
        vars:
          desc: A full-featured template engine for Python
          homepage: https://palletsprojects.com/p/jinja/ https://pypi.org/project/Jinja2/
          license: BSD
          body: |
            src_prepare() {
              # avoid unnecessary dep on extra sphinxcontrib modules
              sed -i '/sphinxcontrib.log_cabinet/ d' docs/conf.py || die
              distutils-r1_src_prepare
            }
            pkg_postinst() {
              if ! has_version dev-python/Babel; then
                elog "For i18n support, please emerge dev-python/Babel."
              fi
            }

    - packaging:
        vars:
          homepage: https://github.com/pypa/packaging/
          license: '|| ( Apache-2.0 BSD-2 )'
        pydeps_ignore:
          - 'extra == "test"'
        selector:
          - '<25'

    - zipp:
        pydeps_ignore:
          - 'extra'
        vars:
          body: |
            src_configure() {
              grep -q 'build-backend = "setuptools' pyproject.toml ||
                die "Upstream changed build-backend, recheck"
              # write a custom pyproject.toml to avoid circular dependencies
              # with importlib_metadata and setuptools_scm
              cat > pyproject.toml <<-EOF || die
                [build-system]
                requires = ["flit_core >=3.2,<4"]
                build-backend = "flit_core.buildapi"

                [project]
                name = "zipp"
                version = "${PV}"
                description = "Backport of pathlib-compatible object wrapper for zip files"
              EOF
            }

setuptools_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: setuptools
    python_compat: "python3+"

  packages:

    - calver:
        vars:
          license: Apache-2.0
          body: |
            src_prepare() {
              sed -i -e 's/license = "Apache-2.0"/license = { text = "Apache-2.0" }/' pyproject.toml || die
              distutils-r1_src_prepare
            }

    - certifi:
        vars:
          rdepend: app-misc/ca-certificates



    - dependency-injector:
        pypi_name: dependency_injector
        vars:
          use:native-extensions:build:
            - cython
          iuse: +native-extensions
          license: BSD-3-Clause
          body: |
            python_compile() {
              local -x DEPENDENCY_INJECTOR_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                DEPENDENCY_INJECTOR_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - distlib:

    - embit:
        pydeps:
          py:all:build:
            - wheel

    - falcon:
        vars:
          license: Apache-2.0
        pydeps:
          py:all:build:
            - wheel
            - cython

    - llfuse:
        vars:
          license: LGPL-2
          depend: |
            sys-apps/attr
            virtual/pkgconfig
          rdepend: |
            sys-fs/fuse:0
        pydeps:
          py:all:build:
            - setuptools


    - html5lib:
        vars:
          license: MIT
        pydeps:
          py:all:runtime:
            - six
            - webencodings

    - pycamera:
        vars:
          cdepend: |
            media-libs/opencv[python]
          rdepend: '${CDEPEND}'
        pydeps:
          py:all:tool:
            - numpy
          py:all:runtime:
            - numpy

    - picamera:
        vars:
          body: |
            src_prepare() {
                distutils-r1_src_prepare
                sed -e "s/^ *if not is_raspberry_pi():/if False:/" \
                    -e "s/raise ValueError('Unable to determine if this system is a Raspberry Pi')/print('picamera: skipping Raspberry Pi hardware check via ebuild')/" \
                    -i setup.py || die
            }

    - picamera2:

    - pycryptodomex:
        vars:
          license: BSD

    - pyrfc3339:
        pypi_name: pyrfc3339

    - requests:
        vars:
          iuse: socks5 +ssl
        pydeps:
          py:all:both:
            - certifi >= 2017.4.17
            - chardet
            - idna
            - urllib3
            - charset_normalizer
          use:socks5:both:
            - PySocks >= 1.5.6
          use:ssl:both:
            - cryptography >= 1.3.4
            - pyopenssl >= 0.14

    - spidev:

    - setuptools_scm_git_archive:
        pypi_name: setuptools_scm_git_archive
        vars:
          license: MIT
        pydeps:
          py:all:tool:
            - setuptools_scm

poetry_modules:
  generator: builtin-pypi
