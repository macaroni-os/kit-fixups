hatchling_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "templates/pypi-generic.tmpl"
    vars:
      du_pep517: hatchling

  packages:
    - expandvars:
        pydeps_ignore:
          - "extra == 'tests'"
        python_compat: "python3+"
        vars:
          license: MIT

standalone_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "templates/pypi-generic.tmpl"
    vars:
      du_pep517: standalone
    python_compat: "python3+"

  packages:
    - yarl:
        pydeps:
          py:all:build:
            - setuptools
            - expandvars
          use:native-extensions:build:
            - cython
          py:all:
            - idna >= 2.0
            - multidict >= 4.0
            - propcache >= 0.2.0
        vars:
          iuse: +native-extensions
          body: |
            python_compile() {
              local -x YARL_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                YARL_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - propcache:
        pydeps:
          py:all:build:
            - expandvars
            - setuptools
          use:native-extensions:build:
            - cython
        vars:
          license: Apache-2.0
          iuse: +native-extensions

          body: |
            python_compile() {
              local -x PROPCACHE_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                PROPCACHE_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

