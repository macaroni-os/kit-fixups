hatchling_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "templates/pypi-generic.tmpl"
    vars:
      du_pep517: hatchling

  packages:
    - expandvars:
        pydeps_ignore:
          - "extra == 'tests'"
        python_compat: "python3+"
        vars:
          license: MIT

flit_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "templates/pypi-generic.tmpl"
    vars:
      du_pep517: flit
    python_compat: "python3+"

  packages:

    - jinja:
        pypi_name: jinja2
        pydeps:
          py:all:build:
            - markupsafe
          py:all:
            - markupsafe
        vars:
          desc: A full-featured template engine for Python
          homepage: https://palletsprojects.com/p/jinja/ https://pypi.org/project/Jinja2/
          license: BSD
          body: |
            src_prepare() {
              # avoid unnecessary dep on extra sphinxcontrib modules
              sed -i '/sphinxcontrib.log_cabinet/ d' docs/conf.py || die
              distutils-r1_src_prepare
            }
            pkg_postinst() {
              if ! has_version dev-python/Babel; then
                elog "For i18n support, please emerge dev-python/Babel."
              fi
            }

setuptools_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "templates/pypi-generic.tmpl"
    vars:
      du_pep517: setuptools
    python_compat: "python3+"

  packages:
    - calver:
        vars:
          license: Apache-2.0
          body: |
            src_prepare() {
              sed -i -e 's/license = "Apache-2.0"/license = { text = "Apache-2.0" }/' pyproject.toml || die
              distutils-r1_src_prepare
            }

    - dependency-injector:
        pypi_name: dependency_injector
        vars:
          use:native-extensions:build:
            - cython
          iuse: +native-extensions
          license: BSD-3-Clause
          body: |
            python_compile() {
              local -x DEPENDENCY_INJECTOR_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                DEPENDENCY_INJECTOR_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - falcon:
        vars:
          license: Apache-2.0
        pydeps:
          py:all:build:
            - wheel
            - cython

    - html5lib:
        vars:
          license: MIT
        pydeps:
          py:all:runtime:
            - six
            - webencodings


standalone_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "templates/pypi-generic.tmpl"
    vars:
      du_pep517: standalone
    python_compat: "python3+"

  packages:

    - yarl:
        pydeps:
          py:all:build:
            - setuptools
            - expandvars
          use:native-extensions:build:
            - cython
          py:all:
            - idna >= 2.0
            - multidict >= 4.0
            - propcache >= 0.2.0
        vars:
          iuse: +native-extensions
          body: |
            python_compile() {
              local -x YARL_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                YARL_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - propcache:
        pydeps:
          py:all:build:
            - expandvars
            - setuptools
          use:native-extensions:build:
            - cython
        vars:
          license: Apache-2.0
          iuse: +native-extensions

          body: |
            python_compile() {
              local -x PROPCACHE_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                PROPCACHE_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

