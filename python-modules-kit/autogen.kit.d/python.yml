cryptography:
  generator: builtin-pypi

  extensions_defs:
    rust:
      opts:

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic-helm.tmpl"
    vars:
      du_pep517: maturin
    python_compat: "python3+"
    extensions:
      - rust

  packages:

    - cryptography:
        pydeps:
          py:all:both:
            - cffi >= 1.11.3
            - six >= 1.4.1
          py:all:build:
            - setuptools-rust >= 0.12.1
          py:all:runtime:
            - ipaddress
          use:idna:runtime:
            - idna >= 2.1
        vars:
          iuse: idna
          inherit:
            - cargo
            - distutils-r1
          depend: |
            virtual/rust
          extra_envs:
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
            - 'CARGO_OPTIONAL="yes"'
          body: |
            src_unpack() {
              if [[ ${CRYPTOGRAPHY_DONT_BUILD_RUST} ]] ; then
                default
              else
                cargo_src_unpack
              fi
            }


gnome_dirlisting:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"
  template:
    engine: helm

  defaults:
    category: dev-python
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    dir:
      url: https://download.gnome.org/sources/{{ .Values.tname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.tname | default .Values.pn }}-.*{{ .Values.tarsuffix }}$"
      exclude: 'rc|alpha|beta'
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: "{{ .Values.tarsuffix }}"
        replace: ""
    vars:
      tarsuffix: '.tar.xz'
      python_compat: python3+
      license: MIT

  packages:

    - pygobject:
        vars:
          tarsuffix: '.tar.gz'
          python_compat: python3+
          release: '3.55'
          slot: 3
          desc: Python bindings for GObject Introspection
          homepage: https://pygobject.gnome.org/ https://gitlab.gnome.org/GNOME/pygobject/
          inherit:
            - meson
            - xdg
            - distutils-r1
          license: LGPL-2.1+
          iuse: +cairo
          rdepend: |
            dev-libs/glib:2
            dev-libs/gobject-introspection:=
            dev-libs/libffi:=
            cairo? (
              dev-python/pycairo[${PYTHON_USEDEP}]
              x11-libs/cairo[glib]
            )
          depend: '${RDEPEND}'
          bdepend: |
            virtual/pkgconfig
          body: |
            python_configure() {
              local emesonargs=(
                $(meson_feature cairo pycairo)
                -Dtests=false
                -Dpython="${EPYTHON}"
              )
              meson_src_configure
            }
            python_compile() {
              meson_src_compile
            }
            python_install() {
              meson_src_install
              python_optimize
            }

    - libxslt-python:
        vars:
          s: '${WORKDIR}/{{ .Values.tname }}-{{ .Values.version }}'
          tname: libxslt
          iuse: +crypt static-libs
          inherit:
            - flag-o-matic
            - libtool
            - distutils-r1
          desc: XSLT libraries Python bindings
          homepage: https://gitlab.gnome.org/GNOME/libxslt
          release: 1.1
          rdepend: |
            =dev-libs/libxslt-{{ .Values.version }}:=[crypt?]
          depend: |
            ${RDEPEND}
          body: |
            src_prepare() {
              default
              elibtoolize
            }
            src_configure() {
              # Remove this after upstream merge request to add AC_SYS_LARGEFILE lands:
              # https://gitlab.gnome.org/GNOME/libxslt/-/merge_requests/55
              append-lfs-flags
              ECONF_SOURCE="${S}" econf \
                --with-python \
                $(use_with crypt crypto) \
                $(use_enable static-libs static)
              ( cd ${S}/python && ./generator.py ) || die
              export S="${S}/python"
              distutils-r1_src_configure
            }
            src_compile() {
              distutils-r1_src_compile
            }
            src_install() {
              distutils-r1_src_install
            }

github_pkgs:
  generator: builtin-github
  template:
    engine: helm

  github:
    query: releases

  defaults:
    category: dev-python
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    vars:
      python_compat: python3+

  packages:
    - pycairo:
        github:
          user: pygobject
        assets:
          - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz"
            matcher: "{{ .Values.pn }}-{{ .Values.version }}.tar.gz$"
        selector:
          # Pin for now because it seems that upstream
          # want py3.10 (but compiles also with py3.9)
          - '<1.29.0'
        vars:
          license: '| ( LGPL-2.1 MPL-1.1 )'
          inherit:
            - distutils-r1
            - meson
          rdepend: |
            x11-libs/cairo
          depend: |
            ${RDEPEND}
            x11-base/xorg-proto
          bdepend: |
            virtual/pkgconfig
          body: |
            python_compile() {
              local emesonargs=(
                  -Dpython.bytecompile=2
                  -Dtests=false
              )
              meson_src_configure
              meson_src_compile
            }
            python_install() {
              meson_src_install
            }

libxml2_python:
  generator: builtin-dirlisting
  generator_opts:
    # Limit rate at 1reqs/sec
    rate_limiter: "1"

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-python
    dir:
      url: https://download.gnome.org/sources/{{ .Values.tname | default .Values.pn }}/{{ .Values.release }}/
      matcher: "{{ .Values.tname | default .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: "{{ .Values.tname | default .Values.pn }}-"
        replace: ""
      - kind: string
        match: ".tar.xz"
        replace: ""
    vars:
      s: '${WORKDIR}/{{ .Values.tname | default .Values.pn }}-{{ .Values.version }}'
      slot: '2'
      tname: libxml2
      python_compat: python3+
      inherit:
        - distutils-r1
        - meson
      desc: Python binding of XML C parser and toolkit
      homepage: https://gitlab.gnome.org/GNOME/libxml2/-/wikis/home
      iuse: +icu +lzma readline static-libs
      rdepend: |
        =dev-libs/libxml2-{{ .Values.version }}:=[lzma?,icu?,readline?,static-libs?]
      depend: |
        ${RDEPEND}
        app-doc/doxygen
      release: '2.15'
      body: |
        src_prepare() {
          default
          sed -e "/^dir_doc/ s/meson.project_name()$/\'${PF}\'/" -i meson.build || die
          # Permit to compile libxml2 on stage3 without git installed.
          # Hack git command with echo in order to print an empty string.
          sed -e 's|git|echo|g' -e 's|describe||g' -i meson.build || die
        }
        src_configure() {
          local emesonargs=(
            -Ddefault_library=$(usex static-libs both shared)
            -Ddocs=disabled
            $(meson_feature icu)
            $(meson_feature readline)
            $(meson_feature readline history)
            -Dpython=enabled
            -Dschematron=enabled
            -Dlegacy=disabled
          )
          meson_src_configure
          export S="${S}/python"
          distutils-r1_src_configure
        }
        src_compile() {
          meson_src_compile
        }
        src_install() {
          meson_src_install
          # Remove files supplied by libxml2 library
          rm -r "${ED}"/usr/{lib64,bin,include} || die
        }

  packages:
    - libxml2-python:

