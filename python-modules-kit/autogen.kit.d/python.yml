    vars:
      du_pep517: poetry
    python_compat: "python3+"

  packages:
    - qrcode:

standalone_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: standalone
    python_compat: "python3+"

  packages:

    - brotlipy:
        pypi_name: Brotli
        depend: app-arch/brotli

    - yarl:
        pydeps:
          py:all:build:
            - setuptools
            - expandvars
          use:native-extensions:build:
            - cython
          py:all:
            - idna >= 2.0
            - multidict >= 4.0
            - propcache >= 0.2.0
        vars:
          iuse: +native-extensions
          body: |
            python_compile() {
              local -x YARL_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                YARL_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - jeepney:
        pydeps_ignore:
          - 'extra == "test"'
          - 'extra == "trio"'
        vars:
          license: MIT

    - meson-python:
        pypi_name: meson_python
        pydeps:
          py:all:runtime:
            - tomli
            - pyproject-metadata
          py:all:build:
            - pyproject-metadata
        vars:
          homepage: https://pypi.org/project/meson-python/
          depend: |
            dev-util/meson
          rdepend: |
            dev-util/patchelf

    - propcache:
        pydeps:
          py:all:build:
            - expandvars
            - setuptools
          use:native-extensions:build:
            - cython
        vars:
          license: Apache-2.0
          iuse: +native-extensions

          body: |
            python_compile() {
              local -x PROPCACHE_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                PROPCACHE_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - setuptools_scm:
        pypi_name: setuptools_scm
        pydeps:
          py:all:runtime:
            - tomli
            - packaging
            - importlib_metadata
          py:all:build:
            - tomli
            - packaging
            - importlib_metadata
        vars:
          license: MIT
          homepage: https://github.com/pypa/setuptools-scm/
          body: |
            src_configure() {
              if has_version "<dev-python/setuptools_scm-8"; then # only happens when setuptools_scm-7 is installed (main cause is duplicated entry points in similar fashion as in https://github.com/pypa/setuptools/issues/3649)
                # it could be done better, but only side effect is two aditional internal unused api files added
                # tested with python 3.12 - the duplicated entries where gone and update worked correctly without any quick fixes
                ewarn "adding /src/setuptools_scm/{file_finder_git.py,file_hinder_hg.py} which point to _file_finders.{git,hg} modules due to build tools interaction"
                echo "from ._file_finders.git import *" > ${S}/src/setuptools_scm/file_finder_git.py
                echo "from ._file_finders.hg import *" >  ${S}/src/setuptools_scm/file_finder_hg.py
              fi
              distutils-r1_src_configure
            }


bdepend_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    python_compat: "python3+"

  packages:
    - cachecontrol:
        pypi_name: cachecontrol
        pydeps:
          py:all:build:
            - requests
            - msgpack
          py:all:runtime:
            - requests
            - msgpack
        vars:
          license: Apache-2.0
          body: |
            src_prepare() {
              sed -i -e 's/license = "Apache-2.0"/license = { text = "Apache-2.0" }/' \
                -e '/^license-files.*/d' \
                pyproject.toml || die
              distutils-r1_src_prepare
            }

    - rpi-gpio:
        pypi_name: RPi.GPIO

standalone_github:
  generator: builtin-github

  defaults:
    category: dev-python
    template: ../../templates/simple-github.tmpl
    vars:
      python_compat: "python3+"

  packages:

    - monero:
        vars:
          inherit:
            - distutils-r1
          cdepend: |
            >=dev-python/pycryptodomex-3.14
            dev-python/pynacl[${PYTHON_USEDEP}]
            dev-python/PySocks[${PYTHON_USEDEP}]
            dev-python/requests[${PYTHON_USEDEP}]
            dev-python/ipaddress[${PYTHON_USEDEP}]
          rdepend: '${CDEPEND}'
          depend: '${CDEPEND}'
        github:
          query: tags
          user: DiosDelRayo
          repo: monero-python

    - pyzbar:
        vars:
          inherit:
            - distutils-r1
          desc: 'Read one-dimensional barcodes and QR codes from Python 2 and 3 (seedsigner fork)'
        github:
          user: SeedSigner
        transform:
          - kind: string
            match: '-ss Release'
            replace: ''

    - polyseed:
        vars:
          inherit:
            - distutils-r1
        github:
          query: tags
          user: DiosDelRayo
          repo: polyseed-python

    - urtypes:
        vars:
          inherit:
            - distutils-r1
        github:
          user: selfcustody


cryptography:
  generator: builtin-pypi

  extensions_defs:
    rust:
      opts:

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic-helm.tmpl"
    vars:
      du_pep517: maturin
    python_compat: "python3+"
    extensions:
      - rust

  packages:

    - cryptography:
        pydeps:
          py:all:both:
            - cffi >= 1.11.3
            - six >= 1.4.1
          py:all:build:
            - setuptools-rust >= 0.12.1
          py:all:runtime:
            - ipaddress
          use:idna:runtime:
            - idna >= 2.1
        vars:
          iuse: idna
          inherit:
            - cargo
            - distutils-r1
          depend: |
            virtual/rust
          extra_envs:
            - 'ECARGO_BUNDLE_POSTFIX="mark-rust-bundle"'
            - 'CARGO_OPTIONAL="yes"'
          body: |
            src_unpack() {
              if [[ ${CRYPTOGRAPHY_DONT_BUILD_RUST} ]] ; then
                default
              else
                cargo_src_unpack
              fi
            }
