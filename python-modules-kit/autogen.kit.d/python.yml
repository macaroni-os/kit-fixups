hatchling_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: hatchling

  packages:
    - expandvars:
        pydeps_ignore:
          - "extra == 'tests'"
        python_compat: "python3+"
        vars:
          license: MIT

flit_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: flit
    python_compat: "python3+"

  packages:


    - importlib_metadata:
        selector:
          # keep same version for now
          # fix issue macaroni-os/mark-issues#350
          - '<=6.7.0'
        pypi_name: importlib_metadata
        pydeps:
          py:all:runtime:
            - zipp
            - typing-extensions >= 3.6.4
        vars:
          desc: Read metadata from Python packages
          homepage: https://importlib-metadata.readthedocs.io/
          license: Apache-2.0
          body: |
            src_configure() {
              # write a custom pyproject.toml to ease setuptools bootstrap
              cat > pyproject.toml <<-EOF || die
              [build-system]
              requires = ["flit_core >=3.2,<4"]
              build-backend = "flit_core.buildapi"

              [project]
              name = "importlib_metadata"
              version = "${PV}"
              description = "Read metadata from Python packages"
              EOF
            }

    - jinja:
        pypi_name: jinja2
        pydeps:
          py:all:build:
            - markupsafe
          py:all:
            - markupsafe
        vars:
          desc: A full-featured template engine for Python
          homepage: https://palletsprojects.com/p/jinja/ https://pypi.org/project/Jinja2/
          license: BSD
          body: |
            src_prepare() {
              # avoid unnecessary dep on extra sphinxcontrib modules
              sed -i '/sphinxcontrib.log_cabinet/ d' docs/conf.py || die
              distutils-r1_src_prepare
            }
            pkg_postinst() {
              if ! has_version dev-python/Babel; then
                elog "For i18n support, please emerge dev-python/Babel."
              fi
            }

    - packaging:
        vars:
          homepage: https://github.com/pypa/packaging/
          license: '|| ( Apache-2.0 BSD-2 )'
        pydeps_ignore:
          - 'extra == "test"'
        selector:
          - '<25'


setuptools_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: setuptools
    python_compat: "python3+"

  packages:

    - calver:
        vars:
          license: Apache-2.0
          body: |
            src_prepare() {
              sed -i -e 's/license = "Apache-2.0"/license = { text = "Apache-2.0" }/' pyproject.toml || die
              distutils-r1_src_prepare
            }

    - dependency-injector:
        pypi_name: dependency_injector
        vars:
          use:native-extensions:build:
            - cython
          iuse: +native-extensions
          license: BSD-3-Clause
          body: |
            python_compile() {
              local -x DEPENDENCY_INJECTOR_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                DEPENDENCY_INJECTOR_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - embit:
        pydeps:
          py:all:build:
            - wheel

    - falcon:
        vars:
          license: Apache-2.0
        pydeps:
          py:all:build:
            - wheel
            - cython

    - llfuse:
        vars:
          license: LGPL-2
          depend: |
            sys-apps/attr
            virtual/pkgconfig
          rdepend: |
            sys-fs/fuse:0
        pydeps:
          py:all:build:
            - setuptools


    - html5lib:
        vars:
          license: MIT
        pydeps:
          py:all:runtime:
            - six
            - webencodings

    - pycamera:
        vars:
          cdepend: |
            media-libs/opencv[python]
          rdepend: '${CDEPEND}'
        pydeps:
          py:all:tool:
            - numpy
          py:all:runtime:
            - numpy

    - spidev:

    - setuptools_scm_git_archive:
        pypi_name: setuptools_scm_git_archive
        vars:
          license: MIT
        pydeps:
          py:all:tool:
            - setuptools_scm

poetry_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: poetry
    python_compat: "python3+"

  packages:
    - qrcode:

standalone_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    vars:
      du_pep517: standalone
    python_compat: "python3+"

  packages:

    - brotlipy:
        pypi_name: Brotli
        depend: app-arch/brotli

    - yarl:
        pydeps:
          py:all:build:
            - setuptools
            - expandvars
          use:native-extensions:build:
            - cython
          py:all:
            - idna >= 2.0
            - multidict >= 4.0
            - propcache >= 0.2.0
        vars:
          iuse: +native-extensions
          body: |
            python_compile() {
              local -x YARL_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                YARL_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - jeepney:
        pydeps_ignore:
          - 'extra == "test"'
          - 'extra == "trio"'
        vars:
          license: MIT

    - meson-python:
        pypi_name: meson_python
        pydeps:
          py:all:runtime:
            - tomli
            - pyproject-metadata
          py:all:build:
            - pyproject-metadata
        vars:
          homepage: https://pypi.org/project/meson-python/
          depend: |
            dev-util/meson
          rdepend: |
            dev-util/patchelf

    - propcache:
        pydeps:
          py:all:build:
            - expandvars
            - setuptools
          use:native-extensions:build:
            - cython
        vars:
          license: Apache-2.0
          iuse: +native-extensions

          body: |
            python_compile() {
              local -x PROPCACHE_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                PROPCACHE_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }

    - setuptools_scm:
        pypi_name: setuptools_scm
        pydeps:
          py:all:runtime:
            - tomli
            - packaging
            - importlib_metadata
          py:all:build:
            - tomli
            - packaging
            - importlib_metadata
        vars:
          license: MIT
          homepage: https://github.com/pypa/setuptools-scm/
          body: |
            src_configure() {
              if has_version "<dev-python/setuptools_scm-8"; then # only happens when setuptools_scm-7 is installed (main cause is duplicated entry points in similar fashion as in https://github.com/pypa/setuptools/issues/3649)
                # it could be done better, but only side effect is two aditional internal unused api files added
                # tested with python 3.12 - the duplicated entries where gone and update worked correctly without any quick fixes
                ewarn "adding /src/setuptools_scm/{file_finder_git.py,file_hinder_hg.py} which point to _file_finders.{git,hg} modules due to build tools interaction"
                echo "from ._file_finders.git import *" > ${S}/src/setuptools_scm/file_finder_git.py
                echo "from ._file_finders.hg import *" >  ${S}/src/setuptools_scm/file_finder_hg.py
              fi
              distutils-r1_src_configure
            }


bdepend_modules:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    category: dev-python
    template: "../../templates/pypi-generic.tmpl"
    python_compat: "python3+"

  packages:
    - cachecontrol:
        pypi_name: cachecontrol
        pydeps:
          py:all:build:
            - requests
            - msgpack
          py:all:runtime:
            - requests
            - msgpack
        vars:
          license: Apache-2.0
          body: |
            src_prepare() {
              sed -i -e 's/license = "Apache-2.0"/license = { text = "Apache-2.0" }/' \
                -e '/^license-files.*/d' \
                pyproject.toml || die
              distutils-r1_src_prepare
            }

    - rpi-gpio:
        pypi_name: RPi.GPIO

