sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-testing"

- name: "python-kit"
  url: "https://github.com/macaroni-os/python-kit"
  branch: "mark-testing"

- name: "python-modules-kit"
  url: "https://github.com/macaroni-os/python-modules-kit"
  branch: "mark-testing"

- name: "dev-kit"
  url: "https://github.com/macaroni-os/dev-kit"
  branch: "mark-testing"

- name: "geaaru-kit"
  url: "https://github.com/geaaru/geaaru_overlay"
  branch: "funtoo"

- name: "core-hw-kit"
  url: "https://github.com/macaroni-os/core-hw-kit"
  branch: "mark-testing"

target:
  name: python-modules-kit
  url: "https://github.com/macaroni-os/python-modules-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: dev-python/aws-crt-python
    - pkg: dev-python/botocore
    - pkg: dev-python/configparser
    - pkg: dev-python/contextlib2
    - pkg: dev-python/decorator
    - pkg: dev-python/distro
    - pkg: dev-python/dnspython
    - pkg: dev-python/flake8
    - pkg: dev-python/greenlet
    - pkg: dev-python/iso8601
    - pkg: dev-python/lark
    - pkg: dev-python/linecache2
    - pkg: dev-python/numpy
    - pkg: dev-python/pathlib2
    - pkg: dev-python/pefile
    - pkg: dev-python/prometheus_client
    - pkg: dev-python/pycodestyle
    - pkg: dev-python/pycryptodome
    - pkg: dev-python/pyflakes
    - pkg: dev-python/pykerberos
    - pkg: dev-python/python-dateutil
    - pkg: dev-python/python-memcached
    - pkg: dev-python/python-mimeparse
    - pkg: dev-python/python-sqlparse
    - pkg: dev-python/pyudev
    - pkg: dev-python/rsa
    - pkg: dev-python/ruamel-yaml
    - pkg: dev-python/s3transfer
    - pkg: dev-python/scandir
    - pkg: dev-python/setproctitle
    - pkg: dev-python/simplejson
    - pkg: dev-python/sqlalchemy
    - pkg: dev-python/sqlalchemy-migrate
    - pkg: dev-python/tempita
    - pkg: dev-python/tinycss2
    - pkg: dev-python/tomlkit
    - pkg: dev-python/traceback2
    - pkg: dev-python/uvicorn
    - pkg: dev-python/uvloop

