sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-xl"

- name: "python-modules-kit"
  url: "https://github.com/macaroni-os/python-modules-kit"
  branch: "mark-unstable"

target:
  name: python-modules-kit
  url: "https://github.com/macaroni-os/python-modules-kit"
  branch: mark-xl

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: dev-python/calver
    - pkg: dev-python/contourpy
    - pkg: dev-python/dependency-injector
    - pkg: dev-python/expandvars
    - pkg: dev-python/falcon
    - pkg: dev-python/fonttools
    - pkg: dev-python/importlib_metadata
    - pkg: dev-python/jinja
    - pkg: dev-python/yarl
    - pkg: dev-python/libvirt-python
    - pkg: dev-python/matplotlib
    - pkg: dev-python/pyparsing
    - pkg: dev-python/python-discovery
    - pkg: dev-python/propcache
