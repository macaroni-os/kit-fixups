sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

- name: "python-kit"
  url: "https://github.com/macaroni-os/python-kit"
  branch: "mark-iii"

- name: "python-modules-kit"
  url: "https://github.com/macaroni-os/python-modules-kit"
  branch: "mark-unstable"

target:
  name: python-modules-kit
  url: "https://github.com/macaroni-os/python-modules-kit"
  branch: mark-iii

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: dev-python/brotlipy
    - pkg: dev-python/cachecontrol
    - pkg: dev-python/calver
    - pkg: dev-python/certifi
    - pkg: dev-python/cryptography
    - pkg: dev-python/contourpy
    - pkg: dev-python/dependency-injector
    - pkg: dev-python/distlib
    - pkg: dev-python/expandvars
    - pkg: dev-python/embit
    - pkg: dev-python/falcon
    - pkg: dev-python/fonttools
    - pkg: dev-python/libxml2-python
    - pkg: dev-python/libxslt-python
    - pkg: dev-python/llfuse
    - pkg: dev-python/html5lib
    - pkg: dev-python/qrcode
    - pkg: dev-python/importlib_metadata
    - pkg: dev-python/jeepney
    - pkg: dev-python/jinja
    - pkg: dev-python/yarl
    - pkg: dev-python/matplotlib
    - pkg: dev-python/meson-python
    - pkg: dev-python/monero
    - pkg: dev-python/packaging
    - pkg: dev-python/pycamera
    - pkg: dev-python/pycairo
    - pkg: dev-python/pycotap
    - pkg: dev-python/pycryptodomex
    - pkg: dev-python/pygdbmi
    - pkg: dev-python/pygobject
    - pkg: dev-python/python-discovery
    - pkg: dev-python/pyzbar
    - pkg: dev-python/pyyaml
    - pkg: dev-python/pyparsing
    - pkg: dev-python/pyrfc3339
    - pkg: dev-python/platformdirs
    - pkg: dev-python/polyseed
    - pkg: dev-python/propcache
    - pkg: dev-python/requests
    - pkg: dev-python/setuptools_scm_git_archive
    - pkg: dev-python/shtab
    - pkg: dev-python/spidev
    - pkg: dev-python/setuptools_scm
    - pkg: dev-python/urllib3
    - pkg: dev-python/urtypes
    - pkg: dev-python/zipp
