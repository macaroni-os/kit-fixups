dev_python:
  generator: builtin-pypi
  template:
    engine: j2cli

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/pypi-generic.tmpl
    category: dev-python
    vars:
      python_compat: python3+

  packages:
    - PyQt-builder:
        vars:
          license: BSD
          homepage: https://pypi.org/project/PyQt-builder/
          body: |
            post_src_unpack() {
              mv pyqt_builder-* "${S}"
            }

            src_prepare() {
              sed -i -e 's/license =.*/license = { text = "BSD" }/' \
                -e '/^license-files.*/d' \
                pyproject.toml || die
              distutils-r1_src_prepare
            }

    - PyQt5:
        pydeps:
          py:all:build:
            - PyQt-builder
            - sip
          py:all:runtime:
            - PyQt5-sip:=

        vars:
          homepage: https://www.riverbankcomputing.com/software/pyqt/ https://pypi.org/project/PyQt5
          license: GPL-3
          inherit:
            - python-r1
            - qmake-utils
          iuse: |
            bluetooth dbus debug declarative designer examples gles2-only gui help location
            multimedia network opengl positioning printsupport sensors serialport speech
            sql +ssl svg testlib webchannel websockets widgets x11extras xmlpatterns
          required_use: |
            ${PYTHON_REQUIRED_USE}
            bluetooth? ( gui )
            declarative? ( gui network )
            designer? ( widgets )
            help? ( gui widgets )
            location? ( positioning )
            multimedia? ( gui network )
            opengl? ( gui widgets )
            positioning? ( gui )
            printsupport? ( gui widgets )
            sensors? ( gui )
            serialport? ( gui )
            sql? ( widgets )
            svg? ( gui widgets )
            testlib? ( widgets )
            webchannel? ( network )
            websockets? ( network )
            widgets? ( gui )
            xmlpatterns? ( network )
          cdepend: |
            ${PYTHON_DEPS}
            dev-qt/qtcore:5
            dev-qt/qtxml:5
            bluetooth? ( dev-qt/qtbluetooth:5 )
            dbus? (
              dev-python/dbus-python[${PYTHON_USEDEP}]
              dev-qt/qtdbus:5
            )
            declarative? ( dev-qt/qtdeclarative:5[widgets?] )
            designer? ( dev-qt/designer:5 )
            gui? ( dev-qt/qtgui:5[gles2-only=] )
            help? ( dev-qt/qthelp:5 )
            location? ( dev-qt/qtlocation:5 )
            multimedia? ( dev-qt/qtmultimedia:5[widgets?] )
            network? ( dev-qt/qtnetwork:5[ssl=] )
            opengl? ( dev-qt/qtopengl:5 )
            positioning? ( dev-qt/qtpositioning:5 )
            printsupport? ( dev-qt/qtprintsupport:5 )
            sensors? ( dev-qt/qtsensors:5 )
            serialport? ( dev-qt/qtserialport:5 )
            speech? ( dev-qt/qtspeech:5 )
            sql? ( dev-qt/qtsql:5 )
            svg? ( dev-qt/qtsvg:5 )
            testlib? ( dev-qt/qttest:5 )
            webchannel? ( dev-qt/qtwebchannel:5 )
            websockets? ( dev-qt/qtwebsockets:5 )
            widgets? ( dev-qt/qtwidgets:5 )
            x11extras? ( dev-qt/qtx11extras:5 )
            xmlpatterns? ( dev-qt/qtxmlpatterns:5 )
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}

          bdepend: |
            dev-qt/qtcore:5
            dbus? ( virtual/pkgconfig )
          body: |
            src_configure() {
              pyqt_use_enable() {
                use "$1" || return

                if [[ $# -eq 1 ]]; then
                  echo --enable=Qt${1^}
                else
                  shift
                  echo ${@/#/--enable=}
                fi
              }
              configuration() {
                local myconf=(
                  sip-build
                  --verbose
                  --confirm-license
                  --build-dir="${BUILD_DIR}"
                  --scripts-dir="$(python_get_scriptdir)"
                  --qmake="$(qt5_get_bindir)"/qmake
                  --no-make
                  $(usex debug '--debug --qml-debug --tracing' '')
                  $(usex dbus '' '--no-dbus-python')
                  $(usex declarative '' '--no-qml-plugin')
                  $(usex designer '' '--no-designer-plugin')
                  $(usex gles2-only '--disabled-feature=PyQt_Desktop_OpenGL' '')
                  $(usex ssl '' '--disabled-feature=PyQt_SSL')
                  --enable=pylupdate
                  --enable=pyrcc
                  --enable=Qt
                  $(pyqt_use_enable bluetooth)
                  --enable=QtCore
                  $(pyqt_use_enable dbus QtDBus)
                  $(pyqt_use_enable declarative QtQml QtQuick $(usex widgets QtQuickWidgets ''))
                  $(pyqt_use_enable designer)
                  $(pyqt_use_enable gui)
                  $(pyqt_use_enable gui $(use gles2-only && echo _QOpenGLFunctions_ES2 || echo _QOpenGLFunctions_{2_0,2_1,4_1_Core}))
                  $(pyqt_use_enable help)
                  $(pyqt_use_enable location)
                  $(pyqt_use_enable multimedia QtMultimedia $(usex widgets QtMultimediaWidgets ''))
                  $(pyqt_use_enable network)
                  $(pyqt_use_enable opengl QtOpenGL)
                  $(pyqt_use_enable positioning)
                  $(pyqt_use_enable printsupport QtPrintSupport)
                  $(pyqt_use_enable sensors)
                  $(pyqt_use_enable serialport QtSerialPort)
                  $(pyqt_use_enable speech QtTextToSpeech)
                  $(pyqt_use_enable sql)
                  $(pyqt_use_enable svg)
                  $(pyqt_use_enable testlib QtTest)
                  $(pyqt_use_enable webchannel QtWebChannel)
                  $(pyqt_use_enable websockets QtWebSockets)
                  $(pyqt_use_enable widgets)
                  $(pyqt_use_enable x11extras QtX11Extras)
                  --enable=QtXml
                  $(pyqt_use_enable xmlpatterns QtXmlPatterns)
                )
                echo "${myconf[@]}"
                "${myconf[@]}" || die

                # Run eqmake to respect toolchain and build flags
                run_in_build_dir eqmake5 -recursive ${PN}.pro
              }
              python_foreach_impl configuration
            }
            src_compile() {
              python_foreach_impl run_in_build_dir default
            }
            src_install() {
              installation() {
                emake INSTALL_ROOT="${D}" install
                python_optimize
                local exe
                for exe in "${D}$(python_get_scriptdir)"/*; do
                  python_doexe "${exe}"
                done
              }
              python_foreach_impl run_in_build_dir installation
              einstalldocs
              if use examples; then
                dodoc -r examples
              fi
            }

    - PyQt5-sip:
        pypi_name: pyqt5_sip

    - PyQtWebEngine:
        pydeps_ignore:
          - PyQt
        vars:
          license: GPL-3
          homepage: https://www.riverbankcomputing.com/software/pyqtwebengine/ https://pypi.org/project/PyQtWebEngine/
          inherit:
            - python-r1
            - qmake-utils
          iuse: debug
          required_use: ${PYTHON_REQUIRED_USE}
          cdepend: |
            ${PYTHON_DEPS}
            dev-python/PyQt5[gui,network,printsupport,ssl,webchannel,widgets,${PYTHON_USEDEP}]
            dev-qt/qtcore:5
            dev-qt/qtgui:5
            dev-qt/qtwebengine:5[widgets]
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}
            dev-python/PyQt5-sip:=[${PYTHON_USEDEP}]
          bdepend: |
            dev-python/PyQt-builder[${PYTHON_USEDEP}]
            dev-python/sip[${PYTHON_USEDEP}]
          body: |
            src_configure() {
              configuration() {
                local myconf=(
                  sip-build
                  --verbose
                  --build-dir="${BUILD_DIR}"
                  --scripts-dir="$(python_get_scriptdir)"
                  --qmake="$(qt5_get_bindir)"/qmake
                  --no-make
                  $(usex debug '--debug --qml-debug --tracing' '')
                )
                echo "${myconf[@]}"
                "${myconf[@]}" || die

                # Run eqmake to respect toolchain and build flags
                run_in_build_dir eqmake5 -recursive ${PN}.pro
              }
              python_foreach_impl configuration
            }
            src_compile() {
              python_foreach_impl run_in_build_dir default
            }
            src_install() {
              installation() {
                emake INSTALL_ROOT="${D}" install
                python_optimize
              }
              python_foreach_impl run_in_build_dir installation

              einstalldocs
            }

    - PyQt6:
        pydeps:
          py:all:build:
            - PyQt-builder
            - sip
          py:all:runtime:
            - PyQt6-sip:=

        vars:
          homepage: https://www.riverbankcomputing.com/software/pyqt/ https://pypi.org/project/PyQt6
          license: GPL-3
          inherit:
            - distutils-r1
            - qmake-utils
          du_pep517: sip
          iuse: |
            bluetooth debug multimedia pdf positioning quick3d remoteobjects sensors serialport speech
            sql statemachine webchannel websockets vulkan gles2-only wayland
          cdepend: |
            ${PYTHON_DEPS}
            dev-python/dbus-python[${PYTHON_USEDEP}]
            dev-python/sip[${PYTHON_USEDEP}]
            dev-qt/qtbase:6[gles2-only?,gui,vulkan?,wayland?]
            dev-qt/qtdeclarative:6
            dev-qt/qtsvg:6
            dev-qt/qttools:6[assistant]
            bluetooth? ( dev-qt/qtconnectivity:6 )
            multimedia? ( dev-qt/qtmultimedia:6 )
            pdf? ( dev-qt/qtwebengine:6 )
            positioning? ( dev-qt/qtlocation:6 )
            quick3d? ( dev-qt/qtquick3d:6 )
            remoteobjects? ( dev-qt/qtremoteobjects:6 )
            sensors? ( dev-qt/qtsensors:6 )
            serialport? ( dev-qt/qtserialport:6 )
            speech? ( dev-qt/qtspeech:6 )
            sql? ( dev-qt/qtbase:6[sql] )
            statemachine? ( dev-qt/qtscxml:6 )
            webchannel? ( dev-qt/qtwebchannel:6 )
            websockets? ( dev-qt/qtwebsockets:6 )
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}

          bdepend: |
            dev-python/PyQt6-sip[${PYTHON_USEDEP}]
            dev-python/PyQt-builder[${PYTHON_USEDEP}]
          s: '${WORKDIR}/pyqt6-{{ .Values.version}}'
          body: |
            python_configure_all() {
                pyqt_use_enable() {
                    use "$1" || return

                    if [[ $# -eq 1 ]]; then
                        echo --enable=Qt${1^}
                    else
                        shift
                        echo ${@/#/--enable=}
                    fi
                }
                DISTUTILS_ARGS=(
                    --qmake="$(qt6_get_bindir)"/qmake
                    --qmake-setting="$(qt6_get_qmake_args)"
                    --verbose
                    --confirm-license
                    $(usex debug '--debug --qml-debug' '')
                    --no-designer-plugin
                    --disabled-feature=PyQt_Permissions
                    --enable=QtCore
                    --enable=QtDBus
                    --enable=QtGui
                    --enable=QtHelp
                    --enable=QtNetwork
                    --enable=QtOpenGL
                    --enable=QtOpenGLWidgets
                    --enable=QtPrintSupport
                    --enable=QtQml
                    --enable=QtQuick
                    --enable=QtQuickWidgets
                    --enable=QtSvg
                    --enable=QtSvgWidgets
                    --enable=QtTest
                    --enable=QtWidgets
                    --enable=QtXml
                    $(usex vulkan '' '--disabled-feature=PyQt_Vulkan')
                    $(usex wayland '' '--disabled-feature=PyQt_Wayland')
                    $(usex gles2-only '' '--disabled-feature=PyQt_OpenGL_ES2')
                    $(pyqt_use_enable bluetooth QtBluetooth)
                    $(pyqt_use_enable bluetooth QtNfc)
                    $(pyqt_use_enable multimedia QtMultimedia)
                    $(pyqt_use_enable multimedia QtMultimediaWidgets)
                    $(pyqt_use_enable pdf QtPdf)
                    $(pyqt_use_enable pdf QtPdfWidgets)
                    $(pyqt_use_enable positioning QtPositioning)
                    $(pyqt_use_enable quick3d QtQuick3D)
                    $(pyqt_use_enable remoteobjects QtRemoteObjects)
                    $(pyqt_use_enable sensors QtSensors)
                    $(pyqt_use_enable serialport QtSerialPort)
                    $(pyqt_use_enable speech QtTextToSpeech)
                    $(pyqt_use_enable sql QtSql)
                    $(pyqt_use_enable statemachine QtStateMachine)
                    $(pyqt_use_enable webchannel QtWebChannel)
                    $(pyqt_use_enable websockets QtWebSockets)
                )
            }
            python_install_all() {
                einstalldocs
            }


    - PyQt6-sip:
        pypi_name: pyqt6_sip
        selector:
          - '<13.10.3'

    - PyQt6-sip:
        pypi_name: pyqt6_sip
        selector:
          - '>13.10'

    - PyQt6WebEngine:
        pypi_name: pyqt6_webengine
        pydeps_ignore:
          - PyQt
        vars:
          license: GPL-3
          homepage: https://www.riverbankcomputing.com/software/pyqtwebengine/ https://pypi.org/project/PyQt6-WebEngine/
          inherit:
            - python-r1
            - qmake-utils
          du_pep517: sip
          iuse: debug
          required_use: ${PYTHON_REQUIRED_USE}
          cdepend: |
            ${PYTHON_DEPS}
            dev-python/PyQt6[webchannel,${PYTHON_USEDEP}]
            dev-qt/qtbase:6
            dev-qt/qtwebengine:6
          depend: ${CDEPEND}
          rdepend: |
            ${CDEPEND}
          bdepend: |
            dev-python/PyQt-builder[${PYTHON_USEDEP}]
            dev-python/sip[${PYTHON_USEDEP}]
          body: |
            src_configure() {
                DISTUTILS_ARGS=(
                        --qmake="$(qt6_get_bindir)"/qmake
                        --qmake-setting="$(qt6_get_qmake_args)"
                        --verbose
                        --enable=QtWebEngineCore
                        $(usev debug '--debug --qml-debug --tracing')
                    )
            }
