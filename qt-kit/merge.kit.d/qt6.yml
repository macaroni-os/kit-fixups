# cat qt6.yml
sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: qt-kit
  url: "https://github.com/macaroni-os/qt-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 2

  atoms:

    - pkg: dev-qt/qt3d:6
    - pkg: dev-qt/qt5compat:6
    - pkg: dev-qt/qtbase:6
    - pkg: dev-qt/qtcharts:6
    - pkg: dev-qt/qtconnectivity:6
    - pkg: dev-qt/qtdeclarative:6
    - pkg: dev-qt/qthttpserver:6
    - pkg: dev-qt/qtimageformats:6
    - pkg: dev-qt/qtlanguageserver:6
    - pkg: dev-qt/qtlocation:6
    - pkg: dev-qt/qtmultimedia:6
    - pkg: dev-qt/qtnetworkauth:6
    - pkg: dev-qt/qtpositioning:6
    - pkg: dev-qt/qtquick3d:6
    - pkg: dev-qt/qtquicktimeline:6
    - pkg: dev-qt/qtscxml:6
    - pkg: dev-qt/qtsensors:6
    - pkg: dev-qt/qtserialport:6
    - pkg: dev-qt/qtshadertools:6
    - pkg: dev-qt/qtspeech:6
    - pkg: dev-qt/qtsvg:6
    - pkg: dev-qt/qttools:6
    - pkg: dev-qt/qttranslations:6
    - pkg: dev-qt/qtwayland:6
    - pkg: dev-qt/qtwebchannel:6
    - pkg: dev-qt/qtwebengine:6
    - pkg: dev-qt/qtwebsockets:6
    - pkg: dev-qt/qtwebview:6
