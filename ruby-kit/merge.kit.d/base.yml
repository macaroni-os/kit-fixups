sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-testing"

- name: "ruby-kit"
  url: "https://github.com/macaroni-os/ruby-kit"
  branch: "mark-testing"

target:
  name: ruby-kit
  url: "https://github.com/macaroni-os/ruby-kit"
  branch: mark-iii

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: dev-lang/ruby:3.1

    - pkg: dev-ruby/rubygems
    - pkg: dev-ruby/json:2
    - pkg: dev-ruby/minitest:5
    - pkg: dev-ruby/test-unit:2
    - pkg: dev-ruby/xmlrpc
    - pkg: dev-ruby/psych
    - pkg: dev-ruby/bundler:2
    - pkg: dev-ruby/kpeg:1
    - pkg: dev-ruby/net-telnet:1
    - pkg: dev-ruby/power_assert
    - pkg: dev-ruby/rake
    - pkg: dev-ruby/rdoc
    - pkg: dev-ruby/racc
    - pkg: dev-ruby/webrick
    - pkg: dev-ruby/stringio
    - pkg: dev-ruby/xmlrpc

    - pkg: virtual/ruby-ssl
    - pkg: virtual/rubygems

