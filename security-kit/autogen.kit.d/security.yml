openssl:
  generator: builtin-github
  template:
    engine: helm

  defaults:
    category: dev-libs
    files_dir: "{{ .Values.pn }}"
    github:
      query: releases

  packages:
    - openssl:
        template: templates/openssl3.tmpl
        github:
          user: openssl
          num_pages: 10
        vars:
          homepage: https://github.com/openssl/openssl
          desc: TLS/SSL and crypto library
          license: Apache-2.0
        # Uses 3.0 LTS release
        selector:
          - '<3.1.0'
          - '>3.0.0'
        transform:
          - kind: string
            match: 'OpenSSL '
            replace: ''

    - openssl:
        template: templates/openssl1.tmpl
        github:
          user: openssl
          num_pages: 7
        vars:
          homepage: https://github.com/openssl/openssl
          desc: TLS/SSL and crypto library
          license: Apache-2.0
          patches:
            - CVE-2023-5678.patch
        selector:
          - '<2.0'
          - '>=1.1'
        transform:
          - kind: string
            match: 'OpenSSL_'
            replace: ''
          - kind: string
            match: 'OpenSSL '
            replace: ''
          - kind: string
            match: '_'
            replace: '.'

    - openssh:
        category: net-misc
        vars:
          keywords: "*"
        github:
          user: openssh
          repo: openssh-portable
          query: tags
        transform:
          - kind: string
            match: 'P'
            replace: 'p'
          - kind: string
            match: 'V_'
            replace: ''
          - kind: string
            match: '_'
            replace: '.'
          - kind: string
            match: '.p'
            replace: '_p'

    - openssh:
        category: net-misc
        vars:
          keywords: "*"
        github:
          user: openssh
          repo: openssh-portable
          query: tags
        transform:
          - kind: string
            match: 'P'
            replace: 'p'
          - kind: string
            match: 'V_'
            replace: ''
          - kind: string
            match: '_'
            replace: '.'
          - kind: string
            match: '.p'
            replace: '_p'


sys_apps:
  generator: builtin-github
  template:
    engine: helm

  defaults:
    category: sys-apps
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases

  packages:
    - bubblewrap:
        github:
          user: containers
        vars:
          desc: Unprivileged sandboxing tool, namespaces-powered chroot-like solution
          homepage: https://github.com/containers/bubblewrap/
          license: LGPL-2
          iuse: selinux suid
          rdepend: |
            sys-libs/libseccomp
            sys-libs/libcap
            selinux? ( sys-libs/libselinux )
          depend: ${RDEPEND}
          bdepend: |
            app-text/docbook-xml-dtd:4.3
            app-text/docbook-xsl-stylesheets
            dev-libs/libxslt
            virtual/pkgconfig
          inherit:
            - meson

          body: |
            src_configure() {
              local emesonargs=(
                -Dbash_completion=enabled
                -Dman=enabled
                -Dtests=false
                -Dzsh_completion=enabled
                $(meson_feature selinux)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use suid; then
                chmod u+s "${ED}"/usr/bin/bwrap
              fi
            }

