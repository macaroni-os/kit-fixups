openssl:
  generator: builtin-github
  template:
    engine: helm

  defaults:
    category: dev-libs
    files_dir: "{{ .Values.pn }}"
    github:
      query: releases

  packages:
    - openssl:
        template: templates/openssl3.tmpl
        github:
          user: openssl
        vars:
          homepage: https://github.com/openssl/openssl
          desc: TLS/SSL and crypto library
          license: Apache-2.0
        # Uses 3.0 LTS release
        selector:
          - '<3.1.0'
          - '>3.0.0'
        transform:
          - kind: string
            match: 'OpenSSL '
            replace: ''

    - openssh:
        category: net-misc
        vars:
          keywords: "*"
        github:
          user: openssh
          repo: openssh-portable
          query: tags
        transform:
          - kind: string
            match: 'P'
            replace: 'p'
          - kind: string
            match: 'V_'
            replace: ''
          - kind: string
            match: '_'
            replace: '.'
          - kind: string
            match: '.p'
            replace: '_p'


