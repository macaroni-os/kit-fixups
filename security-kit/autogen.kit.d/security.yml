openssl:
  generator: builtin-github
  template:
    engine: helm

  defaults:
    category: dev-libs
    files_dir: "{{ .Values.pn }}"
    github:
      query: releases

  packages:
    - openssl:
        template: templates/openssl3.tmpl
        github:
          user: openssl
          num_pages: 10
        vars:
          homepage: https://github.com/openssl/openssl
          desc: TLS/SSL and crypto library
          license: Apache-2.0
        # Uses 3.0 LTS release
        selector:
          - '<3.1.0'
          - '>3.0.0'
        transform:
          - kind: string
            match: 'OpenSSL '
            replace: ''

    - openssl:
        template: templates/openssl1.tmpl
        github:
          user: openssl
          num_pages: 7
        vars:
          homepage: https://github.com/openssl/openssl
          desc: TLS/SSL and crypto library
          license: Apache-2.0
          patches:
            - CVE-2023-5678.patch
        selector:
          - '<2.0'
          - '>=1.1'
        transform:
          - kind: string
            match: 'OpenSSL_'
            replace: ''
          - kind: string
            match: 'OpenSSL '
            replace: ''
          - kind: string
            match: '_'
            replace: '.'

    - openssh:
        category: net-misc
        vars:
          keywords: "*"
        github:
          user: openssh
          repo: openssh-portable
          query: tags
        transform:
          - kind: string
            match: 'P'
            replace: 'p'
          - kind: string
            match: 'V_'
            replace: ''
          - kind: string
            match: '_'
            replace: '.'
          - kind: string
            match: '.p'
            replace: '_p'

    - openssh:
        category: net-misc
        vars:
          keywords: "*"
        github:
          user: openssh
          repo: openssh-portable
          query: tags
        transform:
          - kind: string
            match: 'P'
            replace: 'p'
          - kind: string
            match: 'V_'
            replace: ''
          - kind: string
            match: '_'
            replace: '.'
          - kind: string
            match: '.p'
            replace: '_p'


sys_apps:
  generator: builtin-github

  defaults:
    category: sys-apps
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases

  packages:
    - bubblewrap:
        github:
          user: containers
        vars:
          desc: Unprivileged sandboxing tool, namespaces-powered chroot-like solution
          homepage: https://github.com/containers/bubblewrap/
          license: LGPL-2
          iuse: selinux suid
          rdepend: |
            sys-libs/libseccomp
            sys-libs/libcap
            selinux? ( sys-libs/libselinux )
          depend: ${RDEPEND}
          bdepend: |
            app-text/docbook-xml-dtd:4.3
            app-text/docbook-xsl-stylesheets
            dev-libs/libxslt
            virtual/pkgconfig
          inherit:
            - meson

          body: |
            src_configure() {
              local emesonargs=(
                -Dbash_completion=enabled
                -Dman=enabled
                -Dtests=false
                -Dzsh_completion=enabled
                $(meson_feature selinux)
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              if use suid; then
                chmod u+s "${ED}"/usr/bin/bwrap
              fi
            }

sys_auth_pkgs:
  generator: builtin-github
  defaults:
    category: sys-auth
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: tags
  packages:
    - polkit:
        github:
          user: polkit-org
        vars:
          iuse: +elogind examples gtk +introspection kde pam
          inherit:
            - meson
            - pam
            - pax-utils
            - systemd
            - user
            - xdg-utils
          patches:
            - polkit-126-dbusmock.patch
            - polkit-126-elogind.patch
          rdepend: |
            dev-lang/duktape
            dev-libs/glib:2
            dev-libs/expat
            elogind? ( sys-auth/elogind )
            !elogind? ( sys-apps/systemd )
            pam? (
              sys-auth/pambase
              sys-libs/pam
            )
          depend: '${RDEPEND}'
          bdepend: |
            app-text/docbook-xml-dtd:4.1.2
            app-text/docbook-xsl-stylesheets
            dev-libs/gobject-introspection-common
            dev-libs/libxslt
            sys-devel/gettext
            virtual/pkgconfig
            introspection? ( dev-libs/gobject-introspection )
          pdepend: |
            gtk? ( || (
              gnome-extra/polkit-gnome
              lxde-base/lxsession
            ) )
            kde? ( kde-plasma/polkit-kde-agent )
          docs:
            - docs/TODO
            - HACKING.md
            - NEWS.md
            - README.md
          license: LGPL2+
          body: |
            pkg_setup() {
                local u=polkitd
                local g=polkitd
                local h=/var/lib/polkit-1
                enewgroup ${g}
                enewuser ${u} -1 -1 ${h} ${g}
                esethome ${u} ${h}
            }
            src_prepare() {
                default
                sed -i -e 's|unix-group:@PRIVILEGED_GROUP@|unix-user:@PRIVILEGED_GROUP@|' src/polkitbackend/*-default.rules.in || die
            }
            src_configure() {
                xdg_environment_reset
                local emesonargs=(
                    --localstatedir="${EPREFIX}"/var
                    -Dauthfw="$(usex pam pam shadow)"
                    -Dexamples=false
                    -Dgtk_doc=false
                    -Dman=true
                    -Dtests=false
                    -Dsession_tracking="$(usex elogind 'elogind' 'logind')"
                    -Dsystemdsystemunitdir="$(systemd_get_systemunitdir)"
                    $(meson_use introspection)
                    $(usex pam "-Dpam_module_dir=$(getpam_mod_dir)" '')
                )
                meson_src_configure
            }
            src_compile() {
                meson_src_compile
                # Required for polkitd on hardened/PaX due to spidermonkey's JIT
                pax-mark mr src/polkitbackend/.libs/polkitd test/polkitbackend/.libs/polkitbackendjsauthoritytest
            }
            src_install() {
                meson_src_install
                if use examples ; then
                    docinto examples
                    dodoc src/examples/{*.c,*.policy*}
                fi
                diropts -m 0700 -o polkitd
                keepdir /usr/share/polkit-1/rules.d
                fperms u+s /usr/bin/pkexec
                fperms u+s /usr/lib/polkit-1/polkit-agent-helper-1
            }
            pkg_postinst() {
                chmod 0700 "${EROOT}"/{etc,usr/share}/polkit-1/rules.d
                chown polkitd "${EROOT}"/{etc,usr/share}/polkit-1/rules.d
            }


