sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: security-kit
  url: "https://github.com/macaroni-os/security-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml
  atoms_defaults:
    max_versions: 3

  atoms:
    - pkg: app-crypt/gcr:4
      conditions:
        - '>=app-crypt/gcr-4.0:4'
    - pkg: app-crypt/gcr:0
      conditions:
        - '<app-crypt/gcr-4.0'

    - pkg: dev-libs/openssl
      conditions:
        - '<dev-libs/openssl-3.1'
        - '>=dev-libs/openssl-3.0.0'

    - pkg: dev-libs/openssl
      conditions:
        - '<dev-libs/openssl-1.2'
        - '>=dev-libs/openssl-1.1.0'

    - pkg: net-misc/openssh

    - pkg: sys-apps/bubblewrap

    - pkg: sys-auth/elogind
    - pkg: sys-auth/polkit
