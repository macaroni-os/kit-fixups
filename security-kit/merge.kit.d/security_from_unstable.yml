sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-iii"

- name: "security-kit"
  url: "https://github.com/macaroni-os/security-kit"
  branch: "mark-unstable"

target:
  name: security-kit
  url: "https://github.com/macaroni-os/security-kit"
  branch: mark-iii

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml
  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-crypt/gpgme
    - pkg: app-crypt/gpgmepp
    - pkg: app-crypt/pinentry
    - pkg: app-crypt/qgpgme

    - pkg: dev-libs/libgpg-error

    - pkg: sys-apps/bubblewrap

    # atm openssl3 is not yet available
    - pkg: dev-libs/xmlsec
      conditions:
        - '<dev-libs/xmlsec-1.3.0'
