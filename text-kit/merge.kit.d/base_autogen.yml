sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: text-kit
  url: "https://github.com/macaroni-os/text-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-text/cmark
    - pkg: app-text/evince
    - pkg: app-text/libgxps
    - pkg: app-text/libspelling
    - pkg: app-text/papers
    - pkg: app-text/poppler
    - pkg: app-text/poppler-data
