sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-testing"

- name: "text-kit"
  url: "https://github.com/macaroni-os/text-kit"
  branch: "mark-testing"

- name: "gnome-kit"
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: "mark-testing"

target:
  name: text-kit
  url: "https://github.com/macaroni-os/text-kit"
  branch: mark-iii

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: app-i18n/unicode-emoji

    - pkg: app-doc/xmltoman
    - pkg: app-doc/doxygen


    - pkg: app-text/asciidoctor
    - pkg: app-text/convertlit
    - pkg: app-text/ebook-tools
    - pkg: app-text/editorconfig-core-c
    - pkg: app-text/xmlto
    - pkg: app-text/ghostscript-gpl
    - pkg: app-text/libpaper
    - pkg: app-text/mandoc
    - pkg: app-text/poppler
    - pkg: app-text/pandoc-bin
    - pkg: app-text/qpdf
    - pkg: app-text/yelp-tools
    - pkg: app-text/tree
    - pkg: app-text/sgml-common

    - pkg: gnome-extra/yelp-xsl

