sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

- name: "text-kit"
  url: "https://github.com/macaroni-os/text-kit"
  branch: "mark-testing"

- name: "gnome-kit"
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: "mark-testing"

target:
  name: text-kit
  url: "https://github.com/macaroni-os/text-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: dev-tex/bibtexu
    - pkg: dev-tex/cpp2latex
    - pkg: dev-tex/html2latex
    - pkg: dev-tex/latex-beamer
    - pkg: dev-tex/latexdiff
    - pkg: dev-tex/latexmk
    - pkg: dev-tex/pgf
    - pkg: dev-tex/xcolor
    - pkg: dev-texlive/texlive-basic
    - pkg: dev-texlive/texlive-bibtexextra
    - pkg: dev-texlive/texlive-context
    - pkg: dev-texlive/texlive-fontsextra
    - pkg: dev-texlive/texlive-fontsrecommended
    - pkg: dev-texlive/texlive-fontutils
    - pkg: dev-texlive/texlive-formatsextra
    - pkg: dev-texlive/texlive-games
    - pkg: dev-texlive/texlive-humanities
    - pkg: dev-texlive/texlive-langarabic
    - pkg: dev-texlive/texlive-langcyrillic
    - pkg: dev-texlive/texlive-langczechslovak
    - pkg: dev-texlive/texlive-langenglish
    - pkg: dev-texlive/texlive-langeuropean
    - pkg: dev-texlive/texlive-langfrench
    - pkg: dev-texlive/texlive-langgerman
    - pkg: dev-texlive/texlive-langgreek
    - pkg: dev-texlive/texlive-langitalian
    - pkg: dev-texlive/texlive-langother
    - pkg: dev-texlive/texlive-langpolish
    - pkg: dev-texlive/texlive-langportuguese
    - pkg: dev-texlive/texlive-langspanish
    - pkg: dev-texlive/texlive-latex
    - pkg: dev-texlive/texlive-latexextra
    - pkg: dev-texlive/texlive-latexrecommended
    - pkg: dev-texlive/texlive-luatex
    - pkg: dev-texlive/texlive-mathscience
    - pkg: dev-texlive/texlive-metapost
    - pkg: dev-texlive/texlive-pictures
    - pkg: dev-texlive/texlive-plaingeneric
    - pkg: dev-texlive/texlive-pstricks
    - pkg: dev-texlive/texlive-xetex

    - pkg: virtual/latex-base
    - pkg: virtual/tex-base
    - pkg: virtual/texi2dvi
