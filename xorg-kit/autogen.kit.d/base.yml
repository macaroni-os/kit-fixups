        vars:
          inherit:
            - autotools
            - flag-o-matic
          rdepend: |
            x11-libs/libxcb:=
            x11-libs/xcb-util
          depend: |
            ${RDEPEND}
            sys-devel/autoconf
            sys-devel/automake
            sys-devel/libtool
            sys-devel/m4
            x11-libs/libX11
          bdepend: |
            virtual/pkgconfig
          body: |
            {{ .Values.body_extra | default "" }}
            src_prepare() {
              eautoreconf || die
              default
            }
            src_configure() {
              local no_static=""
              # Check if package supports disabling of static libraries
              if grep -q -s "able-static" ${ECONF_SOURCE:-.}/configure; then
                no_static="--disable-static"
              fi
              local econfargs=(
                --enable-shared
                ${no_static}
                {{ .Values.econf_args_extra | default "" }}
              )
              econf "${econfargs[@]}"
            }
            src_install() {
              default
              find "${D}" -type f -name '*.la' -delete || die
              {{ .Values.src_install_extra | default "" }}
            }


