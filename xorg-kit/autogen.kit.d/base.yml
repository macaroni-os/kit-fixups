            dev-util/intltool
          econf_args_extra: |
            --with-xkb-base="${EPREFIX}/usr/share/X11/xkb"
            --enable-compat-rules
            # do not check for runtime deps
            --disable-runtime-deps
            --with-xkb-rules-symlink=xorg


x11_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: x11-libs
    github:
      query: tags

  packages:
    - libxkbcommon:
        transform:
          - kind: string
            match: "xkbcommon-"
            replace: ""
        github:
          user: xkbcommon
        selector:
          # >=1.10.0 requires bison 3.6
          - '<=1.9.2'
        vars:
          inherit:
            - meson
          iuse: static-libs tools wayland X
          bdepend: |
            sys-devel/bison
            wayland? ( dev-util/wayland-scanner )
