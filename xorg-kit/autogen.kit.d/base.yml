          desc: Controls the keyboard layout of a running X server
          rdepend: |
            x11-libs/libxkbfile
            x11-libs/libX11

    - smproxy:
        vars:
          desc: Session Manager Proxy
          rdepend: |
            x11-libs/libXt
            x11-libs/libXmu

    # X11 utils
    - imake:
        category: x11-misc
        vars:
          xorg_path: util/
          rdepend: |
            x11-misc/xorg-cf-files
          econf_args_extra: |
            --disable-selective-werror
          patches:
            - imake-1.0.8-cpp-args.patch
            - imake-1.0.9-no-get-gcc.patch
            - imake-1.0.8-respect-LD.patch
            - imake-1.0.8-xmkmf-pass-cc-ld.patch

    - makedepend:
        category: x11-misc
        vars:
          desc: create dependencies in makefiles
          xorg_path: util/
          rdepend:
          econf_args_extra: |
            --disable-selective-werror

    - gccmakedep:
        category: x11-misc
        vars:
          desc: create dependencies in makefiles using 'gcc -M'
          xorg_path: util/
          rdepend:
          econf_args_extra: |
            --disable-selective-werror

    - util-macros:
        category: x11-misc
        vars:
          desc: X.Org autotools utility macros
          xorg_path: util/
          rdepend:
          depend: |
            ${RDEPEND}
            sys-devel/autoconf
            sys-devel/automake
            sys-devel/libtool
            sys-devel/m4
          body: |
            src_compile() { true; }

    - xbitmaps:
        category: x11-misc
        vars:
          desc: X.Org bitmaps data
          xorg_path: data/
          rdepend:
          depend: |
            ${RDEPEND}
            sys-devel/autoconf
            sys-devel/automake
            sys-devel/libtool
            sys-devel/m4
          body: |
            src_compile() { true; }

    - xkeyboard-config:
        category: x11-misc
        vars:
          tar_suffix: "tar.bz2"
          desc: X keyboard configuration database
          xorg_path: data/xkeyboard-config/
          rdepend:
          depend: |
            ${RDEPEND}
            sys-devel/autoconf
            sys-devel/automake
            sys-devel/libtool
            sys-devel/m4
