    - xcb-util-keysyms:
        vars:
          depend_extra: |
            x11-base/xorg-proto

    - xcb-util-renderutil:
    - xcb-util-wm:


gitlab_freedesktop_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: dev-libs
    dir:
      url: 'https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags'
      matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/releases/[0-9.]+"
      # Skip release candidate/beta versions
      exclude: '90[0-9]$'
    assets:
      - name: '{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
        url: 'https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/archive/{{ .Values.original_version }}/{{ .Values.pn }}-{{ .Values.version }}.tar.bz2'
    vars:
      license: MIT
      inherit:
        - meson

  packages:

    - libinput:
        vars:
          gitlab_user: libinput
          gitlab_repo: libinput
          iuse: input_devices_wacom
          rdepend: |
            input_devices_wacom? ( dev-libs/libwacom )
            >=dev-libs/libevdev-1.10.0
            sys-libs/mtdev
            virtual/libudev:=
            virtual/udev
          depend: '${RDEPEND}'
          desc: Library to handle input devices in Wayland
          homepage: 'https://www.freedesktop.org/wiki/Software/{{ .Values.pn }} https://gitlab.freedesktop.org/{{ .Values.pn }}/{{ .Values.pn }}'
          body: |
            src_configure() {
              local emesonargs=(
                -Ddebug-gui=false
                -Ddocumentation=false
                $(meson_use input_devices_wacom libwacom)
                -Dtests=false # tests are restricted
                -Dudev-dir="$(get_udevdir)"
              )
              meson_src_configure
            }
            pkg_postinst() {
              udevadm hwdb --update --root="${ROOT}"
            }

    - wayland:
        vars:
          gitlab_user: wayland
          gitlab_repo: wayland
          desc: Wayland protocol libraries
          homepage: 'https://wayland.freedesktop.org/ https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}'
          bdepend: |
            >=dev-util/wayland-scanner-{{ .Values.version }}
            virtual/pkgconfig
          rdepend: |
            dev-libs/expat:=
            dev-libs/libxml2:=
            dev-libs/libffi:=
          depend: '${RDEPEND}'
          body: |
            post_src_unpack() {
              mv {{ .Values.gitlab_repo }}-* ${S}
            }
            src_configure() {
              local emesonargs=(
                -Ddocumentation=false
                -Ddtd_validation=true
                -Dlibraries=true
                -Dscanner=false
                -Dtests=false
              )
              meson_src_configure
            }

    - wayland-protocols:
        vars:
          gitlab_user: wayland
          gitlab_repo: wayland-protocols
          desc: Wayland protocol files
          homepage: 'https://wayland.freedesktop.org/ https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}'
          bdepend: |
            virtual/pkgconfig
            dev-util/wayland-scanner
          s: '${WORKDIR}/{{ .Values.gitlab_repo }}-{{ .Values.version }}'

    - wayland-scanner:
        category: dev-util
        vars:
          gitlab_user: wayland
          gitlab_repo: wayland
          desc: wayland-scanner tool
          homepage: 'https://wayland.freedesktop.org/ https://gitlab.freedesktop.org/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}'
          bdepend: |
            virtual/pkgconfig
          rdepend: |
            dev-libs/expat:=
          depend: '${RDEPEND}'
          s: '${WORKDIR}/{{ .Values.gitlab_repo }}-{{ .Values.version }}'
          body: |
            post_src_unpack() {
              mv {{ .Values.gitlab_repo }}-* ${S}
            }
            src_configure() {
              local emesonargs=(
                -Ddocumentation=false
                -Ddtd_validation=false
                -Dlibraries=false
                -Dscanner=true
                -Dtests=false
              )
              meson_src_configure
            }

    - xdg-utils:
        category: x11-misc
        dir:
          matcher: "/{{ .Values.gitlab_user }}/{{ .Values.gitlab_repo }}/-/tags/v[0-9.]+"
        transform:
          - kind: string
            match: 'v'
            replace: ''
        vars:
          desc: Portland utils for cross-platform/cross-toolkit/cross-desktop interoperability
          homepage: https://www.freedesktop.org/wiki/Software/xdg-utils/
          gitlab_user: xdg
          gitlab_repo: xdg-utils
          inherit:
            - autotools
          iuse: dbus gnome doc
          required_use: gnome? ( dbus )
          rdepend: |
            dev-util/desktop-file-utils
            dev-perl/File-MimeInfo
            dbus? (
              sys-apps/dbus
              gnome? (
                dev-perl/Net-DBus
                dev-perl/X11-Protocol
              )
            )
            x11-misc/shared-mime-info
            x11-apps/xprop
            x11-apps/xset
          bdepend: |
            app-text/xmlto[text(+)]
            virtual/awk
          patches:
            - xdg-utils-1.2.1-qtpaths.patch
            - xdg-utils-1.2.1-xdg-mime-default.patch
          body: |
            post_src_unpack() {
              mv xdg-utils-* ${S}
            }
            src_configure() {
              export ac_cv_path_XMLTO="$(type -P xmlto) --skip-validation" #502166
              default
              emake -C scripts scripts-clean
            }
            src_install() {
              default
              dodoc RELEASE_NOTES
              newdoc scripts/xsl/README README.xsl
              use doc && dodoc -r scripts/html
              # Install default XDG_DATA_DIRS, bug #264647
              echo XDG_DATA_DIRS=\"${EPREFIX}/usr/local/share\" > 30xdg-data-local || die
              echo 'COLON_SEPARATED="XDG_DATA_DIRS XDG_CONFIG_DIRS"' >> 30xdg-data-local || die
              doenvd 30xdg-data-local
              echo XDG_DATA_DIRS=\"${EPREFIX}/usr/share\" > 90xdg-data-base || die
              echo XDG_CONFIG_DIRS=\"${EPREFIX}/etc/xdg\" >> 90xdg-data-base || die
              doenvd 90xdg-data-base
            }
            pkg_postinst() {
              [[ -x $(type -P gtk-update-icon-cache) ]] \
                || elog "Install dev-util/gtk-update-icon-cache for the gtk-update-icon-cache command."
            }


    - shared-mime-info:
        category: x11-misc
        vars:
          desc: The Shared MIME-info Database specification
          homepage: https://gitlab.freedesktop.org/xdg/shared-mime-info
          license: GPL-2
          gitlab_user: xdg
          gitlab_repo: shared-mime-info
          inherit:
            - meson
            - xdg-utils
          rdepend: |
            dev-libs/glib
            dev-libs/libxml2
          depend: |
            ${RDEPEND}
            app-text/xmlto
            dev-util/intltool
            sys-devel/gettext
            virtual/pkgconfig
          body: |
            src_configure() {
              local emesonargs=(
                -Dbuild-tools=true
                -Dupdate-mimedb=false
              )
              meson_src_configure
            }
            pkg_postinst() {
              xdg_mimeinfo_database_update
            }



freetype:
  generator: builtin-dirlisting
  defaults:
    template: ../../templates/simple.tmpl
    files_dir: "{{ .Values.pn }}"
    category: media-libs
    vars:
      slot: 2
      inherit:
        - flag-o-matic
        - libtool
        - toolchain-funcs
      license: '|| ( FTL GPL-2+ )'
      iuse: X +adobe-cff brotli bzip2 +cleartype_hinting debug fontforge harfbuzz png static-libs utils
      rdepend: |
        sys-libs/zlib
        brotli? ( app-arch/brotli )
        bzip2? ( app-arch/bzip2 )
        harfbuzz? ( media-libs/harfbuzz[truetype] )
        png? ( media-libs/libpng )
        utils? (
          X? (
            x11-libs/libX11
            x11-libs/libXau
            x11-libs/libXdmcp
          )
        )
      depend: '${RDEPEND}'
      bdepend: |
        virtual/pkgconfig
      body: |
        src_prepare() {
          default
          # This is the same as the 01 patch from infinality
          sed '/AUX_MODULES += \(gx\|ot\)valid/s@^# @@' -i modules.cfg || die
          enable_option() {
            sed -i -e "/#define $1/ { s:/\* ::; s: \*/:: }" \
              include/${PN}/config/ftoption.h \
              || die "unable to enable option $1"
          }
          disable_option() {
            sed -i -e "/#define $1/ { s:^:/* :; s:$: */: }" \
              include/${PN}/config/ftoption.h \
              || die "unable to disable option $1"
          }
          # Will be the new default for >=freetype-2.7.0
          disable_option "TT_CONFIG_OPTION_SUBPIXEL_HINTING  2"
          if use cleartype_hinting; then
            enable_option "TT_CONFIG_OPTION_SUBPIXEL_HINTING  2"
          fi
          # Can be disabled with FREETYPE_PROPERTIES="pcf:no-long-family-names=1"
          # via environment (new since v2.8)
          enable_option PCF_CONFIG_OPTION_LONG_FAMILY_NAMES
          # See http://freetype.org/patents.html
          # ClearType is covered by several Microsoft patents in the US
          enable_option FT_CONFIG_OPTION_SUBPIXEL_RENDERING
          if ! use adobe-cff; then
            enable_option CFF_CONFIG_OPTION_OLD_ENGINE
          fi
          if use debug; then
            enable_option FT_DEBUG_LEVEL_TRACE
            enable_option FT_DEBUG_MEMORY
          fi
          if use utils; then
            cd "${WORKDIR}/ft2demos-${PV}" || die
            # Disable tests needing X11 when USE="-X". (bug #177597)
            if ! use X; then
              sed -i -e "/EXES\ +=\ ftdiff/ s:^:#:" Makefile || die
            fi
            cd "${S}" || die
          fi
          # we need non-/bin/sh to run configure
          if [[ -n ${CONFIG_SHELL} ]] ; then
            sed -i -e "1s:^#![[:space:]]*/bin/sh:#!${CONFIG_SHELL}:" \
              "${S}"/builds/unix/configure || die
          fi
          elibtoolize --patch-only
        }
        src_configure() {
          append-flags -fno-strict-aliasing
          type -P gmake &> /dev/null && export GNUMAKE=gmake
          local myeconfargs=(
            --disable-freetype-config
            --enable-biarch-config
            --enable-shared
            $(use_with brotli)
            $(use_with bzip2)
            $(use_with harfbuzz)
            $(use_with png)
            $(use_enable static-libs static)
            # avoid using libpng-config
            LIBPNG_CFLAGS="$($(tc-getPKG_CONFIG) --cflags libpng)"
            LIBPNG_LDFLAGS="$($(tc-getPKG_CONFIG) --libs libpng)"
          )
          myeconfargs+=( ac_cv_prog_RC= ac_cv_prog_ac_ct_RC= )
          ECONF_SOURCE="${S}" econf "${myeconfargs[@]}"
        }
        src_compile() {
          default
          if use utils; then
            cd "${WORKDIR}/ft2demos-${PV}" || die
            einfo "Building utils"
            # fix for Prefix, bug #339334
            emake \
              X11_PATH="${EPREFIX}/usr/$(get_libdir)" \
              FT2DEMOS=1 TOP_DIR="${S}"
            cd "${S}" || die
          fi
        }
        src_install() {
          default
          if use utils; then
            einfo "Installing utils"
            rm "${WORKDIR}"/ft2demos-${PV}/bin/README || die
            dodir /usr/bin #654780
            local ft2demo
            for ft2demo in ../ft2demos-${PV}/bin/*; do
              libtool --mode=install $(type -P install) -m 755 "${ft2demo}" \
                "${ED}"/usr/bin || die
            done
          fi
          if use fontforge; then
            # Probably fontforge needs less but this way makes things simplier...
            einfo "Installing internal headers required for fontforge"
            local header
            find src/truetype include/freetype/internal -name '*.h' | \
            while read header; do
              mkdir -p "${ED}/usr/include/freetype2/internal4fontforge/$(dirname ${header})" || die
              cp ${header} "${ED}/usr/include/freetype2/internal4fontforge/$(dirname ${header})" || die
            done
          fi
          dodoc docs/{CHANGES,CUSTOMIZE,DEBUG,INSTALL.UNIX,*.txt,PROBLEMS,TODO}
          find "${ED}" -name '*.la' -delete || die
          if ! use static-libs ; then
            find "${ED}" -name '*.a' -delete || die
          fi
        }


    assets:
      - name: "{{ .Values.pn }}-{{ .Values.version }}.tar.xz"
        url: 'https://download.savannah.gnu.org/releases/{{ .Values.pn }}/{{ .Values.pn }}-{{ .Values.version }}.tar.xz'
      - name: "{{ .Values.pn }}-{{ .Values.version }}-ft2demos.tar.xz"
        url: 'https://download.savannah.gnu.org/releases/{{ .Values.pn }}/ft2demos-{{ .Values.version }}.tar.xz'
        use: utils
    dir:
      url: 'http://download.savannah.nongnu.org/releases/{{ .Values.pn }}'
      matcher: "{{ .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''

  packages:
    - freetype:


media_github:
  generator: builtin-github
  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    category: media-libs

  packages:
    - libjpeg-turbo:
        github:
          match: '^[0-9.]+'
        vars:
          iuse: cpu_flags_arm_neon java static-libs arm amd64
          inherit:
            - cmake
            - java-pkg-opt-2
          bdepend: |
            dev-util/cmake
            amd64? (
              || ( dev-lang/nasm dev-lang/yasm )
            )
          depend: |
            java? ( virual/jdk:*[-headless-awt] )
          rdepend: |
            java? ( virual/jdk:* )
          body: |
            src_prepare() {
              cmake_src_prepare
              java-pkg-opt-2_src_prepare
            }
            src_configure() {
              if use java ; then
                export JAVACFLAGS="$(java-pkg_javac-args)"
                export JNI_CFLAGS="$(java-pkg_get-jni-cflags)"
              fi
              local mycmakeargs=(
                -DCMAKE_INSTALL_DEFAULT_DOCDIR="${EPREFIX}/usr/share/doc/${PF}"
                -DENABLE_STATIC="$(usex static-libs)"
                -DWITH_JAVA="$(usex java)"
                -DWITH_MEM_SRCDST=ON
              )
              # Avoid ARM ABI issues by disabling SIMD for CPUs without NEON. #792810
              if use arm || use arm64; then
                mycmakeargs+=(
                  -DWITH_SIMD=$(usex cpu_flags_arm_neon)
                  -DNEON_INTRINSICS=$(usex cpu_flags_arm_neon)
                )
              fi
              if has_version -b dev-lang/yasm && ! has_version -b dev-lang/nasm; then
                mycmakeargs+=(
                  -DCMAKE_ASM_NASM_COMPILER=$(type -P yasm)
                )
              fi
              cmake_src_configure
            }
            src_install() {
              cmake_src_install
              if use java ; then
                rm -rf "${ED}"/usr/share/java || die
                java-pkg_dojar ${BUILD_DIR}/java/turbojpeg.jar
              fi
              find "${ED}" -type f -name '*.la' -delete || die
              local -a DOCS=( README.md ChangeLog.md )
              einstalldocs
              docinto html
              dodoc -r "${S}"/doc/turbojpeg/.
              if use java; then
                docinto html/java
                dodoc -r "${S}"/java/doc/.
                newdoc "${S}"/java/README README.java
              fi
            }


