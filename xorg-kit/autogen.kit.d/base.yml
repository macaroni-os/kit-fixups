            x11-libs/libX11
            x11-libs/libXmu
            x11-libs/libXaw
            x11-libs/libXt
            x11-misc/xbitmaps
          src_install_extra: |
            rm -f "${ED}"/usr/bin/xkeystone || die

    - bdftopcf:
        vars:
          tar_suffix: "tar.gz"

    - iceauth:
