        {{ .Values.rdepend_extra | default "" }}
      depend: |
        ${RDEPEND}
        sys-devel/autoconf
        sys-devel/automake
        sys-devel/libtool
        sys-devel/m4
        dev-util/gperf
        {{ .Values.depend_extra | default "" }}
      bdepend: |
        virtual/pkgconfig
      body: |
        {{ .Values.body_extra | default "" }}
        src_prepare() {
          eautoreconf || die
          default
        }
        src_configure() {
          local no_static=""
          # Check if package supports disabling of static libraries
          if grep -q -s "able-static" ${ECONF_SOURCE:-.}/configure; then
            no_static="--disable-static"
          fi
          local econfargs=(
            --enable-shared
            ${no_static}
            {{ .Values.econf_args_extra | default "" }}
          )
          econf "${econfargs[@]}"
        }
        src_install() {
          default
          find "${D}" -type f -name '*.la' -delete || die
          {{ .Values.src_install_extra | default "" }}
        }

  packages:
    - xcb-util:
        vars:
          pdepend: |
            x11-libs/xcb-util-cursor:=
            x11-libs/xcb-util-renderutil:=
            >=x11-libs/xcb-util-image-{{ .Values.version }}:=
            >=x11-libs/xcb-util-keysyms-{{ .Values.version }}:=
            >=x11-libs/xcb-util-wm-{{ .Values.version }}:=

    - xcb-util-cursor:
        vars:
