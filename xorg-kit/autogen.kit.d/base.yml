x11_base_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: x11-base
    dir:
      url: 'https://www.x.org/releases/individual/{{ .Values.xorg_path }}'
      exclude: ".99"
    vars:
      license: MIT

  packages:

    - xcb-proto:
        dir:
          matcher: "xcb-proto-.*.tar.xz$"
        transform:
          - kind: string
            match: 'xcb-proto-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          desc:  C-language Bindings protocol headers
          homepage: https://xcb.freedesktop.org/ https://gitlab.freedesktop.org/xorg/proto/xcbproto
          xorg_path: proto/
          python_compat: python3+
          required_use: '${PYTHON_REQUIRED_USE}'
          inherit:
            - python-r1
          rdepend: |
            ${PYTHON_DEPS}
          bdepend: |
            ${PYTHON_DEPS}
            dev-libs/libxml2
          body: |
            src_configure() {
              PYTHON=true default
            }
            src_compile() {
              :
            }
            xcbgen_install() {
              emake -C xcbgen install DESTDIR="${D}" pythondir="$(python_get_sitedir)"
              python_optimize
            }
            src_install() {
              # Restrict SUBDIRS to prevent xcbgen with empty sitedir.
              emake install DESTDIR="${D}" SUBDIRS=src
              python_foreach_impl xcbgen_install
            }

    - xorg-proto:
        dir:
          matcher: "xorgproto-.*.tar.xz$"
        transform:
          - kind: string
            match: 'xorgproto-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          desc: X.Org combined protocol headers
          homepage: https://gitlab.freedesktop.org/xorg/proto/xorgproto
          xorg_path: proto/
          python_compat: python3+
          s: '"${WORKSPACE}"/{{ .Values.pn | replace "-" "" }}'
          inherit:
            - meson
            - python-any-r1
          body: |
            src_configure() {
              local emesonargs=(
                --datadir=/usr/share
                -Dlegacy=false
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              DOCS=(
                AUTHORS
                PM_spec
                $(set +f; echo COPYING-*)
                $(set +f; echo *.txt | grep -v meson.txt)
              )
              einstalldocs
            }

    - xwayland:
        dir:
          matcher: "xwayland-.*.tar.xz$"
        transform:
          - kind: string
            match: 'xwayland-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          xorg_path: xserver/
          desc: Compatibility X server to run under Wayland
          homepage: https://wayland.freedesktop.org/xserver.html
          iuse: rpc selinux unwind video_cards_nvidia xcsecurity
          cdepend: |
            dev-libs/libbsd
            dev-libs/openssl
            >=dev-libs/wayland-1.21.0
            >=dev-libs/wayland-protocols-1.30
            media-fonts/font-util
            media-libs/libepoxy[X,egl(+)]
            media-libs/libglvnd[X]
            media-libs/mesa[X(+),egl(+),gbm(+)]
            x11-apps/xkbcomp
            x11-base/xorg-proto
            x11-libs/libdrm
            x11-libs/libXau
            x11-libs/libxcvt
            x11-libs/libXdmcp
            x11-libs/libXfont2
            x11-libs/libxkbfile
            x11-libs/libxshmfence
            x11-libs/pixman
            x11-libs/xtrans
            x11-misc/xkeyboard-config
            selinux? (
              sys-process/audit
              sys-libs/libselinux
            )
            unwind? ( sys-libs/libunwind )
            video_cards_nvidia? ( gui-libs/egl-wayland )
          depend: |
            ${CDEPEND}
          rdepend: |
            ${CDEPEND}
            selinux? ( sec-policy/selinux-xserver )
            !<=x11-base/xorg-server-1.20.11
          body: |
            src_configure() {
              local emesonargs=(
                $(meson_use rpc secure-rpc)
                $(meson_use selinux xselinux)
                $(meson_use unwind libunwind)
                $(meson_use xcsecurity)
                $(meson_use video_cards_nvidia xwayland_eglstream)
                -Ddpms=true
                -Ddri3=true
                -Ddtrace=false
                -Dglamor=true
                -Dglx=true
                -Dipv6=true
                -Dscreensaver=true
                -Dsha1=libcrypto
                -Dxace=true
                -Dxdmcp=true
                -Dxinerama=true
                -Dxvfb=true
                -Dxv=true
                -Dxwayland-path="${EPREFIX}"/usr/bin
              )
              meson_src_configure
            }
            src_install() {
              meson_src_install
              # Part of xorg-server
              rm -f "${ED}"/usr/share/man/man1/Xserver.1 || die
              # Part of xorg-server
              rm -f "${ED}"/usr/lib64/xorg/protocol.txt || die
            }

    - xorg-server:
        dir:
          matcher: "xorg-server-.*.tar.xz$"
        transform:
          - kind: string
            match: 'xorg-server-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          xorg_path: xserver/
          desc: x.org X server
          homepage: https://www.x.org/wiki
          iuse: kdrive xephyr xnest xorg xvfb debug +elogind minimal selinux +suid +udev unwind xcsecurity systemd
          inherit:
            - meson
          cdepend: |
            dev-libs/libbsd
            dev-libs/openssl
            media-libs/libglvnd[X]
            sys-devel/flex
            x11-apps/xkbcomp
            x11-base/xorg-proto
            x11-libs/libXau
            x11-libs/libXdmcp
            x11-libs/libXfont2
            x11-libs/libdrm
            x11-libs/libpciaccess
            x11-libs/libxkbfile
            x11-libs/libxshmfence
            x11-libs/pixman
            x11-libs/xtrans
            x11-misc/xkeyboard-config
            elogind? (
              sys-apps/dbus
              sys-auth/elogind[pam]
            )
            kdrive? (
              x11-libs/libXext
              x11-libs/libXv
            )
            udev? ( virtual/libudev )
            unwind? ( sys-libs/libunwind )
            xephyr? (
              x11-libs/libxcb
              x11-libs/xcb-util
              x11-libs/xcb-util-image
              x11-libs/xcb-util-keysyms
              x11-libs/xcb-util-renderutil
              x11-libs/xcb-util-wm
            )
            xnest? (
              x11-libs/libXext
              x11-libs/libX11
            )
            xorg? (
              x11-apps/xinit
              x11-libs/libxcvt
            )
            !minimal? (
              x11-libs/libXext
              x11-libs/libX11
              media-libs/mesa[X(+),egl(+),gbm(+)]
              media-libs/libepoxy[X,egl(+)]
            )
            systemd? (
              sys-apps/dbus
              sys-apps/systemd
            )
          depend: |
            ${CDEPEND}
          rdepend: |
            ${CDEPEND}
            selinux? ( sec-policy/selinux-xserver )
          bdepend: |
            media-fonts/font-util
          body: |
            src_configure() {
              local emesonargs=(
                --localstatedir "${EPREFIX}"/var
                --sysconfdir "${EPREFIX}"/etc/X11
                --buildtype $(usex debug debug plain)
                -Db_ndebug=$(usex debug false true)
                $(meson_use !minimal dri1)
                $(meson_use !minimal dri2)
                $(meson_use !minimal dri3)
                $(meson_use !minimal glamor)
                $(meson_use !minimal glx)
                $(meson_use udev)
                $(meson_use udev udev_kms)
                $(meson_use unwind libunwind)
                $(meson_use xcsecurity)
                $(meson_use selinux xselinux)
                $(meson_use xephyr)
                $(meson_use xnest)
                $(meson_use xorg)
                $(meson_use xvfb)
                -Ddocs=false
                -Ddrm=true
                -Ddtrace=false
                -Dipv6=true
                -Dhal=false
                -Dlinux_acpi=false
                -Dlinux_apm=false
                -Dsecure-rpc=false
                -Dsha1=libcrypto
                -Dxkb_output_dir="${EPREFIX}"/var/lib/xkb
                -Dxkb_dir="${EPREFIX}"/usr/share/X11/xkb
                -Dsystemd_logind=true
                $(meson_use suid suid_wrapper)
                )

              meson_src_configure
            }

            src_install() {
              meson_src_install

              newinitd "${FILESDIR}"/xdm-setup.initd-1 xdm-setup
              newinitd "${FILESDIR}"/xdm.initd-14 xdm
              newconfd "${FILESDIR}"/xdm.confd-4 xdm

              # The meson build system does not support install-setuid
              if ! use elogind; then
                if use suid; then
                  chmod u+s "${ED}"/usr/bin/Xorg
                fi
              fi

              if ! use xorg; then
                rm -f "${ED}"/usr/share/man/man1/Xserver.1x \
                  "${ED}"/usr/$(get_libdir)/xserver/SecurityPolicy \
                  "${ED}"/usr/$(get_libdir)/pkgconfig/xorg-server.pc \
                  "${ED}"/usr/share/man/man1/Xserver.1x || die
              fi

              # install the @x11-module-rebuild set for Portage
              insinto /usr/share/portage/config/sets
              newins "${FILESDIR}"/xorg-sets.conf xorg.conf
            }

            pkg_postrm() {
              # Get rid of module dir to ensure opengl-update works properly
              if [[ -z ${REPLACED_BY_VERSION} && -e ${EROOT}/usr/$(get_libdir)/xorg/modules ]]; then
                rm -rf "${EROOT}"/usr/$(get_libdir)/xorg/modules
              fi
            }

    # NOTE: we use xorg-server version to generate xorg-drivers
    - xorg-drivers:
        ignore_artefacts: true
        dir:
          matcher: "xorg-server-.*.tar.xz$"
        transform:
          - kind: string
            match: 'xorg-server-'
            replace: ''
          - kind: string
            match: '.tar.xz'
            replace: ''
        vars:
          xorg_path: xserver/
          desc: Meta package containing deps on all xorg drivers
          iuse: '${IUSE_VIDEO_CARDS} ${USE_INPUT_DEVICES}'
          extra_envs:
            - |
              USE_INPUT_DEVICES="
                input_devices_evdev
                input_devices_libinput
                input_devices_mouse
                input_devices_vmmouse
                input_devices_synaptics
                input_devices_wacom
              "
            - |
              IUSE_VIDEO_CARDS="
                video_cards_amdgpu
                video_cards_dummy
                video_cards_fbdev
                video_cards_nouveau
                video_cards_vesa
                video_cards_virtualbox
                video_cards_vmware
                video_cards_nvidia
              "
          pdepend: |
            input_devices_evdev? (
              >=x11-base/xorg-server-{{ .Values.version }}[udev]
              x11-drivers/xf86-input-evdev
            )
            input_devices_libinput?    (
              >=x11-base/xorg-server-{{ .Values.version }}[udev]
              x11-drivers/xf86-input-libinput
            )
            input_devices_mouse? ( x11-drivers/xf86-input-mouse )
            input_devices_vmmouse? ( x11-drivers/xf86-input-vmmouse )
            input_devices_synaptics? ( x11-drivers/xf86-input-synaptics )
            input_devices_wacom? ( x11-drivers/xf86-input-wacom )
            video_cards_amdgpu? ( x11-drivers/xf86-video-amdgpu )
            video_cards_dummy? ( x11-drivers/xf86-video-dummy )
            video_cards_fbdev? ( x11-drivers/xf86-video-fbdev )
            video_cards_nouveau? ( x11-drivers/xf86-video-nouveau )
            video_cards_nvidia? ( x11-drivers/nvidia-drivers )
            video_cards_vesa? ( x11-drivers/xf86-video-vesa )
            video_cards_virtualbox? ( x11-drivers/xf86-video-vbox )
            video_cards_vmware? ( x11-drivers/xf86-video-vmware )


x11_libs_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: x11-libs
    dir:
      url: 'https://www.x.org/releases/individual/{{ .Values.xorg_path }}'
      exclude: ".99"
      matcher: "{{ .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      license: MIT
      xorg_path: lib/
      inherit:
        - autotools
        - flag-o-matic
      homepage: 'https://gitlab.freedesktop.org/xorg/lib/{{ .Values.pn }}'
      desc: 'X.Org {{ .Values.pn | replace "lib" "" }} library'
      rdepend: |
        x11-libs/libX11
        x11-libs/libXext
        {{ .Values.rdepend_extra | default "" }}
      depend: |
        ${RDEPEND}
        sys-devel/autoconf
        sys-devel/automake
        sys-devel/libtool
        sys-devel/m4
        x11-misc/util-macros
        media-fonts/font-util
        x11-base/xorg-proto
        {{ .Values.depend_extra | default "" }}
      bdepend: |
        virtual/pkgconfig
      body: |
        {{ .Values.body_extra | default "" }}
        src_prepare() {
          eautoreconf || die
          default
        }
        src_configure() {
          local no_static=""
          # Check if package supports disabling of static libraries
          if grep -q -s "able-static" ${ECONF_SOURCE:-.}/configure; then
            no_static="--disable-static"
          fi
          local econfargs=(
            --enable-shared
            ${no_static}
            {{ .Values.econf_args_extra | default "" }}
          )
          econf "${econfargs[@]}"
        }
        src_install() {
          default
          find "${D}" -type f -name '*.la' -delete || die
          {{ .Values.src_install_extra | default "" }}
        }

  packages:
    - libXScrnSaver:

    - libXaw:
        vars:
          rdepend_extra: |
            x11-libs/libXmu
            x11-libs/libXpm
            x11-libs/libXt

    - libXcursor:
        vars:
          rdepend_extra: |
            x11-libs/libXrender
            x11-libs/libXfixes
          econf_args_extra: |
            --with-icondir="${EPREFIX}"/usr/share/cursors/xorg-x11
            --with-cursorpath='~/.cursors:~/.icons:/usr/local/share/cursors/xorg-x11:/usr/local/share/cursors:/usr/local/share/icons:/usr/local/share/pixmaps:/usr/share/cursors/xorg-x11:/usr/share/cursors:/usr/share/pixmaps/xorg-x11:/usr/share/icons:/usr/share/pixmaps'

    - libXfont2:
        vars:
          iuse: bzip2 ipv6 truetype
          rdepend_extra: |
            x11-libs/libfontenc
            x11-libs/xtrans
            bzip2? ( app-arch/bzip2 )
            truetype? ( media-libs/freetype )
          econf_args_extra: |
            $(use_enable ipv6)
            $(use_with bzip2)
            $(use_enable truetype freetype)
            --without-fop

    - libXinerama:

    - libXpm:
        vars:
          depend_extra: |
            sys-devel/gettext
    - libXv:
    - libXxf86dga:
    - libdmx:
    - libXau:
    - libXdmcp:
        vars:
          rdepend: |
            || (
              sys-libs/glibc
              dev-libs/libbsd
            )
          econf_args_extra: |
            --without-fop
          desc: X.Org X Display Manager Control Protocol library

    - libXext:
        vars:
          rdepend: |
            x11-libs/libX11
          econf_args_extra: |
            --without-fop

    - libXrender:
        vars:
          rdepend: |
            x11-libs/libX11

    - libfontenc:
        vars:
          rdepend: |
            sys-libs/zlib
          econf_args_extra: |
            --with-encodingsdir="${EPREFIX}/usr/share/fonts/encodings"

    - libICE:
        vars:
          iuse: ipv6
          rdepend: |
            || (
              sys-libs/glibc
              dev-libs/libbsd
            )
            x11-libs/xtrans
          econf_args_extra: |
            $(use_enable ipv6)
            --disable-docs
            --disable-specs
            --without-fop

    - libSM:
        vars:
          iuse: +uuid ipv6
          rdepend: |
            uuid? ( sys-apps/util-linux )
            x11-libs/libICE
          depend_extra: |
            x11-libs/xtrans
          econf_args_extra: |
            $(use_enable ipv6)
            $(use_with uuid libuuid)
            --disable-docs
            --without-fop

    - libXcomposite:
        vars:
          rdepend: |
            x11-libs/libX11
          depend_extra: |
            x11-libs/libXfixes

    - libXdamage:
        vars:
          rdepend: |
            x11-libs/libX11
          depend_extra: |
            x11-libs/libXfixes

    - libXfixes:
        vars:
          rdepend: |
            x11-libs/libX11

    - libXft:
        vars:
          rdepend_extra: |
            media-libs/fontconfig
            media-libs/freetype
            virtual/ttf-fonts
            x11-libs/libXrender

    - libXi:
        vars:
          rdepend_extra: |
            x11-libs/libXfixes
          econf_args_extra: |
            --without-fop

    - libXmu:
        vars:
          rdepend_extra: |
            x11-libs/libXt
          econf_args_extra: |
            --without-fop

    - libXrandr:
        vars:
          rdepend_extra: |
            x11-libs/libXrender

    - libXt:
        vars:
          desc: X.Org X Toolkit Intrinsics library
          rdepend_extra: |
            x11-libs/libICE
            x11-libs/libSM
          econf_args_extra: |
            --without-fop

    - libXtst:
        vars:
          desc: X.Org Xlib-based client API for the XTEST & RECORD extensions library
          rdepend_extra: |
            x11-libs/libXi

    - libXxf86vm:

    - libxcb:
        vars:
          iuse: +xkb
          python_compat: python3+
          extra_envs:
            - 'PYTHON_REQ_USE=xml'
          inherit:
            - autotools
            - flag-o-matic
            - python-any-r1
          rdepend: |
            x11-libs/libXau
            x11-libs/libXdmcp
          depend_extra: |
            >=x11-base/xcb-proto-${PV}
          bdepend: |
            virtual/pkgconfig
            ${PYTHON_DEPS}
          body_extra: |
            pkg_setup() {
              python-any-r1_pkg_setup
            }
          econf_args_extra: |
            $(use_enable xkb)
            --enable-xinput

    - libX11:
        vars:
          iuse: ipv6
          inherit:
            - autotools
            - flag-o-matic
            - toolchain-funcs
          rdepend: |
            x11-libs/libxcb
            x11-misc/compose-tables
          depend_extra: |
            x11-libs/xtrans
          econf_args_extra: |
            $(use_enable ipv6)
            --without-fop
            --with-keysymdefdir="${ESYSROOT}/usr/include/X11"
          src_install_extra: |
            rm -rf "${ED}"/usr/share/X11/locale

    - xtrans:
        vars:
          rdepend:
          econf_args_extra: |
            --without-fop


x11_libs_meson_dirlisting:
  generator: builtin-dirlisting
  template:
    engine: helm

  defaults:
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple.tmpl
    category: x11-libs
    dir:
      url: 'https://www.x.org/releases/individual/{{ .Values.xorg_path }}'
      exclude: ".99"
      matcher: "{{ .Values.pn }}-.*.tar.xz$"
    transform:
      - kind: string
        match: '{{ .Values.pn }}-'
        replace: ''
      - kind: string
        match: '.tar.xz'
        replace: ''
    vars:
      license: MIT
      xorg_path: lib/
      inherit:
        - meson
        - flag-o-matic
      homepage: 'https://gitlab.freedesktop.org/xorg/lib/{{ .Values.pn }}'
      desc: 'X.Org {{ .Values.pn | replace "lib" "" }} library'
      rdepend: |
        x11-libs/libX11
        x11-libs/libXext
        {{ .Values.rdepend_extra | default "" }}
      depend: |
        ${RDEPEND}
        sys-devel/autoconf
        sys-devel/automake
        sys-devel/libtool
        sys-devel/m4
        x11-misc/util-macros
        media-fonts/font-util
        x11-base/xorg-proto
        {{ .Values.depend_extra | default "" }}
      bdepend: |
        virtual/pkgconfig
      body: |
        src_configure() {
          local emesonargs=(
            -Ddefault_library=shared
            {{ .Values.emeson_args_extra | default "" }}
          )
          meson_src_configure
        }

  packages:
    - libXpresent:
        vars:
          rdepend_extra: |
            x11-libs/libXfixes
            x11-libs/libXrandr

    - libXres:
    - libXvMC:

    - libxcvt:
        vars:
          license: BSD
          desc: X.Org xcvt library and cvt program
          rdepend:
          depend: |
            sys-devel/autoconf
            sys-devel/automake
            sys-devel/libtool
            sys-devel/m4
            x11-misc/util-macros

    - pixman:
        vars:
          rdepend:
          depend: |
            sys-devel/autoconf
            sys-devel/automake
            sys-devel/libtool
            sys-devel/m4
          desc: Low-level pixel manipulation routines
          homepage: http://www.pixman.org/ https://gitlab.freedesktop.org/pixman/pixman/
          iuse: |
            cpu_flags_x86_mmxext cpu_flags_x86_sse2 cpu_flags_x86_ssse3 cpu_flags_ppc_altivec cpu_flags_arm_neon cpu_flags_arm_iwmmxt loongson2f cpu_flags_arm64_neon
          emeson_args_extra: |
            $(meson_feature cpu_flags_x86_mmxext mmx)
            $(meson_feature cpu_flags_x86_sse2 sse2)
            $(meson_feature cpu_flags_x86_ssse3 ssse3)
            $(meson_feature cpu_flags_ppc_altivec vmx)
            $(meson_feature cpu_flags_arm_neon neon)
            $(meson_feature cpu_flags_arm64_neon a64-neon)
            $(meson_feature loongson2f loongson-mmi)
            -Ddemos=disabled
            -Dgtk=disabled
            -Dlibpng=disabled


# Special package that use libX11 tarball
