sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-testing"

- name: "dev-kit"
  url: "https://github.com/macaroni-os/dev-kit"
  branch: "mark-testing"

- name: "gnome-kit"
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: "mark-testing"

- name: "desktop-kit"
  url: "https://github.com/macaroni-os/desktop-kit"
  branch: "mark-testing"

- name: "core-gl-kit"
  url: "https://github.com/macaroni-os/core-gl-kit"
  branch: "mark-testing"

- name: "media-kit"
  url: "https://github.com/macaroni-os/media-kit"
  branch: "mark-testing"

- name: "geaaru-kit"
  url: "https://github.com/geaaru/geaaru_overlay"
  branch: "funtoo"

target:
  name: xorg-kit
  url: "https://github.com/macaroni-os/xorg-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: dev-libs/glib:2
    - pkg: dev-libs/gobject-introspection
    - pkg: dev-libs/gobject-introspection-common
    - pkg: dev-libs/libwacom

    - pkg: dev-util/gdbus-codegen
    - pkg: dev-util/glib-utils
    - pkg: dev-util/desktop-file-utils

    - pkg: x11-apps/mesa-progs

    - pkg: x11-libs/cairo
    - pkg: x11-libs/pango

    - pkg: x11-libs/libcryptui
    - pkg: x11-libs/libfakekey
    - pkg: x11-libs/libfm-qt
    - pkg: x11-libs/libnotify
    - pkg: x11-libs/libva
    - pkg: x11-libs/libva-intel-driver
    - pkg: x11-libs/libva-vdpau-driver
    - pkg: x11-libs/libvdpau
    - pkg: x11-libs/libwnck
    - pkg: x11-libs/libxkbfile
    - pkg: x11-libs/libxklavier
    - pkg: x11-libs/mx
    - pkg: x11-libs/startup-notification
    - pkg: x11-libs/xapps

    - pkg: x11-misc/imake
    - pkg: x11-misc/xdg-utils
    - pkg: x11-misc/xorg-cf-files
    - pkg: x11-misc/shared-mime-info
    - pkg: x11-misc/makedepend
    - pkg: x11-misc/gccmakedep
    - pkg: x11-misc/util-macros
    - pkg: x11-misc/xbitmaps
    - pkg: x11-misc/xkeyboard-config

    - pkg: x11-themes/sound-theme-freedesktop
    - pkg: x11-themes/xcursor-themes

    - pkg: media-libs/freetype:2
    - pkg: media-libs/libjpeg-turbo
    - pkg: media-libs/libpng
    - pkg: media-libs/t1lib

    - pkg: sys-libs/libgbinder
    - pkg: sys-libs/libglibutil
    - pkg: sys-libs/mtdev

    - pkg: virtual/jpeg
    - pkg: virtual/jpeg-compat
    - pkg: virtual/glu
    - pkg: virtual/opengl
    - pkg: virtual/freedesktop-icon-theme
