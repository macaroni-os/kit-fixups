sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-testing"

- name: "dev-kit"
  url: "https://github.com/macaroni-os/dev-kit"
  branch: "mark-testing"

- name: "gnome-kit"
  url: "https://github.com/macaroni-os/gnome-kit"
  branch: "mark-testing"

- name: "desktop-kit"
  url: "https://github.com/macaroni-os/desktop-kit"
  branch: "mark-testing"

- name: "core-gl-kit"
  url: "https://github.com/macaroni-os/core-gl-kit"
  branch: "mark-testing"

- name: "media-kit"
  url: "https://github.com/macaroni-os/media-kit"
  branch: "mark-testing"

- name: "geaaru-kit"
  url: "https://github.com/geaaru/geaaru_overlay"
  branch: "funtoo"

target:
  name: xorg-kit
  url: "https://github.com/macaroni-os/xorg-kit"
  branch: mark-unstable

  fixups:
    include:
      - file: ../../LICENSE
        to: LICENSE

      - file: ../../.github/FUNDING.yml
        to: .github/FUNDING.yml

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: dev-libs/glib:2
    - pkg: dev-libs/gobject-introspection
    - pkg: dev-libs/gobject-introspection-common
    - pkg: dev-libs/libwacom

    - pkg: dev-libs/libinput
    - pkg: dev-libs/wayland
    - pkg: dev-libs/wayland-protocols
    - pkg: dev-util/wayland-scanner
    - pkg: dev-util/gdbus-codegen
    - pkg: dev-util/glib-utils
    - pkg: dev-util/desktop-file-utils

    - pkg: x11-apps/mesa-progs

    - pkg: x11-libs/cairo
    - pkg: x11-libs/libpciaccess
    - pkg: x11-libs/libxkbcommon
    - pkg: x11-libs/libxshmfence
    - pkg: x11-libs/pango

    - pkg: x11-libs/libcryptui
    - pkg: x11-libs/libfakekey
    - pkg: x11-libs/libfm-qt
    - pkg: x11-libs/libnotify
    - pkg: x11-libs/libva
    - pkg: x11-libs/libva-intel-driver
    - pkg: x11-libs/libva-vdpau-driver
    - pkg: x11-libs/libvdpau
    - pkg: x11-libs/libwnck
    - pkg: x11-libs/libxkbfile
    - pkg: x11-libs/libxklavier
    - pkg: x11-libs/mx
    - pkg: x11-libs/startup-notification
    - pkg: x11-libs/xapps
    - pkg: x11-libs/xcb-util
    - pkg: x11-libs/xcb-util-cursor
    - pkg: x11-libs/xcb-util-image
    - pkg: x11-libs/xcb-util-keysyms
    - pkg: x11-libs/xcb-util-renderutil
    - pkg: x11-libs/xcb-util-wm
    - pkg: x11-libs/xcb-util-xrm

    - pkg: x11-misc/imake
    - pkg: x11-misc/xdg-utils
    - pkg: x11-misc/xorg-cf-files
    - pkg: x11-misc/shared-mime-info
    - pkg: x11-misc/makedepend
    - pkg: x11-misc/gccmakedep
    - pkg: x11-misc/util-macros
    - pkg: x11-misc/xbitmaps
    - pkg: x11-misc/xkeyboard-config

    - pkg: x11-proto/applewmproto
    - pkg: x11-proto/bigreqsproto
    - pkg: x11-proto/compositeproto
    - pkg: x11-proto/damageproto
    - pkg: x11-proto/dmxproto
    - pkg: x11-proto/dpmsproto
    - pkg: x11-proto/dri2proto
    - pkg: x11-proto/dri3proto
      conditions:
        - '<x11-proto/dri3proto-1.4'
    - pkg: x11-proto/dri3proto
      conditions:
        - '>=x11-proto/dri3proto-1.4'
    - pkg: x11-proto/evieproto
    - pkg: x11-proto/fixesproto
    - pkg: x11-proto/fontcacheproto
    - pkg: x11-proto/fontsproto
    - pkg: x11-proto/glproto
    - pkg: x11-proto/inputproto
    - pkg: x11-proto/kbproto
    - pkg: x11-proto/lg3dproto
    - pkg: x11-proto/presentproto
      conditions:
        - '<x11-proto/presentproto-1.4'
    - pkg: x11-proto/presentproto
      conditions:
        - '>=x11-proto/presentproto-1.4'
    - pkg: x11-proto/printproto
    - pkg: x11-proto/randrproto
    - pkg: x11-proto/recordproto
    - pkg: x11-proto/renderproto
    - pkg: x11-proto/resourceproto
    - pkg: x11-proto/scrnsaverproto
    - pkg: x11-proto/trapproto
    - pkg: x11-proto/videoproto
    - pkg: x11-proto/windowswmproto
    - pkg: x11-proto/xcalibrateproto
    - pkg: x11-proto/xcmiscproto
    - pkg: x11-proto/xextproto
    - pkg: x11-proto/xf86bigfontproto
    - pkg: x11-proto/xf86dgaproto
    - pkg: x11-proto/xf86driproto
    - pkg: x11-proto/xf86miscproto
    - pkg: x11-proto/xf86rushproto
    - pkg: x11-proto/xf86vidmodeproto
    - pkg: x11-proto/xineramaproto
    - pkg: x11-proto/xproxymngproto
    - pkg: x11-proto/xproto
    - pkg: x11-proto/xwaylandproto

    - pkg: x11-themes/sound-theme-freedesktop
    - pkg: x11-themes/xcursor-themes

    - pkg: media-libs/freetype:2
    - pkg: media-libs/libjpeg-turbo
    - pkg: media-libs/libpng
    - pkg: media-libs/t1lib

    - pkg: sys-libs/libgbinder
    - pkg: sys-libs/libglibutil
    - pkg: sys-libs/mtdev

    - pkg: virtual/jpeg
    - pkg: virtual/jpeg-compat
    - pkg: virtual/glu
    - pkg: virtual/opengl
    - pkg: virtual/freedesktop-icon-theme
