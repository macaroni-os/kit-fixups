    - pkg: x11-proto/printproto
    - pkg: x11-proto/randrproto
    - pkg: x11-proto/recordproto
    - pkg: x11-proto/renderproto
    - pkg: x11-proto/resourceproto
    - pkg: x11-proto/scrnsaverproto
    - pkg: x11-proto/trapproto
    - pkg: x11-proto/videoproto
    - pkg: x11-proto/windowswmproto
    - pkg: x11-proto/xcalibrateproto
    - pkg: x11-proto/xcmiscproto
