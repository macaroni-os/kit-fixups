sources:
# We need this to inherit the eclass used for kit cache JSON generation
- name: "core-kit"
  url: "https://github.com/macaroni-os/core-kit"
  branch: "mark-unstable"

target:
  name: xorg-kit
  url: "https://github.com/macaroni-os/xorg-kit"
  branch: mark-unstable

  atoms_defaults:
    max_versions: 3

  atoms:

    - pkg: x11-base/xcb-proto
    - pkg: x11-base/xorg-drivers
    - pkg: x11-base/xorg-server
    - pkg: x11-base/xorg-proto
    - pkg: x11-base/xwayland

    - pkg: x11-libs/libdmx
    - pkg: x11-libs/libfontenc
    - pkg: x11-libs/libICE
    - pkg: x11-libs/libSM
    - pkg: x11-libs/libxcb
    - pkg: x11-libs/libxcvt
    - pkg: x11-libs/libXdamage
    - pkg: x11-libs/libXdmcp
    - pkg: x11-libs/libXext
    - pkg: x11-libs/libXfixes
    - pkg: x11-libs/libXft
    - pkg: x11-libs/libXScrnSaver
    - pkg: x11-libs/libXaw
    - pkg: x11-libs/libXau
    - pkg: x11-libs/libXcomposite
    - pkg: x11-libs/libXcursor
    - pkg: x11-libs/libXfont2
    - pkg: x11-libs/libXi
    - pkg: x11-libs/libXinerama
    - pkg: x11-libs/libXmu
    - pkg: x11-libs/libXpm
    - pkg: x11-libs/libXpresent
    - pkg: x11-libs/libXrandr
    - pkg: x11-libs/libXrender
    - pkg: x11-libs/libXres
    - pkg: x11-libs/libXt
    - pkg: x11-libs/libXtst
    - pkg: x11-libs/libXv
    - pkg: x11-libs/libXvMC
    - pkg: x11-libs/libXxf86dga
    - pkg: x11-libs/libXxf86vm
    - pkg: x11-libs/libX11
    - pkg: x11-libs/xtrans
